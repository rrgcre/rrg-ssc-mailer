<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRG — Questionnaire Log</title>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--ink:#1a2236;--muted:#6b7488;--line:#e6e9f0;--wash:#f5f7fb;--green:#1f8a5b;--amber:#b9761a;--blue:#2647b0;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#eef1f6;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.top{color:#fff;padding:30px 0 34px;position:relative;overflow:hidden;
  background:radial-gradient(95% 130% at 28% 15%, #1c2e5c 0%, #112044 42%, #0b1636 70%, #071029 100%);}
.top-inner{max-width:1080px;margin:0 auto;padding:0 24px;position:relative;}
.top .brand{display:inline-flex;align-items:center;position:relative;z-index:2;}
.top .disc{background:var(--red);color:#fff;border-radius:50%;width:42px;height:42px;font-family:'Arial Black',Arial,sans-serif;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;letter-spacing:-.04em;}
.top .bar{background:#fff;width:3px;height:30px;margin:0 12px;} .top .wm{font-weight:800;font-size:14px;text-transform:uppercase;line-height:.95;}
.kicker{position:relative;z-index:2;margin:22px 0 4px;color:var(--red);font-weight:700;letter-spacing:.3em;font-size:11px;text-transform:uppercase;}
h1{position:relative;z-index:2;font-size:30px;font-weight:800;margin:0;color:#fff;letter-spacing:-.01em;}
.sub{position:relative;z-index:2;color:#aeb8cf;font-size:13px;margin-top:7px;max-width:560px;line-height:1.5;}
.newbtn{position:absolute;top:0;right:24px;z-index:3;display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;text-decoration:none;font-weight:700;font-size:13.5px;padding:11px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(218,43,31,.3);}
.newbtn:hover{background:#c0241a;}
.wrap{max-width:1080px;margin:26px auto;padding:0 24px 60px;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 6px 24px rgba(10,20,50,.06);}
.hd{display:flex;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap;}
.tabs{display:inline-flex;background:var(--wash);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;}
.tab{border:none;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;font-weight:700;padding:6px 14px;border-radius:7px;cursor:pointer;}
.tab.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(10,20,50,.1);}
.ufilter{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:12.5px;color:var(--navy);font-weight:600;background:#fff;}
.ufilter:focus{outline:none;border-color:var(--red);}
.hd2{padding:12px 22px;gap:10px;}
.search{flex:1;min-width:200px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;font-size:12.5px;color:var(--navy);}
.search:focus{outline:none;border-color:var(--red);}
.lbl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
.cnt{margin-left:auto;color:var(--muted);font-size:12.5px;}
.home{text-decoration:none;color:var(--navy);font-weight:600;font-size:12.5px;border:1px solid var(--line);padding:7px 13px;border-radius:8px;}
.home:hover{border-color:#9fb0cc;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle;}
th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--wash);}
tr:hover td{background:#fbfcfe;}
.biz{font-weight:800;color:var(--navy);font-size:14px;} .meta{color:var(--muted);font-size:11.5px;margin-top:2px;}
.badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:4px 9px;border-radius:100px;white-space:nowrap;}
.b-waiting{background:#fdf2e3;color:var(--amber);} .b-advanced{background:#e7f6ee;color:var(--green);} .b-passed{background:#eef0f4;color:#6b7488;}
tr.selrow td{background:#fff6e9;} tr.selrow td:first-child{box-shadow:inset 3px 0 0 var(--red);}
.done{display:inline-block;font-size:11px;color:var(--green);font-weight:700;}
.act{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;}
.act a,.act button{font:inherit;font-size:12px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--navy);white-space:nowrap;}
.act a:hover,.act button:hover{border-color:#9fb0cc;}
.act .adv{background:var(--navy);color:#fff;border-color:var(--navy);}
.act .complete{background:#b9761a;border-color:#b9761a;color:#fff;display:inline-flex;align-items:center;gap:7px;}
.act .complete:hover{background:#9c6416;border-color:#9c6416;}
.act .complete .pring{display:block;flex:0 0 auto;}
.act .pass{color:var(--muted);}
.act .del{color:var(--red);border-color:#f0c9c6;}
.passed{color:var(--muted);font-weight:700;font-size:12.5px;}
.done{margin-right:2px;}
.empty{text-align:center;color:var(--muted);padding:54px 20px;}
.empty b{color:var(--navy);display:block;font-size:15px;margin-bottom:6px;}
.empty .np{margin-top:16px;display:inline-block;background:var(--red);color:#fff;text-decoration:none;font-weight:700;padding:10px 18px;border-radius:10px;}
.foot{max-width:1080px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:11.5px;}
.tool{border:1px solid var(--line);background:#fff;color:var(--navy);font:inherit;font-size:12px;font-weight:700;padding:8px 12px;border-radius:8px;cursor:pointer;}
.tool:hover{border-color:#9fb0cc;}
#printhead{display:none;}
@media(max-width:720px){ th.hide,td.hide{display:none;} .top{padding:24px 0;} h1{font-size:24px;} .newbtn{position:static;margin-top:16px;} }
@media print{
  body{background:#fff;}
  .top,.hd,.hd2,.foot,.rrg-back,.newbtn{display:none!important;}
  .wrap{margin:0;padding:0;max-width:none;}
  .card{border:none;box-shadow:none;border-radius:0;}
  #printhead{display:block!important;padding:0 0 12px;}
  #printhead .ph-title{font-size:20px;font-weight:800;color:#000E31;}
  #printhead .ph-sub{font-size:12px;color:#555;margin-top:3px;}
  th:last-child,td:last-child{display:none;}   /* hide Actions column */
  th.hide,td.hide{display:table-cell!important;}
  tr{break-inside:avoid;}
}
</style>
</head>
<body>
<div class="top"><div class="top-inner">
  <span class="brand"><span class="disc">RRG</span><span class="bar"></span><span class="wm">Restaurant<br>Realty<br>Group</span></span>
  <div class="kicker">Seller Pipeline · Step 2</div>
  <h1>Questionnaire Log</h1>
  <div class="sub">Questionnaires arrive here when a qualified call is advanced. Complete one, then build the BOV from it.</div>
</div></div>

<div class="wrap">
  <div class="card">
    <div class="hd">
      <div class="tabs">
        <button class="tab" id="v_all" onclick="setView('all')">All</button>
        <button class="tab on" id="v_waiting" onclick="setView('waiting')">Waiting</button>
        <button class="tab" id="v_advanced" onclick="setView('advanced')">Advanced</button>
        <button class="tab" id="v_passed" onclick="setView('passed')">Rejected</button>
      </div>
      <select id="userFilter" class="ufilter" style="display:none" onchange="paint()"></select>
      <span class="cnt" id="cnt"></span><a class="home" href="./index.html">← Dashboard</a>
    </div>
    <div class="hd hd2">
      <input id="q" class="search" placeholder="Search business or market…" oninput="paint()">
      <span class="lbl">Sort</span>
      <select id="sortBy" class="ufilter" onchange="paint()">
        <option value="new">Newest first</option>
        <option value="old">Oldest first</option>
        <option value="biz">Business A–Z</option>
        <option value="status">Status</option>
      </select>
      <button class="tool" onclick="printLog()">🖨 Print</button>
      <button class="tool" onclick="exportCsv()">↓ Export CSV</button>
    </div>
    <div id="printhead"></div>
    <div id="body"></div>
  </div>
</div>
<div class="foot">Proprietary &amp; Confidential · Property of Restaurant Realty Group, LLC · Internal RRG use only.</div>

<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function fmt(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d.getTime())) return ''; return (d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(2); }
var ALL=[], ME={username:'',name:'',role:''}, VIEW='waiting', CURRENT=[];
var VIEWS=['all','waiting','advanced','passed'];
function setView(v){ VIEW=v; VIEWS.forEach(function(x){ document.getElementById('v_'+x).classList.toggle('on',x===v); }); paint(); }
function stateOf(s){ return s.processed?'Advanced':(s.decision==='passed'?'Rejected':'Waiting'); }
function buildUserFilter(){
  if(ME.role!=='admin') return;
  var uf=document.getElementById('userFilter'); if(!uf) return;
  var seen={}, opts=[];
  ALL.forEach(function(s){ var k=s.byUser||s.by; if(k&&!seen[k]){ seen[k]=1; opts.push({key:k,label:s.by||s.byUser}); } });
  opts.sort(function(a,b){ return String(a.label).localeCompare(String(b.label)); });
  uf.innerHTML='<option value="">Filter: everyone</option>'+opts.map(function(o){ return '<option value="'+esc(o.key)+'">'+esc(o.label)+'</option>'; }).join('');
  uf.style.display='';
}
function paint(){
  var list=ALL.slice();
  var uf=document.getElementById('userFilter'); var val=(ME.role==='admin'&&uf)?uf.value:'';
  if(val) list=list.filter(function(s){ return (s.byUser||s.by)===val; });
  if(VIEW==='waiting') list=list.filter(function(s){ return !s.processed && s.decision!=='passed'; });
  else if(VIEW==='advanced') list=list.filter(function(s){ return s.processed; });
  else if(VIEW==='passed') list=list.filter(function(s){ return s.decision==='passed'; });
  var q=(((document.getElementById('q')||{}).value)||'').trim().toLowerCase();
  if(q) list=list.filter(function(s){ return ((s.business||'')+' '+(s.contact||'')+' '+(s.market||'')).toLowerCase().indexOf(q)>=0; });
  var sb=((document.getElementById('sortBy')||{}).value)||'new';
  list.sort(function(a,b){
    if(sb==='biz') return String(a.business||'').localeCompare(String(b.business||''));
    if(sb==='status'){ var ord={Waiting:0,Advanced:1,Rejected:2}; return (ord[stateOf(a)]||0)-(ord[stateOf(b)]||0); }
    var ta=new Date(a.createdAt||0).getTime(), tb=new Date(b.createdAt||0).getTime();
    return sb==='old' ? ta-tb : tb-ta;
  });
  CURRENT=list;
  render(list);
}
function printLog(){
  var label={all:'All questionnaires',waiting:'Waiting to build a BOV',advanced:'BOV started',passed:'Rejected'}[VIEW]||'All questionnaires';
  var when=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  document.getElementById('printhead').innerHTML='<div class="ph-title">RRG Questionnaire Log</div><div class="ph-sub">'+esc(label)+' · '+CURRENT.length+' questionnaire'+(CURRENT.length===1?'':'s')+' · '+when+'</div>';
  window.print();
}
function csvCell(v){ v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function exportCsv(){
  var head=['Business','Metro','State','Rep','Created'];
  var lines=[head.join(',')];
  CURRENT.forEach(function(s){ lines.push([s.business,s.market,stateOf(s),s.by,fmt(s.createdAt)].map(csvCell).join(',')); });
  var blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='rrg-questionnaire-log.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
// Small progress ring showing % of required fields complete (white on the gold button).
function pctRing(p){ p=Math.max(0,Math.min(100,Math.round(p||0))); var r=7, c=2*Math.PI*r, off=c*(1-p/100);
  return '<svg class="pring" viewBox="0 0 18 18" width="15" height="15" aria-hidden="true">'
    +'<circle cx="9" cy="9" r="'+r+'" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2.6"/>'
    +'<circle cx="9" cy="9" r="'+r+'" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 9 9)"/></svg>';
}
function badge(s){
  var st=stateOf(s);
  var cls={Waiting:'b-waiting',Advanced:'b-advanced',Rejected:'b-passed'}[st]||'b-waiting';
  return '<span class="badge '+cls+'">'+st+'</span>';
}
function render(list){
  var body=document.getElementById('body'), cnt=document.getElementById('cnt');
  cnt.textContent = list.length ? (list.length+' questionnaire'+(list.length===1?'':'s')) : '';
  if(!list.length){
    var em={
      all:['No questionnaires yet.','They arrive here when you advance a qualified call from the Seller Qualification Call log.'],
      waiting:['Nothing waiting.','Advance a qualified call and it lands here to complete.'],
      advanced:['No BOVs started yet.','Questionnaires you build a BOV from show up here.'],
      passed:['No rejected questionnaires.','Ones you reject show up here — you can always Reconsider them.']
    }[VIEW]||['Nothing here.',''];
    body.innerHTML='<div class="empty"><b>'+em[0]+'</b>'+em[1]+'<br><a class="np" href="./rrg_screening_queue.html">Open the Call Log →</a></div>';
    return;
  }
  var rows=list.map(function(s){
    var meta=[s.market, s.by].filter(Boolean).map(esc).join(' · ');
    var bov='./rrg_bov_builder.html?q='+encodeURIComponent(s.id);
    var mid;
    if(s.processed){
      mid='<span class="done">✓ BOV started</span> <a href="'+bov+'">Reopen</a>';
    } else if(s.decision==='passed'){
      mid='<span class="passed">✕ Rejected</span> <button onclick="decide(\''+s.id+'\',\'\')">Reconsider</button>';
    } else {
      var _pct=(typeof s.completePct==='number')?s.completePct:0;
      var act = s.completed
        ? '<a class="adv" href="'+bov+'" onclick="markAdvanced(\''+s.id+'\')">Build BOV →</a>'
        : '<a class="adv complete" href="./valuation_questionnaire.html?q='+encodeURIComponent(s.id)+'" title="'+_pct+'% of required fields done">'+pctRing(_pct)+'Complete Questionnaire · '+_pct+'%</a>';
      mid=act + '<button class="pass" onclick="decide(\''+s.id+'\',\'passed\')">Reject</button>';
    }
    return '<tr data-id="'+esc(s.id)+'">'+
      '<td><div class="biz">'+esc(s.business||'Business')+'</div><div class="meta">'+meta+'</div></td>'+
      '<td class="meta">'+esc(fmt(s.createdAt))+'</td>'+
      '<td>'+badge(s)+'</td>'+
      '<td><div class="act">'+
        '<a href="./valuation_questionnaire.html?q='+encodeURIComponent(s.id)+'">Edit</a>'+
        mid+
        '<button class="del" onclick="del(\''+s.id+'\',this)">Remove</button>'+
      '</div></td>'+
    '</tr>';
  }).join('');
  body.innerHTML='<table><thead><tr><th>Business</th><th>Advanced</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead><tbody>'+rows+'</tbody></table>';
}
function del(id,btn){
  if(!confirm('Remove this questionnaire from the log?')) return;
  fetch('/api/questionnaire/'+encodeURIComponent(id),{method:'DELETE'}).then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ load(); } else alert('Could not remove.'); }).catch(function(){ alert('Could not remove.'); });
}
function decide(id,decision){
  if(decision==='passed' && !confirm('Reject this questionnaire? It won’t move to a BOV.')) return;
  fetch('/api/questionnaire/'+encodeURIComponent(id)+'/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:decision})})
    .then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ load(); } else alert('Could not update.'); }).catch(function(){ alert('Could not update.'); });
}
// Building a BOV marks the questionnaire advanced (fire-and-forget; navigation continues).
function markAdvanced(id){ try{ fetch('/api/questionnaire/'+encodeURIComponent(id)+'/advance',{method:'POST'}).catch(function(){}); }catch(e){} }
function load(){
  Promise.all([
    fetch('/api/session').then(function(r){return r.json();}).catch(function(){return null;}),
    fetch('/api/questionnaires').then(function(r){return r.json();}).catch(function(){return null;})
  ]).then(function(res){
    var s=res[0], j=res[1];
    if(s&&s.ok){ ME={username:s.username||'',name:s.name||'',role:s.role||''}; }
    if(!j){ document.getElementById('body').innerHTML='<div class="empty"><b>Couldn’t reach the server.</b>The Questionnaire Log works on the hosted toolkit.</div>'; return; }
    ALL=(j&&j.questionnaires)||[];
    buildUserFilter(); paint();
  });
}
// click a row to highlight it (ignore clicks on the action buttons/links)
document.getElementById('body').addEventListener('click',function(e){
  if(e.target.closest('a,button,select,input')) return;
  var tr=e.target.closest('tr'); if(!tr || !tr.getAttribute('data-id')) return;
  var was=tr.classList.contains('selrow');
  [].slice.call(this.querySelectorAll('tr.selrow')).forEach(function(x){ x.classList.remove('selrow'); });
  if(!was) tr.classList.add('selrow');
});
load();
</script>
</body>
</html>
