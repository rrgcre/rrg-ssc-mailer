<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullServe — Shopping Centers</title>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--ink:#14213d;--muted:#6b7488;--line:#e6e9f0;--wash:#f5f7fb;--inp:#cfd6e2;--green:#1f8a5b;--amber:#b5791f;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#eef1f7;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.top{background:radial-gradient(90% 130% at 25% 10%,#22346a,#152752 42%,#0b1636 72%,#060f26 100%);color:#fff;padding:24px 0 22px;}
.top-in{max-width:none;margin:0 auto;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8fa2c4;font-weight:700;margin-bottom:4px;}
h1{margin:0;font-size:25px;font-weight:700;} .sub{color:#aeb8cf;font-size:13px;margin-top:6px;max-width:640px;line-height:1.5;}
.btn{border:1px solid var(--inp);background:#fff;color:var(--navy);font-weight:700;font-size:13px;padding:9px 14px;border-radius:9px;cursor:pointer;}
.btn:hover{border-color:#9fb0cc;} .btn.pri{background:var(--red);color:#fff;border-color:var(--red);}
.wrap{max-width:none;margin:20px 0;padding:0 28px 90px;}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.search{flex:1;min-width:200px;border:1px solid var(--inp);border-radius:9px;padding:9px 12px;font:inherit;font-size:13px;}
.msg{font-size:12px;color:var(--muted);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;}
.cc{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(16,32,70,.05);display:flex;flex-direction:column;}
.cc .ph{height:128px;background:var(--wash) center/cover no-repeat;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#b7c0d4;font-size:30px;}
.cc .bd{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:6px;}
.cc .nm{font-weight:700;font-size:15px;color:var(--navy);line-height:1.25;}
.cc .addr{font-size:12px;color:var(--muted);line-height:1.45;}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef2fa;color:#3a4b74;white-space:nowrap;}
.spb{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;background:var(--navy);border-radius:999px;padding:3px 9px;white-space:nowrap;}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink);margin-top:2px;}
.stats b{color:var(--navy);}
.spaces{padding:2px 16px 12px;font-size:12px;color:var(--muted);}
.spaces .sp{padding:5px 0;border-top:1px dashed var(--line);}
.ccf{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);}
.lnk{font-size:12px;color:#2647b0;background:none;border:none;cursor:pointer;font-weight:700;padding:0;}
.ov{position:fixed;inset:0;background:rgba(8,14,32,.5);display:flex;align-items:flex-start;justify-content:center;padding:34px 16px;z-index:200;overflow:auto;}
.ov[hidden]{display:none;}
.mod{background:#fff;border-radius:15px;max-width:640px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.4);}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line);font-weight:700;color:var(--navy);font-size:16px;}
.mb{padding:16px 20px;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
.f{display:flex;flex-direction:column;gap:4px;} .f.full{grid-column:1/-1;}
.f label{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.f input,.f select,.f textarea{border:1px solid var(--inp);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;background:#fff;}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--red);}
.f textarea{min-height:60px;resize:vertical;}
.mf{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);}
.mf .msg{margin-right:auto;}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:13.5px;}
.phrow{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.phrow .thumb{width:88px;height:60px;border-radius:8px;background:var(--wash) center/cover no-repeat;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#b7c0d4;font-size:22px;flex:0 0 auto;}
.rrg-back{position:fixed;left:16px;bottom:16px;z-index:99999;display:inline-flex;align-items:center;gap:7px;background:rgba(0,14,49,.85);color:#fff;text-decoration:none;font:700 12.5px/1 -apple-system,Arial,sans-serif;padding:10px 15px;border-radius:100px;border:1px solid rgba(255,255,255,.22);}
body.rrg-shelled .rrg-back{display:none;}
/* --- netsuite list --- */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 6px 24px rgba(10,20,50,.06);}
.hd{display:flex;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap;}
.hd b{color:var(--navy);font-size:14px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle;}
th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--wash);white-space:nowrap;}
tr:hover td{background:#fbfcfe;}
.cwho{display:flex;align-items:center;gap:10px;}
.cthumb{width:38px;height:38px;border-radius:8px;background:var(--wash) center/cover no-repeat;border:1px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#b7c0d4;font-size:15px;}
.cnm{font-weight:600;color:var(--navy);font-size:13.5px;}
.cmeta{color:var(--muted);font-size:11.5px;margin-top:2px;}
.splist{display:flex;flex-direction:column;gap:1px;}
.spline{font-size:11.5px;color:#3a4560;}
.spmore{font-size:11px;color:var(--muted);margin-top:1px;}
.ctrash{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;background:#fff;color:var(--red);border:1px solid #f0c9c6;border-radius:8px;cursor:pointer;vertical-align:middle;}
.ctrash:hover{background:var(--red);color:#fff;border-color:var(--red);}
.brand{display:inline-flex;align-items:center;cursor:pointer;}
.disc{background:var(--red);color:#fff;border-radius:50%;width:42px;height:42px;font-family:'Arial Black',Arial,sans-serif;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;letter-spacing:-.04em;}
.bar{background:#fff;width:3px;height:30px;margin:0 12px;}
.wm{font-weight:700;font-size:14px;text-transform:uppercase;line-height:.95;}
.searchwrap{margin-left:auto;position:relative;display:flex;align-items:center;}
.searchwrap .searchic{position:absolute;left:11px;color:#9aa3b2;pointer-events:none;}
.searchwrap input{border:1px solid var(--line);border-radius:9px;padding:8px 12px 8px 34px;font:inherit;font-size:13px;min-width:230px;}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<a href="./index.html" class="rrg-back"><span style="font-size:14px;line-height:1">←</span> Toolbox</a>
<div class="top"><div class="top-in">
  <div style="display:flex;align-items:center;gap:16px">
    <span class="brand" onclick="location.href='./index.html'"><span class="disc">RRG</span><span class="bar"></span><span class="wm">Restaurant<br>Realty<br>Group</span></span>
    <div><div class="kicker">Tenant Rep · Inventory</div><h1>Shopping Centers</h1><div class="sub">Your book of centers. One center holds many spaces — spaces link here from the Space Tracker.</div></div>
  </div>
</div></div>
<div class="wrap">
  <div class="card">
    <div class="hd"><b>Shopping Centers</b><span class="msg" id="count"></span><div class="searchwrap"><svg class="searchic" viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5"></circle><line x1="12.8" y1="12.8" x2="17.5" y2="17.5"></line></svg><input id="q" placeholder="Search name, market, anchor…" oninput="draw()" autocomplete="off"></div><button class="btn pri" onclick="openEdit()" style="margin-left:10px">＋ Add center</button></div>
    <div id="list"><div class="empty">Loading…</div></div>
  </div>
</div>

<div class="ov" id="ov" hidden>
  <div class="mod">
    <div class="mhd"><span id="modTitle">Add center</span><button class="btn" onclick="closeEdit()">✕</button></div>
    <div class="mb">
      <div class="phrow">
        <div class="thumb" id="phThumb">▤</div>
        <div><input type="file" id="phFile" accept=".png,.jpg,.jpeg,.gif,.webp" style="display:none"><button class="btn" type="button" onclick="document.getElementById('phFile').click()">Upload photo</button><div class="msg" id="phMsg" style="margin-top:5px"></div></div>
      </div>
      <div class="fg">
        <div class="f full"><label>Center name *</label><input id="c_name" placeholder="Bulverde Marketplace"></div>
        <div class="f full"><label>Address</label><input id="c_address" placeholder="1604 &amp; Bulverde Rd"></div>
        <div class="f"><label>City</label><input id="c_city" placeholder="San Antonio"></div>
        <div class="f"><label>Market</label><input id="c_market" placeholder="San Antonio"></div>
        <div class="f"><label>Center type</label><select id="c_type"></select></div>
        <div class="f"><label>Total GLA (SF)</label><input id="c_gla" inputmode="numeric" placeholder="128000"></div>
        <div class="f full"><label>Anchor(s)</label><input id="c_anchor" placeholder="H-E-B"></div>
        <div class="f full"><label>Notable co-tenants</label><input id="c_cot" placeholder="Starbucks, F45, Great Clips"></div>
        <div class="f"><label>Landlord / owner</label><input id="c_landlord" placeholder="RREAF Holdings"></div>
        <div class="f"><label>Traffic (VPD)</label><input id="c_vpd" inputmode="numeric" placeholder="41000"></div>
        <div class="f full"><label>Notes</label><textarea id="c_notes" placeholder="Co-tenancy, parking, demand drivers, availability…"></textarea></div>
      </div>
    </div>
    <div class="mf"><span class="msg" id="modMsg"></span><button class="btn" onclick="closeEdit()">Cancel</button><button class="btn pri" id="modSave" onclick="saveCenter()">Save center</button></div>
  </div>
</div>

<script src="/rrg_list.js"></script>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function fmtN(n){ return (n==null||n==='')?'':Number(n).toLocaleString('en-US'); }
var CENTERS=[], SPACES=[], TYPES=[], CANDEL=false, EDIT=null, PENDING_PHOTO=null;
var CTL=null;
var TRASH_SVG='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>';
function load(){
  Promise.all([
    fetch('/api/centers',{credentials:'same-origin',cache:'no-store'}).then(function(r){return r.json();}),
    fetch('/api/spaces',{credentials:'same-origin',cache:'no-store'}).then(function(r){return r.json();}).catch(function(){return {spaces:[]};})
  ]).then(function(res){
    var j=res[0]||{}; if(!j.ok){ document.getElementById('list').innerHTML='<div class="empty">Could not load centers.</div>'; return; }
    CENTERS=j.centers||[]; TYPES=j.types||[]; CANDEL=!!j.canDelete; SPACES=(res[1]&&res[1].spaces)||[];
    var sel=document.getElementById('c_type'); sel.innerHTML='<option value="">— type —</option>'+TYPES.map(function(t){return '<option>'+esc(t)+'</option>';}).join('');
    draw();
  }).catch(function(){ document.getElementById('list').innerHTML='<div class="empty">Could not load centers.</div>'; });
}
function spacesFor(id){ return SPACES.filter(function(s){return s.centerId===id;}); }
function draw(){
  if(!window.RRGList){ setTimeout(draw,80); return; }
  var q=(document.getElementById('q').value||'').toLowerCase().trim();
  var list=CENTERS.filter(function(c){ if(!q) return true; return [c.name,c.market,c.city,c.anchor,c.coTenants,c.address,c.landlord].filter(Boolean).join(' ').toLowerCase().indexOf(q)>=0; });
  document.getElementById('count').textContent=CENTERS.length?(list.length+' of '+CENTERS.length+' center'+(CENTERS.length===1?'':'s')):'';
  var cfg={ mount:'#list', data:list, key:'centers', empty:'<div class="empty">'+(CENTERS.length?'No centers match your search.':'No shopping centers yet — add your first one.')+'</div>', rowId:function(c){return c.id;}, defaultSort:0, defaultDir:1,
    columns:[
      { label:'Center', sort:function(a,b){return RRGList.cmp(a.name,b.name);}, cell:function(c){ var ph=c.hasPhoto?('<div class="cthumb" style="background-image:url(/api/center-photo/'+esc(c.id)+'?t='+encodeURIComponent(c.updatedAt||'')+')"></div>'):'<div class="cthumb">▤</div>'; var sub=[c.address,c.market||c.city].filter(Boolean).map(esc).join(' · '); return '<div class="cwho">'+ph+'<div><div class="cnm">'+esc(c.name||'Untitled')+'</div>'+(sub?('<div class="cmeta">'+sub+'</div>'):'')+'</div></div>'; } },
      { label:'Type', sort:function(a,b){return RRGList.cmp(a.centerType,b.centerType);}, cell:function(c){ return c.centerType?('<span class="chip">'+esc(c.centerType)+'</span>'):'<span class="cmeta">—</span>'; } },
      { label:'Anchor / co-tenants', sortable:false, cell:function(c){ if(!c.anchor&&!c.coTenants) return '<span class="cmeta">—</span>'; return (c.anchor?('<b style="color:var(--navy)">'+esc(c.anchor)+'</b>'):'')+(c.coTenants?('<div class="cmeta">'+esc(c.coTenants)+'</div>'):''); } },
      { label:'GLA', align:'right', sort:function(a,b){return (a.gla||0)-(b.gla||0);}, cell:function(c){ return c.gla?(esc(fmtN(c.gla))+' SF'):'<span class="cmeta">—</span>'; } },
      { label:'VPD', align:'right', sort:function(a,b){return (a.vpd||0)-(b.vpd||0);}, cell:function(c){ return c.vpd?esc(fmtN(c.vpd)):'<span class="cmeta">—</span>'; } },
      { label:'Spaces', sort:function(a,b){return spacesFor(a.id).length-spacesFor(b.id).length;}, cell:function(c){ var ls=spacesFor(c.id); if(!ls.length) return '<span class="cmeta">—</span>'; var head='<span class="spb">'+ls.length+' space'+(ls.length===1?'':'s')+'</span>'; var lines=ls.slice(0,4).map(function(sx){ return '<div class="spline">'+esc(sx.name||sx.address||'Space')+(sx.status?(' · '+esc(sx.status)):'')+'</div>'; }).join(''); var more=ls.length>4?('<div class="spmore">+'+(ls.length-4)+' more</div>'):''; return '<div class="splist">'+head+lines+more+'</div>'; } },
      { label:'Landlord', defaultHidden:true, sort:function(a,b){return RRGList.cmp(a.landlord,b.landlord);}, cell:function(c){ return c.landlord?esc(c.landlord):'<span class="cmeta">—</span>'; } },
      { label:'', align:'right', sortable:false, cell:function(c){ return '<span style="white-space:nowrap"><button class="btn c-edit" data-id="'+esc(c.id)+'" style="padding:5px 11px;font-size:12px">Edit</button>'+(CANDEL?('<button class="ctrash c-del" data-id="'+esc(c.id)+'" title="Delete center" style="margin-left:6px">'+TRASH_SVG+'</button>'):'')+'</span>'; } }
    ]
  };
  if(CTL) CTL.refresh(list); else CTL=RRGList.create(cfg);
}
document.addEventListener('click',function(e){ var ed=e.target.closest&&e.target.closest('.c-edit'); if(ed){ openEdit(ed.getAttribute('data-id')); return; } var dl=e.target.closest&&e.target.closest('.c-del'); if(dl){ delCenter(dl.getAttribute('data-id')); return; } });
function setv(id,v){ var el=document.getElementById(id); if(el) el.value=(v==null?'':v); }
function openEdit(id){
  EDIT=id?CENTERS.find(function(c){return c.id===id;}):null; PENDING_PHOTO=null;
  document.getElementById('modTitle').textContent=EDIT?'Edit center':'Add center';
  document.getElementById('modMsg').textContent=''; document.getElementById('phMsg').textContent='';
  setv('c_name',EDIT&&EDIT.name); setv('c_address',EDIT&&EDIT.address); setv('c_city',EDIT&&EDIT.city); setv('c_market',EDIT&&EDIT.market);
  document.getElementById('c_type').value=(EDIT&&EDIT.centerType)||'';
  setv('c_gla',EDIT&&EDIT.gla); setv('c_anchor',EDIT&&EDIT.anchor); setv('c_cot',EDIT&&EDIT.coTenants); setv('c_landlord',EDIT&&EDIT.landlord); setv('c_vpd',EDIT&&EDIT.vpd); setv('c_notes',EDIT&&EDIT.notes);
  var th=document.getElementById('phThumb');
  if(EDIT&&EDIT.hasPhoto){ th.style.backgroundImage='url(/api/center-photo/'+EDIT.id+'?t='+encodeURIComponent(EDIT.updatedAt||'')+')'; th.textContent=''; } else { th.style.backgroundImage=''; th.textContent='▤'; }
  document.getElementById('phFile').value='';
  document.getElementById('ov').hidden=false;
}
function closeEdit(){ document.getElementById('ov').hidden=true; }
document.getElementById('phFile').addEventListener('change',function(){ var f=this.files&&this.files[0]; if(!f) return; if(f.size>10*1024*1024){ document.getElementById('phMsg').textContent='Image over 10 MB.'; this.value=''; return; } var rd=new FileReader(); rd.onload=function(){ PENDING_PHOTO={filename:f.name,dataB64:String(rd.result||'').replace(/^data:[^,]*,/,'')}; var th=document.getElementById('phThumb'); th.style.backgroundImage='url('+rd.result+')'; th.textContent=''; document.getElementById('phMsg').textContent='Will upload on save.'; }; rd.readAsDataURL(f); });
function saveCenter(){
  var name=(document.getElementById('c_name').value||'').trim();
  if(!name){ document.getElementById('modMsg').textContent='Center name is required.'; return; }
  var body={ id:EDIT?EDIT.id:'', name:name, address:document.getElementById('c_address').value, city:document.getElementById('c_city').value, market:document.getElementById('c_market').value, centerType:document.getElementById('c_type').value, gla:document.getElementById('c_gla').value, anchor:document.getElementById('c_anchor').value, coTenants:document.getElementById('c_cot').value, landlord:document.getElementById('c_landlord').value, vpd:document.getElementById('c_vpd').value, notes:document.getElementById('c_notes').value };
  var btn=document.getElementById('modSave'); btn.disabled=true; document.getElementById('modMsg').textContent='Saving…';
  fetch('/api/center',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(j){
    if(!j||!j.ok){ btn.disabled=false; document.getElementById('modMsg').textContent=(j&&j.error)||'Could not save.'; return null; }
    if(PENDING_PHOTO){ return fetch('/api/center/'+j.center.id+'/photo',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(PENDING_PHOTO)}).then(function(r){return r.json();}); }
    return j;
  }).then(function(j){ if(j===null) return; btn.disabled=false; closeEdit(); if(window.rrgToast) rrgToast('Center saved'); load(); }).catch(function(){ btn.disabled=false; document.getElementById('modMsg').textContent='Network error.'; });
}
function delCenter(id){
  var c=CENTERS.find(function(x){return x.id===id;}); if(!c) return;
  var n=spacesFor(id).length;
  var msg='Delete '+(c.name||'this center')+'?'+(n?(' '+n+' linked space'+(n===1?'':'s')+' will be unlinked (the spaces stay).'):'');
  (window.rrgConfirm?rrgConfirm(msg,{danger:true}):Promise.resolve(confirm(msg))).then(function(ok){ if(!ok) return; fetch('/api/center/'+id,{method:'DELETE',credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ if(window.rrgToast) rrgToast('Center deleted'); load(); } else if(window.rrgToast) rrgToast((j&&j.error)||'Could not delete',{danger:true}); }); });
}
load();
</script>
</body>
</html>
