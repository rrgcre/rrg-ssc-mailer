<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullServe — Expenses</title>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--ink:#1a2236;--muted:#6b7488;--soft:#8a93a8;--line:#e6e9f0;--wash:#f5f7fb;--teal:#4fb0a6;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#eef1f6;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);}
.wrap{max-width:1000px;margin:0 auto;padding:26px 28px 60px;}
.pgh{font-size:26px;font-weight:800;color:var(--navy);margin:6px 0 2px;}
.pgs{color:var(--muted);font-size:13.5px;margin-bottom:22px;max-width:720px;line-height:1.5;}
.soon{background:#fff;border:1px solid var(--line);border-radius:16px;padding:46px 30px;text-align:center;box-shadow:0 6px 24px rgba(10,20,50,.05);}
.soon .badge{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);background:#e6f6f4;border:1px solid #bce6e0;border-radius:100px;padding:5px 14px;margin-bottom:16px;}
.soon h2{font-size:20px;font-weight:800;color:var(--navy);margin:0 0 8px;}
.soon p{color:var(--muted);font-size:14px;line-height:1.6;max-width:520px;margin:0 auto;}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<div class="wrap">
  <h1 class="pgh">Expenses</h1>
  <div class="pgs">Log deal and business expenses, categorize them, and tie them back to listings.</div>
  <div class="soon">
    <div class="badge">Coming soon</div>
    <h2>Expenses are on the way</h2>
    <p>This is the placeholder for the Expenses section of Accounting. The layout, fields, and workflow are being built — nothing here is live yet.</p>
  </div>
</div>
</body>
</html>
