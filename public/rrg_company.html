// Save the concept (create or update) and then search the web for its locations — replaces the old per-row Find button.
function conceptFind(cpt,isEdit){
  if(window.rrgAiConfirm){ window.rrgAiConfirm({actionKey:"find-locations",title:"Find locations with "+(window.__rrgAssistant||"AI"),body:"This reads the concept’s website and maps listings to find every location it operates. It runs an AI web search — a metered action.",onProceed:function(){ _doConceptFind(cpt,isEdit); }}); return; }
  _doConceptFind(cpt,isEdit);
}
function _doConceptFind(cpt,isEdit){
  if(_cpSaveTimer){ clearTimeout(_cpSaveTimer); _cpSaveTimer=null; }
  var name=document.getElementById('cp_name').value.trim();
  var website=document.getElementById('cp_site').value.trim();
  var count=(document.getElementById('cp_findcount')||{}).value||'';
  var msg=document.getElementById('cp_msg'), btn=document.getElementById('cp_find');
  if(!name){ document.getElementById('cp_name').focus(); if(msg) msg.textContent='Name the concept first.'; return; }
  if(!website){ document.getElementById('cp_site').focus(); if(msg) msg.textContent='Add the concept’s website to search.'; return; }
  if(btn){ btn.disabled=true; btn.textContent='Searching…'; }
  var ctrl=window.AbortController?new AbortController():null;
  aiShow('Reading '+name+'’s site and map listings to find its locations…', ctrl?function(){ try{ctrl.abort();}catch(e){} }:null);
  var markets=[]; document.querySelectorAll('.cp_mkt:checked').forEach(function(x){ markets.push(x.value); });
  var body={name:name,website:website,logo:document.getElementById('cp_logo').value.trim(),markets:markets,conceptType:cpVal('cp_ctype'),pricePoint:cpVal('cp_price'),cuisine:cpVal('cp_cuisine')};
  if(isEdit&&cpt&&cpt.id) body.id=cpt.id;
  function fail(t){ aiHide(); if(btn){ btn.disabled=false; btn.textContent='✨ Find locations'; } if(msg) msg.textContent=t; }
  fetch('/api/company/'+encodeURIComponent(ID)+'/concept',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body),signal:ctrl?ctrl.signal:undefined})
    .then(function(r){return r.json();}).then(function(j){
      if(!j||!j.ok){ fail((j&&j.error)||'Could not save the concept.'); return; }
      CONCEPTS=j.concepts||CONCEPTS; LOCATIONS=j.locations||LOCATIONS;
      return fetch('/api/company/'+encodeURIComponent(ID)+'/find-locations',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({concept:name,website:website,count:count}),signal:ctrl?ctrl.signal:undefined})
        .then(function(r){return r.json();}).then(function(j2){
          aiHide();
          if(j2&&j2.ok){ CONCEPTS=j2.concepts||CONCEPTS; var c2=CONCEPTS.filter(function(x){return x.name===name;})[0]; if(c2) EXPANDED[c2.id]=true; LOCATIONS=j2.locations||LOCATIONS; var f=document.getElementById('conceptForm'); if(f){ f.setAttribute('hidden',''); f.innerHTML=''; } render(); }
          else fail((j2&&j2.error)||'Search failed.');
        });
    })
    .catch(function(e){ if(e&&e.name==='AbortError'){ aiHide(); if(btn){ btn.disabled=false; btn.textContent='✨ Find locations'; } return; } fail('Could not reach the server.'); });
}

// ---- Build ONE concept from its name (fills website/type/cuisine/price, then finds locations) ----
function conceptBuildFromName(cpt,isEdit){
  if(window.rrgAiConfirm){ window.rrgAiConfirm({actionKey:"concept-build",title:"Build this concept with "+(window.__rrgAssistant||"AI"),body:"This searches the web for the brand’s website, type, cuisine and price, then finds its locations. It runs AI web searches — a metered action.",onProceed:function(){ _doConceptBuildFromName(cpt,isEdit); }}); return; }
  _doConceptBuildFromName(cpt,isEdit);
}
function _doConceptBuildFromName(cpt,isEdit){
  var name=document.getElementById('cp_name').value.trim();
  var msg=document.getElementById('cp_msg');
  if(!name){ document.getElementById('cp_name').focus(); if(msg) msg.textContent='Enter the concept name first.'; return; }
  var ctrl=window.AbortController?new AbortController():null;
  aiShow('Searching the web for '+name+' — website, type, cuisine & price…', ctrl?function(){ try{ctrl.abort();}catch(e){} }:null);
  fetch('/api/company/'+encodeURIComponent(ID)+'/concept-resolve',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({name:name}),signal:ctrl?ctrl.signal:undefined})
    .then(function(r){return r.json();}).then(function(j){
      if(!j||!j.ok){ aiHide(); if(msg) msg.textContent=(j&&j.error)||'Could not build the concept.'; return; }
      var p=j.profile||{};
      var s=document.getElementById('cp_site'); if(s&&p.website) s.value=p.website;
      var ct=document.getElementById('cp_ctype'); if(ct&&p.conceptType) ct.value=p.conceptType;
      var cu=document.getElementById('cp_cuisine'); if(cu&&p.cuisine) cu.value=p.cuisine;
      var pp=document.getElementById('cp_price'); if(pp&&p.pricePoint) pp.value=p.pricePoint;
      if(!p.website){ aiHide(); if(msg) msg.textContent=ASSISTANT+' could not confirm a website — add it, then use Find locations.'; return; }
      aiSetMsg('Found the site. Now finding '+name+'’s locations…');
      _doConceptFind(cpt,isEdit);
    }).catch(function(e){ if(e&&e.name==='AbortError'){ aiHide(); return; } aiHide(); if(msg) msg.textContent='Could not reach the server.'; });
}

function _tfFuzzy(hay,q){ hay=String(hay).toLowerCase(); q=String(q).toLowerCase(); if(!q) return true; var i=0; for(var j=0;j<hay.length&&i<q.length;j++){ if(hay.charAt(j)===q.charAt(i)) i++; } return i===q.length; }
function _tfScore(hay,q){ hay=String(hay).toLowerCase(); q=String(q).toLowerCase(); if(!q) return 0; var idx=hay.indexOf(q); if(idx===0) return 0; if(idx>0) return 1; return 2; }
// Chip + fuzzy-autocomplete tag field. initial = current tags, suggestions = ALLTAGS. Returns {get:()=>[...tags]}.
function mkTagField(hostId, initial, suggestions, onChange){
  var host=document.getElementById(hostId); if(!host) return null;
  var tags=(initial||[]).slice(), LIST=[], sel=-1;
  function fire(){ if(typeof onChange==='function'){ try{ onChange(tags.slice()); }catch(e){} } }
  var wrap=document.createElement('div'); wrap.className='tagfield';
  var inp=document.createElement('input'); inp.type='text'; inp.autocomplete='off'; inp.placeholder='Type to search tags…';
  var menu=document.createElement('div'); menu.className='tagmenu'; menu.hidden=true;
  host.className='tagfieldhost'; host.innerHTML=''; host.appendChild(wrap); wrap.appendChild(inp); wrap.appendChild(menu);
  function chips(){ Array.prototype.slice.call(wrap.querySelectorAll('.tchip')).forEach(function(x){ x.parentNode.removeChild(x); }); tags.forEach(function(t){ var c=document.createElement('span'); c.className='tchip'; c.appendChild(document.createTextNode(t)); var b=document.createElement('button'); b.type='button'; b.textContent='×'; b.title='Remove'; b.addEventListener('click',function(){ tags=tags.filter(function(x){return x!==t;}); chips(); fire(); inp.focus(); }); c.appendChild(b); wrap.insertBefore(c,inp); }); }
  function add(v){ v=(v||'').replace(/,+$/,'').trim(); if(v && tags.map(function(x){return x.toLowerCase();}).indexOf(v.toLowerCase())<0){ tags.push(v); chips(); fire(); } inp.value=''; close(); }
  function open(){ var q=inp.value.trim(); var have={}; tags.forEach(function(t){ have[t.toLowerCase()]=1; }); LIST=(suggestions||[]).filter(function(s){ return !have[String(s).toLowerCase()] && _tfFuzzy(s,q); }); LIST.sort(function(a,b){ return _tfScore(a,q)-_tfScore(b,q) || String(a).toLowerCase().localeCompare(String(b).toLowerCase()); }); LIST=LIST.slice(0,50); var exact=(suggestions||[]).some(function(s){ return String(s).toLowerCase()===q.toLowerCase(); }) || tags.map(function(x){return x.toLowerCase();}).indexOf(q.toLowerCase())>=0; var html=LIST.map(function(s,i){ return '<div data-i="'+i+'">'+esc(s)+'</div>'; }).join(''); if(q && !exact){ html+='<div class="newrow" data-new="1">Add “'+esc(q)+'”</div>'; } if(!html){ close(); return; } sel=-1; menu.innerHTML=html; menu.hidden=false; Array.prototype.slice.call(menu.children).forEach(function(row){ row.addEventListener('mousedown',function(e){ e.preventDefault(); if(row.getAttribute('data-new')) add(inp.value); else add(LIST[+row.getAttribute('data-i')]); inp.focus(); }); }); }
  function close(){ menu.hidden=true; sel=-1; }
  function paint(){ Array.prototype.slice.call(menu.children).forEach(function(r,i){ r.classList.toggle('sel',i===sel); }); }
  inp.addEventListener('input',open); inp.addEventListener('focus',open);
  inp.addEventListener('blur',function(){ setTimeout(close,150); });
  inp.addEventListener('keydown',function(e){ var rows=menu.hidden?[]:Array.prototype.slice.call(menu.children); if(e.key==='ArrowDown'&&rows.length){ e.preventDefault(); sel=Math.min(rows.length-1,sel+1); paint(); } else if(e.key==='ArrowUp'&&rows.length){ e.preventDefault(); sel=Math.max(0,sel-1); paint(); } else if(e.key==='Enter'||e.key===','){ e.preventDefault(); if(sel>=0&&rows[sel]){ if(rows[sel].getAttribute('data-new')) add(inp.value); else add(LIST[+rows[sel].getAttribute('data-i')]); } else add(inp.value); } else if(e.key==='Backspace'&&!inp.value&&tags.length){ tags.pop(); chips(); fire(); } else if(e.key==='Escape'){ close(); } });
  wrap.addEventListener('mousedown',function(e){ if(e.target===wrap) inp.focus(); });
  chips();
