function conceptFind(cpt,isEdit){
  if(window.rrgAiConfirm){ window.rrgAiConfirm({actionKey:"find-locations",title:"Find locations with "+(window.__rrgAssistant||"AI"),body:"This reads the concept’s website and maps listings to find every location it operates. It runs an AI web search — a metered action.",onProceed:function(){ _doConceptFind(cpt,isEdit); }}); return; }
  _doConceptFind(cpt,isEdit);
}
function _doConceptFind(cpt,isEdit){
  if(_cpSaveTimer){ clearTimeout(_cpSaveTimer); _cpSaveTimer=null; }
  var name=document.getElementById('cp_name').value.trim();
  var website=document.getElementById('cp_site').value.trim();
  var count=(document.getElementById('cp_findcount')||{}).value||'';
  var msg=document.getElementById('cp_msg'), btn=document.getElementById('cp_find');
  if(!name){ document.getElementById('cp_name').focus(); if(msg) msg.textContent='Name the concept first.'; return; }
  if(!website){ document.getElementById('cp_site').focus(); if(msg) msg.textContent='Add the concept’s website to search.'; return; }
  if(btn){ btn.disabled=true; btn.textContent='Searching…'; }
  var ctrl=window.AbortController?new AbortController():null;
  aiShow('Reading '+name+'’s site and map listings to find its locations…', ctrl?function(){ try{ctrl.abort();}catch(e){} }:null);
  var markets=[]; document.querySelectorAll('.cp_mkt:checked').forEach(function(x){ markets.push(x.value); });
  var body={name:name,website:website,logo:document.getElementById('cp_logo').value.trim(),markets:markets,conceptType:cpVal('cp_ctype'),pricePoint:cpVal('cp_price'),cuisine:cpVal('cp_cuisine')};
  if(isEdit&&cpt&&cpt.id) body.id=cpt.id;
  function fail(t){ aiHide(); if(btn){ btn.disabled=false; btn.textContent='✨ Find locations'; } if(msg) msg.textContent=t; }
  fetch('/api/company/'+encodeURIComponent(ID)+'/concept',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body),signal:ctrl?ctrl.signal:undefined})
    .then(function(r){return r.json();}).then(function(j){
      if(!j||!j.ok){ fail((j&&j.error)||'Could not save the concept.'); return; }
      CONCEPTS=j.concepts||CONCEPTS; LOCATIONS=j.locations||LOCATIONS;
      return fetch('/api/company/'+encodeURIComponent(ID)+'/find-locations',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({concept:name,website:website,count:count}),signal:ctrl?ctrl.signal:undefined})
        .then(function(r){return r.json();}).then(function(j2){
          aiHide();
          if(j2&&j2.ok){ CONCEPTS=j2.concepts||CONCEPTS; var c2=CONCEPTS.filter(function(x){return x.name===name;})[0]; if(c2) EXPANDED[c2.id]=true; LOCATIONS=j2.locations||LOCATIONS; var f=document.getElementById('conceptForm'); if(f){ f.setAttribute('hidden',''); f.innerHTML=''; } render(); }
          else fail((j2&&j2.error)||'Search failed.');
        });
    })
    .catch(function(e){ if(e&&e.name==='AbortError'){ aiHide(); if(btn){ btn.disabled=false; btn.textContent='✨ Find locations'; } return; } fail('Could not reach the server.'); });
}

var AIWORK={onCancel:null,t0:0,timer:null};
function _aiFmt(ms){ var s=Math.max(0,Math.floor(ms/1000)); var m=Math.floor(s/60); s=s%60; return m+':'+(s<10?'0':'')+s; }
function _aiEnsure(){ var o=document.getElementById('aiwork'); if(o) return o; o=document.createElement('div'); o.className='aiwork'; o.id='aiwork'; o.hidden=true; o.innerHTML='<div class="aiworkbox"><div class="aiworkorb"></div><div class="aiworktitle" id="aiworktitle">Working…</div><div class="aiworkmsg" id="aiworkmsg"></div><div class="aiworktimer" id="aiworktimer">0:00</div><button type="button" class="aiworkcancel" id="aiworkcancel">Cancel</button></div>'; document.body.appendChild(o); var cb=o.querySelector('#aiworkcancel'); if(cb) cb.addEventListener('click',function(){ var f=AIWORK.onCancel; aiHide(); if(typeof f==='function'){ try{f();}catch(e){} } }); return o; }
function aiShow(msg,onCancel){ _aiEnsure(); document.getElementById('aiworktitle').textContent='✨ '+ASSISTANT+' is working…'; document.getElementById('aiworkmsg').textContent=msg||''; AIWORK.onCancel=onCancel||null; var cb=document.getElementById('aiworkcancel'); if(cb) cb.style.display=onCancel?'':'none'; AIWORK.t0=Date.now(); var tm=document.getElementById('aiworktimer'); if(tm) tm.textContent='0:00'; if(AIWORK.timer) clearInterval(AIWORK.timer); AIWORK.timer=setInterval(function(){ var t=document.getElementById('aiworktimer'); if(t) t.textContent=_aiFmt(Date.now()-AIWORK.t0); },1000); document.getElementById('aiwork').hidden=false; }
function aiSetMsg(msg){ var m=document.getElementById('aiworkmsg'); if(m) m.textContent=msg||''; }
function aiHide(){ var o=document.getElementById('aiwork'); if(o) o.hidden=true; AIWORK.onCancel=null; if(AIWORK.timer){ clearInterval(AIWORK.timer); AIWORK.timer=null; } }
// ---- Build ONE concept from its name (fills website/type/cuisine/price, then finds locations) ----
function conceptBuildFromName(cpt,isEdit){
  if(window.rrgAiConfirm){ window.rrgAiConfirm({actionKey:"concept-build",title:"Build this concept with "+(window.__rrgAssistant||"AI"),body:"This searches the web for the brand’s website, type, cuisine and price, then finds its locations. It runs AI web searches — a metered action.",onProceed:function(){ _doConceptBuildFromName(cpt,isEdit); }}); return; }
  _doConceptBuildFromName(cpt,isEdit);
}
function _doConceptBuildFromName(cpt,isEdit){
  var name=document.getElementById('cp_name').value.trim();
  var msg=document.getElementById('cp_msg');
  if(!name){ document.getElementById('cp_name').focus(); if(msg) msg.textContent='Enter the concept name first.'; return; }
  var ctrl=window.AbortController?new AbortController():null;
  aiShow('Searching the web for '+name+' — website, type, cuisine & price…', ctrl?function(){ try{ctrl.abort();}catch(e){} }:null);
  fetch('/api/company/'+encodeURIComponent(ID)+'/concept-resolve',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({name:name}),signal:ctrl?ctrl.signal:undefined})
    .then(function(r){return r.json();}).then(function(j){
      if(!j||!j.ok){ aiHide(); if(msg) msg.textContent=(j&&j.error)||'Could not build the concept.'; return; }
      var p=j.profile||{};
      var s=document.getElementById('cp_site'); if(s&&p.website) s.value=p.website;
      var ct=document.getElementById('cp_ctype'); if(ct&&p.conceptType) ct.value=p.conceptType;
      var cu=document.getElementById('cp_cuisine'); if(cu&&p.cuisine) cu.value=p.cuisine;
      var pp=document.getElementById('cp_price'); if(pp&&p.pricePoint) pp.value=p.pricePoint;
      if(!p.website){ aiHide(); if(msg) msg.textContent=ASSISTANT+' could not confirm a website — add it, then use Find locations.'; return; }
      aiSetMsg('Found the site. Now finding '+name+'’s locations…');
      _doConceptFind(cpt,isEdit);
    }).catch(function(e){ if(e&&e.name==='AbortError'){ aiHide(); return; } aiHide(); if(msg) msg.textContent='Could not reach the server.'; });
}

var _cbStop=false;
function findGroupConcepts(){
  if(window.rrgAiConfirm){ window.rrgAiConfirm({actionKey:"find-concepts",title:"Find this group’s concepts with "+(window.__rrgAssistant||"AI"),body:"This searches the web for every brand this group operates and builds each one. It runs AI web searches — a metered action.",onProceed:function(){ _doFindGroupConcepts(); }}); return; }
  _doFindGroupConcepts();
}
function _doFindGroupConcepts(){
  var msg=document.getElementById('cb_msg'); var btn=document.getElementById('cb_findgroup');
  if(btn) btn.disabled=true; if(msg) msg.textContent=(window.__rrgAssistant||ASSISTANT||'AI')+' is finding this group’s concepts…';
  fetch('/api/company/'+encodeURIComponent(ID)+'/find-concepts',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({})}).then(function(r){return r.json();}).then(function(j){
    if(btn) btn.disabled=false;
    if(!j||!j.ok){ if(msg) msg.textContent=(j&&j.error)||'Could not find concepts.'; return; }
    var names=(j.concepts||[]).map(function(c){return c.name;}).filter(Boolean);
    if(!names.length){ if(msg) msg.textContent='No concepts found — enter them manually.'; return; }
    var ta=document.getElementById('cb_names'); if(ta) ta.value=names.join('\n');
    var metro=(document.getElementById('cb_metro').value||'').trim(); var count=(document.getElementById('cb_count').value||'').trim();
    if(msg) msg.textContent='Found '+names.length+' concept'+(names.length===1?'':'s')+' — building…';
    runBuildConcepts(names,metro,count,(j&&j.groupWebsite)||'');
  }).catch(function(){ if(btn) btn.disabled=false; if(msg) msg.textContent='Network error.'; });
}
function autoFindGroup(metro){
  if(typeof aiShow==='function') aiShow((window.__rrgAssistant||ASSISTANT||'AI')+' is finding this group’s '+CLABELP.toLowerCase()+'…', function(){ _cbStop=true; });
  fetch('/api/company/'+encodeURIComponent(ID)+'/find-concepts',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({})}).then(function(r){return r.json();}).then(function(j){
    var names=(j&&j.ok&&j.concepts)?j.concepts.map(function(x){return x.name;}).filter(Boolean):[];
    if(!names.length){ if(typeof aiHide==='function') aiHide(); alert((j&&j.error)||('Could not auto-find '+CLABELP.toLowerCase()+'. Add them with “+ Add '+CLABEL.toLowerCase()+'”.')); return; }
    runBuildConcepts(names,metro||'','',(j&&j.groupWebsite)||'');
  }).catch(function(){ if(typeof aiHide==='function') aiHide(); alert('Could not reach the server.'); });
}
function buildAllConcepts(){
  var names=(document.getElementById('cb_names').value||'').split(/\n/).map(function(s){return s.trim();}).filter(Boolean);
  var metro=(document.getElementById('cb_metro').value||'').trim();
  var count=(document.getElementById('cb_count').value||'').trim();
  if(!names.length){ document.getElementById('cb_names').focus(); var msg=document.getElementById('cb_msg'); if(msg) msg.textContent='Enter at least one concept name.'; return; }
  runBuildConcepts(names,metro,count,'');
}
var _cbAbort=null;
function runBuildConcepts(names,metro,count,website){
  names=(names||[]).slice(0,50); if(!names.length) return;
  if(window.rrgAiConfirm){ window.rrgAiConfirm({ actionKey:'build-concepts', title:'Build '+names.length+' '+((names.length===1)?(typeof CLABEL!=='undefined'?CLABEL:'concept'):(typeof CLABELP!=='undefined'?CLABELP:'concepts')).toLowerCase()+' with AI', body:(window.__rrgAssistant||'AI')+' will search the web for each brand \u2014 website, type, cuisine, price, logo \u2014 and pull its locations. This runs AI and may take a minute.', onProceed:function(){ _doRunBuildConcepts(names,metro,count,website); } }); return; }
  _doRunBuildConcepts(names,metro,count,website);
}
function _doRunBuildConcepts(names,metro,count,website){
  _cbStop=false;
  try{ _cbAbort=new AbortController(); }catch(e){ _cbAbort=null; }
  var _lbl=(names.length===1?(typeof CLABEL!=='undefined'?CLABEL:'concept').toLowerCase():(typeof CLABELP!=='undefined'?CLABELP:'concepts').toLowerCase());
  aiShow((window.__rrgAssistant||(typeof ASSISTANT!=='undefined'?ASSISTANT:'AI'))+' is building '+names.length+' '+_lbl+' in parallel — searching the web for each…', function(){ _cbStop=true; if(_cbAbort){ try{_cbAbort.abort();}catch(e){} } aiHide(); });
  var opt={method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({names:names,market:metro,count:count,website:website||''})};
  if(_cbAbort) opt.signal=_cbAbort.signal;
  fetch('/api/company/'+encodeURIComponent(ID)+'/build-concepts',opt)
    .then(function(r){return r.json();}).then(function(j){
      aiHide(); var f=document.getElementById('conceptForm'); if(f){ f.setAttribute('hidden','');f.innerHTML=''; }
      if(!j||!j.ok){ if(!_cbStop) alert((j&&j.error)||'Could not build concepts.'); return; }
      CONCEPTS=j.concepts||CONCEPTS; LOCATIONS=j.locations||LOCATIONS;
      if(C){ if(j.logo) C.logo=j.logo; if(j.officeWebsite){ C.office=C.office||{}; if(!C.office.website) C.office.website=j.officeWebsite; } }
      render();
      if(j.noSite&&j.noSite.length){ var _cl=(typeof CLABELP!=='undefined'?CLABELP:'concepts').toLowerCase(); alert('Built '+(j.addedConcepts||0)+' new '+_cl+' and added '+(j.addedLocations||0)+' location'+((j.addedLocations===1)?'':'s')+'.\nNo website found for: '+j.noSite.join(', ')+' — add a site to those to pull their locations.'); }
    })
    .catch(function(err){ aiHide(); if(_cbStop||(err&&err.name==='AbortError')) return; alert('Could not reach the server.'); });
}

    .then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ alert('Deleted “'+n+'”'+(j.deletedDeals?(' and '+j.deletedDeals+' listing'+(j.deletedDeals===1?'':'s')):'')+'.'); location.href='./rrg_companies.html'; } else { b.disabled=false;b.textContent='Delete company'; alert((j&&j.error)||'Could not delete.'); } })
    .catch(function(){ b.disabled=false;b.textContent='Delete company'; alert('Could not reach the server.'); });
}
function saveCompany(){
  var b=document.getElementById('c_save'); b.disabled=true; b.textContent='Saving…';
  var body={ id:ID, name:document.getElementById('c_name').value.trim(), type:document.getElementById('c_type').value, leadSource:(document.getElementById('c_lead')||{}).value||'', tags:(document.getElementById('c_tags').value||'').split(',').map(function(s){return s.trim();}).filter(Boolean), notes:document.getElementById('c_notes').value, logo:(document.getElementById('c_logo')||{}).value||'',
    office:{ address:document.getElementById('o_address').value.trim(), city:document.getElementById('o_city').value.trim(), state:document.getElementById('o_state').value.trim(), phone:document.getElementById('o_phone').value.trim(), email:document.getElementById('o_email').value.trim(), website:document.getElementById('o_website').value.trim() } };
  fetch('/api/company',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)})
    .then(function(r){return r.json();}).then(function(j){ b.textContent='Save changes'; if(j&&j.ok){ C=j.company; DIRTY=false; document.getElementById('crumb').textContent=C.name; var s=document.getElementById('c_saved'); s.classList.add('show'); setTimeout(function(){s.classList.remove('show');},2000); } else { b.disabled=false; alert((j&&j.error)||'Could not save.'); } })
    .catch(function(){ b.textContent='Save changes'; b.disabled=false; alert('Could not reach the server.'); });
}
window.addEventListener('beforeunload',function(e){ if(DIRTY){ e.preventDefault(); e.returnValue=''; } });
function load(){
  if(!ID){ document.getElementById('root').innerHTML='<div style="text-align:center;color:#6b7488;padding:50px">No company selected. <a href="./rrg_companies.html">Back to companies →</a></div>'; return; }
  fetch('/api/company/'+encodeURIComponent(ID),{credentials:'same-origin'}).then(function(r){ if(!r.ok) return r.json().then(function(j){ throw new Error((j&&j.error)||'Not found'); }); return r.json(); })
    .then(function(j){ C=j.company; CONTACTS=j.contacts||[]; DEALS=j.deals||[]; LOCATIONS=j.locations||[]; CONCEPTS=j.concepts||[]; CTYPES=j.types||CTYPES; PTYPES=j.personTypes||PTYPES; LSTATUSES=j.locationStatuses||LSTATUSES; SITETYPES=j.siteTypes||SITETYPES; CONCEPT_TYPES=j.conceptTypes||CONCEPT_TYPES; PRICE_POINTS=j.pricePoints||PRICE_POINTS; CUISINE_TYPES=j.cuisineTypes||CUISINE_TYPES; MARKETS=j.markets||MARKETS; TITLES=j.titles||TITLES; LEADSOURCES=j.leadSources||LEADSOURCES; AGREEMENTS=j.agreements||[]; ATYPES=j.agreementTypes||[]; ACTIVITY=j.activity||[]; ACTTYPES=j.activityTypes||ACTTYPES; USERS=j.users||[]; LOGOAUTO=j.logoAuto||''; IS_ADMIN=!!j.isAdmin; CAN_DELETE=!!j.canDelete; HASMAPS=!!j.hasMaps; render(); try{ var _pb=localStorage.getItem('rrg_build_'+ID); if(_pb){ localStorage.removeItem('rrg_build_'+ID); var _o=JSON.parse(_pb)||{}; if(_o.findGroup){ setTimeout(function(){ autoFindGroup(_o.metro||''); },500); } else if(_o.names&&_o.names.length){ setTimeout(function(){ runBuildConcepts(_o.names,_o.metro||'','',_o.website||''); },500); } } }catch(e){} })
    .catch(function(e){ document.getElementById('root').innerHTML='<div style="text-align:center;color:#6b7488;padding:50px 24px">'+esc(e.message||'Could not load this company.')+'<br><br><a href="./rrg_companies.html" style="color:#000E31;font-weight:700">← Back to companies</a></div>'; });
}
var ASSISTANT='the RRG analyst'; var CLABEL='Concept', CLABELP='Concepts';
fetch('/api/appname',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){ if(j&&j.assistant) ASSISTANT=j.assistant; if(j&&j.concept) CLABEL=j.concept; if(j&&j.conceptPlural) CLABELP=j.conceptPlural; if(typeof C!=='undefined'&&C){ try{render();}catch(e){} } }).catch(function(){});
load();

<script>/*rrg-accordion-js*/
(function(){
  var KEY='rrgcardcol_'+location.pathname;
  function get(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ return {}; } }
  function set(o){ try{ localStorage.setItem(KEY,JSON.stringify(o)); }catch(e){} }
  function titleOf(card){ var b=card.querySelector('.ch b'); return b?b.textContent.trim():''; }
  var root=document.getElementById('root'), mo=null;
  function apply(){
    if(mo) mo.disconnect();
    var st=get();
    document.querySelectorAll('.card > .ch').forEach(function(ch){ if(!ch.querySelector('.rrgchev')){ var cv=document.createElement('span'); cv.className='rrgchev'; cv.textContent='\u25be'; ch.appendChild(cv); } });
    document.querySelectorAll('.card').forEach(function(card){ var t=titleOf(card); if(t) card.classList.toggle('collapsed', !!st[t]); });
    connect();
  }
  function connect(){ if(root && window.MutationObserver){ if(!mo) mo=new MutationObserver(function(){ apply(); }); mo.observe(root,{childList:true,subtree:true}); } }
  document.addEventListener('click',function(e){ var ch=e.target.closest('.card > .ch'); if(!ch) return; if(e.target.closest('button,input,select,a,label,textarea')) return; var card=ch.closest('.card'); if(!card) return; card.classList.toggle('collapsed'); var st=get(); var t=titleOf(card); if(t){ if(card.classList.contains('collapsed')) st[t]=1; else delete st[t]; set(st); } });
  setTimeout(apply, 350);
})();
</script>
