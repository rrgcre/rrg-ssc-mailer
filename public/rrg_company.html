function conceptFind(cpt,isEdit){
  if(_cpSaveTimer){ clearTimeout(_cpSaveTimer); _cpSaveTimer=null; }
  var name=document.getElementById('cp_name').value.trim();
  var website=document.getElementById('cp_site').value.trim();
  var count=(document.getElementById('cp_findcount')||{}).value||'';
  var msg=document.getElementById('cp_msg'), btn=document.getElementById('cp_find');
  if(!name){ document.getElementById('cp_name').focus(); if(msg) msg.textContent='Name the concept first.'; return; }
  if(!website){ document.getElementById('cp_site').focus(); if(msg) msg.textContent='Add the concept’s website to search.'; return; }
  if(btn){ btn.disabled=true; btn.textContent='Searching…'; }
  if(msg) msg.textContent='This can take up to a minute — the analyst is reading the site and map listings.';
  var markets=[]; document.querySelectorAll('.cp_mkt:checked').forEach(function(x){ markets.push(x.value); });
  var body={name:name,website:website,logo:document.getElementById('cp_logo').value.trim(),markets:markets,conceptType:cpVal('cp_ctype'),pricePoint:cpVal('cp_price'),cuisine:cpVal('cp_cuisine')};
  if(isEdit&&cpt&&cpt.id) body.id=cpt.id;
  function fail(t){ if(btn){ btn.disabled=false; btn.textContent='✨ Find locations'; } if(msg) msg.textContent=t; }
  fetch('/api/company/'+encodeURIComponent(ID)+'/concept',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)})
    .then(function(r){return r.json();}).then(function(j){
      if(!j||!j.ok){ fail((j&&j.error)||'Could not save the concept.'); return; }
      CONCEPTS=j.concepts||CONCEPTS; LOCATIONS=j.locations||LOCATIONS;
      return fetch('/api/company/'+encodeURIComponent(ID)+'/find-locations',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({concept:name,website:website,count:count})})
        .then(function(r){return r.json();}).then(function(j2){
          if(j2&&j2.ok){ var c2=CONCEPTS.filter(function(x){return x.name===name;})[0]; if(c2) EXPANDED[c2.id]=true; LOCATIONS=j2.locations||LOCATIONS; var f=document.getElementById('conceptForm'); if(f){ f.setAttribute('hidden',''); f.innerHTML=''; } render(); }
          else fail((j2&&j2.error)||'Search failed.');
        });
    })
    .catch(function(){ fail('Could not reach the server.'); });
}

function wireMulti(scope){
  scope.querySelectorAll('.mfadd').forEach(function(b){ b.addEventListener('click',function(){ var cls=b.getAttribute('data-cls'),ph=b.getAttribute('data-ph'); var row=document.createElement('div'); row.className='mfrow'; row.innerHTML='<input class="'+cls+'" placeholder="'+esc(ph)+'"><button type="button" class="mfrm" title="Remove">×</button>'; b.parentNode.insertBefore(row,b); row.querySelector('.mfrm').addEventListener('click',function(){row.remove();}); row.querySelector('input').focus(); }); });
  scope.querySelectorAll('.mfrm').forEach(function(b){ b.addEventListener('click',function(){ b.parentNode.remove(); }); });
}
function collectMulti(scope,cls){ var out=[]; scope.querySelectorAll('.'+cls).forEach(function(i){ var v=i.value.trim(); if(v) out.push(v); }); return out; }
function openContactForm(){
  var f=document.getElementById('contactForm');
  var ptsel='<option value="">— select —</option>'+PTYPES.map(function(t){return '<option>'+esc(t)+'</option>';}).join('');
  f.innerHTML='<div class="cform"><div class="cgrid">'
    +'<div><label class="fld">First name *</label><input id="ct_first" placeholder="First"></div>'
    +'<div><label class="fld">Last name *</label><input id="ct_last" placeholder="Last"></div>'
    +'<div><label class="fld">Type *</label><select id="ct_type">'+ptsel+'</select></div>'
    +'<div><label class="fld">Title / role</label><input id="ct_title" placeholder="Owner, partner, GM…"></div>'
    +'<div class="wide"><label class="fld">Emails</label>'+multiFieldHtml('ct_email',[],'name@email.com')+'</div>'
    +'<div class="wide"><label class="fld">Phones</label>'+multiFieldHtml('ct_phone',[],'(555) 555-5555')+'</div>'
    +'</div><div class="cbtns"><button class="sbtn" id="ct_save">Add contact</button><button class="cbtn" id="ct_cancel">Cancel</button><span id="ct_msg" class="findmsg"></span></div></div>';
  f.removeAttribute('hidden');
  wireMulti(f);
  document.getElementById('ct_save').addEventListener('click',saveContact);
  document.getElementById('ct_cancel').addEventListener('click',function(){ f.setAttribute('hidden',''); f.innerHTML=''; });
  document.getElementById('ct_first').focus();
}
function saveContact(){
  var f=document.getElementById('contactForm'), msg=document.getElementById('ct_msg');
  var first=document.getElementById('ct_first').value.trim(), last=document.getElementById('ct_last').value.trim(), type=document.getElementById('ct_type').value;
  if(!first||!last){ msg.textContent='First and last name are required.'; return; }
  if(!type){ msg.textContent='Pick a contact type.'; return; }
  var body={ firstName:first, lastName:last, type:type, title:document.getElementById('ct_title').value.trim(), emails:collectMulti(f,'ct_email'), phones:collectMulti(f,'ct_phone') };
  var b=document.getElementById('ct_save'); b.disabled=true; b.textContent='Adding…';
  fetch('/api/company/'+encodeURIComponent(ID)+'/contact',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)})
    .then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ CONTACTS=j.contacts||[]; render(); } else if(j&&j.existingId){ b.disabled=false;b.textContent='Add contact'; if(confirm((j.error||'That email already exists.')+'\n\nOpen that contact?')) location.href='./rrg_person.html?id='+encodeURIComponent(j.existingId); } else { b.disabled=false;b.textContent='Add contact'; msg.textContent=(j&&j.error)||'Could not add the contact.'; } })
    .catch(function(){ b.disabled=false;b.textContent='Add contact'; msg.textContent='Could not reach the server.'; });
}
function removeContact(pid){
  if(!confirm('Remove this contact from the company? (The person stays in your registry.)')) return;
  fetch('/api/company/'+encodeURIComponent(ID)+'/contact/'+encodeURIComponent(pid)+'/remove',{method:'POST',credentials:'same-origin'})
    .then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ CONTACTS=j.contacts||[]; render(); } else alert((j&&j.error)||'Could not remove.'); })
    .catch(function(){ alert('Could not reach the server.'); });
}
function deleteCompany(){
  var n=(C&&C.name)||'this company';
  var dealNote=DEALS.length?(' This will also delete '+DEALS.length+' linked deal'+(DEALS.length===1?'':'s')+' and everything in them.'):'';
  if(!confirm('Delete “'+n+'” and ALL associated records?'+dealNote+'\n\nConcepts, locations, and photos go with it. Contacts are kept in your registry. This cannot be undone.')) return;
  if(!confirm('Final check — permanently delete “'+n+'”? Type-safe confirm: this is irreversible.')) return;
  var b=document.getElementById('c_delete'); b.disabled=true; b.textContent='Deleting…';
  fetch('/api/company/'+encodeURIComponent(ID),{method:'DELETE',credentials:'same-origin'})
    .then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ alert('Deleted “'+n+'”'+(j.deletedDeals?(' and '+j.deletedDeals+' deal'+(j.deletedDeals===1?'':'s')):'')+'.'); location.href='./rrg_companies.html'; } else { b.disabled=false;b.textContent='Delete company'; alert((j&&j.error)||'Could not delete.'); } })
    .catch(function(){ b.disabled=false;b.textContent='Delete company'; alert('Could not reach the server.'); });
}
function saveCompany(){
  var b=document.getElementById('c_save'); b.disabled=true; b.textContent='Saving…';
  var body={ id:ID, name:document.getElementById('c_name').value.trim(), type:document.getElementById('c_type').value, tags:(document.getElementById('c_tags').value||'').split(',').map(function(s){return s.trim();}).filter(Boolean), notes:document.getElementById('c_notes').value, logo:(document.getElementById('c_logo')||{}).value||'',
    office:{ address:document.getElementById('o_address').value.trim(), city:document.getElementById('o_city').value.trim(), state:document.getElementById('o_state').value.trim(), phone:document.getElementById('o_phone').value.trim(), email:document.getElementById('o_email').value.trim(), website:document.getElementById('o_website').value.trim() } };
  fetch('/api/company',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)})
    .then(function(r){return r.json();}).then(function(j){ b.textContent='Save changes'; if(j&&j.ok){ C=j.company; DIRTY=false; document.getElementById('h1').textContent=C.name; document.getElementById('crumb').textContent=C.name; var s=document.getElementById('c_saved'); s.classList.add('show'); setTimeout(function(){s.classList.remove('show');},2000); } else { b.disabled=false; alert((j&&j.error)||'Could not save.'); } })
    .catch(function(){ b.textContent='Save changes'; b.disabled=false; alert('Could not reach the server.'); });
}
window.addEventListener('beforeunload',function(e){ if(DIRTY){ e.preventDefault(); e.returnValue=''; } });
function load(){
  if(!ID){ document.getElementById('root').innerHTML='<div style="text-align:center;color:#6b7488;padding:50px">No company selected. <a href="./rrg_assignments.html">Back to deals →</a></div>'; return; }
  fetch('/api/company/'+encodeURIComponent(ID),{credentials:'same-origin'}).then(function(r){ if(!r.ok) return r.json().then(function(j){ throw new Error((j&&j.error)||'Not found'); }); return r.json(); })
    .then(function(j){ C=j.company; CONTACTS=j.contacts||[]; DEALS=j.deals||[]; LOCATIONS=j.locations||[]; CONCEPTS=j.concepts||[]; CTYPES=j.types||CTYPES; PTYPES=j.personTypes||PTYPES; LSTATUSES=j.locationStatuses||LSTATUSES; SITETYPES=j.siteTypes||SITETYPES; CONCEPT_TYPES=j.conceptTypes||CONCEPT_TYPES; PRICE_POINTS=j.pricePoints||PRICE_POINTS; CUISINE_TYPES=j.cuisineTypes||CUISINE_TYPES; MARKETS=j.markets||MARKETS; AGREEMENTS=j.agreements||[]; ATYPES=j.agreementTypes||[]; LOGOAUTO=j.logoAuto||''; IS_ADMIN=!!j.isAdmin; HASMAPS=!!j.hasMaps; render(); })
    .catch(function(e){ document.getElementById('root').innerHTML='<div style="text-align:center;color:#6b7488;padding:50px 24px">'+esc(e.message||'Could not load this company.')+'<br><br><a href="./rrg_assignments.html" style="color:#000E31;font-weight:700">← Back to deals</a></div>'; });
}
load();
</script>
</body>
