var ID=qs('id'), C=null, CONTACTS=[], DEALS=[], LOCATIONS=[], CONCEPTS=[], CTYPES=['Seller','Buyer'], PTYPES=['Buyer'], LSTATUSES=['Planned','Under Construction','Operating','Dark','Closed'], SITETYPES=['Freestanding','End Cap','Inline','Food Hall','Ghost Kitchen','Other'], CONCEPT_TYPES=['Full-Service','Fast-Casual','QSR','Bar / Nightlife','Cafe / Bakery','Food Truck','Ghost Kitchen','Other'], PRICE_POINTS=['$','$$','$$$','$$$$'], CUISINE_TYPES=[], MARKETS=['Austin','Dallas','Houston','San Antonio','Rio Grande Valley','Central Texas'], IS_ADMIN=false, HASMAPS=false, AGREEMENTS=[], ATYPES=[], LOGOAUTO='', TITLES=[], LEADSOURCES=[], CO_AGR_FILE=null, DIRTY=false;

function agrDays(d){ if(!d) return 99999; var t=new Date(d+'T00:00:00'); if(isNaN(t)) return 99999; return Math.round((t.getTime()-Date.now())/86400000); }
function agrFmt(d){ if(!d) return ''; var p=String(d).split('-'); if(p.length!==3) return d; return p[1]+'/'+p[2]+'/'+p[0]; }
function agrChipCo(a){
  var c=(ATYPE_COLORS[a.type]||{bg:'#eef1f6',fg:'#6b7488'});
  var today=agrToday(); var expired=(a.status==='terminated')||(a.expires&&a.expires<today);
  var du=agrDays(a.expires); var soon=a.expires&&!expired&&du<=60;

  var who=a.personName?(' · '+esc(a.personName)):'';

function agrRowCo(a){

  var du=agrDays(a.expires); var soon=a.expires&&!expired&&du<=60; var signed=(a.signStatus==='signed');

// When an inline form opens inside a card, make sure that card is expanded —
// otherwise the form renders inside a collapsed (display:none) card body and
// appears to do nothing. Also clears the card's saved collapsed state so the
// accordion MutationObserver does not immediately re-hide it.
function expandCardOf(f){
  try{
    var card=f&&f.closest?f.closest('.card'):null; if(!card) return;
    card.classList.remove('collapsed');
    var b=card.querySelector('.ch b'), t=b?b.textContent.trim():'';
    if(t){ var K='rrgcardcol_'+location.pathname, st={}; try{ st=JSON.parse(localStorage.getItem(K)||'{}')||{}; }catch(e){} if(st[t]){ delete st[t]; try{ localStorage.setItem(K,JSON.stringify(st)); }catch(e){} } }
  }catch(e){}
}

function saveCoAgr(){
  var m=document.getElementById('ca_msg');
  var type=document.getElementById('ca_type').value;
  var body={ companyId:ID, personId:document.getElementById('ca_person').value||'', name:document.getElementById('ca_name').value.trim(), type:type, effective:document.getElementById('ca_eff').value, expires:document.getElementById('ca_exp').value, notes:document.getElementById('ca_notes').value.trim() };

  function locRow(l){

// Save the concept (create or update) and then search the web for its locations — replaces the old per-row Find button.
function conceptFind(cpt,isEdit){
  if(_cpSaveTimer){ clearTimeout(_cpSaveTimer); _cpSaveTimer=null; }
  var name=document.getElementById('cp_name').value.trim();
  var website=document.getElementById('cp_site').value.trim();
  var count=(document.getElementById('cp_findcount')||{}).value||'';
  var msg=document.getElementById('cp_msg'), btn=document.getElementById('cp_find');
  if(!name){ document.getElementById('cp_name').focus(); if(msg) msg.textContent='Name the concept first.'; return; }
  if(!website){ document.getElementById('cp_site').focus(); if(msg) msg.textContent='Add the concept’s website to search.'; return; }
  if(btn){ btn.disabled=true; btn.textContent='Searching…'; }
  if(msg) msg.textContent='This can take up to a minute — the analyst is reading the site and map listings.';
  var markets=[]; document.querySelectorAll('.cp_mkt:checked').forEach(function(x){ markets.push(x.value); });
  var body={name:name,website:website,logo:document.getElementById('cp_logo').value.trim(),markets:markets,conceptType:cpVal('cp_ctype'),pricePoint:cpVal('cp_price'),cuisine:cpVal('cp_cuisine')};
  if(isEdit&&cpt&&cpt.id) body.id=cpt.id;
  function fail(t){ if(btn){ btn.disabled=false; btn.textContent='✨ Find locations'; } if(msg) msg.textContent=t; }
  fetch('/api/company/'+encodeURIComponent(ID)+'/concept',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)})
    .then(function(r){return r.json();}).then(function(j){
      if(!j||!j.ok){ fail((j&&j.error)||'Could not save the concept.'); return; }
      CONCEPTS=j.concepts||CONCEPTS; LOCATIONS=j.locations||LOCATIONS;
      return fetch('/api/company/'+encodeURIComponent(ID)+'/find-locations',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({concept:name,website:website,count:count})})
        .then(function(r){return r.json();}).then(function(j2){
          if(j2&&j2.ok){ CONCEPTS=j2.concepts||CONCEPTS; var c2=CONCEPTS.filter(function(x){return x.name===name;})[0]; if(c2) EXPANDED[c2.id]=true; LOCATIONS=j2.locations||LOCATIONS; var f=document.getElementById('conceptForm'); if(f){ f.setAttribute('hidden',''); f.innerHTML=''; } render(); }
          else fail((j2&&j2.error)||'Search failed.');
        });
    })
    .catch(function(){ fail('Could not reach the server.'); });
}

  var b=document.getElementById('ct_save'); b.disabled=true; b.textContent='Saving…';

    .then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ CONTACTS=j.contacts||[]; render(); } else if(j&&j.existingId){ b.disabled=false;b.textContent='Save'; if(confirm((j.error||'That email already exists.')+'\n\nOpen that contact?')) location.href='./rrg_person.html?id='+encodeURIComponent(j.existingId); } else { b.disabled=false;b.textContent='Save'; msg.textContent=(j&&j.error)||'Could not add the contact.'; } })
    .catch(function(){ b.disabled=false;b.textContent='Save'; msg.textContent='Could not reach the server.'; });
}
function setMainContact(pid){ var nv=(C.mainContactId===pid)?'':pid; fetch('/api/company',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({id:ID,mainContactId:nv})}).then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ C=j.company; render(); } else alert((j&&j.error)||'Could not set the main contact.'); }).catch(function(){ alert('Could not reach the server.'); }); }
function removeContact(pid){
  if(!confirm('Remove this contact from the company? (The person stays in your registry.)')) return;
  fetch('/api/company/'+encodeURIComponent(ID)+'/contact/'+encodeURIComponent(pid)+'/remove',{method:'POST',credentials:'same-origin'})
    .then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ CONTACTS=j.contacts||[]; render(); } else alert((j&&j.error)||'Could not remove.'); })
    .catch(function(){ alert('Could not reach the server.'); });
}
function deleteCompany(){
  var n=(C&&C.name)||'this company';
  var dealNote=DEALS.length?(' This will also delete '+DEALS.length+' linked listing'+(DEALS.length===1?'':'s')+' and everything in them.'):'';
  if(!confirm('Delete “'+n+'” and ALL associated records?'+dealNote+'\n\nConcepts, locations, and photos go with it. Contacts are kept in your registry. This cannot be undone.')) return;
  if(!confirm('Final check — permanently delete “'+n+'”? Type-safe confirm: this is irreversible.')) return;
  var b=document.getElementById('c_delete'); b.disabled=true; b.textContent='Deleting…';
  fetch('/api/company/'+encodeURIComponent(ID),{method:'DELETE',credentials:'same-origin'})
    .then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ alert('Deleted “'+n+'”'+(j.deletedDeals?(' and '+j.deletedDeals+' listing'+(j.deletedDeals===1?'':'s')):'')+'.'); location.href='./rrg_companies.html'; } else { b.disabled=false;b.textContent='Delete company'; alert((j&&j.error)||'Could not delete.'); } })
    .catch(function(){ b.disabled=false;b.textContent='Delete company'; alert('Could not reach the server.'); });
}
function saveCompany(){
  var b=document.getElementById('c_save'); b.disabled=true; b.textContent='Saving…';
  var body={ id:ID, name:document.getElementById('c_name').value.trim(), type:document.getElementById('c_type').value, leadSource:(document.getElementById('c_lead')||{}).value||'', tags:(document.getElementById('c_tags').value||'').split(',').map(function(s){return s.trim();}).filter(Boolean), notes:document.getElementById('c_notes').value, logo:(document.getElementById('c_logo')||{}).value||'',
    office:{ address:document.getElementById('o_address').value.trim(), city:document.getElementById('o_city').value.trim(), state:document.getElementById('o_state').value.trim(), phone:document.getElementById('o_phone').value.trim(), email:document.getElementById('o_email').value.trim(), website:document.getElementById('o_website').value.trim() } };
  fetch('/api/company',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)})
    .then(function(r){return r.json();}).then(function(j){ b.textContent='Save changes'; if(j&&j.ok){ C=j.company; DIRTY=false; document.getElementById('crumb').textContent=C.name; var s=document.getElementById('c_saved'); s.classList.add('show'); setTimeout(function(){s.classList.remove('show');},2000); } else { b.disabled=false; alert((j&&j.error)||'Could not save.'); } })
    .catch(function(){ b.textContent='Save changes'; b.disabled=false; alert('Could not reach the server.'); });
}
window.addEventListener('beforeunload',function(e){ if(DIRTY){ e.preventDefault(); e.returnValue=''; } });
function load(){
  if(!ID){ document.getElementById('root').innerHTML='<div style="text-align:center;color:#6b7488;padding:50px">No company selected. <a href="./rrg_companies.html">Back to companies →</a></div>'; return; }
  fetch('/api/company/'+encodeURIComponent(ID),{credentials:'same-origin'}).then(function(r){ if(!r.ok) return r.json().then(function(j){ throw new Error((j&&j.error)||'Not found'); }); return r.json(); })
    .then(function(j){ C=j.company; CONTACTS=j.contacts||[]; DEALS=j.deals||[]; LOCATIONS=j.locations||[]; CONCEPTS=j.concepts||[]; CTYPES=j.types||CTYPES; PTYPES=j.personTypes||PTYPES; LSTATUSES=j.locationStatuses||LSTATUSES; SITETYPES=j.siteTypes||SITETYPES; CONCEPT_TYPES=j.conceptTypes||CONCEPT_TYPES; PRICE_POINTS=j.pricePoints||PRICE_POINTS; CUISINE_TYPES=j.cuisineTypes||CUISINE_TYPES; MARKETS=j.markets||MARKETS; TITLES=j.titles||TITLES; LEADSOURCES=j.leadSources||LEADSOURCES; AGREEMENTS=j.agreements||[]; ATYPES=j.agreementTypes||[]; LOGOAUTO=j.logoAuto||''; IS_ADMIN=!!j.isAdmin; HASMAPS=!!j.hasMaps; render(); })
    .catch(function(e){ document.getElementById('root').innerHTML='<div style="text-align:center;color:#6b7488;padding:50px 24px">'+esc(e.message||'Could not load this company.')+'<br><br><a href="./rrg_companies.html" style="color:#000E31;font-weight:700">← Back to companies</a></div>'; });
}
var ASSISTANT='the RRG analyst';
fetch('/api/appname',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){ if(j&&j.assistant) ASSISTANT=j.assistant; }).catch(function(){});
load();
</script>
<script>/*rrg-accordion-js*/
(function(){
  var KEY='rrgcardcol_'+location.pathname;
  function get(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ return {}; } }
  function set(o){ try{ localStorage.setItem(KEY,JSON.stringify(o)); }catch(e){} }
  function titleOf(card){ var b=card.querySelector('.ch b'); return b?b.textContent.trim():''; }
  var root=document.getElementById('root'), mo=null;
  function apply(){
    if(mo) mo.disconnect();
    var st=get();
    document.querySelectorAll('.card > .ch').forEach(function(ch){ if(!ch.querySelector('.rrgchev')){ var cv=document.createElement('span'); cv.className='rrgchev'; cv.textContent='\u25be'; ch.appendChild(cv); } });
    document.querySelectorAll('.card').forEach(function(card){ var t=titleOf(card); if(t) card.classList.toggle('collapsed', !!st[t]); });
    connect();
  }
  function connect(){ if(root && window.MutationObserver){ if(!mo) mo=new MutationObserver(function(){ apply(); }); mo.observe(root,{childList:true,subtree:true}); } }
  document.addEventListener('click',function(e){ var ch=e.target.closest('.card > .ch'); if(!ch) return; if(e.target.closest('button,input,select,a,label,textarea')) return; var card=ch.closest('.card'); if(!card) return; card.classList.toggle('collapsed'); var st=get(); var t=titleOf(card); if(t){ if(card.classList.contains('collapsed')) st[t]=1; else delete st[t]; set(st); } });
  setTimeout(apply, 350);
})();
</script>
