<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullServe — Command</title>
<style>
:root{--bg:#eef1f7;--card:#fff;--line:#e3e8f1;--ink:#14213d;--dim:#66738f;--faint:#93a0ba;--navy:#16346e;--blue:#2f6fd0;--teal:#12a594;--amber:#c9812a;--red:#DA2B1F;--green:#1f8a5b;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.wrap{max-width:1200px;margin:0 auto;padding:22px 26px 70px;}
.dhead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
.dhead .hi{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:800;}
.dhead h1{margin:2px 0 0;font-size:26px;font-weight:800;letter-spacing:-.01em;color:var(--ink);}
.dhead .sp{margin-left:auto;display:flex;gap:9px;align-items:center;}
.btn{background:#fff;color:var(--navy);border:1px solid #cdd6e6;border-radius:10px;padding:9px 15px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;} .btn:hover{background:#f4f7fb;} .btn.pri{background:var(--navy);color:#fff;border-color:var(--navy);}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;} @media(max-width:820px){.grid{grid-template-columns:1fr;}}
.full{grid-column:1/-1;}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px 20px;box-shadow:0 1px 2px rgba(16,32,70,.04);position:relative;}
.card.editing{outline:2px dashed #c3d0e6;}
.ch{display:flex;align-items:center;gap:9px;margin-bottom:14px;} .ch b{font-size:14px;color:var(--ink);} .ch .tag{margin-left:auto;font-size:11px;color:var(--faint);font-weight:600;} .ch a.more{margin-left:auto;font-size:12px;font-weight:700;color:var(--blue);text-decoration:none;}
.rmx{position:absolute;top:11px;right:12px;width:24px;height:24px;border-radius:7px;border:1px solid #f0cfca;background:#fff5f4;color:var(--red);font-size:14px;cursor:pointer;display:none;}
.card.editing .rmx{display:flex;align-items:center;justify-content:center;}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;} @media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr);}}
.kpi{background:linear-gradient(180deg,#fff,#f8fafd);border:1px solid var(--line);border-radius:13px;padding:15px 16px;}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);font-weight:700;display:flex;align-items:center;gap:6px;} .kpi .l .b{width:15px;height:3px;border-radius:2px;background:var(--a,var(--blue));}
.kpi .v{font-size:26px;font-weight:800;margin-top:7px;color:var(--ink);letter-spacing:-.01em;}
/* consult */
.consultbar{display:flex;align-items:center;gap:15px;text-decoration:none;background:radial-gradient(120% 170% at 15% 10%,#22346a,#0d1526 62%);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden;}
.consultbar .orb{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#d4efe9,#3fb3a2 46%,#2f4f8c 100%);flex:none;box-shadow:0 0 16px 2px rgba(63,179,162,.42),0 3px 14px rgba(16,32,70,.5);animation:dorbglow 2.8s ease-in-out infinite;}
@keyframes dorbglow{0%,100%{box-shadow:0 0 14px 2px rgba(63,179,162,.36),0 3px 14px rgba(16,32,70,.45)}50%{box-shadow:0 0 26px 6px rgba(63,179,162,.56),0 3px 16px rgba(16,32,70,.5)}}
.consultbar .tx b{color:#fff;font-size:15.5px;} .consultbar .tx span{display:block;color:#aeb8cf;font-size:12.5px;margin-top:2px;} .consultbar .go{margin-left:auto;color:#37e0c8;font-weight:800;font-size:13.5px;white-space:nowrap;}
/* lists */
.trow{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line);} .trow:first-child{border-top:none;}
.tdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--blue);} .tdot.high{background:var(--red);} .tdot.med{background:var(--amber);}
.tmain{flex:1;min-width:0;} .tmain .t{font-size:13.5px;color:var(--ink);font-weight:500;} .tmain .s{font-size:11.5px;color:var(--dim);margin-top:1px;}
.tdue{font-size:11.5px;color:var(--dim);white-space:nowrap;flex:none;}
.bar{margin:9px 0;} .bar .top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink);margin-bottom:4px;} .bar .top b{font-weight:700;} .bar .tk{height:8px;background:#eef2f8;border-radius:100px;overflow:hidden;} .bar .tk i{display:block;height:100%;border-radius:100px;background:linear-gradient(90deg,var(--navy),var(--blue));}
.fitem{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start;} .fitem:first-child{border-top:none;} .fico{width:28px;height:28px;border-radius:8px;background:#eef3fb;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;} .ftxt{font-size:12.5px;color:var(--ink);line-height:1.4;} .ftxt b{font-weight:700;} .ftime{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap;flex:none;}
.big{font-size:34px;font-weight:800;color:var(--navy);} .biglbl{font-size:12.5px;color:var(--dim);margin-top:2px;}
.soon{text-align:center;color:var(--faint);padding:20px 8px;} .soon .badge{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--amber);background:#fbf3e7;border:1px solid #f0dcb8;border-radius:100px;padding:3px 11px;margin-bottom:9px;} .soon p{font-size:12.5px;margin:0;line-height:1.5;}
.empty{color:var(--faint);font-size:13px;padding:14px 0;}
/* customize modal */
.modal{position:fixed;inset:0;background:rgba(8,16,40,.5);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;} .modal[hidden]{display:none;}
.mcard{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.4);}
.mh{padding:17px 20px;border-bottom:1px solid var(--line);font-size:16px;font-weight:800;color:var(--ink);}
.mb{padding:12px 20px;}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #f2f4f9;cursor:pointer;} .mrow:last-child{border-bottom:none;}
.mrow .mi{width:34px;height:34px;border-radius:9px;background:#eef3fb;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;}
.mrow .mt{flex:1;} .mrow .mt b{font-size:13.5px;color:var(--ink);} .mrow .mt .d{font-size:11.5px;color:var(--dim);margin-top:1px;} .mrow .mt .lv{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-left:6px;padding:1px 6px;border-radius:100px;} .lv.on{color:var(--green);background:#eafaf0;} .lv.soon{color:var(--amber);background:#fbf3e7;}
.tog{width:42px;height:24px;border-radius:100px;background:#d5dbe6;position:relative;transition:.15s;flex:none;} .tog.on{background:var(--navy);} .tog:after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;} .tog.on:after{left:20px;}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;}
.gate{max-width:520px;margin:80px auto;text-align:center;color:var(--dim);}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<div class="wrap" id="root"><div class="gate">Loading your dashboard…</div></div>
<div class="modal" id="cust" hidden><div class="mcard">
  <div class="mh">Customize your dashboard</div>
  <div class="mb" id="custlist"></div>
  <div class="mf"><button class="btn" id="cust_cancel">Cancel</button><button class="btn pri" id="cust_save">Save</button></div>
</div></div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
var MODULES=[], LAYOUT=[], DATA={}, EDIT=false, ICONS={kpis:'▦',consult:'◉',tasks:'✔',pipeline:'⇲',activity:'◱',markets:'▤',agreements:'✍',dealstatus:'◑',expiring:'⏰',quicklinks:'🔗'};
function num(n){ return Number(n||0).toLocaleString('en-US'); }
function money(n){ n=Number(n||0); if(n>=1e6) return '$'+(Math.round(n/1e5)/10)+'M'; if(n>=1e3) return '$'+Math.round(n/1e3)+'k'; return '$'+num(n); }
function fmtDate(iso){ if(!iso) return ''; var x=String(iso).slice(0,10).split('-'); if(x.length!==3) return String(iso).slice(0,10); return x[1]+'/'+x[2]; }
function modDef(k){ return MODULES.filter(function(m){return m.k===k;})[0]; }
function kpiAccent(i){ return ['#2f6fd0','#16346e','#12a594','#c9812a','#DA2B1F'][i%5]; }
function widget(k){
  var d=DATA||{};
  if(k==='kpis'){ var t=(d.kpis||[]).map(function(x,i){ return '<div class="kpi" style="--a:'+kpiAccent(i)+'"><div class="l"><span class="b"></span>'+esc(x.label)+'</div><div class="v">'+(x.fmt==='money'?money(x.value):num(x.value))+'</div></div>'; }).join(''); return '<div class="kpis">'+t+'</div>'; }
  if(k==='consult'){ return '<a class="consultbar" href="./rrg_consult.html"><span class="orb"></span><span class="tx"><b>Ask Consult anything about your business</b><span>Voice or type — answers from your data only, never the open web</span></span><span class="go">Open →</span></a>'; }
  if(k==='tasks'){ var ts=d.tasks||[]; if(!ts.length) return '<div class="empty">No open tasks. Nice and clean. ✓</div>'; return ts.map(function(t){ var pc=/high|critical/i.test(t.priority)?'high':(/med|normal/i.test(t.priority)?'med':''); return '<div class="trow"><span class="tdot '+pc+'"></span><div class="tmain"><div class="t">'+esc(t.title)+'</div>'+((t.link||t.priority)?('<div class="s">'+esc([t.priority,t.link].filter(Boolean).join(' · '))+'</div>'):'')+'</div><div class="tdue">'+(t.due?esc(fmtDate(t.due)):'')+'</div></div>'; }).join(''); }
  if(k==='pipeline'){ var ps=d.pipeline||[]; var mx=Math.max.apply(null,ps.map(function(x){return x.count;}).concat([1])); if(!ps.length) return '<div class="empty">No pipeline stages yet.</div>'; return ps.map(function(x){ return '<div class="bar"><div class="top"><span>'+esc(x.name)+'</span><b>'+x.count+'</b></div><div class="tk"><i style="width:'+Math.round(x.count/mx*100)+'%"></i></div></div>'; }).join(''); }
  if(k==='activity'){ var as=d.activity||[]; if(!as.length) return '<div class="empty">No recent activity logged.</div>'; return as.map(function(a){ return '<div class="fitem"><span class="fico">'+(ICONS[String(a.type).toLowerCase()]||'•')+'</span><span class="ftxt"><b>'+esc(a.who||'')+'</b> · '+esc(a.type||'')+(a.text?(' — '+esc(a.text)):'')+'</span><span class="ftime">'+esc(fmtDate(a.at))+'</span></div>'; }).join(''); }
  if(k==='markets'){ var ms=d.markets||[]; var mx2=Math.max.apply(null,ms.map(function(x){return x.value;}).concat([1])); if(!ms.length) return '<div class="empty">No listings yet.</div>'; return ms.map(function(m){ return '<div class="bar"><div class="top"><span>'+esc(m.label)+'</span><b>'+m.value+'</b></div><div class="tk"><i style="width:'+Math.round(m.value/mx2*100)+'%"></i></div></div>'; }).join(''); }
  if(k==='agreements'){ return '<div style="text-align:center;padding:10px 0"><div class="big">'+num(d.agreementsOut||0)+'</div><div class="biglbl">agreements awaiting signature</div><a class="btn" style="margin-top:12px" href="./rrg_agreements.html">Open Agreements →</a></div>'; }
  var def=modDef(k)||{}; return '<div class="soon"><div class="badge">Coming soon</div><p>'+esc(def.desc||'This module is being built.')+'</p></div>';
}
function moreLink(k){ var map={tasks:'./rrg_tasks.html',pipeline:'./rrg_board.html',activity:'./rrg_feed.html',markets:'./rrg_assignments.html',agreements:'./rrg_agreements.html'}; return map[k]; }
function render(){
  var root=document.getElementById('root'); root.innerHTML='';
  var head='<div class="dhead"><div><div class="hi">Command</div><h1 id="greet"></h1></div><div class="sp"><button class="btn" id="editBtn">'+(EDIT?'Done':'✎ Customize')+'</button></div></div>';
  var cards='<div class="grid" id="dgrid">'+LAYOUT.map(function(k){ var def=modDef(k); if(!def) return ''; var full=def.w==='full'; var ml=moreLink(k); return '<div class="card'+(full?' full':'')+(EDIT?' editing':'')+'" data-k="'+k+'"><button class="rmx" data-rm="'+k+'" title="Remove">✕</button><div class="ch"><b>'+esc(def.label)+'</b>'+((ml&&!EDIT)?('<a class="more" href="'+ml+'">Open →</a>'):(def.live?'':'<span class="tag">soon</span>'))+'</div>'+widget(k)+'</div>'; }).join('')+'</div>';
  root.innerHTML=head+cards+(EDIT?'<div style="text-align:center;margin-top:18px"><button class="btn pri" id="addBtn">＋ Add modules</button></div>':'');
  var g=document.getElementById('greet'); if(g){ var h=new Date().getHours(); g.textContent=(h<12?'Good morning':(h<18?'Good afternoon':'Good evening'))+(DATA._name?(', '+DATA._name.split(' ')[0]):'')+'.'; }
  document.getElementById('editBtn').addEventListener('click',function(){ EDIT=!EDIT; render(); });
  var ab=document.getElementById('addBtn'); if(ab) ab.addEventListener('click',openCust);
  document.querySelectorAll('[data-rm]').forEach(function(b){ b.addEventListener('click',function(){ LAYOUT=LAYOUT.filter(function(x){return x!==b.getAttribute('data-rm');}); saveLayout(); render(); }); });
}
function openCust(){
  var host=document.getElementById('custlist');
  host.innerHTML=MODULES.map(function(m){ var on=LAYOUT.indexOf(m.k)>=0; return '<div class="mrow" data-tk="'+m.k+'"><span class="mi">'+(ICONS[m.k]||'▪')+'</span><div class="mt"><b>'+esc(m.label)+'</b><span class="lv '+(m.live?'on':'soon')+'">'+(m.live?'Live':'Soon')+'</span><div class="d">'+esc(m.desc||'')+'</div></div><span class="tog'+(on?' on':'')+'" data-tog="'+m.k+'"></span></div>'; }).join('');
  host.querySelectorAll('.mrow').forEach(function(r){ r.addEventListener('click',function(){ var t=r.querySelector('.tog'); t.classList.toggle('on'); }); });
  document.getElementById('cust').removeAttribute('hidden');
}
function closeCust(){ document.getElementById('cust').setAttribute('hidden',''); }
function saveCust(){
  var picked=[]; document.querySelectorAll('#custlist .tog.on').forEach(function(t){ picked.push(t.getAttribute('data-tog')); });
  var ordered=MODULES.map(function(m){return m.k;}).filter(function(k){ return picked.indexOf(k)>=0; });
  // keep existing relative order where possible
  var keep=LAYOUT.filter(function(k){return picked.indexOf(k)>=0;});
  ordered.forEach(function(k){ if(keep.indexOf(k)<0) keep.push(k); });
  LAYOUT=keep; closeCust(); saveLayout(); render();
}
function saveLayout(){ fetch('/api/dashboard',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({mods:LAYOUT})}).catch(function(){}); }
document.getElementById('cust_cancel').addEventListener('click',closeCust);
document.getElementById('cust_save').addEventListener('click',saveCust);
document.getElementById('cust').addEventListener('click',function(e){ if(e.target===this) closeCust(); });
fetch('/api/dashboard',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){
  if(!j||!j.ok){ document.getElementById('root').innerHTML='<div class="gate">Could not load your dashboard.</div>'; return; }
  MODULES=j.modules||[]; LAYOUT=(j.layout||[]).slice(); DATA=j.data||{}; DATA._name=j.name||''; render();
}).catch(function(){ document.getElementById('root').innerHTML='<div class="gate">Could not reach the server.</div>'; });
</script>
</body>
</html>
