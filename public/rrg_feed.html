<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRG — Activity Feed</title>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--ink:#1d2739;--muted:#6b7488;--soft:#98a1b5;--line:#e9edf3;--green:#1f8a5b;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#f4f6fa;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;}
.wrap{max-width:900px;margin:22px auto;padding:0 24px 70px;}
.pgh{font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-.01em;margin:0 0 4px;}
.pgs{color:var(--muted);font-size:13.5px;margin-bottom:18px;}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.04);overflow:hidden;}
.feedrow{display:flex;gap:12px;align-items:flex-start;padding:15px 20px;border-top:1px solid #eef1f6;text-decoration:none;color:inherit;}
.feedrow:first-child{border-top:none;} .feedrow:hover{background:#fbfcfe;}
.fchipcol{flex:none;width:140px;display:flex;align-items:center;gap:8px;}
.fdot{width:9px;height:9px;border-radius:50%;flex:none;}
.ftype{font-size:12px;font-weight:600;color:#42506b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fby{font-size:12px;color:#5b6472;font-weight:700;}
.fmain{flex:1;min-width:0;}
.ftop{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;}
.fwho{font-size:14px;font-weight:600;color:var(--ink);}
.fco{font-size:12.5px;color:var(--muted);}
.fwhen{font-size:12px;color:var(--soft);margin-left:auto;}
.fnote{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5;}
.empty{color:var(--soft);font-size:13.5px;padding:40px 20px;text-align:center;}
.scoperow{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.scbtn{border:1px solid #cfd6e2;background:#fff;color:var(--ink);border-radius:100px;padding:6px 15px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;}
.scbtn.on{background:var(--navy);border-color:var(--navy);color:#fff;}
.feedshell{display:flex;gap:22px;align-items:flex-start;max-width:1180px;margin:22px auto;padding:0 24px 70px;}
.rail{width:244px;flex:none;position:sticky;top:22px;}
.railcard{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.04);overflow:hidden;}
.railh{padding:13px 15px;border-bottom:1px solid var(--line);font-size:12px;font-weight:800;color:var(--navy);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;}
.railh .rcnt{color:var(--soft);font-weight:700;font-size:11px;letter-spacing:0;}
.savebtn{width:100%;text-align:left;background:#f7f9fc;border:none;border-bottom:1px solid var(--line);padding:11px 15px;font:inherit;font-size:12.5px;font-weight:700;color:var(--navy);cursor:pointer;display:flex;align-items:center;gap:8px;}
.savebtn:hover{background:#eef2f8;}
.saveform{padding:11px 13px;border-bottom:1px solid var(--line);background:#f7f9fc;display:none;}
.saveform.on{display:block;}
.saveform input{width:100%;border:1px solid #cfd6e2;border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;margin-bottom:8px;}
.saveform .sfrow{display:flex;gap:7px;}
.sfbtn{flex:1;border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:7px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;}
.sfbtn.ghost{background:#fff;color:var(--muted);border-color:#cfd6e2;}
.viewitem{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #f0f3f8;cursor:pointer;}
.viewitem:hover{background:#fbfcfe;} .viewitem.on{background:#f2f6ff;box-shadow:inset 3px 0 0 var(--navy);}
.viewitem .vname{flex:1;min-width:0;} .viewitem .vname b{display:block;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.viewitem .vsub{font-size:11px;color:var(--soft);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.viewitem .vx{color:#c2c9d6;font-size:16px;line-height:1;flex:none;padding:0 2px;} .viewitem .vx:hover{color:var(--red);}
.railempty{padding:15px;color:var(--soft);font-size:12px;line-height:1.55;}
.railnote{margin-top:10px;font-size:11px;color:var(--soft);line-height:1.5;padding:0 4px;}
@media(max-width:820px){ .feedshell{flex-direction:column;} .rail{width:100%;position:static;} }
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<div class="feedshell">
  <aside class="rail">
    <div class="railcard">
      <div class="railh">Saved views <span class="rcnt" id="rcnt"></span></div>
      <button class="savebtn" id="saveViewBtn">＋ Save this view</button>
      <div class="saveform" id="saveForm">
        <input type="text" id="viewName" placeholder="Name this view…" maxlength="40" autocomplete="off">
        <div class="sfrow"><button class="sfbtn" id="sfSave">Save</button><button class="sfbtn ghost" id="sfCancel">Cancel</button></div>
      </div>
      <div id="viewList"></div>
    </div>
    <div class="railnote">Views remember your scope, activity type, user and system toggle. Saved on this browser.</div>
  </aside>
  <div class="wrap" style="margin:0;max-width:none;padding:0;flex:1;min-width:0">
    <h1 class="pgh">Activity Feed</h1>
    <div class="pgs">Everything happening across your book — the latest calls, tours, notes, emails and agreements, newest first.</div>
    <div class="scoperow" id="scoperow"><button class="scbtn on" data-scope="all" style="display:none">All activity</button><button class="scbtn" data-scope="mine" style="display:none">My activity</button><button class="scbtn on" id="sysToggle" title="Show or hide automated system activity">System activity: On</button><select id="userFilter" style="display:none;margin-left:8px;font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line,#e6e9f0);border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink);cursor:pointer"><option value="">All users</option></select><select id="typeFilter" style="margin-left:8px;font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line,#e6e9f0);border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink);cursor:pointer"><option value="">All types</option></select></div>
    <div class="card" id="feed"><div class="empty">Loading…</div></div>
  </div>
</div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function fmt(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d.getTime())) return String(iso); return (d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(2); }
function actColor(t){ var m={'Tour':['#eef2fb','#23496f'],'Photo Shoot':['#f1ebfb','#6d28d9'],'Meal':['#fdf1df','#b5791f'],'Text':['#e6f5f3','#0f766e'],'Call':['#e7f5ee','#1f8a5b'],'Email':['#eef2fb','#3949ab'],'Form Submitted':['#eef1f6','#5b6472'],'Contact Added':['#e7f5ee','#1f8a5b'],'Agreement Sent':['#fff4e6','#b9761a'],'Agreement Signed':['#e7f5ee','#1f8a5b'],'LOI Sent':['#e9f1ff','#1d6fd6'],'LOI Received':['#eef7ee','#2f9e50'],'Diligence':['#eef2fb','#23496f'],'Note':['#eef1f6','#5b6472'],'To-Do':['#fdeceb','#DA2B1F']}; return m[t]||['#eef1f6','#5b6472']; }
var SCOPE='all', HIDE_SYSTEM=false, ALLITEMS=[], TYPEF='', USERF='';
try{ HIDE_SYSTEM=(localStorage.getItem('rrgFeedHideSystem')==='1'); }catch(e){}
function syncSysBtn(){ var b=document.getElementById('sysToggle'); if(!b) return; b.textContent='System activity: '+(HIDE_SYSTEM?'Off':'On'); b.classList.toggle('on',!HIDE_SYSTEM); }
function buildTypeFilter(){ var sel=document.getElementById('typeFilter'); if(!sel) return; var types={}; ALLITEMS.forEach(function(a){ if(a.type) types[a.type]=1; }); sel.innerHTML='<option value="">All types</option>'+Object.keys(types).sort().map(function(t){ return '<option value="'+esc(t)+'"'+(t===TYPEF?' selected':'')+'>'+esc(t)+'</option>'; }).join(''); }
function buildUserFilter(users){ var sel=document.getElementById('userFilter'); if(!sel) return; sel.innerHTML='<option value="">All users</option>'+(users||[]).map(function(u){ return '<option value="'+esc(u.username)+'"'+(u.username===USERF?' selected':'')+'>'+esc(u.name)+'</option>'; }).join(''); }
function load(){
  var _qs=[]; if(SCOPE==='mine') _qs.push('scope=mine'); if(USERF) _qs.push('user='+encodeURIComponent(USERF)); fetch('/api/feed'+(_qs.length?('?'+_qs.join('&')):''),{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){
  if(j&&j.canScope){ document.querySelectorAll('#scoperow [data-scope]').forEach(function(b){ b.style.display=''; }); var _uf=document.getElementById('userFilter'); if(_uf) _uf.style.display=''; buildUserFilter(j.users); }
  var el=document.getElementById('feed');
  ALLITEMS=((j&&j.items)||[]); buildTypeFilter();
  var items=ALLITEMS.filter(function(a){ return (HIDE_SYSTEM?!a.system:true) && (!TYPEF||a.type===TYPEF); });
  if(!items.length){ el.innerHTML='<div class="empty">'+(TYPEF?('No '+esc(TYPEF)+' activity'+(HIDE_SYSTEM?' (system activity is hidden)':'')+'.'):'No activity logged across your contacts yet. Log a call, tour, or note on a contact and it shows up here.')+'</div>'; return; }
  el.innerHTML=items.map(function(a){
    var c=actColor(a.type);
    if(a.system||!a.personId){ return '<div class="feedrow" style="cursor:default"><span class="fchipcol"><span class="fdot" style="background:'+c[1]+'"></span><span class="ftype">'+esc(a.type)+'</span></span><div class="fmain"><div class="ftop"><span class="fwho">'+esc(a.note||a.type)+'</span>'+(a.by?('<span class="fby">· '+esc(a.by)+'</span>'):'')+'<span class="fwhen">'+esc(fmt(a.at))+'</span></div></div></div>'; }
    return '<a class="feedrow" href="./rrg_person.html?id='+encodeURIComponent(a.personId)+'"><span class="fchipcol"><span class="fdot" style="background:'+c[1]+'"></span><span class="ftype">'+esc(a.type)+'</span></span><div class="fmain"><div class="ftop"><span class="fwho">'+esc(a.personName)+'</span>'+(a.company?('<span class="fco">'+esc(a.company)+'</span>'):'')+(a.by?('<span class="fby">· '+esc(a.by)+'</span>'):'')+'<span class="fwhen">'+esc(fmt(a.at))+'</span></div>'+(a.note?('<div class="fnote">'+esc(a.note)+'</div>'):'')+'</div></a>';
  }).join('');
}).catch(function(){ document.getElementById('feed').innerHTML='<div class="empty">Could not load the feed.</div>'; });
}
document.querySelectorAll('.scbtn[data-scope]').forEach(function(b){ b.addEventListener('click',function(){ SCOPE=b.getAttribute('data-scope'); document.querySelectorAll('.scbtn[data-scope]').forEach(function(x){x.classList.toggle('on',x===b);}); load(); }); });
var _st=document.getElementById('sysToggle'); if(_st) _st.addEventListener('click',function(){ HIDE_SYSTEM=!HIDE_SYSTEM; try{ localStorage.setItem('rrgFeedHideSystem',HIDE_SYSTEM?'1':'0'); }catch(e){} syncSysBtn(); load(); }); syncSysBtn();
var _tf=document.getElementById('typeFilter'); if(_tf) _tf.addEventListener('change',function(){ TYPEF=_tf.value; load(); });
var _uf2=document.getElementById('userFilter'); if(_uf2) _uf2.addEventListener('change',function(){ USERF=_uf2.value; renderViews(); load(); });

/* ---- Saved views rail ---- */
var VIEWS=[];
try{ VIEWS=JSON.parse(localStorage.getItem('rrgFeedViews')||'[]')||[]; }catch(e){ VIEWS=[]; }
if(!Array.isArray(VIEWS)) VIEWS=[];
function saveViews(){ try{ localStorage.setItem('rrgFeedViews', JSON.stringify(VIEWS)); }catch(e){} }
function curSig(){ return JSON.stringify({s:SCOPE,h:HIDE_SYSTEM,t:TYPEF,u:USERF}); }
function viewSig(v){ return JSON.stringify({s:v.scope,h:v.hideSystem,t:v.type,u:v.user}); }
function viewSub(v){ var p=[]; if(v.scope==='mine') p.push('My activity'); if(v.type) p.push(v.type); if(v.user) p.push('user'); p.push(v.hideSystem?'system off':'system on'); return p.join(' · '); }
function reflectControls(){
  document.querySelectorAll('.scbtn[data-scope]').forEach(function(x){ x.classList.toggle('on', x.getAttribute('data-scope')===SCOPE); });
  syncSysBtn();
  var tf=document.getElementById('typeFilter'); if(tf) tf.value=TYPEF;
  var uf=document.getElementById('userFilter'); if(uf) uf.value=USERF;
}
function renderViews(){
  var host=document.getElementById('viewList'); if(!host) return;
  var rc=document.getElementById('rcnt'); if(rc) rc.textContent=VIEWS.length?String(VIEWS.length):'';
  if(!VIEWS.length){ host.innerHTML='<div class="railempty">No saved views yet. Set the filters you like, then <b>Save this view</b> to jump back to it in one click.</div>'; return; }
  var sig=curSig();
  host.innerHTML=VIEWS.map(function(v){ return '<div class="viewitem'+(viewSig(v)===sig?' on':'')+'" data-id="'+esc(v.id)+'"><div class="vname"><b>'+esc(v.name)+'</b><div class="vsub">'+esc(viewSub(v))+'</div></div><span class="vx" data-del="'+esc(v.id)+'" title="Delete view">×</span></div>'; }).join('');
  host.querySelectorAll('.viewitem').forEach(function(el){ el.addEventListener('click',function(e){ if(e.target.closest('[data-del]')) return; applyView(el.getAttribute('data-id')); }); });
  host.querySelectorAll('[data-del]').forEach(function(x){ x.addEventListener('click',function(e){ e.stopPropagation(); delView(x.getAttribute('data-del')); }); });
}
function applyView(id){ var v=VIEWS.filter(function(x){return x.id===id;})[0]; if(!v) return; SCOPE=v.scope||'all'; HIDE_SYSTEM=!!v.hideSystem; TYPEF=v.type||''; USERF=v.user||''; try{ localStorage.setItem('rrgFeedHideSystem',HIDE_SYSTEM?'1':'0'); }catch(e){} reflectControls(); renderViews(); load(); }
function delView(id){ VIEWS=VIEWS.filter(function(x){return x.id!==id;}); saveViews(); renderViews(); }
function openSaveForm(){ var f=document.getElementById('saveForm'); if(!f) return; f.classList.add('on'); var i=document.getElementById('viewName'); if(i){ i.value=''; i.focus(); } }
function closeSaveForm(){ var f=document.getElementById('saveForm'); if(f) f.classList.remove('on'); }
function commitSave(){ var i=document.getElementById('viewName'); var nm=(i&&i.value||'').trim(); if(!nm){ if(i) i.focus(); return; } VIEWS.push({ id:'v'+Date.now()+Math.floor(Math.random()*1000), name:nm, scope:SCOPE, hideSystem:HIDE_SYSTEM, type:TYPEF, user:USERF }); saveViews(); closeSaveForm(); renderViews(); }
(function(){ var b=document.getElementById('saveViewBtn'); if(b) b.addEventListener('click',openSaveForm); var s=document.getElementById('sfSave'); if(s) s.addEventListener('click',commitSave); var c=document.getElementById('sfCancel'); if(c) c.addEventListener('click',closeSaveForm); var i=document.getElementById('viewName'); if(i) i.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); commitSave(); } else if(e.key==='Escape'){ e.preventDefault(); closeSaveForm(); } }); })();
renderViews();

// keep the rail's active highlight + control mirror in sync when filters change directly
var _origLoad=load;
load=function(){ reflectControls(); renderViews(); return _origLoad.apply(this,arguments); };

load();
</script>
</body>
</html>
