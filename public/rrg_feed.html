<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRG — Activity Feed</title>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--ink:#1d2739;--muted:#6b7488;--soft:#98a1b5;--line:#e9edf3;--green:#1f8a5b;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#f4f6fa;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;}
.wrap{max-width:900px;margin:22px auto;padding:0 24px 70px;}
.pgh{font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-.01em;margin:0 0 4px;}
.pgs{color:var(--muted);font-size:13.5px;margin-bottom:18px;}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.04);overflow:hidden;}
.feedrow{display:flex;gap:12px;align-items:flex-start;padding:15px 20px;border-top:1px solid #eef1f6;text-decoration:none;color:inherit;}
.feedrow:first-child{border-top:none;} .feedrow:hover{background:#fbfcfe;}
.fchipcol{flex:none;width:140px;display:flex;align-items:center;gap:8px;}
.fdot{width:9px;height:9px;border-radius:50%;flex:none;}
.ftype{font-size:12px;font-weight:600;color:#42506b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fby{font-size:12px;color:#5b6472;font-weight:700;}
.fmain{flex:1;min-width:0;}
.ftop{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;}
.fwho{font-size:14px;font-weight:600;color:var(--ink);}
.fco{font-size:12.5px;color:var(--muted);}
.fwhen{font-size:12px;color:var(--soft);margin-left:auto;}
.fnote{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5;}
.empty{color:var(--soft);font-size:13.5px;padding:40px 20px;text-align:center;}
.scoperow{display:flex;gap:8px;margin-bottom:14px;}
.scbtn{border:1px solid #cfd6e2;background:#fff;color:var(--ink);border-radius:100px;padding:6px 15px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;}
.scbtn.on{background:var(--navy);border-color:var(--navy);color:#fff;}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<div class="wrap">
  <h1 class="pgh">Activity Feed</h1>
  <div class="pgs">Everything happening across your book — the latest calls, tours, notes, emails and agreements, newest first.</div>
  <div class="scoperow" id="scoperow"><button class="scbtn on" data-scope="all" style="display:none">All activity</button><button class="scbtn" data-scope="mine" style="display:none">My activity</button><button class="scbtn on" id="sysToggle" title="Show or hide automated system activity">System activity: On</button><select id="userFilter" style="display:none;margin-left:8px;font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line,#e6e9f0);border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink);cursor:pointer"><option value="">All users</option></select><select id="typeFilter" style="margin-left:8px;font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line,#e6e9f0);border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink);cursor:pointer"><option value="">All types</option></select></div>
  <div class="card" id="feed"><div class="empty">Loading…</div></div>
</div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function fmt(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d.getTime())) return String(iso); return (d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(2); }
function actColor(t){ var m={'Tour':['#eef2fb','#2647b0'],'Photo Shoot':['#f1ebfb','#6d28d9'],'Meal':['#fdf1df','#b5791f'],'Text':['#e6f5f3','#0f766e'],'Call':['#e7f5ee','#1f8a5b'],'Email':['#eef2fb','#3949ab'],'Form Submitted':['#eef1f6','#5b6472'],'Contact Added':['#e7f5ee','#1f8a5b'],'Agreement Sent':['#fff4e6','#b9761a'],'Agreement Signed':['#e7f5ee','#1f8a5b'],'LOI Sent':['#e9f1ff','#1d6fd6'],'LOI Received':['#eef7ee','#2f9e50'],'Diligence':['#eef2fb','#2647b0'],'Note':['#eef1f6','#5b6472'],'To-Do':['#fdeceb','#DA2B1F']}; return m[t]||['#eef1f6','#5b6472']; }
var SCOPE='all', HIDE_SYSTEM=false, ALLITEMS=[], TYPEF='', USERF='';
try{ HIDE_SYSTEM=(localStorage.getItem('rrgFeedHideSystem')==='1'); }catch(e){}
function syncSysBtn(){ var b=document.getElementById('sysToggle'); if(!b) return; b.textContent='System activity: '+(HIDE_SYSTEM?'Off':'On'); b.classList.toggle('on',!HIDE_SYSTEM); }
function buildTypeFilter(){ var sel=document.getElementById('typeFilter'); if(!sel) return; var types={}; ALLITEMS.forEach(function(a){ if(a.type) types[a.type]=1; }); sel.innerHTML='<option value="">All types</option>'+Object.keys(types).sort().map(function(t){ return '<option value="'+esc(t)+'"'+(t===TYPEF?' selected':'')+'>'+esc(t)+'</option>'; }).join(''); }
function buildUserFilter(users){ var sel=document.getElementById('userFilter'); if(!sel) return; sel.innerHTML='<option value="">All users</option>'+(users||[]).map(function(u){ return '<option value="'+esc(u.username)+'"'+(u.username===USERF?' selected':'')+'>'+esc(u.name)+'</option>'; }).join(''); }
function load(){
  var _qs=[]; if(SCOPE==='mine') _qs.push('scope=mine'); if(USERF) _qs.push('user='+encodeURIComponent(USERF)); fetch('/api/feed'+(_qs.length?('?'+_qs.join('&')):''),{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){
  if(j&&j.canScope){ document.querySelectorAll('#scoperow [data-scope]').forEach(function(b){ b.style.display=''; }); var _uf=document.getElementById('userFilter'); if(_uf) _uf.style.display=''; buildUserFilter(j.users); }
  var el=document.getElementById('feed');
  ALLITEMS=((j&&j.items)||[]); buildTypeFilter();
  var items=ALLITEMS.filter(function(a){ return (HIDE_SYSTEM?!a.system:true) && (!TYPEF||a.type===TYPEF); });
  if(!items.length){ el.innerHTML='<div class="empty">'+(TYPEF?('No '+esc(TYPEF)+' activity'+(HIDE_SYSTEM?' (system activity is hidden)':'')+'.'):'No activity logged across your contacts yet. Log a call, tour, or note on a contact and it shows up here.')+'</div>'; return; }
  el.innerHTML=items.map(function(a){
    var c=actColor(a.type);
    if(a.system||!a.personId){ return '<div class="feedrow" style="cursor:default"><span class="fchipcol"><span class="fdot" style="background:'+c[1]+'"></span><span class="ftype">'+esc(a.type)+'</span></span><div class="fmain"><div class="ftop"><span class="fwho">'+esc(a.note||a.type)+'</span>'+(a.by?('<span class="fby">· '+esc(a.by)+'</span>'):'')+'<span class="fwhen">'+esc(fmt(a.at))+'</span></div></div></div>'; }
    return '<a class="feedrow" href="./rrg_person.html?id='+encodeURIComponent(a.personId)+'"><span class="fchipcol"><span class="fdot" style="background:'+c[1]+'"></span><span class="ftype">'+esc(a.type)+'</span></span><div class="fmain"><div class="ftop"><span class="fwho">'+esc(a.personName)+'</span>'+(a.company?('<span class="fco">'+esc(a.company)+'</span>'):'')+(a.by?('<span class="fby">· '+esc(a.by)+'</span>'):'')+'<span class="fwhen">'+esc(fmt(a.at))+'</span></div>'+(a.note?('<div class="fnote">'+esc(a.note)+'</div>'):'')+'</div></a>';
  }).join('');
}).catch(function(){ document.getElementById('feed').innerHTML='<div class="empty">Could not load the feed.</div>'; });
}
document.querySelectorAll('.scbtn[data-scope]').forEach(function(b){ b.addEventListener('click',function(){ SCOPE=b.getAttribute('data-scope'); document.querySelectorAll('.scbtn[data-scope]').forEach(function(x){x.classList.toggle('on',x===b);}); load(); }); });
var _st=document.getElementById('sysToggle'); if(_st) _st.addEventListener('click',function(){ HIDE_SYSTEM=!HIDE_SYSTEM; try{ localStorage.setItem('rrgFeedHideSystem',HIDE_SYSTEM?'1':'0'); }catch(e){} syncSysBtn(); load(); }); syncSysBtn();
var _tf=document.getElementById('typeFilter'); if(_tf) _tf.addEventListener('change',function(){ TYPEF=_tf.value; load(); });
var _uf2=document.getElementById('userFilter'); if(_uf2) _uf2.addEventListener('change',function(){ USERF=_uf2.value; load(); });
load();
</script>
</body>
</html>
