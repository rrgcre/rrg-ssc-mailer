<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lavano — Space & Assets</title>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--ink:#1a2236;--muted:#6b7488;--soft:#8a93a8;--line:#e6e9f0;--wash:#f5f7fb;--green:#1f8a5b;--inp:#cfd6e2;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#eef1f6;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);}
.top{color:#fff;padding:22px 0 22px;background:radial-gradient(95% 130% at 28% 15%, #1c2e5c 0%, #112044 42%, #0b1636 70%, #071029 100%);}
.top-in{max-width:940px;margin:0 auto;padding:0 26px;}
.brand{display:inline-flex;align-items:center;cursor:pointer;} .disc{background:var(--red);color:#fff;border-radius:50%;width:38px;height:38px;font-family:'Arial Black',Arial,sans-serif;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;letter-spacing:-.04em;}
.bar{background:#fff;width:3px;height:26px;margin:0 11px;} .wm{font-weight:800;font-size:13px;text-transform:uppercase;line-height:.95;color:#fff;}
.crumb{margin-top:16px;font-size:12.5px;color:#aeb8cf;} .crumb a{color:#cdd7ea;text-decoration:none;font-weight:700;} .crumb a:hover{text-decoration:underline;}
.kicker{margin:14px 0 3px;color:var(--red);font-weight:700;letter-spacing:.28em;font-size:10.5px;text-transform:uppercase;}
.top h1{font-size:25px;font-weight:800;margin:0;color:#fff;letter-spacing:-.01em;}
.sub{color:#aeb8cf;font-size:12.5px;margin-top:6px;max-width:640px;}
.wrap{max-width:940px;margin:20px auto;padding:0 26px 90px;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(11,26,56,.06);overflow:hidden;margin-bottom:16px;}
.ch{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);background:#fbfcfe;} .ch b{color:var(--navy);font-size:14px;} .ch .core{font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#b23a2c;background:#fdeceb;border:1px solid #f4c9c4;border-radius:100px;padding:2px 8px;} .ch .gh{margin-left:auto;font-size:11.5px;color:var(--soft);font-weight:600;}
.body{padding:16px 20px 20px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;} @media(max-width:640px){.row2{grid-template-columns:1fr;}}
.fld{margin-bottom:14px;} .fld:last-child{margin-bottom:0;} .fld label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:800;margin-bottom:6px;} .fld label .dot{color:var(--red);margin-left:3px;}
.fld input[type=text], .fld textarea{font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--inp);border-radius:9px;width:100%;color:var(--ink);background:#fff;}
.fld textarea{min-height:74px;resize:vertical;line-height:1.5;}
.fld.need input, .fld.need textarea{border-color:#e6b4ae;background:#fffafa;}
.hint{font-size:11.5px;color:var(--soft);margin-top:5px;line-height:1.45;}
.btn{font:inherit;font-size:13px;font-weight:700;padding:9px 16px;border:1px solid var(--inp);border-radius:9px;background:#fff;color:var(--navy);cursor:pointer;}
.btn:hover{background:#f4f7fb;} .btn.sm{padding:7px 12px;font-size:12.5px;}
.btn.red{background:var(--red);color:#fff;border-color:var(--red);} .btn.red:hover{filter:brightness(1.08);}
.btn.ghost{background:#fff;}
.msg{font-size:12.5px;font-weight:700;} .msg.ok{color:var(--green);} .msg.err{color:var(--red);}
.row2{margin-bottom:14px;} .row2:last-child{margin-bottom:0;}
.ffebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.ffewarn{background:#fff5e6;border:1px solid #f0d9a8;color:#7a5713;border-radius:9px;padding:9px 12px;font-size:12.5px;line-height:1.45;margin-bottom:10px;font-weight:600;}
.ffeempty{border:1px dashed var(--inp);border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5;}
.ffewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;}
.ffet{width:100%;border-collapse:collapse;font-size:13px;min-width:760px;}
.ffet th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:800;padding:8px 6px;background:#fbfcfe;border-bottom:1px solid var(--line);}
.ffet td{padding:4px 6px;border-top:1px solid #f2f4f8;vertical-align:top;}
.ffet input,.ffet select{font:inherit;font-size:12.5px;padding:6px 7px;border:1px solid transparent;border-radius:6px;width:100%;background:transparent;color:var(--ink);}
.ffet input:hover,.ffet select:hover,.ffet input:focus,.ffet select:focus{border-color:var(--inp);background:#fff;outline:none;}
.ffet input.nt{font-size:11.5px;color:var(--muted);padding-top:2px;}
.ffet input.q{text-align:right;}
.ffet .c{text-align:center;} .ffet input[type=checkbox]{width:auto;margin-top:8px;}
.ffet select.own.confirm{color:#9a6a0b;font-weight:700;} .ffet select.own.leased{color:var(--red);font-weight:700;} .ffet select.own.owned{color:var(--green);font-weight:700;}
.ffet tr.exc td{opacity:.55;} .ffet tr.exc input[data-f="item"]{text-decoration:line-through;}
.ffet .x{border:0;background:none;color:var(--soft);cursor:pointer;font-size:13px;padding:7px 4px;} .ffet .x:hover{color:var(--red);}
.datef{display:flex;gap:6px;position:relative;} .datef input[type=text]{flex:1;} .datef .cal{flex:none;width:42px;border:1px solid var(--inp);border-radius:9px;background:#fff;cursor:pointer;font-size:16px;color:var(--navy);} .datef .cal:hover{background:#f4f7fb;}
.datef input[type=date]{position:absolute;right:0;bottom:0;width:42px;height:1px;opacity:0;pointer-events:none;border:0;padding:0;}
.kitgrid{display:grid;grid-template-columns:1fr 1fr;gap:28px;} @media(max-width:760px){.kitgrid{grid-template-columns:1fr;}}
.kgh{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--navy);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--line);}
.kit{display:flex;align-items:center;gap:8px;min-height:32px;}
.kit label{flex:1;display:flex !important;align-items:center;gap:7px;margin:0 !important;font-size:13px !important;text-transform:none !important;letter-spacing:0 !important;color:var(--ink) !important;font-weight:500 !important;cursor:pointer;white-space:nowrap;}
.kit.on label{font-weight:700 !important;color:var(--navy) !important;}
.kit input[type=checkbox]{width:15px;height:15px;accent-color:var(--navy);margin:0;}
.fld .kit input.kd{width:112px;flex:none;font:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;color:var(--ink);}
.kitgrid{margin-top:4px;}
.fld .kit:not(.on) input.kd{background:#fafbfd;}
.qadd{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;background:#fcfdfe;}
.qhd{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);margin-bottom:6px;}
.qrow{display:flex;align-items:flex-start;gap:10px;padding:4px 0;} .qrow+.qrow{border-top:1px dashed #edf0f5;}
.qlbl{flex:none;width:96px;font-size:11.5px;font-weight:700;color:var(--navy);padding-top:5px;} .qchips{display:flex;flex-wrap:wrap;gap:6px;}
.qchip{font:inherit;font-size:12px;font-weight:600;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:#fbfcfe;color:var(--navy);cursor:pointer;} .qchip:hover{border-color:var(--inp);background:#f1f4f9;} .qchip.added{background:#e8f6ef;border-color:#bfe6d0;color:var(--green);}
.fld label.subh{font-size:12px;color:var(--navy);letter-spacing:.04em;margin-bottom:10px;}
.sep{height:1px;background:var(--line);margin:18px -20px;}
.ch{cursor:pointer;user-select:none;} .ch:hover{background:#f5f7fb;}
.ch .chev{display:inline-block;color:var(--soft);font-size:18px;line-height:1;width:12px;transform:rotate(90deg);transition:transform .15s;font-weight:700;}
.card.closed .chev{transform:rotate(0deg);} .card.closed .body{display:none;} .card.closed .ch{border-bottom:0;}
.ch .gst{flex:none;} .st{font-size:11px;font-weight:800;border-radius:100px;padding:3px 9px;white-space:nowrap;}
.st.need{color:#9a5b0b;background:#fff3e0;} .st.done{color:var(--green);background:#e8f6ef;} .st.part{color:var(--navy);background:#eef2f9;} .st.opt{color:var(--soft);background:#f3f5f9;}
@media(max-width:700px){ .ch .gh{display:none;} .ch .gst{margin-left:auto;} }
.banner .jump{color:inherit;text-decoration:underline;text-underline-offset:2px;} .banner .togall{float:right;color:var(--navy);font-weight:700;font-size:12px;text-decoration:none;margin-left:14px;}
.kgh .kreq{float:right;color:var(--red);font-size:9.5px;letter-spacing:.03em;text-transform:none;font-weight:700;}
.wt{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:12px;text-decoration:none;color:var(--ink);box-shadow:0 4px 14px rgba(11,26,56,.04);}
.wt:hover{border-color:var(--inp);} .wti{font-size:20px;} .wt b{display:block;color:var(--navy);font-size:13.5px;} .wts{display:block;font-size:12px;color:var(--soft);margin-top:1px;} .wtg{margin-left:auto;color:var(--soft);font-size:20px;}
@media(min-width:900px){ .wt{padding:9px 14px;} }
.fld select.sel{font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--inp);border-radius:9px;width:100%;color:var(--ink);background:#fff;}
.fld.need select.sel{border-color:#e6b4ae;background:#fffafa;}
.vref{border:1px solid #dfe5f0;background:#f7f9fd;border-radius:10px;padding:10px 14px;margin-bottom:14px;}
.vrh{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin-bottom:4px;}
.vref>div:not(.vrh){display:flex;align-items:baseline;gap:10px;padding:5px 0;flex-wrap:wrap;} .vref>div+div:not(.vrh){border-top:1px dashed #e3e8f1;}
.vref span{width:150px;font-size:12.5px;color:var(--muted);font-weight:600;} .vref b{font-size:15px;color:var(--navy);} .vref i{font-style:normal;font-size:12px;color:var(--soft);} .vref a{margin-left:auto;font-size:12px;font-weight:700;color:var(--navy);text-decoration:none;}
.gate{padding:50px 24px;text-align:center;color:var(--muted);font-size:14px;}
.banner{border-radius:12px;padding:12px 16px;font-size:13px;font-weight:600;margin-bottom:16px;line-height:1.5;}
.banner.done{background:#eaf7f0;border:1px solid #bfe6d0;color:#1a6e46;}
.banner.need{background:#fff5e6;border:1px solid #f0d9a8;color:#7a5713;}
.actbar{position:sticky;bottom:0;background:linear-gradient(#fff9,#fff);backdrop-filter:blur(4px);border-top:1px solid var(--line);padding:12px 0;margin-top:8px;display:flex;align-items:center;gap:12px;}
.rrg-back{position:fixed;left:16px;bottom:16px;z-index:99999;display:inline-flex;align-items:center;gap:7px;background:rgba(0,14,49,.85);color:#fff;text-decoration:none;font:700 12.5px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;padding:10px 15px;border-radius:100px;border:1px solid rgba(255,255,255,.22);box-shadow:0 6px 20px rgba(0,0,0,.28);}
</style>

<body>
<a href="#" onclick="goBack();return false;" class="rrg-back" aria-label="Back"><span style="font-size:14px;line-height:1">←</span> Back</a>
<div class="top"><div class="top-in">
  <span class="brand" onclick="location.href='./index.html'"><span class="disc">RRG</span><span class="bar"></span><span class="wm">Restaurant<br>Realty<br>Group</span></span>
  <div class="crumb"><a href="#" onclick="goBack();return false;">Listing</a> &nbsp;›&nbsp; <span id="crumb">Space &amp; Assets</span></div>
  <div class="kicker">Space &amp; Assets</div>
  <h1 id="h1">Space &amp; Assets</h1>
  <div class="sub">The turnkey listing sheet — what conveys, the lease and the space. The starred fields are what a space buyer asks first; fill those and you're market-ready. Everything else is optional.</div>
</div></div>
<div class="wrap"><div id="root"><div class="gate">Loading…</div></div></div>
<script>
function qs(k){ try{ return new URLSearchParams(location.search).get(k)||''; }catch(e){ return ''; } }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function api(m,u,b){return fetch(u,{method:m,credentials:'same-origin',headers:b?{'Content-Type':'application/json'}:undefined,body:b?JSON.stringify(b):undefined}).then(function(r){return r.json();});}
var KEY=qs('key');
function goBack(){ try{ if(window.top!==window.self){ var x=window.parent.document.querySelector('#rrgPanelOv [data-x]'); if(x){ x.click(); return; } } }catch(e){} if(history.length>1){ history.back(); } else if(KEY){ location.href='./rrg_assignment.html?key='+encodeURIComponent(KEY); } else { location.href='./index.html'; } }

// Field definition — mirrors the server's ASSET_SPEC_FIELDS. a=textarea, core=required block.
var GROUPS=[
  {title:'The headline', fields:[
    {k:'askingPrice', l:'Asking price', ph:'$185,000', money:1},
    {k:'reason', l:'Reason for availability', ph:'Pick a reason or type your own', list:['Owner retiring','Owner relocating','Focusing on other locations','Closing the concept','Changing concepts','Lease expiring','Partnership change','Personal reasons']},
    {k:'availableDate', l:'Target availability / delivery date', ph:'Pick a date · or 60 days after closing', date:1}
  ]},
  {title:'What conveys', core:1, convey:1, hint:'Improvements convey with assignment of the lease. Equipment is sold by bill of sale.', fields:[
    {k:'buildoutAge', l:'Buildout age', ph:'Built out 2019'},
    {k:'replacementCost', l:'Est. replacement cost', ph:'~$450k to replicate'},
    {k:'smallwares', l:'Smallwares / POS / furniture (older listings)', ph:'', legacy:1},
    {k:'exclusions', l:'Excluded — seller keeps', a:1, ph:'Anything the seller is taking: art, the neon sign, the smoker… Items marked “Seller keeps” in the schedule are listed automatically.'},
    {k:'conveys', l:'Other notes on what conveys', a:1, ph:'Anything else a buyer should know about what is included'}
  ]},
  {title:'The lease', core:1, hint:'The heart of a space deal — how much time is left and how the landlord handles an assignment.', fields:[
    {k:'leaseRent', l:'Current base rent', core:1, ph:'$6,200 / mo'},
    {k:'leasePerSF', l:'Rent per SF', ph:'$38 / SF'},
    {k:'leaseRemaining', l:'Remaining term', core:1, ph:'4 yrs 3 mos'},
    {k:'leaseExpiration', l:'Lease expiration', ph:'Mar 2030'},
    {k:'leaseOptions', l:'Renewal options', ph:'Two 5-yr options · 6-mo notice'},
    {k:'leaseAssignment', l:'Assignment & landlord consent', core:1, a:1, ph:"Landlord's posture, the consent process, transfer fees, any personal guaranty…"},
    {k:'leaseNNN', l:'NNN / CAM · taxes · insurance', ph:'$9 / SF NNN'},
    {k:'leaseDeposit', l:'Security deposit / key money to landlord', ph:'$6,200 deposit · $25k key money'},
    {k:'leaseUse', l:'Permitted use / exclusives', ph:'Full-service restaurant; no exclusives'},
    {k:'leaseFixtures', l:'Fixtures at lease end', ph:'Pick one or cite the lease section', list:['Stay with the space','Tenant may remove','Tenant must remove','Per lease — see section']}
  ]},
  {title:'The space', core:1, fields:[
    {k:'address', l:'Address', full:1, ph:'Street, city, state ZIP'},
    {k:'spaceType', l:'Space type', core:1, sel:'spaceTypes'},
    {k:'centerType', l:'Center type', sel:'centerTypes'},
    {k:'centerName', l:'Center / building name', ph:'The Rim · or n/a for freestanding'},
    {k:'coTenants', l:'Anchors & co-tenants', ph:'H-E-B, Starbucks, Chase'},
    {k:'sqft', l:'Interior square footage', core:1, ph:'2,800 SF'},
    {k:'seating', l:'Seating capacity', ph:'90 interior'},
    {k:'deliveryCondition', l:'Delivery condition', core:1, ph:'As-is, fully equipped'},
    {k:'operatingNow', l:'Operating or dark now', ph:'Operating · or Dark since June'},
    {k:'frontage', l:'Frontage, signage & traffic', ph:'Faces Loop 1604 · monument sign · 45k cars/day'},
    {k:'parking', l:'Parking', ph:'120 shared spaces · 5 / 1,000 SF'}
  ]},
  {title:'Permits & occupancy', fields:[
    {k:'coOccupancy', l:'Certificate of occupancy / load', ph:'CO on file · occupancy 110'},
    {k:'healthPermit', l:'Health / venting permits', ph:'Current health permit'}
  ]},
  {title:'Utilities & infrastructure', fields:[
    {k:'electrical', l:'Electrical service', ph:'400A · 3-phase'},
    {k:'hvac', l:'HVAC', ph:'15 tons · 2 units'},
    {k:'waterSewer', l:'Water / sewer / grease', ph:'2" water · 1,500-gal interceptor'}
  ]},
  {title:'Marketing assets', fields:[
    {k:'photosNote', l:'Photos', ph:'Link or note — where the photos live'},
    {k:'floorplanNote', l:'Floor plan', ph:'Link or note'},
    {k:'videoNote', l:'Walkthrough video', ph:'Link (optional)'}
  ]}
];
var VREF={};
function vrefHtml(){ var r=[];
  if(VREF.bov) r.push('<div><span>BOV'+(VREF.bov.final?'':' (draft)')+'</span><b>'+esc(VREF.bov.target||VREF.bov.range)+'</b>'+(VREF.bov.target&&VREF.bov.range?'<i>Range '+esc(VREF.bov.range)+'</i>':'')+'<a href="./rrg_bov_generate.html?bov='+encodeURIComponent(VREF.bov.id)+'" target="_blank">Open ↗</a></div>');
  if(VREF.letter) r.push('<div><span>Opinion of value</span><b>'+esc(VREF.letter.value)+'</b><i>'+esc(({draft:'Draft',pending:'Awaiting approval',approved:'Approved',sent:'Sent'})[VREF.letter.status]||VREF.letter.status)+(VREF.letter.at?(' · '+esc(_fmtDate(VREF.letter.at))):'')+'</i></div>');
  if(VREF.listPrice) r.push('<div><span>Agreed asking price</span><b>'+esc(VREF.listPrice)+'</b></div>');
  return r.length?'<div class="vref"><div class="vrh">For reference — internal, not on the spec sheet</div>'+r.join('')+'</div>':''; }
var OPTS={spaceTypes:['End cap','Inline','Pad / Outparcel','Freestanding'],centerTypes:['Grocery-anchored','Power / big-box','Lifestyle / mixed-use','Strip / unanchored','Freestanding pad','Downtown / street retail','Mall / food court','Entertainment / hospitality node','Other']};
var CORE=['spaceType','leaseRent','leaseRemaining','leaseAssignment','sqft','deliveryCondition','hood','ffeSchedule'];
var CORE_LABEL={ffeSchedule:'Equipment schedule — what conveys', hood:'Hood — Type I, Type II or No hood'};
GROUPS.forEach(function(g){ g.fields.forEach(function(f){ if(f.core) CORE_LABEL[f.k]=f.l; }); });
var SPEC={}, BIZ='', DIRTY=false;

function fieldHtml(f){
  var v=SPEC[f.k]||'';
  if(f.legacy && !String(v).trim()) return '';
  var lab='<label>'+esc(f.l)+(f.core?'<span class="dot">★</span>':'')+'</label>';
  var need=(f.core && !String(v).trim())?' need':'';
  if(f.date){ return '<div class="fld" data-fk="'+f.k+'">'+lab+'<div class="datef"><input type="text" data-k="'+f.k+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'"><button type="button" class="cal" data-cal="'+f.k+'" title="Pick a date">📅</button><input type="date" data-calfor="'+f.k+'" tabindex="-1" aria-hidden="true"></div></div>'; }
  if(f.sel){ var os=OPTS[f.sel]||[]; if(v && os.indexOf(v)<0) os=os.concat([v]); return '<div class="fld'+((f.core&&!String(v).trim())?' need':'')+'" data-fk="'+f.k+'">'+lab+'<select data-k="'+f.k+'" class="sel"><option value="">Select…</option>'+os.map(function(o){ return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>'; }).join('')+'</select></div>'; }
  if(f.list){ return '<div class="fld" data-fk="'+f.k+'">'+lab+'<input type="text" data-k="'+f.k+'" list="dl_'+f.k+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'" autocomplete="off"><datalist id="dl_'+f.k+'">'+f.list.map(function(o){return '<option value="'+esc(o)+'">';}).join('')+'</datalist></div>'; }
  var ctrl=f.a
    ? '<textarea data-k="'+f.k+'" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea>'
    : '<input type="text" data-k="'+f.k+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'">';
  return '<div class="fld'+need+'" data-fk="'+f.k+'">'+lab+ctrl+'</div>';
}
function groupHtml(g){
  var wide=g.fields.filter(function(f){return f.a;});
  // Two-column for the short inputs, full width for textareas — grouped in visual order.
  var rows='', buf=[];
  function flush(){ if(!buf.length) return; rows+='<div class="row2">'+buf.join('')+'</div>'; buf=[]; }
  g.fields.forEach(function(f){ if(f.a||f.full){ flush(); rows+=fieldHtml(f); } else { buf.push(fieldHtml(f)); if(buf.length===2) flush(); } });
  flush();
  if(GROUPS.indexOf(g)===0) rows=vrefHtml()+rows;
  if(g.convey) rows=kitHtml()+'<div class="sep"></div>'+ffeHtml()+'<div class="sep"></div>'+rows;
  var gi=GROUPS.indexOf(g), open=_isOpen(gi);
  return '<div class="card'+(open?'':' closed')+'" data-gi="'+gi+'"><div class="ch" data-tog="'+gi+'"><span class="chev">›</span><b>'+esc(g.title)+'</b>'+(g.core?'<span class="core">Core</span>':'')+(g.hint?'<span class="gh">'+esc(g.hint)+'</span>':'<span class="gh"></span>')+'<span class="gst" data-gst="'+gi+'">'+groupStatus(g)+'</span></div><div class="body">'+rows+'</div></div>';
}

    if(j.saleLane && j.saleLane!=='asset'){ document.getElementById('root').innerHTML='<div class="gate">This listing is a Business Sale, not a Space &amp; Assets listing. <a href="./rrg_assignment.html?key='+encodeURIComponent(KEY)+'" style="color:var(--navy);font-weight:700">Open its workspace →</a></div>'; return; }
    render();
  }).catch(function(){ document.getElementById('root').innerHTML='<div class="gate">Could not load this listing.</div>'; });
})();
window.addEventListener('beforeunload', function(e){ if(DIRTY){ e.preventDefault(); e.returnValue=''; } });
