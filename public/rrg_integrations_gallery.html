<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullServe — Integrations</title>
<style>
:root{--bg:#eef1f7;--card:#fff;--line:#e3e8f1;--ink:#14213d;--dim:#66738f;--faint:#93a0ba;--navy:#16346e;--blue:#2f6fd0;--green:#1f8a5b;--red:#DA2B1F;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.top{background:radial-gradient(90% 130% at 25% 10%,#22346a,#152752 42%,#0b1636 72%,#060f26 100%);color:#fff;padding:26px 0 24px;}
.top-in{max-width:1180px;margin:0 auto;padding:0 24px;}
.disc{background:var(--red);color:#fff;border-radius:50%;width:40px;height:40px;font-family:'Arial Black',Arial;font-weight:900;font-size:13px;display:inline-flex;align-items:center;justify-content:center;letter-spacing:-.04em;cursor:pointer;}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8fa2c4;font-weight:800;margin:14px 0 4px;}
h1{margin:0;font-size:27px;font-weight:800;} .sub{color:#aeb8cf;font-size:13px;margin-top:6px;max-width:720px;line-height:1.5;}
.crumb{font-size:12px;color:#9fb0d0;font-weight:600;margin-bottom:12px;} .crumb a{color:#c7d3ea;text-decoration:none;} .crumb a:hover{color:#fff;text-decoration:underline;} .crumb span{color:#6a7ba0;margin:0 7px;}
.navcrumb{display:none;max-width:1180px;margin:16px auto -2px;padding:0 24px;font-size:12.5px;color:#66738f;font-weight:600;} body.rrg-shelled .navcrumb{display:block;} .navcrumb a{color:#2f6fd0;text-decoration:none;} .navcrumb a:hover{text-decoration:underline;} .navcrumb span{color:#93a0ba;margin:0 7px;}
.wrap{max-width:1180px;margin:24px auto;padding:0 24px 90px;}
.secttl{font-size:13px;font-weight:800;color:var(--navy);letter-spacing:.02em;margin:8px 0 14px;display:flex;align-items:center;gap:8px;} .secttl:not(:first-child){margin-top:34px;}
.secttl .ct{font-size:11px;color:var(--faint);font-weight:700;background:#e7ecf4;border-radius:100px;padding:2px 9px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:15px;}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(16,32,70,.05);display:flex;flex-direction:column;transition:box-shadow .15s,border-color .15s,transform .15s;}
.tile:hover{border-color:#cdd8ea;box-shadow:0 10px 28px rgba(16,32,70,.10);transform:translateY(-2px);}
.thead{padding:16px 16px 15px;display:flex;align-items:flex-start;gap:12px;color:#fff;min-height:78px;}
.tico{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.12);overflow:hidden;}
.tico svg{display:block;} .tico .lm{font-weight:900;font-size:18px;font-family:'Arial Black',Arial;}
.tname{font-size:15px;font-weight:800;line-height:1.15;} .tdesc{font-size:11.5px;color:rgba(255,255,255,.92);margin-top:3px;line-height:1.4;font-weight:500;}
.tbody{padding:12px 16px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;background:#fff;}
.badge{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:100px;}
.badge.on{background:#eaf5ef;color:var(--green);border:1px solid #bfe6d1;} .badge.soon{background:#f2f4f8;color:#7a869c;border:1px solid #e0e5ee;} .badge.native{background:#fdeceb;color:var(--red);border:1px solid #f3cfc9;}
.tacts{display:flex;gap:7px;align-items:center;}
.lk{font-size:12px;font-weight:700;color:var(--blue);text-decoration:none;} .lk:hover{text-decoration:underline;}
.cbtn{border:none;border-radius:8px;padding:7px 14px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none;display:inline-block;} .cbtn:hover{filter:brightness(1.13);}
.cbtn.soon{background:#eef1f7;color:#8a93a8;cursor:default;} .cbtn.soon:hover{filter:none;}
.rrg-back{position:fixed;left:16px;bottom:16px;z-index:99999;display:inline-flex;align-items:center;gap:7px;background:rgba(0,14,49,.85);color:#fff;text-decoration:none;font:700 12.5px/1 -apple-system,Arial,sans-serif;padding:10px 15px;border-radius:100px;border:1px solid rgba(255,255,255,.22);}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<a href="./index.html" class="rrg-back"><span style="font-size:14px;line-height:1">←</span> Toolbox</a>
<div class="top"><div class="top-in">
  <div class="crumb"><a href="./index.html">Command</a><span>›</span>Integrations</div>
  <span class="disc" onclick="location.href='./index.html'">RRG</span>
  <div class="kicker">Admin · Integrations</div>
  <h1>Integrations</h1>
  <div class="sub">Connect FullServe to the tools your team already runs on. Some are live today; others are on the roadmap — tell us which to prioritize.</div>
</div></div>
<div class="navcrumb"><a href="./index.html">Command</a><span>›</span>Integrations</div>
<div class="wrap">
  <div class="secttl">Native Integrations <span class="ct" id="ctNative"></span></div>
  <div class="grid" id="gridNative"></div>
  <div class="secttl">Chrome Extensions <span class="ct" id="ctExt"></span></div>
  <div class="grid" id="gridExt"></div>
</div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
var CLAUDE_ICON='<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><g stroke="#D97757" stroke-width="1.7" stroke-linecap="round"><line x1="12" y1="3" x2="12" y2="21"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"/><line x1="18.4" y1="5.6" x2="5.6" y2="18.4"/></g></svg>';
function letter(ch,color){ return '<span class="lm" style="color:'+color+'">'+ch+'</span>'; }

// action: {label, href} available | {soon:true}
var NATIVE=[
 {name:'Claude', desc:'The AI engine behind valuations, marketing packs, attack plans & the Requests office.', bg:'linear-gradient(135deg,#D97757,#c2410c)', icon:CLAUDE_ICON, native:true, act:{label:'Configure', href:'rrg_ai_engine.html'}},
 {name:'Gmail', desc:'Send, track & auto-log sent email straight from FullServe.', bg:'linear-gradient(135deg,#ea4335,#c5221f)', icon:letter('M','#ea4335'), act:{label:'Connect', href:'rrg_integrations.html'}},
 {name:'Google Calendar', desc:'Push tasks & reminders to a dedicated FullServe calendar.', bg:'linear-gradient(135deg,#2f6fd0,#1a4fb0)', icon:letter('31','#2f6fd0'), act:{label:'Connect', href:'rrg_account.html'}},
 {name:'Google Maps', desc:'Auto-pull storefront photos & Places data onto every location.', bg:'linear-gradient(135deg,#1f8a5b,#0e7a53)', icon:letter('◆','#1f8a5b'), act:{label:'Add key', href:'rrg_integrations.html'}},
 {name:'Twilio SMS', desc:'Text task reminders to reps at the number on their profile.', bg:'linear-gradient(135deg,#f22f46,#d81b3f)', icon:letter('☎','#f22f46'), act:{label:'Connect', href:'rrg_integrations.html'}},
 {name:'BizBuySell', desc:'Auto-import inbound business-for-sale leads from your inbox.', bg:'linear-gradient(135deg,#0b7285,#095c6b)', icon:letter('B','#0b7285'), act:{label:'Set up', href:'rrg_import.html'}},
 {name:'DocuSign', desc:'Track e-signatures on agreements alongside the built-in signer.', bg:'linear-gradient(135deg,#f5a623,#d98b0a)', icon:letter('D','#d98b0a'), act:{soon:true}},
 {name:'Google Drive', desc:'Browse & link files and folders on records and data rooms.', bg:'linear-gradient(135deg,#16a34a,#128a3e)', icon:letter('▲','#16a34a'), act:{soon:true}},
 {name:'Dropbox', desc:'Browse & link files and folders from Dropbox.', bg:'linear-gradient(135deg,#2f6fd0,#0061ff)', icon:letter('❑','#0061ff'), act:{soon:true}},
 {name:'Slack', desc:'Real-time lead & deal notifications in your channels.', bg:'linear-gradient(135deg,#7c2d67,#611f69)', icon:letter('#','#7c2d67'), act:{soon:true}},
 {name:'QuickBooks', desc:'Sync invoices & payments with your accounting.', bg:'linear-gradient(135deg,#2ca01c,#1f7d13)', icon:letter('qb','#2ca01c'), act:{soon:true}},
 {name:'Mailchimp', desc:'Sync contacts, fields & tags to email campaigns.', bg:'linear-gradient(135deg,#2b2b2b,#111)', icon:letter('✻','#ffe01b'), act:{soon:true}},
 {name:'RingCentral', desc:'Make, receive and log calls against records.', bg:'linear-gradient(135deg,#e6a017,#cf8a0a)', icon:letter('R','#cf8a0a'), act:{soon:true}}
];
var EXT=[
 {name:'FullServe for Gmail', desc:'Add leads & people to FullServe right from your inbox.', bg:'linear-gradient(135deg,#DA2B1F,#a81d14)', icon:letter('F','#DA2B1F'), act:{soon:true}},
 {name:'FullServe for Chrome', desc:'Capture any concept, operator or listing you browse.', bg:'linear-gradient(135deg,#16346e,#0b1a38)', icon:letter('F','#16346e'), act:{soon:true}}
];

function tile(x){
  var actHtml = x.act.soon
    ? '<span class="cbtn soon">Coming soon</span>'
    : '<a class="cbtn" href="'+x.act.href+'">'+esc(x.act.label)+'</a>';
  var badge = x.act.soon ? '<span class="badge soon">Roadmap</span>' : (x.native?'<span class="badge native">Native</span>':'<span class="badge on">Available</span>');
  return '<div class="tile">'
    +'<div class="thead" style="background:'+x.bg+'">'
      +'<div class="tico">'+x.icon+'</div>'
      +'<div><div class="tname">'+esc(x.name)+'</div><div class="tdesc">'+esc(x.desc)+'</div></div>'
    +'</div>'
    +'<div class="tbody">'+badge+'<div class="tacts">'+actHtml+'</div></div>'
  +'</div>';
}
var _nat=NATIVE.filter(function(x){return !x.act.soon;});
var _ext=EXT.filter(function(x){return !x.act.soon;});
document.getElementById('gridNative').innerHTML=_nat.map(tile).join('');
document.getElementById('gridExt').innerHTML=_ext.map(tile).join('');
document.getElementById('ctNative').textContent=_nat.length;
document.getElementById('ctExt').textContent=_ext.length;
if(!_ext.length){ var _ce=document.getElementById('ctExt'); if(_ce&&_ce.parentNode) _ce.parentNode.style.display='none'; var _ge=document.getElementById('gridExt'); if(_ge) _ge.style.display='none'; }
if(!_nat.length){ var _cn=document.getElementById('ctNative'); if(_cn&&_cn.parentNode) _cn.parentNode.style.display='none'; var _gn=document.getElementById('gridNative'); if(_gn) _gn.style.display='none'; }
</script>
</body>
</html>
