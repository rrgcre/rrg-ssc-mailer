<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullServe — Concept Intelligence</title>
<style>
:root{--navy:#20334f;--navy2:#23496f;--primary:#2c5c8f;--primary-d:#23496f;--ink:#2b3648;--dim:#5f6a7d;--soft:#8a93a3;--faint:#96a1b2;--line:#dbe0e9;--wash:#f4f6f9;--green:#2f7a55;--red:#b23a2c;--inp:#c4ccda;--amber:#8a5a12;--teal:#0b7285;--purple:#20334f;--bg:#fff;--card:#fff;--blue:var(--primary);}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#fff;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:13px;}
h1{margin:0;font-size:16px;font-weight:700;color:var(--navy);} .sub{color:var(--dim);font-size:12.5px;margin-top:5px;max-width:720px;line-height:1.5;}
.wrap{max-width:1040px;margin:0 auto;padding:24px 24px 70px;}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;background:var(--wash);border:1px solid var(--line);border-radius:6px;padding:13px 16px;}
.bar .cnt{font-size:13px;color:var(--dim);font-weight:600;} .bar .cnt b{color:var(--navy);}
.bar .sp{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap;}
.btn{background:#fff;color:var(--navy);border:1px solid var(--inp);border-radius:3px;padding:8px 14px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;} .btn:hover{background:var(--wash);} .btn.purple{background:var(--purple);color:#fff;border-color:var(--purple);} .btn.purple:hover{filter:brightness(1.08);} .btn.green{background:var(--green);color:#fff;border-color:var(--green);} .btn.green:hover{filter:brightness(1.06);} .btn:disabled{opacity:.5;cursor:default;}
.fields{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--wash);border:1px solid var(--line);border-radius:6px;padding:11px 15px;margin-bottom:16px;font-size:12.5px;}
.fields .ttl{font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:10.5px;color:var(--soft);}
.fields label{display:inline-flex;align-items:center;gap:7px;font-weight:600;color:var(--ink);cursor:pointer;}
.fields input{width:16px;height:16px;accent-color:var(--purple);cursor:pointer;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:13px;}
.ec{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px 15px;position:relative;transition:.12s;}
.ec:hover{border-color:var(--primary);}
.ec.on{border-color:var(--purple);box-shadow:0 0 0 2px rgba(32,51,79,.16);} .ec.dead{opacity:.5;}
.ec .chk{position:absolute;top:13px;right:13px;width:22px;height:22px;border-radius:4px;border:1.5px solid var(--inp);background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;cursor:pointer;} .ec.on .chk{background:var(--purple);border-color:var(--purple);}
.ec .nm{font-weight:800;font-size:14.5px;padding-right:30px;line-height:1.25;color:var(--navy);} .ec .co{font-size:11px;color:var(--faint);margin-top:1px;}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;} .tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:3px;background:#eef1f6;color:var(--purple);} .tag.set{background:var(--wash);color:var(--dim);} .tag.mu{background:#e9f4ee;color:var(--green);} .tag.none{background:#faf1f0;color:var(--faint);}
.lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:800;margin-right:3px;}
.deadmsg{font-size:11.5px;color:var(--faint);margin-top:9px;}
.empty{text-align:center;color:var(--dim);padding:54px 20px;} .empty b{color:var(--navy);display:block;font-size:16px;margin-bottom:6px;}
.setup{max-width:600px;margin:20px auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:6px;padding:34px 28px;} .setup b{display:block;font-size:17px;color:var(--navy);margin-bottom:8px;} .setup p{color:var(--dim);font-size:13.5px;line-height:1.6;margin:0 0 16px;}
.msg{font-size:13px;font-weight:700;} .msg.ok{color:var(--green);} .msg.err{color:var(--red);}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--inp);border-top-color:var(--purple);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:7px;} @keyframes sp{to{transform:rotate(360deg)}}
.gate{max-width:520px;margin:80px auto;text-align:center;color:var(--dim);}
.navcrumb{display:none;max-width:1040px;margin:0 auto;padding:20px 24px 0;font-size:12.5px;color:var(--dim);font-weight:600;} body.rrg-shelled .navcrumb{display:block;} .navcrumb a{color:var(--primary);text-decoration:none;} .navcrumb a:hover{text-decoration:underline;} .navcrumb span{color:var(--faint);margin:0 7px;}
.pkick{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:0 0 3px;}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<!--rrgback--><a href="./rrg_data.html" class="rrg-back" style="position:fixed;left:16px;bottom:16px;z-index:99999;display:inline-flex;align-items:center;gap:7px;background:rgba(0,14,49,.85);color:#fff;text-decoration:none;font:700 12.5px/1 -apple-system,Arial,sans-serif;padding:10px 15px;border-radius:100px;border:1px solid rgba(255,255,255,.22)"><span style="font-size:14px;line-height:1">←</span> Data Enrichment</a>
<div class="navcrumb"><a href="./index.html">Command</a><span>›</span><a href="./rrg_data.html">Data Enrichment</a><span>›</span>Concept Intelligence</div>
<div class="wrap" style="padding-bottom:4px">
  <div class="pkick">Admin · Data</div><h1>Concept Intelligence</h1>
  <div class="sub">Uses AI to fill in the <b>cuisine, concept type, and price point</b> each concept is missing, and flags <b>multi-unit operators</b>. Review the suggestions, tick the ones to keep, and apply.</div>
</div>
<div id="root" class="wrap" style="padding-top:14px"><div class="gate">Checking access…</div></div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
var AIW = {_p:null,_iv:null,show:function(m,c){try{if(window.rrgAiWork){this._p=null;if(this._iv){clearInterval(this._iv);this._iv=null;}return window.rrgAiWork.show(m,c);}if(!document.querySelector('script[src="/rrg_shell.js"]')){try{var _sh=document.createElement('script');_sh.src='/rrg_shell.js';_sh.defer=true;(document.head||document.documentElement).appendChild(_sh);}catch(_e){}}this._p={m:m,c:c};var s=this,t=0;if(this._iv)clearInterval(this._iv);this._iv=setInterval(function(){t++;if(window.rrgAiWork){clearInterval(s._iv);s._iv=null;if(s._p){window.rrgAiWork.show(s._p.m,s._p.c);}}else if(t>150){clearInterval(s._iv);s._iv=null;}},50);}catch(e){}},setMsg:function(m){try{if(window.rrgAiWork)window.rrgAiWork.setMsg(m);else if(this._p)this._p.m=m;}catch(e){}},progress:function(d,t,o){try{if(window.rrgAiWork&&window.rrgAiWork.progress)window.rrgAiWork.progress(d,t,o);else if(o&&o.msg)this.setMsg(o.msg);}catch(e){}},done:function(o){try{o=o||{};if(window.rrgAiWork&&window.rrgAiWork.done)window.rrgAiWork.done(o);else this.hide();}catch(e){}},hide:function(){try{this._p=null;if(this._iv){clearInterval(this._iv);this._iv=null;}return window.rrgAiWork&&window.rrgAiWork.hide();}catch(e){}}};
var CANDS=[], ROWS={}, ORDER=[], STATE={}, SCANNED=0, ONLYNEEDS=true, CPTCANCEL=false;
function fieldsOn(){ return { cuisine:document.getElementById('f_cuisine').checked, type:document.getElementById('f_type').checked, price:document.getElementById('f_price').checked, mu:document.getElementById('f_mu').checked }; }
function build(aiReady){
  var root=document.getElementById('root'); root.className='wrap';
  if(!aiReady){ root.innerHTML='<div class="setup"><b>Turn on AI first</b><p>Concept classification uses AI (your Anthropic key). Save your key under <b>Admin → Settings</b>, then come back.</p><a class="btn purple" href="rrg_admin_settings.html" style="text-decoration:none;color:#fff">Open Settings</a></div>'; return; }
  root.innerHTML=''
   +'<div class="fields"><span class="ttl">Apply</span>'
   +'<label><input type="checkbox" id="f_cuisine" checked> Cuisine</label>'
   +'<label><input type="checkbox" id="f_type" checked> Concept type</label>'
   +'<label><input type="checkbox" id="f_price" checked> Price point</label>'
   +'<label><input type="checkbox" id="f_mu" checked> Tag multi-unit operators</label>'
   +'<label style="margin-left:auto"><input type="checkbox" id="f_only" checked> Only concepts missing data</label></div>'
   +'<div class="bar"><span class="cnt" id="cnt"></span><div class="sp"><button class="btn" id="all">Select all</button><button class="btn" id="none">Select none</button><button class="btn purple" id="scan">Classify with AI</button><button class="btn green" id="apply">Apply approved</button><span class="msg" id="msg"></span></div></div>'
   +'<div class="grid" id="grid"></div>';
  document.getElementById('all').addEventListener('click',function(){ ORDER.forEach(function(k){ if(STATE[k]!=='dead'&&ROWS[k].proposed) STATE[k]='on'; }); paint(); });
  document.getElementById('none').addEventListener('click',function(){ ORDER.forEach(function(k){ if(STATE[k]!=='dead') STATE[k]='off'; }); paint(); });
  document.getElementById('scan').addEventListener('click',scan);
  document.getElementById('apply').addEventListener('click',apply);
  document.getElementById('f_only').addEventListener('change',function(){ ONLYNEEDS=this.checked; });
  loadCands();
}
function loadCands(){
  fetch('/api/admin/concepts-candidates',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){
    if(!j||!j.ok){ document.getElementById('grid').innerHTML='<div class="empty">Could not load concepts.</div>'; return; }
    CANDS=j.candidates||[];
    if(!CANDS.length){ document.getElementById('grid').innerHTML='<div class="empty"><b>No concepts yet.</b>Import companies (concepts are created from them), then come back.</div>'; document.getElementById('cnt').textContent=''; return; }
    document.getElementById('cnt').innerHTML='<b>'+CANDS.length+'</b> concepts · <b>'+j.needing+'</b> missing cuisine / type / price · press <b>Classify with AI</b>';
  }).catch(function(){ document.getElementById('grid').innerHTML='<div class="empty">Could not reach the server.</div>'; });
}
function scan(){
  var btn=document.getElementById('scan'); btn.disabled=true; SCANNED=0; ROWS={}; ORDER=[]; STATE={};
  document.getElementById('grid').innerHTML='';
  var pool=CANDS.filter(function(c){ return ONLYNEEDS? c.needs : true; });
  if(!pool.length){ btn.disabled=false; document.getElementById('cnt').textContent='Nothing to classify — every concept already has cuisine, type and price.'; return; }
  CPTCANCEL=false; AIW.show('Classifying your concepts with AI…', function(){ CPTCANCEL=true; AIW.hide(); location.href='rrg_data.html'; });
  var chunks=[]; for(var i=0;i<pool.length;i+=12) chunks.push(pool.slice(i,i+12));
  var ci=0, inflight=0, finished=false, POOL=Math.min(2, chunks.length||1);   // 2 AI requests in flight — faster without hammering rate limits
  AIW.progress(0,pool.length,{noun:'concepts', msg:'Reading concepts with AI…'});
  function finish(){ if(finished) return; finished=true; btn.disabled=false; var classified=ORDER.filter(function(k){return ROWS[k].proposed;}).length; document.getElementById('cnt').innerHTML='<b>'+classified+'</b> classified · scanned '+SCANNED; AIW.progress(pool.length,pool.length,{noun:'concepts'}); AIW.done({title:'Classification complete', summary:'Classified '+classified+' of '+SCANNED+' concept'+(SCANNED===1?'':'s')+' — cuisine, type and price filled where AI was confident. Review the suggestions and apply the ones you want.'}); }
  function pump(){
    if(CPTCANCEL||finished) return;
    if(ci>=chunks.length && inflight===0){ finish(); return; }
    while(inflight<POOL && ci<chunks.length){
      var items=chunks[ci++].map(function(c){ return {companyId:c.companyId, conceptId:c.conceptId}; }); inflight++;
      document.getElementById('cnt').innerHTML='<span class="spin"></span>Classifying… '+SCANNED+'/'+pool.length;
      (function(items){
        fetch('/api/admin/concepts-classify',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({items:items})}).then(function(r){return r.json();}).then(function(j){
          if(CPTCANCEL||finished) return;
          if(j&&j.ok){ (j.results||[]).forEach(addRow); } else { document.getElementById('msg').className='msg err'; document.getElementById('msg').textContent=(j&&j.error)||'AI error'; }
          SCANNED+=items.length; inflight--; AIW.progress(SCANNED,pool.length,{noun:'concepts'}); pump();
        }).catch(function(){ if(CPTCANCEL||finished) return; finished=true; AIW.hide(); btn.disabled=false; document.getElementById('msg').className='msg err'; document.getElementById('msg').textContent='Scan stopped — server error.'; });
      })(items);
    }
  }
  pump();
}
function addRow(r){
  var k=r.companyId+'|'+r.conceptId; ROWS[k]=r; ORDER.push(k);
  var p=r.proposed||{}; var cur=r.current||{};
  var hasNew=(p.cuisine&&!cur.cuisine)||(p.conceptType&&!cur.conceptType)||(p.pricePoint&&!cur.pricePoint)||p.multiUnit;
  STATE[k]=hasNew?'on':'off';
  document.getElementById('grid').insertAdjacentHTML('beforeend',cardHtml(k));
  var el=document.querySelector('.ec[data-k="'+cssq(k)+'"]'); if(el){ el.addEventListener('click',function(){ STATE[k]=(STATE[k]==='on')?'off':'on'; el.classList.toggle('on',STATE[k]==='on'); count(); }); }
  count();
}
function cssq(k){ return String(k).replace(/"/g,'\\"'); }
function valTag(lbl,cur,prop){ if(prop&&!cur) return '<span class="tag"><span class="lbl">'+lbl+'</span>'+esc(prop)+'</span>'; if(cur) return '<span class="tag set"><span class="lbl">'+lbl+'</span>'+esc(cur)+'</span>'; if(prop&&cur) return '<span class="tag set"><span class="lbl">'+lbl+'</span>'+esc(cur)+'</span>'; return '<span class="tag none"><span class="lbl">'+lbl+'</span>—</span>'; }
function cardHtml(k){
  var r=ROWS[k], p=r.proposed||{}, cur=r.current||{};
  var meta=valTag('Cuisine',cur.cuisine,p.cuisine)+valTag('Type',cur.conceptType,p.conceptType)+valTag('Price',cur.pricePoint,p.pricePoint);
  if(p.multiUnit) meta+='<span class="tag mu">Multi-Unit Operator</span>';
  return '<div class="ec'+(STATE[k]==='on'?' on':'')+'" data-k="'+esc(k)+'"><div class="chk">✓</div>'
    +'<div class="nm">'+esc(r.name||'Concept')+'</div>'
    +'<div class="co">'+esc(r.companyName||'')+'</div>'
    +'<div class="meta">'+meta+'</div></div>';
}
function paint(){ ORDER.forEach(function(k){ var el=document.querySelector('.ec[data-k="'+cssq(k)+'"]'); if(el) el.classList.toggle('on',STATE[k]==='on'); }); count(); }
function count(){ var on=ORDER.filter(function(k){return STATE[k]==='on';}).length; var ap=document.getElementById('apply'); if(ap) ap.textContent='Apply approved'+(on?(' ('+on+')'):''); }
function apply(){
  var f=fieldsOn(); var items=[];
  ORDER.forEach(function(k){ if(STATE[k]!=='on') return; var r=ROWS[k], p=r.proposed; if(!p) return;
    var a={};
    if(f.cuisine&&p.cuisine) a.cuisine=p.cuisine;
    if(f.type&&p.conceptType) a.conceptType=p.conceptType;
    if(f.price&&p.pricePoint) a.pricePoint=p.pricePoint;
    if(f.mu&&p.multiUnit) a.multiUnit=true;
    items.push({ companyId:r.companyId, conceptId:r.conceptId, apply:a });
  });
  if(!items.length){ alert('Tick at least one concept to apply.'); return; }
  var b=document.getElementById('apply'); b.disabled=true; var msg=document.getElementById('msg'); msg.className='msg'; msg.textContent=''; AIW.show('Applying classifications…');
  fetch('/api/admin/concepts-apply',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({items:items})}).then(function(r){return r.json();}).then(function(j){
    b.disabled=false; if(j&&j.ok){ msg.className='msg ok'; var mt='Classified '+j.applied+' concept'+(j.applied===1?'':'s')+(j.tagged?(' · '+j.tagged+' tagged multi-unit'):''); msg.textContent=mt+' ✓';
      items.forEach(function(it){ var k=it.companyId+'|'+it.conceptId;
        // Reflect the applied values locally so counts and a re-scan stay accurate.
        var r=ROWS[k]; if(r){ r.current=r.current||{}; var p=r.proposed||{}; if(p.cuisine)r.current.cuisine=p.cuisine; if(p.conceptType)r.current.conceptType=p.conceptType; if(p.pricePoint)r.current.pricePoint=p.pricePoint; }
        for(var ci=0;ci<CANDS.length;ci++){ if((CANDS[ci].companyId+'|'+CANDS[ci].conceptId)===k){ CANDS[ci].needs=false; break; } }
        // Clear the applied card out of the review grid — it's handled.
        var el=document.querySelector('.ec[data-k="'+cssq(k)+'"]'); if(el){ el.classList.add('dead'); (function(node){ setTimeout(function(){ if(node&&node.parentNode) node.parentNode.removeChild(node); },260); })(el); }
        delete STATE[k]; delete ROWS[k]; ORDER=ORDER.filter(function(x){return x!==k;});
      });
      count(); AIW.done({title:'Classifications applied', summary:mt+'.'});
      setTimeout(function(){ if(!ORDER.length){ document.getElementById('grid').innerHTML='<div class="empty"><b>All caught up.</b>Every reviewed concept was applied. Press <b>Classify with AI</b> to scan again for anything still missing.</div>'; document.getElementById('cnt').textContent=''; } },300); }
    else { AIW.hide(); msg.className='msg err'; msg.textContent=(j&&j.error)||'Could not apply.'; }
  }).catch(function(){ AIW.hide(); b.disabled=false; msg.className='msg err'; msg.textContent='Could not reach the server.'; });
}
fetch('/api/admin/concepts-candidates',{credentials:'same-origin'}).then(function(r){ if(r.status===403) throw 0; return r.json(); }).then(function(j){
  build(!!(j&&j.aiReady));
}).catch(function(){ document.getElementById('root').innerHTML='<div class="gate"><h2 style="color:#000E31">Admins only</h2>Ask an administrator to run Concept Intelligence.</div>'; });
</script>
</body>
</html>
