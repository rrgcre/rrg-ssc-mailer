<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRG — Command Center</title>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--ink:#1a2236;--muted:#6b7488;--soft:#8a93a8;--line:#e6e9f0;--wash:#f5f7fb;--green:#1f8a5b;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#eef1f6;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.top{color:#fff;padding:24px 0 0;position:relative;overflow:hidden;background:radial-gradient(95% 130% at 28% 15%, #1c2e5c 0%, #112044 42%, #0b1636 70%, #071029 100%);}
.top-in{max-width:1180px;margin:0 auto;padding:0 24px;position:relative;z-index:2;}
.brand{display:inline-flex;align-items:center;cursor:pointer;} .disc{background:var(--red);color:#fff;border-radius:50%;width:40px;height:40px;font-family:'Arial Black',Arial,sans-serif;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;letter-spacing:-.04em;}
.bar{background:#fff;width:3px;height:28px;margin:0 11px;} .wm{font-weight:800;font-size:13px;text-transform:uppercase;line-height:.95;}
.kicker{margin:16px 0 3px;color:var(--red);font-weight:700;letter-spacing:.3em;font-size:10.5px;text-transform:uppercase;}
h1{font-size:27px;font-weight:800;margin:0;color:#fff;letter-spacing:-.01em;}
.sub{color:#aeb8cf;font-size:13px;margin-top:6px;max-width:680px;}
.tabs{margin-top:18px;display:flex;gap:4px;}
.tabs button{background:none;border:none;cursor:pointer;font:inherit;color:#aeb8cf;font-size:13px;font-weight:700;padding:11px 18px;border-bottom:3px solid transparent;}
.tabs button.on{color:#fff;border-bottom-color:var(--red);}
.wrap{max-width:1180px;margin:22px auto;padding:0 24px 70px;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 17px;box-shadow:0 5px 18px rgba(10,20,50,.05);}
.kpi .n{font-size:26px;font-weight:800;color:var(--navy);letter-spacing:-.02em;line-height:1;}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:6px;}
.kpi.hot .n{color:var(--red);} .kpi.good .n{color:var(--green);}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 6px 24px rgba(10,20,50,.05);margin-bottom:20px;}
.ch{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);} .ch b{color:var(--navy);font-size:14px;} .ch .cs{color:var(--muted);font-size:12px;}
.buckets{display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px;}
.bk{background:var(--wash);border:1px solid var(--line);border-radius:11px;padding:10px 14px;cursor:pointer;min-width:96px;}
.bk.on{border-color:var(--navy);box-shadow:0 0 0 2px rgba(0,14,49,.08);}
.bk .bn{font-size:20px;font-weight:800;color:var(--navy);} .bk .bl{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
.bk.b-red .bn{color:var(--red);} .bk.b-amber .bn{color:#b9761a;} .bk.b-green .bn{color:var(--green);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle;}
th{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--wash);cursor:pointer;white-space:nowrap;}
tr:hover td{background:#fbfcfe;}
.nm{font-weight:800;color:var(--navy);} .mt{color:var(--muted);font-size:11.5px;margin-top:2px;}
a.lk{color:#2647b0;text-decoration:none;font-weight:700;} a.lk:hover{text-decoration:underline;}
.pill{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap;}
.p-ok{background:#eef7f0;color:var(--green);border-color:#bfe6d1;} .p-warn{background:#fff4e6;color:#b9761a;border-color:#f0d7ad;} .p-soon{background:#fdeceb;color:var(--red);border-color:#f3cfc9;} .p-past{background:var(--red);color:#fff;border-color:var(--red);}
.stat{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:#eef2fb;color:#2647b0;border:1px solid #d3ddf3;}
.st-dark{background:#efe9f7;color:#5a3d9e;border-color:#d9cdf0;} .st-underconstruction{background:#fff4e6;color:#b9761a;border-color:#f0d7ad;} .st-closed{background:#f2f4f8;color:#6b7488;border-color:#e0e5ee;}
.tag{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:1px 6px;border-radius:999px;margin-left:5px;}
.tag-flag{background:#fff7e0;color:#9a7400;border:1px solid #f0e0a8;} .tag-comm{background:#fdf0e6;color:#b5641a;border:1px solid #f4d8bd;}
.funnel{padding:12px 20px 18px;}
.frow{display:flex;align-items:center;gap:12px;margin-bottom:9px;}
.flab{width:130px;flex:none;font-size:12.5px;font-weight:700;color:var(--navy);}
.fbar{flex:1;background:var(--wash);border-radius:7px;height:26px;position:relative;overflow:hidden;border:1px solid var(--line);}
.ffill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#12224e,#2647b0);border-radius:7px;}
.fnum{position:absolute;right:9px;top:0;bottom:0;display:flex;align-items:center;font-size:12px;font-weight:800;color:var(--navy);}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;} @media(max-width:820px){.cols{grid-template-columns:1fr;}}
.mini{font-size:12.5px;color:var(--ink);}
.empty{padding:18px 20px;color:var(--muted);font-size:12.5px;}
.bar2{display:flex;align-items:center;gap:8px;padding:6px 20px;font-size:12.5px;}
.bar2 .k{width:150px;color:var(--muted);} .bar2 .track{flex:1;background:var(--wash);height:16px;border-radius:5px;overflow:hidden;border:1px solid var(--line);} .bar2 .fill{height:100%;background:#2647b0;} .bar2 .v{width:38px;text-align:right;font-weight:800;color:var(--navy);}
.foot{max-width:1180px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:11.5px;}
.gen{color:#8a93a8;font-size:11px;padding:4px 2px 14px;}
.donutwrap{display:flex;align-items:center;gap:22px;padding:16px 20px;flex-wrap:wrap;}
.legend{font-size:12.5px;color:var(--ink);} .lgrow{display:flex;align-items:center;gap:7px;margin-bottom:6px;} .lgrow b{color:var(--navy);} .lgrow .pct{color:var(--muted);font-size:11px;}
.dot{width:11px;height:11px;border-radius:3px;flex:none;display:inline-block;}
.stackbar{display:flex;height:26px;border-radius:8px;overflow:hidden;margin:14px 20px 8px;border:1px solid var(--line);}
.stacklegend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:0 20px 16px;font-size:12px;color:var(--ink);}
.slg{display:inline-flex;align-items:center;gap:6px;} .slg b{color:var(--navy);}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<!--rrgback--><a href="./index.html" class="rrg-back" aria-label="Back to toolbox" style="position:fixed;left:16px;bottom:16px;z-index:99999;display:inline-flex;align-items:center;gap:7px;background:rgba(0,14,49,.85);color:#fff;text-decoration:none;font:700 12.5px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;padding:10px 15px;border-radius:100px;border:1px solid rgba(255,255,255,.22);box-shadow:0 6px 20px rgba(0,0,0,.28)"><span style="font-size:14px;line-height:1">←</span> Toolbox</a>
<div class="top"><div class="top-in">
  <span class="brand" onclick="location.href='./index.html'"><span class="disc">RRG</span><span class="bar"></span><span class="wm">Restaurant<br>Realty<br>Group</span></span>
  <div class="kicker">Management</div>
  <h1>Command Center</h1>
  <div class="sub">Everything the book and the pipeline are telling you — the deals to push, the leases to chase, and where the opportunity is hiding.</div>
  <div class="tabs" id="tabs">
    <button data-t="lease" class="on">Lease Ladder</button>
    <button data-t="pipeline">Pipeline</button>
    <button data-t="portfolio">Portfolio</button>
  </div>
</div></div>
<div class="wrap">
  <div class="gen" id="gen"></div>
  <div id="bbscard"></div>
  <div id="view"></div>
</div>
<div class="foot">Proprietary &amp; Confidential · Property of Restaurant Realty Group, LLC · Internal RRG use only.</div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function money(n){ n=Number(n)||0; if(n>=1e6) return '$'+(n/1e6).toFixed(2).replace(/\.00$/,'')+'M'; if(n>=1e3) return '$'+Math.round(n/1e3)+'K'; return '$'+n; }
function fmtD(d){ if(!d) return ''; var p=String(d).split('-'); if(p.length===3) return (+p[1])+'/'+(+p[2])+'/'+String(p[0]).slice(2); return d; }
function coLink(id,txt){ return '<a class="lk" href="./rrg_company.html?id='+encodeURIComponent(id)+'">'+esc(txt)+'</a>'; }
function dealLink(key,txt){ return '<a class="lk" href="./rrg_assignment.html?key='+encodeURIComponent(key)+'">'+esc(txt)+'</a>'; }
function expPill(n){ var cls,txt; if(n<0){cls='p-past';txt='Expired '+(-n)+'d';} else if(n===0){cls='p-soon';txt='Today';} else {txt='in '+n+'d'; cls=n<=182?'p-soon':(n<=365?'p-warn':'p-ok');} return '<span class="pill '+cls+'">'+txt+'</span>'; }
function stClass(s){ return 'st-'+String(s||'Open').toLowerCase().replace(/[^a-z]+/g,''); }
var DATA=null, TAB='lease', LEASEFILTER='';
var PAL=['#12224e','#2647b0','#b9761a','#DA2B1F','#1f8a5b','#5a3d9e','#8a93a8','#0e7a53'];
/* Donut chart from [{label,value,color}] */
function donut(segs,center){
  segs=segs.filter(function(s){return s.value>0;});
  var total=segs.reduce(function(a,s){return a+s.value;},0);
  if(!total) return '<div class="empty">No data yet.</div>';
  var R=54,C=2*Math.PI*R,off=0,r=[];
  segs.forEach(function(s){ var frac=s.value/total,len=frac*C;
    r.push('<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+s.color+'" stroke-width="22" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"></circle>');
    off+=len; });
  var leg=segs.map(function(s){ return '<div class="lgrow"><span class="dot" style="background:'+s.color+'"></span>'+esc(s.label)+' <b>'+s.value+'</b> <span class="pct">'+Math.round(100*s.value/total)+'%</span></div>'; }).join('');
  return '<div class="donutwrap"><svg viewBox="0 0 140 140" width="140" height="140">'+r.join('')+'<text x="70" y="66" text-anchor="middle" font-size="26" font-weight="800" fill="#000E31">'+total+'</text><text x="70" y="84" text-anchor="middle" font-size="10" fill="#6b7488">'+esc(center||'total')+'</text></svg><div class="legend">'+leg+'</div></div>';
}
/* 100% stacked bar from [{label,value,color}] */
function stacked(segs){
  segs=segs.filter(function(s){return s.value>0;});
  var total=segs.reduce(function(a,s){return a+s.value;},0);
  if(!total) return '';
  var bar=segs.map(function(s){ return '<div style="width:'+(100*s.value/total)+'%;background:'+s.color+'" title="'+esc(s.label)+': '+s.value+'"></div>'; }).join('');
  var leg=segs.map(function(s){ return '<span class="slg"><span class="dot" style="background:'+s.color+'"></span>'+esc(s.label)+' <b>'+s.value+'</b></span>'; }).join('');
  return '<div class="stackbar">'+bar+'</div><div class="stacklegend">'+leg+'</div>';
}

function render(){
  if(!DATA){ document.getElementById('view').innerHTML='<div class="empty">Loading…</div>'; return; }
  if(TAB==='lease') renderLease();
  else if(TAB==='pipeline') renderPipeline();
  else renderPortfolio();
}

/* ---------------- LEASE LADDER ---------------- */
function renderLease(){
  var L=DATA.lease, b=L.buckets;
  var chips=[['','All',L.ladder.length,''],['expired','Expired',b.expired,'b-red'],['m6','≤ 6 mo',b.m6,'b-red'],['m12','6–12 mo',b.m12,'b-amber'],['m18','12–18 mo',b.m18,'b-amber'],['m24','18–24 mo',b.m24,'b-green'],['beyond','24 mo +',b.beyond,'']];
  var bk=chips.map(function(c){ return '<div class="bk '+c[3]+(LEASEFILTER===c[0]?' on':'')+'" data-bk="'+c[0]+'"><div class="bn">'+c[2]+'</div><div class="bl">'+esc(c[1])+'</div></div>'; }).join('');
  var rows=L.ladder.filter(function(x){ return inBucket(x.daysToExpiry,LEASEFILTER); });
  var body = rows.length ? rows.map(function(x){
    var tags=(x.flagship?'<span class="tag tag-flag">★</span>':'')+(x.commissary?'<span class="tag tag-comm">Comm</span>':'');
    var loc=[x.city,x.state].filter(Boolean).map(esc).join(', ');
    return '<tr><td>'+coLink(x.companyId,x.name)+tags+'<div class="mt">'+esc(x.company)+(x.concept?(' · '+esc(x.concept)):'')+'</div></td>'
      +'<td>'+(x.markets&&x.markets.length?x.markets.map(esc).join(', '):'<span class="mt">'+loc+'</span>')+'</td>'
      +'<td><span class="mt">'+loc+'</span></td>'
      +'<td><span class="stat '+stClass(x.status)+'">'+esc(x.status)+'</span></td>'
      +'<td>'+expPill(x.daysToExpiry)+'<div class="mt">'+esc(fmtD(x.leaseExpires))+'</div></td></tr>';
  }).join('') : '<tr><td colspan="5" class="empty">No leases in this window. Add lease commencement &amp; expiration dates on locations to build your prospecting ladder.</td></tr>';
  document.getElementById('view').innerHTML=
    '<div class="card"><div class="ch"><b>Lease expiration ladder</b><span class="cs">— every location lease in the book, soonest first. The 6–18 month window is your prime prospecting list.</span></div>'
    +stacked([{label:'Expired',value:b.expired,color:'#DA2B1F'},{label:'≤6mo',value:b.m6,color:'#e8663a'},{label:'6–12mo',value:b.m12,color:'#b9761a'},{label:'12–18mo',value:b.m18,color:'#d6a24a'},{label:'18–24mo',value:b.m24,color:'#1f8a5b'},{label:'24mo+',value:b.beyond,color:'#8a93a8'}])
    +'<div class="buckets">'+bk+'</div>'
    +'<table><thead><tr><th>Location</th><th>Market</th><th>City</th><th>Status</th><th>Lease expires</th></tr></thead><tbody>'+body+'</tbody></table></div>';
  document.querySelectorAll('.bk[data-bk]').forEach(function(el){ el.addEventListener('click',function(){ LEASEFILTER=el.getAttribute('data-bk'); renderLease(); }); });
}
function inBucket(d,f){ if(!f) return true; if(f==='expired') return d<0; if(f==='m6') return d>=0&&d<=182; if(f==='m12') return d>182&&d<=365; if(f==='m18') return d>365&&d<=547; if(f==='m24') return d>547&&d<=730; if(f==='beyond') return d>730; return true; }

/* ---------------- PIPELINE ---------------- */
function renderPipeline(){
  var P=DATA.pipeline, s=P.summary;
  var winRate=(s.closed+s.lost)?Math.round(100*s.closed/(s.closed+s.lost)):0;
  var kpis=[['n',s.active,'Active deals',''],['n',money(s.activeValue),'Active pipeline value','good'],['n',s.closed,'Closed',''],['n',s.lost,'Lost',''],['n',winRate+'%','Win rate','']];
  var kh=kpis.map(function(k){ return '<div class="kpi '+k[3]+'"><div class="n">'+esc(k[1])+'</div><div class="l">'+esc(k[2])+'</div></div>'; }).join('');
  var labels={call:'Qualification call',questionnaire:'Valuation questionnaire',bov:'Business valuation',pack:'Marketing pack',attack:'Attack plan',room:'Data room'};
  var max=Math.max(1,P.funnel[P.funnelOrder[0]]||1);
  var fun=P.funnelOrder.map(function(k){ var v=P.funnel[k]||0; var w=Math.round(100*v/max); return '<div class="frow"><div class="flab">'+esc(labels[k])+'</div><div class="fbar"><div class="ffill" style="width:'+w+'%"></div><div class="fnum">'+v+'</div></div></div>'; }).join('');
  function actionCard(title,cs,rows,cols,empt){ return '<div class="card"><div class="ch"><b>'+title+'</b><span class="cs">'+cs+'</span></div>'+(rows.length?('<table><tbody>'+rows+'</tbody></table>'):('<div class="empty">'+empt+'</div>'))+'</div>'; }
  var expRows=P.expiring.map(function(x){ return '<tr><td>'+dealLink(x.key,x.business)+'<div class="mt">'+esc(x.owner)+(x.autoRenew?' · auto-renews':'')+'</div></td><td style="text-align:right">'+expPill(x.daysToExpiry)+'<div class="mt">'+esc(fmtD(x.listingExpires))+'</div></td></tr>'; }).join('');
  var staleRows=P.stale.map(function(x){ return '<tr><td>'+dealLink(x.key,x.business)+'<div class="mt">'+esc(x.owner)+' · '+esc(x.status)+'</div></td><td style="text-align:right"><span class="pill p-warn">'+x.ageDays+'d idle</span></td></tr>'; }).join('');
  var niRows=P.noInterest.map(function(x){ return '<tr><td>'+dealLink(x.key,x.business)+'<div class="mt">'+esc(x.owner)+'</div></td><td style="text-align:right"><span class="pill p-soon">no offers/tours</span></td></tr>'; }).join('');
  var ownRows=P.byOwner.map(function(o){ return '<tr><td class="nm">'+esc(o.owner)+'</td><td>'+o.active+'</td><td>'+money(o.value)+'</td><td>'+(o.expiring||0)+'</td><td>'+o.total+'</td></tr>'; }).join('')||'<tr><td colspan="5" class="empty">No deals yet.</td></tr>';
  var stOrder=['New','Active','Under Contract','On Hold','Closed','Lost'];
  var stColors={New:'#2647b0','Active':'#1f8a5b','Under Contract':'#b9761a','On Hold':'#8a93a8','Closed':'#0e7a53','Lost':'#DA2B1F'};
  var stSegs=stOrder.map(function(k){ return {label:k,value:P.statusBreak[k]||0,color:stColors[k]}; });
  document.getElementById('view').innerHTML=
    '<div class="cards">'+kh+'</div>'
    +'<div class="cols">'
      +'<div class="card"><div class="ch"><b>Pipeline funnel</b><span class="cs">— deals reaching each stage</span></div><div class="funnel">'+fun+'</div></div>'
      +'<div class="card"><div class="ch"><b>Deals by status</b></div>'+donut(stSegs,'deals')+'</div>'
    +'</div>'
    +'<div class="cols">'
      +actionCard('Listings expiring ≤ 90 days','— renew or re-sign before you lose them',expRows,0,'Nothing expiring soon.')
      +actionCard('Stale deals','— live deals with no activity in 30+ days',staleRows,0,'Everything is moving. Nice.')
    +'</div>'
    +'<div class="cols">'
      +actionCard('Marketed, no buyer interest','— packs built with zero offers or tours',niRows,0,'Every marketed deal has activity.')
      +'<div class="card"><div class="ch"><b>By agent</b><span class="cs">— production &amp; coverage</span></div><table><thead><tr><th>Agent</th><th>Active</th><th>Value</th><th>Exp ≤90d</th><th>Total</th></tr></thead><tbody>'+ownRows+'</tbody></table></div>'
    +'</div>';
}

/* ---------------- PORTFOLIO ---------------- */
function renderPortfolio(){
  var P=DATA.portfolio, t=P.totals;
  var kpis=[[t.companies,'Companies'],[t.concepts,'Concepts'],[t.locations,'Locations'],[t.commissaries,'Commissaries'],[t.contacts,'Contacts']];
  var kh=kpis.map(function(k){ return '<div class="kpi"><div class="n">'+k[0]+'</div><div class="l">'+esc(k[1])+'</div></div>'; }).join('');
  // market coverage bars
  var mc=P.marketCoverage, maxc=1; Object.keys(mc).forEach(function(k){ maxc=Math.max(maxc,mc[k].locations); });
  var mkRows=Object.keys(mc).map(function(k){ var v=mc[k]; var w=Math.round(100*v.locations/maxc); return '<div class="bar2"><div class="k">'+esc(k)+'</div><div class="track"><div class="fill" style="width:'+w+'%"></div></div><div class="v">'+v.locations+'</div></div>'; }).join('');
  // status & site mix
  function mixDonut(obj,center){ var ks=Object.keys(obj).sort(function(a,b){return obj[b]-obj[a];}); if(!ks.length) return '<div class="empty">No data yet.</div>'; return donut(ks.map(function(k,i){ return {label:k,value:obj[k],color:PAL[i%PAL.length]}; }),center); }
  var muRows=P.multiUnit.map(function(x){ return '<tr><td>'+coLink(x.companyId,x.concept)+'<div class="mt">'+esc(x.company)+'</div></td><td style="text-align:right"><span class="stat">'+x.units+' units</span></td></tr>'; }).join('')||'<tr><td colspan="2" class="empty">No multi-unit concepts yet.</td></tr>';
  var darkRows=P.darkUnits.map(function(x){ return '<tr><td>'+coLink(x.companyId,x.name)+'<div class="mt">'+esc(x.company)+(x.concept?(' · '+esc(x.concept)):'')+(x.city?(' · '+esc(x.city)):'')+'</div></td><td style="text-align:right"><span class="stat st-dark">Dark</span></td></tr>'; }).join('')||'<tr><td colspan="2" class="empty">No dark units flagged.</td></tr>';
  var ucRows=P.underConstruction.map(function(x){ return '<tr><td>'+coLink(x.companyId,x.name)+'<div class="mt">'+esc(x.company)+(x.city?(' · '+esc(x.city)):'')+'</div></td><td style="text-align:right"><span class="stat st-underconstruction">Under Construction</span></td></tr>'; }).join('')||'<tr><td colspan="2" class="empty">Nothing under construction.</td></tr>';
  var ncRows=P.housekeeping.noContacts.slice(0,50).map(function(x){ return '<tr><td>'+coLink(x.companyId,x.company)+'</td></tr>'; }).join('')||'<tr><td class="empty">Every company has a contact.</td></tr>';
  document.getElementById('view').innerHTML=
    '<div class="cards">'+kh+'</div>'
    +'<div class="card"><div class="ch"><b>Market coverage</b><span class="cs">— locations by metro (from each concept’s markets)</span></div><div style="padding:12px 0 16px">'+mkRows+'</div></div>'
    +'<div class="cols">'
      +'<div class="card"><div class="ch"><b>Multi-unit concepts</b><span class="cs">— expanding operators: acquisition targets &amp; landlord intros</span></div><table><tbody>'+muRows+'</tbody></table></div>'
      +'<div class="card"><div class="ch"><b>Dark units</b><span class="cs">— closed-but-leased: assignment &amp; sublease deals</span></div><table><tbody>'+darkRows+'</tbody></table></div>'
    +'</div>'
    +'<div class="cols">'
      +'<div class="card"><div class="ch"><b>Location status mix</b></div>'+mixDonut(P.statusMix,'locations')+'</div>'
      +'<div class="card"><div class="ch"><b>Site type mix</b></div>'+mixDonut(P.siteMix,'sites')+'</div>'
    +'</div>'
    +'<div class="cols">'
      +'<div class="card"><div class="ch"><b>Under construction</b><span class="cs">— openings coming: relationships to build now</span></div><table><tbody>'+ucRows+'</tbody></table></div>'
      +'<div class="card"><div class="ch"><b>Companies with no contact</b><span class="cs">— relationships to warm up</span></div><table><tbody>'+ncRows+'</tbody></table></div>'
    +'</div>';
}

document.querySelectorAll('#tabs button').forEach(function(b){ b.addEventListener('click',function(){ TAB=b.getAttribute('data-t'); document.querySelectorAll('#tabs button').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); render(); }); });
render();
fetch('/api/command',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ DATA=j; try{ document.getElementById('gen').textContent='Updated '+new Date(j.generatedAt).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+(j.isAdmin?' · whole team':' · your book'); }catch(e){} render(); } else { document.getElementById('view').innerHTML='<div class="empty">Could not load the Command Center.</div>'; } }).catch(function(){ document.getElementById('view').innerHTML='<div class="empty">Could not reach the server.</div>'; });
(function(){
  var style=document.createElement('style');
  style.textContent='.bbsW{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border:1px solid #e6e9f0;border-radius:14px;padding:16px 20px;margin:0 0 14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}'
    +'.bbsW .bbsK{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#6b7488}'
    +'.bbsW .bbsNum{font-size:40px;font-weight:800;line-height:1.05;color:#000E31}'
    +'.bbsW .bbsSub{font-size:12px;color:#8a93a8;margin-top:2px}'
    +'.bbsW select{font:inherit;font-size:13px;font-weight:600;color:#12224e;background:#f5f7fb;border:1px solid #dfe3ec;border-radius:9px;padding:8px 12px;cursor:pointer}';
  document.head.appendChild(style);
  var card=document.getElementById('bbscard'); if(!card) return;
  card.innerHTML='<div class="bbsW"><div><div class="bbsK">BizBuySell leads imported</div><div class="bbsNum" id="bbsNum">\u2014</div><div class="bbsSub" id="bbsSub">&nbsp;</div></div>'
    +'<select id="bbsPeriod">'
    +'<option value="today">Today</option>'
    +'<option value="week">This week</option>'
    +'<option value="month" selected>This month</option>'
    +'<option value="ytd">Year to date</option>'
    +'<option value="year">Last 12 months</option>'
    +'<option value="total">All time</option>'
    +'</select></div>';
  var LABELS={today:'imported today',week:'imported this week',month:'imported this month',ytd:'imported year-to-date',year:'imported in the last 12 months',total:'imported all time'};
  var STATS=null;
  function paint(){ var p=document.getElementById('bbsPeriod').value; var n=(STATS&&typeof STATS[p]==='number')?STATS[p]:null; document.getElementById('bbsNum').textContent=(n==null?'\u2014':n.toLocaleString('en-US')); document.getElementById('bbsSub').textContent=STATS?(LABELS[p]||''):'loading\u2026'; }
  function pull(){ fetch('/api/bbs/stats',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ STATS=j; paint(); } }).catch(function(){}); }
  document.getElementById('bbsPeriod').addEventListener('change',paint);
  paint(); pull(); setInterval(pull,60000);
})();
</script>
