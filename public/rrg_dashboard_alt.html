<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRG — Toolbox (Console view)</title>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--ink:#1a2236;--muted:#6b7488;--soft:#8a93a8;--line:#e6e9f0;--wash:#f5f7fb;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#eef1f6;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.top{color:#fff;padding:22px 0 22px;background:radial-gradient(120% 150% at 20% 0%, #182a54 0%, #0d1b3d 46%, #070f2b 100%);}
.top-in{max-width:1180px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.brand{display:inline-flex;align-items:center;cursor:pointer;} .disc{background:var(--red);color:#fff;border-radius:50%;width:40px;height:40px;font-family:'Arial Black',Arial,sans-serif;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;letter-spacing:-.04em;}
.bar{background:#fff;width:3px;height:28px;margin:0 11px;} .wm{font-weight:800;font-size:13px;text-transform:uppercase;line-height:.95;}
.ttl{font-size:15px;font-weight:800;color:#fff;} .ttl small{display:block;color:#aeb8cf;font-size:11.5px;font-weight:600;margin-top:2px;}
.searchwrap{margin-left:auto;position:relative;}
.searchwrap input{width:320px;max-width:52vw;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.10);color:#fff;border-radius:10px;padding:11px 14px 11px 38px;font:inherit;font-size:14px;}
.searchwrap input::placeholder{color:#aeb8cf;} .searchwrap input:focus{outline:none;border-color:#fff;background:rgba(255,255,255,.16);}
.searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.7;}
.classic{color:#aeb8cf;text-decoration:none;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.2);padding:9px 13px;border-radius:9px;white-space:nowrap;}
.classic:hover{color:#fff;border-color:#fff;}
.shell{max-width:1180px;margin:20px auto;padding:0 24px 60px;display:grid;grid-template-columns:220px 1fr;gap:22px;align-items:start;}
@media(max-width:760px){.shell{grid-template-columns:1fr;} .nav{display:flex;flex-wrap:wrap;gap:8px;position:static!important;}}
.nav{position:sticky;top:16px;}
.navlbl{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);padding:4px 12px 8px;}
.navitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;cursor:pointer;font:inherit;font-size:13.5px;font-weight:700;color:#3a4560;padding:10px 12px;border-radius:10px;margin-bottom:2px;}
.navitem:hover{background:#e8edf6;} .navitem.on{background:var(--navy);color:#fff;}
.navitem .n{margin-left:auto;font-size:11.5px;font-weight:700;opacity:.7;background:rgba(0,0,0,.06);border-radius:20px;padding:1px 8px;} .navitem.on .n{background:rgba(255,255,255,.18);opacity:1;}
.groups .grouphd{font-size:12px;font-weight:800;letter-spacing:.02em;color:var(--navy);margin:6px 2px 10px;display:flex;align-items:baseline;gap:9px;}
.groups .grouphd .gn{color:var(--muted);font-size:11.5px;font-weight:500;}
.list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 6px 24px rgba(10,20,50,.05);margin-bottom:22px;}
.trow{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;cursor:pointer;}
.trow:last-child{border-bottom:none;} .trow:hover{background:#f7f9fd;} .trow:hover .go{color:var(--red);}
.tico{width:38px;height:38px;flex:none;border-radius:10px;background:var(--wash);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
.tico svg{width:26px;height:26px;} .tico svg .icon,.tico .icon{width:26px;height:26px;}
.tmain{min-width:0;flex:1;}
.tname{font-weight:800;color:var(--navy);font-size:14px;display:flex;align-items:center;gap:9px;}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:20px;}
.tag.seller{background:#fdeceb;color:var(--red);} .tag.value{background:#e7f5ee;color:#1f8a5b;} .tag.deal{background:#fdf1df;color:#b5791f;} .tag.tenant{background:#eaf0ff;color:#2647b0;}
.tdesc{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:640px;}
.go{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--navy);white-space:nowrap;flex:none;transition:color .12s;}
.count{color:var(--muted);font-size:12.5px;padding:14px 4px 4px;}
.empty{padding:50px 20px;text-align:center;color:var(--muted);} .empty b{display:block;color:var(--navy);font-size:15px;margin-bottom:6px;}
.foot{max-width:1180px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:11.5px;}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<div class="top"><div class="top-in">
  <span class="brand" onclick="location.href='./index.html'"><span class="disc">RRG</span><span class="bar"></span><span class="wm">Restaurant<br>Realty<br>Group</span></span>
  <div class="ttl">Toolbox <small>Console view — search &amp; filter</small></div>
  <div class="searchwrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#dfe6f4" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="#dfe6f4" stroke-width="2" stroke-linecap="round"/></svg><input id="q" placeholder="Search tools…" autocomplete="off" oninput="draw()"></div>
  <a class="classic" href="./index.html">Classic view →</a>
</div></div>
<div class="shell">
  <div class="nav" id="nav"></div>
  <div><div id="results"></div></div>
</div>
<div class="foot">Proprietary &amp; Confidential · Property of Restaurant Realty Group, LLC · Internal RRG use only.</div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
var CATS=[{key:'all',label:'All tools'},{key:'book',label:'Book of Business'},{key:'pipeline',label:'Seller Engagement'},{key:'tenant',label:'Tenant Representation'}];
var CATLBL={book:'Book of Business',pipeline:'Seller Engagement',tenant:'Tenant Representation'};
var CATNOTE={book:'companies, contacts & deals',pipeline:'screen → value → market → close',tenant:'find, fit, tour, close the lease'};
var TOOLS=[
 {name:'Companies',tag:'Deal',file:'rrg_companies.html',icon:'buildings',cat:'book',order:1,desc:"Every company in your book — its contacts, locations, and deals in one file."},
 {name:'Contacts',tag:'Deal',file:'rrg_people.html',icon:'people',cat:'book',order:2,desc:"Every buyer, seller & client — open one to see all their deals, offers, tours & NDAs."},
 {name:'Deals',tag:'Deal',file:'rrg_assignments.html',icon:'briefcase',cat:'book',order:3,desc:"Every deal in one file — the whole pipeline, offers, tours, NDAs and data room."},
 {name:'Seller Qualification Calls',tag:'Seller',file:'rrg_screening_queue.html',icon:'funnel',cat:'pipeline',order:1,desc:"The front door — log prospective-seller calls and advance the real leads."},
 {name:'Valuation Questionnaires',tag:'Seller',file:'rrg_questionnaire_queue.html',icon:'gauge',cat:'pipeline',order:2,desc:"The deep listing profile that feeds a Business Valuation in one click."},
 {name:'Business Valuations',tag:'Value',file:'rrg_bov_queue.html',icon:'queue',cat:'pipeline',order:3,desc:"The RRG analyst drafts a defensible BOV; review, edit, and advance to a pack."},
 {name:'Data Rooms',tag:'Deal',file:'rrg_rooms_queue.html',icon:'vault',cat:'pipeline',order:4,desc:"A confidential per-deal document room with a buyer link and full access log."},
 {name:'Marketing Packs',tag:'Value',file:'rrg_cim_queue.html',icon:'book',cat:'pipeline',order:5,desc:"The confidential offering package (CIM) in the RRG format — build, edit, print."},
 {name:'Market Attack Plans',tag:'Seller',file:'rrg_attack_queue.html',icon:'megaphone',cat:'pipeline',order:6,desc:"The confidential go-to-market strategy — buyer universe, sequence, tension."},
 {name:'Commission Forecaster',tag:'Deal',file:'rrg_commission_calculator.html',icon:'calc',cat:'pipeline',order:7,desc:"Business-sale commission on the tiered rate card — gross, blended, agent/house."},
 {name:'Site Selection Criteria',tag:'Tenant',file:'ssc_form.html',icon:'target',cat:'tenant',order:1,desc:"Define a tenant's target — markets, space, economics, timeline."},
 {name:'Market Attack Plan',tag:'Tenant',file:'rrg_tenant_attack_plan.html',icon:'flag',cat:'tenant',order:2,desc:"The site-acquisition campaign — submarkets, landlord hit list, leverage."},
 {name:'Site & Concept Fit',tag:'Tenant',file:'rrg_site_fit.html',icon:'compass',cat:'tenant',order:3,desc:"Score a space for a concept — sales, occupancy cost, go / no-go."},
 {name:'Tour Tracker',tag:'Tenant',file:'rrg_tour_tracker.html',icon:'tour',cat:'tenant',order:4,desc:"Log every space you show — size, rent, reaction, rating. Rank the shortlist."},
 {name:'Lease Abstracts',tag:'Deal',file:'rrg_lease_queue.html',icon:'doc',cat:'tenant',order:5,desc:"Turn a lease into a clean one-look abstract — term, rent, options, NNN, guaranty."},
 {name:'Lease Commission',tag:'Deal',file:'rrg_lease_commission_calculator.html',icon:'building',cat:'tenant',order:6,desc:"Lease commission on total consideration — SF, rent, escalation, term, split."}
];
var ICONS={
 buildings:'<svg class="icon" viewBox="0 0 48 48" fill="none"><rect x="8" y="14" width="18" height="28" stroke="#000E31" stroke-width="1.6"/><path d="M26 42V22h14v20" stroke="#DA2B1F" stroke-width="1.6" stroke-linejoin="round"/><line x1="6" y1="42" x2="42" y2="42" stroke="#000E31" stroke-width="1.6"/><line x1="13" y1="20" x2="17" y2="20" stroke="#000E31" stroke-width="1.4"/><line x1="13" y1="26" x2="17" y2="26" stroke="#000E31" stroke-width="1.4"/><line x1="13" y1="32" x2="17" y2="32" stroke="#000E31" stroke-width="1.4"/><line x1="31" y1="28" x2="35" y2="28" stroke="#DA2B1F" stroke-width="1.4"/><line x1="31" y1="34" x2="35" y2="34" stroke="#DA2B1F" stroke-width="1.4"/></svg>',
 people:'<svg class="icon" viewBox="0 0 48 48" fill="none"><circle cx="18" cy="18" r="6" stroke="#000E31" stroke-width="1.6"/><path d="M7 39c0-6.5 5-11 11-11s11 4.5 11 11" stroke="#000E31" stroke-width="1.6" stroke-linecap="round"/><circle cx="33" cy="20" r="5" stroke="#DA2B1F" stroke-width="1.6"/><path d="M31 30c6 0 10 4 10 9" stroke="#DA2B1F" stroke-width="1.6" stroke-linecap="round"/></svg>',
 briefcase:'<svg class="icon" viewBox="0 0 48 48" fill="none"><rect x="7" y="15" width="34" height="24" rx="3" stroke="#000E31" stroke-width="1.6"/><path d="M18 15v-3a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v3" stroke="#000E31" stroke-width="1.6"/><line x1="7" y1="26" x2="41" y2="26" stroke="#DA2B1F" stroke-width="1.5"/><rect x="21" y="23" width="6" height="6" rx="1.5" fill="#fff" stroke="#DA2B1F" stroke-width="1.6"/></svg>',
 funnel:'<svg class="icon" viewBox="0 0 48 48" fill="none"><path d="M8 11h32L28 27v9l-8 4V27L8 11Z" stroke="#000E31" stroke-width="1.6" stroke-linejoin="round"/><line x1="14" y1="18" x2="34" y2="18" stroke="#DA2B1F" stroke-width="1.6"/><circle cx="24" cy="44" r="2.6" fill="#DA2B1F"/></svg>',
 gauge:'<svg class="icon" viewBox="0 0 48 48" fill="none"><path d="M8 33a16 16 0 0 1 32 0" stroke="#000E31" stroke-width="1.6" stroke-linecap="round"/><line x1="24" y1="33" x2="33" y2="22" stroke="#DA2B1F" stroke-width="1.8" stroke-linecap="round"/><circle cx="24" cy="33" r="3" fill="#000E31"/></svg>',
 queue:'<svg class="icon" viewBox="0 0 48 48" fill="none"><path d="M24 6 8 14l16 8 16-8-16-8Z" stroke="#000E31" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 24l16 8 16-8" stroke="#DA2B1F" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 32l16 8 16-8" stroke="#000E31" stroke-width="1.6" stroke-linejoin="round"/></svg>',
 vault:'<svg class="icon" viewBox="0 0 48 48" fill="none"><rect x="7" y="13" width="34" height="27" rx="3" stroke="#000E31" stroke-width="1.6"/><path d="M7 18h13l3-4h9" stroke="#000E31" stroke-width="1.6" stroke-linejoin="round" fill="none"/><rect x="19.5" y="26" width="9" height="8" rx="1.5" stroke="#DA2B1F" stroke-width="1.6"/><path d="M21.5 26v-2a2.5 2.5 0 0 1 5 0v2" stroke="#DA2B1F" stroke-width="1.5" fill="none"/></svg>',
 book:'<svg class="icon" viewBox="0 0 48 48" fill="none"><path d="M24 12c-3-2.4-7-3.4-11-3v24c4-.4 8 .6 11 3 3-2.4 7-3.4 11-3V9c-4-.4-8 .6-11 3Z" stroke="#000E31" stroke-width="1.6" stroke-linejoin="round"/><line x1="24" y1="12" x2="24" y2="36" stroke="#000E31" stroke-width="1.4"/></svg>',
 megaphone:'<svg class="icon" viewBox="0 0 48 48" fill="none"><path d="M10 20v8l4 1 2 8h4l-1.5-7L34 36V12L18.5 19H12a2 2 0 0 0-2 2Z" stroke="#000E31" stroke-width="1.6" stroke-linejoin="round"/><path d="M34 16c3 1.5 4.5 4 4.5 8s-1.5 6.5-4.5 8" stroke="#DA2B1F" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>',
 calc:'<svg class="icon" viewBox="0 0 48 48" fill="none"><rect x="11" y="6" width="26" height="36" rx="4" stroke="#000E31" stroke-width="1.6"/><rect x="16" y="11" width="16" height="6" rx="1.5" stroke="#000E31" stroke-width="1.4"/><circle cx="18" cy="25" r="1.6" fill="#000E31"/><circle cx="24" cy="25" r="1.6" fill="#000E31"/><circle cx="30" cy="25" r="1.6" fill="#DA2B1F"/><circle cx="18" cy="32" r="1.6" fill="#000E31"/><circle cx="30" cy="32" r="1.6" fill="#DA2B1F"/></svg>',
 target:'<svg class="icon" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="20" stroke="#000E31" stroke-width="1.6"/><circle cx="24" cy="24" r="12.5" stroke="#000E31" stroke-width="1.6"/><circle cx="24" cy="24" r="5" fill="#DA2B1F"/></svg>',
 flag:'<svg class="icon" viewBox="0 0 48 48" fill="none"><line x1="14" y1="6" x2="14" y2="42" stroke="#000E31" stroke-width="1.8" stroke-linecap="round"/><path d="M14 9h20l-4 6 4 6H14" stroke="#DA2B1F" stroke-width="1.6" stroke-linejoin="round" fill="none"/><circle cx="14" cy="6" r="2" fill="#000E31"/></svg>',
 compass:'<svg class="icon" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="19" stroke="#000E31" stroke-width="1.6"/><path d="M31 17l-4 10-10 4 4-10 10-4Z" stroke="#DA2B1F" stroke-width="1.6" stroke-linejoin="round"/><circle cx="24" cy="24" r="2.2" fill="#000E31"/></svg>',
 tour:'<svg class="icon" viewBox="0 0 48 48" fill="none"><rect x="12" y="8" width="24" height="34" rx="3" stroke="#000E31" stroke-width="1.6"/><rect x="18" y="5" width="12" height="6" rx="2" stroke="#000E31" stroke-width="1.5"/><path d="M18 20l3 3 5-6" stroke="#DA2B1F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="18" y1="31" x2="30" y2="31" stroke="#000E31" stroke-width="1.4"/></svg>',
 doc:'<svg class="icon" viewBox="0 0 48 48" fill="none"><path d="M13 6h15l7 7v29H13V6Z" stroke="#000E31" stroke-width="1.6" stroke-linejoin="round"/><line x1="18" y1="22" x2="30" y2="22" stroke="#000E31" stroke-width="1.6"/><line x1="18" y1="28" x2="30" y2="28" stroke="#000E31" stroke-width="1.6"/><line x1="18" y1="34" x2="26" y2="34" stroke="#DA2B1F" stroke-width="1.8"/></svg>',
 building:'<svg class="icon" viewBox="0 0 48 48" fill="none"><path d="M9 42V16l15-8 15 8v26" stroke="#000E31" stroke-width="1.6" stroke-linejoin="round"/><line x1="6" y1="42" x2="42" y2="42" stroke="#000E31" stroke-width="1.6"/><rect x="20" y="30" width="8" height="12" stroke="#DA2B1F" stroke-width="1.5"/></svg>'
};
var CAT='all';
function rowHTML(t){
  return '<a class="trow" href="./'+t.file+'"><div class="tico">'+(ICONS[t.icon]||ICONS.doc)+'</div>'
    +'<div class="tmain"><div class="tname">'+esc(t.name)+'<span class="tag '+t.tag.toLowerCase()+'">'+esc(t.tag)+'</span></div><div class="tdesc">'+esc(t.desc)+'</div></div>'
    +'<span class="go">Open →</span></a>';
}
function renderNav(){
  document.getElementById('nav').innerHTML='<div class="navlbl">Categories</div>'+CATS.map(function(c){
    var n=(c.key==='all')?TOOLS.length:TOOLS.filter(function(t){return t.cat===c.key;}).length;
    return '<button class="navitem'+(CAT===c.key?' on':'')+'" data-c="'+c.key+'"><span>'+esc(c.label)+'</span><span class="n">'+n+'</span></button>';
  }).join('');
  document.querySelectorAll('.navitem').forEach(function(b){ b.addEventListener('click',function(){ CAT=b.getAttribute('data-c'); renderNav(); draw(); }); });
}
function draw(){
  var q=(document.getElementById('q').value||'').toLowerCase().trim();
  var list=TOOLS.filter(function(t){
    if(CAT!=='all' && t.cat!==CAT) return false;
    if(q){ if((t.name+' '+t.desc+' '+t.tag).toLowerCase().indexOf(q)<0) return false; }
    return true;
  });
  var box=document.getElementById('results');
  if(!list.length){ box.innerHTML='<div class="list"><div class="empty"><b>No tools match “'+esc(q)+'”.</b>Try a different word, or clear the search.</div></div>'; return; }
  var filtering=(q || CAT!=='all'), html='';
  if(filtering){
    html='<div class="count">'+list.length+' tool'+(list.length===1?'':'s')+' shown</div>'
      +'<div class="list">'+list.slice().sort(function(a,b){return a.cat===b.cat?(a.order-b.order):0;}).map(rowHTML).join('')+'</div>';
  } else {
    html='<div class="groups">';
    ['book','pipeline','tenant'].forEach(function(cat){
      var items=list.filter(function(t){return t.cat===cat;}).sort(function(a,b){return a.order-b.order;});
      if(!items.length) return;
      html+='<div class="grouphd">'+esc(CATLBL[cat])+' <span class="gn">'+esc(CATNOTE[cat])+'</span></div>';
      html+='<div class="list">'+items.map(rowHTML).join('')+'</div>';
    });
    html+='</div>';
  }
  box.innerHTML=html;
}
renderNav(); draw();
document.getElementById('q').focus();
</script>
</body>
</html>
