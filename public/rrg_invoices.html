<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullServe — Invoices</title>
<style>.rl-filtbtn{display:none!important;}</style>
<script src="/rrg_list.js"></script>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--ink:#1a2236;--muted:#6b7488;--soft:#8a93a8;--line:#e6e9f0;--wash:#f5f7fb;--green:#1f8a5b;--teal:#4fb0a6;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#eef1f6;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);}
.wrap{max-width:none;margin:0 auto;padding:24px 28px 60px;}
.pgh{font-size:26px;font-weight:700;color:var(--navy);margin:6px 0 2px;}
.pgs{color:var(--muted);font-size:13.5px;margin-bottom:18px;max-width:820px;line-height:1.5;}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:0 4px 16px rgba(10,20,50,.04);min-width:140px;}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:700;}
.stat .v{font-size:20px;font-weight:700;color:var(--navy);margin-top:3px;}
.stat.amber .v{color:#b7791f;} .stat.green .v{color:var(--green);}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(10,20,50,.06);overflow:hidden;margin-bottom:20px;}
.hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;}
.hd b{color:var(--navy);font-size:15px;} .hd .sp{margin-left:auto;}
.cb{padding:6px 8px 10px;}
.lk{color:var(--navy);text-decoration:none;font-weight:600;} .lk:hover{text-decoration:underline;}
.meta{color:var(--muted);font-size:12px;}
.amt{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);}
.acts{display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end;white-space:nowrap;}
.badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:5px;padding:2px 8px;white-space:nowrap;}
.badge.draft{color:#5b6472;background:#eef1f6;border:1px solid #d9e0ea;}
.badge.sent{color:#2647b0;background:#eef2fb;border:1px solid #d6e0f5;}
.badge.partial{color:#a15c00;background:#fdf3e2;border:1px solid #f0d9ab;}
.badge.paid{color:#1f6f4e;background:#e7f5ee;border:1px solid #bce3cd;}
.badge.void{color:#a1352f;background:#fdeceb;border:1px solid #f0c9c6;}
.btn{font:inherit;font-size:12.5px;font-weight:700;padding:8px 13px;border:1px solid #cdd6e6;border-radius:9px;background:#fff;color:var(--navy);cursor:pointer;white-space:nowrap;}
.btn:hover{background:#f4f7fb;}
.btn.sm{padding:6px 11px;font-size:12px;}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy);} .btn.pri:hover{background:#0a1a44;}
.btn.red{background:var(--red);color:#fff;border-color:var(--red);}
.btn.ghost{background:#fff;} .btn.danger{color:var(--red);border-color:#f0c9c6;} .btn.danger:hover{background:#fdeceb;}
.btn.green{background:var(--green);color:#fff;border-color:var(--green);} .btn.green:hover{background:#186f48;}
.btn:disabled{opacity:.5;cursor:default;}
.ch{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;} .ch b{color:var(--navy);font-size:16px;} .ch .sp{margin-left:auto;display:flex;gap:8px;align-items:center;}
.body{padding:20px;}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.grid .full{grid-column:1 / -1;} .grid .two{grid-column:span 2;}
@media(max-width:760px){.grid{grid-template-columns:1fr;}.grid .full,.grid .two{grid-column:auto;}}
.fld{margin-bottom:2px;}
.fld label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:700;margin-bottom:6px;}
.fld input[type=text],.fld input[type=date],.fld input[type=number],.fld input[type=email],.fld select,.fld textarea{font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;width:100%;color:var(--ink);background:#fff;}
.fld textarea{min-height:64px;resize:vertical;line-height:1.5;}
.sec{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:700;margin:0 0 12px;}
.li{display:grid;gap:9px;align-items:center;margin-bottom:8px;}
.li.simple{grid-template-columns:1fr 200px 130px 32px;}
.li.det{grid-template-columns:1fr 62px 116px 116px 200px 32px;}
.li input,.li select{width:100%;font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);}
.li select.liacct{font-size:13px;padding:9px 10px;}
.li input.liqty{text-align:right;font-size:13px;padding:9px 8px;}
.lihdr{display:grid;gap:9px;margin-bottom:6px;padding:0 2px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#8a93a8;}
.lihdr.simple{grid-template-columns:1fr 200px 130px 32px;}
.lihdr.det{grid-template-columns:1fr 62px 116px 116px 200px 32px;}
.lihdr .r{text-align:right;}
@media(max-width:720px){.li,.lihdr{grid-template-columns:1fr!important;}.lihdr{display:none;}}
.li .money-in{width:170px;}
.money-in{position:relative;} .money-in span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--soft);font-size:14px;font-weight:700;} .money-in input{padding-left:24px !important;font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;width:100%;text-align:right;}
.li .rm{border:none;background:#fdeceb;color:var(--red);width:30px;height:30px;border-radius:8px;font-size:16px;cursor:pointer;flex:0 0 auto;}
.totals{display:flex;justify-content:flex-end;gap:26px;padding:12px 2px 2px;}
.totals .tt{text-align:right;} .totals .tt .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);font-weight:700;} .totals .tt .v{font-size:19px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;}
.totals .tt.bal .v{color:var(--red);} .totals .tt.paid .v{color:var(--green);}
.payrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #eef1f6;font-size:13px;}
.payrow .pd{width:64px;color:var(--muted);font-variant-numeric:tabular-nums;} .payrow .pm{flex:1;color:var(--ink);} .payrow .pa{font-weight:700;font-variant-numeric:tabular-nums;} .payrow .px{width:30px;text-align:right;}
.payrow .px button{border:none;background:none;color:var(--red);cursor:pointer;font-size:15px;}
.payform{display:grid;grid-template-columns:120px 150px 1fr auto;gap:9px;align-items:end;margin-top:10px;background:var(--wash);border:1px solid var(--line);border-radius:10px;padding:11px 12px;}
@media(max-width:700px){.payform{grid-template-columns:1fr 1fr;}}
.hint{font-size:11.5px;color:var(--soft);margin-top:5px;}
.msg{font-size:12.5px;font-weight:700;} .msg.ok{color:var(--green);} .msg.err{color:var(--red);}
.empty{padding:34px 20px;text-align:center;color:var(--soft);font-size:13.5px;}
.roinfo{background:#f7f9fc;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:12px;color:var(--muted);font-size:12.5px;}
/* NetSuite normalization — squared corners, flat surfaces, blue accents */
.stat,.card,.payform{border-radius:6px !important;box-shadow:0 1px 2px rgba(16,24,40,.04) !important;}
.stat{border:1px solid var(--line) !important;}
.btn,.fld input[type=text],.fld input[type=date],.fld input[type=number],.fld input[type=email],.fld select,.fld textarea,.li input.desc,.money-in input,.roinfo,.li .rm{border-radius:4px !important;}
.badge{border-radius:3px !important;}
.pgh{font-weight:700;letter-spacing:-.01em;}
.fld input:focus,.fld select:focus,.fld textarea:focus,.li input.desc:focus,.money-in input:focus{outline:none;border-color:#2c5c8f !important;box-shadow:0 0 0 3px rgba(44,92,143,.14) !important;}
.lk{color:#2c5c8f;}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<div class="wrap">
  <h1 class="pgh">Invoices</h1>
  <div class="pgs">Bill your commission and fees per transaction, then record payments against each invoice. Balance and status update themselves as payments come in. Your invoices are private to you; admins see the whole team.</div>
  <div class="stats" id="stats"></div>
  <div id="root"></div>
</div>
<script>
var ROWS=[], CTL=null, BUILT=false, EDIT=null, DEL_ARM=false;
var STATUSES=['Draft','Sent','Void'], METHODS=[], IS_ADMIN=false, LISTINGS=[], INCOME_ACCTS=[], STRIPE_ON=false, TAX_DEFAULT={rate:0,label:'Sales Tax'}, LINE_DETAIL=false;
var TERMS_LIST=['Due on receipt','Net 10','Net 15','Net 30','Due on Lease Execution','Due on Rent Commencement','50% Execution / 50% Rent Commencement','Due at Closing','Upon Receipt of Landlord Payment'];
function addDaysISO(dateStr,n){ var d=new Date(String(dateStr)+'T00:00:00'); if(isNaN(d.getTime())) return dateStr; d.setDate(d.getDate()+(+n||0)); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function termNetDays(label){ label=String(label||'').trim(); if(/^due on receipt$/i.test(label)) return 0; var m=label.match(/net\s*(\d+)/i); return m?parseInt(m[1],10):null; }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmtDate(iso){ if(!iso) return ''; var x=String(iso).slice(0,10).split('-'); if(x.length!==3) return String(iso).slice(0,10); return x[1]+'/'+x[2]+'/'+x[0].slice(2); }
function money(n){ n=Number(n||0); return (window.RRG_CCYSYM||String.fromCharCode(36))+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
var RECUR_LABELS={weekly:'Weekly',biweekly:'Every 2 weeks',monthly:'Monthly',quarterly:'Quarterly',yearly:'Yearly'};
function recurLabel(f){ return RECUR_LABELS[f]||''; }
function advanceISO(dateStr,freq){ var d=new Date(String(dateStr)+'T00:00:00'); if(isNaN(d.getTime())) return dateStr; if(freq==='weekly')d.setDate(d.getDate()+7); else if(freq==='biweekly')d.setDate(d.getDate()+14); else if(freq==='monthly')d.setMonth(d.getMonth()+1); else if(freq==='quarterly')d.setMonth(d.getMonth()+3); else if(freq==='yearly')d.setFullYear(d.getFullYear()+1); else return dateStr; return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function updateRecurUI(){ var sel=document.getElementById('f_recur'); if(!sel) return; var f=sel.value, on=!!f; var nw=document.getElementById('recNextWrap'), aw=document.getElementById('recActWrap'), h=document.getElementById('recHint'); if(nw)nw.style.display=on?'':'none'; if(aw)aw.style.display=on?'':'none'; var nx=document.getElementById('f_recnext'); if(on&&nx&&!nx.value){ var base=document.getElementById('f_issue'); nx.value=advanceISO((base&&base.value)||todayISO(),f); } if(h){ if(!on){ h.textContent='Set a frequency to auto-generate a new Sent invoice each period from this invoice’s line items.'; } else { var cnt=(EDIT&&EDIT.recur&&EDIT.recur.count)||0; h.textContent='A new invoice is generated automatically — '+recurLabel(f)+'.'+(cnt?(' '+cnt+' generated so far'+((EDIT.recur&&EDIT.recur.lastGenerated)?(' — last '+fmtDate(EDIT.recur.lastGenerated)):'')+'.'):''); } } }
function api(m,u,b){return fetch(u,{method:m,credentials:'same-origin',headers:b?{'Content-Type':'application/json'}:undefined,body:b?JSON.stringify(b):undefined}).then(function(r){return r.json();});}
var LIST_SHELL='<div class="card"><div class="hd"><b>Invoices</b><span class="meta" id="icount"></span><span class="sp"></span><button class="btn sm pri" id="i_new">+ New invoice</button></div><div class="cb"><div id="ilist"><div class="empty">Loading…</div></div></div></div><div id="editor"></div>';
function statusBadge(x){ var c=String(x.status||'Draft').toLowerCase(); return '<span class="badge '+c+'">'+esc(x.status)+'</span>'; }
function actionsCell(x){ var s=''; if(x.mine){ s+='<button class="btn ghost sm" data-edit="'+esc(x.id)+'">Open</button>'; s+='<button class="btn danger sm" data-del="'+esc(x.id)+'">Delete</button>'; } else { s+='<button class="btn ghost sm" data-edit="'+esc(x.id)+'">View</button>'; } return '<div class="acts">'+s+'</div>'; }
function listCfg(){ var cols=[
    { label:'Invoice #', sort:function(a,b){return RRGList.cmp(a.number,b.number);}, cell:function(x){ return '<a class="lk" href="#" data-edit="'+esc(x.id)+'">'+esc(x.number||'—')+'</a>'+(x.recur?(' <span class="badge sent" title="Recurring — '+esc(recurLabel(x.recur.freq))+'">↻ '+esc(recurLabel(x.recur.freq))+'</span>'):(x.seriesId?' <span class="meta" title="Generated from a recurring series">↻</span>':'')); } },
    { label:'Deal / Listing', sort:function(a,b){return RRGList.cmp(a.listingLabel,b.listingLabel);}, cell:function(x){ return x.listingLabel?esc(x.listingLabel):'<span class="meta">—</span>'; } },
    { label:'Bill to', sort:function(a,b){return RRGList.cmp(a.billTo,b.billTo);}, cell:function(x){ return x.billTo?esc(x.billTo):'<span class="meta">—</span>'; } },
    { label:'Issued', sort:function(a,b){return RRGList.cmp(a.issueDate,b.issueDate);}, cell:function(x){ return '<span class="meta">'+esc(fmtDate(x.issueDate)||'—')+'</span>'; } },
    { label:'Due', sort:function(a,b){return RRGList.cmp(a.dueDate,b.dueDate);}, cell:function(x){ return '<span class="meta">'+esc(fmtDate(x.dueDate)||'—')+'</span>'; }, defaultHidden:true },
    { label:'Total', align:'right', sort:function(a,b){return RRGList.cmp(Number(a.total||0),Number(b.total||0));}, cell:function(x){ return '<span class="amt">'+money(x.total)+'</span>'; } },
    { label:'Paid', align:'right', sort:function(a,b){return RRGList.cmp(Number(a.paid||0),Number(b.paid||0));}, cell:function(x){ return '<span class="amt" style="color:var(--green)">'+money(x.paid)+'</span>'; } },
    { label:'Balance', align:'right', sort:function(a,b){return RRGList.cmp(Number(a.balance||0),Number(b.balance||0));}, cell:function(x){ var b=Number(x.balance||0); return '<span class="amt"'+(b>0.005?' style="color:var(--red)"':'')+'>'+money(b)+'</span>'; } },
    { label:'Status', sort:function(a,b){return RRGList.cmp(a.status,b.status);}, cell:statusBadge } ];
  if(IS_ADMIN) cols.push({ label:'Rep', sort:function(a,b){return RRGList.cmp(a.ownerName,b.ownerName);}, cell:function(x){ return x.mine?'You':(x.ownerName?esc(x.ownerName):'<span class="meta">—</span>'); } });
  cols.push({ label:'', sortable:false, cell:actionsCell });
  return { mount:'#ilist', data:ROWS, key:'invoices', empty:'<div class="empty">No invoices yet. Click <b>+ New invoice</b> to bill a transaction.</div>',
    rowId:function(x){return x.id;}, defaultSort:0, defaultDir:-1, columns:cols }; }
function refreshList(){ if(CTL) CTL.refresh(ROWS); else CTL=RRGList.create(listCfg()); var c=document.getElementById('icount'); if(c) c.textContent=ROWS.length+(ROWS.length===1?' invoice':' invoices'); renderStats(); }
function renderStats(){
  var host=document.getElementById('stats'); if(!host) return;
  var billed=0,collected=0; ROWS.forEach(function(x){ if(x.baseStatus!=='Void'){ billed+=Number(x.total||0); collected+=Number(x.paid||0); } });
  host.innerHTML='<div class="stat"><div class="k">Billed</div><div class="v">'+money(billed)+'</div></div>'
    +'<div class="stat green"><div class="k">Collected</div><div class="v">'+money(collected)+'</div></div>'
    +'<div class="stat amber"><div class="k">Outstanding</div><div class="v">'+money(billed-collected)+'</div></div>';
}
function curById(id){ return ROWS.filter(function(x){return x.id===id;})[0]||null; }
function opt(list,val){ return list.map(function(o){ return '<option value="'+esc(o)+'"'+(o===val?' selected':'')+'>'+esc(o)+'</option>'; }).join(''); }
function listingOpts(val){ var s='<option value="">— None —</option>'; LISTINGS.forEach(function(l){ s+='<option value="'+esc(l.key)+'"'+(l.key===val?' selected':'')+'>'+esc(l.business||l.key)+'</option>'; }); return s; }
function payLinkBlock(x){ if(!(STRIPE_ON && x && x.id && x.payToken)) return ''; var url=location.origin+'/pay/'+x.payToken; var hid=!!x.noOnlinePay; return '<div class="sec"><h3>Online payment</h3>'+'<label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;margin-bottom:10px"><input type="checkbox" id="f_nopay"'+(hid?' checked':'')+' style="width:auto"> Hide the online pay link on this invoice (e.g. a large commission paid by wire)</label>'+'<div id="payLinkRow" class="roinfo" style="'+(hid?'display:none;':'')+'gap:10px;align-items:center;flex-wrap:wrap"><span>Share this secure link so the client can pay by card or bank (ACH):</span><a href="'+esc(url)+'" target="_blank" style="color:#2c5c8f;font-weight:600;word-break:break-all">'+esc(url)+'</a><button class="btn ghost sm" id="copyPay" type="button" data-url="'+esc(url)+'">Copy link</button></div>'+'</div>'; }
function termsOpts(cur){ var out='<option value="">\u2014 none \u2014</option>'; var found=false; TERMS_LIST.forEach(function(v){ if(v===cur) found=true; out+='<option'+(v===cur?' selected':'')+'>'+esc(v)+'</option>'; }); if(cur&&!found){ out='<option value="'+esc(cur)+'" selected>'+esc(cur)+' (custom)</option>'+out; } return out; }
function onTermsChange(){ var sel=document.getElementById('f_terms'); if(!sel) return; var n=termNetDays(sel.value); var due=document.getElementById('f_due'); if(n!==null&&due){ var iss=(document.getElementById('f_issue')||{}).value||todayISO(); due.value=addDaysISO(iss,n); } }
function acctOpts(cur){ cur=cur||'4000'; if(!INCOME_ACCTS.length) return '<option value="'+esc(cur)+'" selected>'+esc(cur)+'</option>'; return INCOME_ACCTS.map(function(a){ return '<option value="'+esc(a.code)+'"'+(a.code===cur?' selected':'')+'>'+esc(a.code)+' '+esc(a.name)+'</option>'; }).join(''); }
function liRow(li,i,ro){
  var acct='<select class="liacct" data-liacct="'+i+'"'+(ro?' disabled':'')+' title="Income account (Chart of Accounts)">'+acctOpts(li.account)+'</select>';
  var rm=(ro?'<span></span>':'<button class="rm" data-lirm="'+i+'" title="Remove line">\u00d7</button>');
  var desc='<input class="desc" data-lidesc="'+i+'" value="'+esc(li.desc||'')+'"'+(ro?' readonly':'')+' placeholder="Description">';
  if(LINE_DETAIL){
    var qty=(li.qty!=null&&li.qty!=='')?li.qty:'';
    var rate=(li.rate!=null&&li.rate!=='')?li.rate:'';
    return '<div class="li det" data-li="'+i+'">'+desc
      +'<input class="liqty" type="number" step="any" min="0" data-liqty="'+i+'" value="'+esc(qty)+'"'+(ro?' readonly':'')+' placeholder="Qty">'
      +'<div class="money-in"><span>$</span><input type="number" step="0.01" data-lirate="'+i+'" value="'+esc(rate)+'"'+(ro?' readonly':'')+' placeholder="Each"></div>'
      +'<div class="money-in"><span>$</span><input type="number" step="0.01" data-liamt="'+i+'" value="'+(li.amount?esc(li.amount):'')+'"'+(ro?' readonly':'')+' placeholder="0.00" title="Extended (Qty \u00d7 Each)"></div>'
      +acct+rm+'</div>';
  }
  return '<div class="li simple" data-li="'+i+'">'+desc+acct
    +'<div class="money-in"><span>$</span><input type="number" step="0.01" data-liamt="'+i+'" value="'+(li.amount?esc(li.amount):'')+'"'+(ro?' readonly':'')+' placeholder="0.00"></div>'
    +rm+'</div>';
}
function recalcRow(i){ var q=document.querySelector('[data-liqty="'+i+'"]'); var r=document.querySelector('[data-lirate="'+i+'"]'); var a=document.querySelector('[data-liamt="'+i+'"]'); if(a&&q&&r&&q.value!==''&&r.value!==''){ a.value=(Math.round(Number(q.value||0)*Number(r.value||0)*100)/100)||''; } }
function collectLines(){ var arr=[]; document.querySelectorAll('#liWrap .li').forEach(function(row){ var i=row.getAttribute('data-li'); var d=document.querySelector('[data-lidesc="'+i+'"]'); var a=document.querySelector('[data-liamt="'+i+'"]'); var ac=document.querySelector('[data-liacct="'+i+'"]'); var o={desc:d?d.value:'',account:ac?ac.value:''}; if(LINE_DETAIL){ var qt=document.querySelector('[data-liqty="'+i+'"]'); var rt=document.querySelector('[data-lirate="'+i+'"]'); o.qty=(qt&&qt.value!=='')?Number(qt.value):''; o.rate=(rt&&rt.value!=='')?Number(rt.value):''; o.amount=(a&&a.value!=='')?Number(a.value):((o.qty!==''&&o.rate!=='')?Math.round(o.qty*o.rate*100)/100:0); } else { o.amount=a?Number(a.value||0):0; } arr.push(o); }); return arr; }
function lineTotal(){ return collectLines().reduce(function(s,li){return s+Number(li.amount||0);},0); }
function renderLines(ro){ var w=document.getElementById('liWrap'); if(!w) return; var arr=(EDIT.lineItems&&EDIT.lineItems.length)?EDIT.lineItems:[{desc:'',amount:''}]; var hdr=LINE_DETAIL?'<div class="lihdr det"><span>Description</span><span class="r">Qty</span><span class="r">Each</span><span class="r">Extended</span><span>Account</span><span></span></div>':'<div class="lihdr simple"><span>Description</span><span>Account</span><span class="r">Amount</span><span></span></div>'; w.innerHTML=hdr+arr.map(function(li,i){return liRow(li,i,ro);}).join(''); wireLines(ro); updateEditorTotals(); }
function wireLines(ro){ if(ro) return; document.querySelectorAll('#liWrap [data-liqty],#liWrap [data-lirate]').forEach(function(el){ el.addEventListener('input',function(){ recalcRow(el.getAttribute('data-liqty')||el.getAttribute('data-lirate')); updateEditorTotals(); }); }); document.querySelectorAll('#liWrap [data-liamt]').forEach(function(el){ el.addEventListener('input',updateEditorTotals); }); document.querySelectorAll('#liWrap [data-lirm]').forEach(function(el){ el.addEventListener('click',function(){ EDIT.lineItems=collectLines(); var i=Number(el.getAttribute('data-lirm')); EDIT.lineItems.splice(i,1); if(!EDIT.lineItems.length) EDIT.lineItems=[{desc:'',amount:''}]; renderLines(ro); }); }); }
function taxRateVal(){ var e=document.getElementById('f_taxrate'); var r=e?Number(e.value||0):Number((EDIT&&EDIT.taxRate)||0); return (isFinite(r)&&r>0)?Math.min(100,r):0; }
function updateEditorTotals(){ var sub=lineTotal(); var rate=taxRateVal(); var tax=Math.round(sub*rate/100*100)/100; var t=Math.round((sub+tax)*100)/100; var paid=(EDIT.payments||[]).reduce(function(s,p){return s+Number(p.amount||0);},0);
  var es=document.getElementById('edSub'); if(es) es.textContent=money(sub);
  var tile=document.getElementById('edTaxTile'); if(tile){ if(rate>0){ tile.style.display=''; var etx=document.getElementById('edTax'); if(etx) etx.textContent=money(tax); var etk=document.getElementById('edTaxK'); if(etk){ var lbl=(document.getElementById('f_taxlabel')||{}).value||(EDIT&&EDIT.taxLabel)||'Sales Tax'; etk.textContent=lbl+' ('+rate+'%)'; } } else { tile.style.display='none'; } }
  var el=document.getElementById('edTotal'); if(el) el.textContent=money(t);
  var ep=document.getElementById('edPaid'); if(ep) ep.textContent=money(paid);
  var eb=document.getElementById('edBal'); if(eb) eb.textContent=money(t-paid); }
function payListHTML(ro){ var ps=(EDIT.payments||[]); if(!ps.length) return '<div class="empty" style="padding:14px 4px;text-align:left">No payments recorded yet.</div>'; return ps.map(function(p){ return '<div class="payrow"><div class="pd">'+esc(fmtDate(p.date)||'—')+'</div><div class="pm">'+money(p.amount)+(p.method?(' · '+esc(p.method)):'')+(p.reference?(' · '+esc(p.reference)):'')+(p.notes?('<span class="meta"> — '+esc(p.notes)+'</span>'):'')+'</div><div class="px">'+(ro?'':'<button data-payrm="'+esc(p.id)+'" title="Remove payment">×</button>')+'</div></div>'; }).join(''); }
function renderEditor(){
  var host=document.getElementById('editor'); if(!host) return;
  if(!EDIT){ host.innerHTML=''; return; }
  var x=EDIT; var ro=(x.id&&!x.mine); var saved=!!x.id;
  host.innerHTML='<div class="card"><div class="ch"><b>'+(ro?'View invoice':(saved?('Invoice '+esc(x.number||'')):'New invoice'))+'</b><span class="sp"><span class="msg" id="msg"></span>'+((saved&&x.mine)?'<button class="btn danger sm" id="delBtn">Delete</button>':'')+'<button class="btn ghost sm" id="closeBtn">Close</button>'+(ro?'':'<button class="btn red" id="saveBtn">Save invoice</button>')+'</span></div><div class="body">'
    +(ro?'<div class="roinfo">Read-only — this invoice belongs to '+(x.ownerName?('<b>'+esc(x.ownerName)+'</b>'):'another rep')+'.</div>':'')
    +'<div class="grid">'
    +'<div class="fld two"><label>Deal / Listing</label><select id="f_listing"'+(ro?' disabled':'')+'>'+listingOpts(x.listingKey||'')+'</select></div>'
    +'<div class="fld"><label>Status</label><select id="f_status"'+(ro?' disabled':'')+'>'+opt(STATUSES,x.baseStatus||'Draft')+'</select></div>'
    +'<div class="fld"><label>Bill to</label><input type="text" id="f_billto" value="'+esc(x.billTo||'')+'"'+(ro?' readonly':'')+' placeholder="Client / company name"></div>'
    +'<div class="fld"><label>Bill-to email</label><input type="email" id="f_billemail" value="'+esc(x.billToEmail||'')+'"'+(ro?' readonly':'')+' placeholder="optional"></div>'
    +'<div class="fld"><label>&nbsp;</label><div style="display:flex;gap:10px"><div style="flex:1"><label style="font-size:11px;color:var(--soft);font-weight:700;text-transform:uppercase;letter-spacing:.05em">Issued</label><input type="date" id="f_issue" value="'+esc(x.issueDate||'')+'"'+(ro?' disabled':'')+'></div><div style="flex:1"><label style="font-size:11px;color:var(--soft);font-weight:700;text-transform:uppercase;letter-spacing:.05em">Due</label><input type="date" id="f_due" value="'+esc(x.dueDate||'')+'"'+(ro?' disabled':'')+'></div></div></div>'
    +'</div>'
    +'<div class="sec"><h3>Line items</h3><div id="liWrap"></div>'+(ro?'':'<button class="btn ghost sm" id="addLine" style="margin-top:4px">+ Add line</button>')
    +(ro?'':'<div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:#6b7488"><label for="f_taxrate" style="font-weight:600">Tax</label><input type="text" id="f_taxlabel" value="'+esc(x.taxLabel||'')+'" placeholder="Sales Tax" style="width:150px;font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:4px"><input type="number" id="f_taxrate" min="0" step="0.001" value="'+(x.taxRate?esc(x.taxRate):'')+'" placeholder="0" style="width:80px;font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;text-align:right"><span>%</span></div>')
    +'<div class="totals"><div class="tt"><div class="k">Subtotal</div><div class="v" id="edSub">$0.00</div></div><div class="tt" id="edTaxTile" style="display:none"><div class="k" id="edTaxK">Tax</div><div class="v" id="edTax">$0.00</div></div><div class="tt"><div class="k">Total</div><div class="v" id="edTotal">$0.00</div></div><div class="tt paid"><div class="k">Paid</div><div class="v" id="edPaid">$0.00</div></div><div class="tt bal"><div class="k">Balance</div><div class="v" id="edBal">$0.00</div></div></div></div>'
    +'<div class="grid" style="margin-top:16px"><div class="fld two"><label>Notes</label><textarea id="f_notes"'+(ro?' readonly':'')+' placeholder="Internal notes on this invoice">'+esc(x.notes||'')+'</textarea></div><div class="fld"><label>Terms</label><select id="f_terms"'+(ro?' disabled':'')+'>'+termsOpts(x.terms||'')+'</select></div></div>'
    +'<div class="sec"><h3>Recurring</h3>'+(x.seriesId?'<div class="roinfo">Auto-generated from a recurring invoice series.</div>':'')+'<div class="grid"><div class="fld"><label>Repeat</label><select id="f_recur"'+(ro?' disabled':'')+'><option value="">Does not repeat</option><option value="weekly">Weekly</option><option value="biweekly">Every 2 weeks</option><option value="monthly">Monthly</option><option value="quarterly">Quarterly</option><option value="yearly">Yearly</option></select></div><div class="fld" id="recNextWrap" style="display:none"><label>Next issue date</label><input type="date" id="f_recnext"'+(ro?' disabled':'')+'></div><div class="fld" id="recActWrap" style="display:none"><label>Series status</label><select id="f_recactive"'+(ro?' disabled':'')+'><option value="1">Active — generating</option><option value="0">Paused</option></select></div></div><div class="hint" id="recHint"></div></div>'
    +payLinkBlock(x)+'<div class="sec"><h3>Payments</h3>'+(saved?('<div id="payList">'+payListHTML(ro)+'</div>'+(ro?'':'<div class="payform"><div class="fld"><label>Date</label><input type="date" id="p_date" value="'+todayISO()+'"></div><div class="fld"><label>Amount</label><div class="money-in"><span>$</span><input type="number" step="0.01" id="p_amt" placeholder="0.00"></div></div><div class="fld"><label>Method / reference</label><input type="text" id="p_ref" placeholder="Check #, wire, etc."><select id="p_method" style="margin-top:8px">'+opt(METHODS,'')+'</select></div><div class="fld"><label>&nbsp;</label><button class="btn green" id="addPay">Record payment</button></div></div>')):'<div class="roinfo">Save the invoice first, then you can record payments against it.</div>')+'</div>'
    +'</div></div>';
  document.getElementById('closeBtn').onclick=function(){ EDIT=null; renderEditor(); };
  renderLines(ro);
  (function(){ var cp=document.getElementById('copyPay'); if(cp) cp.onclick=function(){ var u=cp.getAttribute('data-url'); function done(){ cp.textContent='Copied \u2713'; setTimeout(function(){cp.textContent='Copy link';},1500); } if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(u).then(done,function(){ window.prompt('Copy this link:',u); }); } else { window.prompt('Copy this link:',u); } }; var np=document.getElementById('f_nopay'); if(np) np.onchange=function(){ var row=document.getElementById('payLinkRow'); if(row) row.style.display=np.checked?'none':'flex'; }; })();
  (function(){ var rs=document.getElementById('f_recur'); if(rs) rs.value=(x.recur&&x.recur.freq)||''; var rn=document.getElementById('f_recnext'); if(rn) rn.value=(x.recur&&x.recur.nextDate)||''; var ra=document.getElementById('f_recactive'); if(ra) ra.value=(x.recur&&x.recur.active===false)?'0':'1'; updateRecurUI(); if(rs&&!ro) rs.onchange=updateRecurUI; })();
  if(!ro){
    var al=document.getElementById('addLine'); if(al) al.onclick=function(){ EDIT.lineItems=collectLines(); EDIT.lineItems.push({desc:'',amount:''}); renderLines(ro); };
    document.getElementById('saveBtn').onclick=save;
    var _tsel=document.getElementById('f_terms'); if(_tsel) _tsel.onchange=onTermsChange;
    ['f_taxrate','f_taxlabel'].forEach(function(id){ var e=document.getElementById(id); if(e) e.addEventListener('input',updateEditorTotals); });
    var _iss=document.getElementById('f_issue'); if(_iss) _iss.addEventListener('change',onTermsChange);
    var db=document.getElementById('delBtn'); if(db) db.onclick=onDelete;
    var ap=document.getElementById('addPay'); if(ap) ap.onclick=addPayment;
    document.querySelectorAll('#payList [data-payrm]').forEach(function(el){ el.addEventListener('click',function(){ removePayment(el.getAttribute('data-payrm')); }); });
    var pm=document.querySelector('#p_method option'); // ensure placeholder
  }
}
function render(){ var root=document.getElementById('root'); if(!BUILT){ root.innerHTML=LIST_SHELL; BUILT=true; document.getElementById('i_new').onclick=newInv; } refreshList(); renderEditor(); }
function openEdit(id){ var x=curById(id); if(!x) return; api('GET','/api/invoices/'+encodeURIComponent(id)).then(function(j){ if(!j.ok){ alert(j.error||'Could not open invoice.'); return; } EDIT=j.invoice; if(j.methods) METHODS=j.methods; if(j.incomeAccounts) INCOME_ACCTS=j.incomeAccounts; if(j.terms&&j.terms.length) TERMS_LIST=j.terms; if(typeof j.stripeEnabled!=='undefined') STRIPE_ON=!!j.stripeEnabled; if(j.taxDefault) TAX_DEFAULT=j.taxDefault; if(typeof j.lineDetail!=='undefined') LINE_DETAIL=!!j.lineDetail; renderEditor(); var ed=document.getElementById('editor'); if(ed) ed.scrollIntoView({behavior:'smooth',block:'start'}); }); }
function newInv(){ EDIT={id:'',number:'',listingKey:'',listingLabel:'',billTo:'',billToEmail:'',issueDate:todayISO(),dueDate:'',baseStatus:'Draft',lineItems:[{desc:'',amount:''}],payments:[],notes:'',terms:'',taxRate:(TAX_DEFAULT.rate||0),taxLabel:(TAX_DEFAULT.label||'Sales Tax'),mine:true}; renderEditor(); var ed=document.getElementById('editor'); if(ed) ed.scrollIntoView({behavior:'smooth',block:'start'}); }
function msg(t,cls){ var m=document.getElementById('msg'); if(!m) return; m.textContent=t; m.className='msg '+(cls||''); if(t){ setTimeout(function(){ if(m.textContent===t){m.textContent='';m.className='msg';} },3000); } }
function save(){
  var lk=document.getElementById('f_listing').value||'';
  var ll=''; if(lk){ var m=LISTINGS.filter(function(l){return l.key===lk;})[0]; ll=m?(m.business||''):''; }
  var lines=collectLines().filter(function(li){return (li.desc&&li.desc.trim())||Number(li.amount||0);});
  var body={ listingKey:lk, listingLabel:ll, billTo:document.getElementById('f_billto').value, billToEmail:document.getElementById('f_billemail').value,
    issueDate:document.getElementById('f_issue').value, dueDate:document.getElementById('f_due').value, status:document.getElementById('f_status').value,
    lineItems:lines, notes:document.getElementById('f_notes').value, terms:document.getElementById('f_terms').value };
  var _np=document.getElementById('f_nopay'); if(_np) body.noOnlinePay=_np.checked;
  var _tr=document.getElementById('f_taxrate'); if(_tr) body.taxRate=Number(_tr.value||0)||0; var _tl=document.getElementById('f_taxlabel'); if(_tl) body.taxLabel=_tl.value||'';
  var rf=document.getElementById('f_recur'); if(rf&&rf.value){ body.recur={freq:rf.value, nextDate:(document.getElementById('f_recnext')||{}).value||'', active:((document.getElementById('f_recactive')||{}).value!=='0')}; } else body.recur=null;
  if(EDIT&&EDIT.id) body.id=EDIT.id;
  var btn=document.getElementById('saveBtn'); btn.disabled=true;
  api('POST','/api/invoices',body).then(function(j){ btn.disabled=false; if(!j.ok){ msg(j.error||'Save failed.','err'); return; } EDIT=j.invoice; loadKeepEditor(); msg('Saved','ok'); }).catch(function(){ btn.disabled=false; msg('Save failed.','err'); });
}
function addPayment(){
  if(!EDIT||!EDIT.id) return;
  var amt=Number(document.getElementById('p_amt').value||0); if(!(amt>0)){ msg('Enter a payment amount.','err'); return; }
  var body={ date:document.getElementById('p_date').value, amount:amt, method:document.getElementById('p_method').value, reference:document.getElementById('p_ref').value };
  var b=document.getElementById('addPay'); b.disabled=true;
  api('POST','/api/invoices/'+encodeURIComponent(EDIT.id)+'/payment',body).then(function(j){ b.disabled=false; if(!j.ok){ msg(j.error||'Could not record payment.','err'); return; } EDIT=j.invoice; loadKeepEditor(); msg('Payment recorded','ok'); }).catch(function(){ b.disabled=false; msg('Could not record payment.','err'); });
}
async function removePayment(pid){ if(!EDIT||!EDIT.id) return; if(!await rrgConfirm('Remove this payment?')) return; api('DELETE','/api/invoices/'+encodeURIComponent(EDIT.id)+'/payment/'+encodeURIComponent(pid)).then(function(j){ if(!j.ok){ msg(j.error||'Could not remove.','err'); return; } EDIT=j.invoice; loadKeepEditor(); }); }
function onDelete(){
  if(!EDIT||!EDIT.id) return;
  if(!DEL_ARM){ DEL_ARM=true; var b=document.getElementById('delBtn'); b.textContent='Really delete?'; b.classList.add('red'); setTimeout(function(){ if(DEL_ARM){ DEL_ARM=false; var x=document.getElementById('delBtn'); if(x){x.textContent='Delete';x.classList.remove('red');} } },3500); return; }
  DEL_ARM=false;
  api('DELETE','/api/invoices/'+encodeURIComponent(EDIT.id)).then(function(j){ if(!j.ok){ msg(j.error||'Delete failed.','err'); return; } EDIT=null; load(); });
}
document.addEventListener('click',async function(e){ if(!e.target.closest) return; var ed=e.target.closest('[data-edit]'); if(ed){ e.preventDefault(); openEdit(ed.getAttribute('data-edit')); return; } var dl=e.target.closest('[data-del]'); if(dl){ e.preventDefault(); var _x=curById(dl.getAttribute('data-del')); if(_x && await rrgConfirm('Delete invoice '+(_x.number||'')+'? This removes its payments too.')){ api('DELETE','/api/invoices/'+encodeURIComponent(_x.id)).then(function(j){ if(j&&j.ok){ if(EDIT&&EDIT.id===_x.id) EDIT=null; load(); } else alert((j&&j.error)||'Delete failed.'); }); } return; } });
function loadListings(){ return api('GET','/api/assignments').then(function(j){ LISTINGS=(j&&j.assignments)?j.assignments.map(function(a){return {key:a.key,business:a.business};}):[]; }).catch(function(){ LISTINGS=[]; }); }
function applyList(j){ ROWS=j.invoices||[]; if(j.methods) METHODS=j.methods; if(j.statuses) STATUSES=j.statuses; if(j.incomeAccounts) INCOME_ACCTS=j.incomeAccounts; if(j.terms&&j.terms.length) TERMS_LIST=j.terms; if(typeof j.stripeEnabled!=='undefined') STRIPE_ON=!!j.stripeEnabled; if(j.taxDefault) TAX_DEFAULT=j.taxDefault; if(typeof j.lineDetail!=='undefined') LINE_DETAIL=!!j.lineDetail; IS_ADMIN=!!j.isAdmin; }
function load(){ api('GET','/api/invoices').then(function(j){ applyList(j); render(); }); }
function loadKeepEditor(){ api('GET','/api/invoices').then(function(j){ applyList(j); if(!BUILT){ render(); } else { refreshList(); renderEditor(); } }); }
function qsParam(k){ try{ return new URLSearchParams(location.search).get(k)||""; }catch(e){ return ""; } }
function qsOpen(){ return qsParam("open"); }
loadListings().then(function(){ api("GET","/api/invoices").then(function(j){ applyList(j); render(); var o=qsOpen(); if(o){ openEdit(o); return; }
  var dk=qsParam("deal"); if(dk){ newInv();
    EDIT.listingKey=dk;
    var m=LISTINGS.filter(function(l){return l.key===dk;})[0]; EDIT.listingLabel=m?(m.business||""):"";
    var bt=qsParam("billto"); if(bt) EDIT.billTo=bt;
    var amt=qsParam("amount"), dsc=qsParam("desc");
    if(amt||dsc){ var n=Number(String(amt).replace(/[^0-9.]/g,"")); EDIT.lineItems=[{desc:(dsc||("Brokerage commission"+(EDIT.listingLabel?(" — "+EDIT.listingLabel):""))), amount:(isFinite(n)&&n>0)?n:"", account:""}]; }
    renderEditor();
    var ed=document.getElementById("editor"); if(ed) ed.scrollIntoView({behavior:"smooth",block:"start"});
  }
}); });
</script>
</body>
</html>
