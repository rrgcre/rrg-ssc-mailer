<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRG — Agreements</title>
<script src="/rrg_brand.js"></script>
<script src="/rrg_list.js"></script>
<style>
:root{ --navy:#000E31; --red:#DA2B1F; --ink:#1a2236; --muted:#6b7488; --line:#e6e9f0; --wash:#f5f7fb; --bg:#eef1f6; }
*{box-sizing:border-box;} html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);}
.top{background:radial-gradient(115% 130% at 50% 0%, #182a54 0%, #0d1b3d 55%, #04091d 100%);color:#fff;padding:20px 0;}
.top-inner{max-width:1320px;margin:0 auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.brand{display:inline-flex;align-items:center;gap:11px;}
.brand .disc{background:var(--red);color:#fff;border-radius:50%;width:38px;height:38px;font-family:'Arial Black',Arial;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;}
.brand .wm{font-weight:800;font-size:15px;}
.top a.back{color:#c3ccdf;text-decoration:none;font-weight:600;font-size:13px;border:1px solid rgba(255,255,255,.2);padding:7px 13px;border-radius:8px;}
.top a.back:hover{border-color:#fff;color:#fff;}
.wrap{max-width:none;margin:20px 0;padding:8px 28px 56px;}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 18px;flex:1;min-width:120px;}
.stat .n{font-size:26px;font-weight:800;color:var(--navy);} .stat .n.red{color:var(--red);} .stat .n.amber{color:#b5791f;}
.stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-top:2px;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.filters .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-right:2px;}
.filters button{background:#fff;border:1px solid #cfd6e2;border-radius:20px;padding:6px 13px;font:inherit;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;}
.filters button.on{background:var(--navy);color:#fff;border-color:var(--navy);}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th,td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;}
thead th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
.jbean{display:inline-flex;align-items:center;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:800;}
.who a{color:var(--navy);font-weight:700;text-decoration:none;} .who a:hover{text-decoration:underline;}
.lk{color:var(--navy);text-decoration:none;font-weight:600;} .lk:hover{text-decoration:underline;}
.stpill{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.stpill.active{background:#e7f5ee;color:#1f8a5b;} .stpill.soon{background:#fdf1df;color:#b5791f;} .stpill.expired{background:#fdeceb;color:var(--red);}
.sigp{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:2px 8px;border-radius:20px;white-space:nowrap;background:#eef1f6;color:#98a1b5;} .sigp.sent{background:#fff4e6;color:#b5791f;} .sigp.signed{background:#e7f5ee;color:#1f8a5b;}
.exp{font-weight:700;} .exp.red{color:var(--red);} .exp.amber{color:#b5791f;}
.note{color:var(--muted);font-size:12.5px;max-width:280px;}
.empty{color:var(--muted);font-size:13.5px;padding:26px 4px;text-align:center;}
</style>
</head>
<body>
<div class="top"><div class="top-inner">
  <span class="brand"><span class="disc">RRG</span><span class="wm">Agreements</span></span>
  <a class="back" href="./index.html">← Dashboard</a>
</div></div>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="card">
    <div class="filters" id="typeFilters"></div>
    <div class="filters">
      <span class="lbl">Status</span>
      <button data-s="all" class="on">All</button>
      <button data-s="active">Active</button>
      <button data-s="soon">Expiring ≤60d</button>
      <button data-s="expired">Expired</button>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button id="newAgrBtn" style="background:var(--navy,#000E31);color:#fff;border:none;border-radius:9px;padding:9px 15px;font:inherit;font-size:13px;font-weight:700;cursor:pointer">+ New agreement</button></div>
    <div id="list"><div class="empty">Loading…</div></div>
  </div>
</div>
<datalist id="agrPeopleList"></datalist>
<div id="agrModal" hidden style="position:fixed;inset:0;background:rgba(6,14,32,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px">
  <div style="background:#fff;border-radius:16px;width:100%;max-width:460px;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden">
    <div style="padding:18px 22px;font-size:16px;font-weight:800;color:var(--navy);border-bottom:1px solid var(--line)">New agreement</div>
    <div style="padding:18px 22px">
      <label style="display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);font-weight:700;margin:0 0 6px">Type</label><select id="ag_type" style="width:100%;border:1px solid #cfd6e2;border-radius:9px;padding:10px 12px;font:inherit;font-size:14px"></select>
      <label style="display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);font-weight:700;margin:12px 0 6px">Party (contact)</label><input id="ag_party" list="agrPeopleList" autocomplete="off" placeholder="Start typing a contact…" style="width:100%;border:1px solid #cfd6e2;border-radius:9px;padding:10px 12px;font:inherit;font-size:14px">
      <div style="display:flex;gap:10px"><div style="flex:1"><label style="display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);font-weight:700;margin:12px 0 6px">Effective</label><input id="ag_eff" type="date" style="width:100%;border:1px solid #cfd6e2;border-radius:9px;padding:10px 12px;font:inherit;font-size:14px"></div><div style="flex:1"><label style="display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);font-weight:700;margin:12px 0 6px">Expires</label><input id="ag_exp" type="date" style="width:100%;border:1px solid #cfd6e2;border-radius:9px;padding:10px 12px;font:inherit;font-size:14px"></div></div>
      <label style="display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);font-weight:700;margin:12px 0 6px">Notes</label><textarea id="ag_notes" rows="2" style="width:100%;border:1px solid #cfd6e2;border-radius:9px;padding:10px 12px;font:inherit;font-size:14px;resize:vertical"></textarea>
      <div style="font-size:12px;color:#8a94a6;margin-top:8px">Attach the signed document and send for signature from the contact\u2019s page after creating.</div>
      <div id="ag_msg" style="color:#DA2B1F;font-size:12.5px;margin-top:8px"></div>
    </div>
    <div style="display:flex;gap:9px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line)"><button id="ag_cancel" style="background:#fff;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:10px 17px;font:inherit;font-size:13px;font-weight:700;cursor:pointer">Cancel</button><button id="ag_save" style="background:var(--navy,#000E31);color:#fff;border:none;border-radius:9px;padding:10px 17px;font:inherit;font-size:13px;font-weight:700;cursor:pointer">Create agreement</button></div>
  </div>
</div>
<script>
var AGR=[], TYPES=[], FT='all', FS='all'; var ACTL=null; var CAN_DELETE=false, IS_ADMIN=false, PEOPLE=[];
var COLORS={ NDA:{bg:'#eef2fb',fg:'#2647b0'}, CA:{bg:'#e6f5f3',fg:'#0f766e'}, ETRA:{bg:'#f1ebfb',fg:'#6d28d9'}, Referral:{bg:'#fdf1df',fg:'#b5791f'}, Listing:{bg:'#fdeceb',fg:'#DA2B1F'} };
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(d){ if(!d) return '—'; var p=d.split('-'); if(p.length!==3) return d; return p[1]+'/'+p[2]+'/'+p[0]; }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysUntil(d){ if(!d) return null; var t=new Date(d+'T00:00:00'); if(isNaN(t)) return null; return Math.round((t.getTime()-Date.now())/86400000); }
function label(k){ for(var i=0;i<TYPES.length;i++){ if(TYPES[i].key===k) return TYPES[i].label; } return k; }
function statusOf(a){ var today=todayStr(); if(a.status==='terminated') return 'expired'; if(a.expires&&a.expires<today) return 'expired'; var du=daysUntil(a.expires); if(a.expires&&du!=null&&du<=60) return 'soon'; return 'active'; }
function load(){
  fetch('/api/agreements/executed',{credentials:'same-origin',cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
    if(!j||!j.ok) return; AGR=j.agreements||[]; TYPES=j.types||[]; CAN_DELETE=!!j.canDelete; IS_ADMIN=!!j.isAdmin; buildTypeFilters(); render();
  });
  fetch('/api/people',{credentials:'same-origin',cache:'no-store'}).then(function(r){return r.json();}).then(function(j){ PEOPLE=(j&&j.people)||[]; var dl=document.getElementById('agrPeopleList'); if(dl) dl.innerHTML=PEOPLE.map(function(p){return '<option value="'+esc(p.name)+'">'+esc(p.companyName||p.company||p.email||'')+'</option>';}).join(''); }).catch(function(){});
}
function buildTypeFilters(){
  var el=document.getElementById('typeFilters');
  el.innerHTML='<span class="lbl">Type</span><button data-t="all" class="on">All</button>'+TYPES.map(function(t){return '<button data-t="'+esc(t.key)+'">'+esc(t.label)+'</button>';}).join('');
  el.querySelectorAll('[data-t]').forEach(function(b){ b.addEventListener('click',function(){ FT=b.getAttribute('data-t'); el.querySelectorAll('[data-t]').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); render(); }); });
}
function render(){
  var stats=document.getElementById('stats');
  var expired=AGR.filter(function(a){return statusOf(a)==='expired';}).length;
  var soon=AGR.filter(function(a){return statusOf(a)==='soon';}).length;
  var active=AGR.filter(function(a){return statusOf(a)==='active';}).length;
  stats.innerHTML='<div class="stat"><div class="n">'+AGR.length+'</div><div class="l">Total agreements</div></div>'
    +'<div class="stat"><div class="n">'+active+'</div><div class="l">Active</div></div>'
    +'<div class="stat"><div class="n amber">'+soon+'</div><div class="l">Expiring ≤60 days</div></div>'
    +'<div class="stat"><div class="n red">'+expired+'</div><div class="l">Expired</div></div>';
  var rows=AGR.filter(function(a){ if(FT!=='all'&&a.type!==FT) return false; if(FS!=='all'&&statusOf(a)!==FS) return false; return true; });
  var cfg={ mount:'#list', data:rows, key:'agreements', empty:'<div class="empty">No agreements match.</div>', rowId:function(a){return a.id;}, defaultSort:5, defaultDir:1, bulk:(CAN_DELETE?[{label:'Delete',danger:true,min:1,fn:bulkDeleteAgreements}]:null),
    columns:[
      { label:'Type', sort:function(a,b){return RRGList.cmp(label(a.type),label(b.type));}, cell:function(a){ return esc(label(a.type)); } },
      { label:'Party', sort:function(a,b){return RRGList.cmp(a.personName,b.personName);}, cell:function(a){ return a.personId?('<a class="lk" href="./rrg_person.html?id='+encodeURIComponent(a.personId)+'">'+esc(a.personName||'Contact')+'</a>'):esc(a.personName||'—'); } },
      { label:'Company', sort:function(a,b){return RRGList.cmp(a.companyName,b.companyName);}, cell:function(a){ return (a.companyId&&a.companyName)?('<a class="lk" href="./rrg_company.html?id='+encodeURIComponent(a.companyId)+'">'+esc(a.companyName)+'</a>'):'<span class="meta">—</span>'; } },
      { label:'Listing', sort:function(a,b){return RRGList.cmp(a.dealName,b.dealName);}, cell:function(a){ return a.dealKey?('<a class="lk" href="./rrg_assignment.html?key='+encodeURIComponent(a.dealKey)+'">'+esc(a.dealName||'listing')+'</a>'):'<span class="meta">—</span>'; } },
      { label:'Effective', sort:function(a,b){return RRGList.cmp(a.effective,b.effective);}, cell:function(a){ return esc(fmt(a.effective)); } },
      { label:'Expires', sort:function(a,b){return RRGList.cmp(a.expires||'9999',b.expires||'9999');}, cell:function(a){ var st=statusOf(a); var cls=st==='expired'?'exp red':(st==='soon'?'exp amber':''); return '<span class="'+cls+'">'+esc(fmt(a.expires))+'</span>'; } },
      { label:'Status', sort:function(a,b){return RRGList.cmp(statusOf(a),statusOf(b));}, cell:function(a){ var st=statusOf(a); var du=daysUntil(a.expires); var txt=st==='expired'?'Expired':(st==='soon'?('Expiring'+(du!=null?' '+du+'d':'')):'Active'); return '<span class="stpill '+st+'">'+txt+'</span>'; } },
      { label:'Signature', sort:function(a,b){return RRGList.cmp(a.signStatus,b.signStatus);}, cell:function(a){ return a.signStatus==='signed'?('<span class="sigp signed">Signed'+(a.signedDate?(' '+fmt(a.signedDate)):'')+'</span>'):(a.signStatus==='sent'?'<span class="sigp sent">Sent</span>':'<span class="sigp">—</span>'); } },
      { label:'Notes', defaultHidden:true, sortable:false, cell:function(a){ return a.notes?esc(a.notes):'<span class="meta">—</span>'; } },
      { label:'', align:'right', sortable:false, cell:function(a){ return CAN_DELETE?('<button class="agdel" data-del="'+esc(a.id)+'" style="border:1px solid #f0c9c6;background:#fff;color:#DA2B1F;border-radius:7px;padding:4px 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer">Delete</button>'):'<span class="meta">—</span>'; } }
    ]
  };
  if(ACTL) ACTL.refresh(rows); else ACTL=RRGList.create(cfg);
}
function deleteAgreement(id){ if(!confirm('Delete this agreement? This removes the record and its uploaded document. Cannot be undone.')) return; AGR=AGR.filter(function(a){return a.id!==id;}); render(); fetch('/api/agreements/'+encodeURIComponent(id),{method:'DELETE',credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){ if(!j||!j.ok){ alert((j&&j.error)||'Could not delete.'); load(); } }).catch(function(){ load(); }); }
function bulkDeleteAgreements(ids, done){ if(!ids||!ids.length) return; if(!confirm('Delete '+ids.length+' agreement'+(ids.length>1?'s':'')+'? Cannot be undone.')) return; var set={}; ids.forEach(function(x){set[x]=1;}); AGR=AGR.filter(function(a){return !set[a.id];}); render(); Promise.all(ids.map(function(id){ return fetch('/api/agreements/'+encodeURIComponent(id),{method:'DELETE',credentials:'same-origin'}).then(function(r){return r.json();}).catch(function(){return {ok:false};}); })).then(function(res){ var fail=res.filter(function(x){return !x||!x.ok;}).length; if(done)done(); if(fail) alert(fail+' could not be deleted.'); load(); }); }
function openAgrModal(){ var m=document.getElementById('agrModal'); if(!m) return; var tsel=document.getElementById('ag_type'); if(tsel) tsel.innerHTML='<option value="">\u2014 type \u2014</option>'+TYPES.map(function(t){return '<option value="'+esc(t.key)+'">'+esc(t.label)+'</option>';}).join(''); ['ag_party','ag_eff','ag_exp','ag_notes'].forEach(function(id){var el=document.getElementById(id); if(el) el.value='';}); document.getElementById('ag_msg').textContent=''; m.removeAttribute('hidden'); }
function closeAgrModal(){ var m=document.getElementById('agrModal'); if(m) m.setAttribute('hidden',''); }
function createAgreement(){ var type=(document.getElementById('ag_type').value||''); var msg=document.getElementById('ag_msg'); if(!type){ msg.textContent='Pick an agreement type.'; return; } var party=(document.getElementById('ag_party').value||'').trim(); var pid=''; for(var i=0;i<PEOPLE.length;i++){ if((PEOPLE[i].name||'').toLowerCase()===party.toLowerCase()){ pid=PEOPLE[i].id; break; } } var body={ type:type, effective:document.getElementById('ag_eff').value, expires:document.getElementById('ag_exp').value, notes:document.getElementById('ag_notes').value }; if(pid) body.personId=pid; else if(party) body.name=party; var btn=document.getElementById('ag_save'); btn.disabled=true; btn.textContent='Creating\u2026'; fetch('/api/agreements',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(j){ btn.disabled=false; btn.textContent='Create agreement'; if(j&&j.ok){ closeAgrModal(); load(); } else msg.textContent=(j&&j.error)||'Could not create.'; }).catch(function(){ btn.disabled=false; btn.textContent='Create agreement'; msg.textContent='Could not reach the server.'; }); }
document.addEventListener('click',function(e){ var b=e.target.closest&&e.target.closest('.agdel[data-del]'); if(b){ e.preventDefault(); deleteAgreement(b.getAttribute('data-del')); } });
document.querySelectorAll('.filters [data-s]').forEach(function(b){ b.addEventListener('click',function(){ FS=b.getAttribute('data-s'); document.querySelectorAll('.filters [data-s]').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); render(); }); });
var _nab=document.getElementById('newAgrBtn'); if(_nab) _nab.addEventListener('click',openAgrModal);
var _agc=document.getElementById('ag_cancel'); if(_agc) _agc.addEventListener('click',closeAgrModal);
var _ags=document.getElementById('ag_save'); if(_ags) _ags.addEventListener('click',createAgreement);
load();
</script>
<script>/*rrgbfcache*/window.addEventListener("pageshow",function(e){if(e.persisted)location.reload();});</script>
</body>
</html>
