function doSendAgreement(){
  var out=document.getElementById('sm_msgout');
  if(!EMAILREADY){ alert('Email is not set up yet (Admin → Email).'); return; }
  var v=document.getElementById('sm_tpl').value;
  if(!v){ out.textContent='Pick a template, or choose to attach your own file.'; return; }
  var tpl=(v!=='__file')?TEMPLATES.filter(function(t){return t.id===v;})[0]:null;
  var adv=!!(tpl&&tpl.pdfFields&&tpl.pdfFields.length);
  var msg=document.getElementById('sm_msg').value.trim();
  var type=tpl?(tpl.type||'NDA'):(document.getElementById('sm_type').value||'NDA');
  var btn=document.getElementById('sm_send'); btn.disabled=true; out.style.color='#6b7488'; out.textContent='Creating…';
  fetch('/api/agreements',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({personId:ID,type:type})})
    .then(function(r){return r.json();}).then(function(j){
      if(!(j&&j.ok)) throw new Error((j&&j.error)||'Could not create the agreement.');
      var id=j.agreement.id;
      var step;
      if(tpl){ step=fetch('/api/agreements/'+encodeURIComponent(id)+'/apply-template',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({templateId:tpl.id})}).then(function(r){return r.json();}); }
      else { var fi=document.getElementById('sm_file'); if(!(fi&&fi.files&&fi.files[0])) return Promise.reject(new Error('Attach a document to send.')); step=new Promise(function(res,rej){ var rd=new FileReader(); rd.onload=function(){ fetch('/api/agreements/'+encodeURIComponent(id)+'/doc',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({filename:fi.files[0].name,dataB64:String(rd.result||'')})}).then(function(r){return r.json();}).then(res,rej); }; rd.readAsDataURL(fi.files[0]); }); }
      return step.then(function(j2){ if(!(j2&&j2.ok)) throw new Error((j2&&j2.error)||'Could not attach the document.'); return id; });
    }).then(function(id){
      out.textContent='Sending…';
      if(adv){
        var signers=[];
        document.querySelectorAll('#sm_signerswrap .sm_sname').forEach(function(n){ signers.push({order:+n.getAttribute('data-o'),name:n.value}); });
        document.querySelectorAll('#sm_signerswrap .sm_semail').forEach(function(e){ var o=+e.getAttribute('data-o'); var r=signers.filter(function(x){return x.order===o;})[0]; if(r) r.email=e.value; });
        return fetch('/api/agreements/'+encodeURIComponent(id)+'/signers',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({signers:signers})}).then(function(r){return r.json();}).then(function(){ return fetch('/api/agreements/'+encodeURIComponent(id)+'/send-adv',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({message:msg||undefined})}).then(function(r){return r.json();}); });
      } else {
        var to=document.getElementById('sm_to').value.trim();
        return fetch('/api/agreements/'+encodeURIComponent(id)+'/send',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({to:to||undefined,message:msg||undefined})}).then(function(r){return r.json();});
      }
    }).then(function(js){
      if(!(js&&js.ok)) throw new Error((js&&js.error)||'Could not send.');
      document.getElementById('sendModal').setAttribute('hidden','');
      load();
      alert('Agreement sent'+(js.to?(' to '+js.to):(js.signer?(' to '+js.signer):''))+'.');
    }).catch(function(e){ btn.disabled=false; out.style.color='#DA2B1F'; out.textContent=(e&&e.message)||'Something went wrong.'; });
}

function uploadPhoto(file){
  var m=document.getElementById('p_msg'); if(file.size>6*1024*1024){ if(m)m.textContent='Image too large (max 6 MB).'; return; }
  if(m) m.textContent='Uploading photo…';

    .then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ P.photoExt=(j.photoUrl.split('.').pop()||'').split('?')[0]; P.updatedAt=new Date().toISOString(); if(m)m.textContent=''; render(); } else { if(m)m.textContent=(j&&j.error)||'Upload failed.'; } })
    .catch(function(){ if(m)m.textContent='Could not reach the server.'; }); };
  rd.readAsDataURL(file);
}

<script>/*rrg-accordion-js*/
(function(){
  var KEY='rrgcardcol_'+location.pathname;
  function get(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ return {}; } }
  function set(o){ try{ localStorage.setItem(KEY,JSON.stringify(o)); }catch(e){} }
  function titleOf(card){ var b=card.querySelector('.ch b'); return b?b.textContent.trim():''; }
  var root=document.getElementById('root'), mo=null;
  function apply(){
    if(mo) mo.disconnect();
    var st=get();
    document.querySelectorAll('.card > .ch').forEach(function(ch){ if(!ch.querySelector('.rrgchev')){ var cv=document.createElement('span'); cv.className='rrgchev'; cv.textContent='\u25be'; ch.appendChild(cv); } });
    document.querySelectorAll('.card').forEach(function(card){ var t=titleOf(card); if(t) card.classList.toggle('collapsed', !!st[t]); });
    connect();
  }
  function connect(){ if(root && window.MutationObserver){ if(!mo) mo=new MutationObserver(function(){ apply(); }); mo.observe(root,{childList:true,subtree:true}); } }
  document.addEventListener('click',function(e){ var ch=e.target.closest('.card > .ch'); if(!ch) return; if(e.target.closest('button,input,select,a,label,textarea')) return; var card=ch.closest('.card'); if(!card) return; card.classList.toggle('collapsed'); var st=get(); var t=titleOf(card); if(t){ if(card.classList.contains('collapsed')) st[t]=1; else delete st[t]; set(st); } });
  setTimeout(apply, 350);
})();
</script>
<style>#prepov[hidden]{display:none !important;}</style><div id="prepov" hidden style="position:fixed;inset:0;background:rgba(8,14,32,.5);display:flex;align-items:flex-start;justify-content:center;padding:34px 16px;z-index:400;overflow:auto"><div style="background:#fff;border-radius:16px;width:100%;max-width:600px;box-shadow:0 24px 70px rgba(6,12,30,.4)"><div style="display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #e6e9f0"><b style="color:#000E31;font-size:15px">✨ Call prep</b><button id="prepx" type="button" style="border:none;background:#f2f4f8;width:30px;height:30px;border-radius:8px;cursor:pointer;color:#6b7488;font-size:14px">✕</button></div><div id="prepbody" style="padding:16px 18px;max-height:62vh;overflow:auto"></div></div></div>
<script>
(function(){

       var b=j.result||{}; var h="";
