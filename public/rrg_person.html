var ATYPE_COLORS={ NDA:{bg:'#eef2fb',fg:'#2647b0'}, CA:{bg:'#e6f5f3',fg:'#0f766e'}, ETRA:{bg:'#f1ebfb',fg:'#6d28d9'}, Referral:{bg:'#fdf1df',fg:'#b5791f'}, Listing:{bg:'#fdeceb',fg:'#DA2B1F'} };

function wireEmail(){

    if(!to){ m.textContent='Add a recipient email.'; return; }

    b.disabled=true; m.textContent='Sending…';
    var _url = GMAILCONN ? '/api/gmail/send' : ('/api/person/'+encodeURIComponent(ID)+'/email');
    var _payload = GMAILCONN ? {personId:ID,to:to,subject:subj,body:body} : {to:to,subject:subj,body:body};
    fetch(_url,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(_payload)})

}
