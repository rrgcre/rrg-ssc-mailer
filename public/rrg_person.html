<script>(function(){
  var KEY='contacts', NOUN='contact';
  function qv(k){return new URLSearchParams(location.search).get(k)||'';}
  var order; try{order=JSON.parse(sessionStorage.getItem('rrgorder_'+KEY)||'[]');}catch(e){order=[];}
  if(!Array.isArray(order)||order.length<2) return;
  var cur=qv('id'); var idx=order.indexOf(cur); if(idx<0) return;
  function go(i){ if(i<0||i>=order.length) return; location.href=location.pathname+'?id='+encodeURIComponent(order[i]); }
  function mk(txt,dis,dir,title){ var a=document.createElement('button'); a.type='button'; a.title=title; a.textContent=txt; a.style.cssText='display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;border:1px solid #e9edf3;background:#fff;color:#1d2739;font:inherit;font-size:17px;line-height:1;cursor:pointer;padding:0;'+(dis?'opacity:.35;pointer-events:none;':''); if(!dis){ a.addEventListener('click',function(e){e.preventDefault();go(idx+dir);}); a.onmouseenter=function(){a.style.background='#f2f4f8';}; a.onmouseleave=function(){a.style.background='#fff';}; } return a; }
  function mount(top){ if(document.getElementById('rrgPagerTop')) return; var wrap=document.createElement('div'); wrap.id='rrgPagerTop'; wrap.style.cssText='display:inline-flex;align-items:center;gap:2px;'; var pos=document.createElement('span'); pos.textContent=(idx+1)+' of '+order.length; pos.style.cssText='font-size:12.5px;font-weight:600;color:#6b7488;padding:0 7px;white-space:nowrap;'; wrap.appendChild(mk('\u2039',idx===0,-1,'Previous '+NOUN+' (\u2190)')); wrap.appendChild(pos); wrap.appendChild(mk('\u203a',idx===order.length-1,1,'Next '+NOUN+' (\u2192)')); var back=top.querySelector('.rrgback'); if(back&&back.nextSibling){ top.insertBefore(wrap,back.nextSibling); } else if(back){ top.appendChild(wrap); } else { var lg=top.querySelector('.rrgtoplogo'); if(lg&&lg.nextSibling){ top.insertBefore(wrap,lg.nextSibling); } else { top.insertBefore(wrap,top.firstChild); } } }
  var tries=0; (function wait(){ var top=document.getElementById('rrgtop'); if(top){ mount(top); return; } if(tries++>80) return; setTimeout(wait,50); })();
  document.addEventListener('keydown',function(e){ var t=e.target; if(t&&(t.isContentEditable||/^(input|textarea|select)$/i.test(t.tagName)))return; if(e.metaKey||e.ctrlKey||e.altKey)return; if(e.key==='ArrowLeft'&&idx>0)go(idx-1); else if(e.key==='ArrowRight'&&idx<order.length-1)go(idx+1); });
})();</script>

document.addEventListener('click',function(e){ var lb=e.target.closest&&e.target.closest('#nl_lane .nllanebtn'); if(lb){ e.preventDefault(); _nlSetLane(lb.getAttribute('data-lane')); } });
// ── Send the client-facing SSC link ─────────────────────────────────────────────────────
function openSscClientLink(){
  var pid=(typeof P!=='undefined'&&P&&P.id)||'', cid=(typeof CO!=='undefined'&&CO&&CO.id)||'';
  var biz=(typeof CO!=='undefined'&&CO&&CO.name)||'', nm=(P&&P.name)||'', em=(P&&P.email)||'';
  var ov=document.getElementById('sscLinkModal'); if(ov) ov.remove();
  ov=document.createElement('div'); ov.id='sscLinkModal'; ov.style.cssText='position:fixed;inset:0;background:rgba(10,20,50,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
  ov.innerHTML='<div style="background:#fff;border-radius:10px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(10,20,50,.3);font-size:13.5px;color:#1a2236">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #e6e9f0"><b style="font-size:13px;letter-spacing:.04em;text-transform:uppercase">Send SSC to client</b><button type="button" id="sl_x" style="background:none;border:0;font-size:20px;cursor:pointer;color:#6b7488">&times;</button></div>'
    +'<div style="padding:16px 18px">'
    +'<div style="color:#5a6478;line-height:1.5;margin-bottom:12px">'+esc(nm||'The client')+' gets a simple, branded version of the Site Selection Criteria. Their answers save as their SSC, update the Tenant-Box, and you get an email when they finish.</div>'
    +'<div id="sl_status" style="margin-bottom:12px;color:#8a93a8">Getting the link…</div>'
    +'<label style="display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8a93a8;margin-bottom:5px">Link</label>'
    +'<div style="display:flex;gap:8px;margin-bottom:14px"><input id="sl_url" readonly style="flex:1;min-width:0;border:1px solid #c4ccda;border-radius:6px;padding:8px 10px;font:inherit;font-size:12.5px;color:#3f4b63;background:#f7f9fc"><button type="button" id="sl_copy" style="border:1px solid #c4ccda;background:#fff;border-radius:6px;padding:0 12px;font:inherit;font-weight:600;cursor:pointer">Copy</button><a id="sl_open" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;border:1px solid #c4ccda;border-radius:6px;padding:0 12px;color:#1a2236;text-decoration:none;font-weight:600">Preview</a></div>'
    +'<label style="display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8a93a8;margin-bottom:5px">Email it to</label>'
    +'<div style="display:flex;gap:8px"><input id="sl_to" value="'+esc(em)+'" placeholder="client@email.com" style="flex:1;min-width:0;border:1px solid #c4ccda;border-radius:6px;padding:8px 10px;font:inherit"><button type="button" id="sl_send" style="background:#000E31;color:#fff;border:0;border-radius:6px;padding:0 16px;font:inherit;font-weight:700;cursor:pointer">Send</button></div>'
    +'<div id="sl_msg" style="margin-top:10px;font-weight:600;min-height:18px"></div>'
    +'</div></div>';
  document.body.appendChild(ov);
  var close=function(){ ov.remove(); };
  ov.addEventListener('click',function(e){ if(e.target===ov) close(); });
  document.getElementById('sl_x').onclick=close;
  var TOK='';
  fetch('/api/ssc-link',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({personId:pid,companyId:cid,business:biz,contactName:nm})}).then(function(r){return r.json();}).then(function(j){
    var st=document.getElementById('sl_status'); if(!st) return;
    if(!j||!j.ok){ st.style.color='#DA2B1F'; st.textContent=(j&&j.error)||'Could not create the link.'; return; }
    TOK=j.token; document.getElementById('sl_url').value=j.url; document.getElementById('sl_open').href=j.url;
    var bits=[]; if(j.emailedAt) bits.push('Emailed to '+esc(j.emailedTo||'client')+' '+esc(new Date(j.emailedAt).toLocaleDateString()));
    if(j.submittedAt) bits.push('<span style="color:#1f8a5b;font-weight:700">Completed '+esc(new Date(j.submittedAt).toLocaleDateString())+'</span> &middot; <a href="./ssc_form.html?personId='+encodeURIComponent(pid)+'&companyId='+encodeURIComponent(cid)+'&ssc='+encodeURIComponent(j.sscKey||'')+'" style="color:#2c5c8f;font-weight:700">Open their answers in the SSC form &rarr;</a>');
    st.style.color='#5a6478'; st.innerHTML=bits.length?bits.join('<br>'):'Not sent yet.';
  }).catch(function(){ var st=document.getElementById('sl_status'); if(st){ st.style.color='#DA2B1F'; st.textContent='Could not reach the server.'; } });
  document.getElementById('sl_copy').onclick=function(){ var u=document.getElementById('sl_url'); try{ navigator.clipboard.writeText(u.value); }catch(e){ u.select(); document.execCommand('copy'); } this.textContent='Copied'; };
  document.getElementById('sl_send').onclick=function(){ var b=this, m=document.getElementById('sl_msg'), to=document.getElementById('sl_to').value.trim(); if(!TOK){ m.style.color='#DA2B1F'; m.textContent='One moment, the link is still loading.'; return; }
    b.disabled=true; m.style.color='#6b7488'; m.textContent='Sending…';
    fetch('/api/ssc-link/email',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({token:TOK,to:to})}).then(function(r){return r.json();}).then(function(j){ b.disabled=false; if(j&&j.ok){ m.style.color='#1f8a5b'; m.textContent='Sent to '+to+' ✓'; } else { m.style.color='#DA2B1F'; m.textContent=(j&&j.error)||'Could not send.'; } }).catch(function(){ b.disabled=false; m.style.color='#DA2B1F'; m.textContent='Could not reach the server.'; }); };
}
