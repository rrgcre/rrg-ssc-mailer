    if(!document.getElementById("rrgTrCss")){ var st3=document.createElement("style"); st3.id="rrgTrCss"; st3.textContent="#rrgTrMenu .rrgactitem{display:block;width:100%;text-align:left;background:none;border:none;border-radius:8px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;color:#1a2236;cursor:pointer;white-space:nowrap;line-height:1.2} #rrgTrMenu .rrgactitem:hover{background:#eef3fb;color:#1f3aa6} #rrgTrMenu .rrgactsub{font-size:11.5px;color:#8a93a8;font-weight:500;margin-top:2px;white-space:nowrap} #rrgTrMenu .rrgacthead{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#98a1b5;padding:8px 14px 3px;margin-top:3px;border-top:1px solid #eef1f6} #rrgTrMenu .rrgacthead:first-child{border-top:none;margin-top:0}"; document.head.appendChild(st3); }
    var TRA=[
      {hdr:'Engagement'},
      {t:'Start Tenant Rep Engagement', sub:'Sign this client to a space search — opens the tenant pipeline at Needs Analysis', f:function(){ if(typeof openNewListing==='function'){ openNewListing('tenant_rep'); } else { alert('One moment — still loading.'); } }},
      {hdr:'Paperwork (optional)'},
      {t:'Send a Tenant Rep Agreement', sub:'Exclusive Tenant Representation — only when the client wants exclusivity', f:function(){ if(typeof openSendModal==='function'){ openSendModal(); } else { alert('Agreements are still loading — try again in a moment.'); } }}
    ];
    var trbtn=document.createElement("button"); trbtn.type="button"; trbtn.className="create"; trbtn.style.cssText="font-size:14px;padding:10px 18px;cursor:pointer"; trbtn.innerHTML="Tenant Rep Actions <span style=\"font-size:10px;margin-left:3px;opacity:.85\">▾</span>";
    var trmenu=document.createElement("div"); trmenu.id="rrgTrMenu"; trmenu.style.cssText="position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid #e1e6ef;border-radius:11px;box-shadow:0 14px 44px rgba(10,20,50,.18);z-index:200;min-width:312px;padding:6px;display:none";
    trmenu.innerHTML=TRA.map(function(a,i){ if(a.hdr){ return "<div class=\"rrgacthead\">"+esc(a.hdr)+"</div>"; } return "<button type=\"button\" class=\"rrgactitem\" data-tri=\""+i+"\">"+esc(a.t)+(a.sub?("<div class=\"rrgactsub\">"+esc(a.sub)+"</div>"):"")+"</button>"; }).join("");
    function trclose(){ trmenu.style.display="none"; }
    trbtn.addEventListener("click",function(e){ e.stopPropagation(); var _sw=(trmenu.style.display==="none"); try{close();}catch(_){} trmenu.style.display=(_sw?"block":"none"); });
    trmenu.addEventListener("click",function(e){ var b2=e.target.closest(".rrgactitem"); if(!b2) return; var i2=+b2.getAttribute("data-tri"); var a2=TRA[i2]; trclose(); if(a2&&a2.f) try{ a2.f(); }catch(err){} });
    wrap.appendChild(trbtn); wrap.appendChild(trmenu);
    create.parentNode.replaceChild(wrap, create);
    try{refreshValuation();}catch(_){} try{updateTopBtns();}catch(_){}
    function close(){ menu.style.display="none"; }
    btn.addEventListener("click",function(e){ e.stopPropagation(); try{trclose();}catch(_){} var _sw=(menu.style.display==="none"); menu.style.display=(_sw?"block":"none"); if(_sw){ try{refreshValuation();}catch(_){} } });
    menu.addEventListener("click",function(e){ var b=e.target.closest(".rrgactitem"); if(!b) return; var i=+b.getAttribute("data-i"); var a=ACTIONS[i]; if(a&&a.lock&&b.classList.contains('rrgactdim')){ var _sb=b.querySelector('.rrgactsub'); var _m=((_sb&&_sb.textContent||'').trim())||'Not available yet'; if(window.rrgToast) rrgToast(_m+' — then this unlocks.'); else alert(_m+' — then this unlocks.'); return; } close(); if(a&&a.f) try{ a.f(); }catch(err){} });
    document.addEventListener("click",function(e){ if(!wrap.contains(e.target)){ close(); try{trclose();}catch(_){} } });
  }
  var tries=0; (function w(){ var c=document.querySelector("#rrgtop .create"); if(c){ install(c); return; } if(tries++<50) setTimeout(w,120); })();
})();
</script>
<script>
/* Confirmation banner when a seller call just became a Live Listing and returned here. */
(function(){
  var raw; try{ raw=sessionStorage.getItem('rrgListingCreated'); }catch(e){}
  if(!raw) return;
  try{ sessionStorage.removeItem('rrgListingCreated'); }catch(e){}
  var a; try{ a=JSON.parse(raw); }catch(e){ return; }
  if(!a || !a.listingStatus) return;
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function go(){
    var b=document.createElement('div');
    b.style.cssText='position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:100001;max-width:540px;width:calc(100% - 32px);background:#eaf5ef;border:1px solid #b7e0c7;color:#155e3b;border-radius:12px;padding:12px 15px;box-shadow:0 12px 34px rgba(16,32,70,.20);font:600 13px/1.45 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif;display:flex;align-items:center;gap:11px';
    b.innerHTML='<span style="font-size:17px;flex:none">✓</span><span style="flex:1"><b>'+esc(a.business||'This seller')+'</b> is now a provisional listing'+(a.roomCreated?' — data room created':(a.roomId?' — data room ready':''))+(a.pipeline?(' and added to the <b>'+esc(a.pipeline)+'</b> pipeline'):'')+'. Next: collect financials & the lease and schedule the Seller Interview. It’s in the listings below.</span>'
      +(a.roomId?('<a href="./rrg_room.html?room='+encodeURIComponent(a.roomId)+'" style="color:#0e7a53;font-weight:700;text-decoration:none;white-space:nowrap">Open room →</a>'):'')
      +'<span title="Dismiss" style="cursor:pointer;color:#7aa78c;font-size:19px;line-height:1;padding:0 2px;flex:none">×</span>';
    b.querySelector('span[title="Dismiss"]').addEventListener('click',function(){ b.remove(); });
    document.body.appendChild(b);
    setTimeout(function(){ if(b&&b.parentNode) b.remove(); }, 14000);
    if(window.rrgToast){ try{ window.rrgToast('✓ Live Listing created for '+(a.business||'this seller')); }catch(e){} }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ setTimeout(go,450); }); else setTimeout(go,450);
})();

/* Hide a rail card's count badge when it's exactly 0 — an empty section reads cleaner without a "0". */
(function(){ function hz(){ document.querySelectorAll('.rail .card > .ch > span').forEach(function(s){ var z=((s.textContent||'').trim()==='0'); var want=z?'none':''; if(s.style.display!==want) s.style.display=want; }); } var t=null; var raf=window.requestAnimationFrame||function(f){return setTimeout(f,16);}; function sched(){ if(t) return; t=raf(function(){ t=null; hz(); }); } function go(){ hz(); try{ var tgt=document.getElementById('root')||document.body; new MutationObserver(sched).observe(tgt,{childList:true,subtree:true}); }catch(e){} } if(document.readyState!=='loading') go(); else document.addEventListener('DOMContentLoaded',go); })();
</script>
