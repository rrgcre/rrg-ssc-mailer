<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullServe — Data Enrichment</title>
<style>
:root{--navy:#20334f;--navy2:#23496f;--primary:#2c5c8f;--primary-d:#23496f;--ink:#2b3648;--dim:#5f6a7d;--soft:#8a93a3;--faint:#96a1b2;--line:#dbe0e9;--wash:#f4f6f9;--green:#2f7a55;--teal:#0b7285;--amber:#8a5a12;--red:#b23a2c;--inp:#c4ccda;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#fff;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:13px;}
.wrap{max-width:1040px;margin:0 auto;padding:24px 24px 70px;}
h1{font-size:19px;font-weight:800;color:var(--navy);margin:0;}
.sub{color:var(--dim);font-size:12.5px;margin-top:5px;max-width:720px;line-height:1.5;}
.strip{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 18px;}
.stat{flex:1;min-width:140px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 15px;}
.stat .n{font-size:22px;font-weight:800;color:var(--navy);letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
.stat .l{font-size:10.5px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
/* recommended-workflow strip */
.wf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--wash);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:18px;font-size:12px;}
.wf .lab{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin-right:5px;}
.wfstep{display:inline-flex;align-items:center;gap:7px;font-weight:700;color:var(--navy2);}
.wfn{width:19px;height:19px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none;}
.wfstep.loop{color:var(--teal);} .wfstep.loop .wfn{background:var(--teal);}
.wfar{color:var(--faint);font-weight:700;}
/* scope chooser */
.scopehint{font-size:10.5px;color:var(--soft);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin:0 0 9px;}
.scope{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
.scopetile{flex:1;min-width:250px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:15px;transition:.12s;}
.scopetile:hover{border-color:var(--primary);background:#fafcff;}
.scopetile.on{border-color:var(--navy);background:var(--wash);box-shadow:inset 0 0 0 1px var(--navy);}
.scopetile .sic{width:50px;height:50px;flex:none;border-radius:8px;background:#eef2f7;color:var(--navy2);display:flex;align-items:center;justify-content:center;}
.scopetile.on .sic{background:var(--navy);color:#fff;}
.scopetile .sic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.scopetile .st{font-size:16px;font-weight:800;color:var(--navy);}
.scopetile .ss{font-size:12px;color:var(--dim);margin-top:2px;}
.scopetile .chk{margin-left:auto;flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--inp);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;}
.scopetile.on .chk{background:var(--navy);border-color:var(--navy);}
/* tool cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px;}
.tool{background:#fff;border:1px solid var(--line);border-radius:6px;padding:15px 17px 16px;display:flex;flex-direction:column;position:relative;transition:.12s;}
.tool:hover{border-color:var(--primary);}
.stepbadge{display:inline-block;align-self:flex-start;font-size:9.5px;font-weight:800;letter-spacing:.06em;color:var(--primary-d);background:#eef4fb;border:1px solid #cddcec;border-radius:3px;padding:2px 8px;margin-bottom:11px;text-transform:uppercase;}
.tool .ic{width:42px;height:42px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;background:#eef2f8;margin-bottom:12px;}
.tool.g .ic{background:#e9f4ee;} .tool.p .ic{background:#efeaf7;} .tool.a .ic{background:#e7f2f4;}
.tool h3{margin:0;font-size:14.5px;font-weight:800;color:var(--navy);}
.tool p{margin:6px 0 0;font-size:12px;color:var(--dim);line-height:1.5;flex:1;}
.tool .stat2{font-size:12px;font-weight:700;color:var(--navy2);margin-top:11px;min-height:16px;}
.tool .stat2 b{color:var(--red);} .tool .stat2.clean{color:var(--green);}
.tool .foot{margin-top:14px;}
.go{background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:3px;padding:8px 15px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;} .go:hover{background:var(--primary-d);}
.go.green{background:var(--green);border-color:var(--green);} .go.green:hover{filter:brightness(1.06);}
.needkey{position:absolute;top:14px;right:14px;font-size:9.5px;font-weight:800;letter-spacing:.05em;color:var(--amber);background:#fbf3e7;border:1px solid #ecd9a8;border-radius:3px;padding:2px 8px;text-transform:uppercase;}
.gate{max-width:520px;margin:70px auto;text-align:center;color:var(--dim);} .gate h2{color:var(--navy);}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<div id="root" class="wrap"><div class="gate">Checking access…</div></div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function n(v){return Number(v||0).toLocaleString('en-US');}
var SUMMARY=null, SCOPE='company';
try{ var _sc=localStorage.getItem('rrg_enrich_scope'); if(_sc==='company'||_sc==='contact') SCOPE=_sc; }catch(e){}

var IC_CO='<svg viewBox="0 0 24 24"><path d="M4 20V6a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v14"/><path d="M13 20V10a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v10"/><line x1="2.5" y1="20" x2="21.5" y2="20"/><line x1="6.5" y1="8.5" x2="10.5" y2="8.5"/><line x1="6.5" y1="12" x2="10.5" y2="12"/><line x1="16" y1="13" x2="18" y2="13"/><line x1="16" y1="16" x2="18" y2="16"/></svg>';
var IC_CT='<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 19.5c0-3.4 2.9-5.6 6.5-5.6s6.5 2.2 6.5 5.6"/></svg>';

function scopeTile(key,label,svg,sub){
  return '<div class="scopetile'+(SCOPE===key?' on':'')+'" data-scope="'+key+'"><div class="sic">'+svg+'</div><div><div class="st">'+esc(label)+'</div><div class="ss">'+esc(sub)+'</div></div><div class="chk">✓</div></div>';
}

// Recommended order: Clean up → Find duplicates → link/enrich → Clean up again.
function toolDefs(S){
  return [
    { scope:['company','contact'], cls:'a', ic:'✎', title:'Cleanup &amp; Standardize',
      desc:'Title-case names and companies, standardize state codes, validate emails, normalize websites, and auto-assign market / submarket from city.',
      stat:'<b>Start here</b> — and run again after the last step', clean:true, href:'rrg_cleanup.html', go:'teal' },
    { scope:['company','contact'], cls:'', ic:'⧉', title:'Find Duplicates',
      desc:'Fuzzy-match companies and contacts by name, website domain and phone. Approve each merge — every linked record moves to the keeper.',
      stat:'Scan '+n(S.companies)+' companies &amp; '+n(S.contacts)+' contacts', href:'rrg_duplicates.html', go:'' },
    { scope:['contact'], cls:'', ic:'✉', title:'Match by Email Domain',
      desc:'Link contacts to the right company by their email domain — reliable, never name-based. Personal domains (gmail, yahoo…) are ignored.',
      stat:'Connect '+n(S.contacts)+' contacts to companies', href:'rrg_emailmatch.html', go:'' },
    { scope:['company'], cls:'g', ic:'🌐', title:'Enrich from Google', needKey:!S.hasKey,
      desc:'Operating status (open / dark / closed), star rating, review count, price point, phone, website and map coordinates — pulled live onto every location.',
      stat:(S.locationsToEnrich>0?('<b>'+n(S.locationsToEnrich)+'</b> of '+n(S.locations)+' locations not yet pulled from Google'):(S.locations?('All '+n(S.locations)+' locations enriched'):'No locations yet — import some first')), clean:!(S.locationsToEnrich>0), href:'rrg_enrich.html', go:'green' },
    { scope:['company'], cls:'', ic:'◐', title:'Find Logos',
      desc:'Auto-pull a brand logo for every company with a website. Review the grid, approve the good ones, apply.',
      stat:(S.missingLogo>0?('<b>'+n(S.missingLogo)+'</b> companies missing a logo'):'Every company has a logo'), clean:!(S.missingLogo>0), href:'rrg_logos.html', go:'' },
    { scope:['company'], cls:'p', ic:'✦', title:'Concept Intelligence (AI)',
      desc:'Consult reads each concept name and fills cuisine, concept type and price point — plus flags multi-unit operators. The fields that make this a restaurant CRM.',
      stat:(S.conceptsIncomplete>0?('<b>'+n(S.conceptsIncomplete)+'</b> concepts missing cuisine / type / price'):(S.concepts?'All concepts classified':'No concepts yet')), href:'rrg_concepts.html', go:'purple' }
  ];
}
function buildCard(t, step){
  var goCls='go'+(t.go==='green'?' green':'');
  var goStyle=(t.go==='purple')?' style="background:#5a3d9e;border-color:#5a3d9e"':((t.go==='teal')?' style="background:#0b7285;border-color:#0b7285"':'');
  return '<div class="tool'+(t.cls?(' '+t.cls):'')+'">'
    +(t.needKey?'<span class="needkey">Needs key</span>':'')
    +'<span class="stepbadge">Step '+step+'</span>'
    +'<div class="ic">'+t.ic+'</div><h3>'+t.title+'</h3><p>'+t.desc+'</p>'
    +'<div class="stat2'+(t.clean?' clean':'')+'">'+t.stat+'</div>'
    +'<div class="foot"><a target="_top" class="'+goCls+'"'+goStyle+' href="'+t.href+'">Open →</a></div></div>';
}
function renderTools(){
  var host=document.getElementById('toolgrid'); if(!host) return;
  var tools=toolDefs(SUMMARY).filter(function(t){ return t.scope.indexOf(SCOPE)>=0; });
  host.innerHTML=tools.map(function(t,i){ return buildCard(t,i+1); }).join('');
}

function render(S){
  SUMMARY=S;
  var root=document.getElementById('root'); root.className='wrap';
  var strip=''
    +'<div class="stat"><div class="n">'+n(S.companies)+'</div><div class="l">Companies</div></div>'
    +'<div class="stat"><div class="n">'+n(S.contacts)+'</div><div class="l">Contacts</div></div>'
    +'<div class="stat"><div class="n">'+n(S.locations)+'</div><div class="l">Locations</div></div>'
    +'<div class="stat"><div class="n">'+n(S.locationsEnriched)+'</div><div class="l">Enriched w/ Google</div></div>'
    +'<div class="stat"><div class="n">'+n(S.missingLogo)+'</div><div class="l">Missing a logo</div></div>';
  var wf='<div class="wf"><span class="lab">Recommended order</span>'
    +'<span class="wfstep"><span class="wfn">1</span>Clean up</span><span class="wfar">→</span>'
    +'<span class="wfstep"><span class="wfn">2</span>Find duplicates</span><span class="wfar">→</span>'
    +'<span class="wfstep"><span class="wfn">3</span>Link &amp; enrich</span><span class="wfar">→</span>'
    +'<span class="wfstep loop"><span class="wfn">↻</span>Clean up again</span></div>';
  var scope=''
    +'<div class="scopehint">What do you want to enrich?</div>'
    +'<div class="scope">'
    + scopeTile('company','Companies', IC_CO, n(S.companies)+' companies · '+n(S.locations)+' locations')
    + scopeTile('contact','Contacts', IC_CT, n(S.contacts)+' contacts')
    +'</div>';
  root.innerHTML=''
    +'<h1>Data Enrichment</h1>'
    +'<div class="sub">Clean, fill, link and enrich your book. Pick <b>Companies</b> or <b>Contacts</b>, then run the tools in order — clean up first, and again after enriching.</div>'
    +'<div class="strip">'+strip+'</div>'
    +wf
    +scope
    +'<div class="grid" id="toolgrid"></div>';
  document.querySelectorAll('.scopetile').forEach(function(t){ t.addEventListener('click',function(){ SCOPE=t.getAttribute('data-scope'); try{localStorage.setItem('rrg_enrich_scope',SCOPE);}catch(e){} document.querySelectorAll('.scopetile').forEach(function(x){ x.classList.toggle('on',x.getAttribute('data-scope')===SCOPE); }); renderTools(); }); });
  renderTools();
}

fetch('/api/admin/enrichment-summary',{credentials:'same-origin'}).then(function(r){ if(r.status===403) throw 0; return r.json(); }).then(function(j){
  if(!j||!j.ok){ document.getElementById('root').innerHTML='<div class="gate">Could not load enrichment tools.</div>'; return; }
  render(j);
}).catch(function(){ document.getElementById('root').innerHTML='<div class="gate"><h2>Admins only</h2>Ask an administrator to run data enrichment.</div>'; });
</script>
</body>
</html>
