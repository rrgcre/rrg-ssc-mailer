<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullServe — Command</title>
<style>
:root{--bg:#eef1f7;--card:#fff;--line:#e3e8f1;--ink:#14213d;--dim:#66738f;--faint:#93a0ba;--navy:#16346e;--red:#DA2B1F;}
*{box-sizing:border-box;margin:0;padding:0;} html,body{background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.wrap{max-width:1280px;margin:0 auto;padding:22px 24px 44px;}
.blank{min-height:60vh;display:flex;align-items:center;justify-content:center;}
.blankcard{text-align:center;max-width:460px;padding:40px 34px;}
.blankcard .disc{background:var(--red);color:#fff;border-radius:50%;width:52px;height:52px;font-family:'Arial Black',Arial,sans-serif;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;letter-spacing:-.04em;margin:0 auto 18px;}
.blankcard h1{font-size:22px;font-weight:800;color:var(--navy);letter-spacing:-.01em;}
.blankcard p{font-size:13.5px;color:var(--dim);margin-top:10px;line-height:1.55;}
.blankcard .hint{font-size:11.5px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-top:22px;}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<div class="wrap">
  <div class="blank">
    <div class="blankcard">
      <div class="disc">RRG</div>
      <h1>Command Center</h1>
      <p>Cleared and ready for a rebuild. Use the sidebar to jump to Listings, Data Rooms, Companies, Contacts or the Board.</p>
      <div class="hint">FullServe</div>
    </div>
  </div>
</div>
</body>
</html>
