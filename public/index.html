<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullServe — Command</title>
<style>
:root{--bg:#eef1f7;--card:#fff;--line:#e3e8f1;--ink:#14213d;--dim:#66738f;--faint:#93a0ba;--navy:#16346e;--blue:#2f6fd0;--teal:#12a594;--amber:#c9812a;--red:#DA2B1F;--slate:#6d7c9c;--green:#1f8a5b;}
*{box-sizing:border-box;margin:0;padding:0;} html,body{background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.wrap{max-width:1280px;margin:0 auto;padding:16px 24px 40px;}
.topline{display:flex;align-items:center;gap:11px;padding:2px 2px 14px;flex-wrap:wrap;}
.topline>b{font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.01em;}
.topline .tsub{font-size:11px;color:var(--faint);font-weight:800;text-transform:uppercase;letter-spacing:.1em;}
.topline .live{color:var(--green);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;display:inline-flex;align-items:center;gap:6px;}
.topline .live .d{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(31,138,91,.5);animation:pl 2s infinite;} @keyframes pl{0%{box-shadow:0 0 0 0 rgba(31,138,91,.45)}70%{box-shadow:0 0 0 8px rgba(31,138,91,0)}100%{box-shadow:0 0 0 0 rgba(31,138,91,0)}}
.topline .rmeta{margin-left:auto;display:flex;align-items:center;gap:14px;}
.topline .hclock{color:var(--dim);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;}
.topline .buildmini{font-size:10.5px;color:var(--faint);font-weight:700;font-variant-numeric:tabular-nums;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;} @media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr);}}
.kpi{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--a,var(--blue));border-radius:12px;padding:15px 16px;box-shadow:0 1px 2px rgba(16,32,70,.04);}
.kpi .ktop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);font-weight:800;line-height:1.35;}
.kpi .v{font-size:26px;font-weight:800;margin-top:8px;letter-spacing:-.015em;color:var(--ink);}
.kpi .dl{margin-top:9px;display:flex;align-items:center;gap:8px;min-height:20px;flex-wrap:wrap;}
.chip{font-size:11px;font-weight:800;padding:2px 8px;border-radius:100px;display:inline-flex;align-items:center;gap:3px;}
.chip.up{background:#e7f5ec;color:#1f8a5b;} .chip.dn{background:#fdeceb;color:#DA2B1F;} .chip.flat{background:#eef1f7;color:#66738f;}
.cap{font-size:10.5px;color:var(--faint);font-weight:600;}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px;} @media(max-width:980px){.grid2{grid-template-columns:1fr;}}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px;} @media(max-width:980px){.grid3{grid-template-columns:1fr;}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px;box-shadow:0 1px 2px rgba(16,32,70,.04);}
.ph{display:flex;align-items:center;gap:9px;margin-bottom:14px;} .ph b{font-size:14px;} .ph .tag{margin-left:auto;font-size:11px;color:var(--faint);font-weight:600;} .ph a.more{margin-left:auto;font-size:12px;font-weight:700;color:var(--blue);text-decoration:none;} .ph a.more:hover{text-decoration:underline;}
.stage{display:flex;align-items:center;gap:12px;margin-bottom:10px;} .stage .nm{width:150px;font-size:12.5px;font-weight:500;} @media(max-width:520px){.stage .nm{width:105px;font-size:11.5px;}}
.stage .track{flex:1;height:24px;background:#eef2f8;border-radius:6px;overflow:hidden;} .stage .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--navy),var(--blue));display:flex;align-items:center;justify-content:flex-end;padding-right:9px;color:#fff;font-weight:700;font-size:11px;width:0;transition:width 1.2s cubic-bezier(.2,.7,.2,1);} .stage .ct{width:76px;text-align:right;font-size:12px;color:var(--dim);}
.trendnow{display:flex;align-items:baseline;gap:9px;margin-bottom:6px;} .trendnow .bg{font-size:24px;font-weight:800;color:var(--navy);}
.legend{display:flex;flex-direction:column;gap:8px;} .legend .li{display:flex;align-items:center;gap:8px;font-size:12.5px;} .legend .li .sw{width:11px;height:11px;border-radius:3px;flex:none;} .legend .li b{margin-left:auto;}
.bar{margin:10px 0;} .bar .top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;} .bar .top b{font-weight:700;} .bar .tk{height:8px;background:#eef2f8;border-radius:100px;overflow:hidden;} .bar .tk i{display:block;height:100%;border-radius:100px;width:0;transition:width 1.15s ease;}
.feed{display:flex;flex-direction:column;} .fitem{display:flex;gap:11px;padding:10px 0;border-top:1px solid var(--line);align-items:center;} .fitem:first-child{border-top:none;} .fico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;background:#eef3fb;} .ftxt{font-size:12.5px;line-height:1.4;} .ftxt b{font-weight:700;} .ftime{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap;flex:none;}
.pri{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:100px;background:#eef1f7;color:var(--slate);} .pri.high{background:#fdeceb;color:var(--red);} .pri.med{background:#fbf3e7;color:var(--amber);}
.empty{color:var(--faint);font-size:12.5px;padding:14px 0;}
.gate{max-width:520px;margin:80px auto;text-align:center;color:var(--dim);}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<div class="wrap" id="root"><div class="gate">Loading your command center…</div></div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
var DATA={}, ASSIST='';
function num(n){ return Number(n||0).toLocaleString('en-US'); }
function money(n){ n=Number(n||0); if(Math.abs(n)>=1e6) return '$'+(Math.round(n/1e5)/10)+'M'; if(Math.abs(n)>=1e3) return '$'+Math.round(n/1e3)+'k'; return '$'+num(Math.round(n)); }
function fmtDate(iso){ if(!iso) return ''; var x=String(iso).slice(0,10).split('-'); if(x.length!==3) return String(iso).slice(0,10); return x[1]+'/'+x[2]; }
function dcol(i){ return ['#16346e','#2f6fd0','#12a594','#c9812a','#DA2B1F','#6d7c9c','#4a5cd0','#3a7a5e'][i%8]; }
function kacc(i){ return ['#2f6fd0','#16346e','#c9812a','#12a594','#6d7c9c','#1f8a5b','#4a5cd0','#DA2B1F'][i%8]; }
function sparkline(arr,color){
  arr=(arr||[]).map(Number).filter(function(x){return isFinite(x);});
  if(arr.length<2){ return '<svg width="62" height="22" viewBox="0 0 62 22"><line x1="2" y1="11" x2="60" y2="11" stroke="'+color+'" stroke-width="2" opacity=".3"/></svg>'; }
  var mn=Math.min.apply(null,arr),mx=Math.max.apply(null,arr),rng=(mx-mn)||1,W=62,H=22,p=2;
  var pts=arr.map(function(v,i){ var x=p+i/(arr.length-1)*(W-2*p); var y=H-p-((v-mn)/rng)*(H-2*p); return x.toFixed(1)+','+y.toFixed(1); });
  var area='M'+pts.join(' L')+' L'+(W-p)+','+(H-p)+' L'+p+','+(H-p)+' Z';
  return '<svg width="62" height="22" viewBox="0 0 62 22"><path d="'+area+'" fill="'+color+'" opacity=".10"/><polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function trend(arr,color){
  arr=(arr||[]).map(Number).filter(function(x){return isFinite(x);});
  if(arr.length<2) return '<div class="empty">Trend builds as the days pass — your first data points are logging now.</div>';
  var mn=Math.min.apply(null,arr),mx=Math.max.apply(null,arr),rng=(mx-mn)||1,W=300,H=90,p=6;
  var pts=arr.map(function(v,i){ var x=p+i/(arr.length-1)*(W-2*p); var y=H-p-((v-mn)/rng)*(H-2*p); return [x,y]; });
  var poly=pts.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' ');
  var area='M'+pts.map(function(q,i){return (i?'L':'')+q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' ')+' L'+(W-p)+','+(H-p)+' L'+p+','+(H-p)+' Z';
  var last=pts[pts.length-1];
  return '<svg style="width:100%;height:auto;display:block" viewBox="0 0 300 90"><path d="'+area+'" fill="'+color+'" opacity=".11"/><polyline points="'+poly+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3.2" fill="'+color+'"/></svg>';
}
function deltaChip(k){
  if(k.delta==null) return '<span class="chip flat">Baseline</span><span class="cap">tracking starts today</span>';
  var f=(k.fmt==='money'); var mag=f?money(Math.abs(k.delta)):num(Math.abs(k.delta));
  var when=k.priorDate?('vs '+fmtDate(k.priorDate)):'';
  if(k.delta>0) return '<span class="chip up">▲ '+mag+'</span><span class="cap">'+when+'</span>';
  if(k.delta<0) return '<span class="chip dn">▼ '+mag+'</span><span class="cap">'+when+'</span>';
  return '<span class="chip flat">No change</span><span class="cap">'+when+'</span>';
}
function donut(items,unit){
  items=(items||[]).filter(function(d){return d.value>0;});
  if(!items.length) return '<div class="empty">No data yet.</div>';
  var total=items.reduce(function(a,d){return a+d.value;},0), c=2*Math.PI*40,off=0;
  var seg=items.map(function(d,i){ var len=d.value/total*c; var s='<circle cx="54" cy="54" r="40" fill="none" stroke="'+dcol(i)+'" stroke-width="13" stroke-dasharray="'+len+' '+(c-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 54 54)"/>'; off+=len; return s; }).join('');
  var leg=items.map(function(d,i){ return '<div class="li"><span class="sw" style="background:'+dcol(i)+'"></span>'+esc(d.label)+' <b>'+num(d.value)+'</b></div>'; }).join('');
  return '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg width="108" height="108" viewBox="0 0 108 108">'+seg+'<text x="54" y="52" text-anchor="middle" font-size="19" font-weight="800" fill="#14213d">'+num(total)+'</text><text x="54" y="66" text-anchor="middle" font-size="8" fill="#93a0ba" letter-spacing="1">'+esc(unit)+'</text></svg><div class="legend" style="flex:1;min-width:130px">'+leg+'</div></div>';
}
function kget(k){ var a=(DATA.kpis||[]); for(var i=0;i<a.length;i++){ if(a[i].k===k) return a[i]; } return null; }
function tickClock(){ var el=document.getElementById('hclock'); if(!el) return; var d=new Date(),h=d.getHours(),m=d.getMinutes(); el.textContent=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+' · '+((h%12)||12)+':'+(m<10?'0':'')+m+' '+(h<12?'AM':'PM'); }
function render(){
  var dd=DATA;
  var kpis=(dd.kpis||[]).map(function(x,i){ var acc=kacc(i); return '<div class="kpi" style="--a:'+acc+'"><div class="ktop"><span class="l">'+esc(x.label)+'</span>'+sparkline(x.spark,acc)+'</div><div class="v" data-tgt="'+x.value+'" data-fmt="'+(x.fmt||'num')+'">'+(x.fmt==='money'?'$0':'0')+'</div><div class="dl">'+deltaChip(x)+'</div></div>'; }).join('');
  var stages=(dd.pipeline&&dd.pipeline.length)?dd.pipeline:[{name:'Lead',count:0}]; var mxS=Math.max.apply(null,stages.map(function(s){return s.count;}).concat([1]));
  var funnel=stages.map(function(s){ return '<div class="stage"><div class="nm">'+esc(s.name)+'</div><div class="track"><div class="fill" data-w="'+Math.round(s.count/mxS*100)+'">'+s.count+'</div></div><div class="ct">'+s.count+' deals</div></div>'; }).join('');
  var pk=kget('pipeline'); var trendHtml=pk?('<div class="trendnow"><span class="bg">'+money(pk.value)+'</span><span>'+deltaChip(pk)+'</span></div>'+trend(pk.spark,'#12a594')):'<div class="empty">No pipeline data yet.</div>';
  var mkts=(dd.markets&&dd.markets.length)?dd.markets:[{label:'—',value:0}]; var mxM=Math.max.apply(null,mkts.map(function(m){return m.value;}).concat([1]));
  var markets=mkts.map(function(m,i){ return '<div class="bar"><div class="top"><span>'+esc(m.label)+'</span><b>'+m.value+'</b></div><div class="tk"><i data-w="'+Math.round(m.value/mxM*100)+'%" style="background:'+dcol(i)+'"></i></div></div>'; }).join('');
  var acts=(dd.activity&&dd.activity.length)?dd.activity.map(function(a){ return '<div class="fitem"><span class="fico">•</span><span class="ftxt"><b>'+esc(a.who||'')+'</b> · '+esc(a.type||'')+(a.text?(' — '+esc(a.text)):'')+'</span><span class="ftime">'+esc(fmtDate(a.at))+'</span></div>'; }).join(''):'<div class="empty">No recent activity logged.</div>';
  var tasks=(dd.tasks&&dd.tasks.length)?dd.tasks.map(function(t){ var pc=(String(t.priority).toLowerCase()==='high'?'high':(String(t.priority).toLowerCase()==='medium'?'med':'')); return '<div class="fitem"><span class="fico">✔</span><span class="ftxt"><b>'+esc(t.title||'')+'</b>'+(t.link?(' · '+esc(t.link)):'')+'</span>'+(t.priority?'<span class="pri '+pc+'">'+esc(t.priority)+'</span>':'')+'<span class="ftime">'+esc(fmtDate(t.due))+'</span></div>'; }).join(''):'<div class="empty">No open tasks — you’re clear.</div>';
  var expiring=(dd.expiring&&dd.expiring.length)?dd.expiring.map(function(x){return '<div class="fitem"><span class="fico" style="background:'+(x.overdue?'#fdeeee':'#fbf3e7')+'">⏰</span><span class="ftxt">'+esc(x.business)+'</span><span class="ftime" style="'+(x.overdue?'color:var(--red);font-weight:700':'')+'">'+esc(fmtDate(x.expires))+'</span></div>';}).join(''):'<div class="empty">Nothing expiring soon.</div>';
  var bft=''; try{ if(dd._booted) bft=new Date(dd._booted).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }catch(e){}
  document.getElementById('root').innerHTML=''
    +'<div class="topline"><b>Command</b><span class="tsub">Business Overview</span><span class="live"><span class="d"></span>Live</span><span class="rmeta"><span class="buildmini" id="buildmini" title="'+esc((dd._build||'')+(bft?(' · booted '+bft):''))+'"></span><span class="hclock" id="hclock"></span></span></div>'
    +'<div class="kpis">'+kpis+'</div>'
    +'<div class="grid2"><div class="panel"><div class="ph"><b>Biz Sales Pipeline</b><a class="more" href="./rrg_board.html">Board →</a></div>'+funnel+'</div>'
    +'<div class="panel"><div class="ph"><b>Pipeline Value · Trend</b><span class="tag">last 14 checks</span></div>'+trendHtml+'</div></div>'
    +'<div class="grid3"><div class="panel"><div class="ph"><b>Deal Status</b></div>'+donut(dd.dealStatus,'DEALS')+'</div>'
    +'<div class="panel"><div class="ph"><b>Book Composition</b></div>'+donut(dd.contactsByType,'CONTACTS')+'</div>'
    +'<div class="panel"><div class="ph"><b>Listings by Market</b></div>'+markets+'</div></div>'
    +'<div class="grid3"><div class="panel"><div class="ph"><b>Recent Activity</b><a class="more" href="./rrg_feed.html">Feed →</a></div><div class="feed">'+acts+'</div></div>'
    +'<div class="panel"><div class="ph"><b>My Tasks</b><a class="more" href="./rrg_tasks.html">All →</a></div><div class="feed">'+tasks+'</div></div>'
    +'<div class="panel"><div class="ph"><b>Expiring Listings</b><span class="tag">90 days</span></div><div class="feed">'+expiring+'</div></div></div>';
  tickClock(); if(!window._clk) window._clk=setInterval(tickClock,1000);
  var _bm=document.getElementById('buildmini'); if(_bm) _bm.textContent=(dd._build||'');
  document.querySelectorAll('.kpi .v[data-tgt]').forEach(function(el){ var t=parseFloat(el.getAttribute('data-tgt'))||0,fmt=el.getAttribute('data-fmt'),cur=0,st=32,inc=t/st,i=0; var iv=setInterval(function(){ i++; cur=(i>=st)?t:cur+inc; if(i>=st)clearInterval(iv); el.textContent=(fmt==='money'?money(cur):num(Math.round(cur))); },24); });
  setTimeout(function(){ document.querySelectorAll('.stage .fill,[data-w]').forEach(function(el,i){ setTimeout(function(){ if(el.className.indexOf('fill')>=0){ el.style.width=el.getAttribute('data-w')+'%'; } else if(el.tagName==='I'){ el.style.width=el.getAttribute('data-w'); } },i*35); }); },90);
}
fetch('/api/dashboard',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){
  if(!j||!j.ok){ document.getElementById('root').innerHTML='<div class="gate">Could not load your dashboard.</div>'; return; }
  DATA=j.data||{}; DATA._name=j.name||''; DATA._build=j.build||''; DATA._booted=j.booted||''; ASSIST=j.assistant||''; render();
}).catch(function(){ document.getElementById('root').innerHTML='<div class="gate">Could not reach the server.</div>'; });
</script>
</body>
</html>
