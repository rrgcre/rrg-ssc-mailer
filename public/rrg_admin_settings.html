<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRG — Admin Settings</title>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--ink:#1a2236;--muted:#6b7488;--soft:#8a93a8;--line:#e6e9f0;--wash:#f5f7fb;--green:#1f8a5b;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#eef1f6;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.top{color:#fff;padding:28px 0 30px;position:relative;overflow:hidden;background:radial-gradient(95% 130% at 28% 15%, #1c2e5c 0%, #112044 42%, #0b1636 70%, #071029 100%);}
.top-in{max-width:960px;margin:0 auto;padding:0 24px;position:relative;z-index:2;}
.brand{display:inline-flex;align-items:center;cursor:pointer;} .disc{background:var(--red);color:#fff;border-radius:50%;width:42px;height:42px;font-family:'Arial Black',Arial,sans-serif;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;letter-spacing:-.04em;}
.bar{background:#fff;width:3px;height:30px;margin:0 12px;} .wm{font-weight:800;font-size:14px;text-transform:uppercase;line-height:.95;}
.kicker{margin:20px 0 4px;color:var(--red);font-weight:700;letter-spacing:.3em;font-size:11px;text-transform:uppercase;}
h1{font-size:29px;font-weight:800;margin:0;color:#fff;letter-spacing:-.01em;}
.sub{color:#aeb8cf;font-size:13px;margin-top:7px;max-width:680px;}
.wrap{max-width:960px;margin:22px auto;padding:0 24px 70px;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(10,20,50,.06);overflow:hidden;margin-bottom:20px;}
.ch{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line);} .ch b{color:var(--navy);font-size:14px;} .ch span{color:var(--muted);font-size:11.5px;}
.cb{padding:18px 20px;}
label.fld{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:700;margin:2px 0 7px;}
input,textarea{width:100%;border:1px solid #cfd6e2;border-radius:9px;padding:10px 12px;font:inherit;font-size:13.5px;color:var(--ink);background:#fff;}
.tagbox{display:flex;flex-wrap:wrap;gap:7px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--wash);min-height:46px;}
.tagchip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #d3ddf3;color:var(--navy);border-radius:8px;padding:5px 9px;font-size:12.5px;font-weight:700;}
.tagchip button{background:none;border:none;color:var(--red);font-size:15px;line-height:1;cursor:pointer;padding:0;}
.addrow{display:flex;gap:8px;margin-top:10px;}
.addrow input{flex:1;}
.btn{background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:9px;padding:10px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.btn.ghost{background:#fff;color:var(--navy);border-color:#cdd6e6;} .btn.danger{background:#fff;color:var(--red);border-color:#f0c9c6;} .btn.danger:hover{background:#fdeceb;}
.btn:disabled{opacity:.5;cursor:default;}
.btnrow{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap;align-items:center;}
.msg{font-size:12.5px;font-weight:600;} .msg.ok{color:var(--green);} .msg.err{color:#b23a2c;}
.note{font-size:12px;color:var(--muted);line-height:1.55;margin-top:8px;}
.status{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;}
.status.on{background:#eafaf0;color:#0e7a53;border:1px solid #b9e6cd;} .status.off{background:#f2f4f8;color:#6b7488;border:1px solid #e0e5ee;}
.grid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;} @media(max-width:800px){.grid2{grid-template-columns:1fr;}}
.gate{max-width:520px;margin:80px auto;text-align:center;color:var(--muted);}
.foot{max-width:960px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:11.5px;}
.tagchip{display:inline-flex;align-items:center;gap:2px;}
.tagchip .tmv{border:none;background:transparent;color:#98a1b5;cursor:pointer;font-size:15px;font-weight:800;padding:0 1px;line-height:1;} .tagchip .tmv:hover{color:#DA2B1F;}
.tagchip .tglbl{padding:0 2px;}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<!--rrgback--><a href="/admin" class="rrg-back" aria-label="Back to admin console" style="position:fixed;left:16px;bottom:16px;z-index:99999;display:inline-flex;align-items:center;gap:7px;background:rgba(0,14,49,.85);color:#fff;text-decoration:none;font:700 12.5px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;padding:10px 15px;border-radius:100px;border:1px solid rgba(255,255,255,.22);box-shadow:0 6px 20px rgba(0,0,0,.28)"><span style="font-size:14px;line-height:1">←</span> Admin console</a>
<div class="top"><div class="top-in">
  <span class="brand" onclick="location.href='./index.html'"><span class="disc">RRG</span><span class="bar"></span><span class="wm">Restaurant<br>Realty<br>Group</span></span>
  <div class="kicker">Admin</div>
  <h1>Settings</h1>
  <div class="sub">Editable type lists, request notifications, the Claude API key, and data reset. Admin only.</div>
</div></div>
<div id="root" class="wrap"><div class="gate">Loading…</div></div>
<div class="foot">Proprietary &amp; Confidential · Property of Restaurant Realty Group, LLC · Internal RRG use only.</div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function post(url,body){ return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body||{})}).then(function(r){return r.json();}); }
function get(url){ return fetch(url,{credentials:'same-origin'}).then(function(r){return r.json();}); }

var TYPES={ personTypes:[], companyTypes:[], ticketCategories:[], leadSources:[], activityTypes:[], cuisineTypes:[] };
var MAXPULL=20; var DEFSTATE='TX'; var ASSISTANT='Claude'; var SHOWRIBBON=true; var TOOLDEFS=[]; var TOOLLABELS={}; var PALETTE={primary:'#000E31',accent:'#DA2B1F',sidebar:'#0b1a38',positive:'#1f8a5b'};

function tagListHtml(kind,arr){
  return '<div class="tagbox" id="tb_'+kind+'">'+(arr.length?arr.map(function(t,i){ return '<span class="tagchip"><button type="button" class="tmv" data-mv="'+kind+'" data-i="'+i+'" data-d="-1" title="Move earlier">‹</button><span class="tglbl">'+esc(t)+'</span><button type="button" class="tmv" data-mv="'+kind+'" data-i="'+i+'" data-d="1" title="Move later">›</button><button type="button" class="tgx" data-rm="'+kind+'" data-val="'+esc(t)+'" title="Remove">×</button></span>'; }).join(''):'<span class="note" style="margin:4px">None — add one below.</span>')+'</div>'
    +'<div class="addrow"><input id="add_'+kind+'" placeholder="Add a value and press Enter"><button class="btn ghost" type="button" data-add="'+kind+'">Add</button></div>';
}
function renderTypes(){
  document.getElementById('typesBox').innerHTML=
    '<div class="grid2">'
    +'<div><label class="fld">Contact types</label>'+tagListHtml('personTypes',TYPES.personTypes)+'</div>'
    +'<div><label class="fld">Company types</label>'+tagListHtml('companyTypes',TYPES.companyTypes)+'</div>'
    +'<div><label class="fld">Request categories</label>'+tagListHtml('ticketCategories',TYPES.ticketCategories)+'</div>'
    +'<div><label class="fld">Lead sources</label>'+tagListHtml('leadSources',TYPES.leadSources)+'</div>'
    +'<div><label class="fld">Activity types</label>'+tagListHtml('activityTypes',TYPES.activityTypes)+'</div>'
    +'<div><label class="fld">Cuisine types</label>'+tagListHtml('cuisineTypes',TYPES.cuisineTypes)+'</div>'
    +'</div>'
    +'<div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line)"><label class="fld">Max locations per web pull</label><input id="maxpull" type="number" min="1" max="500" value="'+esc(MAXPULL)+'" style="max-width:150px"><div class="note" style="margin-top:6px">Caps how many locations the &ldquo;Find locations&rdquo; web pull creates at once, so a big chain does not import hundreds. Default 20.</div></div>'
    +'<div style="margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><label class="fld">Default state for new records</label><input id="defstate" value="'+esc(DEFSTATE)+'" maxlength="20" style="max-width:120px"></div><div><label class="fld">Assistant name (AI helper)</label><input id="assistant" value="'+esc(ASSISTANT)+'" maxlength="40" placeholder="Claude"></div></div><div class="note" style="margin-top:6px">Default state pre-fills the State field on new companies. Assistant name is what the app calls its AI helper throughout (default Claude).</div>'
    +'<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)"><label style="display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--navy);cursor:pointer"><input type="checkbox" id="showribbon"'+(SHOWRIBBON?' checked':'')+'> Show the open-requests ribbon on the dashboard</label><div class="note" style="margin-top:6px">When on, the dashboard shows a ribbon summarizing open requests. Turn off to hide it for everyone.</div></div>';
  document.querySelectorAll('[data-rm]').forEach(function(b){ b.addEventListener('click',function(){ var k=b.getAttribute('data-rm'), v=b.getAttribute('data-val'); TYPES[k]=TYPES[k].filter(function(x){return x!==v;}); renderTypes(); }); });
  document.querySelectorAll('[data-mv]').forEach(function(b){ b.addEventListener('click',function(){ var k=b.getAttribute('data-mv'), i=+b.getAttribute('data-i'), d=+b.getAttribute('data-d'), j=i+d; if(j<0||j>=TYPES[k].length) return; var t=TYPES[k][i]; TYPES[k][i]=TYPES[k][j]; TYPES[k][j]=t; renderTypes(); }); });
  document.querySelectorAll('[data-add]').forEach(function(b){ b.addEventListener('click',function(){ addType(b.getAttribute('data-add')); }); });
  ['personTypes','companyTypes','ticketCategories','leadSources','activityTypes','cuisineTypes'].forEach(function(k){ var inp=document.getElementById('add_'+k); if(inp) inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); addType(k); } }); });
}
function addType(k){ var inp=document.getElementById('add_'+k); var v=(inp.value||'').trim(); if(!v) return; if(TYPES[k].map(function(x){return x.toLowerCase();}).indexOf(v.toLowerCase())<0) TYPES[k].push(v); inp.value=''; renderTypes(); setTimeout(function(){var i=document.getElementById('add_'+k); if(i) i.focus();},0); }
function fillPalette(){ var a=document.getElementById('pal_primary'),ah=document.getElementById('pal_primary_hex'),b=document.getElementById('pal_accent'),bh=document.getElementById('pal_accent_hex'); if(a)a.value=PALETTE.primary; if(ah)ah.value=PALETTE.primary; if(b)b.value=PALETTE.accent; if(bh)bh.value=PALETTE.accent; var c=document.getElementById('pal_sidebar'),ch=document.getElementById('pal_sidebar_hex'),d=document.getElementById('pal_positive'),dh=document.getElementById('pal_positive_hex'); if(c)c.value=PALETTE.sidebar; if(ch)ch.value=PALETTE.sidebar; if(d)d.value=PALETTE.positive; if(dh)dh.value=PALETTE.positive; }
function applyPaletteLive(){ try{ document.documentElement.style.setProperty('--navy',PALETTE.primary); document.documentElement.style.setProperty('--red',PALETTE.accent); document.documentElement.style.setProperty('--navbg',PALETTE.sidebar); document.documentElement.style.setProperty('--green',PALETTE.positive); localStorage.setItem('rrg_pal',JSON.stringify(PALETTE)); }catch(e){} }
function wirePalette(){ function sync(ci,hi){ var c=document.getElementById(ci),h=document.getElementById(hi); if(!c||!h)return; c.addEventListener('input',function(){ h.value=c.value; }); h.addEventListener('input',function(){ if(/^#[0-9a-fA-F]{6}$/.test(h.value)) c.value=h.value; }); } sync('pal_primary','pal_primary_hex'); sync('pal_accent','pal_accent_hex'); sync('pal_sidebar','pal_sidebar_hex'); sync('pal_positive','pal_positive_hex'); }
function savePalette(){ var m=document.getElementById('palMsg'); m.textContent='Saving…'; m.className='msg'; var pr=(document.getElementById('pal_primary_hex').value||'').trim()||document.getElementById('pal_primary').value; var ac=(document.getElementById('pal_accent_hex').value||'').trim()||document.getElementById('pal_accent').value; var sb=(document.getElementById('pal_sidebar_hex').value||'').trim()||document.getElementById('pal_sidebar').value; var po=(document.getElementById('pal_positive_hex').value||'').trim()||document.getElementById('pal_positive').value; post('/api/admin/palette',{primary:pr,accent:ac,sidebar:sb,positive:po}).then(function(j){ if(j&&j.ok){ PALETTE=j.palette; fillPalette(); applyPaletteLive(); m.textContent='Saved \u2713'; m.className='msg ok'; } else { m.textContent=(j&&j.error)||'Could not save.'; m.className='msg err'; } }); }
function resetPalette(){ if(!confirm('Reset the brand colors to the built-in defaults?')) return; post('/api/admin/palette',{reset:true}).then(function(j){ if(j&&j.ok){ PALETTE=j.palette; fillPalette(); applyPaletteLive(); var m=document.getElementById('palMsg'); m.textContent='Reset \u2713'; m.className='msg ok'; } }); }
function renderToolLabels(){
  var box=document.getElementById('toolLabelsBox'); if(!box) return;
  box.innerHTML='<div class="grid2">'+TOOLDEFS.map(function(t){
    var cur=TOOLLABELS[t.file]||'';
    return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="min-width:150px;color:var(--muted);font-size:13px">'+esc(t.name)+'</span><input data-tl="'+esc(t.file)+'" value="'+esc(cur)+'" placeholder="'+esc(t.name)+'" maxlength="40" style="flex:1"></div>';
  }).join('')+'</div>';
}
function saveToolLabels(){
  var m=document.getElementById('tlMsg'); m.textContent='Saving…'; m.className='msg';
  var labels={}; document.querySelectorAll('[data-tl]').forEach(function(i){ var v=(i.value||'').trim(); if(v) labels[i.getAttribute('data-tl')]=v; });
  post('/api/admin/tool-labels',{labels:labels}).then(function(j){ if(j&&j.ok){ TOOLDEFS=j.tools||TOOLDEFS; TOOLLABELS=j.labels||{}; renderToolLabels(); m.textContent='Saved ✓'; m.className='msg ok'; } else { m.textContent=(j&&j.error)||'Could not save.'; m.className='msg err'; } });
}
function resetToolLabels(){ if(!confirm('Reset all tool names back to the built-in defaults?')) return; post('/api/admin/tool-labels',{reset:true}).then(function(j){ if(j&&j.ok){ TOOLDEFS=j.tools||TOOLDEFS; TOOLLABELS=j.labels||{}; renderToolLabels(); var m=document.getElementById('tlMsg'); m.textContent='Reset ✓'; m.className='msg ok'; } }); }
function saveTypes(){
  var m=document.getElementById('typesMsg'); m.textContent='Saving…'; m.className='msg';
  post('/api/admin/types',{ personTypes:TYPES.personTypes, companyTypes:TYPES.companyTypes, ticketCategories:TYPES.ticketCategories, leadSources:TYPES.leadSources, activityTypes:TYPES.activityTypes, cuisineTypes:TYPES.cuisineTypes, maxPullLocations:(document.getElementById('maxpull')?document.getElementById('maxpull').value:MAXPULL), defaultState:(document.getElementById('defstate')?document.getElementById('defstate').value:DEFSTATE), assistantName:(document.getElementById('assistant')?document.getElementById('assistant').value:ASSISTANT), showRequestRibbon:(document.getElementById('showribbon')?document.getElementById('showribbon').checked:SHOWRIBBON) }).then(function(j){
    if(j&&j.ok){ TYPES={ personTypes:j.personTypes||[], companyTypes:j.companyTypes||[], ticketCategories:j.ticketCategories||[], leadSources:j.leadSources||[], activityTypes:j.activityTypes||[], cuisineTypes:j.cuisineTypes||[] }; MAXPULL=(j.maxPullLocations!=null?j.maxPullLocations:MAXPULL); DEFSTATE=(j.defaultState!=null?j.defaultState:DEFSTATE); ASSISTANT=(j.assistantName!=null?j.assistantName:ASSISTANT); SHOWRIBBON=(j.showRequestRibbon!=null?j.showRequestRibbon:SHOWRIBBON); renderTypes(); m.textContent='Saved ✓'; m.className='msg ok'; }
    else { m.textContent=(j&&j.error)||'Could not save.'; m.className='msg err'; }
  }).catch(function(){ m.textContent='Could not reach the server.'; m.className='msg err'; });
}
function resetTypes(){ if(!confirm('Reset all three lists back to the built-in defaults?')) return; post('/api/admin/types',{reset:true}).then(function(j){ if(j&&j.ok){ TYPES={ personTypes:j.personTypes||[], companyTypes:j.companyTypes||[], ticketCategories:j.ticketCategories||[], leadSources:j.leadSources||[], activityTypes:j.activityTypes||[], cuisineTypes:j.cuisineTypes||[] }; MAXPULL=(j.maxPullLocations!=null?j.maxPullLocations:MAXPULL); DEFSTATE=(j.defaultState!=null?j.defaultState:DEFSTATE); ASSISTANT=(j.assistantName!=null?j.assistantName:ASSISTANT); renderTypes(); document.getElementById('typesMsg').textContent='Reset to defaults ✓'; document.getElementById('typesMsg').className='msg ok'; } }); }

function saveServices(){
  var m=document.getElementById('svcMsg'); m.textContent='Saving…'; m.className='msg';
  post('/api/admin/services-email',{ emails:document.getElementById('svcEmails').value }).then(function(j){
    if(j&&j.ok){ document.getElementById('svcEmails').value=(j.emails||[]).join(', '); m.textContent='Saved ✓'; m.className='msg ok'; }
    else { m.textContent=(j&&j.error)||'Could not save.'; m.className='msg err'; }
  });
}

function renderKey(j){
  var s=document.getElementById('keyStatus');
  if(j&&j.set){ s.className='status on'; s.textContent = j.fromFile?'Set (saved here)':(j.fromEnv?'Set (from environment)':'Set'); }
  else { s.className='status off'; s.textContent='Not set'; }
}
function saveKey(){
  var m=document.getElementById('keyMsg'), k=document.getElementById('keyInput').value.trim();
  if(!k){ m.textContent='Paste a key first.'; m.className='msg err'; return; }
  m.textContent='Saving…'; m.className='msg';
  post('/api/admin/anthropic-key',{ key:k }).then(function(j){ if(j&&j.ok){ document.getElementById('keyInput').value=''; renderKey(j); m.textContent='Saved ✓'; m.className='msg ok'; } else { m.textContent=(j&&j.error)||'Could not save.'; m.className='msg err'; } });
}
function clearKey(){ if(!confirm('Clear the saved Claude API key? The environment key (if any) is used after the next restart.')) return; post('/api/admin/anthropic-key',{clear:true}).then(function(j){ renderKey(j); document.getElementById('keyMsg').textContent=(j&&j.note)||'Cleared.'; document.getElementById('keyMsg').className='msg ok'; }); }

function resetBook(){
  var m=document.getElementById('resetMsg'), v=document.getElementById('resetConfirm').value.trim();
  if(v!=='RESET'){ m.textContent='Type RESET (all caps) to confirm.'; m.className='msg err'; return; }
  if(!confirm('This permanently deletes ALL companies, concepts, and locations (and their photos). Contacts and deals are kept. This cannot be undone. Continue?')) return;
  m.textContent='Working…'; m.className='msg';
  post('/api/admin/reset-book',{confirm:'RESET'}).then(function(j){ if(j&&j.ok){ document.getElementById('resetConfirm').value=''; m.textContent='Done — cleared '+(j.cleared||0)+' company record'+((j.cleared===1)?'':'s')+'.'; m.className='msg ok'; } else { m.textContent=(j&&j.error)||'Could not reset.'; m.className='msg err'; } });
}

function build(){
  document.getElementById('root').innerHTML=
    '<div class="card"><div class="ch"><b>Type lists</b><span>— contact types, company types, and request categories used across the app</span></div><div class="cb">'
    +'<div id="typesBox"></div>'
    +'<div class="btnrow"><button class="btn" id="typesSave">Save type lists</button><button class="btn ghost" id="typesReset">Reset to defaults</button><span class="msg" id="typesMsg"></span></div>'
    +'<div class="note">“Restaurant Owner” and “Referral Source” are already in the default contact types. Renaming a value here does not change contacts already saved with the old value.</div>'
    +'</div></div>'
    +'<div class="card"><div class="ch"><b>Brand Colors</b><span>&mdash; your brand colors, used across the whole app and on branded documents like BOVs</span></div><div class="cb">'
    +'<div style="display:flex;gap:28px;flex-wrap:wrap">'
    +'<div><label class="fld">Primary &mdash; dark / brand</label><div style="display:flex;gap:8px;align-items:center"><input type="color" id="pal_primary" style="width:46px;height:40px;padding:2px;border:1px solid #cfd6e2;border-radius:8px;cursor:pointer"><input type="text" id="pal_primary_hex" maxlength="7" style="max-width:120px" placeholder="#000E31"></div><div class="note" style="margin-top:6px">Buttons, headers, the navigation.</div></div>'
    +'<div><label class="fld">Accent &mdash; highlight / call-to-action</label><div style="display:flex;gap:8px;align-items:center"><input type="color" id="pal_accent" style="width:46px;height:40px;padding:2px;border:1px solid #cfd6e2;border-radius:8px;cursor:pointer"><input type="text" id="pal_accent_hex" maxlength="7" style="max-width:120px" placeholder="#DA2B1F"></div><div class="note" style="margin-top:6px">Accents, the &ldquo;Create&rdquo; button, key highlights.</div></div>'
    +'<div><label class="fld">Sidebar / nav</label><div style="display:flex;gap:8px;align-items:center"><input type="color" id="pal_sidebar" style="width:46px;height:40px;padding:2px;border:1px solid #cfd6e2;border-radius:8px;cursor:pointer"><input type="text" id="pal_sidebar_hex" maxlength="7" style="max-width:120px" placeholder="#0B1A38"></div><div class="note" style="margin-top:6px">The left navigation bar.</div></div>'
    +'<div><label class="fld">Positive / success</label><div style="display:flex;gap:8px;align-items:center"><input type="color" id="pal_positive" style="width:46px;height:40px;padding:2px;border:1px solid #cfd6e2;border-radius:8px;cursor:pointer"><input type="text" id="pal_positive_hex" maxlength="7" style="max-width:120px" placeholder="#1F8A5B"></div><div class="note" style="margin-top:6px">Success chips &amp; saved states.</div></div>'
    +'</div>'
    +'<div class="btnrow"><button class="btn" id="palSave">Save colors</button><button class="btn ghost" id="palReset">Reset to defaults</button><span class="msg" id="palMsg"></span></div>'
    +'<div class="note">Applies across every screen. Your view updates immediately; teammates see it the next time each page loads.</div>'
    +'</div></div>'
    +'<div class="card"><div class="ch"><b>Tool names</b><span>— rename any tool as it appears on the dashboard (e.g. call &ldquo;Contacts&rdquo; &ldquo;People&rdquo;)</span></div><div class="cb">'
    +'<div id="toolLabelsBox"></div>'
    +'<div class="btnrow"><button class="btn" id="tlSave">Save tool names</button><button class="btn ghost" id="tlReset">Reset to defaults</button><span class="msg" id="tlMsg"></span></div>'
    +'<div class="note">Leave a box blank to keep the built-in name. This changes the dashboard label; the tool&rsquo;s own page keeps its heading.</div>'
    +'</div></div>'
    +'<div class="card"><div class="ch"><b>Request notifications</b><span>— who gets emailed when a new office request comes in</span></div><div class="cb">'
    +'<label class="fld">Services email(s)</label><input id="svcEmails" placeholder="van@rrgcre.com, avery@rrgcre.com">'
    +'<div class="btnrow"><button class="btn" id="svcSave">Save recipients</button><span class="msg" id="svcMsg"></span></div>'
    +'<div class="note">Comma-separated. A new request emails all of these (requires server email/SMTP to be configured).</div>'
    +'</div></div>'
    +'<div class="card"><div class="ch"><b>Claude API key</b><span>— powers the AI generators (BOV, CIM, attack plans, find-locations, office assistant)</span></div><div class="cb">'
    +'<div style="margin-bottom:10px">Status: <span id="keyStatus" class="status off">…</span></div>'
    +'<label class="fld">Set / replace key</label><input id="keyInput" type="password" placeholder="sk-ant-…" autocomplete="off">'
    +'<div class="btnrow"><button class="btn" id="keySave">Save key</button><button class="btn ghost" id="keyClear">Clear saved key</button><span class="msg" id="keyMsg"></span></div>'
    +'<div class="note">A key saved here is stored on the server data disk and overrides the ANTHROPIC_API_KEY environment variable. For security the current key is never shown back.</div>'
    +'</div></div>'
    +'<div class="card"><div class="ch"><b>Reset the book</b><span>— danger zone</span></div><div class="cb">'
    +'<div class="note" style="margin-top:0">Permanently deletes <b>all companies, concepts, and locations</b> and their photos. Contacts and deals are kept. There is no undo.</div>'
    +'<label class="fld" style="margin-top:12px">Type RESET to confirm</label><input id="resetConfirm" placeholder="RESET" autocomplete="off" style="max-width:220px">'
    +'<div class="btnrow"><button class="btn danger" id="resetBtn">Delete all companies / concepts / locations</button><span class="msg" id="resetMsg"></span></div>'
    +'</div></div>';
  renderTypes();
  document.getElementById('typesSave').addEventListener('click',saveTypes);
  document.getElementById('typesReset').addEventListener('click',resetTypes);
  document.getElementById('palSave').addEventListener('click',savePalette);
  document.getElementById('palReset').addEventListener('click',resetPalette);
  wirePalette();
  get('/api/admin/palette').then(function(j){ if(j&&j.ok){ PALETTE=j.palette; fillPalette(); } });
  document.getElementById('tlSave').addEventListener('click',saveToolLabels);
  document.getElementById('tlReset').addEventListener('click',resetToolLabels);
  document.getElementById('svcSave').addEventListener('click',saveServices);
  document.getElementById('keySave').addEventListener('click',saveKey);
  document.getElementById('keyClear').addEventListener('click',clearKey);
  document.getElementById('resetBtn').addEventListener('click',resetBook);
  // load current values
  get('/api/admin/types').then(function(j){ if(j&&j.ok){ TYPES={ personTypes:j.personTypes||[], companyTypes:j.companyTypes||[], ticketCategories:j.ticketCategories||[], leadSources:j.leadSources||[], activityTypes:j.activityTypes||[], cuisineTypes:j.cuisineTypes||[] }; MAXPULL=(j.maxPullLocations!=null?j.maxPullLocations:MAXPULL); DEFSTATE=(j.defaultState!=null?j.defaultState:DEFSTATE); ASSISTANT=(j.assistantName!=null?j.assistantName:ASSISTANT); SHOWRIBBON=(j.showRequestRibbon!=null?j.showRequestRibbon:SHOWRIBBON); renderTypes(); } });
  get('/api/admin/tool-labels').then(function(j){ if(j&&j.ok){ TOOLDEFS=j.tools||[]; TOOLLABELS=j.labels||{}; renderToolLabels(); } });
  get('/api/admin/services-email').then(function(j){ if(j&&j.ok){ document.getElementById('svcEmails').value=(j.emails||[]).join(', '); } });
  get('/api/admin/anthropic-key').then(function(j){ if(j&&j.ok) renderKey(j); });
}

get('/api/session').then(function(s){
  if(s&&(s.role==='admin'||s.role==='creator')){ build(); }
  else { document.getElementById('root').innerHTML='<div class="gate"><b style="color:var(--navy);font-size:16px">Admins only</b><br><br>This page is for RRG administrators. <a href="./index.html" style="color:var(--navy);font-weight:700">← Back to the toolbox</a></div>'; }
}).catch(function(){ document.getElementById('root').innerHTML='<div class="gate">Could not verify your session. <a href="/login">Sign in →</a></div>'; });
</script>
