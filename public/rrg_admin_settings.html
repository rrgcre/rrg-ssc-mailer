<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRG — Admin Settings</title>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--ink:#1a2236;--muted:#6b7488;--soft:#8a93a8;--line:#e6e9f0;--wash:#f5f7fb;--green:#1f8a5b;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#eef1f6;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.top{color:#fff;padding:28px 0 30px;position:relative;overflow:hidden;background:radial-gradient(95% 130% at 28% 15%, #1c2e5c 0%, #112044 42%, #0b1636 70%, #071029 100%);}
.top-in{max-width:960px;margin:0 auto;padding:0 24px;position:relative;z-index:2;}
.brand{display:inline-flex;align-items:center;cursor:pointer;} .disc{background:var(--red);color:#fff;border-radius:50%;width:42px;height:42px;font-family:'Arial Black',Arial,sans-serif;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;letter-spacing:-.04em;}
.bar{background:#fff;width:3px;height:30px;margin:0 12px;} .wm{font-weight:800;font-size:14px;text-transform:uppercase;line-height:.95;}
.kicker{margin:20px 0 4px;color:var(--red);font-weight:700;letter-spacing:.3em;font-size:11px;text-transform:uppercase;}
h1{font-size:29px;font-weight:800;margin:0;color:#fff;letter-spacing:-.01em;}
.sub{color:#aeb8cf;font-size:13px;margin-top:7px;max-width:680px;}
.wrap{max-width:1040px;margin:0 auto;padding:28px 24px 70px;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(10,20,50,.06);overflow:hidden;margin-bottom:20px;}
.ch{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line);} .ch b{color:var(--navy);font-size:14px;} .ch span{color:var(--muted);font-size:11.5px;}
.cb{padding:18px 20px;}
label.fld{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:700;margin:2px 0 7px;}
input,textarea{width:100%;border:1px solid #cfd6e2;border-radius:9px;padding:10px 12px;font:inherit;font-size:13.5px;color:var(--ink);background:#fff;}
.tagbox{display:flex;flex-wrap:wrap;gap:7px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--wash);min-height:46px;}
.tagchip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #d3ddf3;color:var(--navy);border-radius:8px;padding:5px 9px;font-size:12.5px;font-weight:700;}
.tagchip button{background:none;border:none;color:var(--red);font-size:15px;line-height:1;cursor:pointer;padding:0;}
.addrow{display:flex;gap:8px;margin-top:10px;}
.addrow input{flex:1;}
.btn{background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:9px;padding:10px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.btn.ghost{background:#fff;color:var(--navy);border-color:#cdd6e6;} .btn.danger{background:#fff;color:var(--red);border-color:#f0c9c6;} .btn.danger:hover{background:#fdeceb;}
.btn:disabled{opacity:.5;cursor:default;}
.btnrow{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap;align-items:center;}
.msg{font-size:12.5px;font-weight:600;} .msg.ok{color:var(--green);} .msg.err{color:var(--red,#DA2B1F);}
.note{font-size:12px;color:var(--muted);line-height:1.55;margin-top:8px;}
.status{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;}
.status.on{background:#eafaf0;color:#0e7a53;border:1px solid #b9e6cd;} .status.off{background:#f2f4f8;color:#6b7488;border:1px solid #e0e5ee;}
.grid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;} @media(max-width:800px){.grid2{grid-template-columns:1fr;}}
.gate{max-width:520px;margin:80px auto;text-align:center;color:var(--muted);}
.foot{max-width:960px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:11.5px;}
.tagchip{display:inline-flex;align-items:center;gap:2px;}
.tagchip .tmv{border:none;background:transparent;color:#98a1b5;cursor:pointer;font-size:15px;font-weight:800;padding:0 1px;line-height:1;} .tagchip .tmv:hover{color:#DA2B1F;}
.tagchip .tglbl{padding:0 2px;}
.tagchip.sysreq{background:#f6f3e8;border-color:#e2d6ab;}
.tagchip[draggable="true"]{cursor:grab;} .tagchip[draggable="true"]:active{cursor:grabbing;}
.tagchip.dragging{opacity:.35;} .tagchip.dragover{box-shadow:0 0 0 2px var(--primary,#2c5c8f);}
.ordhint{font-size:11.5px;color:var(--muted,#69748a);margin:2px 0 12px;} .ordhint b{color:var(--navy,#000E31);}
.tagchip .tgsys{margin-left:3px;background:#e7dfc2;color:#7a6414;border-radius:5px;padding:1px 6px;font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;cursor:help;}
.sectionhd{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:30px 2px 13px;display:flex;align-items:center;gap:12px;}
.sectionhd:first-child{margin-top:6px;}
.sectionhd:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),rgba(230,233,240,0));}
.ch{background:var(--wash);}
.card{transition:box-shadow .15s,border-color .15s;} .card:hover{box-shadow:0 10px 30px rgba(10,20,50,.09);}
.card.danger{border-color:#f2cdc9;} .card.danger>.ch{background:#fdefed;border-bottom-color:#f5d7d3;} .card.danger>.ch b{color:var(--red);}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<!--rrgback--><a href="/admin" class="rrg-back" aria-label="Back to admin console" style="position:fixed;left:16px;bottom:16px;z-index:99999;display:inline-flex;align-items:center;gap:7px;background:rgba(0,14,49,.85);color:#fff;text-decoration:none;font:700 12.5px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;padding:10px 15px;border-radius:100px;border:1px solid rgba(255,255,255,.22);box-shadow:0 6px 20px rgba(0,0,0,.28)"><span style="font-size:14px;line-height:1">←</span> Admin console</a>
<div class="top"><div class="top-in">
  <span class="brand" onclick="location.href='./index.html'"><span class="disc">RRG</span><span class="bar"></span><span class="wm">Restaurant<br>Realty<br>Group</span></span>
  <div class="kicker">Admin</div>
  <h1>Settings</h1>
  <div class="sub">Editable type lists, request notifications, and data reset. Admin only.</div>
</div></div>
<div id="root" class="wrap"><div class="gate">Loading…</div></div>
<div class="foot">Proprietary &amp; Confidential · Property of Restaurant Realty Group, LLC · Internal RRG use only.</div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function post(url,body){ return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body||{})}).then(function(r){return r.json();}); }
function get(url){ return fetch(url,{credentials:'same-origin'}).then(function(r){return r.json();}); }

var TYPES={ personTypes:[], companyTypes:[], ticketCategories:[], leadSources:[], activityTypes:[], roomCloseReasons:[], cuisineTypes:[], conceptTypes:[], markets:[], agreementTypes:[] };
var FEATS={};
function featChk(id,label,desc){ return '<label style="display:flex;align-items:flex-start;gap:9px;cursor:pointer;margin:8px 0;font-size:13.5px"><input type="checkbox" id="'+id+'"'+((FEATS[id]!==false)?' checked':'')+' style="width:auto;margin-top:2px;flex:none"><span><b style="font-weight:700;color:var(--navy)">'+label+'</b><span style="display:block;color:#6b7488;font-size:12px">'+desc+'</span></span></label>'; }
function _setFeats(j){ if(!j) return; ['featCalSync','featCalTasks','featCalMeet','featWorkHours','featEventFiles','featBooking','featCalShare'].forEach(function(k){ FEATS[k]=(j[k]!==false); }); }
var SYSREQ={ leadSources:[] };
function isSysReq(kind,val){ var a=(SYSREQ&&SYSREQ[kind])||[]; return a.some(function(x){ return String(x).toLowerCase()===String(val).toLowerCase(); }); }
var MAXPULL=20; var RECENCY=90; var DEFSTATE='TX'; var ASSISTANT='Claude'; var CONCEPTL='Concept'; var CONCEPTLP='Concepts'; var SHOWRIBBON=true; var PIPELINEREQ=false; var TOOLDEFS=[]; var TOOLLABELS={}; var RECENCYON=true;
function recencyToggle(){ var on=document.getElementById('recencyon'), d=document.getElementById('recencydays'); if(on&&d){ d.disabled=!on.checked; d.style.opacity=on.checked?String(1):String(0.45); } }

function tagListHtml(kind,arr){
  return '<div class="tagbox" id="tb_'+kind+'">'+(arr.length?arr.map(function(t,i){ var sys=isSysReq(kind,t); var tail = sys ? '<span class="tgsys" title="System type — the app relies on this, so it can’t be removed.">required</span>' : ('<button type="button" class="tgx" data-rm="'+kind+'" data-val="'+esc(t)+'" title="Remove">×</button>'); return '<span class="tagchip'+(sys?' sysreq':'')+'" data-kind="'+kind+'" data-idx="'+i+'"'+(sys?'':' draggable="true"')+' title="'+(sys?'':'Drag to reorder')+'"><button type="button" class="tmv" data-mv="'+kind+'" data-i="'+i+'" data-d="-1" title="Move earlier">‹</button><span class="tglbl">'+esc(t)+'</span><button type="button" class="tmv" data-mv="'+kind+'" data-i="'+i+'" data-d="1" title="Move later">›</button>'+tail+'</span>'; }).join(''):'<span class="note" style="margin:4px">None — add one below.</span>')+'</div>'
    +'<div class="addrow"><input id="add_'+kind+'" placeholder="Add a value and press Enter"><button class="btn ghost" type="button" data-add="'+kind+'">Add</button><button class="btn ghost" type="button" data-sort="'+kind+'" title="Sort this list A \u2192 Z">A\u2013Z</button></div>';
}
function renderTypes(){
  document.getElementById('typesBox').innerHTML=
    '<div class="ordhint"><b>Drag</b> any value to set its order, or use the <b>‹ ›</b> arrows. This is the exact order it appears in the pop-up menus across the app — <b>A–Z</b> is just a shortcut when alphabetical is what you want.</div>'
    +'<div class="grid2">'
    +'<div><label class="fld">Main interests</label>'+tagListHtml('personTypes',TYPES.personTypes)+'</div>'
    +'<div><label class="fld">Company types</label>'+tagListHtml('companyTypes',TYPES.companyTypes)+'</div>'
    +'<div><label class="fld">Request categories</label>'+tagListHtml('ticketCategories',TYPES.ticketCategories)+'</div>'
    +'<div><label class="fld">Lead sources</label>'+tagListHtml('leadSources',TYPES.leadSources)+'</div>'
    +'<div><label class="fld">Activity types</label>'+tagListHtml('activityTypes',TYPES.activityTypes)+'</div>'
    +'<div><label class="fld">Data room close reasons</label>'+tagListHtml('roomCloseReasons',TYPES.roomCloseReasons)+'</div>'
    +'<div><label class="fld">Cuisine types</label>'+tagListHtml('cuisineTypes',TYPES.cuisineTypes)+'</div>'
    +'<div><label class="fld">Concept types</label>'+tagListHtml('conceptTypes',TYPES.conceptTypes)+'</div>'
    +'<div><label class="fld">Markets <span style="font-weight:400;color:#8a93a8;font-size:11px">— metros for companies, listings, Buy-Box & Tenant-Box matching</span></label>'+tagListHtml('markets',TYPES.markets)+'</div>'
    +'<div><label class="fld">Agreement types</label>'+agrListHtml()+'</div>'
    +'</div>'
    +'<div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line)"><label class="fld">Max locations per web pull</label><input id="maxpull" type="number" min="1" max="500" value="'+esc(MAXPULL)+'" style="max-width:150px"><div class="note" style="margin-top:6px">Caps how many locations the &ldquo;Find locations&rdquo; web pull creates at once, so a big chain does not import hundreds. Default 20.</div></div>'
    +'<div style="margin-top:16px"><label class="fld" style="display:flex;align-items:center;gap:9px;cursor:pointer"><input type="checkbox" id="recencyon" style="width:auto" onchange="recencyToggle()"> Show records active within (days)</label><input id="recencydays" type="number" min="1" max="3650" value="'+esc(RECENCY)+'" style="max-width:150px;margin-top:8px"><div class="note" style="margin-top:6px">When <b>on</b>, Companies and Contacts opened with no search or filter show only records with activity in this many days \u2014 newest edit, logged activity, or last contact (default 90); a \u201cShow all\u201d link on each list reveals everything. When <b>off</b>, the lists show every record by default.</div></div>'
    +'<div style="margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><label class="fld">Default state for new records</label><input id="defstate" value="'+esc(DEFSTATE)+'" maxlength="20" style="max-width:120px"></div><div><label class="fld">Assistant name (AI helper)</label><input id="assistant" value="'+esc(ASSISTANT)+'" maxlength="40" placeholder="Claude"></div></div><div style="margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><label class="fld">\u201cConcept\u201d label — singular</label><input id="conceptl" value="'+esc(CONCEPTL)+'" maxlength="30" placeholder="Concept"></div><div><label class="fld">\u201cConcept\u201d label — plural</label><input id="conceptlp" value="'+esc(CONCEPTLP)+'" maxlength="30" placeholder="Concepts"></div></div><div class="note" style="margin-top:6px">Default state pre-fills the State field on new companies. Assistant name is what the app calls its AI helper throughout (default Claude). The Concept label renames \u201cConcept/Concepts\u201d across the app (e.g. Brand/Brands) — handy for white-label.</div>'
    +'<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)"><label style="display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--navy);cursor:pointer"><input type="checkbox" id="showribbon"'+(SHOWRIBBON?' checked':'')+'> Show the open-requests ribbon on the dashboard</label><div class="note" style="margin-top:6px">When on, the dashboard shows a ribbon summarizing open requests. Turn off to hide it for everyone.</div></div>'
    +'<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)"><label style="display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--navy);cursor:pointer"><input type="checkbox" id="pipelinereq"'+(PIPELINEREQ?' checked':'')+'> Require a pipeline when creating a company</label><div class="note" style="margin-top:6px">When on, creating a new company requires choosing a pipeline \u2014 every new seller starts as a listing on the board. When off, the pipeline picker is optional.</div></div>'
    +'<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)"><label class="fld" style="margin-bottom:4px">Calendar features</label><div class="note" style="margin:0">Calendar toggles now live in their own <b>Settings &rarr; Calendar</b> section.</div></div>';
  document.querySelectorAll('[data-rm]').forEach(function(b){ b.addEventListener('click',function(){ var k=b.getAttribute('data-rm'), v=b.getAttribute('data-val'); TYPES[k]=TYPES[k].filter(function(x){return x!==v;}); renderTypes(); saveTypes(); }); });
  document.querySelectorAll('[data-mv]').forEach(function(b){ b.addEventListener('click',function(){ var k=b.getAttribute('data-mv'), i=+b.getAttribute('data-i'), d=+b.getAttribute('data-d'), j=i+d; if(j<0||j>=TYPES[k].length) return; var t=TYPES[k][i]; TYPES[k][i]=TYPES[k][j]; TYPES[k][j]=t; renderTypes(); saveTypes(); }); });
  document.querySelectorAll('[data-sort]').forEach(function(b){ b.addEventListener('click',function(){ var k=b.getAttribute('data-sort'); TYPES[k]=(TYPES[k]||[]).slice().sort(function(a,c){ return String(a).toLowerCase().localeCompare(String(c).toLowerCase()); }); renderTypes(); saveTypes(); }); });
  document.querySelectorAll('[data-add]').forEach(function(b){ b.addEventListener('click',function(){ addType(b.getAttribute('data-add')); }); });
  document.querySelectorAll('[data-agrrm]').forEach(function(b){ b.addEventListener('click',function(){ var i=+b.getAttribute('data-agrrm'); TYPES.agreementTypes.splice(i,1); renderTypes(); saveTypes(); }); });
  document.querySelectorAll('[data-agrmv]').forEach(function(b){ b.addEventListener('click',function(){ var i=+b.getAttribute('data-agrmv'), d=+b.getAttribute('data-d'), j=i+d; if(j<0||j>=TYPES.agreementTypes.length) return; var t=TYPES.agreementTypes[i]; TYPES.agreementTypes[i]=TYPES.agreementTypes[j]; TYPES.agreementTypes[j]=t; renderTypes(); saveTypes(); }); });
  document.querySelectorAll('[data-agradd]').forEach(function(b){ b.addEventListener('click',addAgrType); });
  var _ai=document.getElementById('add_agr'); if(_ai) _ai.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); addAgrType(); } });
  ['personTypes','companyTypes','ticketCategories','leadSources','activityTypes','roomCloseReasons','cuisineTypes','conceptTypes','markets'].forEach(function(k){ var inp=document.getElementById('add_'+k); if(inp) inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); addType(k); } }); });
  wireDrag();
}
var _dragK=null, _dragI=null;
function wireDrag(){
  var chips=[].slice.call(document.querySelectorAll('.tagchip[data-kind]'));
  chips.forEach(function(ch){
    if(ch.getAttribute('draggable')==='true'){
      ch.addEventListener('dragstart',function(e){ _dragK=ch.getAttribute('data-kind'); _dragI=+ch.getAttribute('data-idx'); ch.classList.add('dragging'); try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(_dragI)); }catch(_e){} });
      ch.addEventListener('dragend',function(){ ch.classList.remove('dragging'); [].slice.call(document.querySelectorAll('.tagchip.dragover')).forEach(function(x){ x.classList.remove('dragover'); }); });
    }
    ch.addEventListener('dragover',function(e){ if(_dragK==null || ch.getAttribute('data-kind')!==_dragK) return; e.preventDefault(); ch.classList.add('dragover'); });
    ch.addEventListener('dragleave',function(){ ch.classList.remove('dragover'); });
    ch.addEventListener('drop',function(e){ e.preventDefault(); ch.classList.remove('dragover'); var k=ch.getAttribute('data-kind'); if(_dragK==null || k!==_dragK) return; var to=+ch.getAttribute('data-idx'); if(to===_dragI) { _dragK=null; _dragI=null; return; } var arr=TYPES[k]; if(!arr||_dragI<0||_dragI>=arr.length) { _dragK=null; _dragI=null; return; } var item=arr.splice(_dragI,1)[0]; arr.splice(to,0,item); _dragK=null; _dragI=null; renderTypes(); saveTypes(); });
  });
}
function agrListHtml(){
  var arr=TYPES.agreementTypes||[];
  return '<div class="tagbox" id="tb_agr">'+(arr.length?arr.map(function(t,i){ var sys=isSysReq('agreementTypes',t.label); var tail = sys ? '<span class="tgsys" title="System type — the app relies on this, so it cannot be removed.">required</span>' : '<button type="button" class="tgx" data-agrrm="'+i+'" title="Remove">\u00d7</button>'; return '<span class="tagchip'+(sys?' sysreq':'')+'"><button type="button" class="tmv" data-agrmv="'+i+'" data-d="-1" title="Move earlier">\u2039</button><span class="tglbl">'+esc(t.label)+'</span><button type="button" class="tmv" data-agrmv="'+i+'" data-d="1" title="Move later">\u203a</button>'+tail+'</span>'; }).join(''):'<span class="note" style="margin:4px">None \u2014 add one below.</span>')+'</div>'
    +'<div class="addrow"><input id="add_agr" placeholder="Add an agreement type and press Enter"><button class="btn ghost" type="button" data-agradd="1">Add</button></div>';
}
function addAgrType(){ var inp=document.getElementById('add_agr'); var v=(inp.value||'').trim(); if(!v) return; TYPES.agreementTypes=TYPES.agreementTypes||[]; if(!TYPES.agreementTypes.some(function(t){return String(t.label).toLowerCase()===v.toLowerCase();})) TYPES.agreementTypes.push({key:'',label:v}); inp.value=''; renderTypes(); saveTypes('add_agr'); }
function addType(k){ var inp=document.getElementById('add_'+k); var v=(inp.value||'').trim(); if(!v) return; if(TYPES[k].map(function(x){return x.toLowerCase();}).indexOf(v.toLowerCase())<0) TYPES[k].push(v); inp.value=''; renderTypes(); saveTypes('add_'+k); }
function renderToolLabels(){
  var box=document.getElementById('toolLabelsBox'); if(!box) return;
  box.innerHTML='<div class="grid2">'+TOOLDEFS.map(function(t){
    var cur=TOOLLABELS[t.file]||'';
    return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="min-width:150px;color:var(--muted);font-size:13px">'+esc(t.name)+'</span><input data-tl="'+esc(t.file)+'" value="'+esc(cur)+'" placeholder="'+esc(t.name)+'" maxlength="40" style="flex:1"></div>';
  }).join('')+'</div>';
}
function saveToolLabels(){
  var m=document.getElementById('tlMsg'); m.textContent='Saving…'; m.className='msg';
  var labels={}; document.querySelectorAll('[data-tl]').forEach(function(i){ var v=(i.value||'').trim(); if(v) labels[i.getAttribute('data-tl')]=v; });
  post('/api/admin/tool-labels',{labels:labels}).then(function(j){ if(j&&j.ok){ TOOLDEFS=j.tools||TOOLDEFS; TOOLLABELS=j.labels||{}; renderToolLabels(); m.textContent='Saved ✓'; m.className='msg ok'; } else { m.textContent=(j&&j.error)||'Could not save.'; m.className='msg err'; } });
}
async function resetToolLabels(){ if(!await rrgConfirm('Reset all tool names back to the built-in defaults?')) return; post('/api/admin/tool-labels',{reset:true}).then(function(j){ if(j&&j.ok){ TOOLDEFS=j.tools||TOOLDEFS; TOOLLABELS=j.labels||{}; renderToolLabels(); var m=document.getElementById('tlMsg'); m.textContent='Reset ✓'; m.className='msg ok'; } }); }
function saveTypes(refocus){

  post('/api/admin/types',{ personTypes:TYPES.personTypes, companyTypes:TYPES.companyTypes, ticketCategories:TYPES.ticketCategories, leadSources:TYPES.leadSources, activityTypes:TYPES.activityTypes, roomCloseReasons:TYPES.roomCloseReasons, cuisineTypes:TYPES.cuisineTypes, conceptTypes:TYPES.conceptTypes, markets:TYPES.markets, agreementTypes:TYPES.agreementTypes, maxPullLocations:(document.getElementById('maxpull')?document.getElementById('maxpull').value:MAXPULL), defaultState:(document.getElementById('defstate')?document.getElementById('defstate').value:DEFSTATE), assistantName:(document.getElementById('assistant')?document.getElementById('assistant').value:ASSISTANT), listRecencyDays:(document.getElementById('recencydays')?document.getElementById('recencydays').value:RECENCY), listRecencyEnabled:(document.getElementById('recencyon')?document.getElementById('recencyon').checked:RECENCYON), conceptLabel:(document.getElementById('conceptl')?document.getElementById('conceptl').value:CONCEPTL), conceptLabelPlural:(document.getElementById('conceptlp')?document.getElementById('conceptlp').value:CONCEPTLP), showRequestRibbon:(document.getElementById('showribbon')?document.getElementById('showribbon').checked:SHOWRIBBON), pipelineRequiredOnCompany:(document.getElementById('pipelinereq')?document.getElementById('pipelinereq').checked:PIPELINEREQ) }).then(function(j){
