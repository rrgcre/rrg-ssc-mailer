<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullServe — Features</title>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--ink:#1a2236;--muted:#6b7488;--soft:#8a93a8;--line:#e6e9f0;--wash:#f5f7fb;--green:#1f8a5b;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#eef1f6;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
.top{background:radial-gradient(95% 130% at 28% 15%, #1c2e5c 0%, #112044 42%, #0b1636 70%, #071029 100%);color:#fff;padding:26px 0 24px;}
.top-in{max-width:1120px;margin:0 auto;padding:0 24px;}
.disc{background:var(--red);color:#fff;border-radius:50%;width:40px;height:40px;font-family:'Arial Black',Arial;font-weight:900;font-size:13px;display:inline-flex;align-items:center;justify-content:center;letter-spacing:-.04em;cursor:pointer;}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8fa2c4;font-weight:800;margin:14px 0 4px;}
h1{margin:0;font-size:28px;font-weight:800;}
.sub{color:#aeb8cf;font-size:13px;margin-top:6px;max-width:720px;line-height:1.5;}
.wrap{max-width:1120px;margin:20px auto;padding:0 24px 70px;}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.bar input{border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:inherit;font-size:14px;min-width:280px;background:#fff;}
.bar .count{color:var(--muted);font-size:12.5px;font-weight:600;}
.jump{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px;}
.jump a{font-size:12px;font-weight:700;color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:100px;padding:6px 13px;text-decoration:none;}
.jump a:hover{background:var(--wash);}
.sec{margin-bottom:26px;scroll-margin-top:16px;}
.sech{display:flex;align-items:center;gap:11px;margin:0 0 12px;}
.swatch{width:12px;height:12px;border-radius:4px;flex:none;}
.sech h2{font-size:16px;font-weight:800;color:var(--navy);margin:0;}
.sech .sc{font-size:11.5px;color:var(--soft);font-weight:700;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;}
.fcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 3px 14px rgba(10,20,50,.04);}
.fcard .fn{font-weight:800;color:var(--navy);font-size:14px;display:flex;align-items:center;gap:8px;}
.fcard .fn .tag{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;border-radius:5px;padding:2px 6px;margin-left:auto;}
.tag.new{background:#e7f5ee;color:#1f7a52;} .tag.soon{background:#fdf1df;color:#b5791f;} .tag.admin{background:#eef0f4;color:#6b7488;}
.fcard .fd{color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:6px;}
.noresult{text-align:center;color:var(--muted);padding:40px;}
.foot{max-width:1120px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:11.5px;}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<!--rrgback--><a href="./index.html" class="rrg-back" style="position:fixed;left:16px;bottom:16px;z-index:99999;display:inline-flex;align-items:center;gap:7px;background:rgba(0,14,49,.85);color:#fff;text-decoration:none;font:700 12.5px/1 -apple-system,Arial,sans-serif;padding:10px 15px;border-radius:100px;border:1px solid rgba(255,255,255,.22)"><span style="font-size:14px;line-height:1">←</span> Toolbox</a>
<div class="top"><div class="top-in">
  <span class="disc" onclick="location.href='./index.html'">RRG</span>
  <div class="kicker">Reference</div>
  <h1>Features</h1>
  <div class="sub">Everything FullServe can do, grouped the way the toolbar is. Search it, or jump to a section. Built for the team — a quick way to remember what's in here.</div>
</div></div>
<div class="wrap">
  <div class="bar"><input id="q" placeholder="Search features…" oninput="render()"><span class="count" id="count"></span></div>
  <div class="jump" id="jump"></div>
  <div id="root"></div>
</div>
<div class="foot">Proprietary &amp; Confidential · Property of Restaurant Realty Group, LLC · Internal RRG use only.</div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
var SECTIONS=[
  { name:'Book of Business', color:'#2f6fd0', items:[
    { n:'Companies', d:'Company records with concepts, locations, logos, website enrichment, and linked contacts & deals.' },
    { n:'Contacts', d:'Full contact records — the listings they inquired about with live stage, automation plans, email composer with templates, and an activity feed you can filter to hide system events. Drag files straight onto the Files card to upload several at once (types auto-suggested), and send any file into a data room in one click. Toolbar <b>Saved searches</b> store and share filter sets across your team and devices. A KPI header shows Interactions, Last Contacted, Inactive Days, Closed Deals, <b>Transaction Volume</b> and Commission, and one-click <b>+ BOV</b> / <b>+ CIM</b> buttons (gated) create the valuation or marketing pack. Starring a contact stars its company automatically (and clears when none remain starred). Files on the card show a green marker when they\u2019re already in a data room.', tag:'new' },
    { n:'Agreements', d:'E-sign engine: place fields on the PDF, the rep fills every detail, the signer only signs, it countersigns, and every party gets the fully-executed PDF with an audit certificate.' }
  ]},
  { name:'Business Sales', color:'#1f8a5b', items:[
    { n:'Pipeline Board', d:'Kanban view of every deal by stage — drag between stages, with search, filters, saved views, sort, and per-column paging. Cards show the listing price and full commission; an optional compressed view fits a long pipeline on one 1080p screen; and Card Flags badge high-value listings (over a dollar threshold you set) and slipping deals (no activity for N days). New and edited listings appear the moment you return to the board.', tag:'new' },
    { n:'Qualification Calls', d:'Seller screening queue — qualify a call, then advance it to a valuation questionnaire.' },
    { n:'Valuations', d:'Broker Opinion of Value builder and the valuation questionnaire that feeds it.' },
    { n:'Listings', d:'The deal file, laid out like your contact and company pages: a KPI header (asking price, days on market, interested parties, data-room views, NDAs, tours, offers, projected commission), a working column with facts, pipeline and Manage, and a collapsible, drag-to-reorder rail of related lists — buyer leads, matching buyers, NDAs, tours, offers, and expenses. Each listing carries BOTH a Seller pipeline (its board track) and a Buyer pipeline (its buy-side funnel), set side by side in Manage, plus a quick-access bar with one-click <b>+ BOV</b> and <b>+ CIM</b> pills (gated on readiness) beside its data room. KPI chips are left-aligned and only appear when they have a value. Manually-entered listings start <b>Unqualified</b> at the front of the pipeline. A <b>Share with team</b> toggle and one-click <b>+ BOV</b> / <b>+ CIM</b> (never gated \u2014 they stand up the document and collect what they need) round out the Manage panel.', tag:'new' },
    { n:'Buyers — Buy-Side Funnel', d:'Every listing runs its own buyer funnel — one lane per interested buyer moving Inquiry → NDA → Buyer Call → Data Room → Seller Intro → Offer → Due Diligence → Close. A proof-of-funds gate warns before you grant data-room access, buyers can be flagged Backup or Passed, and offer amounts are tracked. Promote any inbound buyer lead into the funnel in one click (deduped by contact). A firm-wide <b>Buyers</b> page rolls every buyer up across all listings with stage, market, POF and offer filters. Stages are fully configurable — and each buyer stage can fire an <b>on-enter</b> or <b>on-leave automation</b> (send the NDA, send the data-room invite, notify, create a task) using the same stage settings as your sell-side pipelines.', tag:'new' },
    { n:'Listing Photos & Media', d:'A photo gallery on every listing — drag-and-drop upload, drag to reorder, inline captions and a chosen cover photo — plus a video walkthrough (YouTube, Vimeo, Loom or .mp4) and a Matterport 3D tour that embed right on the page. Kept with the listing for your CIM and buyer package; not auto-published to the blind marketplace.', tag:'new' },
    { n:'Data Rooms', d:'Access-gated document sharing with per-buyer tracking of who opened what and when. <b>Drag-and-drop</b> a batch of files anywhere onto the room and Claude files each into the right folder automatically. Build the room your way: at creation, keep the <b>standard folders</b>, seed each Financials/Tax year with <b>12 calendar months</b> or <b>13 four-week periods</b> (the restaurant fiscal calendar), or open the <b>Customize folders</b> picker to check exactly what you want. Inside the room, add folders and subfolders, rename or trash them (files fall back to root, never lost), <b>rename any file</b>, and move files between folders or up to the root. Rooms open with <b>all folders collapsed</b> and <b>remember your layout</b> after the first visit — separately for you and for each buyer. The Data Rooms list flags every room <b>● Live</b> (active + documents), <b>🔗 Shared</b> (given to a buyer), or <b>Setup</b>, with quick-view chips (Active / Active &amp; populated) and a trash-can delete.', tag:'new' },
    { n:'Deals', d:'Transaction tracking through LOI, contract, due diligence, closing, and commission status.' }
  ]},
  { name:'Marketing', color:'#c77dc0', items:[
    { n:'Marketing Packs', d:'CIM / offering memorandum builder for taking a listing to market. Pulls the listing’s photos in automatically (cover first) so you never re-upload — edit captions, remove any, or add more, then Build.', tag:'new' },
    { n:'Market Attack Plans', d:'Structured go-to-market plan for a listing.' },
    { n:'Email Templates', d:'Reusable emails sorted by category (Buyer, Seller, NDA, Follow-up, Closing). Personal templates are yours; Shared (firm) templates are published by admins. Merge tokens like {{first_name}}, {{code_name}} and {{asking_price}}, a live preview that flags unfilled fields, plus duplicate, archive, and use tracking. Pick a salutation that inserts with the contact’s first name, and each template can trigger an automation when it is sent from a contact.', tag:'new' },
    { n:'Subscribers', d:'Your marketing audience in its own list, separate from CRM contacts. Add by hand, paste a list, or pull from contacts by segment. Each subscriber sets their own preference \u2014 all emails, only specific markets, or unsubscribed \u2014 and every campaign honors it. Search, filter, tag, and track status.', tag:'new' },
    { n:'Mass Emails', d:'Send one personalized email to a segment of your subscriber list. Filter by tag or last-emailed window, tag the campaign with markets so market-preference subscribers are matched, start from a template; every message is merged one-to-one, tracked for opens and clicks, and carries an unsubscribe / preferences link. Live campaign history with delivered, open-rate, and click-rate stats. Admin-only.', tag:'new' },
    { n:'Automations', d:'Multi-step plans (send email, create a task, send a notification) timed by days after the prior step; enroll any contact, run several plans at once, and auto-enroll BizBuySell leads. Start any email step from a saved template to turn your templates into a timed cadence. Enroll a whole segment of contacts at once, watch active-enrollment counts per plan, and email steps automatically skip unsubscribed contacts. A Flash-dialog step pops an on-screen message to the enrolling rep.', tag:'new' }
  ]},
  { name:'Accounting', color:'#4fb0a6', items:[
    { n:'Invoices', d:'Bill commission and fees per transaction with line items; record payments against each invoice and watch balance and status update themselves.', tag:'new' },
    { n:'Payments', d:'One ledger of every payment across all invoices, each linked back to its invoice.', tag:'new' },
    { n:'Expenses', d:'Log deal and business expenses by category, tie them to a listing, flag reimbursables — with totals up top and a roll-up on each deal.', tag:'new' }
  ]},
  { name:'Tenant & Landlord Rep', color:'#c98a5e', items:[
    { n:'Tenant Rep', d:'Tenant representation workspace.' },
    { n:'Space Tracker', d:'Every available space in one place — economics ($/SF, NNN, size), position type, and the “bones” already built (hood, grease trap, walk-in, drive-thru). AI matches spaces to a client’s on-file site criteria, and <b>auto-imports broker marketing brochures from your Gmail</b>: it watches your inbox for lease/sale flyers, files each as a space, stores the PDF on it, and creates its shopping center if new — deduped by address. The flyer PDF is read with <b>vision/OCR</b> so image-based flyers parse, and anything unclear lands in a <b>Review</b> queue to accept or fix. Paste a listing or upload flyers to add by hand, and drop in a Placer.ai report to fold foot-traffic into the notes. <b>Shopping Centers</b> is a scrolling list (like Companies/Contacts) where each center shows the spaces it contains.', tag:'new' },
    { n:'Landlord Rep', d:'Landlord representation workspace.', tag:'soon' }
  ]},
  { name:'Tools', color:'#5b6472', items:[
    { n:'Tasks', d:'Task list with due dates, reminders (popup/email/SMS), priorities and recurring — assign to any rep, linked to contacts or listings, shown on each listing with one-click reschedule, and bulk-complete right from the list. Give any task a <b>Type</b> (Call, Email, Meeting, To-Do, or any activity type your admin adds); the Tasks card header shows just the count of open tasks. Quick-due chips (2 hr, 4 hr, 1 day, 3 days, 1 week) set the due date in one tap, and a task can link to <b>any</b> listing (optional).', tag:'new' },
    { n:'Wish List', d:'Log features and bugs, approve the ones to build, send them to Claude in one click, and track each to Shipped — with Claude&rsquo;s replies shown inline.', tag:'new' },
    { n:'Gmail Contact Import', d:'Scan your Gmail for everyone you correspond with, review the list, and add the ones you pick — linked to a company or a permanent "No Company".' },
    { n:'BizBuySell Import', d:'Pull BBS leads from your inbox, auto-create a stub listing when there&rsquo;s no match, link them all to a permanent BizBuySell company, and start them on an automation.' },
    { n:'Navigation', d:'A global Search plus a Recent strip under the breadcrumb that links back to the records you just viewed. Consistent symbols make controls easy to spot: » marks every pipeline selector and \u27f3 marks every automation selector, app-wide.', tag:'new' },
    { n:'Features', d:'This page — the running catalog of everything the system does, by section.', tag:'new' }
  ]},
  { name:'Admin', color:'#8a5cf0', items:[
    { n:'Users & Roles', d:'Manage users and role-based permissions across records, AI, LOI library, exports, and admin access.', tag:'admin' },
    { n:'Pipelines & Stages', d:'Build and edit pipelines and their stages — name, abbreviation, target days, win %, auto-complete triggers, pre-listing flags and on-enter/on-leave automations. A live total shows the real end-to-end timeline (sum of target days, in weeks/months) so no one underestimates how long a deal takes. Deal-type routing picks which pipeline each kind of deal enters — including the default <b>Buyer</b> pipeline every listing inherits. Create buyer pipelines by setting a pipeline’s practice area to “Buyer”; assign one per listing or set the firm default here.', tag:'admin' },
    { n:'Menu Access', d:'Assign each toolbar section to a role or department; the owner always sees everything.', tag:'admin' },
    { n:'Agreement Templates & Field Designer', d:'Store standard agreements and drop signature, date, and text fields exactly where they go on the PDF.', tag:'admin' },
    { n:'Email Setup', d:'Connect sending email; system messages send as the office with reply-to the rep.', tag:'admin' },
    { n:'Confidential Marketplace', d:'A public, NDA-gated buyer page at <b>/market</b> where your <b>Published</b> listings appear <b>blind</b> \u2014 concept, market and economics (guide, revenue, SDE) with no names, addresses or photos until a buyer signs an NDA. Buyers filter and hit <b>Request access</b>, which logs an inquiry on the listing for you to qualify. Admin picks the <b>layout</b> \u2014 <b>Ledger</b> (a refined data table), <b>Register</b> (a catalog index grouped by market), or <b>Card grid</b> \u2014 each with a small flat concept icon per cuisine, so different firms don\u2019t all look alike. Admin also defines the <b>badges</b> (New, New price, Price reduced\u2026) with a color and a <b>days-to-live</b> so they auto-drop off the marketplace after they age out. Open it any time from the \u2197 <b>Public marketplace</b> button on the Listings board.', tag:'new' },
    { n:'Office Requests', d:'Reps open requests to the brokerage office — marketing, signage, photography, listings, compliance, IT, supplies — and an AI office assistant works each one instantly, routed to the right department. Each request now carries a <b>due date with overdue flags</b> (auto-set by priority, editable per request; overdue ones turn red and roll up into the Overdue KPI), <b>file attachments</b> (drop a flyer, spec, or photo right on the thread, up to 20 MB), and <b>internal office notes</b> that only the office team on that department can see — never the requester. KPI tiles up top track Open, Overdue, Answered and Closed.', tag:'new' },
    { n:'BizBuySell Settings', d:'Set the first-scan and ongoing look-back windows for the automatic inbox check.', tag:'admin' },
    { n:'Activity & Open Tracking', d:'See who&rsquo;s logged in, the full activity log, and how many times a sent email was opened by the recipient.', tag:'admin' },
    { n:'Data Reset & Backup', d:'Reset the book of business with a safety backup; permanent system companies are preserved.', tag:'admin' }
  ]}
];
function tagHtml(t){ if(!t) return ''; var lbl={new:'New',soon:'Soon',admin:'Admin'}[t]||t; return '<span class="tag '+t+'">'+esc(lbl)+'</span>'; }
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-'); }
function render(){
  var q=(document.getElementById('q').value||'').toLowerCase().trim();
  var total=0, shown=0, html='', jump='';
  SECTIONS.forEach(function(sec){
    var items=sec.items.filter(function(it){ total++; if(!q) return true; return ((it.n+' '+it.d).toLowerCase().indexOf(q)>=0)||(sec.name.toLowerCase().indexOf(q)>=0); });
    if(!items.length) return;
    shown+=items.length;
    jump+='<a href="#'+slug(sec.name)+'">'+esc(sec.name)+'</a>';
    html+='<div class="sec" id="'+slug(sec.name)+'"><div class="sech"><span class="swatch" style="background:'+sec.color+'"></span><h2>'+esc(sec.name)+'</h2><span class="sc">'+items.length+' feature'+(items.length===1?'':'s')+'</span></div><div class="grid">'
      +items.map(function(it){ return '<div class="fcard"><div class="fn">'+esc(it.n)+tagHtml(it.tag)+'</div><div class="fd">'+it.d+'</div></div>'; }).join('')
      +'</div></div>';
  });
  document.getElementById('jump').innerHTML=q?'':jump;
  document.getElementById('root').innerHTML=html||'<div class="noresult">No features match &ldquo;'+esc(q)+'&rdquo;.</div>';
  document.getElementById('count').textContent=(q?(shown+' of '+total):total)+' features';
}
render();
</script>
</body>
</html>
