<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRG — Confidential Information Memorandum</title>
<style>
:root{--navy:#0e1f3d;--brandnavy:#000E31;--red:#DA2B1F;--ink:#22272f;--muted:#5f6b7d;--soft:#8894a8;
  --line:#e3e6ec;--card:#f4f5f7;--cardline:#e6e9ef;--green:#1f8a5b;--wash:#f7f8fb;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#dfe3ea;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:13px;}
.serif{font-family:'Cambria','Palatino Linotype','Book Antiqua',Georgia,'Times New Roman',serif;}
.toolbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);}
.tb-inner{max-width:850px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.tt{font-weight:800;color:var(--brandnavy);font-size:14px;} .tt span{color:var(--muted);font-weight:500;font-size:12px;margin-left:6px;}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.btn{border:1px solid #cfd6e2;background:#fff;color:var(--brandnavy);font-weight:600;font-size:12.5px;padding:8px 13px;border-radius:8px;cursor:pointer;text-decoration:none;}
.btn:hover{border-color:#9fb0cc;} .btn.print{background:var(--brandnavy);color:#fff;border-color:var(--brandnavy);}
.btn.on{background:#eaf0ff;border-color:#9fb4e6;color:#2647b0;}
.viewnav{display:inline-flex;gap:6px;padding:3px 8px;border-left:1px solid var(--line);border-right:1px solid var(--line);margin:0 2px;}
.savechip{font-size:11px;color:var(--green);font-weight:700;opacity:0;transition:opacity .3s;} .savechip.show{opacity:1;}
#doc{max-width:850px;margin:20px auto;}
.page{background:#fff;width:850px;min-height:1100px;margin:0 auto 22px;padding:70px 78px 60px;position:relative;box-shadow:0 6px 26px rgba(10,20,50,.09);}
.page .pgfoot{position:absolute;left:78px;right:78px;bottom:30px;border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;font-size:9px;color:var(--soft);}
.page .pgfoot .cc{color:#a9b2c2;}
.ed:focus{outline:2px solid rgba(218,43,31,.35);outline-offset:2px;border-radius:3px;}
.kick{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;font-weight:700;color:var(--soft);margin-bottom:8px;}
.kick.red{color:var(--red);}
h1.title{font-size:40px;font-weight:600;color:var(--navy);margin:0 0 6px;letter-spacing:-.01em;line-height:1.05;}
h2.sect{font-size:29px;font-weight:600;color:var(--navy);margin:0 0 4px;letter-spacing:-.005em;line-height:1.1;}
.rule{border:none;border-top:1px solid var(--line);margin:12px 0 18px;}
.sub{font-size:15px;color:var(--muted);margin:0;}
p.body{font-size:12.5px;line-height:1.62;color:var(--ink);margin:0 0 12px;}
p.body.intro{font-size:13px;color:#333a44;}
.coverbar{border-top:2.5px solid var(--navy);padding-top:16px;}
.strip{display:grid;grid-template-columns:repeat(4,1fr);background:var(--navy);border-radius:2px;margin:20px 0;overflow:hidden;}
.strip .c{padding:15px 16px;text-align:center;border-right:1px solid rgba(255,255,255,.09);}
.strip .c:last-child{border-right:none;}
.strip .k{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#93a1bd;font-weight:700;}
.strip .v{font-weight:600;font-size:26px;color:#fff;margin-top:5px;line-height:1;}
.facts{text-align:center;font-size:12px;color:var(--muted);margin:6px 0 0;}
.logos{display:flex;gap:18px;justify-content:center;align-items:center;margin:26px 0 6px;flex-wrap:wrap;}
.logobox{min-width:150px;height:74px;border:1px dashed #cdd4df;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#9aa4b6;font-size:12px;font-weight:700;text-align:center;padding:6px 10px;background:#fafbfc;}
.logobox img{max-height:66px;max-width:220px;}
.coverfoot{margin-top:40px;}
.coverfoot .rr{border-top:1px solid var(--line);padding-top:14px;text-align:center;}
.coverfoot .rr b{font-size:14px;color:var(--navy);font-weight:700;}
.coverfoot .rr .ct{font-size:11px;color:var(--soft);margin-top:3px;}
.coverfoot .rr .cf{font-style:italic;font-size:10.5px;color:#9aa4b6;margin-top:5px;}
/* --- refreshed cover --- */
.rrglogo{width:212px;height:auto;display:block;margin:2px 0 20px;}
.coverbar2{border-top:2.5px solid var(--brandnavy);margin:0 0 15px;}
h1.title.cvr{font-weight:500;text-align:left;font-size:42px;letter-spacing:-.015em;}
.sub.cvr{text-align:left;margin-top:5px;font-size:15px;color:#4a5568;}
.coverfoot2{margin-top:46px;}
.coverfoot2 .rr{border-top:1px solid var(--line);padding-top:14px;text-align:left;}
.coverfoot2 .rr b{font-size:15px;color:var(--brandnavy);font-weight:800;letter-spacing:-.01em;}
.coverfoot2 .rr .tag{font-style:italic;font-size:11.5px;color:var(--muted);margin-top:2px;}
.coverfoot2 .rr .cities{font-size:11px;color:var(--soft);margin-top:6px;letter-spacing:.02em;}
.coverfoot2 .rr .conf{font-style:italic;font-size:10px;color:#a9b2c2;margin-top:6px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0;}
.cardx{background:var(--card);border:1px solid var(--cardline);border-radius:4px;padding:13px 15px;position:relative;}
.cardx .ct{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:4px;}
.cardx .cs{font-size:11px;line-height:1.5;color:var(--muted);}
table{width:100%;border-collapse:collapse;font-size:11.5px;margin:12px 0;}
thead th{background:var(--navy);color:#fff;font-weight:600;font-size:10.5px;padding:8px 10px;text-align:center;}
thead th:first-child{text-align:left;}
tbody td{padding:7px 10px;text-align:center;border-bottom:1px solid var(--line);}
tbody td:first-child{text-align:left;font-weight:700;color:var(--navy);}
tbody tr:nth-child(even){background:var(--wash);}
tbody tr.totrow td{font-weight:800;color:var(--navy);border-top:1.5px solid var(--navy);}
.tnote{font-size:10px;font-style:italic;color:var(--soft);margin:2px 0 0;line-height:1.4;}
.rk{margin:12px 0;} .rk .rh{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:2px;} .rk .rh .no{color:var(--red);font-weight:800;margin-right:8px;} .rk p{font-size:11.5px;line-height:1.55;color:var(--ink);margin:0;}
.toc{margin-top:8px;} .toc .row{display:flex;align-items:baseline;font-size:12.5px;color:var(--ink);padding:5px 0;} .toc .row .nm{white-space:nowrap;} .toc .row .dots{flex:1;border-bottom:1px dotted #c3ccdb;margin:0 6px;transform:translateY(-3px);} .toc .row .pg{font-weight:700;color:var(--navy);}
ul.plain{margin:8px 0;padding-left:0;list-style:none;} ul.plain li{font-size:12px;line-height:1.5;padding-left:16px;position:relative;margin-bottom:5px;color:var(--ink);} ul.plain li:before{content:"•";position:absolute;left:2px;color:var(--red);font-weight:700;}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;margin-top:14px;}
.photo .ph{height:180px;border-radius:4px;background:#eef1f6 center/cover no-repeat;border:1px solid var(--cardline);}
.photo .cap{font-size:10.5px;font-style:italic;color:var(--soft);text-align:center;margin-top:5px;}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;margin-top:14px;}
.gphoto{margin:0;break-inside:avoid;}
.gphoto .gph{height:252px;border-radius:4px;background:#eef1f6 center/cover no-repeat;border:1px solid var(--cardline);}
.gphoto figcaption{font-size:10.5px;font-style:italic;color:var(--soft);text-align:center;margin-top:6px;}
.callout{border:1px solid var(--cardline);border-left:4px solid var(--red);background:var(--wash);border-radius:0 6px 6px 0;padding:14px 16px;margin:14px 0;}
.callout .ct{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:3px;} .callout .cb{font-size:11.5px;line-height:1.55;color:var(--ink);}
.quote{border-left:4px solid var(--red);background:var(--wash);padding:13px 16px;margin:6px 0 16px;} .quote .q{font-style:italic;font-size:15px;color:var(--navy);} .quote .a{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:700;margin-top:6px;}
body.editing .ed:hover{background:rgba(120,150,220,.10);border-radius:3px;}
.loading{max-width:850px;margin:60px auto;text-align:center;color:var(--muted);font-size:14px;}
.emails-panel{max-width:850px;margin:22px auto 90px;padding:0 22px;}
.emails-panel .ehead{font-family:'Georgia',serif;font-size:22px;font-weight:700;color:var(--navy);margin:6px 0 3px;}
.emails-panel .esubhead{font-size:12.5px;color:var(--muted);margin-bottom:18px;line-height:1.5;}
.emailcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:13px;box-shadow:0 4px 16px rgba(10,20,50,.05);}
.emailcard .et{font-weight:800;color:var(--navy);font-size:14px;margin:0;}
.emailcard .ed2{font-size:11.5px;color:var(--muted);margin:2px 0 9px;line-height:1.45;}
.emailcard .esub{font-size:12.5px;color:var(--ink);margin-bottom:7px;}
.emailcard .esub b{color:var(--soft);font-weight:700;}
.emailcard .ebody{white-space:pre-wrap;font-size:12.5px;line-height:1.55;color:#33405c;border-top:1px dashed var(--line);padding-top:9px;}
.emailcard .ecopy{float:right;border:1px solid var(--line);background:#f5f7fb;border-radius:7px;padding:5px 13px;font:inherit;font-size:12px;font-weight:800;color:var(--navy);cursor:pointer;}
.emailcard .ecopy:hover{background:#eef2fb;border-color:#c9d3e6;}
@media print{
  @page{size:Letter;margin:0.5in 0.55in;}
  html,body{background:#fff;}
  .toolbar,.rrg-back,.savechip,.emails-panel{display:none!important;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  #doc{max-width:none;margin:0;}
  .page{width:auto;min-height:9.9in;margin:0;padding:0 0 0.35in;box-shadow:none;break-after:page;position:relative;}
  .page:last-child{break-after:auto;}
  .ed:focus{outline:none;} body.editing .ed,body.editing .ed:hover{background:none;}
  .grid,.strip,table,.rk,.photos,.callout,.cardx{break-inside:avoid;}
  /* emails-only print mode (Download → Emails PDF) */
  body.pmail #doc{display:none!important;}
  body.pmail #emails{display:block!important;max-width:none;margin:0;padding:0;}
  body.pmail #emails .ecopy{display:none!important;}
  body.pmail #emails .emailcard{box-shadow:none;border:1px solid #d7dce6;break-inside:avoid;}
  body.pmail #emails .ehead{font-size:20px;}
}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body class="editing">
<!--rrgback--><a href="./rrg_cim_queue.html" class="rrg-back" aria-label="Back to Marketing Packs" style="position:fixed;left:16px;bottom:16px;z-index:99999;display:inline-flex;align-items:center;gap:7px;background:rgba(0,14,49,.85);color:#fff;text-decoration:none;font:700 12.5px/1 -apple-system,Arial,sans-serif;padding:10px 15px;border-radius:100px;border:1px solid rgba(255,255,255,.22)"><span>←</span> Marketing Packs</a>
<div class="toolbar"><div class="tb-inner">
  <div class="tt">RRG Confidential Information Memorandum <span>Edit in place · Print</span></div>
  <div class="actions">
    <span class="savechip" id="savechip">Saved ✓</span>
    <button class="btn on" id="editBtn" onclick="toggleEdit()">Editing: On</button>
    <span class="viewnav">
      <button class="btn on" id="viewDocBtn" onclick="showView('doc')">CIM</button>
      <button class="btn" id="viewEmailsBtn" onclick="showView('emails')">Emails</button>
      <button class="btn" id="viewLeaseBtn" onclick="showView('lease')">Lease Abstract</button>

    <button class="btn print" onclick="window.print()">Print</button>
  </div>
</div></div>
<div id="doc"><div class="loading">Loading the memorandum…</div></div>
<div id="emails" class="emails-panel" style="display:none"></div>
<div id="leaseview" class="emails-panel" style="display:none"></div>
<script>
var CID=(new URLSearchParams(location.search)).get('cim')||'';
var CIM=null;
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function num(s){return Number(String(s==null?'':s).replace(/[^0-9.\-]/g,''))||0;}
function money(n){return '$'+Math.round(n).toLocaleString('en-US');}
function getPath(o,p){ return p.split('.').reduce(function(a,k){ return (a==null)?a:a[k]; }, o); }
function setPath(o,p,v){ var ks=p.split('.'); var a=o; for(var i=0;i<ks.length-1;i++){ if(a[ks[i]]==null) a[ks[i]]={}; a=a[ks[i]]; } a[ks[ks.length-1]]=v; }
// editable element bound to a state path
function ed(tag,cls,path,text){ return '<'+tag+' class="ed '+cls+'" contenteditable data-k="'+esc(path)+'">'+esc(text||'')+'</'+tag+'>'; }
function foot(pg){ return '<div class="pgfoot"><span>Prepared by Restaurant Realty Group, LLC · Strictly Confidential · Do Not Circulate</span><span class="cc">Page '+pg+'</span></div>'; }

function rrgLogoSVG(){
  return '<svg class="rrglogo" viewBox="0 0 600 212" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Restaurant Realty Group">'
    +'<circle cx="106" cy="106" r="96" fill="#DA2B1F"/>'
    +'<text x="106" y="108" text-anchor="middle" dominant-baseline="central" font-family="Arial Black, Arial Narrow, Arial, sans-serif" font-weight="900" font-size="62" letter-spacing="-2" fill="#ffffff">RRG</text>'
    +'<rect x="232" y="22" width="7" height="168" fill="#000E31"/>'
    +'<g font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="45" letter-spacing="0.5" fill="#000E31">'
    +'<text x="266" y="70">RESTAURANT</text>'
    +'<text x="266" y="123">REALTY</text>'
    +'<text x="266" y="176">GROUP</text>'
    +'</g></svg>';
}
function renderCim(s){
  var c=s.cover||{}, biz=(c.title||CIM.business||'The Company');
  var stats=(c.stats||[]).slice(0,4);
  var logoHtml = (s.logo&&s.logo.dataB64) ? '<div class="logos"><div class="logobox" style="border:none;background:none"><img src="data:'+esc(s.logo.type||'image/png')+';base64,'+s.logo.dataB64+'"></div></div>' : '';
  var out='';
  var pg=1;

  // COVER
  out+='<div class="page">'
    +rrgLogoSVG()
    +'<div class="coverbar2"></div>'
    +'<div class="kick">Confidential Information Memorandum</div>'
    +'<h1 class="title cvr ed" data-k="cover.title" contenteditable>'+esc(biz)+'</h1>'
    +ed('div','sub cvr','cover.tagline',c.tagline||'')
    +logoHtml
    +'<div class="strip">'+stats.map(function(st){ return '<div class="c"><div class="k ed" contenteditable data-k="__stk">'+esc(st.k||'')+'</div><div class="v ed" contenteditable data-k="__stv">'+esc(st.v||'')+'</div></div>'; }).join('')+'</div>'
    +'<div class="facts ed" contenteditable data-k="cover.foundingLine">'+esc(c.foundingLine||'')+'</div>'
    +'<div class="coverfoot2"><div class="rr">'
    +'<b>Restaurant Realty Group, LLC</b>'
    +'<div class="tag">The Restaurant Sales and Leasing Experts</div>'
    +'<div class="cities">Van Rinn, President &amp; Founder · 210-362-0678 · van@rrgcre.com &nbsp;|&nbsp; Avery Rinn, Associate · 210-204-2471 · avery@rrgcre.com</div>'
    +'<div class="conf">This document is strictly confidential and intended solely for the named recipient. Do not copy, circulate, or distribute. Delivered under an executed NDA. © Restaurant Realty Group, LLC.</div>'
    +'</div></div>'
    +'</div>';

  // CONFIDENTIALITY
  out+='<div class="page"><div class="kick red">Legal Notices</div><h2 class="sect serif">Confidentiality &amp; Disclaimer</h2><hr class="rule">'
    +'<p class="body">This Confidential Information Memorandum (this &ldquo;Memorandum&rdquo;) has been prepared by Restaurant Realty Group, LLC (&ldquo;RRG&rdquo; or &ldquo;Advisor&rdquo;) on behalf of the ownership of '+esc(biz)+' (the &ldquo;Company&rdquo;) solely to provide certain preliminary information to qualified prospective purchasers evaluating a potential acquisition of the Company.</p>'
    +'<p class="body">This Memorandum is furnished on a strictly confidential basis. By accepting it, the recipient agrees to treat all information contained herein as confidential and proprietary, and not to reproduce, distribute, or disclose it, in whole or in part, without the prior written consent of RRG and ownership.</p>'
    +'<p class="body"><b>No Warranty.</b> The information has been prepared by RRG based upon information supplied by the Company’s ownership and management and has not been independently verified. No representation or warranty, express or implied, is made as to its accuracy or completeness, and nothing herein shall be relied upon as a promise or representation as to future performance.</p>'
    +'<p class="body"><b>Financial Information.</b> Historical figures are management-basis, unaudited, and unreviewed. Adjusted-earnings figures reflect normalizing adjustments identified by ownership and its advisor and are subject to verification by any prospective purchaser during due diligence.</p>'
    +'<p class="body"><b>No Offer.</b> This Memorandum does not constitute an offer to sell or a solicitation of an offer to buy any security or asset. Any transaction will be subject to definitive documentation. Ownership reserves the right, in its sole discretion, to reject any or all proposals and to modify or terminate the process at any time.</p>'
    +'<div class="callout"><div class="ct">Direct all inquiries to Restaurant Realty Group</div><div class="cb">Prospective purchasers should not contact the Company, its ownership, management, employees, guests, landlords, or vendors directly. All communication is to be conducted exclusively through RRG.</div></div>'
    +foot(++pg)+'</div>';

  // TABLE OF CONTENTS
  var toc=[['Confidentiality & Disclaimer',2],['Executive Summary',4],['The Company Story',5],['Concept, Menu & Craft',6],['Property Gallery',7],['Market & Industry Overview',8],['Financial Overview',9],['Value-Creation Opportunities',10],['Risk Factors & Considerations',11],['Transaction Overview',12],['Due Diligence Process',13]];
  out+='<div class="page"><div class="kick red">Contents</div><h2 class="sect serif">Table of Contents</h2><hr class="rule"><div class="toc">'
    +toc.map(function(r){ return '<div class="row"><span class="nm">'+esc(r[0])+'</span><span class="dots"></span><span class="pg">'+r[1]+'</span></div>'; }).join('')
    +'</div>'+foot(++pg)+'</div>';

  // EXECUTIVE SUMMARY
  var ex=s.execSummary||{};
  out+='<div class="page"><div class="kick red">The Opportunity</div><h2 class="sect serif">Executive Summary</h2><hr class="rule">';
  if(ex.quote) out+='<div class="quote">'+ed('div','q','execSummary.quote',ex.quote)+ed('div','a','execSummary.quoteBy',ex.quoteBy||'')+'</div>';
  out+=ed('p','body intro','execSummary.para1',ex.para1||'')+ed('p','body','execSummary.para2',ex.para2||'');
  out+='<h3 style="font-size:14px;color:var(--navy);margin:14px 0 6px">Investment Highlights</h3><div class="grid">'
    +(ex.highlights||[]).slice(0,6).map(function(h,i){ return '<div class="cardx">'+ed('div','ct','execSummary.highlights.'+i+'.title',h.title||'')+ed('div','cs','execSummary.highlights.'+i+'.body',h.body||'')+'</div>'; }).join('')
    +'</div>'+foot(++pg)+'</div>';

  // STORY
  var st=s.story||{};
  out+='<div class="page"><div class="kick red">Company History</div><h2 class="sect serif">The '+esc(biz)+' Story</h2><hr class="rule">'
    +(st.paras||[]).map(function(p,i){ return ed('p','body','story.paras.'+i,p); }).join('');
  if(st.calloutTitle||st.calloutBody) out+='<div class="callout">'+ed('div','ct','story.calloutTitle',st.calloutTitle||'')+ed('div','cb','story.calloutBody',st.calloutBody||'')+'</div>';
  out+=foot(++pg)+'</div>';

  // CONCEPT + PHOTOS
  var co=s.concept||{};
  out+='<div class="page"><div class="kick red">The Product</div><h2 class="sect serif">Concept, Menu &amp; Craft</h2><hr class="rule">'
    +ed('p','body intro','concept.intro',co.intro||'')
    +'<h3 style="font-size:14px;color:var(--navy);margin:12px 0 4px">Signature Equity</h3><ul class="plain">'
    +(co.signature||[]).map(function(sg,i){ return '<li><b class="ed" contenteditable data-k="concept.signature.'+i+'.name">'+esc(sg.name||'')+'</b> <span class="ed" contenteditable data-k="concept.signature.'+i+'.desc">'+esc(sg.desc||'')+'</span></li>'; }).join('')
    +'</ul>';
  if(co.closing) out+=ed('p','body','concept.closing',co.closing).replace('class="ed','style="font-style:italic;color:var(--muted)" class="ed');
  out+=foot(++pg)+'</div>';

  // PROPERTY GALLERY — every CIM carries a dedicated photo page; up to two pages when there are many photos.
  var photos=(s.photos||[]).filter(function(p){return p&&p.dataB64;});
  var GPER=6, gpages=Math.max(1, Math.min(2, Math.ceil(photos.length/GPER)));
  for(var gp=0; gp<gpages; gp++){
    var slice=photos.slice(gp*GPER, gp*GPER+GPER);
    var title='Property Gallery'+(gpages>1?(' <span style="font-size:16px;color:var(--muted);font-weight:400">— '+(gp+1)+' of '+gpages+'</span>'):'');
    out+='<div class="page"><div class="kick red">A Look Inside</div><h2 class="sect serif">'+title+'</h2><hr class="rule">';
    if(slice.length){
      out+='<div class="gallery">'+slice.map(function(p,i){ var idx=gp*GPER+i; return '<figure class="gphoto"><div class="gph" style="background-image:url(data:'+esc(p.type||'image/jpeg')+';base64,'+p.dataB64+')"></div><figcaption class="ed" contenteditable data-k="photos.'+idx+'.caption">'+esc(p.caption||'')+'</figcaption></figure>'; }).join('')+'</div>';
    } else {
      out+='<p class="body" style="color:var(--muted);font-style:italic">Add property, interior, and food photography on the build screen — every Marketing Pack should include a gallery page.</p>';
    }
    out+=foot(++pg)+'</div>';
  }

  // MARKET
  var mk=s.market||{};
  out+='<div class="page"><div class="kick red">Why This Market, Why Now</div><h2 class="sect serif">Market &amp; Industry Overview</h2><hr class="rule">'
    +ed('p','body','market.para1',mk.para1||'')+ed('p','body','market.para2',mk.para2||'')
    +'<div class="grid">'+(mk.cards||[]).slice(0,4).map(function(cd,i){ return '<div class="cardx">'+ed('div','ct','market.cards.'+i+'.title',cd.title||'')+ed('div','cs','market.cards.'+i+'.body',cd.body||'')+'</div>'; }).join('')+'</div>'
    +foot(++pg)+'</div>';

  // FINANCIAL (figures from the BOV)
  var fi=s.financial||{}, bov=s.bov||{}, sum=(bov.summary)||{}, br=(bov.bridge)||{};
  out+='<div class="page"><div class="kick red">Performance &amp; Earnings</div><h2 class="sect serif">Financial Overview</h2><hr class="rule">'
    +ed('p','body intro','financial.intro',fi.intro||'');
  // snapshot table from the BOV
  var rev=num(br.revenue), ni=num(br.netIncome);
  var ebitda=ni+num(br.interest)+num(br.entityTax)+num(br.depreciation)+num(br.amortization);
  var sde=ebitda+num(br.ownerSalary)+num(br.ownerHealth)+num(br.familyPayroll)+num(br.oneTime)+num(br.rentNorm);
  var adj=sde-num(br.marketGM);
  out+='<h3 style="font-size:14px;color:var(--navy);margin:12px 0 4px">Trailing-Twelve-Month Snapshot</h3>'
    +'<table><thead><tr><th>Measure</th><th>TTM</th></tr></thead><tbody>'
    +(rev?'<tr><td>Revenue (TTM)</td><td>'+money(rev)+'</td></tr>':'')
    +(ni?'<tr><td>Net income (as reported)</td><td>'+money(ni)+'</td></tr>':'')
    +(sde?'<tr class="totrow"><td>Seller’s Discretionary Earnings (SDE)</td><td>'+money(sde)+'</td></tr>':'')
    +(adj?'<tr><td>Adjusted EBITDA</td><td>'+money(adj)+'</td></tr>':'')
    +'</tbody></table>'
    +'<p class="tnote">Figures are management-basis, unaudited, drawn from the RRG valuation; they match the concluded Broker’s Opinion of Value and are subject to a buyer’s quality-of-earnings review.</p>'
    +ed('p','body','financial.revenueNote',fi.revenueNote||'')
    +ed('p','body','financial.bridgeNote',fi.bridgeNote||'');
  if(fi.callout1Title||fi.callout1Body) out+='<div class="callout">'+ed('div','ct','financial.callout1Title',fi.callout1Title||'')+ed('div','cb','financial.callout1Body',fi.callout1Body||'')+'</div>';
  out+=foot(++pg)+'</div>';

  // VALUE-CREATION
  var vl=s.value||{};
  out+='<div class="page"><div class="kick red">The Path Forward</div><h2 class="sect serif">Value-Creation Opportunities</h2><hr class="rule">'
    +ed('p','body intro','value.intro',vl.intro||'')
    +'<div class="grid">'+(vl.cards||[]).map(function(cd,i){ return '<div class="cardx">'+ed('div','ct','value.cards.'+i+'.title',cd.title||'')+ed('div','cs','value.cards.'+i+'.body',cd.body||'')+'</div>'; }).join('')+'</div>';
  if(vl.calloutTitle||vl.calloutBody) out+='<div class="callout">'+ed('div','ct','value.calloutTitle',vl.calloutTitle||'')+ed('div','cb','value.calloutBody',vl.calloutBody||'')+'</div>';
  out+=foot(++pg)+'</div>';

  // RISKS
  out+='<div class="page"><div class="kick red">Full Transparency</div><h2 class="sect serif">Risk Factors &amp; Considerations</h2><hr class="rule">'
    +(s.risks||[]).map(function(rk,i){ var no=('0'+(i+1)).slice(-2); return '<div class="rk"><div class="rh"><span class="no">'+no+'</span><span class="ed" contenteditable data-k="risks.'+i+'.title">'+esc(rk.title||'')+'</span></div>'+ed('p','','risks.'+i+'.body',rk.body||'')+'</div>'; }).join('')
    +foot(++pg)+'</div>';

  // TRANSACTION + DUE DILIGENCE
  var tx=s.transaction||{}, dd=s.dueDiligence||{};
  out+='<div class="page"><div class="kick red">The Process</div><h2 class="sect serif">Transaction Overview</h2><hr class="rule">'
    +ed('p','body','transaction.intro',tx.intro||'')+ed('p','body','transaction.process',tx.process||'')
    +'<h2 class="sect serif" style="margin-top:26px">Due Diligence Process</h2><hr class="rule">'
    +ed('p','body','dueDiligence.intro',dd.intro||'')
    +foot(++pg)+'</div>';

  document.getElementById('doc').innerHTML=out;
  wireEdits();
}

var _saveT=null;
function wireEdits(){
  document.querySelectorAll('#doc [data-k]').forEach(function(el){
    el.addEventListener('input',function(){
      var k=el.getAttribute('data-k'); if(k==='__stv'||k==='__stk') return saveStats();
      setPath(CIM.state, k, el.innerText); queueSave();
    });
  });
}
function saveStats(){
  var cells=document.querySelectorAll('#doc .strip .c');
  var stats=[]; cells.forEach(function(c){ stats.push({ v:(c.querySelector('[data-k="__stv"]')||{}).innerText||'', k:(c.querySelector('[data-k="__stk"]')||{}).innerText||'' }); });
  if(CIM.state.cover) CIM.state.cover.stats=stats; queueSave();
}
function queueSave(){ var chip=document.getElementById('savechip'); if(_saveT) clearTimeout(_saveT); _saveT=setTimeout(function(){
  var lite=Object.assign({},CIM.state); delete lite.photos; delete lite.logo; delete lite.bov;  // don't re-send heavy data
  fetch('/api/cim-save',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({id:CID,state:lite})})
    .then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ chip.classList.add('show'); setTimeout(function(){chip.classList.remove('show');},1400); } }).catch(function(){});
}, 700); }
function toggleEdit(){ var on=document.body.classList.toggle('editing'); var b=document.getElementById('editBtn'); b.textContent='Editing: '+(on?'On':'Off'); b.classList.toggle('on',on); document.querySelectorAll('#doc [contenteditable]').forEach(function(el){ el.setAttribute('contenteditable', on?'true':'false'); }); }

// ---- Marketing Emails: the confidential-sale sequence, filled with this deal ----
function showView(v){
  var doc=document.getElementById('doc'), em=document.getElementById('emails'), lv=document.getElementById('leaseview');
  doc.style.display=v==='doc'?'block':'none'; em.style.display=v==='emails'?'block':'none'; lv.style.display=v==='lease'?'block':'none';
  document.getElementById('viewDocBtn').classList.toggle('on',v==='doc');
  document.getElementById('viewEmailsBtn').classList.toggle('on',v==='emails');
  document.getElementById('viewLeaseBtn').classList.toggle('on',v==='lease');
  var eb=document.getElementById('editBtn'); if(eb) eb.style.display=v==='doc'?'':'none';   // Editing applies to the CIM only
  if(v==='lease') loadLeaseView();
  window.scrollTo(0,0);
}
function fmtDate(iso){ try{ var d=new Date(iso); if(isNaN(d.getTime())) return ''; return (d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(2); }catch(e){ return ''; } }
// Auto-print a single piece as its own PDF (opened from the Download chooser on the Marketing Packs log).
function maybePrint(){
  var p=(new URLSearchParams(location.search)).get('print');
  if(p==='cim'){ showView('doc'); setTimeout(function(){ window.print(); }, 400); }
  else if(p==='emails'){ showView('emails'); document.body.classList.add('pmail'); setTimeout(function(){ window.print(); }, 400); }
}
function loadLeaseView(){
  var lv=document.getElementById('leaseview');
  lv.innerHTML=leaseHead()+'<div class="sub2" style="color:#5f6b7d;padding:4px 2px">Loading…</div>';
  fetch('/api/cim/'+encodeURIComponent(CID)+'/lease',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){
    if(!j||!j.ok){ lv.querySelector('.sub2').textContent='Could not load the lease abstract.'; return; }
    renderLeaseView(j.lease);
  }).catch(function(){ var s=lv.querySelector('.sub2'); if(s) s.textContent='Could not reach the server.'; });
}
function leaseHead(){ return '<div class="ehead">Lease Abstract</div><div class="esubhead">The lease summary that rides with this deal — term, rent, options, NNN, assignment, and guaranty. Landlord and tenant are redacted by default so it’s safe to share with buyers.</div>'; }
function renderLeaseView(l){
  var lv=document.getElementById('leaseview');
  if(!l){
    lv.innerHTML=leaseHead()+'<div class="emailcard"><div class="et">No lease abstract in this pack yet</div><div class="ed2">Add the lease and the analyst pulls the terms into a clean, buyer-safe abstract tied to this deal.</div><button class="ecopy" style="float:none;margin-top:10px" onclick="addLease(this)">+ Add a lease abstract →</button></div>';
    return;
  }
  var when=l.pending?('Started '+fmtDate(l.createdAt)):('Abstracted'+(l.builtAt?(' '+fmtDate(l.builtAt)):''));
  var rd=[]; if(l.redactLandlord) rd.push('Landlord'); if(l.redactTenant) rd.push('Tenant');
  var redline=l.pending?'':('<div class="esub"><b>Redaction:</b> '+(rd.length?(rd.join(' & ')+' withheld for buyer copies'):'None — full names shown')+'</div>');
  var meta=[esc(l.propertyAddress||''),when].filter(Boolean).join(' · ');
  var action=l.pending
    ? '<a class="ecopy" style="float:none;text-decoration:none;display:inline-block;margin-top:10px" href="./rrg_lease_generate.html?lease='+encodeURIComponent(l.id)+'">Build it →</a>'
    : '<a class="ecopy" style="float:none;text-decoration:none;display:inline-block;margin-top:10px" href="./rrg_lease_abstract.html?lease='+encodeURIComponent(l.id)+'">Open lease abstract →</a>';
  lv.innerHTML=leaseHead()+'<div class="emailcard"><div class="et">'+esc(l.business||'Lease Abstract')+'</div><div class="ed2">'+meta+'</div>'+redline+action+'</div>';
}
function addLease(btn){
  if(btn){ btn.disabled=true; btn.textContent='…'; }
  fetch('/api/cim/'+encodeURIComponent(CID)+'/lease/new',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:'{}'})
    .then(function(r){return r.json();}).then(function(j){ if(j&&j.ok&&j.id){ location.href='./rrg_lease_generate.html?lease='+encodeURIComponent(j.id); } else { if(btn){btn.disabled=false;btn.textContent='+ Add a lease abstract →';} alert((j&&j.error)||'Could not start.'); } })
    .catch(function(){ if(btn){btn.disabled=false;btn.textContent='+ Add a lease abstract →';} alert('Could not reach the server.'); });
}
function dealFields(s){ s=s||{}; var biz=(s.cover&&s.cover.title)||(CIM&&CIM.business)||'the business';
  var br=(s.bov&&s.bov.bridge)||{}; var rev=num(br.revenue), ni=num(br.netIncome);
  var ebitda=ni+num(br.interest)+num(br.entityTax)+num(br.depreciation)+num(br.amortization);
  var sde=ebitda+num(br.ownerSalary)+num(br.ownerHealth)+num(br.familyPayroll)+num(br.oneTime)+num(br.rentNorm);
  return { biz:biz, rev:(rev?money(rev):'[[$Revenue]]'), sde:(sde?money(sde):'[[$SDE]]') }; }
function emailSet(f){ var B=f.biz, R=f.rev, S=f.sde; return [
  { t:'1. Teaser (Blind Profile)', d:'To your buyer list. No name or address — its only job is to earn a reply and an NDA.',
    subj:'New [[City]] [[Concept]] Opportunity — '+R+' Revenue, Priced to Move',
    body:'[First Name],\n\nWe’ve just been retained on a confidential sale that fits what you’ve told me you’re looking for.\n\n• Concept: Established [[concept]], [[years]] years operating\n• Location: [[submarket / trade area]]\n• Revenue (TTM): '+R+'\n• Seller’s Discretionary Earnings: '+S+'\n• Asking / Guidance: [[$Price or “Call for offers”]]\n• Why it’s compelling: [[one sharp line]]\n\nThe business, address, and financials are confidential and released only under NDA to qualified buyers. Reply here and I’ll send our short qualifier and the confidentiality agreement — this one won’t sit long.\n\n[Your Name]\nRestaurant Realty Group · [[phone]]' },
  { t:'2. Buyer Qualifier', d:'Before you release anything, the buyer earns it. Screens out tire-kickers and competitors.',
    subj:'Re: '+B+' Opportunity — Quick Qualification Before I Release Details',
    body:'[First Name],\n\nGlad you’re interested. To protect our seller’s confidentiality, I qualify every buyer before releasing the business name or financials. Quick and painless — just reply with:\n\n1. Funding: How is a purchase in this range being funded — cash, SBA, investor group? Proof of funds or a lender pre-qual is ideal.\n2. Experience: Your background in restaurants/hospitality or operating a business.\n3. Timeline: How soon are you looking to acquire?\n4. Role: Are you the principal buyer, or representing one?\n\nOnce I have that, I’ll send the confidentiality agreement and, on signature, the full package.\n\n[Your Name]\nRestaurant Realty Group' },
  { t:'3. Send NDA', d:'Deliver the confidentiality agreement. Nothing confidential goes out until it’s signed.',
    subj:B+' — Confidentiality Agreement to Review & Sign',
    body:'[First Name],\n\nThanks — you’re qualified. Here’s our confidentiality agreement: [[e-sign link]].\n\nPlease review and sign, and the moment it’s executed I’ll release the Confidential Information Memorandum with the business name, financials, and full details.\n\nOne important note the agreement covers: do not contact the business, its staff, ownership, landlord, or vendors directly. The sale is strictly confidential and the employees are not aware. All communication runs through me.\n\n[Your Name]\nRestaurant Realty Group' },
  { t:'4. Send CIM', d:'The reveal. NDA is executed — deliver the CIM and point straight to the next step.',
    subj:B+' — Confidential Information Memorandum (Under NDA)',
    body:'[First Name],\n\nNDA received — thank you. Attached is the Confidential Information Memorandum for '+B+'.\n\nInside: the concept and its market position, historical and trailing-twelve-month financials, the earnings bridge to Seller’s Discretionary Earnings, growth opportunities, and the transaction structure. A few highlights:\n\n• Revenue (TTM): '+R+'\n• SDE: '+S+'\n• The upside: [[value-creation headline]]\n\nTake it in, then let’s get you on a call this week while your questions are fresh. If we move to offers, I’ll want your interest confirmed by [[date]].\n\n[Your Name]\nRestaurant Realty Group · [[phone]]' },
  { t:'5. Data Room Access', d:'For serious buyers who want to verify. Grant access, set expectations, keep control.',
    subj:B+' — Data Room Access',
    body:'[First Name],\n\nAs requested, you now have access to the secure data room for '+B+': [[link]].\n\nYou’ll find P&Ls and tax returns, the current lease, the equipment list, and supporting documents for your diligence. Access is logged and remains subject to the NDA you signed.\n\nKeep questions coming to me directly — I’ll get answers from ownership. As a reminder, no direct contact with the business, staff, or landlord. If you like what you see, the next step is a call with ownership and, when you’re ready, a written offer.\n\n[Your Name]\nRestaurant Realty Group' },
  { t:'6. Talk to Owner (Call / Site Visit)', d:'Coordinate the buyer-seller call or a discreet after-hours walkthrough.',
    subj:B+' — Scheduling Your Time with Ownership',
    body:'[First Name],\n\nLet’s get you in front of ownership. I can set up a call or a discreet after-hours site visit — the staff are not aware of the sale, so any visit is scheduled around them or as a normal guest.\n\nSend me two or three windows over the next several days and I’ll lock it in. Come with your real questions — operations, staffing, the lease, suppliers, why they’re selling. This is where serious buyers separate themselves.\n\nTalk soon,\n[Your Name]\nRestaurant Realty Group · [[phone]]' },
  { t:'7. Call for Offers / LOI Request', d:'The one that makes you money. A deadline creates competition; without it, buyers sit.',
    subj:B+' — Offers Due [[Date]]',
    body:'[First Name],\n\nWe’ve had strong interest in '+B+', and ownership has asked me to call for offers.\n\nLetters of Intent are due [[date, time]]. To be considered, your LOI should include:\n\n• Purchase price and structure (asset vs. entity, cash/SBA/seller note)\n• Proposed deposit and diligence period\n• Any contingencies (financing, lease assignment, licensing)\n• Proof of funds or lender pre-qualification\n\nHappy to review a draft before you submit. If you need anything to firm up your number, tell me now while there’s still time.\n\n[Your Name]\nRestaurant Realty Group · [[phone]]' },
  { t:'8. Buyer Follow-Up / Nudge', d:'For buyers sitting on the CIM. Honest pressure so nothing goes cold.',
    subj:B+' — Where do you stand?',
    body:'[First Name],\n\nChecking in on '+B+'. Interest has been strong and we’re moving toward offers.\n\nAre you still in? If yes, let’s get your remaining questions answered and, if it helps, another call with ownership before you commit to a number. If the fit isn’t there, no problem — just let me know so I can manage the process.\n\n[Your Name]' },
  { t:'9. Landlord / Lease-Assignment', d:'Restaurant-critical. The lease can make or break the deal — get ahead of it.',
    subj:B+' — Lease Assignment / Landlord Coordination',
    body:'[First Name / Landlord Contact],\n\nI’m representing ownership of '+B+' at [[address]] in a confidential sale and want to get ahead of the lease assignment.\n\nCould you send the current lease terms, the assignment provisions and any transfer fee, and what the landlord will want from a qualified replacement tenant (financials, experience, personal guaranty)? Lining this up early keeps a clean deal from stalling at the finish line.\n\n[Your Name]\nRestaurant Realty Group' },
  { t:'10. Seller Activity Update', d:'Keep your client informed. Best practice — it retains clients and earns the decisions you’ll need.',
    subj:B+' — Marketing Update',
    body:'[First Name],\n\nQuick update on '+B+':\n\n• Teasers out to [[#]] buyers on our list\n• [[#]] NDAs signed, [[#]] CIMs released\n• [[#]] buyer calls / site visits completed\n• Offers targeted for [[date]]\n\n[[One line of read: momentum, feedback themes, or a recommendation.]]\n\nI’ll have the next update to you by [[date]]. Call me anytime.\n\n[Your Name]' },
  { t:'11. Decline / Keep-Warm', d:'Never burn a qualified buyer. Today’s runner-up is tomorrow’s backup.',
    subj:B+' — Update',
    body:'[First Name],\n\nThank you for your interest in '+B+'. Ownership has moved forward with another buyer at this stage.\n\nDeals don’t always close, so I’d like to keep you as a backup if that’s alright — and I’ve got other [[concept]] opportunities coming. Tell me what you’re hunting for and I’ll keep you first in line.\n\n[Your Name]\nRestaurant Realty Group' }
]; }
function buildEmails(s){
  var f=dealFields(s), list=emailSet(f), em=document.getElementById('emails');
  var html='<div class="ehead">Marketing Emails — '+esc(f.biz)+'</div><div class="esubhead">The confidential-sale sequence for this deal, with the business name and figures filled in. Copy each into Copper or your email. Bracketed [[…]] values are the few deal specifics to drop in (city, concept, price, dates, your name).</div>';
  html+=list.map(function(e){ return '<div class="emailcard"><button class="ecopy">Copy</button><div class="et">'+esc(e.t)+'</div><div class="ed2">'+esc(e.d)+'</div><div class="esub"><b>Subject:</b> '+esc(e.subj)+'</div><div class="ebody">'+esc(e.body)+'</div></div>'; }).join('');
  em.innerHTML=html;
  var cards=em.querySelectorAll('.emailcard');
  [].slice.call(cards).forEach(function(card,i){ var btn=card.querySelector('.ecopy'); btn.onclick=function(){ var e=list[i]; copyText('Subject: '+e.subj+'\n\n'+e.body, btn); }; });
}
function copyText(txt, btn){
  function ok(){ var o=btn.textContent; btn.textContent='Copied ✓'; setTimeout(function(){ btn.textContent=o; },1400); }
  function fallback(){ var ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); ok(); }catch(e){} document.body.removeChild(ta); }
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok).catch(fallback); } else fallback(); }catch(e){ fallback(); }
}

if(CID){
  fetch('/api/cim/'+encodeURIComponent(CID),{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){
    if(j&&j.ok&&j.cim){ CIM=j.cim; if(CIM.state&&CIM.state.cover){ renderCim(CIM.state); buildEmails(CIM.state); maybePrint(); } else { document.getElementById('doc').innerHTML='<div class="loading">This Marketing Pack’s CIM hasn’t been built yet. Open it from Marketing Packs and press Build. You can still add a Lease Abstract to the pack from the tab above.</div>'; document.getElementById('viewEmailsBtn').style.display='none'; } }
    else { document.getElementById('doc').innerHTML='<div class="loading">Could not load this Marketing Pack.</div>'; }
  }).catch(function(){ document.getElementById('doc').innerHTML='<div class="loading">Could not reach the server.</div>'; });
} else { document.getElementById('doc').innerHTML='<div class="loading">No Marketing Pack selected. Open one from Marketing Packs.</div>'; }
</script>
