<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRG — Space</title>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--ink:#1a2236;--muted:#6b7488;--soft:#8a93a8;--line:#e6e9f0;--wash:#f5f7fb;--green:#1f8a5b;--gold:#b5791f;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#eef1f6;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.wrap{max-width:1280px;margin:0 auto;padding:22px 24px 48px;}
.kick{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red);}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
.hd h1{margin:3px 0 0;font-size:24px;font-weight:800;color:var(--navy);letter-spacing:-.01em;}
.hd .sub{color:var(--muted);font-size:13px;margin-top:4px;}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.pill{font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.spacts{display:flex;gap:8px;flex-wrap:wrap;}
.btn{font:inherit;font-size:12.5px;font-weight:700;border:1px solid #cfd6e2;background:#fff;color:var(--navy);border-radius:8px;padding:8px 13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{border-color:#9fb0cc;} .btn.pri{background:var(--navy);color:#fff;border-color:var(--navy);} .btn.sm{padding:5px 10px;font-size:12px;} .btn[disabled]{opacity:.55;cursor:default;}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px;}
.kpi{background:#fff;padding:13px 16px;} .kpi .n{font-size:20px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;} .kpi .l{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.kpi .n.g{color:var(--green);}
.cols{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;align-items:start;}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(11,26,56,.05);overflow:hidden;margin-bottom:14px;}
.ch{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);}
.ch b{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);} .ch .h{color:var(--muted);font-size:12px;} .ch .r{margin-left:auto;display:flex;gap:6px;align-items:center;}
.cb{padding:14px 16px;}
.muted{color:var(--muted);font-size:12.5px;line-height:1.55;}
.ready{display:flex;gap:16px;align-items:center;margin-bottom:12px;}
.gauge{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;}
.gauge .in{width:66px;height:66px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.gauge .in b{font-size:21px;color:var(--navy);line-height:1;} .gauge .in span{font-size:9.5px;color:var(--muted);font-weight:700;}
.rdgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.rdi{display:flex;align-items:center;gap:8px;border:1px solid #e3e8f1;border-radius:8px;padding:7px 10px;font-size:12.5px;cursor:pointer;background:#fff;text-align:left;font:inherit;font-size:12.5px;color:#33405a;}
.rdi .ck{width:16px;height:16px;border-radius:4px;border:1.5px solid #c3cad6;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;}
.rdi.on{border-color:#bfe6d1;background:#f2fbf6;color:#16573a;font-weight:700;} .rdi.on .ck{background:#1f8a5b;border-color:#1f8a5b;}
.rdi .v{margin-left:auto;font-size:11px;color:var(--soft);font-weight:600;}
.fg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px;}
.fg label{display:block;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.fg input,.fi{width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid #cfd6e2;border-radius:7px;color:var(--ink);}
.saved{font-size:11.5px;color:var(--green);font-weight:700;opacity:0;transition:opacity .2s;} .saved.on{opacity:1;}
.fit{padding:10px 0;border-top:1px solid #eef1f6;} .fit:first-child{border-top:none;padding-top:0;}
.fit .t{display:flex;align-items:center;gap:8px;} .fit .t a{font-weight:800;color:var(--navy);text-decoration:none;font-size:13.5px;} .fit .t a:hover{text-decoration:underline;}
.sc{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;}
.why{font-size:12px;color:#1f6b45;margin-top:3px;} .miss{font-size:12px;color:#9a6a12;margin-top:1px;}
.req{padding:8px 0;border-top:1px solid #eef1f6;font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;} .req:first-child{border-top:none;}
.hist{border-left:2px solid #e3e8f1;margin-left:4px;padding-left:12px;}
.hist .h{position:relative;padding:5px 0;font-size:12.5px;color:#33405a;} .hist .h:before{content:'';position:absolute;left:-17px;top:10px;width:8px;height:8px;border-radius:50%;background:#c3cad6;}
.hist .h.dn:before{background:#1f8a5b;} .hist .h.up:before{background:#c0392b;} .hist .h span{color:var(--soft);font-size:11.5px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;} th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);} td{padding:7px 8px;border-bottom:1px solid #f1f3f8;vertical-align:middle;} td.r,th.r{text-align:right;}
.mix{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;} .mix .row{display:flex;align-items:center;gap:8px;font-size:12px;} .mix .row span{width:130px;color:#33405a;} .mix .bar{height:8px;border-radius:4px;background:#2c5c8f;} .mix .row em{font-style:normal;color:var(--soft);font-size:11.5px;}
.spark{display:inline-block;vertical-align:middle;}
.sig{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:999px;}
.ov{position:fixed;inset:0;background:rgba(6,14,32,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:300;} .ov[hidden]{display:none;}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;box-shadow:0 24px 60px rgba(0,0,0,.35);}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800;color:var(--navy);}
.modal .mb{padding:14px 18px;} .modal label{display:block;font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 4px;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:13px;font-weight:700;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:400;} .toast.on{opacity:1;}
.empty{padding:40px 20px;text-align:center;color:var(--muted);}
@media(max-width:980px){ .cols{grid-template-columns:1fr;} .kpis{grid-template-columns:repeat(3,1fr);} .fg{grid-template-columns:1fr 1fr;} .rdgrid{grid-template-columns:1fr;} }
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Loading space…</div></div>
<div class="ov" id="reqOv" hidden><div class="modal"><div class="mh"><span id="rqTitle">Request info</span><button class="btn sm" onclick="closeReq()">✕</button></div><div class="mb">
  <div class="muted">Sends from the firm’s email address with your signature; replies go to the email on your account. Opens are tracked and the request is logged on this space and the broker's contact.</div>
  <label>To</label><input class="fi" id="rq_to"><label>Cc</label><input class="fi" id="rq_cc" placeholder="optional">
  <label>Subject</label><input class="fi" id="rq_subj"><label>Message</label><textarea class="fi" id="rq_body" rows="8" style="resize:vertical"></textarea>
  <div style="margin-top:12px;display:flex;gap:10px;align-items:center"><button class="btn pri" id="rq_go" onclick="sendReq()">Send request</button><span class="muted" id="rq_msg"></span></div>
</div></div></div>
<div class="toast" id="toast"></div>
<script>
var ID=(function(){ try{ return new URLSearchParams(location.search).get('id')||''; }catch(e){ return ''; } })();
var D=null, REQKIND='info';
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function n(v){ if(v==null||v==='') return null; var x=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isFinite(x)?x:null; }
function money(v,dp){ var x=n(v); return x==null?'—':('$'+x.toLocaleString('en-US',{minimumFractionDigits:dp==null?2:dp,maximumFractionDigits:dp==null?2:dp})); }
function k(v){ return '$'+Math.round(v/1000)+'K'; }
function dt(s){ var x=String(s||'').slice(0,10).split('-'); return x.length===3?(+x[1]+'/'+(+x[2])+'/'+x[0]):''; }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('on'); },2400); }
function api(m,u,b){ return fetch(u,{method:m,credentials:'same-origin',headers:b?{'Content-Type':'application/json'}:undefined,body:b?JSON.stringify(b):undefined}).then(function(r){return r.json();}); }
function scColor(s){ return s>=80?['#e7f5ee','#1f6b45']:(s>=65?['#eef4fb','#23496f']:['#fff4e6','#9a6a12']); }
function spark(series,w,h){ w=w||120; h=h||28; var v=series.map(function(x){return typeof x==='number'?x:(x.v||0);}); if(!v.length) return ''; var mx=Math.max.apply(null,v)||1; var st=w/Math.max(1,v.length-1); var pts=v.map(function(x,i){ return (i*st).toFixed(1)+','+(h-2-(x/mx)*(h-4)).toFixed(1); }).join(' '); return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><polyline points="'+pts+'" fill="none" stroke="#2c5c8f" stroke-width="1.6"/></svg>'; }
function load(){
  api('GET','/api/space/'+encodeURIComponent(ID)+'/detail').then(function(j){ if(!j||!j.ok){ document.getElementById('app').innerHTML='<div class="card"><div class="empty">'+esc((j&&j.error)||'Space not found.')+'</div></div>'; return; } D=j; render(); loadFits(); loadTx(); loadNearby(false); })
    .catch(function(){ document.getElementById('app').innerHTML='<div class="card"><div class="empty">Could not reach the server.</div></div>'; });
}
function render(){
  var sp=D.space, rd=D.ready, fl=D.flags||{}; var g=(n(sp.rent)||0)+(n(sp.nnn)||0);
  var stc=({'Available':['#e7f5ee','#1f8a5b'],'Toured':['#e8f0fd','#2f6fd0'],'LOI Out':['#fdf1df','#b5791f'],'Leased':['#eceff5','#3a4c74'],'Passed':['#f3f4f7','#8a93a8'],'Off-market':['#f3edfb','#6a43b8']})[sp.status||'Available']||['#eef1f6','#6b7488'];
  var flags='<span class="pill" style="background:'+stc[0]+';color:'+stc[1]+'">'+esc(sp.status||'Available')+'</span>'
    +(fl.dom!=null?'<span class="pill" style="background:#eef1f6;color:#4a5570">'+fl.dom+' day'+(fl.dom===1?'':'s')+' on market</span>':'')
    +(fl.priceDrop?'<span class="pill" style="background:#e7f5ee;color:#1f6b45">↓ Price drop '+money(fl.priceDrop.from)+' → '+money(fl.priceDrop.to)+'</span>':'')
    +(fl.stale?'<span class="pill" style="background:#fff4e6;color:#9a6a12">Stale — no update in '+fl.stale+' days</span>':'')
    +(sp.source==='tx-radar'?'<span class="pill" style="background:#f3edfb;color:#6a43b8">From Alcohol Sales</span>':'');
  var deg=Math.round(3.6*rd.score); var gc=rd.score>=70?'#1f8a5b':(rd.score>=40?'#e0a53a':'#c0392b');
  var h='<div class="hd"><div><div class="kick">Space Tracker</div><h1>'+esc(sp.center||sp.address||'Space')+(sp.name?(' · '+esc(sp.name)):'')+'</h1><div class="sub">'+esc([sp.address,sp.market,sp.spaceType,sp.condition].filter(Boolean).join(' · '))+'</div><div class="flags">'+flags+'</div></div>'
    +'<div class="spacts"><a class="btn" href="./rrg_space_tracker.html">← Spaces</a><a class="btn" href="./rrg_space_tracker.html?edit='+encodeURIComponent(sp.id)+'">Edit details</a><button class="btn pri" id="surveyBtn">⬇ Survey PDF</button></div></div>';
  h+='<div class="kpis"><div class="kpi"><div class="n">'+(n(sp.size)!=null?n(sp.size).toLocaleString('en-US'):'—')+'</div><div class="l">Square feet</div></div><div class="kpi"><div class="n">'+money(sp.rent)+'</div><div class="l">Base $/SF/yr</div></div><div class="kpi"><div class="n">'+money(sp.nnn)+'</div><div class="l">NNN $/SF/yr</div></div><div class="kpi"><div class="n">'+(g?('$'+g.toFixed(2)):'—')+'</div><div class="l">Gross $/SF/yr</div></div><div class="kpi"><div class="n">'+(rd.characterized?rd.score:'—')+'</div><div class="l">Restaurant-ready</div></div><div class="kpi"><div class="n g">'+(rd.savesHi?(k(rd.savesLo)+'–'+k(rd.savesHi)):'—')+'</div><div class="l">Build-out avoided (est.)</div></div></div>';
  h+='<div class="cols"><div>';
  // Restaurant-ready
  var inf=sp.infra||{};
  h+='<div class="card"><div class="ch"><b>Restaurant-ready</b><span class="h">what the space already has</span><span class="r"><span class="saved" id="rdSaved">Saved ✓</span></span></div><div class="cb">'
    +'<div class="ready"><div class="gauge" style="background:conic-gradient('+gc+' '+deg+'deg,#eef1f6 0)"><div class="in"><b>'+(rd.characterized?rd.score:'?')+'</b><span>/ 100</span></div></div><div><div style="font-weight:800;color:var(--navy);font-size:15px">'+esc(rd.grade)+'</div><div class="muted">'+(rd.savesHi?('The infrastructure on file saves a tenant roughly <b style="color:#1f6b45">'+k(rd.savesLo)+'–'+k(rd.savesHi)+'</b> of build-out — use it in the TI and rent negotiation.'):'Tick what the space has — the score and the build-out a tenant avoids update as you go.')+'</div></div></div>'
    +'<div class="rdgrid">'+D.readyItems.map(function(it){ var on=rd.items.filter(function(x){return x.k===it.k;})[0].have; return '<button type="button" class="rdi'+(on?' on':'')+'" data-feat="'+esc(it.feat)+'" data-k="'+it.k+'"><span class="ck">'+(on?'✓':'')+'</span>'+esc(it.label)+'<span class="v">'+(it.hi?(k(it.lo)+'–'+k(it.hi)):'+'+it.pts+' pts')+'</span></button>'; }).join('')+'</div>'
    +'<div class="fg">'+[['hoodFt','Hood length (ft)'],['greaseGal','Grease trap (gal)'],['amps','Electrical (amps)'],['parking','Parking spaces'],['patioSf','Patio (SF)'],['seats','Seats (prior use)'],['ceilingFt','Ceiling (ft)'],['prevUse','Previous use']].map(function(f){ return '<div><label>'+f[1]+'</label><input data-inf="'+f[0]+'" value="'+esc(inf[f[0]]||'')+'"></div>'; }).join('')+'</div>'
    +'</div></div>';
  // Texas records
  h+='<div class="card" id="txCard"><div class="ch"><b>Texas alcohol records</b><span class="h">Comptroller mixed-beverage sales · TABC permits</span><span class="r"><button class="btn sm" id="txRefresh">Refresh</button></span></div><div class="cb" id="txBody"><div class="muted">Looking up state filings at this address…</div></div></div>';
  // Nearby
  h+='<div class="card"><div class="ch"><b>Nearby restaurants</b><span class="h">co-tenancy &amp; competition</span><span class="r"><button class="btn sm" id="nbRefresh">Refresh</button></span></div><div class="cb" id="nbBody"><div class="muted">Loading…</div></div></div>';
  h+='</div><div>';
  // Fits
  h+='<div class="card"><div class="ch"><b>Tenant fits</b><span class="h">your active tenant searches this space matches</span></div><div class="cb" id="fitBody"><div class="muted">Scoring against your tenants…</div></div></div>';
  // Broker
  var bk=D.broker||{}; var bs=D.brokerStats;
  h+='<div class="card"><div class="ch"><b>Listing broker</b>'+(bs&&bs.requests?('<span class="h">'+bs.answered+' of '+bs.requests+' answered'+(bs.avgHours!=null?(' · avg '+(bs.avgHours<48?(bs.avgHours+' hrs'):(Math.round(bs.avgHours/24)+' days'))):'')+'</span>'):'')+'<span class="r"><span class="saved" id="bkSaved">Saved ✓</span></span></div><div class="cb">'
    +'<div class="fg" style="grid-template-columns:1fr 1fr;margin-top:0">'+[['brokerName','Name',bk.name],['brokerCompany','Company',bk.company],['brokerEmail','Email',bk.email],['brokerPhone','Phone',bk.phone]].map(function(f){ return '<div><label>'+f[1]+'</label><input data-bk="'+f[0]+'" value="'+esc(f[2]||'')+'"'+(bk.id?' disabled title="Linked to a contact"':'')+'></div>'; }).join('')+'</div>'
    +'<div style="display:flex;gap:8px;margin:12px 0 4px"><button class="btn pri sm" data-req="info"'+(D.canEmail?'':' disabled title="Email isn’t set up"')+'>✉ Request info</button><button class="btn sm" data-req="tour"'+(D.canEmail?'':' disabled')+'>Request a tour</button>'+(bk.phone?('<a class="btn sm" href="tel:'+esc(bk.phone)+'">Call</a>'):'')+'</div>'
    +'<div id="reqList">'+(D.requests||[]).map(function(r){ return '<div class="req"><span class="pill" style="background:'+(r.kind==='tour'?'#e8f0fd;color:#2f6fd0':'#eef1f6;color:#4a5570')+'">'+(r.kind==='tour'?'Tour':'Info')+'</span><span>'+esc(dt(r.at))+' · '+esc(r.by||'')+' → '+esc(r.to)+'</span><span style="margin-left:auto">'+(r.respondedAt?('<span style="color:#1f6b45;font-weight:700">Answered '+esc(dt(r.respondedAt))+'</span>'):('<button class="btn sm" data-resp="'+esc(r.id)+'">Got a reply</button>'))+'</span></div>'; }).join('')+'</div>'
    +'</div></div>';
  // History & comps
  var hist=(sp.history||[]).slice().reverse().slice(0,30);
  var lab={rent:'Base rent',nnn:'NNN',size:'Size',status:'Status',spaceType:'Type',condition:'Condition',leasedRent:'Leased at',created:'Added'};
  h+='<div class="card"><div class="ch"><b>History &amp; comps</b></div><div class="cb">'
    +(sp.status==='Leased'?('<div class="fg" style="grid-template-columns:1fr 1fr 1fr;margin:0 0 12px"><div><label>Leased at ($/SF)</label><input data-ls="leasedRent" value="'+esc(sp.leasedRent==null?'':sp.leasedRent)+'"></div><div><label>Leased to</label><input data-ls="leasedTo" value="'+esc(sp.leasedTo||'')+'"></div><div><label>Date</label><input data-ls="leasedAt" type="date" value="'+esc(sp.leasedAt||'')+'"></div></div>'):'')
    +(hist.length?('<div class="hist">'+hist.map(function(x){ var cls=''; if((x.field==='rent'||x.field==='nnn')&&x.from!==''&&x.to!==''){ cls=Number(x.to)<Number(x.from)?' dn':' up'; } var txt=x.field==='created'?('Added to the tracker'+(x.to?(' as '+esc(x.to)):'')):(esc(lab[x.field]||x.field)+': '+esc(x.from===''?'—':((x.field==='rent'||x.field==='nnn'||x.field==='leasedRent')?money(x.from):x.from))+' → <b>'+esc(x.to===''?'—':((x.field==='rent'||x.field==='nnn'||x.field==='leasedRent')?money(x.to):x.to))+'</b>'); return '<div class="h'+cls+'">'+txt+' <span>· '+esc(dt(x.at))+(x.by?(' · '+esc(x.by)):'')+'</span></div>'; }).join('')+'</div>'):'<div class="muted">No changes logged yet — rent, NNN, size and status changes are recorded from here on.</div>')
    +(D.comps&&D.comps.length?('<div style="margin-top:14px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Leased comps in '+esc(sp.market||'this market')+'</div><table><thead><tr><th>Space</th><th class="r">SF</th><th class="r">$/SF</th><th>Date</th></tr></thead><tbody>'+D.comps.map(function(c){ return '<tr><td><a href="./rrg_space.html?id='+encodeURIComponent(c.id)+'" style="color:#23496f;font-weight:700;text-decoration:none">'+esc([c.center,c.name].filter(Boolean).join(' · '))+'</a></td><td class="r">'+(n(c.size)!=null?n(c.size).toLocaleString():'—')+'</td><td class="r">'+money(c.leasedRent)+'</td><td>'+esc(dt(c.leasedAt))+'</td></tr>'; }).join('')+'</tbody></table>'):'')
    +'<div style="margin-top:12px"><a class="btn sm" href="./rrg_space_tracker.html?comps=1">Market rent comps ↗</a></div>'
    +'</div></div>';
  h+='</div></div>';
  document.getElementById('app').innerHTML=h; wire();
}
function saveSpace(patch,flag){ patch.id=D.space.id; return api('POST','/api/space',patch).then(function(j){ if(j&&j.ok){ var s=j.space; api('GET','/api/space/'+encodeURIComponent(ID)+'/detail').then(function(d){ if(d&&d.ok){ D=d; render(); loadFits(); if(D._tx) renderTx(D._tx); if(D._nb) renderNearby(D._nb); var f=document.getElementById(flag); if(f){ f.classList.add('on'); setTimeout(function(){ f.classList.remove('on'); },1800); } } }); } else toast((j&&j.error)||'Could not save.'); }); }
function wire(){
  document.querySelectorAll('.rdi[data-feat]').forEach(function(b){ b.onclick=function(){ var f=(D.space.features||[]).slice(); var ft=b.getAttribute('data-feat'); var i=f.indexOf(ft); if(i>=0) f.splice(i,1); else f.push(ft); var patch={features:f}; if(b.getAttribute('data-k')==='secondgen'){ patch.condition=(i>=0&&D.space.condition==='Second-gen')?'':'Second-gen'; } saveSpace(patch,'rdSaved'); }; });
  document.querySelectorAll('[data-inf]').forEach(function(i){ i.onchange=function(){ var inf={}; document.querySelectorAll('[data-inf]').forEach(function(x){ inf[x.getAttribute('data-inf')]=x.value; }); saveSpace({infra:inf},'rdSaved'); }; });
  document.querySelectorAll('[data-bk]').forEach(function(i){ i.onchange=function(){ var p={}; p[i.getAttribute('data-bk')]=i.value; saveSpace(p,'bkSaved'); }; });
  document.querySelectorAll('[data-ls]').forEach(function(i){ i.onchange=function(){ var p={}; p[i.getAttribute('data-ls')]=i.value; saveSpace(p,''); }; });
  document.querySelectorAll('[data-req]').forEach(function(b){ b.onclick=function(){ openReq(b.getAttribute('data-req')); }; });
  document.querySelectorAll('[data-resp]').forEach(function(b){ b.onclick=function(){ api('POST','/api/space/'+encodeURIComponent(ID)+'/broker-request/'+encodeURIComponent(b.getAttribute('data-resp'))+'/responded',{}).then(function(){ toast('Marked answered'); load(); }); }; });
  var sv=document.getElementById('surveyBtn'); if(sv) sv.onclick=function(){ survey([ID],sv); };
  var tr=document.getElementById('txRefresh'); if(tr) tr.onclick=function(){ loadTx(true); };
  var nr=document.getElementById('nbRefresh'); if(nr) nr.onclick=function(){ loadNearby(true); };
}
function survey(ids,btn){ var was=btn.textContent; btn.disabled=true; btn.textContent='Building…'; fetch('/api/spaces/survey',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({spaceIds:ids})}).then(function(r){ if(!r.ok) return r.json().then(function(j){ throw new Error((j&&j.error)||'Could not build.'); }); var cd=r.headers.get('Content-Disposition')||''; var m=cd.match(/filename="([^"]+)"/); return r.blob().then(function(b){ return {b:b,name:m?m[1]:'Market_Survey.pdf'}; }); }).then(function(x){ var u=URL.createObjectURL(x.b); var a=document.createElement('a'); a.href=u; a.download=x.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(u);},1500); btn.disabled=false; btn.textContent=was; }).catch(function(e){ btn.disabled=false; btn.textContent=was; toast(e.message); }); }
function loadFits(){ api('GET','/api/space/'+encodeURIComponent(ID)+'/engagement-matches').then(function(j){ var b=document.getElementById('fitBody'); if(!b) return; var m=(j&&j.matches)||[]; if(!m.length){ b.innerHTML='<div class="muted">No active tenant search fits this space right now. Matches are scored against each tenant engagement\'s Site Selection Criteria — size, area, budget and build needs.</div>'; return; }
  b.innerHTML=m.map(function(x){ var c=scColor(x.score); return '<div class="fit"><div class="t"><span class="sc" style="background:'+c[0]+';color:'+c[1]+'">'+x.score+'</span><a href="./rrg_tenant_engagement.html?key='+encodeURIComponent(x.key)+'">'+esc(x.business||'Tenant')+'</a>'+(x.shortlisted?'<span class="pill" style="background:#fff4e6;color:#9a6a12">★ Shortlisted</span>':'')+'<span style="margin-left:auto"><a class="btn sm" href="./rrg_loi_builder.html?key='+encodeURIComponent(x.key)+'&space='+encodeURIComponent(ID)+'#new">LOI</a></span></div>'+(x.reasons.length?('<div class="why">✓ '+esc(x.reasons.join(' · '))+'</div>'):'')+(x.misses.length?('<div class="miss">'+esc(x.misses.join(' · '))+'</div>'):'')+'</div>'; }).join(''); }); }
function loadTx(refresh){ var b=document.getElementById('txBody'); if(b&&refresh) b.innerHTML='<div class="muted">Refreshing from data.texas.gov…</div>'; api('GET','/api/space/'+encodeURIComponent(ID)+'/txbev'+(refresh?'?refresh=1':'')).then(function(j){ D._tx=j; renderTx(j); }).catch(function(){ if(b) b.innerHTML='<div class="muted">Could not reach the server.</div>'; }); }
function renderTx(j){ var b=document.getElementById('txBody'); if(!b) return; if(!j||!j.ok){ b.innerHTML='<div class="muted">'+esc((j&&j.error)||'No data.')+'</div>'; return; }
  var ops=j.operators||[], pm=j.permits||[], cl=j.creditLaw||[];
  var h='';
  var newest=ops.reduce(function(a,o){ return o.lastMonth>a?o.lastMonth:a; },'');
  function _mdiff(a,b){ var x=a.split('-'),z=b.split('-'); return (+x[0]-+z[0])*12+(+x[1]-+z[1]); }
  if(ops.length){ h+='<table><thead><tr><th>Operator at this address</th><th>Last 24 mo</th><th class="r">Trailing 12</th><th class="r">vs last yr</th><th>Last filed</th></tr></thead><tbody>'+ops.map(function(o){ var y=o.yoy3; var gone=newest&&o.lastMonth&&_mdiff(newest,o.lastMonth)>=2; if(gone) return '<tr><td>'+(o.permit?('<a href="./rrg_tx_operator.html?permit='+encodeURIComponent(o.permit)+'" style="color:var(--navy);text-decoration:none"><b>'+esc(o.name)+'</b></a>'):('<b>'+esc(o.name)+'</b>'))+'<div style="color:var(--soft);font-size:11.5px">'+esc(o.address)+(o.permit?(' · '+esc(o.permit)):'')+'</div></td><td>'+spark(o.series.slice(-24))+'</td><td class="r">'+money(o.trailing12,0)+'</td><td class="r"><span class="sig" style="background:#fdeceb;color:#a5352c">Stopped filing</span></td><td>'+esc(o.lastMonth)+'</td></tr>'; var mixT=(o.liquor12||0)+(o.wine12||0)+(o.beer12||0); var mixS=mixT?('<div style="color:var(--soft);font-size:11px">Liquor '+Math.round(o.liquor12/mixT*100)+'% · Wine '+Math.round(o.wine12/mixT*100)+'% · Beer '+Math.round(o.beer12/mixT*100)+'%</div>'):''; return '<tr><td>'+(o.permit?('<a href="./rrg_tx_operator.html?permit='+encodeURIComponent(o.permit)+'" style="color:var(--navy);text-decoration:none"><b>'+esc(o.name)+'</b></a>'):('<b>'+esc(o.name)+'</b>'))+'<div style="color:var(--soft);font-size:11.5px">'+esc(o.address)+(o.permit?(' · '+esc(o.permit)):'')+'</div></td><td>'+spark(o.series.slice(-24))+'</td><td class="r"><b>'+money(o.trailing12,0)+'</b>'+mixS+'</td><td class="r" style="color:'+(y==null?'#8a93a8':(y<0?'#c0392b':'#1f8a5b'))+';font-weight:700">'+(y==null?'—':((y>0?'+':'')+y+'%'))+'</td><td>'+esc(o.lastMonth)+'</td></tr>'; }).join('')+'</tbody></table>'; }
  else h+='<div class="muted">No mixed-beverage filings at this address in the last three years'+(j.query?(' (searched '+esc(j.query.street)+(j.query.city?(', '+esc(j.query.city)):'')+')'):'')+'.</div>';
  if(pm.length) h+='<div style="margin-top:12px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">TABC permits</div><table><tbody>'+pm.map(function(p){ var act=/active/i.test(p.status); return '<tr><td><b>'+esc(p.name)+'</b><div style="color:var(--soft);font-size:11.5px">'+esc([p.type,p.id,p.owner].filter(Boolean).join(' · '))+'</div></td><td><span class="sig" style="background:'+(act?'#e7f5ee;color:#1f6b45':'#fdeceb;color:#a5352c')+'">'+esc(p.status||'—')+'</span></td><td style="font-size:11.5px;color:var(--muted)">'+(p.expires?('Exp '+esc(dt(p.expires))):'')+(p.changed?(' · changed '+esc(dt(p.changed))):'')+'</td></tr>'; }).join('')+'</tbody></table>';
  if(cl.length) h+='<div style="margin-top:10px;padding:9px 11px;border-radius:8px;background:#fdeceb;color:#7a2a20;font-size:12.5px"><b>On the TABC credit-law delinquent list:</b> '+cl.map(function(c){ return esc(c.name)+' ('+esc(dt(c.effective))+')'; }).join(', ')+' — the operator is behind paying distributors. Watch for a vacancy or a motivated seller.</div>';
  h+='<div class="muted" style="margin-top:10px;font-size:11.5px">Source: Texas Comptroller mixed-beverage gross receipts &amp; TABC (data.texas.gov). The state reports with a lag of a month or two. '+(j.cached?'Cached '+esc(dt(j.at))+'.':'')+'</div>';
  b.innerHTML=h; }
function loadNearby(refresh){ var b=document.getElementById('nbBody'); if(b&&refresh) b.innerHTML='<div class="muted">Pulling from Google…</div>'; api('GET','/api/space/'+encodeURIComponent(ID)+'/nearby'+(refresh?'?refresh=1':'')).then(function(j){ D._nb=j; renderNearby(j); }).catch(function(){}); }
function renderNearby(j){ var b=document.getElementById('nbBody'); if(!b) return; var c=D.center;
  var h=''; if(c&&(c.anchor||c.coTenants||c.vpd)) h+='<div style="margin-bottom:12px;font-size:12.5px;color:#33405a;line-height:1.6">'+(c.anchor?('<b>Anchor:</b> '+esc(c.anchor)+'<br>'):'')+(c.coTenants?('<b>Co-tenants:</b> '+esc(c.coTenants)+'<br>'):'')+(c.vpd?('<b>Traffic:</b> '+esc(c.vpd)+' VPD'):'')+'</div>';
  if(!j||!j.ok){ b.innerHTML=h+'<div class="muted">'+esc((j&&j.error)||'No data.')+'</div>'; return; }
  var nb=j.nearby||{}; var items=(nb.items||[]).filter(function(x){return x.open!=='CLOSED_PERMANENTLY';}); var mix=nb.mix||{}; var keys=Object.keys(mix).sort(function(a,b){return mix[b]-mix[a];}).slice(0,8); var mx=keys.length?mix[keys[0]]:1;
  h+='<div class="muted" style="margin-bottom:8px">'+items.length+' restaurants within '+(Math.round((nb.radius||1600)/160.9)/10)+' mi'+(nb.closed?(' · <b style="color:#a5352c">'+nb.closed+' permanently closed</b> nearby'):'')+'</div>';
  if(keys.length) h+='<div class="mix">'+keys.map(function(k){ return '<div class="row"><span>'+esc(k)+'</span><div class="bar" style="width:'+Math.max(6,Math.round(mix[k]/mx*180))+'px"></div><em>'+mix[k]+'</em></div>'; }).join('')+'</div>';
  h+='<table><tbody>'+items.slice(0,14).map(function(x){ return '<tr><td><b>'+esc(x.name)+'</b><div style="color:var(--soft);font-size:11.5px">'+esc(x.cuisine)+(x.price!=null?(' · '+'$$$$'.slice(0,Math.max(1,x.price))):'')+'</div></td><td class="r">'+(x.rating?(x.rating+'★ <span style="color:var(--soft)">('+x.reviews+')</span>'):'—')+'</td><td class="r">'+(Math.round(x.dist/160.9)/10)+' mi</td></tr>'; }).join('')+'</tbody></table>';
  b.innerHTML=h; }
function openReq(kind){ REQKIND=kind; var sp=D.space, bk=D.broker||{}; document.getElementById('rqTitle').textContent=kind==='tour'?'Request a tour':'Request info';
  document.getElementById('rq_to').value=bk.email||''; document.getElementById('rq_cc').value='';
  var where=[sp.center,sp.name].filter(Boolean).join(' — ')||sp.address||'the space';
  document.getElementById('rq_subj').value=(kind==='tour'?'Tour request — ':'Information request — ')+where;
  document.getElementById('rq_body').value='Hi'+(bk.name?(' '+String(bk.name).split(' ')[0]):'')+',\n\n'+(kind==='tour'?('I represent a restaurant tenant interested in '+where+'. Could we set a time to tour this week or next? Please send a couple of windows that work.'):('I represent a restaurant tenant looking at '+where+'. Could you send the flyer, current asking rent and NNN, delivery condition, and what restaurant infrastructure is in place (hood, grease trap, gas, power)? Also any site plan and co-tenancy.'))+'\n\nThank you,';
  document.getElementById('rq_msg').textContent=''; document.getElementById('reqOv').hidden=false; }
function closeReq(){ document.getElementById('reqOv').hidden=true; }
function sendReq(){ var b=document.getElementById('rq_go'), m=document.getElementById('rq_msg'); var p={kind:REQKIND,to:document.getElementById('rq_to').value.trim(),cc:document.getElementById('rq_cc').value.trim(),subject:document.getElementById('rq_subj').value,body:document.getElementById('rq_body').value};
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.to)){ m.textContent='Enter the broker\'s email.'; return; } b.disabled=true; m.textContent='Sending…';
  api('POST','/api/space/'+encodeURIComponent(ID)+'/broker-request',p).then(function(j){ b.disabled=false; if(!j||!j.ok){ m.textContent=(j&&j.error)||'Could not send.'; return; } closeReq(); toast('Request sent to '+p.to); load(); }).catch(function(){ b.disabled=false; m.textContent='Could not reach the server.'; }); }
if(!ID) document.getElementById('app').innerHTML='<div class="card"><div class="empty">Open a space from the Space Tracker.</div></div>'; else load();
</script>
