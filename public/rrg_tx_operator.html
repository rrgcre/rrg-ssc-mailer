<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRG — Operator</title>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--ink:#1a2236;--muted:#6b7488;--soft:#8a93a8;--line:#e6e9f0;--green:#1f8a5b;--liq:#8a5a12;--wine:#7a2f5a;--beer:#d9a441;--cov:#4a6fa5;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#eef1f6;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.owrap{max-width:1240px;margin:0 auto;padding:22px 24px 48px;}
.okick{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red);}
.ohd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
.ohd h1{margin:3px 0 0;font-size:26px;font-weight:800;color:var(--navy);}
.osub{color:var(--muted);font-size:13px;margin-top:4px;}
.otags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.otag{white-space:nowrap;font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:3px 9px;border-radius:999px;background:#eef1f6;color:#4a5570;}
.obtns{display:flex;gap:8px;flex-wrap:wrap;}
.obtn{font:inherit;font-size:12.5px;font-weight:700;border:1px solid #cfd6e2;background:#fff;color:var(--navy);border-radius:8px;padding:8px 13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.obtn.pri{background:var(--navy);color:#fff;border-color:var(--navy);}
.pers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px;}
.per{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
.per .t{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.per .v{font-size:21px;font-weight:800;color:var(--navy);margin-top:6px;font-variant-numeric:tabular-nums;}
.per .c{font-size:12.5px;font-weight:800;margin-top:3px;} .up{color:#1f8a5b;} .dn{color:#c0392b;} .na{color:var(--soft);}
.per .s{font-size:11px;color:var(--soft);margin-top:2px;}
.ocols{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start;}
.ocard{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(11,26,56,.05);overflow:hidden;margin-bottom:14px;}
.och{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);}
.och b{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);} .och .h{color:var(--muted);font-size:12px;} .och .r{margin-left:auto;display:flex;gap:6px;align-items:center;}
.ocb{padding:14px 16px;}
.mixbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#eef1f6;margin:6px 0 12px;}
.mixbar i{display:block;height:100%;}
.mixrow{display:grid;grid-template-columns:14px 1fr auto auto;gap:10px;align-items:center;font-size:13px;padding:5px 0;border-top:1px solid #f3f5f9;} .mixrow:first-of-type{border-top:none;}
.sw{width:12px;height:12px;border-radius:3px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;} th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--line);background:#f7f9fc;white-space:nowrap;} td{padding:7px 10px;border-bottom:1px solid #f1f3f8;} td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;}
.hk{grid-template-columns:118px 1fr;row-gap:8px;} .hk>span{padding-top:1px;} .ksub{font-size:11.5px;color:var(--soft);font-weight:400;} .klink{color:#23496f;font-weight:700;text-decoration:none;} .klink:hover{text-decoration:underline;}
.crmrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid #f1f3f8;} .crml{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:6px;} .crmchip{font-size:12px;font-weight:700;color:#23496f;background:#eef3fa;border-radius:999px;padding:4px 10px;text-decoration:none;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;} .kv span{color:var(--muted);}
.chart{width:100%;height:190px;}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;} .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;}
.oempty{padding:40px 20px;text-align:center;color:var(--muted);}
.onote{font-size:11.5px;color:var(--muted);padding:10px 16px;line-height:1.55;}
.pg{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:8px 10px;font-size:12px;color:var(--muted);}
.obtn.ai{border-color:#c9b6f0;color:#4b2a8f;background:#faf7ff;}
.obtn[disabled]{opacity:.6;cursor:default;}
.aicard{border-color:#ddd0f6;}
.aicard .och{background:linear-gradient(90deg,#faf7ff,#fff);}
.aicard .och b{color:#4b2a8f;}
.aibody{padding:6px 18px 14px;font-size:13.5px;line-height:1.6;color:var(--ink);columns:2 420px;column-gap:34px;}
.aibody h3{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--navy);margin:12px 0 4px;break-after:avoid;}
.aibody p{margin:0 0 6px;} .aibody ul{margin:0 0 6px;padding-left:18px;} .aibody li{margin:2px 0;break-inside:avoid;}
.aibody.busy{columns:auto;color:var(--muted);padding:18px;}
.aierr{color:#a5352c;}
.aistale{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:#fff4dc;color:#8a5a12;}
@media(max-width:980px){ .pers{grid-template-columns:repeat(2,1fr);} .ocols{grid-template-columns:1fr;} }
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<div class="owrap" id="app"><div class="oempty">Loading state filings…</div></div>
<script>
var Q=(function(){ try{ return new URLSearchParams(location.search); }catch(e){ return {get:function(){return '';}}; } })();
var PERMIT=Q.get('permit')||'', D=null, MPAGE=0, MPER=12, AIBUSY=false, AIERR='';
var CAT=[['liquor','Liquor','var(--liq)'],['wine','Wine','var(--wine)'],['beer','Beer','var(--beer)'],['cover','Cover charges','var(--cov)']];
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function $(v){ return (v==null||!isFinite(v))?'—':('$'+Math.round(v).toLocaleString('en-US')); }
function mlabel(m){ var x=String(m||'').split('-'); var n=['January','February','March','April','May','June','July','August','September','October','November','December']; return x.length===2?(n[+x[1]-1]+' '+x[0]):m; }
function chg(c,two){ if(c==null) return '<div class="c na">not enough history to compare</div>'; return '<div class="c '+(c<0?'dn':'up')+'">'+(c>0?'▲ ':'▼ ')+Math.abs(c)+'% vs '+(two?'prior 2 years':'last year')+'</div>'; }
function ord(n){ var s=['th','st','nd','rd'],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function since(d){ if(!d) return ''; var a=new Date(d), b=new Date(); var mo=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth()); if(!isFinite(mo)) return ''; var y=Math.floor(mo/12), m=mo%12; return (y?(y+' year'+(y===1?'':'s')):'')+(y&&m?', ':'')+(m?(m+' month'+(m===1?'':'s')):''); }
function chartSvg(rows){ rows=rows.slice(0,24).reverse(); if(!rows.length) return ''; var W=800,H=190,pad=26,bw=(W-pad)/rows.length; var mx=Math.max.apply(null,rows.map(function(r){return r.total;}))||1;
  var bars=rows.map(function(r,i){ var y=H-18, x=pad+i*bw+2, out=''; CAT.forEach(function(c){ var h=(r[c[0]]/mx)*(H-34); if(h<=0) return; y-=h; out+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-4).toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+c[2]+'"><title>'+esc(mlabel(r.m))+' · '+c[1]+' '+$(r[c[0]])+'</title></rect>'; }); var lb=(i%3===0)?('<text x="'+(x+(bw-4)/2).toFixed(1)+'" y="'+(H-4)+'" font-size="10" text-anchor="middle" fill="#8a93a8">'+r.m.slice(2).replace('-','/')+'</text>'):''; return out+lb; }).join('');
  var grid=[0.5,1].map(function(f){ var y=(H-18)-f*(H-34); return '<line x1="'+pad+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="#eef1f6"/><text x="0" y="'+(y+3)+'" font-size="10" fill="#8a93a8">'+(mx*f>=1e6?('$'+(mx*f/1e6).toFixed(1)+'M'):('$'+Math.round(mx*f/1000)+'K'))+'</text>'; }).join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+grid+bars+'</svg>'; }
function csv(rows,cols,name){ var q=function(v){ v=v==null?'':String(v); return /[",\n]/.test(v)?('"'+v.replace(/"/g,'""')+'"'):v; }; var s=cols.map(function(c){return q(c[0]);}).join(',')+'\n'+rows.map(function(r){ return cols.map(function(c){ return q(r[c[1]]); }).join(','); }).join('\n'); var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
function mdLite(t){ var out=[], inUl=false; String(t||'').split(/\n/).forEach(function(line){ var l=line.trim(); var fmt=function(x){ return esc(x).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); };
    if(/^#{1,6}\s/.test(l)){ if(inUl){out.push('</ul>');inUl=false;} out.push('<h3>'+fmt(l.replace(/^#{1,6}\s+/,''))+'</h3>'); }
    else if(/^[-*•]\s+/.test(l)){ if(!inUl){out.push('<ul>');inUl=true;} out.push('<li>'+fmt(l.replace(/^[-*•]\s+/,''))+'</li>'); }
    else if(l){ if(inUl){out.push('</ul>');inUl=false;} out.push('<p>'+fmt(l)+'</p>'); }
  }); if(inUl) out.push('</ul>'); return out.join(''); }
function when(iso){ try{ var d=new Date(iso); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }catch(e){ return ''; } }
function aiCard(){ var S=D.aiSummary; if(AIBUSY&&window.rrgAiWork&&!S) return ''; if(!S&&!AIBUSY&&!AIERR) return '';
  var head='<div class="och"><b>✨ AI summary</b><span class="h">'+(AIBUSY?'reading the filings…':(S?('Generated '+esc(when(S.at))+(S.by?(' by '+esc(S.by)):'')+' · data through '+esc(mlabel(S.lastMonth))):''))+'</span>'+(S&&S.stale&&!AIBUSY?'<span class="aistale">Newer filings since — regenerate</span>':'')+'<span class="r">'+(S&&!AIBUSY?'<button class="obtn" id="aiCopy">Copy</button><button class="obtn" id="aiRegen">↻ Regenerate</button>':'')+'</span></div>';
  var body=AIBUSY?'<div class="aibody busy">Summarizing '+esc(D.name)+'\'s sales, mix, permit and group — about 10–20 seconds.</div>':(AIERR?'<div class="aibody busy aierr">'+esc(AIERR)+'</div>':'<div class="aibody">'+mdLite(S.text)+'</div>');
  return '<div class="ocard aicard" id="aiCard">'+head+body+'<div class="onote" style="padding-top:0">AI draft from state filings only — verify before it goes to a client.</div></div>'; }
var AICTL=null;
function runAi(refresh){ if(AIBUSY) return; AIBUSY=true; AIERR='';
  var W=window.rrgAiWork, msgs=['Reading '+D.name+'\'s monthly filings…','Comparing sales against last year…','Weighing the liquor / wine / beer mix…','Checking the permit and the owner\'s other locations…','Writing the broker read…'], mi=0, tick=null;
  try{ AICTL=new AbortController(); }catch(e){ AICTL=null; }
  if(W){ W.show(msgs[0],function(){ if(AICTL) try{ AICTL.abort(); }catch(e){} AIBUSY=false; clearInterval(tick); render(); }); tick=setInterval(function(){ mi=Math.min(msgs.length-1,mi+1); W.setMsg(msgs[mi]); },3500); }
  render();
  fetch('/api/tx/operator/ai-summary',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({permit:PERMIT,refresh:!!refresh}),signal:AICTL?AICTL.signal:undefined}).then(function(r){return r.json();}).then(function(j){ clearInterval(tick); if(!AIBUSY) return; AIBUSY=false; if(j&&j.ok){ D.aiSummary=j.summary; if(W) W.hide(); } else { AIERR=(j&&j.error)||'The AI summary failed.'; if(W) W.hide(); } render(); var c=document.getElementById('aiCard'); if(c) c.scrollIntoView({behavior:'smooth',block:'start'}); })
  .catch(function(e){ clearInterval(tick); if(e&&e.name==='AbortError') return; AIBUSY=false; AIERR='Could not reach the server.'; if(W) W.hide(); render(); }); }
// % change: each month vs the same month a year earlier (seasonality cancels out);
// each year vs the same months of the prior year, compared only on months filed in both years.
function yoyMonth(m){ var x=String(m).split('-'); return (+x[0]-1)+'-'+x[1]; }
function pctOf(a,b){ return (b>0&&a!=null)?Math.round((a-b)/b*1000)/10:null; }
function addChanges(){ var byM={}; D.monthly.forEach(function(r){ byM[r.m]=r; });
  D.monthly.forEach(function(r){ var p=byM[yoyMonth(r.m)]; r.chg=p?pctOf(r.total,p.total):null; });
  D.yearly.forEach(function(y){ var ms=D.monthly.filter(function(r){ return r.m.slice(0,4)===y.y; }); var cur=0, prev=0, n=0; ms.forEach(function(r){ var p=byM[yoyMonth(r.m)]; if(p){ n++; cur+=r.total; prev+=p.total; } }); y.chg=n?pctOf(cur,prev):null; y.cmpN=n; y.ytd=(y.y===String(D.lastMonth).slice(0,4))&&y.months<12; }); }
function pcell(c){ return '<td class="r">'+(c==null?'<span style="color:var(--soft)">—</span>':('<span class="'+(c<0?'dn':(c>0?'up':'na'))+'" style="font-weight:700">'+(c>0?'+':'')+c+'%</span>'))+'</td>'; }
function fmtPhone(p){ var d=String(p||'').replace(/\D/g,''); if(d.length===11&&d[0]==='1') d=d.slice(1); return d.length===10?('('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6)):String(p||''); }
function stPill(st){ if(!st) return '<span style="color:var(--soft)">—</span>'; var ok=/active/i.test(st); return '<span class="otag" style="'+(ok?'background:#e7f5ee;color:#1f6b45':'background:#fdeceb;color:#a5352c')+'">'+esc(st)+'</span>'; }
function holderCard(){ var L=D.license||{}, crm=D.crm||{companies:[],people:[]};
  var holder=L.owner||D.taxpayer||'—', dba=L.trade&&L.trade.toUpperCase()!==String(holder).toUpperCase()?L.trade:'';
  var mail=L.mailing||D.taxpayerMail||'', mailSrc=L.mailing?'TABC':(D.taxpayerMail?'Comptroller':'');
  var phone=L.phone?fmtPhone(L.phone):'';
  var row=function(k,v){ return v?('<span>'+k+'</span><div>'+v+'</div>'):''; };
  var h='<div class="ocard"><div class="och"><b>Permit holder &amp; contact</b><span class="r"><button class="obtn" id="cpyContact">Copy</button></span></div><div class="ocb"><div class="kv hk">'
    +row('Permit holder','<b>'+esc(holder)+'</b>'+(dba?('<div class="ksub">dba '+esc(dba)+'</div>'):''))
    +(D.taxpayer&&String(D.taxpayer).toUpperCase()!==String(holder).toUpperCase()?row('Owner of record','<b>'+esc(D.taxpayer)+'</b><div class="ksub">state tax filings</div>'):'')
    +row('Permit','<b>'+esc(D.permit)+'</b> · '+esc(L.typeName||L.type||'type not on file')+(L.typeName&&L.type?(' <span style="color:var(--soft)">('+esc(L.type)+')</span>'):''))
    +row('Status',(L.status?stPill(L.status):'<span style="color:var(--soft)">no TABC record found</span>')+(L.secondary?(' <span class="ksub" style="display:inline">'+esc(L.secondary)+'</span>'):''))
    +row('Issued',L.issued?(esc(L.issued)+' <span class="ksub" style="display:inline">· '+esc(since(L.issued))+'</span>'):'')
    +row('Expires',L.expires?esc(L.expires):'')
    +row('Phone',phone?('<a class="klink" href="tel:'+esc(String(L.phone).replace(/[^\d+]/g,''))+'">'+esc(phone)+'</a>'):'<span style="color:var(--soft)">not on file</span>')
    +row('Email',L.email?('<a class="klink" href="mailto:'+esc(L.email)+'">'+esc(L.email)+'</a>'):'')
    +row('Premises',esc([D.address,D.city,(D.state||'TX')+' '+String(D.zip||'').slice(0,5)].filter(Boolean).join(', ')))
    +row('Mailing address',mail?(esc(mail)+'<div class="ksub">from '+mailSrc+' records</div>'):'')
    +row('Taxpayer ID',D.taxpayerNumber?esc(D.taxpayerNumber)+(D.locationNumber?(' <span class="ksub" style="display:inline">· location #'+esc(D.locationNumber)+'</span>'):''):'')
    +row('Filing since',D.responsibleSince?esc(D.responsibleSince):'')
    +'</div><div class="crmrow"><span class="crml">In your CRM</span>'
    +(crm.companies.length||crm.people.length?(crm.companies.map(function(c){ return '<a class="crmchip" href="./rrg_company.html?id='+encodeURIComponent(c.id)+'">🏢 '+esc(c.name)+'</a>'; }).join('')+crm.people.map(function(x){ return '<a class="crmchip" href="./rrg_person.html?id='+encodeURIComponent(x.id)+'">👤 '+esc(x.name)+'</a>'; }).join('')):'<span class="ksub" style="display:inline;margin-right:8px">Not yet</span><button class="obtn" id="addCrm">＋ Add to CRM</button>')
    +'</div><div class="onote" style="padding:8px 0 0">Permit and phone are from TABC; owner of record and mailing address from Comptroller filings. The state does not publish email for most permits.</div></div></div>';
  return h; }
function contactText(){ var L=D.license||{}; return [D.name, L.owner||D.taxpayer, (L.trade&&L.trade!==D.name)?('dba '+L.trade):'', 'Permit '+D.permit+(L.typeName?(' · '+L.typeName):''), L.phone?fmtPhone(L.phone):'', L.email||'', [D.address,D.city,'TX '+String(D.zip||'').slice(0,5)].join(', '), (L.mailing||D.taxpayerMail)?('Mailing: '+(L.mailing||D.taxpayerMail)):''].filter(Boolean).join('\n'); }
function load(){ if(!PERMIT){ document.getElementById('app').innerHTML='<div class="ocard"><div class="oempty">Open an operator from Alcohol Sales or a space\'s alcohol records.</div></div>'; return; }
  fetch('/api/tx/operator?permit='+encodeURIComponent(PERMIT),{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){ D=j; if(D&&D.ok) addChanges(); render(); }).catch(function(){ document.getElementById('app').innerHTML='<div class="ocard"><div class="oempty">Could not reach the server.</div></div>'; }); }
function render(){ var a=document.getElementById('app'); if(!D||!D.ok){ a.innerHTML='<div class="ocard"><div class="oempty">'+esc((D&&D.error)||'No data.')+'</div></div>'; return; }
  var P=D.periods, lic=D.license||{}, chainN=(D.chain||[]).length;
  var stopped=(function(){ var x=D.lastMonth.split('-'), n=new Date(); return ((n.getFullYear()-+x[0])*12+(n.getMonth()+1-+x[1]))>=4; })();
  var full=[D.address,D.city,(D.state||'TX')+' '+String(D.zip||'').slice(0,5)].filter(Boolean).join(', ');
  var h='<div class="ohd"><div><div class="okick">Alcohol Sales · Operator</div><h1>'+esc(D.name)+'</h1><div class="osub">'+esc(full)+'</div><div class="otags">'+(lic.type?('<span class="otag">'+esc(lic.typeName||(lic.type+' permit'))+'</span>'):'')+(chainN>1?('<span class="otag">'+chainN+'-location group</span>'):'')+(lic.status?('<span class="otag" style="'+(/active/i.test(lic.status)?'background:#e7f5ee;color:#1f6b45':'background:#fdeceb;color:#a5352c')+'">TABC '+esc(lic.status)+'</span>'):'')+(stopped?'<span class="otag" style="background:#fdeceb;color:#a5352c">No filings since '+esc(mlabel(D.lastMonth))+'</span>':'')+'</div></div>'
    +'<div class="obtns"><a class="obtn" href="./rrg_market_radar.html?city='+encodeURIComponent(D.city)+'">← Alcohol Sales</a><a class="obtn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(D.name+' '+full)+'">Map ↗</a><a class="obtn" target="_blank" rel="noopener" href="https://www.google.com/search?q='+encodeURIComponent(D.name+' '+full)+'">Look up ↗</a>'+'<button class="obtn" id="cmpBtn" title="Compare with up to 4 other locations">⇄ Compare</button>'+'<button class="obtn ai" data-ai="1" id="aiBtn"'+(AIBUSY?' disabled':'')+'>'+(AIBUSY?'✨ Summarizing…':'✨ AI summary')+'</button>'+(D.trackedSpaceId?('<a class="obtn pri" href="./rrg_space.html?id='+encodeURIComponent(D.trackedSpaceId)+'">Open space</a>'):'<button class="obtn pri" id="trackBtn">Track as space</button>')+'</div></div>';
  h+='<div class="pers">'+[['Recent month',P.month,mlabel(D.lastMonth)],['Past quarter',P.quarter,'last 3 months'],['Past 6 months',P.half,'last 6 months'],['Past year',P.year,'last 12 months'],['Past 2 years',P.twoYear,'last 24 months']].map(function(x){ return '<div class="per"><div class="t">'+x[0]+'</div><div class="v">'+$(x[1].total)+'</div>'+chg(x[1].chg,x[0]==='Past 2 years')+'<div class="s">'+esc(x[2])+'</div></div>'; }).join('')+'</div>';
  h+=aiCard();
  h+='<div class="ocols"><div>';
  h+='<div class="ocard"><div class="och"><b>Monthly receipts</b><span class="h">last 24 months</span><span class="r legend">'+CAT.map(function(c){ return '<span><i style="background:'+c[2]+'"></i>'+c[1]+'</span>'; }).join('')+'</span></div><div class="ocb">'+chartSvg(D.monthly)+'</div></div>';
  var mrows=D.monthly.slice(MPAGE*MPER,MPAGE*MPER+MPER), pages=Math.ceil(D.monthly.length/MPER);
  h+='<div class="ocard"><div class="och"><b>Monthly data</b><span class="h">'+D.monthly.length+' months on file since '+esc(mlabel(D.firstMonth))+'</span><span class="r"><button class="obtn" id="mExp">⬇ Export</button></span></div><table><thead><tr><th>Month</th><th class="r">Total</th><th class="r">Liquor</th><th class="r">Wine</th><th class="r">Beer</th><th class="r">Cover</th><th class="r" title="Total vs the same month a year earlier">% vs last year</th></tr></thead><tbody>'+mrows.map(function(r){ return '<tr><td>'+esc(mlabel(r.m))+'</td><td class="r"><b>'+$(r.total)+'</b></td><td class="r">'+$(r.liquor)+'</td><td class="r">'+$(r.wine)+'</td><td class="r">'+$(r.beer)+'</td><td class="r">'+$(r.cover)+'</td>'+pcell(r.chg)+'</tr>'; }).join('')+'</tbody></table><div class="pg">'+(MPAGE*MPER+1)+'–'+Math.min(D.monthly.length,(MPAGE+1)*MPER)+' of '+D.monthly.length+' <button class="obtn" id="mPrev"'+(MPAGE?'':' disabled')+'>‹</button><button class="obtn" id="mNext"'+(MPAGE<pages-1?'':' disabled')+'>›</button></div></div>';
  h+='<div class="ocard"><div class="och"><b>Yearly data</b><span class="r"><button class="obtn" id="yExp">⬇ Export</button></span></div><table><thead><tr><th>Year</th><th class="r">Total</th><th class="r">Liquor</th><th class="r">Wine</th><th class="r">Beer</th><th class="r">Cover</th><th class="r">Months</th><th class="r" title="Total vs the prior year — partial years compare the same months">% vs prior year</th></tr></thead><tbody>'+D.yearly.map(function(r){ return '<tr><td>'+esc(r.y)+(r.ytd?' <span style="color:var(--soft);font-size:11px">YTD</span>':'')+'</td><td class="r"><b>'+$(r.total)+'</b></td><td class="r">'+$(r.liquor)+'</td><td class="r">'+$(r.wine)+'</td><td class="r">'+$(r.beer)+'</td><td class="r">'+$(r.cover)+'</td><td class="r">'+r.months+'</td>'+pcell(r.chg).replace('</td>',(r.chg!=null&&r.cmpN<12?'<div style="color:var(--soft);font-size:11px">'+r.cmpN+' matching mo</div>':'')+'</td>')+'</tr>'; }).join('')+'</tbody></table><div class="onote">Each year is compared only on the months filed in both years, so partial years are like-for-like. “—” = no prior-year filings to compare.</div></div>';
  h+='</div><div>';
  h+=holderCard();
  if((D.permitsHere||[]).length) h+='<div class="ocard"><div class="och"><b>Permits at this address</b><span class="h">TABC</span></div><table><thead><tr><th>Permit</th><th>Type</th><th>Status</th><th class="r">Issued</th></tr></thead><tbody>'+D.permitsHere.map(function(x){ var me=x.id===D.permit; return '<tr'+(me?' style="background:#f7f9fc"':'')+'><td><b>'+esc(x.id)+'</b>'+(me?' <span class="otag">this one</span>':'')+(x.trade&&x.trade!==D.name?('<div style="color:var(--soft);font-size:11.5px">'+esc(x.trade)+'</div>'):'')+'</td><td>'+esc(x.typeName||x.type||'—')+(x.typeName&&x.type?(' <span style="color:var(--soft)">('+esc(x.type)+')</span>'):'')+'</td><td>'+stPill(x.status)+'</td><td class="r" style="white-space:nowrap">'+esc(x.issued||'—')+'</td></tr>'; }).join('')+'</tbody></table></div>';
  var mx=D.mix12, mt=mx.liquor+mx.wine+mx.beer+mx.cover;
  h+='<div class="ocard"><div class="och"><b>Revenue mix</b><span class="h">last 12 months</span></div><div class="ocb"><div class="mixbar">'+CAT.map(function(c){ return mt?('<i style="width:'+(mx[c[0]]/mt*100).toFixed(1)+'%;background:'+c[2]+'"></i>'):''; }).join('')+'</div>'+CAT.map(function(c){ return '<div class="mixrow"><span class="sw" style="background:'+c[2]+'"></span><span>'+c[1]+'</span><b>'+$(mx[c[0]])+'</b><span style="color:var(--muted);width:46px;text-align:right">'+(mt?Math.round(mx[c[0]]/mt*1000)/10:0)+'%</span></div>'; }).join('')+'</div></div>';
  if(D.ranks){ h+='<div class="ocard"><div class="och"><b>Rankings</b><span class="h">'+esc(D.ranks.basis)+'</span></div><table><thead><tr><th>Category</th><th class="r">'+esc(D.ranks.city)+'</th><th class="r">Zip '+esc(D.ranks.zip)+'</th></tr></thead><tbody>'+D.ranks.rows.map(function(r){ return '<tr><td>'+esc(r.label)+'</td><td class="r"><b>'+ord(r.city.rank)+'</b> <span style="color:var(--soft)">of '+r.city.of.toLocaleString()+'</span></td><td class="r"><b>'+ord(r.zip.rank)+'</b> <span style="color:var(--soft)">of '+r.zip.of.toLocaleString()+'</span></td></tr>'; }).join('')+'</tbody></table></div>'; }
  if(chainN>1) h+='<div class="ocard"><div class="och"><b>All '+chainN+' locations</b><span class="h">same owner · last 12 months</span></div><table><tbody>'+D.chain.map(function(c){ var me=c.permit===D.permit; return '<tr'+(me?' style="background:#f7f9fc"':'')+'><td>'+(me?'<b>'+esc(c.name)+'</b> <span class="otag">this one</span>':('<a href="./rrg_tx_operator.html?permit='+encodeURIComponent(c.permit)+'" style="color:#23496f;font-weight:700;text-decoration:none">'+esc(c.name)+'</a>'))+'<div style="color:var(--soft);font-size:11.5px">'+esc([c.address,c.city].filter(Boolean).join(', '))+'</div></td><td class="r">'+$(c.t12)+'<div style="color:var(--soft);font-size:11px">last '+esc(c.last)+'</div></td></tr>'; }).join('')+'</tbody></table></div>';
  h+='</div></div><div class="onote">Source: '+esc(D.source||'State')+' mixed-beverage gross receipts and permit records. Mixed-beverage receipts cover alcohol sold for on-premise consumption — not food. Filings lag one to two months.</div>';
  a.innerHTML=h;
  var mp=document.getElementById('mPrev'), mn=document.getElementById('mNext'); if(mp) mp.onclick=function(){ MPAGE=Math.max(0,MPAGE-1); render(); }; if(mn) mn.onclick=function(){ MPAGE++; render(); };
  var cols=[['Period','m'],['Total','total'],['Liquor','liquor'],['Wine','wine'],['Beer','beer'],['Cover','cover']];
  var chgCol=[['% change vs prior year','chg']];
  document.getElementById('mExp').onclick=function(){ csv(D.monthly,cols.concat(chgCol),'Monthly_'+D.permit+'.csv'); };
  document.getElementById('yExp').onclick=function(){ csv(D.yearly,[['Year','y']].concat(cols.slice(1)).concat([['Months','months']]).concat(chgCol),'Yearly_'+D.permit+'.csv'); };
  var cb=document.getElementById('cmpBtn'); if(cb) cb.onclick=function(){ var a=[], nm={}; try{ a=JSON.parse(localStorage.getItem('rrg_txcmp_v1')||'[]'); nm=JSON.parse(localStorage.getItem('rrg_txcmp_names_v1')||'{}')||{}; }catch(e){} if(!Array.isArray(a)) a=[]; if(a.indexOf(D.permit)<0){ if(a.length>=5) a=a.slice(1); a.push(D.permit); } nm[D.permit]=D.name; try{ localStorage.setItem('rrg_txcmp_v1',JSON.stringify(a)); localStorage.setItem('rrg_txcmp_names_v1',JSON.stringify(nm)); }catch(e){} location.href='./rrg_tx_compare.html?permits='+encodeURIComponent(a.join(',')); };
  var cc=document.getElementById('cpyContact'); if(cc) cc.onclick=function(){ try{ navigator.clipboard.writeText(contactText()).then(function(){ cc.textContent='Copied ✓'; setTimeout(function(){ cc.textContent='Copy'; },1500); }); }catch(e){} };
  var ac2=document.getElementById('addCrm'); if(ac2) ac2.onclick=function(){ var L=D.license||{}; ac2.disabled=true; ac2.textContent='Adding…';
    var nm=(L.owner||D.taxpayer||D.name).replace(/\s+/g,' ').trim();
    var notes='From Alcohol Sales (state filings).\nLocation: '+D.name+' — '+[D.address,D.city,'TX '+String(D.zip||'').slice(0,5)].join(', ')+'\nTABC permit '+D.permit+(L.typeName?(' ('+L.typeName+')'):'')+(L.status?(' · '+L.status):'')+(L.phone?('\nPhone: '+fmtPhone(L.phone)):'')+((L.mailing||D.taxpayerMail)?('\nMailing: '+(L.mailing||D.taxpayerMail)):'')+'\nTrailing 12 alcohol sales: '+$(D.periods.year.total);
    fetch('/api/company',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:nm,market:D.city?D.city.replace(/\b\w/g,function(c){return c.toUpperCase();}).replace(/\B\w/g,function(c){return c.toLowerCase();}):'',notes:notes,leadSource:'Alcohol Sales'})}).then(function(r){return r.json();}).then(function(j){
      if(j&&j.ok&&(j.company||j.id)){ var c=j.company||{id:j.id,name:nm}; D.crm.companies=[{id:c.id,name:c.name||nm}]; render(); }
      else if(j&&j.existingId){ D.crm.companies=[{id:j.existingId,name:(j.existing&&j.existing.name)||nm}]; render(); }
      else { ac2.disabled=false; ac2.textContent='＋ Add to CRM'; var m=document.createElement('span'); m.className='ksub'; m.style.cssText='display:block;color:#a5352c;margin-top:6px;width:100%'; m.textContent=(j&&j.error)||'Could not add.'; ac2.parentNode.appendChild(m); } }); };
  var ab=document.getElementById('aiBtn'); if(ab) ab.onclick=function(){ if(D.aiSummary&&!D.aiSummary.stale){ var c=document.getElementById('aiCard'); if(c){ c.scrollIntoView({behavior:'smooth',block:'nearest'}); return; } } runAi(!!(D.aiSummary&&D.aiSummary.stale)); };
  var ar=document.getElementById('aiRegen'); if(ar) ar.onclick=function(){ runAi(true); };
  var ac=document.getElementById('aiCopy'); if(ac) ac.onclick=function(){ var t=D.name+' — AI summary\n\n'+String(D.aiSummary.text||'').replace(/\*\*/g,''); try{ navigator.clipboard.writeText(t).then(function(){ ac.textContent='Copied ✓'; setTimeout(function(){ ac.textContent='Copy'; },1500); }); }catch(e){} };
  var tb=document.getElementById('trackBtn'); if(tb) tb.onclick=function(){ tb.disabled=true; tb.textContent='Adding…'; fetch('/api/tx/radar/track',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:D.name,address:D.address,permit:D.permit,city:D.city,detail:'Trailing 12 '+$(P.year.total)+(P.year.chg!=null?(' ('+(P.year.chg>0?'+':'')+P.year.chg+'% vs prior year)'):'')})}).then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ D.trackedSpaceId=j.spaceId; render(); } else { tb.disabled=false; tb.textContent='Track as space'; } }); };
}
load();
