<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullServe — Pipeline Board</title>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--ink:#1a2236;--muted:#6b7488;--soft:#8a93a8;--line:#e6e9f0;--wash:#f5f7fb;--green:#1f8a5b;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#eef1f6;height:100%;}
body{display:flex;flex-direction:column;}
.top,#toolbar,#filterpanel{flex:none;}
#root{flex:1 1 auto;min-height:0;overflow:auto;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);}
.top{max-width:100%;padding:12px 26px 5px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.pgh{font-size:17px;font-weight:700;color:var(--navy);margin:0;}
.psel{font:inherit;font-size:12.5px;font-weight:700;color:var(--navy);border:1px solid var(--line);border-radius:3px;padding:7px 10px;background:#fff;cursor:pointer;}
.tot{font-size:12.5px;color:var(--muted);font-weight:600;margin-left:auto;}
/* toolbar */
.tb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 26px 6px;position:relative;}
.tb .search{position:relative;}
.tb .search input{font:inherit;font-size:12.5px;padding:7px 12px 7px 30px;border:1px solid var(--inp);border-radius:3px;background:#fff;min-width:230px;color:var(--ink);}
.tb .search .mag{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#9aa4b6;font-size:13px;}
.tbtn{font:inherit;font-size:12px;font-weight:600;color:#26324a;background:#fff;border:1px solid var(--inp);border-radius:3px;padding:7px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
.tbtn:hover{background:#f4f7fb;} .tbtn.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.tbtn .pip{background:var(--red);color:#fff;border-radius:100px;font-size:10px;font-weight:800;padding:0 6px;line-height:16px;min-width:16px;text-align:center;}
.tbsel{font:inherit;font-size:12px;font-weight:600;color:#26324a;border:1px solid var(--inp);border-radius:3px;padding:7px 9px;background:#fff;cursor:pointer;}
.tblabel{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#8a94a6;font-weight:700;margin-left:6px;}
.filterpanel{display:none;flex-wrap:wrap;align-items:flex-end;gap:10px 12px;margin:2px 26px 8px;padding:11px 13px;background:var(--wash);border:1px solid var(--line);border-radius:4px;}
.filterpanel.open{display:flex;}
.ff{display:flex;flex-direction:column;gap:4px;} .ff label{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:#8a94a6;font-weight:700;}
.ff input,.ff select{border:1px solid var(--inp);border-radius:3px;padding:6px 9px;font:inherit;font-size:12.5px;min-width:130px;background:#fff;color:var(--ink);}
.ff.num input{min-width:96px;}
.fclear{font-size:11.5px;color:#5b6472;text-decoration:underline;cursor:pointer;background:none;border:none;padding:6px 4px;}
.savemenu{position:absolute;z-index:60;top:calc(100% - 2px);background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 8px 24px rgba(12,22,54,.14);padding:8px;min-width:250px;max-height:320px;overflow:auto;}
.savemenu .srow{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:3px;font-size:13px;color:#26324a;}
.savemenu .srow:hover{background:#f4f7fb;} .savemenu .sname{flex:1;cursor:pointer;} .savemenu .sdel{border:none;background:none;color:#c7cedb;cursor:pointer;font-size:15px;} .savemenu .sdel:hover{color:var(--red);}
.savemenu .shd{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#98a1b5;font-weight:800;padding:4px 9px 6px;} .savemenu .sempty{font-size:12px;color:#98a1b5;padding:6px 9px;}
.savemenu .saverow{display:flex;gap:6px;padding:8px 6px 2px;border-top:1px solid #eef1f6;margin-top:4px;}
.savemenu .saverow input{flex:1;border:1px solid var(--inp);border-radius:3px;padding:6px 8px;font:inherit;font-size:12.5px;}
.savemenu .saverow button{font:inherit;font-size:12px;font-weight:600;background:var(--primary);color:#fff;border:none;border-radius:3px;padding:6px 11px;cursor:pointer;}
.board{display:flex;gap:10px;padding:6px 24px 14px;overflow-x:auto;overflow-y:hidden;align-items:flex-start;height:100%;}
.col{flex:0 0 274px;background:#eef1f5;border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;max-height:100%;}
.col.dragover{background:#e7eefb;border-color:#9fb6e6;box-shadow:inset 0 0 0 2px #9fb6e6;}
.colh{padding:10px 13px 7px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#eef1f5;border-radius:4px 4px 0 0;z-index:2;}
.colh .nm{font-size:12.5px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:8px;}
.colh .cnt{font-size:11px;font-weight:700;color:#6b7488;background:#dfe4ec;border-radius:3px;padding:1px 7px;}
.colh .sum{font-size:12px;color:var(--green);font-weight:700;margin-top:4px;}
.colb{padding:10px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:9px;}
.cardx{background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 11px;box-shadow:none;cursor:grab;text-decoration:none;color:inherit;display:block;}
.cardx:hover{border-color:#c4ccda;box-shadow:0 2px 6px rgba(16,24,40,.07);}
.cardx.dragging{opacity:.4;}
.cardx .t{font-size:13px;font-weight:700;color:var(--navy);line-height:1.3;margin-bottom:6px;}
.pvbadge{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:#fdf1df;color:#b5791f;border:1px solid #eddab0;vertical-align:middle;}
.cardx .r{display:flex;align-items:center;gap:6px;font-size:12px;color:#5b6472;margin-top:3px;}
.cardx .r .ic{width:13px;text-align:center;color:#9aa4b6;flex:none;}
.cardx .val{color:var(--navy);font-weight:700;}
.cardx .ft{display:flex;align-items:center;justify-content:space-between;margin-top:9px;padding-top:8px;border-top:1px solid #f0f2f7;}
.cardx .dt{font-size:11px;color:#98a1b5;}
.cardx .av{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.showmore{margin-top:2px;font:inherit;font-size:12px;font-weight:600;color:var(--navy);background:#e6e9f1;border:none;border-radius:3px;padding:7px;cursor:pointer;} .showmore:hover{background:#dde3ef;}
.colempty{color:#a7b0c0;font-size:12px;text-align:center;padding:14px 6px;}
.gate{max-width:520px;margin:70px auto;text-align:center;color:var(--muted);}
.vtog{display:inline-flex;border:1px solid var(--inp);border-radius:3px;overflow:hidden;margin-right:2px;}
.vbtn{background:#fff;border:none;padding:7px 12px;font:inherit;font-size:12.5px;font-weight:700;color:#6b7488;cursor:pointer;}
.vbtn.on{background:var(--navy,#000E31);color:#fff;}
.listwrap{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px 16px;margin:0 20px;}
.lstage{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;background:#eef2fb;color:#2647b0;}
.dbtn{background:#fff;border:none;padding:7px 11px;font:inherit;font-size:12.5px;font-weight:700;color:#6b7488;cursor:pointer;}
.dbtn.on{background:var(--navy,#000E31);color:#fff;}
.cardx .chd{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.cardx.compact{cursor:pointer;}
.cardx.compact .t{margin-bottom:0;}
.cardx.compact .cbody{display:none;margin-top:8px;padding-top:8px;border-top:1px solid #f0f2f7;}
.cardx.compact.expanded .cbody{display:block;}
.cardx .opendeal{font-size:11px;font-weight:700;color:var(--navy,#000E31);text-decoration:none;white-space:nowrap;}
.cardx .opendeal:hover{text-decoration:underline;}
.cfrow{display:flex;align-items:center;gap:7px;padding:5px 9px;font-size:13px;color:#26324a;cursor:pointer;border-radius:7px;}
.cfrow:hover{background:#f4f7fb;}
/* --- enhanced pipeline cards --- */
.cardx .chd{display:flex;align-items:flex-start;gap:6px;margin-bottom:6px;}
.cardx .chd .t{flex:1;margin-bottom:0;}
.cardx .rollup{flex:none;border:none;background:none;cursor:pointer;color:#9aa4b6;font-size:12px;line-height:1;padding:2px 3px;transition:transform .15s;border-radius:5px;}
.cardx .rollup:hover{color:#5b6472;background:#f1f3f8;}
.cardx.rolled .rollup{transform:rotate(-90deg);}
.cardx.rolled .cbody{display:none;}
.cardx .contactlink{color:var(--navy,#000E31);text-decoration:none;font-weight:600;}
.cardx .contactlink:hover{text-decoration:underline;}
.cardx .flags{display:inline-flex;gap:4px;flex:none;align-items:center;}
.fbadge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 2px;border-radius:50%;font-size:11px;font-weight:800;line-height:1;}
.fbadge.hv{background:#d1f4e0;color:#0e7a53;}
.fbadge.slip{background:#fde7cf;color:#b5651d;}
.flagmenu{min-width:288px;}
.flagmenu .flagrow{padding:8px 9px;border-radius:8px;}
.flagmenu .flagrow+.flagrow{border-top:1px solid #eef1f6;margin-top:2px;}
.flagmenu .flaghint{font-size:11.5px;color:#98a1b5;margin:2px 0 7px 24px;line-height:1.35;}
.flagmenu .flaginp{display:flex;align-items:center;gap:6px;margin-left:24px;}
.flagmenu .flaginp span{font-size:12px;color:#8a94a6;font-weight:700;}
.flagmenu .flaginp input{flex:1;border:1px solid var(--inp);border-radius:3px;padding:6px 9px;font:inherit;font-size:13px;}
.bmodal{position:fixed;inset:0;background:rgba(6,14,32,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.bmodal[hidden]{display:none;}
.bmodalcard{background:#fff;border-radius:6px;max-width:460px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.4);overflow:hidden;}
.bmodalh{padding:17px 22px;border-bottom:1px solid #e6e9f0;font-size:16px;font-weight:800;color:#000E31;}
.bmodalb{padding:18px 22px;}
.bmfld{display:block;font-size:12px;font-weight:700;color:#66738f;margin:0 0 5px;}
.bmodalb input{width:100%;border:1px solid var(--inp);border-radius:3px;padding:10px 12px;font:inherit;font-size:14px;color:#000E31;margin-bottom:13px;}
.bmodalnote{font-size:12px;color:#66738f;line-height:1.5;background:var(--wash);border:1px solid var(--line);border-radius:4px;padding:10px 12px;}
.bmodalf{padding:15px 22px;border-top:1px solid #e6e9f0;display:flex;justify-content:flex-end;gap:10px;}
.bmbtn{border:none;border-radius:3px;padding:9px 16px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;background:var(--navy);color:#fff;}
.bmbtn.ghost{background:#fff;color:var(--navy);border:1px solid var(--inp);}
.pgtitle{font-size:17px;font-weight:800;color:var(--navy,#000E31);letter-spacing:-.01em;margin-right:8px;white-space:nowrap;align-self:center;}
</style>
<script src="/rrg_brand.js"></script>
<script src="/rrg_list.js"></script>
</head>
<body>
<div class="top">
  <h1 class="pgh">Pipeline Board</h1>
  <select class="psel" id="psel"></select>
  <span class="tot" id="tot"></span>
</div>
<div id="toolbar"></div>
<div id="filterpanel"></div>
<div id="root"><div class="gate">Loading…</div></div>
<div id="dealModal" class="bmodal" hidden><div class="bmodalcard">
  <div class="bmodalh">New listing</div>
  <div class="bmodalb">
    <label class="bmfld">Business / listing name</label><input id="nd_business" placeholder="e.g. Blue Agave Cantina">
    <label class="bmfld">Market</label><input id="nd_market" placeholder="e.g. Austin, TX" autocomplete="off">
    <label class="bmfld">Seller / client contact</label><input id="nd_contact" list="clientList" placeholder="Start typing to find an existing client…" autocomplete="off" oninput="updateClientHint()">
    <datalist id="clientList"></datalist>
    <div class="bmodalnote" id="clientHint">Creating a listing builds its data room automatically and links the client to your registry — a matching client is reused, a new one is onboarded.</div>
  </div>
  <div class="bmodalf"><button class="bmbtn ghost" onclick="closeDealModal()">Cancel</button><button id="nd_create" class="bmbtn" onclick="createDeal()">Create listing</button></div>
</div></div>

<script>
var DATA=null, PID='', DRAGKEY='';
var VIEW=(function(){ try{ return localStorage.getItem('rrg_board_view')||'board'; }catch(e){ return 'board'; } })(), LTBL=null;
var TB={ q:'', owner:'', market:'', status:'', min:'', max:'', sort:'act_desc', per:25 };
var FILTER_OPEN=false, SAVE_OPEN=false, EXPANDED={};
var DENSITY=(function(){try{return localStorage.getItem('rrg_board_density')||'full';}catch(e){return 'full';}})();
var CARDF=(function(){var d={contact:true,value:true,commission:true,days:true,market:true,status:false,bbs:false,activity:true};try{var o=JSON.parse(localStorage.getItem('rrg_board_cardf')||'null');if(o&&typeof o==='object')return Object.assign(d,o);}catch(e){}return d;})();
var CARDF_OPEN=false, EXPCARD={};
var ROLLED=(function(){try{return JSON.parse(localStorage.getItem('rrg_board_rolled')||'{}')||{};}catch(e){return {};}})();
function saveROLLED(){ try{ localStorage.setItem('rrg_board_rolled',JSON.stringify(ROLLED)); }catch(e){} }
var FLAGS=(function(){var d={highValue:{on:true,amount:'200000'},slipping:{on:true,days:'30'}};try{var g=JSON.parse(localStorage.getItem('rrg_board_flags')||'null');if(g&&typeof g==='object'){ if(g.highValue) d.highValue=Object.assign(d.highValue,g.highValue); if(g.slipping) d.slipping=Object.assign(d.slipping,g.slipping);} }catch(e){}return d;})();
function saveFLAGS(){ try{ localStorage.setItem('rrg_board_flags',JSON.stringify(FLAGS)); }catch(e){} }
var FLAGS_OPEN=false;
var SORTS=[['act_desc','Newest activity'],['act_asc','Oldest activity'],['val_desc','Value: high → low'],['val_asc','Value: low → high'],['name_asc','Name: A → Z'],['created_desc','Newest listing']];
var PER_OPTS=[10,25,50,0];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function money(v){ var m=String(v==null?'':v).replace(/[, ]/g,'').match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):0; }
function fmtMoney(n){ if(!n) return ''; return (window.RRG_CCYSYM||String.fromCharCode(36))+Math.round(n).toLocaleString('en-US'); }
function fmtDate(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d.getTime())) return String(iso).slice(0,10); return (d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(2); }
function initials(s){ s=String(s||'').trim(); if(!s) return '?'; var p=s.split(/\s+/); return ((p[0]||'')[0]||'').toUpperCase()+((p.length>1?(p[p.length-1][0]||''):'')).toUpperCase(); }
function tbKey(){ return 'rrgboard_'+(PID||'x'); }
function loadTB(){ try{ var o=JSON.parse(localStorage.getItem(tbKey())||'{}'); if(o&&typeof o==='object'){ TB=Object.assign({ q:'',owner:'',market:'',status:'',min:'',max:'',sort:'act_desc',per:25 },o); } }catch(e){} }
function saveTB(){ try{ localStorage.setItem(tbKey(),JSON.stringify(TB)); }catch(e){} }
function savedViews(){ try{ return JSON.parse(localStorage.getItem('rrgboard_saved')||'{}')||{}; }catch(e){ return {}; } }
function setSavedViews(o){ try{ localStorage.setItem('rrgboard_saved',JSON.stringify(o)); }catch(e){} }
function distinct(field){ var seen={}, out=[]; (DATA&&DATA.cards||[]).forEach(function(c){ var v=String(c[field]||'').trim(); if(v&&!seen[v]){ seen[v]=1; out.push(v); } }); out.sort(function(a,b){return a.toLowerCase()<b.toLowerCase()?-1:1;}); return out; }
function activeFilterCount(){ var n=0; ['owner','market','status'].forEach(function(k){ if(TB[k]) n++; }); if(TB.min!=='') n++; if(TB.max!=='') n++; return n; }
function passFilters(c){
  if(TB.owner && String(c.owner||'')!==TB.owner) return false;
  if(TB.market && String(c.market||'')!==TB.market) return false;
  if(TB.status && String(c.status||'')!==TB.status) return false;
  var v=money(c.value);
  if(TB.min!=='' && !isNaN(Number(TB.min)) && v<Number(TB.min)) return false;
  if(TB.max!=='' && !isNaN(Number(TB.max)) && v>Number(TB.max)) return false;
  if(TB.q){ var q=TB.q.toLowerCase(); var hay=[c.company,c.business,c.concept,c.contact,c.market,c.owner,c.status,c.stage].join(' ').toLowerCase(); if(hay.indexOf(q)<0) return false; }
  return true;
}
function sortCards(arr){
  var s=TB.sort; var a=arr.slice();
  a.sort(function(x,y){
    if(s==='val_desc') return money(y.value)-money(x.value);
    if(s==='val_asc') return money(x.value)-money(y.value);
    if(s==='name_asc'){ var xn=String(x.business||'').toLowerCase(), yn=String(y.business||'').toLowerCase(); return xn<yn?-1:(xn>yn?1:0); }
    if(s==='created_desc') return String(y.createdAt||'').localeCompare(String(x.createdAt||''));
    if(s==='act_asc') return String(x.lastActivity||'').localeCompare(String(y.lastActivity||''));
    return String(y.lastActivity||'').localeCompare(String(x.lastActivity||'')); // act_desc default
  });
  return a;
}
function load(){
  fetch('/api/board'+(PID?('?pipelineId='+encodeURIComponent(PID)):''),{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){
    if(!j||!j.ok){ document.getElementById('root').innerHTML='<div class="gate">Could not load the board.</div>'; return; }
    DATA=j; PID=j.pipelineId; loadTB(); EXPANDED={};
    var sel=document.getElementById('psel');
    sel.innerHTML=(j.pipelines||[]).map(function(p){ return '<option value="'+esc(p.id)+'"'+(p.id===PID?' selected':'')+'>'+esc(p.name)+'</option>'; }).join('');
    renderToolbar(); render();
  }).catch(function(){ document.getElementById('root').innerHTML='<div class="gate">Could not reach the server.</div>'; });
}
var PEOPLE=[];
function loadPeople(){ fetch('/api/people',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){ PEOPLE=(j&&j.people)||[]; var dl=document.getElementById('clientList'); if(dl) dl.innerHTML=PEOPLE.map(function(p){ return '<option value="'+esc(p.name)+'">'+esc(p.company||p.email||p.type||'')+'</option>'; }).join(''); }).catch(function(){}); }
function clientMatch(){ var v=(document.getElementById('nd_contact').value||'').trim().toLowerCase(); if(!v) return null; return PEOPLE.filter(function(p){ return (p.name||'').toLowerCase()===v; })[0]||null; }
function updateClientHint(){ var h=document.getElementById('clientHint'); if(!h) return; var m=clientMatch(); if(m){ h.innerHTML='✓ Linking to existing client <b>'+esc(m.name)+'</b>'+(m.company?(' · '+esc(m.company)):'')+'. This listing joins their record.'; } else if((document.getElementById('nd_contact').value||'').trim()){ h.innerHTML='New client — <b>'+esc(document.getElementById('nd_contact').value.trim())+'</b> will be onboarded into your registry.'; } else { h.innerHTML='Creating a listing builds its data room automatically and links the client to your registry — a matching client is reused, a new one is onboarded.'; } }
function openDealModal(){ var m=document.getElementById('dealModal'); if(!m) return; m.removeAttribute('hidden'); var b=document.getElementById('nd_business'); if(b) b.focus(); loadPeople(); }
function closeDealModal(){ var m=document.getElementById('dealModal'); if(!m) return; m.setAttribute('hidden',''); ['nd_business','nd_market','nd_contact'].forEach(function(id){var _e=document.getElementById(id); if(_e) _e.value='';}); updateClientHint(); }
function createDeal(){ var business=(document.getElementById('nd_business').value||'').trim(); if(!business){ document.getElementById('nd_business').focus(); return; } var contact=(document.getElementById('nd_contact').value||'').trim(); if(!contact){ document.getElementById('nd_contact').focus(); var _h=document.getElementById('clientHint'); if(_h) _h.innerHTML='<b style="color:#DA2B1F">A client contact is required — every listing must be linked to a contact.</b>'; return; } var btn=document.getElementById('nd_create'); btn.disabled=true; btn.textContent='Creating…'; fetch('/api/deal/new',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({business:business,market:(document.getElementById('nd_market').value||'').trim(),contact:contact,type:'listing'})}).then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ location.href='./rrg_assignment.html?key='+encodeURIComponent(j.key); } else { btn.disabled=false; btn.textContent='Create listing'; alert((j&&j.error)||'Could not create the listing.'); } }).catch(function(){ btn.disabled=false; btn.textContent='Create listing'; alert('Could not reach the server.'); }); }
function renderToolbar(){
  var vc=activeFilterCount();
  var perLabel=function(p){ return p===0?'All':String(p); };
  var html='<div class="tb">'+'<span class="pgtitle">Listings</span>'+'<button class="tbtn" id="tb_newlisting" style="background:#000E31;color:#fff;border-color:#000E31;font-weight:800">+ New Listing</button>'
    +'<div class="vtog"><button class="vbtn'+(VIEW==='board'?' on':'')+'" data-view="board">\u25a4 Board</button><button class="vbtn'+(VIEW==='list'?' on':'')+'" data-view="list">\u2630 List</button></div>'
    +'<div class="search"><span class="mag">⌕</span><input id="tb_q" placeholder="Search listings…" value="'+esc(TB.q)+'"></div>'
    +'<button class="tbtn'+(FILTER_OPEN?' on':'')+'" id="tb_filter">☰ Filters'+(vc?(' <span class="pip">'+vc+'</span>'):'')+'</button>'
    +'<div style="position:relative;display:inline-block"><button class="tbtn" id="tb_saved">★ Saved views ▾</button><div id="savemenu"></div></div>'
    +'<span class="tblabel">Sort</span><select class="tbsel" id="tb_sort">'+SORTS.map(function(o){return '<option value="'+o[0]+'"'+(TB.sort===o[0]?' selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select>'
    +'<span class="tblabel">Per column</span><select class="tbsel" id="tb_per">'+PER_OPTS.map(function(p){return '<option value="'+p+'"'+(TB.per===p?' selected':'')+'>'+perLabel(p)+'</option>';}).join('')+'</select>'
    +'<span class="tblabel">Cards</span><div class="vtog"><button class="dbtn'+(DENSITY==='full'?' on':'')+'" data-density="full">Full</button><button class="dbtn'+(DENSITY==='compact'?' on':'')+'" data-density="compact">Compact</button></div>'
    +'<div style="position:relative;display:inline-block"><button class="tbtn" id="tb_cardf">\u2699 Card fields \u25be</button><div id="cardfmenu"></div></div>'
    +'<div style="position:relative;display:inline-block"><button class="tbtn" id="tb_flags">\u2691 Card flags \u25be</button><div id="flagmenu"></div></div>'
    +'</div>';
  document.getElementById('toolbar').innerHTML=html; var _nl=document.getElementById('tb_newlisting'); if(_nl) _nl.addEventListener('click',openDealModal);
  renderFilterPanel();
  // wire
  var q=document.getElementById('tb_q'); q.addEventListener('input',function(){ TB.q=q.value; saveTB(); debouncedRender(); });
  document.getElementById('tb_filter').addEventListener('click',function(){ FILTER_OPEN=!FILTER_OPEN; renderToolbar(); });
  document.getElementById('tb_sort').addEventListener('change',function(){ TB.sort=this.value; saveTB(); render(); });
  document.getElementById('tb_per').addEventListener('change',function(){ TB.per=Number(this.value); saveTB(); EXPANDED={}; render(); });
  document.getElementById('tb_saved').addEventListener('click',function(e){ e.stopPropagation(); SAVE_OPEN=!SAVE_OPEN; renderSaveMenu(); });
  document.querySelectorAll('.vbtn[data-view]').forEach(function(b){ b.addEventListener('click',function(){ VIEW=b.getAttribute('data-view'); try{localStorage.setItem('rrg_board_view',VIEW);}catch(e){} renderToolbar(); render(); }); });
  document.querySelectorAll('.dbtn[data-density]').forEach(function(b){ b.addEventListener('click',function(){ DENSITY=b.getAttribute('data-density'); try{localStorage.setItem('rrg_board_density',DENSITY);}catch(e){} renderToolbar(); render(); }); });
  var _cf=document.getElementById('tb_cardf'); if(_cf) _cf.addEventListener('click',function(e){ e.stopPropagation(); CARDF_OPEN=!CARDF_OPEN; renderCardfMenu(); });
  var _fl=document.getElementById('tb_flags'); if(_fl) _fl.addEventListener('click',function(e){ e.stopPropagation(); FLAGS_OPEN=!FLAGS_OPEN; renderFlagMenu(); });
}
function renderFilterPanel(){
  var host=document.getElementById('filterpanel');
  if(!FILTER_OPEN){ host.innerHTML=''; return; }
  function selOf(field,cur,ph){ return '<select data-ff="'+field+'"><option value="">'+ph+'</option>'+distinct(field).map(function(v){return '<option'+(cur===v?' selected':'')+'>'+esc(v)+'</option>';}).join('')+'</select>'; }
  host.innerHTML='<div class="filterpanel open">'
    +'<div class="ff"><label>Rep / owner</label>'+selOf('owner',TB.owner,'Anyone')+'</div>'
    +'<div class="ff"><label>Market</label>'+selOf('market',TB.market,'All markets')+'</div>'
    +'<div class="ff"><label>Status</label>'+selOf('status',TB.status,'Any status')+'</div>'
    +'<div class="ff num"><label>Min $</label><input data-ff="min" inputmode="numeric" value="'+esc(TB.min)+'" placeholder="0"></div>'
    +'<div class="ff num"><label>Max $</label><input data-ff="max" inputmode="numeric" value="'+esc(TB.max)+'" placeholder="Any"></div>'
    +'<button class="fclear" id="ff_clear">Clear filters</button>'
    +'</div>';
  host.querySelectorAll('[data-ff]').forEach(function(el){ var k=el.getAttribute('data-ff'); var ev=(el.tagName==='SELECT')?'change':'input'; el.addEventListener(ev,function(){ TB[k]=el.value; saveTB(); debouncedRender(); renderToolbarPipOnly(); }); });
  document.getElementById('ff_clear').addEventListener('click',function(){ TB.owner=TB.market=TB.status=TB.min=TB.max=''; TB.q=''; saveTB(); FILTER_OPEN=true; renderToolbar(); render(); });
}
function renderToolbarPipOnly(){ var b=document.getElementById('tb_filter'); if(!b) return; var vc=activeFilterCount(); b.innerHTML='☰ Filters'+(vc?(' <span class="pip">'+vc+'</span>'):''); }
function renderSaveMenu(){
  var host=document.getElementById('savemenu'); if(!host) return;
  if(!SAVE_OPEN){ host.innerHTML=''; host.className=''; return; }
  host.className='savemenu';
  var v=savedViews(); var names=Object.keys(v).sort();
  var rows=names.length?names.map(function(n){ return '<div class="srow"><span class="sname" data-apply="'+esc(n)+'">'+esc(n)+'</span><button class="sdel" data-del="'+esc(n)+'" title="Delete">×</button></div>'; }).join(''):'<div class="sempty">No saved views yet.</div>';
  host.innerHTML='<div class="shd">Saved views</div>'+rows+'<div class="saverow"><input id="sv_name" placeholder="Name this view"><button id="sv_save">Save</button></div>';
  host.querySelectorAll('[data-apply]').forEach(function(el){ el.addEventListener('click',function(){ applyView(el.getAttribute('data-apply')); }); });
  host.querySelectorAll('[data-del]').forEach(function(el){ el.addEventListener('click',function(e){ e.stopPropagation(); var vv=savedViews(); delete vv[el.getAttribute('data-del')]; setSavedViews(vv); renderSaveMenu(); }); });
  document.getElementById('sv_save').addEventListener('click',function(){ var nm=(document.getElementById('sv_name').value||'').trim(); if(!nm) return; var vv=savedViews(); vv[nm]={q:TB.q,owner:TB.owner,market:TB.market,status:TB.status,min:TB.min,max:TB.max,sort:TB.sort}; setSavedViews(vv); SAVE_OPEN=false; renderSaveMenu(); });
}
function applyView(name){ var v=savedViews()[name]; if(!v) return; TB=Object.assign(TB,{q:v.q||'',owner:v.owner||'',market:v.market||'',status:v.status||'',min:v.min||'',max:v.max||'',sort:v.sort||'act_desc'}); saveTB(); SAVE_OPEN=false; FILTER_OPEN=true; EXPANDED={}; renderToolbar(); render(); }
document.addEventListener('click',function(e){ if(SAVE_OPEN){ var m=document.getElementById('savemenu'); var b=document.getElementById('tb_saved'); if(m && !m.contains(e.target) && e.target!==b){ SAVE_OPEN=false; renderSaveMenu(); } } });
document.addEventListener('click',function(e){ if(CARDF_OPEN){ var m=document.getElementById('cardfmenu'); var b=document.getElementById('tb_cardf'); if(m && !m.contains(e.target) && e.target!==b && !(b&&b.contains(e.target))){ CARDF_OPEN=false; renderCardfMenu(); } } });
document.addEventListener('click',function(e){ if(FLAGS_OPEN){ var m=document.getElementById('flagmenu'); var b=document.getElementById('tb_flags'); if(m && !m.contains(e.target) && e.target!==b && !(b&&b.contains(e.target))){ FLAGS_OPEN=false; renderFlagMenu(); } } });
var _rt=null; function debouncedRender(){ if(_rt) clearTimeout(_rt); _rt=setTimeout(render,140); }
function renderList(cards){
  var root=document.getElementById('root');
  if(!document.getElementById('boardlist')){ root.innerHTML='<div class="listwrap"><div id="boardlist"></div></div>'; LTBL=null; }
  var cfg={ mount:'#boardlist', data:cards, key:'boardlist', rowId:function(c){return c.key;},
    empty:'<div style="padding:26px;text-align:center;color:#8a94a6">No deals match your filters.</div>',
    columns:[
      { label:'Company', sort:function(a,b){return RRGList.cmp(a.company||a.business,b.company||b.business);}, cell:function(c){ var href=c.companyId?('./rrg_company.html?id='+encodeURIComponent(c.companyId)):('./rrg_assignment.html?key='+encodeURIComponent(c.key)); return '<a href="'+href+'" style="color:var(--navy,#000E31);font-weight:700;text-decoration:none">'+esc(c.company||c.business||'Listing')+'</a>'; } },
      { label:'Concept', sort:function(a,b){return RRGList.cmp(a.concept||a.business,b.concept||b.business);}, cell:function(c){ var cc=c.concept||c.business; return cc?('<a href="./rrg_assignment.html?key='+encodeURIComponent(c.key)+'" style="color:var(--navy,#000E31);text-decoration:none" title="Open listing">'+esc(cc)+'</a>'):'<span style="color:#b0b8c6">—</span>'; } },
      { label:'Stage', sort:function(a,b){return RRGList.cmp(a.stage,b.stage);}, cell:function(c){ return '<span class="lstage">'+esc(c.stage||'—')+'</span>'; } },
      { label:'Contact', sort:function(a,b){return RRGList.cmp(a.contact,b.contact);}, cell:function(c){ if(!c.contact) return '<span style="color:#b0b8c6">—</span>'; return c.contactPersonId?('<a href="./rrg_person.html?id='+encodeURIComponent(c.contactPersonId)+'" style="color:var(--navy,#000E31);text-decoration:none">'+esc(c.contact)+'</a>'):esc(c.contact); } },
      { label:'Market', sort:function(a,b){return RRGList.cmp(a.market,b.market);}, cell:function(c){ return c.market?esc(c.market):'<span style="color:#b0b8c6">—</span>'; } },
      { label:'Value', sort:function(a,b){return money(a.value)-money(b.value);}, cell:function(c){ return c.value?esc(String(c.value)):'<span style="color:#b0b8c6">—</span>'; } },
      { label:'Status', sort:function(a,b){return RRGList.cmp(a.status,b.status);}, cell:function(c){ return c.status?('<span class="lstage" style="background:#eef1f6;color:#5b6472">'+esc(c.status)+'</span>'):'<span style="color:#b0b8c6">—</span>'; } },
      { label:'BBS #', defaultHidden:true, sort:function(a,b){return RRGList.cmp(a.bbsNumber,b.bbsNumber);}, cell:function(c){ return c.bbsNumber?esc(c.bbsNumber):'<span style="color:#b0b8c6">—</span>'; } },
      { label:'Owner', sort:function(a,b){return RRGList.cmp(a.owner,b.owner);}, cell:function(c){ return c.owner?esc(c.owner):'<span style="color:#b0b8c6">—</span>'; } },
      { label:'Last activity', sort:function(a,b){return RRGList.cmp(a.lastActivity||'',b.lastActivity||'');}, cell:function(c){ return c.lastActivity?esc(fmtDate(c.lastActivity)):'<span style="color:#b0b8c6">—</span>'; } }
    ],
    bulk:[ { label:'Delete selected', danger:true, fn:function(ids,done){ bulkDelListings(ids,done); } } ]
  };
  if(LTBL) LTBL.refresh(cards); else LTBL=RRGList.create(cfg);
}
async function bulkDelListings(ids,done){
  if(!ids||!ids.length) return;
  var _msg='Delete '+ids.length+' listing'+(ids.length>1?'s':'')+'? This removes the listing and its records — this cannot be undone.';
  var _ok = window.rrgConfirm ? (await rrgConfirm(_msg)) : window.confirm(_msg);
  if(!_ok) return;
  var n=0, okc=0;
  ids.forEach(function(key){
    fetch('/api/assignment/'+encodeURIComponent(key),{method:'DELETE',credentials:'same-origin'}).then(function(r){return r.json();})
      .then(function(j){ if(j&&j.ok) okc++; }).catch(function(){})
      .then(function(){ if(++n===ids.length){ if(done)done(); if(window.rrgToast) rrgToast('Deleted '+okc+' listing'+(okc===1?'':'s')); load(); } });
  });
}

function render(){
  if(!DATA){ return; }
  var stages=DATA.stages||[]; var all=(DATA.cards||[]);
  var filtered=sortCards(all.filter(passFilters));
  var byStage={}; stages.forEach(function(s){ byStage[s]=[]; });
  filtered.forEach(function(c){ (byStage[c.stage]||(byStage[c.stage]=[])).push(c); });
  var totalVal=filtered.reduce(function(a,c){return a+money(c.value);},0);
  document.getElementById('tot').textContent=filtered.length+' of '+all.length+' · '+fmtMoney(totalVal);
  if(VIEW==='list'){ renderList(filtered); return; }   // List toggle → full scrolling list (like Contacts/Companies)
  if(!stages.length){ document.getElementById('root').innerHTML='<div class="gate">This pipeline has no stages yet. Add stages in <b>Admin → Pipelines</b>.</div>'; return; }
  var per=TB.per;
  var cols=stages.map(function(st){
    var list=byStage[st]||[]; var sum=list.reduce(function(a,c){return a+money(c.value);},0);
    var cap=(per>0 && !EXPANDED[st])?per:list.length;
    var shown=list.slice(0,cap);
    var cardsHtml=list.length?shown.map(cardHtml).join(''):'<div class="colempty">Drop deals here</div>';
    var more=(list.length>cap)?('<button class="showmore" data-more="'+esc(st)+'">+ '+(list.length-cap)+' more</button>'):'';
    return '<div class="col" data-stage="'+esc(st)+'"><div class="colh"><div class="nm">'+esc(st)+' <span class="cnt">'+list.length+'</span></div>'+(sum?('<div class="sum">'+fmtMoney(sum)+'</div>'):'')+'</div><div class="colb" data-stage="'+esc(st)+'">'+cardsHtml+more+'</div></div>';
  }).join('');
  document.getElementById('root').innerHTML='<div class="board">'+cols+'</div>';
  document.querySelectorAll('[data-more]').forEach(function(el){ el.addEventListener('click',function(ev){ ev.preventDefault(); EXPANDED[el.getAttribute('data-more')]=true; render(); }); });
  wireDnD();
}
var CARDF_FIELDS=[['contact','Contact'],['value','Value'],['commission','Commission'],['days','Days in stage'],['market','Market'],['status','Status'],['bbs','BBS #'],['activity','Last activity']];
function saveCARDF(){ try{ localStorage.setItem('rrg_board_cardf',JSON.stringify(CARDF)); }catch(e){} }
function renderCardfMenu(){
  var host=document.getElementById('cardfmenu'); if(!host) return;
  if(!CARDF_OPEN){ host.innerHTML=''; host.className=''; return; }
  host.className='savemenu';
  host.innerHTML='<div class="shd">Show on cards</div>'+CARDF_FIELDS.map(function(f){ return '<label class="cfrow"><input type="checkbox" data-cf="'+f[0]+'"'+(CARDF[f[0]]?' checked':'')+'> '+esc(f[1])+'</label>'; }).join('');
  host.querySelectorAll('input[data-cf]').forEach(function(cb){ cb.addEventListener('change',function(){ CARDF[cb.getAttribute('data-cf')]=cb.checked; saveCARDF(); render(); }); });
}
function renderFlagMenu(){
  var host=document.getElementById('flagmenu'); if(!host) return;
  if(!FLAGS_OPEN){ host.innerHTML=''; host.className=''; return; }
  host.className='savemenu flagmenu';
  var sym=(window.RRG_CCYSYM||String.fromCharCode(36));
  host.innerHTML='<div class="shd">Pipeline card flags</div>'
    +'<div class="flagrow"><label class="cfrow"><input type="checkbox" data-flag="highValue"'+(FLAGS.highValue.on?' checked':'')+'> <b>High Value</b></label><div class="flaghint">Flag cards that have a value greater than or equal to a set amount.</div><div class="flaginp"><span>'+esc(sym)+'</span><input type="text" inputmode="numeric" data-flagamt="highValue" value="'+esc(FLAGS.highValue.amount)+'"></div></div>'
    +'<div class="flagrow"><label class="cfrow"><input type="checkbox" data-flag="slipping"'+(FLAGS.slipping.on?' checked':'')+'> <b>Slipping</b></label><div class="flaghint">Flag cards that have had no activity after a set number of days.</div><div class="flaginp"><input type="text" inputmode="numeric" data-flagdays="slipping" value="'+esc(FLAGS.slipping.days)+'"><span>days</span></div></div>';
  host.querySelectorAll('input[data-flag]').forEach(function(cb){ cb.addEventListener('change',function(){ FLAGS[cb.getAttribute('data-flag')].on=cb.checked; saveFLAGS(); render(); }); });
  host.querySelectorAll('input[data-flagamt]').forEach(function(inp){ inp.addEventListener('input',function(){ FLAGS[inp.getAttribute('data-flagamt')].amount=inp.value.replace(/[^0-9]/g,''); saveFLAGS(); render(); }); });
  host.querySelectorAll('input[data-flagdays]').forEach(function(inp){ inp.addEventListener('input',function(){ FLAGS[inp.getAttribute('data-flagdays')].days=inp.value.replace(/[^0-9]/g,''); saveFLAGS(); render(); }); });
}
function daysSince(iso){ if(!iso) return null; var t=new Date(iso).getTime(); if(isNaN(t)) return null; var d=Math.floor((Date.now()-t)/86400000); return d<0?0:d; }
function daysInStage(c){ return daysSince(c.stageSince||c.createdAt||''); }
function flagBadges(c){
  var h='';
  if(FLAGS.highValue.on && FLAGS.highValue.amount && money(c.value)>=Number(FLAGS.highValue.amount)) h+='<span class="fbadge hv" title="High value (\u2265 '+esc(fmtMoney(Number(FLAGS.highValue.amount)))+')">$</span>';
  if(FLAGS.slipping.on && FLAGS.slipping.days){ var ds=daysSince(c.lastActivity); if(ds!=null && ds>=Number(FLAGS.slipping.days)) h+='<span class="fbadge slip" title="Slipping \u2014 '+ds+'d with no activity">\u2193</span>'; }
  return h?('<span class="flags">'+h+'</span>'):'';
}
function cardOwner(c){ return c.owner?('<span class="av" title="'+esc(c.owner)+'">'+esc(initials(c.owner))+'</span>'):''; }
function fmtMoneyMaybe(v){ var str=String(v==null?'':v); if(/^[\s$,.\d]+$/.test(str) && /\d/.test(str)){ var m=fmtMoney(money(str)); if(m) return m; } return esc(str); }
function cardFieldsHtml(c){
  var h='';
  if(CARDF.contact && c.contact){ var nm=esc(c.contact); h+='<div class="r"><span class="ic">○</span>'+(c.contactPersonId?('<a class="contactlink" href="./rrg_person.html?id='+encodeURIComponent(c.contactPersonId)+'">'+nm+'</a>'):nm)+'</div>'; }
  if(CARDF.value && c.value) h+='<div class="r"><span class="ic">$</span><span class="val">'+esc(c.value)+'</span></div>';
  if(CARDF.commission && c.commission) h+='<div class="r" title="Commission"><span class="ic">%</span><span class="val">'+fmtMoneyMaybe(c.commission)+'</span></div>';
  if(CARDF.days){ var dd=daysInStage(c); if(dd!=null) h+='<div class="r" title="'+dd+' day'+(dd===1?'':'s')+' in '+esc(c.stage||'this stage')+'"><span class="ic">◷</span>'+dd+'d in stage</div>'; }
  if(CARDF.market && c.market) h+='<div class="r"><span class="ic">◎</span>'+esc(c.market)+'</div>';
  if(CARDF.status && c.status) h+='<div class="r"><span class="ic">◈</span>'+esc(c.status)+'</div>';
  if(CARDF.bbs && c.bbsNumber) h+='<div class="r"><span class="ic">#</span>'+esc(c.bbsNumber)+'</div>';
  return h;
}
function cardHtml(c){
  var open='./rrg_assignment.html?key='+encodeURIComponent(c.key);
  var flags=flagBadges(c);
  var rolled=!!ROLLED[c.key];
  var chev='<button class="rollup" data-roll="'+esc(c.key)+'" title="Roll up / expand">▾</button>';
  if(DENSITY==='compact'){
    var exp=!!EXPCARD[c.key];
    return '<div class="cardx compact'+(exp?' expanded':'')+'" draggable="true" data-key="'+esc(c.key)+'">'
      +'<div class="chd"><span class="t">'+esc(c.business||'Listing')+(c.provisional?' <span class="pvbadge">Provisional</span>':'')+'</span>'+flags+cardOwner(c)+'</div>'
      +'<div class="cbody">'+(cardFieldsHtml(c)||'<div class="r" style="color:#98a1b5">No extra details</div>')
        +'<div class="ft"><span class="dt">'+(CARDF.activity&&c.lastActivity?esc(fmtDate(c.lastActivity)):'')+'</span><a class="opendeal" href="'+open+'">Open deal →</a></div>'
      +'</div></div>';
  }
  return '<div class="cardx'+(rolled?' rolled':'')+'" draggable="true" data-key="'+esc(c.key)+'">'
    +'<div class="chd"><a class="t" href="'+open+'">'+esc(c.business||'Listing')+'</a>'+flags+chev+'</div>'
    +'<div class="cbody">'
      +(c.provisional?'<div style="margin:-2px 0 6px"><span class="pvbadge">Provisional</span></div>':'')
      +cardFieldsHtml(c)
      +'<div class="ft"><span class="dt">'+(CARDF.activity&&c.lastActivity?esc(fmtDate(c.lastActivity)):'')+'</span>'+cardOwner(c)+'</div>'
    +'</div></div>';
}
function wireDnD(){
  document.querySelectorAll('.cardx').forEach(function(el){
    el.addEventListener('dragstart',function(e){ DRAGKEY=el.getAttribute('data-key'); el.__drag=true; el.classList.add('dragging'); try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',DRAGKEY); }catch(_){}});
    el.addEventListener('dragend',function(){ el.classList.remove('dragging'); setTimeout(function(){el.__drag=false;},260); document.querySelectorAll('.col.dragover').forEach(function(c){c.classList.remove('dragover');}); });
  });
  document.querySelectorAll('.cardx.compact').forEach(function(el){ el.addEventListener('click',function(e){ if(el.__drag) return; if(e.target.closest('a')) return; var k=el.getAttribute('data-key'); EXPCARD[k]=!EXPCARD[k]; el.classList.toggle('expanded',!!EXPCARD[k]); }); });
  document.querySelectorAll('.cardx .rollup').forEach(function(el){
    el.addEventListener('mousedown',function(e){ e.stopPropagation(); });
    el.addEventListener('click',function(e){ e.preventDefault(); e.stopPropagation(); var k=el.getAttribute('data-roll'); ROLLED[k]=!ROLLED[k]; saveROLLED(); var card=el.closest('.cardx'); if(card) card.classList.toggle('rolled',!!ROLLED[k]); });
  });
  document.querySelectorAll('.col').forEach(function(col){
    col.addEventListener('dragover',function(e){ e.preventDefault(); e.dataTransfer.dropEffect='move'; col.classList.add('dragover'); });
    col.addEventListener('dragleave',function(e){ if(!col.contains(e.relatedTarget)) col.classList.remove('dragover'); });
    col.addEventListener('drop',function(e){ e.preventDefault(); col.classList.remove('dragover'); var stage=col.getAttribute('data-stage'); if(DRAGKEY&&stage){ moveCard(DRAGKEY,stage); } DRAGKEY=''; });
  });
}
function moveCard(key,stage){
  var card=(DATA.cards||[]).filter(function(c){return c.key===key;})[0];
  if(!card || card.stage===stage) return;
  card.stage=stage; render();
  fetch('/api/assignment/'+encodeURIComponent(key)+'/stage',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({stage:stage})})
    .then(function(r){return r.json();}).then(function(j){ if(!j||!j.ok){ load(); } }).catch(function(){ load(); });
}
document.getElementById('psel').addEventListener('change',function(){ PID=this.value; EXPANDED={}; load(); });
load();
</script>
