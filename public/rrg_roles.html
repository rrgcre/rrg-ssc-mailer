<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRG — Roles &amp; Permissions</title>
<style>
:root{--navy:#20334f;--slate:#000E31;--primary:#2c5c8f;--primary-d:#23496f;--ink:#2b3648;--muted:#69748a;--soft:#96a1b2;--line:#dbe0e9;--wash:#f4f6f9;--inp:#c4ccda;--green:#2f7a55;--red:#b23a2c;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#eef1f6;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:13px;}
.wrap{max-width:1000px;margin:0 auto;padding:22px 24px 70px;}
.pagehd{margin:2px 0 16px;}
.pagehd h1{font-size:20px;font-weight:800;color:var(--slate);margin:0;letter-spacing:-.01em;}
.pagehd .sub{color:var(--muted);font-size:12.5px;margin-top:5px;max-width:760px;line-height:1.5;}
/* how-it-works steps */
.steps{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px;}
.step{flex:1;min-width:210px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;gap:11px;align-items:flex-start;}
.step .n{flex:none;width:22px;height:22px;border-radius:4px;background:#eef4fa;color:var(--primary-d);border:1px solid #cddcec;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;}
.step .t{font-weight:700;color:var(--slate);font-size:12.5px;}
.step .d{color:var(--muted);font-size:11.5px;margin-top:2px;line-height:1.45;}
/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:none;margin-bottom:16px;overflow:hidden;}
.ch{display:flex;align-items:center;gap:10px;padding:13px 18px;background:var(--wash);border-bottom:1px solid var(--line);}
.ch b{color:var(--slate);font-size:13.5px;font-weight:700;} .ch span{color:var(--muted);font-size:12px;} .ch .sp{margin-left:auto;}
.cb{padding:16px 18px;}
label.fld{display:block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);font-weight:700;margin:2px 0 5px;}
input,select{border:1px solid var(--inp);border-radius:4px;padding:8px 10px;font:inherit;font-size:13px;color:var(--ink);background:#fff;}
input:focus,select:focus{outline:none;border-color:var(--primary);}
.btn{background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:3px;padding:8px 14px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;}
.btn:hover{background:var(--primary-d);border-color:var(--primary-d);}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--inp);} .btn.ghost:hover{background:var(--wash);}
.btn.danger{background:#fff;color:var(--red);border-color:#e4b6b0;} .btn.danger:hover{background:#fbf2f1;}
.btn.sm{padding:6px 11px;font-size:12px;} .btn:disabled{opacity:.5;cursor:default;}
.msg{font-size:12px;font-weight:600;} .msg.ok{color:var(--green);} .msg.err{color:var(--red);}
.note{font-size:12px;color:var(--muted);line-height:1.55;}
.master{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.pill{display:inline-block;font-size:10px;font-weight:800;padding:3px 9px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em;}
.pill.on{background:#e8f3ec;color:#1f7a4d;border:1px solid #bfe2cd;} .pill.off{background:#eef1f6;color:#7a8090;border:1px solid #d7dce6;}
.switch{position:relative;display:inline-block;width:46px;height:26px;flex:none;} .switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:#c6cede;border-radius:26px;transition:.15s;cursor:pointer;} .slider:before{content:'';position:absolute;height:20px;width:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
.switch input:checked+.slider{background:var(--green);} .switch input:checked+.slider:before{transform:translateX(20px);}
/* roles */
.rolechips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px;}
.rolechip{border:1px solid var(--inp);background:#fff;border-radius:4px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--slate);cursor:pointer;}
.rolechip:hover{border-color:var(--primary);}
.rolechip.on{border-color:var(--navy);background:var(--navy);color:#fff;}
.seclbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:800;margin:16px 0 2px;}
.permcat{font-size:11.5px;font-weight:800;color:var(--primary-d);margin:12px 0 2px;padding-top:9px;border-top:1px solid var(--line);}
.permcat:first-of-type{border-top:none;padding-top:2px;}
.permgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 26px;margin:4px 0;} @media(max-width:720px){.permgrid{grid-template-columns:1fr;}}
.permrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #f0f2f7;font-size:12.5px;} .permrow .pn{flex:1;color:#2a3550;} .permrow .pn small{color:var(--soft);font-weight:600;}
.gate{max-width:520px;margin:70px auto;text-align:center;color:var(--muted);} .gate a{color:var(--primary);}
.assignnote{background:#f7fafd;border:1px solid var(--line);border-left:3px solid var(--primary);border-radius:0 4px 4px 0;padding:11px 14px;font-size:12.5px;color:var(--muted);margin-top:4px;}
.assignnote b{color:var(--slate);}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<div id="root" class="wrap"><div class="gate">Loading…</div></div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function get(u){return fetch(u,{credentials:'same-origin'}).then(function(r){return r.json();});}
function post(u,b){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(b||{})}).then(function(r){return r.json();});}
var ST=null, SELROLE='associate';

function permRows(){ return (ST.core||[]).map(function(c){return {key:c.key,label:c.label,note:c.note||'',cat:c.cat||'Other'};}).concat((ST.tools||[]).map(function(t){return {key:'tool:'+t.file,label:t.name,note:'tool',cat:t.cat||'Other'};})); }
function groupByCat(items){ var order=[],map={}; (items||[]).forEach(function(it){ var c=it.cat||'Other'; if(!map[c]){ map[c]=[]; order.push(c); } map[c].push(it); }); return order.map(function(c){ return {cat:c,items:map[c]}; }); }
function permSwitchRow(key,label,note,on,disabled){ return '<div class="permrow"><span class="pn">'+esc(label)+((note&&note!=='tool')?(' <small>'+esc(note)+'</small>'):'')+'</span><label class="switch" style="width:44px;height:24px"><input type="checkbox" data-perm="'+esc(key)+'"'+(on?' checked':'')+(disabled?' disabled':'')+'><span class="slider"></span></label></div>'; }
function roleByKey(k){ return (ST.roles||[]).filter(function(r){return r.key===k;})[0]; }

function render(){
  var root=document.getElementById('root');

  var head='<div class="pagehd"><h1>Roles &amp; Permissions</h1>'
    +'<div class="sub">Decide what each role can see and do, then assign roles to people under <b>Users</b>. Nothing is restricted until you turn on enforcement. Admin only.</div>'
    +'<div class="steps">'
      +'<div class="step"><span class="n">1</span><div><div class="t">Turn on enforcement</div><div class="d">Off by default — the app behaves exactly as today until you flip it on.</div></div></div>'
      +'<div class="step"><span class="n">2</span><div><div class="t">Define each role</div><div class="d">Pick a role below and set what it can reach.</div></div></div>'
      +'<div class="step"><span class="n">3</span><div><div class="t">Assign people</div><div class="d">Give each person a role in <b>Settings → Users</b>.</div></div></div>'
    +'</div></div>';

  // master
  var master='<div class="card"><div class="ch"><b>Enforce permissions</b><span class="sp"></span><span class="pill '+(ST.enabled?'on':'off')+'">'+(ST.enabled?'On — enforced':'Off — not enforced')+'</span></div><div class="cb"><div class="master"><label class="switch"><input type="checkbox" id="master"'+(ST.enabled?' checked':'')+'><span class="slider"></span></label><div class="note" style="flex:1;min-width:220px">While <b>off</b>, the app works exactly as it does today — everyone sees everything. Set up your roles below with zero risk, then flip this on. You can turn it off instantly if anything looks wrong.</div></div><div id="masterMsg" class="msg" style="margin-top:8px"></div></div></div>';

  // roles
  var chips=(ST.roles||[]).map(function(r){ return '<div class="rolechip'+(r.key===SELROLE?' on':'')+'" data-role="'+esc(r.key)+'">'+esc(r.name)+'</div>'; }).join('');
  var role=roleByKey(SELROLE)||ST.roles[0];
  var isAdminRole=(role.key==='admin');
  var coreHtml=groupByCat(ST.core||[]).map(function(g){ return '<div class="permcat">'+esc(g.cat)+'</div><div class="permgrid">'+g.items.map(function(c){ var on=!!(role.perms&&role.perms[c.key]); return permSwitchRow(c.key,c.label,c.note,on,isAdminRole); }).join('')+'</div>'; }).join('');
  var toolHtml=groupByCat((ST.tools||[]).map(function(t){return {key:'tool:'+t.file,label:t.name,cat:t.cat||'Other'};})).map(function(g){ return '<div class="permcat">'+esc(g.cat)+'</div><div class="permgrid">'+g.items.map(function(t){ var on=!!(role.perms&&role.perms[t.key]); return permSwitchRow(t.key,t.label,'',on,isAdminRole); }).join('')+'</div>'; }).join('');
  var rolesCard='<div class="card" id="rolesSection"><div class="ch"><b>Roles</b><span>— bundles of permissions you assign to people</span></div><div class="cb">'
    +'<div class="seclbl" style="margin-top:0">Select a role to edit</div>'
    +'<div class="rolechips">'+chips+'</div>'
    +'<div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:6px"><div><label class="fld">Role name</label><input id="roleName" value="'+esc(role.name)+'"'+(isAdminRole?' disabled':'')+' style="min-width:220px"></div>'
    +(isAdminRole?'<div class="note" style="padding-bottom:8px">The Admin role always has every permission and can’t be limited.</div>':'<button class="btn sm" id="roleSave">Save role</button>'+(role.builtin?'':'<button class="btn danger sm" id="roleDel">Delete role</button>')+'<span id="roleMsg" class="msg"></span>')+'</div>'
    +'<div class="seclbl">Permissions</div>'+coreHtml
    +'<div class="seclbl">Tool access</div>'+toolHtml
    +'<div style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap"><div><label class="fld">Add a new role</label><input id="newRole" placeholder="e.g. Team Lead"></div><button class="btn ghost sm" id="roleAdd">+ Add role</button><span id="addMsg" class="msg"></span></div>'
    +'</div></div>';

  var assign='<div class="assignnote"><b>Assigning roles to people</b> now lives in <b>Settings &rarr; Users</b> — pick a role for each person there, along with commission split and per-person overrides.</div>';

  root.innerHTML=head+master+rolesCard+assign;
  if((location.hash||'').toLowerCase()==='#roles'){ setTimeout(function(){ var el=document.getElementById('rolesSection'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },80); }

  document.getElementById('master').addEventListener('change',function(){ var on=this.checked; post('/api/admin/permissions/toggle',{enabled:on}).then(function(j){ var m=document.getElementById('masterMsg'); if(j&&j.ok){ ST.enabled=j.enabled; m.textContent=j.enabled?'Enforcement is ON.':'Enforcement is OFF.'; m.className='msg ok'; render(); } else { m.textContent='Could not change.'; m.className='msg err'; } }); });
  document.querySelectorAll('[data-role]').forEach(function(b){ b.addEventListener('click',function(){ SELROLE=b.getAttribute('data-role'); render(); }); });
  var rs=document.getElementById('roleSave'); if(rs) rs.addEventListener('click',saveRole);
  var rd=document.getElementById('roleDel'); if(rd) rd.addEventListener('click',delRole);
  var ra=document.getElementById('roleAdd'); if(ra) ra.addEventListener('click',addRole);
}

function collectPerms(){ var p={}; document.querySelectorAll('[data-perm]').forEach(function(cb){ p[cb.getAttribute('data-perm')]=cb.checked; }); return p; }
function saveRole(){
  var role=roleByKey(SELROLE); var name=(document.getElementById('roleName').value||'').trim();
  var m=document.getElementById('roleMsg'); if(m){m.textContent='Saving…';m.className='msg';}
  post('/api/admin/roles',{key:role.key,name:name,perms:collectPerms()}).then(function(j){ if(j&&j.ok){ ST.roles=j.roles; if(m){m.textContent='Saved ✓';m.className='msg ok';} render(); } else if(m){ m.textContent=(j&&j.error)||'Failed'; m.className='msg err'; } });
}
function addRole(){
  var name=(document.getElementById('newRole').value||'').trim(); var m=document.getElementById('addMsg');
  if(!name){ if(m){m.textContent='Name it first.';m.className='msg err';} return; }
  var perms={}; (ST.tools||[]).forEach(function(t){ perms['tool:'+t.file]=true; }); // new role: tools on, core off
  post('/api/admin/roles',{name:name,perms:perms}).then(function(j){ if(j&&j.ok){ ST.roles=j.roles; var added=j.roles[j.roles.length-1]; SELROLE=added?added.key:SELROLE; render(); } else if(m){ m.textContent=(j&&j.error)||'Failed'; m.className='msg err'; } });
}
async function delRole(){
  var role=roleByKey(SELROLE); if(!(window.rrgConfirm?await rrgConfirm('Delete the "'+role.name+'" role? Users on it move to Associate.'):confirm('Delete the "'+role.name+'" role? Users on it move to Associate.'))) return;
  post('/api/admin/roles/delete',{key:role.key}).then(function(j){ if(j&&j.ok){ ST.roles=j.roles; SELROLE='associate'; reload(); } else alert((j&&j.error)||'Failed'); });
}
function reload(){ get('/api/admin/permissions').then(function(j){ if(j&&j.ok){ ST=j; render(); } }); }

get('/api/admin/permissions').then(function(j){
  if(!j||!j.ok){ document.getElementById('root').innerHTML='<div class="gate">Admins only. <a href="/admin">Back</a></div>'; return; }
  ST=j; render();
}).catch(function(){ document.getElementById('root').innerHTML='<div class="gate">Could not reach the server.</div>'; });
</script>
</body>
</html>
