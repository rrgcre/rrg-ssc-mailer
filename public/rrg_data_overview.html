<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullServe — Data Overview</title>
<style>
:root{--navy:#20334f;--navy2:#23496f;--primary:#2c5c8f;--red:#b23a2c;--ink:#2b3648;--dim:#5f6a7d;--soft:#8a93a3;--line:#dbe0e9;--wash:#f4f6f9;--green:#2f7a55;--inp:#c4ccda;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#fff;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:13px;}
.wrap{max-width:none;margin:0 auto;padding:24px 24px 70px;}
h1{font-size:16px;font-weight:700;color:var(--navy);margin:0;}
.sub{color:var(--dim);font-size:12.5px;margin-top:5px;max-width:680px;line-height:1.5;}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;margin-top:16px;overflow:hidden;}
.ch{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--wash);border-bottom:1px solid var(--line);}
.ch b{color:var(--navy);font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;} .ch .sp{margin-left:auto;color:var(--dim);font-size:12px;}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px 16px;}
.tile{border:1px solid var(--line);border-radius:6px;padding:13px 15px;background:#fff;text-decoration:none;color:inherit;display:block;transition:border-color .12s,background .12s;}
a.tile:hover{border-color:var(--primary);background:#fafcff;}
.tile.prim{background:var(--wash);}
.tile .num{font-size:26px;font-weight:800;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums;}
.tile .lab{font-size:11.5px;font-weight:700;color:var(--dim);margin-top:7px;text-transform:uppercase;letter-spacing:.03em;}
.refresh{background:#fff;color:var(--navy);border:1px solid var(--inp);border-radius:3px;padding:6px 12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;}
.refresh:hover{background:var(--wash);}
.empty{text-align:center;color:var(--dim);padding:26px;font-size:13px;}
.gate{max-width:520px;margin:70px auto;text-align:center;color:var(--dim);} .gate h2{color:var(--navy);}
.note{font-size:12px;color:var(--soft);margin-top:14px;line-height:1.55;}
.pkick{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:0 0 3px;}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<div class="wrap" id="root"><div class="empty">Loading…</div></div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function get(u){return fetch(u,{credentials:'same-origin',cache:'no-store'}).then(function(r){ if(r.status===403||r.status===401) throw 0; return r.json(); });}

function render(counts){
  var tiles=(counts||[]).map(function(c){
    var inner='<div class="num">'+(c.count||0).toLocaleString()+'</div><div class="lab">'+esc(c.label)+'</div>';
    return c.href ? ('<a class="tile'+(c.primary?' prim':'')+'" href="./'+esc(c.href)+'">'+inner+'</a>') : ('<div class="tile'+(c.primary?' prim':'')+'">'+inner+'</div>');
  }).join('') || '<div class="empty">No records yet.</div>';
  document.getElementById('root').innerHTML=''
    +'<div class="pkick">Admin · Data</div><h1>Data Overview</h1>'
    +'<div class="sub">Live record counts across the main files — the size of your book at a glance. Click any tile to open that list.</div>'
    +'<div class="card"><div class="ch"><b>Record counts</b><span class="sp"><button class="refresh" id="refreshBtn">↻ Refresh</button></span></div><div class="tiles">'+tiles+'</div></div>'
    +'<div class="note">The four shaded tiles are your primary files. Protected system records (like the BizBuySell lead-source company) are included in these totals and can’t be deleted.</div>';
  var rb=document.getElementById('refreshBtn'); if(rb) rb.addEventListener('click',load);
}
function load(){
  get('/api/admin/record-counts').then(function(j){ if(!j||!j.ok) throw 0; render(j.counts||[]); })
    .catch(function(){ document.getElementById('root').innerHTML='<div class="gate"><h2>Admins only</h2>Ask an administrator to view the data overview.</div>'; });
}
load();
</script>
</body>
</html>
