<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullServe — AI Usage</title>
<style>
:root{--bg:#eef1f7;--card:#fff;--line:#e3e8f1;--ink:#14213d;--dim:#66738f;--faint:#93a0ba;--navy:#16346e;--blue:#2f6fd0;--teal:#12a594;--green:#1f8a5b;--amber:#c9812a;--red:#DA2B1F;--purple:#6d5bc0;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.top{background:radial-gradient(90% 130% at 25% 10%,#22346a,#152752 42%,#0b1636 72%,#060f26 100%);color:#fff;padding:22px 0 22px;}
.top-in{max-width:1180px;margin:0 auto;padding:0 24px;}
.crumb{font-size:12px;color:#9fb0d0;font-weight:600;margin-bottom:12px;} .crumb a{color:#c7d3ea;text-decoration:none;} .crumb a:hover{color:#fff;text-decoration:underline;} .crumb span{color:#6a7ba0;margin:0 7px;}
.disc{background:var(--red);color:#fff;border-radius:50%;width:38px;height:38px;font-family:'Arial Black',Arial;font-weight:900;font-size:12px;display:inline-flex;align-items:center;justify-content:center;letter-spacing:-.04em;cursor:pointer;vertical-align:middle;margin-right:12px;}
h1{margin:0;font-size:25px;font-weight:800;display:inline-block;vertical-align:middle;} .sub{color:#aeb8cf;font-size:13px;margin-top:8px;}
.wrap{max-width:1180px;margin:20px auto;padding:0 24px 70px;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;} @media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr);}}
.kpi{background:#fff;border:1px solid var(--line);border-top:3px solid var(--a,var(--blue));border-radius:12px;padding:14px 16px;box-shadow:0 1px 2px rgba(16,32,70,.04);}
.kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);font-weight:800;} .kpi .v{font-size:24px;font-weight:800;margin-top:6px;letter-spacing:-.01em;} .kpi .s{font-size:11.5px;color:var(--faint);font-weight:600;margin-top:2px;}
.bar2{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden;} .seg button{border:none;background:#fff;color:var(--dim);font:inherit;font-size:12.5px;font-weight:700;padding:8px 14px;cursor:pointer;} .seg button.on{background:var(--navy);color:#fff;}
.bar2 .sp{margin-left:auto;} .btn{background:#fff;color:var(--navy);border:1px solid #cdd6e6;border-radius:9px;padding:8px 14px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:none;} .btn:hover{background:#f4f7fb;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;} @media(max-width:820px){.grid2{grid-template-columns:1fr;}}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 17px;box-shadow:0 1px 2px rgba(16,32,70,.04);}
.ph{display:flex;align-items:center;gap:9px;margin-bottom:14px;} .ph b{font-size:14px;} .ph .tag{margin-left:auto;font-size:11px;color:var(--faint);font-weight:600;}
.dchart{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:8px;}
.dbar{flex:1;min-width:3px;background:linear-gradient(180deg,var(--blue),#5a97e0);border-radius:3px 3px 0 0;position:relative;transition:.15s;} .dbar:hover{filter:brightness(1.12);} .dbar.z{background:#e7ecf4;}
.dax{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-top:6px;font-weight:600;}
.row{display:flex;align-items:center;gap:11px;margin:9px 0;} .row .nm{width:150px;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} @media(max-width:520px){.row .nm{width:100px;}}
.row .tk{flex:1;height:20px;background:#eef2f8;border-radius:5px;overflow:hidden;} .row .tk i{display:block;height:100%;border-radius:5px;width:0;transition:width 1s ease;background:linear-gradient(90deg,var(--navy),var(--blue));}
.row .vv{width:112px;text-align:right;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;} .row .vv b{color:var(--ink);}
.empty{color:var(--faint);font-size:12.5px;padding:16px 0;text-align:center;}
.gate{max-width:520px;margin:80px auto;text-align:center;color:var(--dim);}
.navcrumb{display:none;max-width:1180px;margin:16px auto -2px;padding:0 24px;font-size:12.5px;color:#66738f;font-weight:600;} body.rrg-shelled .navcrumb{display:block;} .navcrumb a{color:#2f6fd0;text-decoration:none;} .navcrumb a:hover{text-decoration:underline;} .navcrumb span{color:#93a0ba;margin:0 7px;}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<!--rrgback--><a href="./index.html" class="rrg-back" style="position:fixed;left:16px;bottom:16px;z-index:99999;display:inline-flex;align-items:center;gap:7px;background:rgba(0,14,49,.85);color:#fff;text-decoration:none;font:700 12.5px/1 -apple-system,Arial,sans-serif;padding:10px 15px;border-radius:100px;border:1px solid rgba(255,255,255,.22)"><span style="font-size:14px;line-height:1">←</span> Command</a>
<div class="top"><div class="top-in">
  <div class="crumb"><a href="./index.html">Command</a><span>›</span><a href="./admin">Admin</a><span>›</span>AI Usage</div>
  <span class="disc" onclick="location.href='./index.html'">RRG</span><h1>AI Usage</h1>
  <div class="sub">Every AI call across the brokerage — by day, by rep, and by feature. Estimated cost is a planning figure, not a bill.</div>
</div></div>
<div class="navcrumb"><a href="./index.html">Command</a><span>›</span><a href="./admin">Admin</a><span>›</span>AI Usage</div>
<div id="root" class="wrap"><div class="gate">Checking access…</div></div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function n(v){return Number(v||0).toLocaleString('en-US');}
function money(v){ v=Number(v||0); return '$'+v.toFixed(2); }
var DATA=null, METRIC='calls', SPAN=30;
var FEAT={'build-concepts':'Concept Builder','find-locations':'Location Finder','find-concepts':'Group Concepts','concept-resolve':'Concept Resolve','concept-intel':'Concept Intelligence','logo-ai':'Logo AI','consult':'Consult','brief':'RRG Brief','loi-review':'LOI Review','loi-suggest':'LOI Suggest','loi-parse':'LOI Parse','loi-counter':'LOI Counter','enrich-company':'Enrich Company','enrich-contact':'Enrich Contact','contact-prep':'Call Prep','concept':'Concept','site-read':'Site Read','calc-summary':'Calc Summary','placer':'Placer','space-intake':'Space Intake','space-match':'Space Match'};
function fname(f){ return FEAT[f]||f; }
function val(o){ return METRIC==='cost'? o.cost : o.calls; }
function fmtv(v){ return METRIC==='cost'? money(v) : n(v); }
function kpi(){
  var d=DATA; var mtd=d.total||{calls:0,cost:0}, at=d.allTime||{calls:0,cost:0}, w=d.windows||{};
  return '<div class="kpis">'
    +'<div class="kpi" style="--a:var(--blue)"><div class="l">This month</div><div class="v">'+n(mtd.calls)+'</div><div class="s">calls · '+money(mtd.cost)+' est.</div></div>'
    +'<div class="kpi" style="--a:var(--teal)"><div class="l">Last 7 days</div><div class="v">'+n(w.last7||0)+'</div><div class="s">calls</div></div>'
    +'<div class="kpi" style="--a:var(--amber)"><div class="l">Last 30 days</div><div class="v">'+n(w.last30||0)+'</div><div class="s">calls</div></div>'
    +'<div class="kpi" style="--a:var(--navy)"><div class="l">All time</div><div class="v">'+n(at.calls)+'</div><div class="s">calls · '+money(at.cost)+' est.</div></div>'
    +'</div>';
}
function daily(){
  var arr=(DATA.daily||[]).slice(-SPAN);
  var mx=Math.max.apply(null,arr.map(val).concat([1]));
  var bars=arr.map(function(o){ var v=val(o); var h=Math.max(0,Math.round(v/mx*100)); return '<div class="dbar'+(v?'':' z')+'" style="height:'+(v?Math.max(3,h):2)+'%" title="'+esc(o.date)+' · '+n(o.calls)+' calls · '+money(o.cost)+'"></div>'; }).join('');
  var first=arr[0]?arr[0].date:'', last=arr[arr.length-1]?arr[arr.length-1].date:'';
  return '<div class="panel"><div class="ph"><b>By day</b><span class="tag">last '+SPAN+' days · '+METRIC+'</span></div><div class="dchart">'+bars+'</div><div class="dax"><span>'+esc(first)+'</span><span>'+esc(last)+'</span></div></div>';
}
function rows(list, keyName){
  if(!list.length) return '<div class="empty">No AI usage yet this month.</div>';
  var mx=Math.max.apply(null,list.map(val).concat([1]));
  return list.slice(0,12).map(function(o){ var v=val(o); var w=Math.round(v/mx*100); var label=keyName==='feature'?fname(o.feature):(o.name||'—'); return '<div class="row"><div class="nm" title="'+esc(label)+'">'+esc(label)+'</div><div class="tk"><i style="width:'+w+'%"></i></div><div class="vv"><b>'+fmtv(v)+'</b> '+(METRIC==='cost'?'':('· '+money(o.cost)))+'</div></div>'; }).join('');
}
function render(){
  var root=document.getElementById('root'); root.className='wrap';
  root.innerHTML=kpi()
    +'<div class="bar2"><div class="seg" id="mseg"><button data-m="calls" class="'+(METRIC==='calls'?'on':'')+'">Calls</button><button data-m="cost" class="'+(METRIC==='cost'?'on':'')+'">Est. cost</button></div>'
    +'<div class="seg" id="sseg"><button data-s="30" class="'+(SPAN===30?'on':'')+'">30 days</button><button data-s="90" class="'+(SPAN===90?'on':'')+'">90 days</button></div>'
    +'<span class="sp"></span><a class="btn" href="/api/admin/ai-usage.csv">Export CSV</a></div>'
    +daily()
    +'<div class="grid2"><div class="panel"><div class="ph"><b>By rep</b><span class="tag">this month</span></div>'+rows(DATA.byUser||[],'user')+'</div>'
    +'<div class="panel"><div class="ph"><b>By feature</b><span class="tag">this month</span></div>'+rows(DATA.byFeature||[],'feature')+'</div></div>';
  document.querySelectorAll('#mseg button').forEach(function(b){ b.addEventListener('click',function(){ METRIC=b.getAttribute('data-m'); render(); }); });
  document.querySelectorAll('#sseg button').forEach(function(b){ b.addEventListener('click',function(){ SPAN=Number(b.getAttribute('data-s')); render(); }); });
  document.querySelectorAll('.row .tk i').forEach(function(el){ var w=el.style.width; el.style.width='0'; setTimeout(function(){ el.style.width=w; },50); });
}
fetch('/api/admin/ai-usage',{credentials:'same-origin'}).then(function(r){ if(r.status===403) throw 0; return r.json(); }).then(function(j){
  if(!j||!j.ok){ document.getElementById('root').innerHTML='<div class="gate">Could not load AI usage.</div>'; return; }
  DATA=j; render();
}).catch(function(){ document.getElementById('root').innerHTML='<div class="gate"><h2 style="color:#000E31">Admins only</h2>Ask an administrator to view AI usage.</div>'; });
</script>
</body>
</html>
