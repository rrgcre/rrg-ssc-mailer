<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullServe — AI Usage</title>
<style>
:root{--navy:#20334f;--navy2:#23496f;--primary:#2c5c8f;--primary-d:#23496f;--ink:#2b3648;--dim:#5f6a7d;--soft:#8a93a3;--faint:#96a1b2;--line:#dbe0e9;--wash:#f4f6f9;--green:#2f7a55;--red:#b23a2c;--inp:#c4ccda;--amber:#8a5a12;--bg:#fff;--card:#fff;--blue:var(--primary);--teal:#2f7a55;--purple:#23496f;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#fff;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:13px;}
.navcrumb{display:none;max-width:1180px;margin:0 auto;padding:14px 24px 0;font-size:12.5px;color:var(--dim);font-weight:600;} body.rrg-shelled .navcrumb{display:block;} .navcrumb a{color:var(--primary);text-decoration:none;} .navcrumb a:hover{text-decoration:underline;} .navcrumb span{color:var(--faint);margin:0 7px;}
.pagehdr{max-width:1180px;margin:0 auto;padding:26px 24px 0;}
h1{margin:0;font-size:16px;font-weight:700;color:var(--navy);}
.sub{color:var(--dim);font-size:12.5px;margin-top:5px;max-width:820px;line-height:1.5;}
.wrap{max-width:none;margin:0 auto;padding:22px 24px 70px;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;} @media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr);}}
.kpi{background:#fff;border:1px solid var(--line);border-top:3px solid var(--a,var(--primary));border-radius:6px;padding:14px 16px;}
.kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);font-weight:800;} .kpi .v{font-size:24px;font-weight:800;margin-top:6px;letter-spacing:-.01em;color:var(--navy);} .kpi .s{font-size:11.5px;color:var(--faint);font-weight:600;margin-top:2px;}
.bar2{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.seg{display:inline-flex;background:#fff;border:1px solid var(--inp);border-radius:4px;overflow:hidden;} .seg button{border:none;background:#fff;color:var(--dim);font:inherit;font-size:12.5px;font-weight:700;padding:8px 14px;cursor:pointer;} .seg button.on{background:var(--navy);color:#fff;}
.bar2 .sp{margin-left:auto;} .btn{background:#fff;color:var(--navy);border:1px solid var(--inp);border-radius:3px;padding:8px 14px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none;} .btn:hover{background:var(--wash);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;} @media(max-width:820px){.grid2{grid-template-columns:1fr;}}
.panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:15px 17px;overflow:hidden;}
.ph{display:flex;align-items:center;gap:9px;margin:-15px -17px 14px;padding:11px 16px;background:var(--wash);border-bottom:1px solid var(--line);} .ph b{font-size:12px;font-weight:800;color:var(--navy);letter-spacing:.04em;text-transform:uppercase;} .ph .tag{margin-left:auto;font-size:11px;color:var(--soft);font-weight:600;}
.dchart{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:8px;}
.dbar{flex:1;min-width:3px;background:linear-gradient(180deg,var(--primary),var(--primary-d));border-radius:3px 3px 0 0;position:relative;transition:.15s;} .dbar:hover{filter:brightness(1.12);} .dbar.z{background:#e7ecf4;}
.dax{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-top:6px;font-weight:600;}
.row{display:flex;align-items:center;gap:11px;margin:9px 0;} .row .nm{width:150px;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} @media(max-width:520px){.row .nm{width:100px;}}
.row .tk{flex:1;height:20px;background:var(--wash);border-radius:5px;overflow:hidden;} .row .tk i{display:block;height:100%;border-radius:5px;width:0;transition:width 1s ease;background:linear-gradient(90deg,var(--navy),var(--primary));}
.row .vv{width:112px;text-align:right;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;} .row .vv b{color:var(--ink);}
.row .vt{width:74px;text-align:right;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;}
.empty{color:var(--faint);font-size:12.5px;padding:16px 0;text-align:center;}
.gate{max-width:520px;margin:80px auto;text-align:center;color:var(--dim);}
.pkick{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:0 0 3px;}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<!--rrgback--><a href="./index.html" class="rrg-back" style="position:fixed;left:16px;bottom:16px;z-index:99999;display:inline-flex;align-items:center;gap:7px;background:rgba(0,14,49,.85);color:#fff;text-decoration:none;font:700 12.5px/1 -apple-system,Arial,sans-serif;padding:10px 15px;border-radius:100px;border:1px solid rgba(255,255,255,.22)"><span style="font-size:14px;line-height:1">←</span> Command</a>
<div class="navcrumb"><a href="./index.html">Command</a><span>›</span><a href="./admin">Admin</a><span>›</span>AI Usage</div>
<div class="pagehdr">
  <div class="pkick">Admin · AI</div><h1>AI Usage</h1>
  <div class="sub">Every AI call across the brokerage — by day, by rep, and by feature. Estimated cost is a planning figure, not a bill.</div>
</div>
<div id="root" class="wrap"><div class="gate">Checking access…</div></div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function n(v){return Number(v||0).toLocaleString('en-US');}
function money(v){ v=Number(v||0); return '$'+v.toFixed(2); }
var DATA=null, SPAN=30, GATEON=true;
function setGateState(on){ var s=document.getElementById('gateState'); if(s){ s.textContent=on?'On':'Off'; s.style.color=on?'var(--green,#1f8a5b)':'var(--soft,#8a93a8)'; } }
function gateCard(){ return '<div class="panel" style="margin-bottom:16px"><div class="ph"><b>AI cost control</b><span class="tag" id="gateState"></span></div><label style="display:flex;align-items:flex-start;gap:12px;padding:6px 2px;cursor:pointer"><input type="checkbox" id="gateOn"'+(GATEON?' checked':'')+' style="width:18px;height:18px;margin-top:1px"><span><b style="font-size:13.5px">Confirm before heavy AI actions</b><div style="font-size:12px;color:var(--soft,#8a93a8);margin-top:2px;line-height:1.5">When on, reps get a quick “this uses AI — continue?” confirm before metered actions (find locations, build concepts, RRG Brief, LOI review). Metering keeps counting either way.</div></span></label></div>'; }
var FEAT={'build-concepts':'Concept Builder','find-locations':'Location Finder','find-concepts':'Group Concepts','concept-resolve':'Concept Resolve','concept-intel':'Concept Intelligence','logo-ai':'Logo AI','consult':'Consult','brief':'RRG Brief','loi-review':'LOI Review','loi-suggest':'LOI Suggest','loi-parse':'LOI Parse','loi-counter':'LOI Counter','enrich-company':'Enrich Company','enrich-contact':'Enrich Contact','contact-prep':'Call Prep','concept':'Concept','site-read':'Site Read','calc-summary':'Calc Summary','placer':'Placer','space-intake':'Space Intake','space-match':'Space Match'};
function fname(f){ return FEAT[f]||f; }
function val(o){ return o.calls; }
function spanDays(){ if(SPAN==='ytd'){ var now=new Date(); var jan1=Date.UTC(now.getUTCFullYear(),0,1); return Math.max(1,Math.round((Date.now()-jan1)/86400000)+1); } return Number(SPAN)||30; }
function rangeLabel(){ if(SPAN===1) return 'today'; if(SPAN===7) return 'last 7 days'; if(SPAN==='ytd') return 'year to date'; if(SPAN===365) return 'last 12 months'; return 'last '+SPAN+' days'; }
function kpi(){
  var d=DATA; var mtd=d.total||{calls:0,cost:0}, at=d.allTime||{calls:0,cost:0}, w=d.windows||{};
  return '<div class="kpis">'
    +'<div class="kpi" style="--a:var(--blue)"><div class="l">This month</div><div class="v">'+n(mtd.calls)+'</div><div class="s">calls · '+money(mtd.cost)+' est.</div></div>'
    +'<div class="kpi" style="--a:var(--teal)"><div class="l">Last 7 days</div><div class="v">'+n(w.last7||0)+'</div><div class="s">calls</div></div>'
    +'<div class="kpi" style="--a:var(--amber)"><div class="l">Last 30 days</div><div class="v">'+n(w.last30||0)+'</div><div class="s">calls</div></div>'
    +'<div class="kpi" style="--a:var(--navy)"><div class="l">All time</div><div class="v">'+n(at.calls)+'</div><div class="s">calls · '+money(at.cost)+' est.</div></div>'
    +'</div>';
}
function daily(){
  var arr=(DATA.daily||[]).slice(-spanDays());
  var mx=Math.max.apply(null,arr.map(val).concat([1]));
  var bars=arr.map(function(o){ var v=val(o); var h=Math.max(0,Math.round(v/mx*100)); return '<div class="dbar'+(v?'':' z')+'" style="height:'+(v?Math.max(3,h):2)+'%" title="'+esc(o.date)+' · '+n(o.calls)+' calls · '+money(o.cost)+'"></div>'; }).join('');
  var first=arr[0]?arr[0].date:'', last=arr[arr.length-1]?arr[arr.length-1].date:'';
  return '<div class="panel"><div class="ph"><b>By day</b><span class="tag">'+rangeLabel()+' · call volume</span></div><div class="dchart">'+bars+'</div><div class="dax"><span>'+esc(first)+'</span><span>'+esc(last)+'</span></div></div>';
}
function hourly(){
  var b=[]; for(var i=0;i<24;i++) b.push({calls:0,cost:0});
  var now=new Date(), y=now.getFullYear(), mo=now.getMonth(), da=now.getDate();
  (DATA.recent||[]).forEach(function(e){ var t=new Date(e.ts); if(isNaN(t.getTime())) return; if(t.getFullYear()===y&&t.getMonth()===mo&&t.getDate()===da){ var h=t.getHours(); b[h].calls++; b[h].cost+=(e.cost||0); } });
  var mx=Math.max.apply(null,b.map(val).concat([1]));
  var totC=0,totCost=0; b.forEach(function(o){ totC+=o.calls; totCost+=o.cost; });
  function hl(h){ return h===0?'12a':(h<12?h+'a':(h===12?'12p':(h-12)+'p')); }
  var bars=b.map(function(o,h){ var v=val(o); var ht=Math.max(0,Math.round(v/mx*100)); return '<div class="dbar'+(v?'':' z')+'" style="height:'+(v?Math.max(3,ht):2)+'%" title="'+hl(h)+' \u00b7 '+n(o.calls)+' calls \u00b7 '+money(o.cost)+'"></div>'; }).join('');
  return '<div class="panel"><div class="ph"><b>By hour</b><span class="tag">today \u00b7 '+n(totC)+' calls'+(totCost?(' \u00b7 '+money(totCost)):'')+'</span></div><div class="dchart">'+bars+'</div><div class="dax"><span>12 AM</span><span>Noon</span><span>11 PM</span></div></div>';
}
function fmtms(ms){ if(ms==null) return '—'; if(ms<1000) return ms+'ms'; var s=ms/1000; return (s<10?s.toFixed(1):Math.round(s))+'s'; }
function rows(list, keyName){
  if(!list.length) return '<div class="empty">No AI usage in this range.</div>';
  var mx=Math.max.apply(null,list.map(function(o){return o.cost;}).concat([0.0001]));
  return list.slice(0,12).map(function(o){ var w=Math.round((o.cost/mx)*100); var label=keyName==='feature'?fname(o.feature):(o.name||'—'); var vt=(keyName==='feature')?('<div class="vt" title="Average run time per call">'+fmtms(o.avgMs)+'</div>'):''; return '<div class="row"><div class="nm" title="'+esc(label)+'">'+esc(label)+'</div><div class="tk"><i style="width:'+w+'%"></i></div>'+vt+'<div class="vv"><b>'+n(o.calls)+'</b> · '+money(o.cost)+'</div></div>'; }).join('');
}
function render(){
  var root=document.getElementById('root'); root.className='wrap';
  root.innerHTML=gateCard()+kpi()
    +'<div class="bar2"><div class="seg" id="sseg"><button data-s="1" class="'+(SPAN===1?'on':'')+'">Today</button><button data-s="7" class="'+(SPAN===7?'on':'')+'">This week</button><button data-s="30" class="'+(SPAN===30?'on':'')+'">30 days</button><button data-s="90" class="'+(SPAN===90?'on':'')+'">90 days</button><button data-s="ytd" class="'+(SPAN==='ytd'?'on':'')+'">YTD</button><button data-s="365" class="'+(SPAN===365?'on':'')+'">1 year</button></div>'
    +'<span class="sp"></span><a class="btn" href="/api/admin/ai-usage.csv">Export CSV</a></div>'
    +(SPAN===1?hourly():daily())
    +'<div class="grid2"><div class="panel"><div class="ph"><b>By rep</b><span class="tag">'+rangeLabel()+' · calls · cost</span></div>'+rows(DATA.byUser||[],'user')+'</div>'
    +'<div class="panel"><div class="ph"><b>By feature</b><span class="tag">'+rangeLabel()+' · avg time · calls · cost</span></div>'+rows(DATA.byFeature||[],'feature')+'</div></div>';
  document.querySelectorAll('#sseg button').forEach(function(b){ b.addEventListener('click',function(){ var v=b.getAttribute('data-s'); SPAN=(v==='ytd')?'ytd':Number(v); fetchUsage(spanDays()); }); });
  var _g=document.getElementById('gateOn'); if(_g){ setGateState(GATEON); _g.addEventListener('change',function(){ GATEON=_g.checked; setGateState(GATEON); fetch('/api/admin/ai-confirm',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({on:GATEON})}).catch(function(){}); }); }
  document.querySelectorAll('.row .tk i').forEach(function(el){ var w=el.style.width; el.style.width='0'; setTimeout(function(){ el.style.width=w; },50); });
}
function fetchUsage(days){
  fetch('/api/admin/ai-usage?days='+encodeURIComponent(days),{credentials:'same-origin'}).then(function(r){ if(r.status===403) throw 0; return r.json(); }).then(function(j){
    if(!j||!j.ok){ document.getElementById('root').innerHTML='<div class="gate">Could not load AI usage.</div>'; return; }
    DATA=j; render();
  }).catch(function(){ document.getElementById('root').innerHTML='<div class="gate"><h2 style="color:#000E31">Admins only</h2>Ask an administrator to view AI usage.</div>'; });
}
fetchUsage(spanDays());
fetch('/api/admin/ai-confirm',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(k){ GATEON=!(k&&k.on===false); setGateState(GATEON); var g=document.getElementById('gateOn'); if(g) g.checked=GATEON; }).catch(function(){});
</script>
</body>
</html>
