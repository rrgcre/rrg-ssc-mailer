<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullServe — Payments</title>
<style>.rl-filtbtn{display:none!important;}</style>
<script src="/rrg_list.js"></script>
<script src="/rrg_filters.js"></script>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--ink:#1a2236;--muted:#6b7488;--soft:#8a93a8;--line:#e6e9f0;--wash:#f5f7fb;--green:#1f8a5b;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#eef1f6;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);}
.wrap{max-width:none;margin:0 auto;padding:24px 28px 60px;}
.searchwrap{margin-left:auto;position:relative;display:flex;align-items:center;}
.searchwrap .searchic{position:absolute;left:12px;color:#9aa3b2;pointer-events:none;}
.searchwrap input{padding:8px 30px 8px 34px;min-width:240px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:13px;color:var(--ink);background:#fff;}
.searchwrap input:focus{outline:none;border-color:#2c5c8f;box-shadow:0 0 0 3px rgba(44,92,143,.14);}
.searchwrap .searchx{position:absolute;right:8px;background:none;border:none;color:#b0b8c6;font-size:18px;line-height:1;cursor:pointer;padding:0 4px;display:none;}
.searchwrap .searchx.show{display:block;}
.pgh{font-size:26px;font-weight:700;color:var(--navy);margin:6px 0 2px;}
.pgs{color:var(--muted);font-size:13.5px;margin-bottom:18px;max-width:820px;line-height:1.5;}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:0 4px 16px rgba(10,20,50,.04);min-width:150px;}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:700;}
.stat .v{font-size:20px;font-weight:700;color:var(--navy);margin-top:3px;} .stat.green .v{color:var(--green);}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(10,20,50,.06);overflow:hidden;margin-bottom:20px;}
.hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;}
.hd b{color:var(--navy);font-size:15px;}
.cb{padding:6px 8px 10px;}
.lk{color:var(--navy);text-decoration:none;font-weight:600;} .lk:hover{text-decoration:underline;}
.meta{color:var(--muted);font-size:12px;}
.amt{font-variant-numeric:tabular-nums;font-weight:700;color:var(--green);}
.empty{padding:34px 20px;text-align:center;color:var(--soft);font-size:13.5px;}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<div class="wrap">
  <h1 class="pgh">Payments</h1>
  <div class="pgs">Every payment recorded against your invoices, in one ledger. Record payments from an invoice; they roll up here. Your payments are private to you; admins see the whole team.</div>
  <div class="stats" id="stats"></div>
  <div class="card">
    <div class="hd"><b>Payment Ledger</b><span class="meta" id="pcount"></span>
      <div class="searchwrap"><svg class="searchic" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5"></circle><line x1="12.8" y1="12.8" x2="17.5" y2="17.5"></line></svg><input id="search" placeholder="Search invoice #, bill-to, listing, method…" oninput="applyFilter()" autocomplete="off"><button type="button" class="searchx" id="searchx" title="Clear search" onclick="var s=document.getElementById('search');s.value='';applyFilter();s.focus();">×</button></div>
      <button id="filterBtn" class="rlf-btn" style="margin-left:8px">⚙ Filters</button>
    </div>
    <div class="cb"><div id="plist"><div class="empty">Loading…</div></div></div>
  </div>
</div>
<script>
var ROWS=[], CTL=null, IS_ADMIN=false, TOTAL=0;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmtDate(iso){ if(!iso) return ''; var x=String(iso).slice(0,10).split('-'); if(x.length!==3) return String(iso).slice(0,10); return x[1]+'/'+x[2]+'/'+x[0].slice(2); }
function money(n){ n=Number(n||0); return (window.RRG_CCYSYM||String.fromCharCode(36))+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function api(m,u){return fetch(u,{method:m,credentials:'same-origin'}).then(function(r){return r.json();});}
function dDistinct(key){ var m={}; (ROWS||[]).forEach(function(d){ var v=d[key]; if(v) m[v]=1; }); return Object.keys(m).sort(); }
var CF=(window.RRGFilters&&document.getElementById('filterBtn'))?RRGFilters.create({ list:'payments', title:'payments', button:document.getElementById('filterBtn'), isAdmin:function(){return IS_ADMIN;}, fields:[
  { key:'method', label:'Method', type:'multi', options:function(){return dDistinct('method');}, get:function(d){return d.method||'';} },
  { key:'listingLabel', label:'Deal / Listing', type:'multi', options:function(){return dDistinct('listingLabel');}, get:function(d){return d.listingLabel||'';} },
  { key:'billTo', label:'Bill to', type:'multi', options:function(){return dDistinct('billTo');}, get:function(d){return d.billTo||'';} },
  { key:'date', label:'Date', type:'daterange', get:function(d){return d.date||'';} }
], onChange:applyFilter }):null;
function listCfg(data){ var cols=[
    { label:'Date', sort:function(a,b){return RRGList.cmp(a.date,b.date);}, cell:function(x){ return '<span class="meta" style="color:var(--ink)">'+esc(fmtDate(x.date)||'—')+'</span>'; } },
    { label:'Invoice', sort:function(a,b){return RRGList.cmp(a.number,b.number);}, cell:function(x){ return '<a class="lk" href="./rrg_invoices.html?open='+encodeURIComponent(x.invoiceId)+'">'+esc(x.number||'—')+'</a>'; } },
    { label:'Deal / Listing', sort:function(a,b){return RRGList.cmp(a.listingLabel,b.listingLabel);}, cell:function(x){ return x.listingLabel?esc(x.listingLabel):'<span class="meta">—</span>'; } },
    { label:'Bill to', sort:function(a,b){return RRGList.cmp(a.billTo,b.billTo);}, cell:function(x){ return x.billTo?esc(x.billTo):'<span class="meta">—</span>'; } },
    { label:'Method', sort:function(a,b){return RRGList.cmp(a.method,b.method);}, cell:function(x){ return x.method?esc(x.method):'<span class="meta">—</span>'; } },
    { label:'Reference', sort:function(a,b){return RRGList.cmp(a.reference,b.reference);}, cell:function(x){ return x.reference?('<span class="meta">'+esc(x.reference)+'</span>'):'<span class="meta">—</span>'; }, defaultHidden:true },
    { label:'Amount', align:'right', sort:function(a,b){return RRGList.cmp(Number(a.amount||0),Number(b.amount||0));}, cell:function(x){ return '<span class="amt">'+money(x.amount)+'</span>'; } } ];
  if(IS_ADMIN) cols.push({ label:'Rep', sort:function(a,b){return RRGList.cmp(a.ownerName,b.ownerName);}, cell:function(x){ return x.mine?'You':(x.ownerName?esc(x.ownerName):'<span class="meta">—</span>'); } });
  return { mount:'#plist', data:data, key:'payments', empty:'<div class="empty">No payments recorded yet. Record them against an invoice and they show up here.</div>',
    rowId:function(x){return x.id;}, defaultSort:0, defaultDir:-1, columns:cols }; }
function renderStats(data){ var host=document.getElementById('stats'); if(!host) return; var sum=0, ytd=0, yr=String(new Date().getFullYear()); (data||[]).forEach(function(x){ var a=Number(x.amount||0); sum+=a; if(String(x.date||'').slice(0,4)===yr) ytd+=a; }); var isFiltered=(data||[]).length!==ROWS.length; host.innerHTML='<div class="stat green"><div class="k">'+(isFiltered?'Collected (shown)':'Total collected')+'</div><div class="v">'+money(isFiltered?sum:TOTAL)+'</div></div><div class="stat"><div class="k">This year</div><div class="v">'+money(ytd)+'</div></div><div class="stat"><div class="k">Payments</div><div class="v">'+(data||[]).length+'</div></div>'; }
function applyFilter(){
  var q=(document.getElementById('search').value||'').trim().toLowerCase();
  var base=(CF)?CF.filter(ROWS):ROWS;
  var _qt=q.split(/\s+/).filter(Boolean);
  var data=base.filter(function(x){ if(!_qt.length) return true; var hay=((x.number||'')+' '+(x.billTo||'')+' '+(x.listingLabel||'')+' '+(x.method||'')+' '+(x.reference||'')).toLowerCase(); return _qt.every(function(t){return hay.indexOf(t)>=0;}); });
  var _sx=document.getElementById('searchx'); if(_sx) _sx.classList.toggle('show', !!q);
  if(CTL) CTL.refresh(data); else CTL=RRGList.create(listCfg(data));
  var c=document.getElementById('pcount'); if(c) c.textContent=data.length+(data.length===1?' payment':' payments');
  renderStats(data); if(CF) CF.updateBtn();
}
function load(){ api('GET','/api/payments').then(function(j){ ROWS=j.payments||[]; TOTAL=Number(j.total||0); IS_ADMIN=!!j.isAdmin; applyFilter(); }); }
load();
</script>
</body>
</html>
