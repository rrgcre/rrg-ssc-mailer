        +'</div>'
        +'<img src="'+esc(p.url)+'" alt="'+esc(p.caption||'Listing photo')+'" loading="lazy">'
        +'<input class="mcap" data-pid="'+esc(p.id)+'" value="'+esc(p.caption||'')+'" placeholder="Add a caption…">'
      +'</div>';
    }).join('')+'</div>';
  }
  var drop='<div class="mdrop" id="mDrop">Drag photos here, or <b>click to choose</b> — JPG, PNG, GIF or WebP<div class="mhint">First photo becomes the cover. Drag tiles to reorder; ★ sets the cover.</div><input type="file" id="mFile" accept="image/*" multiple hidden></div>';
  var vEmbed=m.videoEmbed?('<div class="mediaframe"><iframe src="'+esc(m.videoEmbed)+'" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe></div>'):'';
  var video='<div class="mediasec"><h4>Video walkthrough</h4><div class="mlinkrow"><input id="mVideo" value="'+esc(m.videoUrl||'')+'" placeholder="Paste a YouTube, Vimeo, Loom or .mp4 link"><button type="button" id="mVideoSave">Save</button></div>'+vEmbed+'</div>';
  var pEmbed=m.matterportEmbed?('<div class="mediaframe"><iframe src="'+esc(m.matterportEmbed)+'" allow="fullscreen;vr" allowfullscreen></iframe></div>'):'';
  var matter='<div class="mediasec"><h4>Matterport 3D tour</h4><div class="mlinkrow"><input id="mMatter" value="'+esc(m.matterportUrl||'')+'" placeholder="Paste the Matterport share link (my.matterport.com/show/?m=…)"><button type="button" id="mMatterSave">Save</button></div>'+pEmbed+'</div>';
  return grid+drop+video+matter;
}
function mediaCard(){
  mediaCSS();
  var m=(A&&A.media)||{count:0};
  var n=m.count||((m.photos||[]).length)||0;
  return '<div class="card" id="mediaCard"><div class="ch"><b>Photos &amp; Media</b><span id="mediaCount" style="margin-left:10px;color:#8a93a3;font-size:12px">'+n+' photo'+(n===1?'':'s')+'</span></div><div class="cb" id="mediaBody" style="padding-top:14px">'+mediaBodyHTML()+'</div></div>';
}
function rerenderMedia(){ var b=document.getElementById('mediaBody'); if(b) b.innerHTML=mediaBodyHTML(); var c=document.getElementById('mediaCount'); if(c){ var n=((A.media&&A.media.count)|| (A.media&&A.media.photos&&A.media.photos.length)||0); c.textContent=n+' photo'+(n===1?'':'s'); } }
function _mMedResp(j){ if(j&&j.ok&&j.media){ A.media=j.media; rerenderMedia(); return true; } if(j&&j.error){ try{ if(window.rrgToast) rrgToast(j.error); else alert(j.error); }catch(_){}} return false; }
function uploadMediaFiles(fileList){
  var files=Array.prototype.slice.call(fileList||[]).filter(function(f){ return /^image\//.test(f.type); });
  if(!files.length) return;
  var drop=document.getElementById('mDrop'); if(drop){ drop.classList.remove('drag'); drop.firstChild&&(drop.innerHTML='<b>Uploading '+files.length+' photo'+(files.length===1?'':'s')+'…</b>'); }
  var out=[]; var pending=files.length;
  files.forEach(function(f){
    var rd=new FileReader();
    rd.onload=function(){ out.push({filename:f.name,dataB64:String(rd.result||'')}); if(--pending===0) _sendMedia(out); };
    rd.onerror=function(){ if(--pending===0) _sendMedia(out); };
    rd.readAsDataURL(f);
  });
}
function _sendMedia(arr){
  if(!arr.length){ rerenderMedia(); return; }
  fetch('/api/assignment/'+encodeURIComponent(KEY)+'/photos',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({files:arr})})
    .then(function(r){return r.json();}).then(function(j){ if(!_mMedResp(j)) rerenderMedia(); })
    .catch(function(){ rerenderMedia(); try{ if(window.rrgToast) rrgToast('Could not upload photos.'); }catch(_){}} );
}
function _postMediaOrder(){
  var grid=document.getElementById('mGrid'); if(!grid) return;
  var order=Array.prototype.slice.call(grid.querySelectorAll('.mtile')).map(function(t){ return t.getAttribute('data-pid'); });
  fetch('/api/assignment/'+encodeURIComponent(KEY)+'/photos/order',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({order:order})}).then(function(r){return r.json();}).then(_mMedResp).catch(function(){});
}
function wireMedia(){
  var card=document.getElementById('mediaCard'); if(!card||card._mwired){ return; } card._mwired=true;
  // file picker + drop zone (delegated so re-renders keep working)
  card.addEventListener('click',function(e){
    var drop=e.target.closest('#mDrop'); if(drop&&!e.target.closest('input')){ var fi=document.getElementById('mFile'); if(fi) fi.click(); return; }
    var cov=e.target.closest('.mcover'); if(cov){ e.preventDefault(); fetch('/api/assignment/'+encodeURIComponent(KEY)+'/photos/order',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({coverPhotoId:cov.getAttribute('data-pid')})}).then(function(r){return r.json();}).then(_mMedResp).catch(function(){}); return; }
    var del=e.target.closest('.mdel'); if(del){ e.preventDefault(); var pid=del.getAttribute('data-pid'); (window.rrgConfirm?rrgConfirm('Remove this photo?',{title:'Remove photo?',okText:'Remove',danger:true}):Promise.resolve(confirm('Remove this photo?'))).then(function(ok){ if(!ok) return; fetch('/api/assignment/'+encodeURIComponent(KEY)+'/photo/'+encodeURIComponent(pid),{method:'DELETE',credentials:'same-origin'}).then(function(r){return r.json();}).then(_mMedResp).catch(function(){}); }); return; }
    var vs=e.target.closest('#mVideoSave'); if(vs){ e.preventDefault(); var v=(document.getElementById('mVideo')||{}).value||''; fetch('/api/assignment/'+encodeURIComponent(KEY)+'/media',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({videoUrl:v})}).then(function(r){return r.json();}).then(_mMedResp).catch(function(){}); return; }
    var ps=e.target.closest('#mMatterSave'); if(ps){ e.preventDefault(); var pv=(document.getElementById('mMatter')||{}).value||''; fetch('/api/assignment/'+encodeURIComponent(KEY)+'/media',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({matterportUrl:pv})}).then(function(r){return r.json();}).then(_mMedResp).catch(function(){}); return; }
  });
  card.addEventListener('change',function(e){ if(e.target&&e.target.id==='mFile'){ uploadMediaFiles(e.target.files); e.target.value=''; } });
  // caption save on blur
  card.addEventListener('blur',function(e){ var cap=e.target&&e.target.closest?e.target.closest('.mcap'):null; if(cap){ var pid=cap.getAttribute('data-pid'); fetch('/api/assignment/'+encodeURIComponent(KEY)+'/photo/'+encodeURIComponent(pid),{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({caption:cap.value||''})}).then(function(r){return r.json();}).then(function(j){ if(j&&j.ok&&j.media) A.media=j.media; }).catch(function(){}); } },true);
  // drag-reorder tiles
  card.addEventListener('dragstart',function(e){ var t=e.target&&e.target.closest?e.target.closest('.mtile'):null; if(t){ _mDrag=t; try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',t.getAttribute('data-pid')||'');}catch(_){}} });
  card.addEventListener('dragover',function(e){ var t=e.target&&e.target.closest?e.target.closest('.mtile'):null; var drop=e.target&&e.target.closest?e.target.closest('#mDrop'):null; if(t&&_mDrag&&t!==_mDrag){ e.preventDefault(); var g=t.parentNode; var r=t.getBoundingClientRect(); var after=(e.clientY-r.top)/r.height>0.5||(e.clientX-r.left)/r.width>0.5; g.insertBefore(_mDrag, after?t.nextSibling:t); } else if(drop&&e.dataTransfer&&e.dataTransfer.types&&Array.prototype.indexOf.call(e.dataTransfer.types,'Files')>=0){ e.preventDefault(); drop.classList.add('drag'); } });
  card.addEventListener('dragleave',function(e){ var drop=e.target&&e.target.closest?e.target.closest('#mDrop'):null; if(drop) drop.classList.remove('drag'); });
  card.addEventListener('drop',function(e){ var drop=e.target&&e.target.closest?e.target.closest('#mDrop'):null; if(drop&&e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){ e.preventDefault(); drop.classList.remove('drag'); uploadMediaFiles(e.dataTransfer.files); return; } if(_mDrag){ e.preventDefault(); _postMediaOrder(); _mDrag=null; } });
  card.addEventListener('dragend',function(){ _mDrag=null; });
}
</script>
