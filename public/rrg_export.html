<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRG — Export Data</title>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--ink:#1a2236;--muted:#6b7488;--soft:#8a93a8;--line:#e6e9f0;--wash:#f5f7fb;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#eef1f6;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.top{color:#fff;padding:26px 0 28px;background:radial-gradient(95% 130% at 28% 15%, #1c2e5c 0%, #112044 42%, #0b1636 70%, #071029 100%);}
.top-in{max-width:1080px;margin:0 auto;padding:0 24px;}
.disc{background:var(--red);color:#fff;border-radius:50%;width:40px;height:40px;font-weight:900;font-size:13px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
.kicker{margin:18px 0 4px;color:var(--red);font-weight:700;letter-spacing:.3em;font-size:11px;text-transform:uppercase;}
h1{font-size:27px;font-weight:800;margin:0;color:#fff;}
.sub{color:#aeb8cf;font-size:13px;margin-top:7px;max-width:720px;}
.wrap{max-width:1040px;margin:22px auto;padding:0 24px 70px;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(10,20,50,.06);overflow:hidden;margin-bottom:20px;}
.ch{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line);} .ch b{color:var(--navy);font-size:15px;} .ch span{color:var(--muted);font-size:12px;}
.cb{padding:26px 22px 30px;}
.tiles{display:flex;flex-wrap:wrap;gap:30px 40px;}
.tile{display:flex;flex-direction:column;align-items:center;gap:14px;width:150px;}
.tile .ic{width:64px;height:64px;color:#9aa4b6;display:flex;align-items:center;justify-content:center;}
.tile .ic svg{width:52px;height:52px;fill:currentColor;}
.xbtn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:10px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap;transition:background .15s;}
.xbtn:hover{background:#0a1a44;}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:22px;}
.gate{max-width:520px;margin:70px auto;text-align:center;color:var(--muted);}
.foot{max-width:1080px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:11.5px;}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<!--rrgback--><a href="./index.html" class="rrg-back" style="position:fixed;left:16px;bottom:16px;z-index:99999;display:inline-flex;align-items:center;gap:7px;background:rgba(0,14,49,.85);color:#fff;text-decoration:none;font:700 12.5px/1 -apple-system,Arial,sans-serif;padding:10px 15px;border-radius:100px;border:1px solid rgba(255,255,255,.22)"><span style="font-size:14px;line-height:1">←</span> Dashboard</a>
<div class="top"><div class="top-in">
  <span class="disc" onclick="location.href='./index.html'">RRG</span>
  <div class="kicker">Data Migration</div>
  <h1>Export your data</h1>
  <div class="sub">Download any part of your book to an Excel-ready spreadsheet (.csv). Great for backups, board reports, or moving data between tools.</div>
</div></div>
<div id="root" class="wrap"><div class="gate">Checking access…</div></div>
<div class="foot">Proprietary &amp; Confidential · Property of Restaurant Realty Group, LLC · Internal RRG use only.</div>
<script>
var IC={
person:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="11" r="2.3" fill="#fff"/><path d="M5 16.4c0-1.8 1.6-2.8 3.5-2.8s3.5 1 3.5 2.8z" fill="#fff"/><rect x="13.5" y="9.6" width="5" height="1.5" rx=".75" fill="#fff"/><rect x="13.5" y="12.4" width="5" height="1.5" rx=".75" fill="#fff"/></svg>',
company:'<svg viewBox="0 0 24 24"><path d="M6 3h9a2 2 0 0 1 2 2v16H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><rect x="7" y="6" width="2.4" height="2.4" rx=".4" fill="#fff"/><rect x="11.6" y="6" width="2.4" height="2.4" rx=".4" fill="#fff"/><rect x="7" y="10.4" width="2.4" height="2.4" rx=".4" fill="#fff"/><rect x="11.6" y="10.4" width="2.4" height="2.4" rx=".4" fill="#fff"/><rect x="9.3" y="16" width="3.4" height="5" fill="#fff"/></svg>',
pipeline:'<svg viewBox="0 0 24 24"><path d="M3.5 4h17a1 1 0 0 1 .78 1.63L15 13.5v5.7a1 1 0 0 1-1.45.9l-3-1.5a1 1 0 0 1-.55-.9V13.5L2.72 5.63A1 1 0 0 1 3.5 4z"/></svg>',
process:'<svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.6"/><circle cx="18" cy="6" r="2.6"/><circle cx="12" cy="18" r="2.6"/><path d="M6 8.8v2.4a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8.8M12 13.2v2.4" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>',
task:'<svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2.2"/><rect x="9" y="2.4" width="6" height="3.2" rx="1.2" fill="#fff"/><circle cx="8.4" cy="11" r=".95" fill="#fff"/><rect x="10.5" y="10.2" width="6" height="1.6" rx=".8" fill="#fff"/><circle cx="8.4" cy="15" r=".95" fill="#fff"/><rect x="10.5" y="14.2" width="6" height="1.6" rx=".8" fill="#fff"/></svg>'
};
var TYPES=[
 {key:'contacts', icon:'person', label:'Export Contacts'},
 {key:'companies', icon:'company', label:'Export Companies'},
 {key:'deals', icon:'pipeline', label:'Export Pipeline Records'},
 {key:'automations', icon:'process', label:'Export Processes'},
 {key:'tasks', icon:'task', label:'Export Tasks'}
];
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function render(){
  var tiles=TYPES.map(function(t){
    return '<div class="tile"><div class="ic">'+IC[t.icon]+'</div><a class="xbtn" href="/api/export/'+t.key+'">'+esc(t.label)+'</a></div>';
  }).join('');
  document.getElementById('root').innerHTML=
    '<div class="card"><div class="ch"><b>Start a New Export</b><span>each export downloads a .csv you can open in Excel or Google Sheets</span></div><div class="cb"><div class="tiles">'+tiles+'</div>'
    +'<div class="note">Exports reflect what you can see: administrators get the whole book; if your access is limited to your own records, the file contains just those. IDs are included so you can re-import or cross-reference later.</div></div></div>';
}
fetch('/api/session',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(s){
  if(!s||!s.canExport){ document.getElementById('root').innerHTML='<div class="gate"><h2 style="color:#000E31">Export access needed</h2>Exporting is limited to administrators and users with export permission. Ask an admin to enable <b>Export &amp; print lists</b> for your role.</div>'; return; }
  render();
}).catch(function(){ render(); });
</script>
</body>
</html>
