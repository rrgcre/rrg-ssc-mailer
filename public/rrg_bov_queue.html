<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRG — Business Valuations</title>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--ink:#1a2236;--muted:#6b7488;--line:#e6e9f0;--wash:#f5f7fb;--green:#1f8a5b;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#eef1f6;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.top{color:#fff;padding:30px 40px 34px;position:relative;overflow:hidden;
  background:radial-gradient(95% 130% at 28% 15%, #1c2e5c 0%, #112044 42%, #0b1636 70%, #071029 100%);}
.top .brand{display:inline-flex;align-items:center;position:relative;z-index:2;}
.top .disc{background:var(--red);color:#fff;border-radius:50%;width:42px;height:42px;font-family:'Arial Black',Arial,sans-serif;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;letter-spacing:-.04em;}
.top .bar{background:#fff;width:3px;height:30px;margin:0 12px;} .top .wm{font-weight:800;font-size:14px;text-transform:uppercase;line-height:.95;}
.kicker{position:relative;z-index:2;margin:22px 0 4px;color:var(--red);font-weight:700;letter-spacing:.3em;font-size:11px;text-transform:uppercase;}
h1{position:relative;z-index:2;font-size:30px;font-weight:800;margin:0;color:#fff;letter-spacing:-.01em;}
.sub{position:relative;z-index:2;color:#aeb8cf;font-size:13px;margin-top:7px;}
.wrap{max-width:1080px;margin:26px auto;padding:0 24px 60px;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 6px 24px rgba(10,20,50,.06);}
.hd{display:flex;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);gap:12px;}
.hd b{color:var(--navy);font-size:14px;} .hd .cnt{color:var(--muted);font-size:12.5px;}
.hd .home{margin-left:12px;text-decoration:none;color:var(--navy);font-weight:600;font-size:12.5px;border:1px solid var(--line);padding:7px 13px;border-radius:8px;}
.hd .home:hover{border-color:#9fb0cc;}
.tabs{display:inline-flex;background:var(--wash);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;}
.tab{border:none;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;font-weight:700;padding:6px 14px;border-radius:7px;cursor:pointer;}
.tab.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(10,20,50,.1);}
.hd .cnt{margin-left:auto;}
.ufilter{margin-left:12px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:12.5px;color:var(--navy);font-weight:600;background:#fff;}
.ufilter:focus{outline:none;border-color:var(--red);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle;}
th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--wash);}
tr:hover td{background:#fbfcfe;}
.biz{font-weight:800;color:var(--navy);font-size:14px;} .meta{color:var(--muted);font-size:11.5px;margin-top:2px;}
.val{white-space:nowrap;} .val .r{font-weight:800;color:var(--red);} .val .t{color:var(--navy);font-weight:600;}
.dim{color:var(--muted);}
.act{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;}
.act a,.act button{font:inherit;font-size:12px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--navy);white-space:nowrap;}
.act a:hover,.act button:hover{border-color:#9fb0cc;}
.act .cim{background:var(--navy);color:#fff;border-color:var(--navy);}
.act .build{background:#b9761a;color:#fff;border-color:#b9761a;}
.act .build:hover{background:#9c6416;border-color:#9c6416;}
.act .del{color:var(--red);border-color:#f0c9c6;}
.pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle;}
.pill.pend{background:#fff4e6;color:#b9761a;border:1px solid #f0d7ad;}
.pill.done{background:#eaf7f0;color:var(--green);border:1px solid #bfe6d1;}
.empty{text-align:center;color:var(--muted);padding:54px 20px;}
.empty b{color:var(--navy);display:block;font-size:15px;margin-bottom:6px;}
.foot{max-width:1080px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:11.5px;}
@media(max-width:720px){ th.hide,td.hide{display:none;} .top{padding:24px 20px;} h1{font-size:24px;} }
</style>
</head>
<body>
<div class="top">
  <span class="brand"><span class="disc">RRG</span><span class="bar"></span><span class="wm">Restaurant<br>Realty<br>Group</span></span>
  <div class="kicker">Seller Pipeline</div>
  <h1>Business Valuations</h1>
  <div class="sub">Every valuation in the pipeline — build the requested ones, reopen a draft, or advance one to a CIM.</div>
</div>

<div class="wrap">
  <div class="card">
    <div class="hd">
      <div class="tabs"><button class="tab on" id="tabMine" onclick="setTab('mine')">My Valuations</button><button class="tab" id="tabAll" onclick="setTab('all')">All Valuations</button></div>
      <select id="userFilter" class="ufilter" style="display:none" onchange="onUserFilter()"></select>
      <span class="cnt" id="cnt"></span><a class="home" href="./index.html">← Dashboard</a>
    </div>
    <div id="body"></div>
  </div>
</div>
<div class="foot">Proprietary &amp; Confidential · Property of Restaurant Realty Group, LLC · Internal RRG use only.</div>

<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function fmt(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d.getTime())) return ''; return (d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(2); }

var ALL=[], ME={username:'',name:'',role:''}, TAB='mine';
function setTab(t){ TAB=t; document.getElementById('tabMine').classList.toggle('on',t==='mine'); document.getElementById('tabAll').classList.toggle('on',t==='all'); paint(); }
function isMine(b){ return (b.byUser && b.byUser===ME.username) || (!b.byUser && b.by && b.by===ME.name); }
function onUserFilter(){ var uf=document.getElementById('userFilter'); if(uf.value){ setTab('all'); } else { paint(); } }
function paint(){
  var list;
  if(TAB==='mine'){ list=ALL.filter(isMine); }
  else {
    var uf=document.getElementById('userFilter'); var val=(ME.role==='admin'&&uf)?uf.value:'';
    list = val ? ALL.filter(function(b){ return (b.byUser||b.by)===val; }) : ALL;
  }
  render(list);
}
function buildUserFilter(){
  if(ME.role!=='admin') return;
  var uf=document.getElementById('userFilter'); if(!uf) return;
  var seen={}, opts=[];
  ALL.forEach(function(b){ var k=b.byUser||b.by; if(k&&!seen[k]){ seen[k]=1; opts.push({key:k,label:b.by||b.byUser}); } });
  opts.sort(function(a,b){ return String(a.label).localeCompare(String(b.label)); });
  uf.innerHTML='<option value="">Filter: everyone</option>'+opts.map(function(o){ return '<option value="'+esc(o.key)+'">'+esc(o.label)+'</option>'; }).join('');
  uf.style.display='';
}

function render(bovs){
  var body=document.getElementById('body'), cnt=document.getElementById('cnt');
  cnt.textContent = bovs.length ? (bovs.length+(TAB==='mine'?' of yours':' in the pipeline')) : '';
  if(!bovs.length){
    body.innerHTML = TAB==='mine'
      ? '<div class="empty"><b>No valuations yet.</b>They arrive here when you click <b style="display:inline">Request BOV</b> on a completed questionnaire — or switch to <b style="display:inline">All Valuations</b> to see the team’s pipeline.</div>'
      : '<div class="empty"><b>No valuations yet.</b>Open the Valuation Questionnaire log, complete a questionnaire, and click <b style="display:inline">Request BOV</b>. It’ll show up here to build, then advance to a CIM.</div>';
    return;
  }
  var rows=bovs.map(function(b){
    var id=encodeURIComponent(b.id);
    var pending=!!b.pending;
    var pill=pending?'<span class="pill pend">Requested</span>':'<span class="pill done">Built</span>';
    var val=pending
      ? '<span class="dim">Awaiting build</span>'
      : '<span class="val"><span class="r">'+esc(b.rangeText||'—')+'</span><br><span class="t">'+esc(b.targetText||'')+'</span></span>';
    var actions=pending
      ? '<a class="build" href="./rrg_bov_generate.html?bov='+id+'">Build Valuation →</a>'+
        '<button class="del" onclick="del(\''+b.id+'\',this)">Delete</button>'
      : '<a href="./rrg_bov_builder.html?bov='+id+'">Open</a>'+
        '<a class="cim" href="./rrg_cim_builder.html?bov='+id+'">Advance to CIM →</a>'+
        '<button class="del" onclick="del(\''+b.id+'\',this)">Delete</button>';
    return '<tr>'+
      '<td><div class="biz">'+esc(b.business||'Untitled')+pill+'</div><div class="meta">'+esc(b.date||fmt(b.createdAt))+(b.by?(' · '+esc(b.by)):'')+'</div></td>'+
      '<td class="hide">'+val+'</td>'+
      '<td class="hide dim">'+(pending?'':(esc(b.multText||'')+'<br>'+esc(b.ebitdaText||'')))+'</td>'+
      '<td><div class="act">'+actions+'</div></td></tr>';
  }).join('');
  body.innerHTML='<table><thead><tr><th>Business</th><th class="hide">Concluded Range / Target</th><th class="hide">Multiple / EBITDA</th><th style="text-align:right">Actions</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function load(){
  Promise.all([
    fetch('/api/session').then(function(r){return r.json();}).catch(function(){return null;}),
    fetch('/api/bovs').then(function(r){return r.json();}).catch(function(){return null;})
  ]).then(function(res){
    var s=res[0], j=res[1];
    if(s&&s.ok){ ME={username:s.username||'',name:s.name||'',role:s.role||''}; }
    if(!j){ document.getElementById('body').innerHTML='<div class="empty"><b>Couldn’t reach the server.</b>The Valuations list works on the hosted toolkit.</div>'; return; }
    ALL=(j&&j.bovs)||[];
    // Reps only see their own — hide the team view + the tabs entirely; admins get the whole team.
    if(ME.role!=='admin'){ TAB='mine'; var tb=document.getElementById('tabMine').parentNode; if(tb) tb.style.display='none'; }
    buildUserFilter(); paint();
  });
}
function del(id,btn){
  if(!confirm('Delete this valuation? This removes it from the list.')) return;
  if(btn){ btn.disabled=true; btn.textContent='Deleting…'; }
  fetch('/api/bov/'+encodeURIComponent(id),{method:'DELETE',credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ load(); } else { if(btn){btn.disabled=false;btn.textContent='Delete';} alert('Could not delete.'); } }).catch(function(){ if(btn){btn.disabled=false;btn.textContent='Delete';} alert('Could not delete.'); });
}
load();
</script>
</body>
</html>
