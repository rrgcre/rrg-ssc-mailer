<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email Studio — RRG</title>
<script src="/rrg_brand.js"></script>
<script src="/rrg_email_composer.js"></script>
<style>
:root{--navy:#20334f;--ink:#1a2236;--muted:#6b7488;--soft:#8a93a8;--line:#e6e9f0;--wash:#f5f7fb;--green:#1f8a5b;--red:#DA2B1F;--blue:#2c5c8f;}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#fbfcfe;}
.wrap{max-width:1120px;margin:18px auto;padding:0 22px 80px;}
.pgh{font-size:22px;font-weight:700;color:var(--navy);margin:0 0 2px;}
.pgs{color:var(--muted);font-size:13px;margin-bottom:16px;}
.note{border:1px solid var(--line);border-radius:8px;padding:11px 14px;font-size:12.5px;line-height:1.55;margin-bottom:16px;}
.note.warn{background:#fef3d6;border-color:#f0dca6;color:#7a5a12;}
.note.ok{background:#e7f5ee;border-color:#bfe4d0;color:#1f7a52;}
.tiles{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.tile{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:120px;}
.tile .k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);}
.tile .v{font-size:22px;font-weight:700;color:var(--navy);margin-top:3px;font-variant-numeric:tabular-nums;}
.tile.red .v{color:var(--red);} .tile.green .v{color:var(--green);}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:9px 15px;font:inherit;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;}
.tabs button.on{color:var(--navy);border-bottom-color:var(--navy);}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:16px;}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--navy);margin:0 0 12px;}
.row{display:flex;gap:12px;flex-wrap:wrap;}
.fld{margin-bottom:12px;} .fld.half{flex:1;min-width:200px;}
label.fl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);margin-bottom:5px;}
input,select,textarea{width:100%;font:inherit;font-size:13.5px;padding:9px 11px;border:1px solid #c4ccda;border-radius:4px;background:#fff;color:var(--ink);}
textarea{resize:vertical;line-height:1.5;}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;min-height:260px;}
.btn{background:#fff;border:1px solid #d7dde8;border-radius:6px;padding:9px 15px;font:inherit;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer;}
.btn:hover{background:#f6f8fc;} .btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);} .btn.red{background:var(--red);color:#fff;border-color:var(--red);}
.btn:disabled{opacity:.5;cursor:default;}
.msg{font-size:12.5px;font-weight:700;margin-left:8px;} .msg.ok{color:var(--green);} .msg.err{color:var(--red);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);padding:8px 10px;border-bottom:1px solid var(--line);}
td{padding:9px 10px;border-bottom:1px solid #f1f3f8;}
.pill{display:inline-block;font-size:10.5px;font-weight:700;border-radius:99px;padding:2px 9px;}
.pill.active{background:#e7f5ee;color:#1f8a5b;} .pill.unsubscribed{background:#eef1f6;color:#6b7488;} .pill.bounced{background:#fdebe9;color:#a5352c;} .pill.complained{background:#fdebe9;color:#a5352c;}
.pill.draft{background:#eef1f6;color:#6b7488;} .pill.sending{background:#fff5e6;color:#8a5a12;} .pill.sent{background:#e7f5ee;color:#1f8a5b;} .pill.paused{background:#fdf1df;color:#b5791f;}
.pill.scheduled{background:#eef3fb;color:#2c5c8f;}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;} @media(max-width:820px){.split{grid-template-columns:1fr;}}
iframe.prev{width:100%;height:420px;border:1px solid var(--line);border-radius:6px;background:#fff;}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.gate{max-width:560px;margin:70px auto;text-align:center;color:var(--muted);}
.gate b{display:block;color:var(--navy);font-size:17px;margin-bottom:6px;}
</style></head>
<body>
<div class="wrap" id="app">
  <div class="pgh">Email Studio</div>
  <div class="pgs">Bulk email to your subscriber list — Amazon SES, suppression-aware, one-click unsubscribe. Subscribers here are separate from your CRM contacts.</div>
  <div id="statusNote"></div>
  <div class="tiles" id="tiles"></div>
  <div class="tabs" id="tabs"><button data-tab="subs" class="on">Subscribers</button><button data-tab="camps">Campaigns</button><button data-tab="supp">Suppression</button></div>
  <div id="tabSubs"></div>
  <div id="tabCamps" hidden></div>
  <div id="tabSupp" hidden></div>
</div>
<script>
(function(){
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function $(id){return document.getElementById(id);}
function api(m,u,b){return fetch(u,{method:m,headers:b?{'Content-Type':'application/json'}:undefined,credentials:'same-origin',body:b?JSON.stringify(b):undefined}).then(function(r){return r.json();});}
var CFG={}, EDIT=null, POLL=null, CAMPVIEW=null, CAMPQ="", CAMPDAYS=0;
var TAB='subs';

function boot(){
  var brand={ primary:'#16233f', accent:'#DA2B1F', logo:'', style:'modern', orgName:'' };
  api('GET','/api/appname').then(function(a){ var pal=(a&&a.palette)||{}; if(pal.primary)brand.primary=pal.primary; if(pal.accent)brand.accent=pal.accent; if(a&&a.logoUrl){ brand.logo=(a.logoUrl.charAt(0)==='/')?(location.origin+a.logoUrl):a.logoUrl; } if(a&&a.emailStyle)brand.style=a.emailStyle; brand.orgName=(a&&a.org&&a.org.name)||(a&&a.name)||''; }).catch(function(){});
  api('GET','/api/mail/config').then(function(cfg){
    CFG=cfg||{}; CFG.brand=brand;
    paintStatus(); buildSubs(); buildSupp(); wireTabs();
    loadStats(); loadSubs();
  }).catch(function(){ $('statusNote').innerHTML='<div class="note warn">Could not reach the mail engine.</div>'; });
}
function wireTabs(){
  var b=$('tabs').querySelectorAll('button');
  for(var i=0;i<b.length;i++){ b[i].onclick=function(){ switchTab(this.getAttribute('data-tab')); }; }
}
function switchTab(t){
  TAB=t;
  var b=$('tabs').querySelectorAll('button');
  for(var i=0;i<b.length;i++){ b[i].classList.toggle('on', b[i].getAttribute('data-tab')===t); }
  $('tabSubs').hidden=t!=='subs'; $('tabCamps').hidden=t!=='camps'; $('tabSupp').hidden=t!=='supp';
  if(t==='camps') loadCampaigns();
  if(t==='supp') loadSupp();
  if(t==='subs') loadSubs();
}
function paintStatus(){
  var h='';
  if(!CFG.storage){
    h='<div class="note warn"><b>Storage not connected.</b> The subscriber database (Postgres) is not configured yet. Set <code>DATABASE_URL</code> on the server to enable import, browsing, and sending. Everything below is inert until then.</div>';
  } else if(!CFG.sending){
    h='<div class="note warn"><b>Sending is off.</b> Postgres is connected, so you can import and manage subscribers, but Amazon SES is not configured &mdash; campaigns can be drafted and previewed but not sent. Set <code>SES_FROM</code> and AWS credentials to turn on sending.</div>';
  } else {
    h='<div class="note ok"><b>Connected.</b> Sending as '+esc(CFG.fromName||'')+' &lt;'+esc(CFG.from||'')+'&gt; &middot; up to '+esc(CFG.rate)+'/sec.</div>';
  }
  $('statusNote').innerHTML=h;
}
function loadStats(){
  if(!CFG.storage){ $('tiles').innerHTML=''; return; }
  api('GET','/api/mail/stats').then(function(s){
    if(!s||!s.ok){ $('tiles').innerHTML=''; return; }
    var b=s.subscribers||{};
    function tile(k,v,cls){ return '<div class="tile '+(cls||'')+'"><div class="k">'+k+'</div><div class="v">'+Number(v||0).toLocaleString()+'</div></div>'; }
    $('tiles').innerHTML=tile('Active',b.active,'green')+tile('Unsubscribed',b.unsubscribed)+tile('Bounced',b.bounced,'red')+tile('Complained',b.complained,'red')+tile('Suppressed',s.suppressions,'red')+tile('Total',s.total);
  }).catch(function(){});
}

/* ---------- SUBSCRIBERS ---------- */
function buildSubs(){
  $('tabSubs').innerHTML=
    '<div class="card"><h2>Import subscribers</h2>'+
    '<div class="pgs" style="margin-bottom:10px">Paste a CSV with a header row (<code>email,first_name,last_name</code>) or just one email per line. Duplicates and already-suppressed addresses are skipped automatically. This list stays separate from your CRM contacts.</div>'+
    '<div class="fld"><textarea id="impText" class="code" placeholder="email,first_name,last_name&#10;jane@example.com,Jane,Doe&#10;&#10;--- or ---&#10;&#10;jane@example.com&#10;john@example.com"></textarea></div>'+
    '<div class="row"><div class="fld half"><label class="fl">Source label</label><input id="impSrc" placeholder="e.g. 2026 master list"></div></div>'+
    '<div><button class="btn primary" id="impBtn">Import</button><span class="msg" id="impMsg"></span></div></div>'+
    '<div class="card"><h2>Subscribers</h2>'+
    '<div class="toolbar"><input id="subQ" placeholder="Search email..." style="max-width:260px"><select id="subStatus" style="max-width:180px"><option value="">All statuses</option><option value="active">Active</option><option value="unsubscribed">Unsubscribed</option><option value="bounced">Bounced</option><option value="complained">Complained</option></select><button class="btn" id="subGo">Search</button></div>'+
    '<div id="subTable"><div class="pgs">Loading...</div></div></div>';
  $('impBtn').onclick=doImport;
  $('subGo').onclick=loadSubs;
  $('subQ').addEventListener('keydown',function(e){ if(e.key==='Enter') loadSubs(); });
}
function doImport(){
  if(!CFG.storage){ return; }
  var txt=$('impText').value.trim();
  var m=$('impMsg');
  if(!txt){ m.className='msg err'; m.textContent='Paste some addresses first.'; return; }
  var btn=$('impBtn'); btn.disabled=true; m.className='msg'; m.textContent='Importing...';
  api('POST','/api/mail/import',{ csv:txt, source:($('impSrc').value||'import') }).then(function(r){
    btn.disabled=false;
    if(!r||!r.ok){ m.className='msg err'; m.textContent=(r&&r.error)||'Import failed.'; return; }
    m.className='msg ok'; m.textContent='Added '+(r.added||0)+', updated '+(r.updated||0)+', skipped '+(r.skipped||0)+', suppressed '+(r.suppressed||0)+'.';
    $('impText').value='';
    loadStats(); loadSubs();
  }).catch(function(){ btn.disabled=false; m.className='msg err'; m.textContent='Import failed.'; });
}
function loadSubs(){
  if(!CFG.storage){ $('subTable') && ($('subTable').innerHTML='<div class="note warn">Connect Postgres to browse subscribers.</div>'); return; }
  if(!$('subTable')) return;
  var qv=encodeURIComponent(($('subQ')?$('subQ').value:'').trim());
  var st=$('subStatus')?$('subStatus').value:'';
  api('GET','/api/mail/subscribers?limit=200&q='+qv+'&status='+encodeURIComponent(st)).then(function(r){
    if(!r||!r.ok){ $('subTable').innerHTML='<div class="note warn">Could not load subscribers.</div>'; return; }
    var rows=r.subscribers||[];
    if(!rows.length){ $('subTable').innerHTML='<div class="pgs">No subscribers match.</div>'; return; }
    var h='<table><thead><tr><th>Email</th><th>Name</th><th>Status</th><th>Source</th><th></th></tr></thead><tbody>';
    rows.forEach(function(s){
      var nm=[s.first_name,s.last_name].filter(Boolean).join(' ');
      h+='<tr><td>'+esc(s.email)+'</td><td>'+esc(nm)+'</td><td><span class="pill '+esc(s.status)+'">'+esc(s.status)+'</span></td><td>'+esc(s.source||'')+'</td>'+
         '<td style="text-align:right">'+(s.status==='active'?'<button class="btn" data-supp="'+esc(s.email)+'">Suppress</button>':'')+'</td></tr>';
    });
    h+='</tbody></table>';
    if(rows.length>=200) h+='<div class="pgs" style="margin-top:10px">Showing first 200. Refine your search to narrow.</div>';
    $('subTable').innerHTML=h;
    var bs=$('subTable').querySelectorAll('[data-supp]');
    for(var i=0;i<bs.length;i++){ bs[i].onclick=function(){ suppressOne(this.getAttribute('data-supp')); }; }
  }).catch(function(){ $('subTable').innerHTML='<div class="note warn">Could not load subscribers.</div>'; });
}
function suppressOne(email){
  if(!email) return;
  api('POST','/api/mail/suppress',{ email:email }).then(function(){ loadStats(); loadSubs(); loadSupp(); });
}

/* ---------- CAMPAIGNS ---------- */
function starterHtml(){
  if(window.RRGComposer){ try{ return window.RRGComposer.export(window.RRGComposer.defaultBlocks(), CFG.brand||{}); }catch(e){} }
  var b=CFG.brand||{}; var P=b.primary||'#16233f', A=b.accent||'#DA2B1F';
  var logo = b.logo
    ? '<img src="'+b.logo+'" alt="Restaurant Realty Group" height="40" style="display:block;height:40px;width:auto;border:0;">'
    : '<table role="presentation" cellpadding="0" cellspacing="0"><tr>'
      +'<td style="vertical-align:middle;padding-right:12px;"><div style="width:44px;height:44px;background:'+A+';border-radius:50%;text-align:center;line-height:44px;color:#fff;font:700 15px/44px Arial,Helvetica,sans-serif;letter-spacing:.5px;">RRG</div></td>'
      +'<td style="vertical-align:middle;border-left:2px solid rgba(255,255,255,.25);padding-left:12px;"><div style="color:#fff;font:700 16px/1.15 Arial,Helvetica,sans-serif;letter-spacing:.4px;">RESTAURANT REALTY GROUP</div><div style="color:rgba(255,255,255,.62);font:600 10.5px/1.5 Arial,Helvetica,sans-serif;letter-spacing:1.4px;text-transform:uppercase;margin-top:3px;">Restaurant Transactions. Done Right.</div></td>'
      +'</tr></table>';
  return ''
  +'<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef1f6;font-family:Arial,Helvetica,sans-serif;"><tr><td align="center" style="padding:28px 14px;">\n'
  +'<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:600px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 6px 22px rgba(20,30,55,.10);">\n'
  +'  <tr><td style="background:'+P+';padding:24px 34px;">'+logo+'</td></tr>\n'
  +'  <tr><td style="height:3px;background:'+A+';line-height:3px;font-size:0;">&nbsp;</td></tr>\n'
  +'  <tr><td style="padding:0;"><div style="background:#dfe4ec;height:240px;text-align:center;color:#9aa3b5;font:600 12px/240px Arial,Helvetica,sans-serif;">Your listing photo — replace the image URL</div></td></tr>\n'
  +'  <tr><td style="padding:9px 34px 0;"><div style="color:#9aa3b5;font:italic 400 11px/1.5 Arial,Helvetica,sans-serif;">Representative image — does not depict the business offered.</div></td></tr>\n'
  +'  <tr><td style="padding:22px 34px 0;">\n'
  +'    <div style="color:'+A+';font:700 11px/1.4 Arial,Helvetica,sans-serif;letter-spacing:2px;text-transform:uppercase;">New Opportunity</div>\n'
  +'    <h1 style="margin:8px 0 6px;color:'+P+';font:700 27px/1.2 Arial,Helvetica,sans-serif;letter-spacing:-.3px;">Headline goes here</h1>\n'
  +'    <div style="color:#5c667d;font:600 14px/1.5 Arial,Helvetica,sans-serif;">Concept &middot; Years in operation &middot; What is included</div>\n'
  +'  </td></tr>\n'
  +'  <tr><td style="padding:20px 34px 4px;">\n'
  +'    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #e6e9f0;border-radius:10px;background:#f8fafc;">\n'
  +'      <tr><td width="50%" style="padding:16px 18px;border-right:1px solid #e6e9f0;border-bottom:1px solid #e6e9f0;"><div style="color:#8a93a8;font:700 10px/1.4 Arial,Helvetica,sans-serif;letter-spacing:1.2px;text-transform:uppercase;">Annual Sales</div><div style="color:'+P+';font:700 21px/1.25 Arial,Helvetica,sans-serif;margin-top:3px;">$0.0M</div></td>\n'
  +'      <td width="50%" style="padding:16px 18px;border-bottom:1px solid #e6e9f0;"><div style="color:#8a93a8;font:700 10px/1.4 Arial,Helvetica,sans-serif;letter-spacing:1.2px;text-transform:uppercase;">Real Estate</div><div style="color:'+P+';font:700 21px/1.25 Arial,Helvetica,sans-serif;margin-top:3px;">Included</div></td></tr>\n'
  +'      <tr><td width="50%" style="padding:16px 18px;border-right:1px solid #e6e9f0;"><div style="color:#8a93a8;font:700 10px/1.4 Arial,Helvetica,sans-serif;letter-spacing:1.2px;text-transform:uppercase;">Operating History</div><div style="color:'+P+';font:700 21px/1.25 Arial,Helvetica,sans-serif;margin-top:3px;">00+ Years</div></td>\n'
  +'      <td width="50%" style="padding:16px 18px;"><div style="color:#8a93a8;font:700 10px/1.4 Arial,Helvetica,sans-serif;letter-spacing:1.2px;text-transform:uppercase;">Location</div><div style="color:'+P+';font:700 21px/1.25 Arial,Helvetica,sans-serif;margin-top:3px;">City, ST</div></td></tr>\n'
  +'    </table>\n'
  +'  </td></tr>\n'
  +'  <tr><td style="padding:20px 34px 0;">\n'
  +'    <p style="margin:0 0 15px;color:#3d4453;font:400 15px/1.65 Arial,Helvetica,sans-serif;">Hi {{first_name}}, open with the single most compelling line about this opportunity. Keep it tight and let the offer do the talking.</p>\n'
  +'    <p style="margin:0;color:#3d4453;font:400 15px/1.65 Arial,Helvetica,sans-serif;">Add a second short paragraph with the key thesis, e.g. <b style="color:'+P+';">ongoing cash flow</b> and <b style="color:'+P+';">underlying real estate value</b>.</p>\n'
  +'  </td></tr>\n'
  +'  <tr><td style="padding:24px 34px 0;">\n'
  +'    <div style="color:'+P+';font:700 12px/1.4 Arial,Helvetica,sans-serif;letter-spacing:1.6px;text-transform:uppercase;padding-bottom:10px;border-bottom:2px solid '+P+';">Highlights</div>\n'
  +'    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:12px;">\n'
  +'      <tr><td style="padding:6px 0;vertical-align:top;width:22px;color:'+A+';font:700 15px/1.5 Arial,Helvetica,sans-serif;">&#10003;</td><td style="padding:6px 0;color:#3d4453;font:400 14.5px/1.55 Arial,Helvetica,sans-serif;">First key highlight</td></tr>\n'
  +'      <tr><td style="padding:6px 0;vertical-align:top;width:22px;color:'+A+';font:700 15px/1.5 Arial,Helvetica,sans-serif;">&#10003;</td><td style="padding:6px 0;color:#3d4453;font:400 14.5px/1.55 Arial,Helvetica,sans-serif;">Second key highlight</td></tr>\n'
  +'      <tr><td style="padding:6px 0;vertical-align:top;width:22px;color:'+A+';font:700 15px/1.5 Arial,Helvetica,sans-serif;">&#10003;</td><td style="padding:6px 0;color:#3d4453;font:400 14.5px/1.55 Arial,Helvetica,sans-serif;">Third key highlight</td></tr>\n'
  +'    </table>\n'
  +'  </td></tr>\n'
  +'  <tr><td style="padding:28px 34px 6px;" align="center"><table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="border-radius:8px;background:'+P+';"><a href="https://rrgcre.com" style="display:inline-block;padding:15px 34px;color:#fff;font:700 15px/1 Arial,Helvetica,sans-serif;letter-spacing:.3px;text-decoration:none;border-radius:8px;">Request the Offering Memorandum &rarr;</a></td></tr></table><div style="margin-top:12px;color:#8a93a8;font:400 12.5px/1.5 Arial,Helvetica,sans-serif;">NDA required &middot; Financials available to qualified buyers</div></td></tr>\n'
  +'  <tr><td style="padding:22px 34px 4px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-top:1px solid #e6e9f0;"><tr><td style="padding-top:18px;"><div style="color:'+P+';font:700 15px/1.3 Arial,Helvetica,sans-serif;">Your RRG Advisor</div><div style="color:#5c667d;font:400 13px/1.6 Arial,Helvetica,sans-serif;margin-top:2px;">Restaurant Realty Group &middot; (210) 555-0100 &middot; deals@rrgcre.com</div></td></tr></table></td></tr>\n'
  +'  <tr><td style="padding:22px 34px 26px;background:#f5f7fb;border-top:1px solid #e6e9f0;"><div style="color:#8a93a8;font:600 10px/1.6 Arial,Helvetica,sans-serif;letter-spacing:1.2px;text-transform:uppercase;text-align:center;">Austin &middot; Dallas &middot; Houston &middot; San Antonio</div><div style="color:#9aa3b5;font:400 11.5px/1.7 Arial,Helvetica,sans-serif;text-align:center;margin-top:10px;">You are receiving this because you opted in to RRG listing alerts.<br><a href="{{unsubscribe_url}}" style="color:#5c667d;text-decoration:underline;">Unsubscribe</a></div></td></tr>\n'
  +'</table>\n</td></tr></table>';
}
function loadCampaigns(){
  if(!CFG.storage){ $('tabCamps').innerHTML='<div class="note warn">Connect Postgres to manage campaigns.</div>'; return; }
  if(EDIT){ renderEditor(); return; }
  if(CAMPVIEW==null) CAMPVIEW='active';
  var arch = CAMPVIEW==='archived' ? '1':'0';
  var qv = encodeURIComponent((CAMPQ||'').trim());
  api('GET','/api/mail/campaigns?archived='+arch+'&q='+qv+'&days='+(CAMPDAYS||0)).then(function(r){
    var rows=(r&&r.campaigns)||[];
    var h='<div class="card" style="padding:0;overflow:hidden">';
    // header bar
    h+='<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);">'
      +'<div class="tabs" style="border:none;margin:0;gap:2px;">'
      +'<button data-cv="active" class="'+(CAMPVIEW==='active'?'on':'')+'" style="padding:6px 12px;">Campaigns</button>'
      +'<button data-cv="archived" class="'+(CAMPVIEW==='archived'?'on':'')+'" style="padding:6px 12px;">Archived</button>'
      +'</div>'
      +'<div class="toolbar" style="margin:0;">'

  if(c.status==='sending'){
    POLL=setInterval(function(){
      api('GET','/api/mail/campaigns/'+c.id).then(function(r){
        if(r&&r.campaign){ EDIT=r.campaign; if(TAB==='camps' && !$('cHtml')){ renderMonitor(); } if(r.campaign.status!=='sending'){ stopPoll(); loadStats(); } }
      });
    },4000);
  }
}
function stopPoll(){ if(POLL){ clearInterval(POLL); POLL=null; } }

/* ---------- SUPPRESSION ---------- */
function buildSupp(){
  $('tabSupp').innerHTML=
    '<div class="card"><h2>Add to suppression list</h2>'+
    '<div class="pgs" style="margin-bottom:10px">Anyone here is permanently excluded from every send, tenant-wide. Bounces, complaints, and one-click unsubscribes land here automatically &mdash; add addresses manually when someone asks off by other means.</div>'+
    '<div class="toolbar"><input id="supAdd" placeholder="email to suppress" style="max-width:280px"><button class="btn primary" id="supAddBtn">Add</button><span class="msg" id="supMsg"></span></div></div>'+
    '<div class="card"><h2>Suppressed addresses</h2>'+
    '<div class="toolbar"><input id="supQ" placeholder="Search..." style="max-width:260px"><button class="btn" id="supGo">Search</button></div>'+
    '<div id="supTable"><div class="pgs">Loading...</div></div></div>';
  $('supAddBtn').onclick=function(){
    var e=$('supAdd').value.trim(), m=$('supMsg');
    if(!e){ m.className='msg err'; m.textContent='Enter an email.'; return; }
    api('POST','/api/mail/suppress',{ email:e }).then(function(r){
      if(!r||!r.ok){ m.className='msg err'; m.textContent=(r&&r.error)||'Failed.'; return; }
      m.className='msg ok'; m.textContent='Suppressed.'; $('supAdd').value='';
      loadStats(); loadSupp();
    });
  };
  $('supGo').onclick=loadSupp;
  $('supQ').addEventListener('keydown',function(e){ if(e.key==='Enter') loadSupp(); });
}
function loadSupp(){
  if(!CFG.storage){ $('supTable') && ($('supTable').innerHTML='<div class="note warn">Connect Postgres to view the suppression list.</div>'); return; }
  if(!$('supTable')) return;
  var qv=encodeURIComponent(($('supQ')?$('supQ').value:'').trim());
  api('GET','/api/mail/suppressions?q='+qv).then(function(r){
    if(!r||!r.ok){ $('supTable').innerHTML='<div class="note warn">Could not load.</div>'; return; }
    var rows=r.suppressions||[];
    if(!rows.length){ $('supTable').innerHTML='<div class="pgs">Nothing suppressed'+(qv?' matches':' yet')+'.</div>'; return; }
    var h='<table><thead><tr><th>Email</th><th>Reason</th><th>Detail</th><th>When</th></tr></thead><tbody>';
    rows.forEach(function(s){
      var d=''; try{ d=new Date(s.created_at).toLocaleDateString(); }catch(e){}
      h+='<tr><td>'+esc(s.email)+'</td><td><span class="pill '+(s.reason==='complaint'||s.reason==='bounce'?'bounced':'unsubscribed')+'">'+esc(s.reason)+'</span></td><td>'+esc(s.detail||'')+'</td><td>'+esc(d)+'</td></tr>';
    });
    h+='</tbody></table>';
    if(rows.length>=300) h+='<div class="pgs" style="margin-top:10px">Showing 300 most recent. Search to find a specific address.</div>';
    $('supTable').innerHTML=h;
  }).catch(function(){ $('supTable').innerHTML='<div class="note warn">Could not load.</div>'; });
}

boot();
})();
</script>
</body></html>
