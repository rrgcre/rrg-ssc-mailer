<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullServe — Email Templates</title>
<style>.rl-filtbtn{display:none!important;}</style>
<script src="/rrg_list.js"></script>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--ink:#1a2236;--muted:#6b7488;--soft:#8a93a8;--line:#e6e9f0;--wash:#f5f7fb;--green:#1f8a5b;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#eef1f6;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);}
.wrap{max-width:1120px;margin:0 auto;padding:24px 28px 60px;}
.pgh{font-size:26px;font-weight:800;color:var(--navy);margin:6px 0 2px;}
.pgs{color:var(--muted);font-size:13.5px;margin-bottom:20px;max-width:780px;line-height:1.5;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(10,20,50,.06);overflow:hidden;margin-bottom:20px;}
.hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;}
.hd b{color:var(--navy);font-size:15px;} .hd .sp{margin-left:auto;}
.cb{padding:6px 8px 10px;}
.lk{color:var(--navy);text-decoration:none;font-weight:600;} .lk:hover{text-decoration:underline;}
.meta{color:var(--muted);font-size:12px;}
.acts{display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end;white-space:nowrap;}
.badge{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;border-radius:5px;padding:2px 8px;}
.badge.sh{color:#1f6f4e;background:#e7f5ee;border:1px solid #bce3cd;}
.badge.pe{color:#2647b0;background:#eef2fb;border:1px solid #d6e0f5;}
.btn{font:inherit;font-size:12.5px;font-weight:700;padding:8px 13px;border:1px solid #cdd6e6;border-radius:9px;background:#fff;color:var(--navy);cursor:pointer;white-space:nowrap;}
.btn:hover{background:#f4f7fb;}
.btn.sm{padding:6px 11px;font-size:12px;}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy);} .btn.pri:hover{background:#0a1a44;}
.btn.red{background:var(--red);color:#fff;border-color:var(--red);}
.btn.ghost{background:#fff;} .btn.danger{color:var(--red);border-color:#f0c9c6;} .btn.danger:hover{background:#fdeceb;}
.btn:disabled{opacity:.5;cursor:default;}
.ch{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;} .ch b{color:var(--navy);font-size:16px;} .ch .sp{margin-left:auto;display:flex;gap:8px;align-items:center;}
.body{padding:20px;}
.fld{margin-bottom:14px;}
.fld label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:700;margin-bottom:6px;}
.fld input[type=text],.fld textarea{font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;width:100%;color:var(--ink);background:#fff;}
.fld textarea{min-height:230px;resize:vertical;line-height:1.55;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
.seg label{font-size:12.5px;font-weight:700;padding:8px 14px;cursor:pointer;color:var(--muted);background:#fff;}
.seg label.on{background:var(--navy);color:#fff;}
.seg input{display:none;}
.tokens{font-size:11.5px;color:var(--soft);margin-top:6px;}
.tokens code{background:#f2f4f8;border-radius:4px;padding:1px 5px;font-size:11px;color:#5b6472;}
.fldpalette{margin-top:8px;} .palgrp{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:6px;} .palgl{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);font-weight:800;margin-right:3px;min-width:82px;} .tokchip{background:#eef3fb;border:1px solid #d3e2f6;color:#2f6fd0;border-radius:100px;padding:3px 10px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;} .tokchip:hover{background:#e2eefb;}
.msg{font-size:12.5px;font-weight:700;} .msg.ok{color:var(--green);} .msg.err{color:var(--red);}
.empty{padding:34px 20px;text-align:center;color:var(--soft);font-size:13.5px;}
.ro{color:var(--muted);font-size:12.5px;background:#f7f9fc;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:12px;}
</style>
<script src="/rrg_brand.js"></script>
<script src="/rrg_rte.js"></script>
</head>
<body>
<div class="wrap">
  <h1 class="pgh">Email Templates</h1>
  <div class="pgs">Write your go-to emails once and reuse them — in the send composer on a contact and in automation steps. Mark a template <b>Personal</b> (only you) or <b>Shared</b> (the whole team). Personalize with tokens like <code>{{first_name}}</code>.</div>
  <div id="root"></div>
</div>
<script>
var TPLS=[], CTL=null, BUILT=false, EDIT=null, SCOPE='personal', DEL_ARM=false;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(iso){ if(!iso) return ''; var x=String(iso).slice(0,10).split('-'); if(x.length!==3) return String(iso).slice(0,10); return x[1]+'/'+x[2]+'/'+x[0]; }
function api(m,u,b){return fetch(u,{method:m,credentials:'same-origin',headers:b?{'Content-Type':'application/json'}:undefined,body:b?JSON.stringify(b):undefined}).then(function(r){return r.json();});}
var LIST_SHELL='<div class="card"><div class="hd"><b>Email Templates</b><span class="meta" id="tcount"></span><span class="sp"></span><button class="btn sm pri" id="t_new">+ New template</button></div><div class="cb"><div id="tlist"><div class="empty">Loading…</div></div></div></div><div id="editor"></div>';
function scopeBadge(t){ return t.scope==='shared'?'<span class="badge sh">Shared</span>':'<span class="badge pe">Personal</span>'; }
function actionsCell(t){ var s='<button class="btn ghost sm" data-edit="'+esc(t.id)+'">'+(t.mine?'Edit':'View')+'</button>'; if(t.mine) s+='<button class="btn danger sm" data-del="'+esc(t.id)+'">Delete</button>'; return '<div class="acts">'+s+'</div>'; }
function listCfg(){ return { mount:'#tlist', data:TPLS, key:'emailtpls',
  empty:'<div class="empty">No templates yet. Click <b>+ New template</b> to write your first.</div>',
  rowId:function(t){return t.id;}, defaultSort:0, defaultDir:1,
  columns:[
    { label:'Template', sort:function(a,b){return RRGList.cmp(a.name,b.name);}, cell:function(t){ return '<a class="lk" href="#" data-edit="'+esc(t.id)+'">'+esc(t.name||'Untitled')+'</a>'; } },
    { label:'Visibility', sort:function(a,b){return RRGList.cmp(a.scope,b.scope);}, cell:scopeBadge },
    { label:'Subject', sort:function(a,b){return RRGList.cmp(a.subject,b.subject);}, cell:function(t){ return t.subject?('<span class="meta" style="color:var(--ink)">'+esc(t.subject)+'</span>'):'<span class="meta">—</span>'; } },
    { label:'Owner', sort:function(a,b){return RRGList.cmp(a.ownerName,b.ownerName);}, cell:function(t){ return t.ownerName?esc(t.ownerName):(t.mine?'You':'<span class="meta">—</span>'); } },
    { label:'Updated', sort:function(a,b){return RRGList.cmp(a.updatedAt,b.updatedAt);}, cell:function(t){ return '<span class="meta">'+esc(fmt(t.updatedAt))+'</span>'; } },
    { label:'', sortable:false, cell:actionsCell }
  ] }; }
function refreshList(){ if(CTL) CTL.refresh(TPLS); else CTL=RRGList.create(listCfg()); var c=document.getElementById('tcount'); if(c) c.textContent=TPLS.length+' total'; }
function curById(id){ return TPLS.filter(function(t){return t.id===id;})[0]||null; }
var PAL_FIELDS=[['Contact',[['{{first_name}}','First name'],['{{last_name}}','Last name'],['{{name}}','Full name'],['{{company}}','Company'],['{{title}}','Title'],['{{email}}','Email'],['{{phone}}','Phone']]],['You (sender)',[['{{my_name}}','My name'],['{{my_title}}','My title'],['{{my_phone}}','My phone'],['{{my_email}}','My email']]],['Listing',[['{{listing_name}}','Listing name'],['{{listing_number}}','Listing #']]],['Other',[['{{today}}','Today\u2019s date']]]];
function palHtml(){ return PAL_FIELDS.map(function(g){ return '<div class="palgrp"><span class="palgl">'+esc(g[0])+'</span>'+g[1].map(function(f){ return '<button type="button" class="tokchip" data-tok="'+esc(f[0])+'" title="'+esc(f[0])+'">'+esc(f[1])+'</button>'; }).join('')+'</div>'; }).join(''); }
function renderEditor(){
  var host=document.getElementById('editor'); if(!host) return;
  if(!EDIT){ host.innerHTML=''; return; }
  var t=EDIT; var ro=!t.mine;
  SCOPE=(t.scope==='shared'?'shared':'personal');
  host.innerHTML='<div class="card"><div class="ch"><b>'+(ro?'View template':(t.id?'Edit template':'New template'))+'</b><span class="sp"><span class="msg" id="msg"></span>'+((t.id&&t.mine)?'<button class="btn danger sm" id="delBtn">Delete</button>':'')+'<button class="btn ghost sm" id="closeBtn">Close</button>'+(ro?'':'<button class="btn red" id="saveBtn">Save</button>')+'</span></div><div class="body">'
    +(ro?'<div class="ro">Shared template'+(t.ownerName?(' by <b>'+esc(t.ownerName)+'</b>'):'')+' — view only. Use + New template to make your own copy.</div>':'')
    +'<div class="fld"><label>Template name</label><input type="text" id="tName" value="'+esc(t.name||'')+'"'+(ro?' readonly':'')+' placeholder="e.g. New buyer intro"></div>'
    +'<div class="fld"><label>Visibility</label><div class="seg" id="scopeSeg"><label id="sc_p"'+((SCOPE==='personal')?' class="on"':'')+'><input type="radio" name="sc" value="personal"'+((SCOPE==='personal')?' checked':'')+(ro?' disabled':'')+'>Personal</label><label id="sc_s"'+((SCOPE==='shared')?' class="on"':'')+'><input type="radio" name="sc" value="shared"'+((SCOPE==='shared')?' checked':'')+(ro?' disabled':'')+'>Shared</label></div><div class="tokens">Personal = only you. Shared = the whole team can use it.</div></div>'
    +'<div class="fld"><label>Subject</label><input type="text" id="tSubject" value="'+esc(t.subject||'')+'"'+(ro?' readonly':'')+' placeholder="e.g. Great connecting, {{first_name}}"></div>'
    +'<div class="fld"><label>Body</label>'+(ro?('<div class="rrgrt" style="border:1px solid #cfd6e2;border-radius:9px"><div class="rrgrt-ed" style="padding:10px 12px;min-height:120px">'+RRGRte.toHtml(t.body||'')+'</div></div>'):RRGRte.html('tBody',{value:t.body||'',placeholder:'Write your email… use the { } menu for merge fields.'}))+'</div>'
    +'</div></div>';
  document.getElementById('closeBtn').onclick=function(){ EDIT=null; renderEditor(); };
  if(!ro){
    if(window.RRGRte) RRGRte.wire('tBody',{});
    var seg=document.getElementById('scopeSeg');
    Array.prototype.forEach.call(seg.querySelectorAll('input'),function(r){ r.onchange=function(){ SCOPE=r.value; document.getElementById('sc_p').classList.toggle('on',SCOPE==='personal'); document.getElementById('sc_s').classList.toggle('on',SCOPE==='shared'); }; });
    document.getElementById('saveBtn').onclick=save;
    var db=document.getElementById('delBtn'); if(db) db.onclick=onDelete;
    var lastFld=document.getElementById('tBody');
    ['tSubject','tBody'].forEach(function(id){ var el=document.getElementById(id); if(el) el.addEventListener('focus',function(){ lastFld=el; }); });
    var pal=document.getElementById('tokpal'); if(pal){ Array.prototype.forEach.call(pal.querySelectorAll('.tokchip'),function(c){ c.addEventListener('click',function(){ var tok=c.getAttribute('data-tok'); var el=lastFld||document.getElementById('tBody'); if(!el) return; var st=el.selectionStart||0, en=el.selectionEnd||0, v=el.value; el.value=v.slice(0,st)+tok+v.slice(en); var np=st+tok.length; el.focus(); try{el.setSelectionRange(np,np);}catch(e){} }); }); }
  }
}
function render(){
  var root=document.getElementById('root');
  if(!BUILT){ root.innerHTML=LIST_SHELL; BUILT=true; document.getElementById('t_new').onclick=newTpl; }
  refreshList(); renderEditor();
}
function openEdit(id){ var t=curById(id); if(!t) return; EDIT=JSON.parse(JSON.stringify(t)); renderEditor(); var ed=document.getElementById('editor'); if(ed) ed.scrollIntoView({behavior:'smooth',block:'start'}); }
function newTpl(){ EDIT={id:'',name:'',subject:'',body:'',scope:'personal',mine:true}; SCOPE='personal'; renderEditor(); var ed=document.getElementById('editor'); if(ed) ed.scrollIntoView({behavior:'smooth',block:'start'}); }
function msg(t,cls){ var m=document.getElementById('msg'); if(!m) return; m.textContent=t; m.className='msg '+(cls||''); if(t){ setTimeout(function(){ if(m.textContent===t){m.textContent='';m.className='msg';} },3000); } }
function load(){ api('GET','/api/email-templates').then(function(j){ TPLS=j.templates||[]; render(); }); }
function save(){
  var name=(document.getElementById('tName').value||'').trim(); if(!name){ msg('Name the template.','err'); return; }
  var body={ name:name, scope:SCOPE, subject:document.getElementById('tSubject').value, body:(window.RRGRte?RRGRte.get('tBody'):((document.getElementById('tBody')||{}).value||'')) };
  if(EDIT&&EDIT.id) body.id=EDIT.id;
  var btn=document.getElementById('saveBtn'); btn.disabled=true;
  api('POST','/api/email-templates',body).then(function(j){ btn.disabled=false; if(!j.ok){ msg(j.error||'Save failed.','err'); return; } EDIT=j.template||EDIT; load(); msg('Saved','ok'); });
}
function onDelete(){
  if(!EDIT||!EDIT.id) return;
  if(!DEL_ARM){ DEL_ARM=true; var b=document.getElementById('delBtn'); b.textContent='Really delete?'; b.classList.add('red'); setTimeout(function(){ if(DEL_ARM){ DEL_ARM=false; var x=document.getElementById('delBtn'); if(x){x.textContent='Delete';x.classList.remove('red');} } },3500); return; }
  DEL_ARM=false;
  api('DELETE','/api/email-templates/'+encodeURIComponent(EDIT.id)).then(function(j){ if(!j.ok){ msg(j.error||'Delete failed.','err'); return; } EDIT=null; load(); });
}
document.addEventListener('click',async function(e){ if(!e.target.closest) return; var ed=e.target.closest('[data-edit]'); if(ed){ e.preventDefault(); openEdit(ed.getAttribute('data-edit')); return; } var dl=e.target.closest('[data-del]'); if(dl){ e.preventDefault(); var _t=curById(dl.getAttribute('data-del')); if(_t && await rrgConfirm('Delete "'+(_t.name||'this template')+'"?')){ api('DELETE','/api/email-templates/'+encodeURIComponent(_t.id)).then(function(j){ if(j&&j.ok){ if(EDIT&&EDIT.id===_t.id) EDIT=null; load(); } else alert((j&&j.error)||'Delete failed.'); }); } return; } });
load();
</script>
</body>
</html>
