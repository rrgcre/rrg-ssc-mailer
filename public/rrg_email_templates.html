<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullServe — Email Templates</title>
<style>.rl-filtbtn{display:none!important;}</style>
<script src="/rrg_list.js"></script>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--ink:#1a2236;--muted:#6b7488;--soft:#8a93a8;--line:#e6e9f0;--wash:#f5f7fb;--green:#1f8a5b;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#eef1f6;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);}
.wrap{max-width:1120px;margin:0 auto;padding:24px 28px 60px;}
.pgh{font-size:26px;font-weight:800;color:var(--navy);margin:6px 0 2px;}
.pgs{color:var(--muted);font-size:13.5px;margin-bottom:20px;max-width:780px;line-height:1.5;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(10,20,50,.06);overflow:hidden;margin-bottom:20px;}
.hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;}
.hd b{color:var(--navy);font-size:15px;} .hd .sp{margin-left:auto;}
.cb{padding:6px 8px 10px;}
.lk{color:var(--navy);text-decoration:none;font-weight:600;} .lk:hover{text-decoration:underline;}
.meta{color:var(--muted);font-size:12px;}
.acts{display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end;white-space:nowrap;}
.badge{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;border-radius:5px;padding:2px 8px;}
.badge.sh{color:#1f6f4e;background:#e7f5ee;border:1px solid #bce3cd;}
.badge.pe{color:#23496f;background:#eef2fb;border:1px solid #d6e0f5;}
.btn{font:inherit;font-size:12.5px;font-weight:700;padding:8px 13px;border:1px solid #cdd6e6;border-radius:9px;background:#fff;color:var(--navy);cursor:pointer;white-space:nowrap;}
.btn:hover{background:#f4f7fb;}
.btn.sm{padding:6px 11px;font-size:12px;}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy);} .btn.pri:hover{background:#0a1a44;}
.btn.red{background:var(--red);color:#fff;border-color:var(--red);}
.btn.ghost{background:#fff;} .btn.danger{color:var(--red);border-color:#f0c9c6;} .btn.danger:hover{background:#fdeceb;}
.btn:disabled{opacity:.5;cursor:default;}
.ch{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;} .ch b{color:var(--navy);font-size:16px;} .ch .sp{margin-left:auto;display:flex;gap:8px;align-items:center;}
.body{padding:20px;}
.fld{margin-bottom:14px;}
.fld label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:700;margin-bottom:6px;}
.fld input[type=text],.fld textarea{font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;width:100%;color:var(--ink);background:#fff;}
.fld textarea{min-height:230px;resize:vertical;line-height:1.55;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
.seg label{font-size:12.5px;font-weight:700;padding:8px 14px;cursor:pointer;color:var(--muted);background:#fff;}
.seg label.on{background:var(--navy);color:#fff;}
.seg input{display:none;}
.tokens{font-size:11.5px;color:var(--soft);margin-top:6px;}
.tokens code{background:#f2f4f8;border-radius:4px;padding:1px 5px;font-size:11px;color:#5b6472;}
.fldpalette{margin-top:8px;} .palgrp{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:6px;} .palgl{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);font-weight:800;margin-right:3px;min-width:82px;} .tokchip{background:#eef3fb;border:1px solid #d3e2f6;color:#2c5c8f;border-radius:100px;padding:3px 10px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;} .tokchip:hover{background:#e2eefb;}
.msg{font-size:12.5px;font-weight:700;} .msg.ok{color:var(--green);} .msg.err{color:var(--red);}
.empty{padding:34px 20px;text-align:center;color:var(--soft);font-size:13.5px;}
.ro{color:var(--muted);font-size:12.5px;background:#f7f9fc;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:12px;}
</style>
<script src="/rrg_brand.js"></script>
<script src="/rrg_rte.js"></script>
<style>
.catbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 8px 2px;}
.catbar .cf{font:inherit;font-size:12px;font-weight:700;padding:5px 12px;border:1px solid var(--line);border-radius:100px;background:#fff;color:var(--muted);cursor:pointer;}
.catbar .cf.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.badge.cat{color:#4a4370;background:#efedf9;border:1px solid #dcd7f0;}
.badge.arch{color:#8a5a1f;background:#fbf1e2;border:1px solid #ecd9b8;}
.selrow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
.selrow .fld{flex:0 0 auto;margin-bottom:0;}
.selrow select{font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:#fff;}
.pvw{border:1px solid var(--line);border-radius:11px;background:var(--wash);padding:14px 16px;margin-top:10px;}
.pvw .pvs{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:800;margin-bottom:4px;}
.pvw .pvsub{font-weight:700;color:var(--navy);margin-bottom:10px;font-size:14.5px;}
.pvw .pvbody{font-size:14px;line-height:1.55;color:var(--ink);}
.pvw .pvbody p{margin:0 0 10px;}
.tokmiss{background:#fdecec;color:#c0392b;border-radius:4px;padding:0 3px;font-weight:700;}
.chkline{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);cursor:pointer;}
.chkline input{width:16px;height:16px;}
.tr-arch{opacity:.55;}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="pgh">Email Templates</h1>
  <div class="pgs">Write your go-to emails once and reuse them — in the send composer on a contact and in automation steps. Mark a template <b>Personal</b> (only you) or <b>Shared</b> (the whole team). Personalize with tokens like <code>{{first_name}}</code>.</div>
  <div id="root"></div>
</div>
<script>
var TPLS=[], CTL=null, BUILT=false, EDIT=null, SCOPE='personal', CAT='General', ACTIVE=true, DEL_ARM=false, IS_ADMIN=false, CATFILTER='All', AUTOS=[], EXECAUTO='', GREET='none';
var CATS=['Buyer','Seller','NDA','Follow-up','Closing','General'];
var SAMPLE={'{{first_name}}':'Maria','{{last_name}}':'Lopez','{{name}}':'Maria Lopez','{{company}}':'Blue Agave Cantina','{{title}}':'Owner','{{email}}':'maria@blueagave.com','{{phone}}':'(713) 555-0142','{{my_name}}':'Van','{{my_title}}':'Broker','{{my_phone}}':'(713) 555-0100','{{my_email}}':'van@rrgcre.com','{{listing_name}}':'Blue Agave Cantina','{{listing_number}}':'RRG-1042','{{code_name}}':'Project Cedar','{{asking_price}}':'$785,000','{{data_room_link}}':'app.rrgcre.com/room/9f2c\u2026','{{booking_link}}':'app.rrgcre.com/book/van\u2026','{{today}}':'August 17, 2026'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(iso){ if(!iso) return ''; var x=String(iso).slice(0,10).split('-'); if(x.length!==3) return String(iso).slice(0,10); return x[1]+'/'+x[2]+'/'+x[0]; }
function api(m,u,b){return fetch(u,{method:m,credentials:'same-origin',headers:b?{'Content-Type':'application/json'}:undefined,body:b?JSON.stringify(b):undefined}).then(function(r){return r.json();});}
function mergePreview(str){ return String(str==null?'':str).replace(/\{\{\s*[\w.]+\s*\}\}/g,function(m){ var key=m.replace(/\s+/g,''); if(SAMPLE[key]!=null) return esc(SAMPLE[key]); return '<span class="tokmiss">'+esc(m)+'</span>'; }); }
var LIST_SHELL='<div class="card"><div class="hd"><b>Email Templates</b><span class="meta" id="tcount"></span><span class="sp"></span><button class="btn sm pri" id="t_new">+ New template</button></div><div class="catbar" id="catbar"></div><div class="cb"><div id="tlist"><div class="empty">Loading…</div></div></div></div><div id="editor"></div>';
function scopeBadge(t){ var b=t.scope==='shared'?'<span class="badge sh">Shared</span>':'<span class="badge pe">Personal</span>'; if(t.active===false) b+=' <span class="badge arch">Archived</span>'; return b; }
function catBadge(t){ return '<span class="badge cat">'+esc(t.category||'General')+'</span>'; }
function usedCell(t){ if(!t.useCount) return '<span class="meta">—</span>'; return '<span class="meta" style="color:var(--ink)">'+t.useCount+'×</span>'+(t.lastUsedAt?'<span class="meta"> · '+esc(fmt(t.lastUsedAt))+'</span>':''); }
function actionsCell(t){ var s='<button class="btn ghost sm" data-edit="'+esc(t.id)+'">'+(t.mine?'Edit':'View')+'</button>'; s+='<button class="btn ghost sm" data-dup="'+esc(t.id)+'">Duplicate</button>'; if(t.mine){ s+='<button class="btn ghost sm" data-arch="'+esc(t.id)+'">'+(t.active===false?'Restore':'Archive')+'</button>'; s+='<button class="btn danger sm" data-del="'+esc(t.id)+'">Delete</button>'; } return '<div class="acts">'+s+'</div>'; }
function tplCat(t){ return (t&&CATS.indexOf(t.category)>=0)?t.category:'General'; }
function filteredTpls(){ return TPLS.filter(function(t){ if(CATFILTER==='All') return true; if(CATFILTER==='Archived') return t.active===false; return (tplCat(t)===CATFILTER)&&(t.active!==false); }); }
function listCfg(){ return { mount:'#tlist', data:filteredTpls(), key:'emailtpls',
  empty:'<div class="empty">No templates here. Click <b>+ New template</b> to write one.</div>',
  rowId:function(t){return t.id;}, rowClass:function(t){return t.active===false?'tr-arch':'';}, defaultSort:0, defaultDir:1,
  columns:[
    { label:'Template', sort:function(a,b){return RRGList.cmp(a.name,b.name);}, cell:function(t){ return '<a class="lk" href="#" data-edit="'+esc(t.id)+'">'+esc(t.name||'Untitled')+'</a>'; } },
    { label:'Category', sort:function(a,b){return RRGList.cmp(a.category,b.category);}, cell:catBadge },
    { label:'Visibility', sort:function(a,b){return RRGList.cmp(a.scope,b.scope);}, cell:scopeBadge },
    { label:'Subject', sort:function(a,b){return RRGList.cmp(a.subject,b.subject);}, cell:function(t){ return t.subject?('<span class="meta" style="color:var(--ink)">'+esc(t.subject)+'</span>'):'<span class="meta">—</span>'; } },
    { label:'Owner', sort:function(a,b){return RRGList.cmp(a.ownerName,b.ownerName);}, cell:function(t){ return t.ownerName?esc(t.ownerName):(t.mine?'You':'<span class="meta">—</span>'); } },
    { label:'Used', sort:function(a,b){return (a.useCount||0)-(b.useCount||0);}, cell:usedCell },
    { label:'Updated', sort:function(a,b){return RRGList.cmp(a.updatedAt,b.updatedAt);}, cell:function(t){ return '<span class="meta">'+esc(fmt(t.updatedAt))+'</span>'; } },
    { label:'', sortable:false, cell:actionsCell }
  ] }; }
function renderCatBar(){ var el=document.getElementById('catbar'); if(!el) return; var opts=['All'].concat(CATS).concat(['Archived']); el.innerHTML=opts.map(function(c){ var n=(c==='All')?TPLS.length:((c==='Archived')?TPLS.filter(function(t){return t.active===false;}).length:TPLS.filter(function(t){return tplCat(t)===c&&t.active!==false;}).length); return '<button class="cf'+(CATFILTER===c?' on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+' <span style="opacity:.55;font-weight:800">'+n+'</span></button>'; }).join(''); Array.prototype.forEach.call(el.querySelectorAll('.cf'),function(b){ b.onclick=function(){ CATFILTER=b.getAttribute('data-cat'); renderCatBar(); refreshList(); }; }); }
function refreshList(){ var d=filteredTpls(); if(CTL) CTL.refresh(d); else CTL=RRGList.create(listCfg()); var c=document.getElementById('tcount'); if(c) c.textContent=TPLS.length+' total'; }
function curById(id){ return TPLS.filter(function(t){return t.id===id;})[0]||null; }
function scopeControl(ro){
  if(IS_ADMIN){ return '<div class="fld"><label>Visibility</label><div class="seg" id="scopeSeg"><label id="sc_p"'+((SCOPE==='personal')?' class="on"':'')+'><input type="radio" name="sc" value="personal"'+((SCOPE==='personal')?' checked':'')+(ro?' disabled':'')+'>Personal</label><label id="sc_s"'+((SCOPE==='shared')?' class="on"':'')+'><input type="radio" name="sc" value="shared"'+((SCOPE==='shared')?' checked':'')+(ro?' disabled':'')+'>Shared (firm)</label></div><div class="tokens">Personal = only you. Shared = the whole firm can use it. Only admins publish shared templates.</div></div>'; }
  return '<div class="fld"><label>Visibility</label><div class="ro" style="margin:0">Personal — only you. Shared (firm) templates are published by an admin; ask an admin to promote this one firm-wide.</div></div>';
}
function catControl(ro){ return '<div class="fld"><label>Category</label><select id="tCat"'+(ro?' disabled':'')+'>'+CATS.map(function(c){return '<option'+((CAT===c)?' selected':'')+'>'+esc(c)+'</option>';}).join('')+'</select></div>'; }
function greetControl(ro){ var opts=[['none','No salutation'],['dear','Dear {first name},'],['hi','Hi {first name},'],['first','{first name},']]; return '<div class="fld" style="margin-top:14px"><label>Salutation <span style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--soft)">(added to the top of the email, with the contact’s first name)</span></label><select id="tGreet"'+(ro?' disabled':'')+'>'+opts.map(function(o){return '<option value="'+o[0]+'"'+((GREET===o[0])?' selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select></div>'; }
function autoControl(ro){ var lbl='<label>After this template is sent, run automation <span style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--soft)">(when sent from a contact\u2019s Send Email)</span></label>'; if(!AUTOS.length){ return '<div class="fld" style="margin-top:14px">'+lbl+'<select id="tAuto" disabled><option value="">\u2014 no active automations yet \u2014</option></select><div style="font-size:12px;color:var(--soft);margin-top:6px;line-height:1.5">Build one under <b>Automations</b> (Marketing), make sure it\u2019s active, then it\u2019ll appear here to fire automatically each time you send this template.</div></div>'; } return '<div class="fld" style="margin-top:14px">'+lbl+'<select id="tAuto"'+(ro?' disabled':'')+'><option value="">\u2014 none \u2014</option>'+AUTOS.map(function(a){return '<option value="'+esc(a.id)+'"'+((EXECAUTO===a.id)?' selected':'')+'>'+esc(a.name)+'</option>';}).join('')+'</select></div>'; }
function renderEditor(){
  var host=document.getElementById('editor'); if(!host) return;
  if(!EDIT){ host.innerHTML=''; return; }
  var t=EDIT; var ro=!t.mine;
  SCOPE=(t.scope==='shared'?'shared':'personal'); CAT=(CATS.indexOf(t.category)>=0?t.category:'General'); ACTIVE=(t.active!==false); EXECAUTO=(t.execAuto||''); GREET=(t.greeting||'none');
  host.innerHTML='<div class="card"><div class="ch"><b>'+(ro?'View template':(t.id?'Edit template':'New template'))+'</b><span class="sp"><span class="msg" id="msg"></span><button class="btn ghost sm" id="pvBtn">Preview</button>'+((t.id&&t.mine)?'<button class="btn danger sm" id="delBtn">Delete</button>':'')+'<button class="btn ghost sm" id="closeBtn">Close</button>'+(ro?'':'<button class="btn red" id="saveBtn">Save</button>')+'</span></div><div class="body">'
    +(ro?'<div class="ro">Shared template'+(t.ownerName?(' by <b>'+esc(t.ownerName)+'</b>'):'')+' — view only. Use <b>Duplicate</b> to make your own editable copy.</div>':'')
    +'<div class="fld"><label>Template name</label><input type="text" id="tName" value="'+esc(t.name||'')+'"'+(ro?' readonly':'')+' placeholder="e.g. New buyer intro"></div>'
    +'<div class="selrow">'+catControl(ro)+scopeControl(ro)+'</div>'
    +((t.id&&t.mine)?'<div class="fld" style="margin-top:14px"><label class="chkline"><input type="checkbox" id="tActive"'+(ACTIVE?' checked':'')+'> Active — show in the send composer and automations (uncheck to archive)</label></div>':'')
    +'<div class="fld" style="margin-top:14px"><label>Subject</label><input type="text" id="tSubject" value="'+esc(t.subject||'')+'"'+(ro?' readonly':'')+' placeholder="e.g. Great connecting, {{first_name}}"></div>'
    +greetControl(ro)+'<div class="fld"><label>Body</label>'+(ro?('<div class="rrgrt" style="border:1px solid #cfd6e2;border-radius:9px"><div class="rrgrt-ed" style="padding:10px 12px;min-height:120px">'+RRGRte.toHtml(t.body||'')+'</div></div>'):RRGRte.html('tBody',{value:t.body||'',placeholder:'Write your email… use the { } menu for merge fields.'}))+'</div>'
    +autoControl(ro)+'<div id="pvPanel"></div>'
    +'</div></div>';
  document.getElementById('closeBtn').onclick=function(){ EDIT=null; renderEditor(); };
  document.getElementById('pvBtn').onclick=doPreview;
  if(!ro){
    if(window.RRGRte) RRGRte.wire('tBody',{});
    var seg=document.getElementById('scopeSeg');
    if(seg){ Array.prototype.forEach.call(seg.querySelectorAll('input'),function(r){ r.onchange=function(){ SCOPE=r.value; document.getElementById('sc_p').classList.toggle('on',SCOPE==='personal'); document.getElementById('sc_s').classList.toggle('on',SCOPE==='shared'); }; }); }
    var cs=document.getElementById('tCat'); if(cs) cs.onchange=function(){ CAT=cs.value; };
    var ac=document.getElementById('tActive'); if(ac) ac.onchange=function(){ ACTIVE=ac.checked; };
    document.getElementById('saveBtn').onclick=save;
    var db=document.getElementById('delBtn'); if(db) db.onclick=onDelete;
  }
}
function doPreview(){
  var panel=document.getElementById('pvPanel'); if(!panel) return;
  if(panel.innerHTML){ panel.innerHTML=''; var pb=document.getElementById('pvBtn'); if(pb) pb.textContent='Preview'; return; }
  var subj = EDIT.mine ? ((document.getElementById('tSubject')||{}).value||'') : (EDIT.subject||'');
  var body = EDIT.mine ? (window.RRGRte?RRGRte.get('tBody'):((document.getElementById('tBody')||{}).value||'')) : (EDIT.body||'');
  var bodyHtml = window.RRGRte ? RRGRte.toHtml(body) : esc(body).replace(/\n/g,'<br>');
  panel.innerHTML='<div class="pvw"><div class="pvs">Preview — sample data ('+esc(SAMPLE['{{name}}'])+')</div><div class="pvsub">'+mergePreview(subj)+'</div><div class="pvbody">'+mergePreview(bodyHtml)+'</div><div class="tokens" style="margin-top:10px">Anything <span class="tokmiss">highlighted</span> is a merge field that won’t fill from this contact — check the spelling.</div></div>';
  var pb2=document.getElementById('pvBtn'); if(pb2) pb2.textContent='Hide preview';
}
function render(){
  var root=document.getElementById('root');
  if(!BUILT){ root.innerHTML=LIST_SHELL; BUILT=true; document.getElementById('t_new').onclick=newTpl; }
  renderCatBar(); refreshList(); renderEditor();
}
function openEdit(id){ var t=curById(id); if(!t) return; EDIT=JSON.parse(JSON.stringify(t)); renderEditor(); var ed=document.getElementById('editor'); if(ed) ed.scrollIntoView({behavior:'smooth',block:'start'}); }
function newTpl(){ EDIT={id:'',name:'',subject:'',body:'',scope:'personal',category:'General',active:true,mine:true}; SCOPE='personal'; CAT='General'; ACTIVE=true; renderEditor(); var ed=document.getElementById('editor'); if(ed) ed.scrollIntoView({behavior:'smooth',block:'start'}); }
function msg(t,cls){ var m=document.getElementById('msg'); if(!m) return; m.textContent=t; m.className='msg '+(cls||''); if(t){ setTimeout(function(){ if(m.textContent===t){m.textContent='';m.className='msg';} },3500); } }
function load(){ api('GET','/api/email-templates?all=1').then(function(j){ TPLS=j.templates||[]; AUTOS=j.automations||[]; IS_ADMIN=TPLS.some(function(t){return t.canShare;}); render(); }); }
function save(){
  var name=(document.getElementById('tName').value||'').trim(); if(!name){ msg('Name the template.','err'); return; }
  var body={ name:name, scope:SCOPE, category:CAT, active:ACTIVE, execAuto:(function(){var a=document.getElementById('tAuto');return a?a.value:'';})(), greeting:(function(){var g=document.getElementById('tGreet');return g?g.value:'none';})(), subject:document.getElementById('tSubject').value, body:(window.RRGRte?RRGRte.get('tBody'):((document.getElementById('tBody')||{}).value||'')) };
  if(EDIT&&EDIT.id) body.id=EDIT.id;
  var btn=document.getElementById('saveBtn'); btn.disabled=true;
  api('POST','/api/email-templates',body).then(function(j){ btn.disabled=false; if(!j.ok){ msg(j.error||'Save failed.','err'); return; } EDIT=j.template||EDIT; load(); msg('Saved','ok'); });
}
function duplicate(id){ var t=curById(id); if(!t) return; api('POST','/api/email-templates',{ name:('Copy of '+(t.name||'template')).slice(0,120), scope:'personal', category:(t.category||'General'), active:true, subject:t.subject||'', body:t.body||'' }).then(function(j){ if(!j.ok){ alert(j.error||'Could not duplicate.'); return; } load(); if(j.template){ EDIT=JSON.parse(JSON.stringify(j.template)); setTimeout(function(){ renderEditor(); var ed=document.getElementById('editor'); if(ed) ed.scrollIntoView({behavior:'smooth',block:'start'}); },60); } }); }
function toggleArchive(id){ var t=curById(id); if(!t) return; api('POST','/api/email-templates',{ id:t.id, name:t.name, active:(t.active===false) }).then(function(j){ if(!j.ok){ alert(j.error||'Could not update.'); return; } load(); }); }
function onDelete(){
  if(!EDIT||!EDIT.id) return;
  if(!DEL_ARM){ DEL_ARM=true; var b=document.getElementById('delBtn'); b.textContent='Really delete?'; b.classList.add('red'); setTimeout(function(){ if(DEL_ARM){ DEL_ARM=false; var x=document.getElementById('delBtn'); if(x){x.textContent='Delete';x.classList.remove('red');} } },3500); return; }
  DEL_ARM=false;
  api('DELETE','/api/email-templates/'+encodeURIComponent(EDIT.id)).then(function(j){ if(!j.ok){ msg(j.error||'Delete failed.','err'); return; } EDIT=null; load(); });
}
document.addEventListener('click',async function(e){ if(!e.target.closest) return;
  var ed=e.target.closest('[data-edit]'); if(ed){ e.preventDefault(); openEdit(ed.getAttribute('data-edit')); return; }
  var dp=e.target.closest('[data-dup]'); if(dp){ e.preventDefault(); duplicate(dp.getAttribute('data-dup')); return; }
  var ar=e.target.closest('[data-arch]'); if(ar){ e.preventDefault(); toggleArchive(ar.getAttribute('data-arch')); return; }
