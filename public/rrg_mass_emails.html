<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullServe — Mass Emails</title>
<script src="/rrg_list.js"></script>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--ink:#1a2236;--muted:#6b7488;--soft:#8a93a8;--line:#e6e9f0;--wash:#f5f7fb;--green:#1f8a5b;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#eef1f6;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);}
.wrap{max-width:1120px;margin:0 auto;padding:24px 28px 70px;}
.pgh{font-size:26px;font-weight:700;color:var(--navy);margin:6px 0 2px;}
.pgs{color:var(--muted);font-size:13.5px;margin-bottom:20px;max-width:820px;line-height:1.5;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(10,20,50,.06);overflow:hidden;margin-bottom:18px;}
.ch{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;} .ch b{color:var(--navy);font-size:15.5px;} .ch .sp{margin-left:auto;display:flex;gap:8px;align-items:center;}
.stepno{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
.body{padding:18px 20px;}
.fld{margin-bottom:14px;}
.fld label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:700;margin-bottom:7px;}
.fld input[type=text],.fld input[type=number],.fld select{font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:#fff;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{font:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;border:1px solid var(--line);border-radius:100px;background:#fff;color:var(--muted);cursor:pointer;}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.chip.met.on{background:#0f5c3a;border-color:#0f5c3a;}
.subhd{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:700;margin:2px 0 8px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:720px){.grid2{grid-template-columns:1fr;}}
.count{display:flex;align-items:baseline;gap:10px;background:var(--wash);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-top:6px;}
.count .n{font-size:30px;font-weight:700;color:var(--navy);line-height:1;}
.count .l{font-size:13px;color:var(--muted);}
.samp{margin-top:10px;font-size:12.5px;color:var(--muted);line-height:1.7;}
.samp b{color:var(--ink);font-weight:600;}
.btn{font:inherit;font-size:13px;font-weight:700;padding:9px 15px;border:1px solid #cdd6e6;border-radius:9px;background:#fff;color:var(--navy);cursor:pointer;white-space:nowrap;}
.btn:hover{background:#f4f7fb;} .btn.sm{padding:7px 12px;font-size:12.5px;}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy);} .btn.pri:hover{background:#0a1a44;}
.btn.red{background:var(--red);color:#fff;border-color:var(--red);} .btn.red:hover{background:#b71f16;}
.btn.ghost{background:#fff;} .btn:disabled{opacity:.5;cursor:default;}
.msg{font-size:12.5px;font-weight:700;} .msg.ok{color:var(--green);} .msg.err{color:var(--red);}
.pvw{border:1px solid var(--line);border-radius:11px;background:var(--wash);padding:14px 16px;margin-top:10px;}
.pvw .pvs{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:700;margin-bottom:4px;}
.pvw .pvsub{font-weight:700;color:var(--navy);margin-bottom:10px;font-size:14.5px;}
.pvw .pvbody{font-size:14px;line-height:1.55;color:var(--ink);} .pvw .pvbody p{margin:0 0 10px;}
.tokmiss{background:#fdecec;color:#c0392b;border-radius:4px;padding:0 3px;font-weight:700;}
.hint{font-size:12px;color:var(--soft);margin-top:4px;}
.sendbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.empty{padding:26px 20px;text-align:center;color:var(--soft);font-size:13.5px;}
.stpill{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:6px;padding:2px 8px;}
.stpill.sent{color:#1f6f4e;background:#e7f5ee;border:1px solid #bce3cd;}
.stpill.sending{color:#8a5a12;background:#fff4e6;border:1px solid #f3d9a8;}
.stpill.draft{color:#23496f;background:#eef2fb;border:1px solid #d6e0f5;}
</style>
<script src="/rrg_brand.js"></script>
<script src="/rrg_rte.js"></script>
</head>
<body>
<div class="wrap">
  <h1 class="pgh">Mass Emails</h1>
  <div class="pgs">Send one on-brand, personalized email to a segment of your subscriber list — a new-listing blast, a market update, a re-engagement note. Every message is merged one-to-one, tracked for opens, honors each contact's email preferences, and carries an unsubscribe link automatically.</div>
  <div id="root"></div>
</div>
<script>
var META={types:[],tags:[],leadSources:[],metros:[],reachable:0,optOut:0,noEmail:0,totalContacts:0};
var TEMPLATES=[], CAMPAIGNS=[], POLL=null;
var SEL={tags:[],metros:[]}, NOTDAYS=0;
var SAMPLE={'{{first_name}}':'Maria','{{last_name}}':'Lopez','{{name}}':'Maria Lopez','{{company}}':'Blue Agave Cantina','{{title}}':'Owner','{{email}}':'maria@blueagave.com','{{phone}}':'(713) 555-0142','{{my_name}}':'Van','{{my_title}}':'Broker','{{my_phone}}':'(713) 555-0100','{{my_email}}':'van@rrgcre.com','{{listing_name}}':'Blue Agave Cantina','{{listing_number}}':'RRG-1042','{{code_name}}':'Project Cedar','{{asking_price}}':'$785,000','{{data_room_link}}':'app.rrgcre.com/room/9f2c…','{{booking_link}}':'app.rrgcre.com/book/van…','{{today}}':'August 17, 2026'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(iso){ if(!iso) return ''; var x=String(iso).slice(0,10).split('-'); if(x.length!==3) return String(iso).slice(0,10); return x[1]+'/'+x[2]+'/'+x[0]; }
function api(m,u,b){return fetch(u,{method:m,credentials:'same-origin',headers:b?{'Content-Type':'application/json'}:undefined,body:b?JSON.stringify(b):undefined}).then(function(r){return r.json();});}
function mergePreview(str){ return String(str==null?'':str).replace(/\{\{\s*[\w.]+\s*\}\}/g,function(m){ var key=m.replace(/\s+/g,''); if(SAMPLE[key]!=null) return esc(SAMPLE[key]); return '<span class="tokmiss">'+esc(m)+'</span>'; }); }
function audience(){ return { tags:SEL.tags.slice(), notContactedDays:NOTDAYS }; }

function chipRow(kind, items){ if(!items.length) return '<div class="hint">None on file yet.</div>'; return '<div class="chips">'+items.map(function(v){ var on=SEL[kind].indexOf(v)>=0; return '<button type="button" class="chip'+(kind==='metros'?' met':'')+(on?' on':'')+'" data-kind="'+kind+'" data-val="'+esc(v)+'">'+esc(v)+'</button>'; }).join('')+'</div>'; }

function shell(){
  return ''
  +'<div class="card"><div class="ch"><span class="stepno">1</span><b>Audience</b><span class="sp"><span class="hint" id="reach"></span></span></div><div class="body">'
    +'<div class="grid2">'
      +'<div><div class="subhd">Subscriber tags</div><div id="g_tags"></div></div>'
      +'<div><div class="fld" style="margin:0"><label>Only those not emailed in the last…</label><select id="notdays"><option value="0">No limit — all subscribers</option><option value="30">30 days</option><option value="60">60 days</option><option value="90">90 days</option><option value="180">180 days</option></select></div></div>'
    +'</div>'
    +'<div style="margin-top:16px"><div class="subhd">This campaign is about these markets <span style="text-transform:none;letter-spacing:0;font-weight:600;color:var(--soft)">(optional — powers each contact’s market preferences)</span></div><div id="g_metros"></div><div class="hint">Contacts who chose “only specific markets” get this only if it overlaps their picks. Leave blank for a general blast (those contacts are skipped).</div></div>'
    +'<div class="count"><div class="n" id="aud_n">—</div><div class="l">subscribers will receive this</div><span class="sp" style="margin-left:auto"></span><button class="btn sm" id="aud_refresh">Refresh</button></div>'
    +'<div class="samp" id="aud_samp"></div>'
  +'</div></div>'

  +'<div class="card"><div class="ch"><span class="stepno">2</span><b>Compose</b><span class="sp"><span class="msg" id="cmsg"></span><button class="btn ghost sm" id="pvBtn">Preview</button></span></div><div class="body">'
    +'<div class="grid2">'
      +'<div class="fld"><label>Campaign name (internal)</label><input type="text" id="c_name" placeholder="e.g. March buyer blast" style="width:100%"></div>'
      +'<div class="fld"><label>Start from a template</label><select id="c_tpl" style="width:100%"><option value="">— optional —</option></select></div>'
    +'</div>'
    +'<div class="fld"><label>Subject</label><input type="text" id="c_subj" placeholder="e.g. New restaurant listing in {{company}}’s market" style="width:100%"></div>'
    +'<div class="fld"><label>Message</label><div id="c_bodywrap"></div></div>'
    +'<div id="pvPanel"></div>'
  +'</div></div>'

  +'<div class="card"><div class="ch"><span class="stepno">3</span><b>Send</b></div><div class="body">'
    +'<div class="sendbar">'
      +'<button class="btn ghost" id="s_test">Send test to me</button>'
      +'<button class="btn" id="s_draft">Save draft</button>'
      +'<span class="sp" style="margin-left:auto"></span>'
      +'<button class="btn red" id="s_send">Send campaign</button>'
    +'</div>'
    +'<div class="hint" id="s_msg" style="margin-top:10px"></div>'
  +'</div></div>'

  +'<div class="card"><div class="ch"><b>Campaigns</b><span class="meta" id="camp_count" style="color:var(--muted);font-size:12.5px"></span></div><div class="body" style="padding:6px 8px 10px"><div id="camps"><div class="empty">No campaigns yet.</div></div></div></div>';
}

function drawGroups(){
  document.getElementById('g_tags').innerHTML=chipRow('tags',META.tags);
  document.getElementById('g_metros').innerHTML=chipRow('metros',META.metros);
  var reach=document.getElementById('reach'); if(reach) reach.textContent=(META.reachable||0)+' subscribed of '+(META.totalContacts||0)+' subscribers'+(META.unsubscribed?(' · '+META.unsubscribed+' unsubscribed'):'');
}
function onChip(btn){ var kind=btn.getAttribute('data-kind'), val=btn.getAttribute('data-val'); var i=SEL[kind].indexOf(val); if(i>=0) SEL[kind].splice(i,1); else SEL[kind].push(val); btn.classList.toggle('on'); refreshCount(); }
function refreshCount(){ var n=document.getElementById('aud_n'); if(n) n.textContent='…'; api('POST','/api/mass/audience',{audience:audience(),metros:SEL.metros}).then(function(j){ if(!j||!j.ok) return; if(n) n.textContent=j.count; var s=document.getElementById('aud_samp'); if(s){ if(j.count){ s.innerHTML='<b>Sample:</b> '+j.sample.slice(0,8).map(function(p){return esc(p.name||p.email)+(p.company?(' ('+esc(p.company)+')'):'');}).join(' · ')+(j.count>8?(' …and '+(j.count-8)+' more'):''); } else { s.innerHTML='<span style="color:var(--red)">No contacts match — loosen the filters.</span>'; } } }); }

function applyTpl(id){ var t=(TEMPLATES||[]).filter(function(x){return x.id===id;})[0]; if(!t) return; var su=document.getElementById('c_subj'); if(su) su.value=t.subject||''; if(window.RRGRte) RRGRte.set('c_body', t.body||''); }
function doPreview(){ var panel=document.getElementById('pvPanel'); if(!panel) return; if(panel.innerHTML){ panel.innerHTML=''; document.getElementById('pvBtn').textContent='Preview'; return; } var subj=(document.getElementById('c_subj')||{}).value||''; var body=window.RRGRte?RRGRte.get('c_body'):''; var html=window.RRGRte?RRGRte.toHtml(body):esc(body); panel.innerHTML='<div class="pvw"><div class="pvs">Preview — sample contact (Maria Lopez)</div><div class="pvsub">'+mergePreview(subj)+'</div><div class="pvbody">'+mergePreview(html)+'</div><div class="hint" style="margin-top:10px">Your signature and an unsubscribe link are added automatically on send. <span class="tokmiss">Highlighted</span> fields won’t fill — check the spelling.</div></div>'; document.getElementById('pvBtn').textContent='Hide preview'; }

function payload(){ return { name:(document.getElementById('c_name')||{}).value||'', subject:(document.getElementById('c_subj')||{}).value||'', body:window.RRGRte?RRGRte.get('c_body'):'', templateId:(document.getElementById('c_tpl')||{}).value||'', audience:audience(), metros:SEL.metros }; }
function setMsg(t,cls){ var m=document.getElementById('cmsg'); if(m){ m.textContent=t; m.className='msg '+(cls||''); if(t) setTimeout(function(){ if(m.textContent===t){m.textContent='';m.className='msg';} },3500);} }
function sMsg(t,cls){ var m=document.getElementById('s_msg'); if(m){ m.innerHTML=t; m.style.color=(cls==='err'?'var(--red)':(cls==='ok'?'var(--green)':'var(--soft)')); } }

function sendTest(){ var p=payload(); if(!p.subject && !p.body.trim()){ setMsg('Add a subject or message first.','err'); return; } var b=document.getElementById('s_test'); b.disabled=true; sMsg('Sending test…'); api('POST','/api/mass/send',{name:p.name,subject:p.subject,body:p.body,test:true}).then(function(j){ b.disabled=false; if(j&&j.ok){ sMsg('Test sent to '+esc(j.to)+' ✓','ok'); } else sMsg((j&&j.error)||'Test failed.','err'); }); }
function saveDraft(){ var p=payload(); if(!p.name.trim()){ setMsg('Name the campaign to save a draft.','err'); return; } var b=document.getElementById('s_draft'); b.disabled=true; api('POST','/api/mass/campaign',p).then(function(j){ b.disabled=false; if(j&&j.ok){ setMsg('Draft saved','ok'); loadCampaigns(); } else setMsg((j&&j.error)||'Save failed.','err'); }); }
async function sendCampaign(){ var p=payload(); if(!p.subject && !p.body.trim()){ setMsg('Add a subject and a message.','err'); return; } var n=(document.getElementById('aud_n')||{}).textContent||'0'; var cnt=parseInt(n,10)||0; if(!cnt){ sMsg('No subscribers match this segment.','err'); return; } if(!(await rrgConfirm('Send “'+(p.name||'this campaign')+'” to '+cnt+' subscriber'+(cnt===1?'':'s')+'? Each gets a personalized, tracked email with an unsubscribe link.'))) return; var b=document.getElementById('s_send'); b.disabled=true; sMsg('Starting send…'); api('POST','/api/mass/send',p).then(function(j){ b.disabled=false; if(j&&j.ok){ sMsg('Sending to '+j.recipientCount+' subscribers — watch progress below.','ok'); loadCampaigns(); startPoll(); } else sMsg((j&&j.error)||'Send failed.','err'); }); }

function campRow(c){ var st=c.status||'draft'; var stc=(st==='sent')?'sent':(st==='sending'?'sending':'draft'); var prog=(st==='sending')?(' · '+c.sentCount+'/'+c.recipientCount+' sent'):''; var stats=(st==='sent')?(' · '+c.delivered+' delivered · '+c.openRate+'% open · '+(c.clickRate||0)+'% click'):''; return '<div style="display:flex;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid var(--line)"><div style="flex:1;min-width:0"><div style="font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(c.name||'Untitled')+'</div><div style="font-size:12px;color:var(--muted);margin-top:2px">'+esc(c.subject||'')+'</div></div><span class="stpill '+stc+'">'+esc(st)+'</span><span style="font-size:12px;color:var(--muted);white-space:nowrap;min-width:170px;text-align:right">'+esc(c.recipientCount+' recipient'+(c.recipientCount===1?'':'s'))+prog+stats+'</span><span style="font-size:12px;color:var(--soft);white-space:nowrap">'+esc(c.sentAt?fmt(c.sentAt):fmt(c.createdAt))+'</span>'+((st!=='sending')?('<button class="btn ghost sm" data-cdel="'+esc(c.id)+'" title="Delete">✕</button>'):'')+'</div>'; }
function drawCampaigns(){ var el=document.getElementById('camps'); if(!el) return; if(!CAMPAIGNS.length){ el.innerHTML='<div class="empty">No campaigns yet.</div>'; } else { el.innerHTML=CAMPAIGNS.map(campRow).join(''); } var c=document.getElementById('camp_count'); if(c) c.textContent=CAMPAIGNS.length+' total'; }
function loadCampaigns(){ return api('GET','/api/mass/campaigns').then(function(j){ CAMPAIGNS=(j&&j.campaigns)||[]; drawCampaigns(); if(!CAMPAIGNS.some(function(c){return c.status==='sending';})) stopPoll(); }); }
function startPoll(){ if(POLL) return; POLL=setInterval(loadCampaigns,4000); }
function stopPoll(){ if(POLL){ clearInterval(POLL); POLL=null; } }

function boot(){
  var root=document.getElementById('root'); root.innerHTML=shell();
  document.getElementById('c_bodywrap').innerHTML=RRGRte.html('c_body',{placeholder:'Write your message… use the { } menu for merge fields like {{first_name}}.'});
  if(window.RRGRte) RRGRte.wire('c_body',{});
  var nd=document.getElementById('notdays'); if(nd) nd.onchange=function(){ NOTDAYS=parseInt(nd.value,10)||0; refreshCount(); };
  document.getElementById('aud_refresh').onclick=refreshCount;
  document.getElementById('pvBtn').onclick=doPreview;
  document.getElementById('s_test').onclick=sendTest;
  document.getElementById('s_draft').onclick=saveDraft;
  document.getElementById('s_send').onclick=sendCampaign;
  document.getElementById('c_tpl').onchange=function(){ if(this.value) applyTpl(this.value); };
  drawGroups(); refreshCount(); drawCampaigns();
}
document.addEventListener('click',async function(e){ if(!e.target.closest) return; var ch=e.target.closest('.chip[data-kind]'); if(ch){ onChip(ch); return; } var cd=e.target.closest('[data-cdel]'); if(cd){ var id=cd.getAttribute('data-cdel'); var c=CAMPAIGNS.filter(function(x){return x.id===id;})[0]; if(c && await rrgConfirm('Delete “'+(c.name||'this campaign')+'” from history?')){ api('DELETE','/api/mass/campaign/'+encodeURIComponent(id)).then(function(j){ if(j&&j.ok) loadCampaigns(); else alert((j&&j.error)||'Could not delete.'); }); } return; } });

Promise.all([
  api('GET','/api/mass/meta').then(function(j){ if(j&&j.ok) META=j; }),
  api('GET','/api/email-templates').then(function(j){ TEMPLATES=(j&&j.templates)||[]; }),
  api('GET','/api/mass/campaigns').then(function(j){ CAMPAIGNS=(j&&j.campaigns)||[]; })
]).then(function(){ boot(); var sel=document.getElementById('c_tpl'); if(sel) sel.innerHTML='<option value="">— optional —</option>'+TEMPLATES.map(function(t){return '<option value="'+esc(t.id)+'">'+esc(t.name)+(t.scope==='shared'?' (shared)':'')+'</option>';}).join(''); if(CAMPAIGNS.some(function(c){return c.status==='sending';})) startPoll(); });
</script>
</body>
</html>
