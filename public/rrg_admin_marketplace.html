<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRG — Marketplace Settings</title>
<style>
:root{--navy:#0b1636;--navy2:#16346e;--ink:#141a29;--dim:#5f6a7d;--soft:#8a93a3;--line:#e5e9f1;--green:#1f8a5b;--red:#C0261B;}
*{box-sizing:border-box}html,body{margin:0;background:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:22px 24px 64px}
h1{font-size:20px;font-weight:700;color:var(--navy);margin:0 0 4px}
.sub{font-size:13px;color:var(--dim);margin-bottom:16px;line-height:1.5;max-width:660px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid #cbd2dc;background:#fff;color:#26324a;border-radius:8px;padding:9px 15px;font:inherit;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer}
.tbtn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.tbtn:hover{border-color:var(--navy2)}
.card{border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
.ch{padding:12px 16px;border-bottom:1px solid var(--line);background:#f7f9fc}
.ch b{font-size:14px;color:var(--navy)} .ch span{font-size:12px;color:var(--dim);margin-left:6px}
.cb{padding:16px}
.fld{margin:10px 0} .fld>label{display:block;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--soft);margin-bottom:5px}
.fld>label .lc{font-weight:400;letter-spacing:0;text-transform:none;color:#8a93a8}
.fld input[type=text],.fld textarea{width:100%;border:1px solid #cfd6e2;border-radius:7px;padding:9px 11px;font:inherit;font-size:13.5px;color:var(--ink);background:#fff;resize:vertical;line-height:1.5}
.eclink{display:flex;gap:8px;align-items:stretch}
.eclink input,.eclink textarea{flex:1;min-width:0;border:1px solid #cfd6e2;border-radius:7px;padding:9px 11px;font:inherit;font-size:12.5px;color:var(--ink);background:#f8fafc;resize:vertical}
.eclink textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.5;white-space:pre}
.mtc{width:52px;height:34px;padding:0;border:1px solid #cbd2dc;border-radius:6px;cursor:pointer;background:#fff}
.mtl{font-size:11px;color:#5a6472;margin-top:5px;line-height:1.2}
.colors{display:flex;gap:22px;flex-wrap:wrap;margin:2px 0 4px}
.colors>div{text-align:center}
.btnrow{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:10px 18px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.btn.ghost{background:#eef1f6;color:#33415c;border:1px solid #dce2ec}
.msg{font-size:12.5px;font-weight:600}.msg.ok{color:var(--green)}.msg.err{color:var(--red)}
.note{font-size:12px;color:var(--soft);margin-top:12px;line-height:1.6}
.gate{color:var(--dim);font-size:13.5px;padding:30px 0}
.forow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:7px;background:#fff}
.forow.drag{opacity:.45}
.forow.over{border-color:var(--navy2);box-shadow:0 0 0 2px rgba(22,52,110,.12)}
.fograb{cursor:grab;color:#9aa4b6;font-size:15px;user-select:none;flex:none;line-height:1}
.fonum{font-weight:700;color:#8a93a8;font-size:12px;min-width:20px;flex:none}
.fomain{flex:1;min-width:0}
.fobiz{font-weight:700;font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fometa{font-size:11.5px;color:var(--soft)}
.fokind{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#5a6472;background:#eef2f8;border:1px solid #dbe3ef;border-radius:99px;padding:2px 8px;flex:none}
.foempty{color:var(--dim);font-size:13px;padding:8px 2px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="gate">Loading…</div></div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function api(m,b){ return fetch('/api/admin/types',{method:m,headers:b?{'Content-Type':'application/json'}:undefined,credentials:'same-origin',body:b?JSON.stringify(b):undefined}).then(function(r){return r.json();}); }
var PUB=(location.origin||'')+'/market';
var THEME_FIELDS=[['dark','mtDark','#12303a','Header / dark'],['strip','mtStrip','#33302a','Top strip'],['accent','mtAccent','#9a7746','Accent<br>(buttons, featured)'],['link','mtLink','#2b8391','Links / actions'],['mark','mtMark','#b23a2c','Logo mark'],['zebra','mtZebra','#f6f9fd','Row stripe']];
var THEME_DEF={dark:'#12303a',strip:'#33302a',accent:'#9a7746',link:'#2b8391',mark:'#b23a2c',zebra:'#f6f9fd'};
var HEADER_DEF={tagline:'',areas:'',heading:'',lede:''};
function btnSnippet(u){ return '<a href="'+u+'" style="display:inline-block;background:#12303a;color:#fff;font-weight:700;font-family:Arial,Helvetica,sans-serif;font-size:15px;padding:13px 24px;border-radius:8px;text-decoration:none;border-top:2px solid #9a7746">Browse Businesses for Sale &rarr;</a>'; }
function copyText(txt,btn,ok){ function flash(){ if(!btn) return; var o=btn.textContent; btn.textContent=ok||'Copied ✓'; setTimeout(function(){btn.textContent=o;},1500); }
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(flash).catch(function(){ window.prompt&&window.prompt('Copy:',txt); }); } else { window.prompt&&window.prompt('Copy:',txt); } }
function render(){
  var root=document.getElementById('root');
  root.innerHTML=''
    +'<h1>Marketplace</h1>'
    +'<div class="sub">Everything for your public marketplace at <b>/market</b> — how to put it on your website, its colors, and its header text. Manage which listings appear from the <b>Listings</b> page (flip <b>Public</b> on any listing).</div>'
    +'<div class="toolbar"><a class="tbtn pri" href="/market" target="_blank" rel="noopener">View public marketplace ↗</a><a class="tbtn" href="./rrg_board.html" target="_blank" rel="noopener">Manage listings ↗</a></div>'
    // Featured order
    +'<div class="card"><div class="ch"><b>Featured order</b><span>— drag to set the order your featured listings appear on /market.</span></div><div class="cb">'
      +'<div id="foList"><div class="foempty">Loading…</div></div>'
      +'<div class="btnrow"><button class="btn" id="foSave" disabled>Save order</button><span class="msg" id="foMsg"></span></div>'
      +'<div class="note">These are the listings you\'ve marked <b>Featured</b> (flip Featured on a listing\'s <b>Publish to Marketplace</b> panel to add one). Drag the handle to reorder — the order applies to both the Businesses and Real&nbsp;Estate featured bands. A newly featured listing lands at the end until you place it.</div>'
    +'</div></div>'
    // Add to your website
    +'<div class="card"><div class="ch"><b>Add to your website</b><span>— link to your marketplace from any page on your site.</span></div><div class="cb">'
      +'<div class="fld"><label>Your public link</label><div class="eclink"><input type="text" id="ecUrl" readonly value="'+esc(PUB)+'"><button class="tbtn" id="ecCopyUrl">Copy link</button></div></div>'
      +'<div class="fld"><label>Button code <span class="lc">— paste into a raw-HTML page for a styled button</span></label><div class="eclink"><textarea id="ecBtn" readonly rows="3">'+esc(btnSnippet(PUB))+'</textarea><button class="tbtn" id="ecCopyBtn">Copy code</button></div></div>'
      +'<div class="note">Most site builders (Squarespace, Wix, WordPress, GoDaddy) only need the <b>link</b> — add a normal button or menu item and paste it as the destination. The button code is just for pages you edit in HTML. Want it on your own address like <b>listings.yourdomain.com</b> instead? Ask us to set up a custom domain.</div>'
    +'</div></div>'
    // Colors
    +'<div class="card"><div class="ch"><b>Marketplace colors</b><span>— the theme buyers see at /market. This does not change the admin app.</span></div><div class="cb">'
      +'<div class="colors">'+THEME_FIELDS.map(function(f){ return '<div><input type="color" class="mtc" id="'+f[1]+'" value="'+f[2]+'"><div class="mtl">'+f[3]+'</div></div>'; }).join('')+'</div>'
      +'<div class="btnrow"><button class="btn" id="mtSave">Save colors</button><button class="btn ghost" id="mtReset">Reset to default</button><span class="msg" id="mtMsg"></span></div>'
      +'<div class="note">Each SaaS tenant can set their own marketplace palette. Changes go live on the public marketplace as soon as you save. Your logo comes from <b>Settings → Branding &amp; Appearance</b> — upload a light version so it reads on the dark header.</div>'
    +'</div></div>'
    // Header text
    +'<div class="card"><div class="ch"><b>Marketplace header</b><span>— the headline, intro, and the top-strip lines on your public marketplace.</span></div><div class="cb">'
      +'<div class="fld"><label>Top strip — tagline <span class="lc">(first line)</span></label><input type="text" id="mhTagline" maxlength="200" placeholder="Confidential brokerage — restaurants, bars &amp; hospitality real estate"></div>'
      +'<div class="fld"><label>Top strip — service areas <span class="lc">(second line)</span></label><input type="text" id="mhAreas" maxlength="200" placeholder="Texas · Austin · Dallas · Fort Worth · Houston · San Antonio"></div>'
      +'<div class="fld"><label>Headline <span class="lc">(the big title)</span></label><input type="text" id="mhHeading" maxlength="200" placeholder="The Restaurant Realty Group Marketplace"></div>'
      +'<div class="fld"><label>Intro paragraph <span class="lc">(under the headline)</span></label><textarea id="mhLede" maxlength="800" rows="3"></textarea></div>'
      +'<div class="btnrow"><button class="btn" id="mhSave">Save header</button><button class="btn ghost" id="mhReset">Reset to default</button><span class="msg" id="mhMsg"></span></div>'
      +'<div class="note">Plain text. Leave the headline blank to use “The {your brokerage} Marketplace” automatically.</div>'
    +'</div></div>';
  // wire add-to-website
  document.getElementById('ecCopyUrl').addEventListener('click',function(){ copyText(PUB,this,'Copied ✓'); });
  document.getElementById('ecCopyBtn').addEventListener('click',function(){ copyText(btnSnippet(PUB),this,'Copied ✓'); });
  // wire colors
  document.getElementById('mtSave').addEventListener('click',saveTheme);
  document.getElementById('mtReset').addEventListener('click',resetTheme);
  document.getElementById('mhSave').addEventListener('click',saveHeader);
  document.getElementById('mhReset').addEventListener('click',resetHeader);
  var _fs=document.getElementById('foSave'); if(_fs) _fs.addEventListener('click',saveFeaturedOrder);
  fetchFeatured();
}
var FEAT=[]; var _foDragIdx=-1;
function foKindLabel(k){ return k==='business'?'Business':(k==='asset'?'Asset':(k==='lease'?'Lease':(k==='sale'?'Real estate':'Listing'))); }
function renderFeatured(){
  var host=document.getElementById('foList'); if(!host) return;
  var sb=document.getElementById('foSave');
  if(!FEAT.length){ host.innerHTML='<div class="foempty">No featured listings yet. On a listing\'s <b>Publish to Marketplace</b> panel, turn on <b>Featured</b> — it will show up here to order.</div>'; if(sb) sb.disabled=true; return; }
  host.innerHTML=FEAT.map(function(it,i){ return '<div class="forow" draggable="true" data-i="'+i+'"><span class="fograb" title="Drag to reorder">⠿</span><span class="fonum">'+(i+1)+'</span><div class="fomain"><div class="fobiz">'+esc(it.business||'Listing')+'</div><div class="fometa">'+esc(it.market||'')+'</div></div><span class="fokind">'+esc(foKindLabel(it.kind))+'</span></div>'; }).join('');
  _wireFoDrag();
}
function _wireFoDrag(){
  var rows=document.querySelectorAll('#foList .forow');
  Array.prototype.forEach.call(rows,function(row){
    row.addEventListener('dragstart',function(e){ _foDragIdx=+row.getAttribute('data-i'); row.classList.add('drag'); try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(_foDragIdx)); }catch(_){} });
    row.addEventListener('dragend',function(){ row.classList.remove('drag'); Array.prototype.forEach.call(document.querySelectorAll('#foList .forow'),function(r){ r.classList.remove('over'); }); });
    row.addEventListener('dragover',function(e){ e.preventDefault(); try{ e.dataTransfer.dropEffect='move'; }catch(_){} row.classList.add('over'); });
    row.addEventListener('dragleave',function(){ row.classList.remove('over'); });
    row.addEventListener('drop',function(e){ e.preventDefault(); var to=+row.getAttribute('data-i'); var from=_foDragIdx; row.classList.remove('over'); if(from<0||from===to||isNaN(to)) return; var moved=FEAT.splice(from,1)[0]; FEAT.splice(to,0,moved); renderFeatured(); var sb=document.getElementById('foSave'); if(sb) sb.disabled=false; _msg('foMsg','',''); });
  });
}
function fetchFeatured(){ fetch('/api/admin/featured-order',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ FEAT=j.items||[]; renderFeatured(); } }).catch(function(){}); }
function saveFeaturedOrder(){ var sb=document.getElementById('foSave'); if(sb) sb.disabled=true; _msg('foMsg','Saving…'); fetch('/api/admin/featured-order',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({order:FEAT.map(function(x){return x.key;})})}).then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ FEAT=j.items||FEAT; renderFeatured(); _msg('foMsg','Saved ✓ — live on /market','ok'); } else { if(sb) sb.disabled=false; _msg('foMsg',(j&&j.error)||'Could not save.','err'); } }).catch(function(){ if(sb) sb.disabled=false; _msg('foMsg','Could not reach the server.','err'); }); }
function _themeSet(t){ t=t||{}; THEME_FIELDS.forEach(function(f){ var el=document.getElementById(f[1]); if(el&&t[f[0]]) el.value=t[f[0]]; }); }
function _themeCollect(){ var o={}; THEME_FIELDS.forEach(function(f){ var el=document.getElementById(f[1]); if(el) o[f[0]]=el.value; }); return o; }
function _headerSet(h){ h=h||{}; var g=function(id,v){ var el=document.getElementById(id); if(el) el.value=(v!=null?v:''); }; g('mhTagline',h.tagline); g('mhAreas',h.areas); g('mhHeading',h.heading); g('mhLede',h.lede); }
function _headerCollect(){ var v=function(id){ return ((document.getElementById(id)||{}).value||'').trim(); }; return { tagline:v('mhTagline'), areas:v('mhAreas'), heading:v('mhHeading'), lede:v('mhLede') }; }
function _msg(id,txt,cls){ var m=document.getElementById(id); if(m){ m.textContent=txt; m.className='msg'+(cls?' '+cls:''); } }
function saveTheme(){ _msg('mtMsg','Saving…'); api('POST',{marketTheme:_themeCollect()}).then(function(j){ _msg('mtMsg', (j&&j.ok)?'Saved ✓ — live on /market':((j&&j.error)||'Could not save.'), (j&&j.ok)?'ok':'err'); }).catch(function(){ _msg('mtMsg','Could not reach the server.','err'); }); }
function resetTheme(){ _themeSet(THEME_DEF); _msg('mtMsg','Saving…'); api('POST',{marketTheme:null}).then(function(j){ _msg('mtMsg',(j&&j.ok)?'Reset to default ✓':((j&&j.error)||'Could not reset.'),(j&&j.ok)?'ok':'err'); }).catch(function(){ _msg('mtMsg','Could not reach the server.','err'); }); }
function saveHeader(){ _msg('mhMsg','Saving…'); api('POST',{marketHeader:_headerCollect()}).then(function(j){ _msg('mhMsg',(j&&j.ok)?'Saved ✓ — live on /market':((j&&j.error)||'Could not save.'),(j&&j.ok)?'ok':'err'); }).catch(function(){ _msg('mhMsg','Could not reach the server.','err'); }); }
function resetHeader(){ _headerSet(HEADER_DEF); _msg('mhMsg','Saving…'); api('POST',{marketHeader:null}).then(function(j){ if(j&&j.ok){ _headerSet(j.marketHeader||HEADER_DEF); } _msg('mhMsg',(j&&j.ok)?'Reset to default ✓':((j&&j.error)||'Could not reset.'),(j&&j.ok)?'ok':'err'); }).catch(function(){ _msg('mhMsg','Could not reach the server.','err'); }); }
api('GET').then(function(j){
  if(!j||!j.ok){ document.getElementById('root').innerHTML='<div class="gate">Marketplace settings are available to administrators.</div>'; return; }
  if(j.marketThemeDefault) THEME_DEF=j.marketThemeDefault;
  if(j.marketHeaderDefault) HEADER_DEF=j.marketHeaderDefault;
  render();
  _themeSet(j.marketTheme||THEME_DEF);
  _headerSet(j.marketHeader||HEADER_DEF);
}).catch(function(){ document.getElementById('root').innerHTML='<div class="gate">Could not reach the server.</div>'; });
</script>
</body>
</html>
