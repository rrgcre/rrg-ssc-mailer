<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRG — Website</title>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--gold:#C8A24B;--ink:#1a2236;--muted:#6b7488;--line:#e6e9f0;--wash:#f5f7fb;--bg:#eef1f6;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);}
.top{background:#000E31;border-bottom:2px solid #2c5c8f;color:#fff;padding:20px 0;}
.top-inner{max-width:1080px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{display:inline-flex;align-items:center;gap:11px;}
.brand .disc{background:var(--red);color:#fff;border-radius:50%;width:38px;height:38px;font-family:'Arial Black',Arial;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;}
.brand .wm{font-weight:700;font-size:15px;}
.top .sp{flex:1;}
.top a.back{color:#c3ccdf;text-decoration:none;font-weight:600;font-size:13px;border:1px solid rgba(255,255,255,.2);padding:7px 13px;border-radius:7px;}
.top a.back:hover{border-color:#fff;color:#fff;}
.wrap{max-width:1080px;margin:0 auto;padding:22px 24px 70px;}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:18px;}
.card h2{font-size:15px;color:var(--navy);margin:0 0 3px;}
.card .sub{font-size:12.5px;color:var(--muted);margin:0 0 16px;}
label.fld{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:0 0 5px;}
input,select,textarea{width:100%;border:1px solid #cfd6e2;border-radius:8px;padding:10px 11px;font:inherit;font-size:14px;background:#fff;color:var(--ink);}
textarea{min-height:76px;resize:vertical;}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:640px){.fld2{grid-template-columns:1fr;}}
.f{margin-bottom:14px;}
.btn{background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:8px;padding:10px 16px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;}
.btn.red{background:var(--red);border-color:var(--red);}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid #cfd6e2;}
.btn.sm{padding:6px 11px;font-size:12px;}
.btnrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;}
.msg{font-size:12.5px;color:var(--muted);}
.msg.ok{color:#1f8a5b;font-weight:700;} .msg.err{color:var(--red);font-weight:700;}
.pubbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--wash);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
.toggle{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:14px;color:var(--navy);cursor:pointer;}
.toggle input{width:18px;height:18px;}
.statuspill{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;border-radius:999px;padding:3px 10px;}
.statuspill.live{background:#e7f5ee;color:#1f8a5b;} .statuspill.off{background:#f3f4f7;color:#8a93a3;}
.urlline{font-size:13px;color:var(--muted);}
.urlline a{color:#2c5c8f;font-weight:700;text-decoration:none;}
.rowitem{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fbfcfe;}
.rowitem .rh{display:flex;gap:10px;align-items:center;margin-bottom:8px;}
.rowitem .rh b{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.rowitem .rh .sp{flex:1;}
.xbtn{background:#fff;border:1px solid #f0c9c6;color:var(--red);border-radius:7px;padding:5px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;}
.xbtn:hover{background:var(--red);color:#fff;border-color:var(--red);}
.addbtn{background:#fff;border:1px dashed #c3ccdf;color:var(--navy);border-radius:8px;padding:9px 13px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;}
.subh{font-size:13px;font-weight:800;color:var(--navy);margin:20px 0 10px;padding-top:14px;border-top:1px solid var(--line);}
.dns{background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--ink);line-height:1.6;}
.dns code{background:#eef2f8;border:1px solid #dde4ee;border-radius:5px;padding:1px 6px;font-size:12.5px;}
.dns table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px;}
.dns th,.dns td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);}
.dns th{color:var(--muted);text-transform:uppercase;font-size:10.5px;letter-spacing:.05em;}
.lead{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff;}
.lead.handled{opacity:.6;}
.lead .lh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.lead .lnm{font-weight:800;color:var(--navy);font-size:14px;}
.lead .lmeta{font-size:12px;color:var(--muted);}
.lead .ltag{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:#eef2fb;color:#23496f;border-radius:999px;padding:2px 9px;}
.lead .lbody{font-size:13px;color:#44506a;margin-top:6px;white-space:pre-wrap;}
.lead .lacts{margin-left:auto;display:flex;gap:6px;}
.empty{color:var(--muted);font-size:13px;padding:12px 2px;}
.savebar{position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(4px);border-top:1px solid var(--line);padding:12px 0;margin-top:6px;}
.savebar .inner{max-width:1080px;margin:0 auto;padding:0 24px;display:flex;gap:12px;align-items:center;}
.hint{font-size:11.5px;color:#98a1b5;margin-top:4px;}
/* --- Section jump-nav (added) --- */
.wmnav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(16,26,48,.05);}
.wmnav-inner{position:relative;max-width:1080px;margin:0 auto;padding:9px 24px;display:flex;gap:7px;align-items:center;overflow-x:auto;scrollbar-width:thin;}
.wmnav-inner::-webkit-scrollbar{height:6px;}
.wmnav-inner::-webkit-scrollbar-thumb{background:#d4dae6;border-radius:3px;}
.wmnav .lbl{flex:none;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#98a1b5;margin-right:3px;}
.wmnav a{flex:none;white-space:nowrap;font-size:12px;font-weight:700;color:var(--muted);background:var(--wash);border:1px solid var(--line);border-radius:999px;padding:6px 12px;text-decoration:none;cursor:pointer;transition:background .12s,color .12s,border-color .12s;}
.wmnav a:hover{color:var(--navy);border-color:#c3ccdf;}
.wmnav a.active{color:#fff;background:var(--navy);border-color:var(--navy);}
@media(max-width:640px){.wmnav-inner{padding:8px 16px;}}
/* collapsible sections (added) */
.card > h2{cursor:pointer;user-select:none;}
.card > h2::before{content:'\25be';display:inline-block;width:13px;color:#9aa4b8;font-size:11px;}
.card.collapsed > h2::before{content:'\25b8';}
.card.collapsed > *:not(h2){display:none!important;}
.card.collapsed{padding-bottom:14px;}
.wmnav-bar{max-width:1080px;margin:0 auto;padding:7px 24px;display:flex;align-items:center;gap:10px;}
.wmnav-bar .wmnav-inner{max-width:none;margin:0;padding:0;flex:1;min-width:0;}
.wmnav-all{flex:none;font-size:11px;font-weight:700;color:var(--navy);background:#fff;border:1px solid #cfd6e2;border-radius:7px;padding:6px 10px;cursor:pointer;white-space:nowrap;}
.wmnav-all:hover{border-color:#9aa4b8;}
</style>
</head>
<body>
<div class="top"><div class="top-inner">
  <span class="brand"><span class="disc">RRG</span><span class="wm">Website</span></span>
  <span class="sp"></span>
  <a class="back" href="./index.html">← Dashboard</a>
</div></div>
<div class="wrap" id="wrap"><div class="card"><div class="empty">Loading…</div></div></div>
<div class="savebar" id="savebar" style="display:none"><div class="inner">
  <button class="btn red" id="saveBtn">Save changes</button>
  <a class="btn ghost" id="previewBtn" target="_blank" rel="noopener">Preview site ↗</a>
  <span class="msg" id="saveMsg"></span>
</div></div>

<script>
var SITE=null, LEADS=[], SUBS=[], PUBURL='';
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function el(id){ return document.getElementById(id); }
function val(id){ var e=el(id); return e?e.value:''; }

function load(){
  fetch('/api/website',{credentials:'same-origin'}).then(function(r){ if(r.status===401||r.status===403) throw new Error('admin'); return r.json(); }).then(function(j){
    if(!j||!j.ok) throw new Error('load');
    SITE=j.site||{}; LEADS=j.leads||[]; SUBS=j.subscribers||[]; PUBURL=j.publicUrl||'/site';
    render();
  }).catch(function(e){
    el('wrap').innerHTML='<div class="card"><h2>Website</h2><p class="sub">'+(e&&e.message==='admin'?'This page is for administrators. Ask an admin to manage the public website.':'Could not load the website settings.')+'</p></div>';
  });
}

function rowStat(x,i){ x=x||{}; return '<div class="rowitem" data-stat><div class="rh"><b>Stat '+(i+1)+'</b><span class="sp"></span><button type="button" class="xbtn" onclick="this.closest(\'[data-stat]\').remove()">Remove</button></div><div class="fld2"><div><label class="fld">Number</label><input class="s_n" value="'+esc(x.n||'')+'" placeholder="200+"></div><div><label class="fld">Label</label><input class="s_l" value="'+esc(x.l||'')+'" placeholder="Restaurant transactions"></div></div></div>'; }
function rowTStat(x,i){ x=x||{}; return '<div class="rowitem" data-tstat><div class="rh"><b>Total '+(i+1)+'</b><span class="sp"></span><button type="button" class="xbtn" onclick="this.closest(\'[data-tstat]\').remove()">Remove</button></div><div class="fld2"><div><label class="fld">Number</label><input class="ts_n" value="'+esc(x.n||'')+'" placeholder="$40M+"></div><div><label class="fld">Label</label><input class="ts_l" value="'+esc(x.l||'')+'" placeholder="In restaurant & bar transactions"></div></div></div>'; }
function rowSvc(x,i){ x=x||{}; return '<div class="rowitem" data-svc><div class="rh"><b>Service '+(i+1)+'</b><span class="sp"></span><button type="button" class="xbtn" onclick="this.closest(\'[data-svc]\').remove()">Remove</button></div><div class="f"><label class="fld">Title</label><input class="v_t" value="'+esc(x.t||'')+'" placeholder="Sell Your Restaurant"></div><div><label class="fld">Description</label><textarea class="v_d" style="min-height:60px">'+esc(x.d||'')+'</textarea></div></div>'; }
function rowOff(x,i){ x=x||{}; return '<div class="rowitem" data-off><div class="rh"><b>Office '+(i+1)+'</b><span class="sp"></span><button type="button" class="xbtn" onclick="this.closest(\'[data-off]\').remove()">Remove</button></div><div class="fld2"><div><label class="fld">City</label><input class="o_c" value="'+esc(x.city||'')+'" placeholder="Austin"></div><div><label class="fld">Phone</label><input class="o_p" value="'+esc(x.phone||'')+'" placeholder="210-204-2471"></div></div></div>'; }
function stepRow(x){ x=x||{}; return '<div class="rowitem" data-step style="background:#fff;margin-bottom:8px"><div class="rh"><b>Step</b><span class="sp"></span><button type="button" class="xbtn" onclick="this.closest(\'[data-step]\').remove()">Remove</button></div><div class="f" style="margin-bottom:8px"><label class="fld">Step title</label><input class="st_t" value="'+esc(x.t||'')+'" placeholder="Valuation & strategy"></div><div><label class="fld">Step description</label><textarea class="st_d" style="min-height:48px">'+esc(x.d||'')+'</textarea></div></div>'; }
function rowTD(x,i,tag,label){ x=x||{}; return '<div class="rowitem" data-'+tag+'><div class="rh"><b>'+label+' '+(i+1)+'</b><span class="sp"></span><button type="button" class="xbtn" onclick="this.closest(\'[data-'+tag+']\').remove()">Remove</button></div><div class="f"><label class="fld">Title</label><input class="td_t" value="'+esc(x.t||'')+'"></div><div><label class="fld">Description</label><textarea class="td_d" style="min-height:58px">'+esc(x.d||'')+'</textarea></div></div>'; }
function rowQA(x,i,tag){ x=x||{}; return '<div class="rowitem" data-'+tag+'><div class="rh"><b>Q'+(i+1)+'</b><span class="sp"></span><button type="button" class="xbtn" onclick="this.closest(\'[data-'+tag+']\').remove()">Remove</button></div><div class="f"><label class="fld">Question</label><input class="qa_q" value="'+esc(x.q||'')+'"></div><div><label class="fld">Answer</label><textarea class="qa_a" style="min-height:70px">'+esc(x.a||'')+'</textarea></div></div>'; }
function addTD(boxId,tag,label){ var box=el(boxId); var d=document.createElement('div'); d.innerHTML=rowTD({},box.children.length,tag,label); box.appendChild(d.firstChild); }
function addQA(boxId,tag){ var box=el(boxId); var d=document.createElement('div'); d.innerHTML=rowQA({},box.children.length,tag); box.appendChild(d.firstChild); }
function rowProc(p,i){ p=p||{}; var steps=(p.steps||[]).map(stepRow).join('');
  return '<div class="rowitem" data-proc style="background:#f2f5fb;border-color:#d7dfee"><div class="rh"><b>Process '+(i+1)+'</b><span class="sp"></span><button type="button" class="xbtn" onclick="this.closest(\'[data-proc]\').remove()">Remove process</button></div>'
    +'<div class="f"><label class="fld">Process name</label><input class="p_name" value="'+esc(p.name||'')+'" placeholder="Selling a restaurant"></div>'
    +'<label class="fld">Steps</label><div class="p_steps">'+steps+'</div>'
    +'<button type="button" class="addbtn" style="margin-top:4px" onclick="addStep(this)">+ Add step</button></div>'; }
function addProc(){ var d=document.createElement('div'); d.innerHTML=rowProc({steps:[{}]}, el('procBox').children.length); el('procBox').appendChild(d.firstChild); }
function addStep(btn){ var box=btn.closest('[data-proc]').querySelector('.p_steps'); var d=document.createElement('div'); d.innerHTML=stepRow({}); box.appendChild(d.firstChild); }
function rowWin(x,i){ x=x||{}; function opt(v){ return '<option'+(String(x.type||'')===v?' selected':'')+'>'+v+'</option>'; }
  return '<div class="rowitem" data-win><div class="rh"><b>Transaction '+(i+1)+'</b><span class="sp"></span><button type="button" class="xbtn" onclick="this.closest(\'[data-win]\').remove()">Remove</button></div>'
    +'<div class="fld2"><div><label class="fld">Result</label><select class="w_type"><option value="">— type —</option>'+opt('Sold')+opt('Leased')+opt('Placed')+'</select></div>'
    +'<div><label class="fld">Market</label><input class="w_market" value="'+esc(x.market||'')+'" placeholder="Austin"></div></div>'
    +'<div class="f" style="margin-top:12px"><label class="fld">What it was</label><input class="w_label" value="'+esc(x.label||'')+'" placeholder="Multi-unit Tex-Mex group"></div>'
    +'<div class="fld2"><div><label class="fld">Value / size</label><input class="w_value" value="'+esc(x.value||'')+'" placeholder="$3.2M or 4,200 SF"></div>'
    +'<div><label class="fld">Detail <span style="text-transform:none;color:#98a1b5">(no client names)</span></label><input class="w_detail" value="'+esc(x.detail||'')+'" placeholder="3 locations · going concern"></div></div></div>'; }
function addWin(){ var d=document.createElement('div'); d.innerHTML=rowWin({}, el('winBox').children.length); el('winBox').appendChild(d.firstChild); }

function leadRow(l){
  var when=''; try{ when=new Date(l.createdAt).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }catch(e){}
  var contact=[l.email,l.phone].filter(Boolean).map(esc).join(' · ');
  return '<div class="lead'+(l.handled?' handled':'')+'" data-lead="'+esc(l.id)+'"><div class="lh">'
    +'<span class="lnm">'+esc(l.name||'(no name)')+'</span>'
    +(l.interest?('<span class="ltag">'+esc(l.interest)+'</span>'):'')
    +'<span class="lmeta">'+contact+(when?(' · '+esc(when)):'')+'</span>'
    +'<span class="lacts"><button class="btn ghost sm" onclick="toggleLead(\''+esc(l.id)+'\','+(l.handled?'false':'true')+')">'+(l.handled?'Reopen':'Mark handled')+'</button><button class="xbtn" onclick="removeLead(\''+esc(l.id)+'\')">Delete</button></span>'
    +'</div>'+(l.message?('<div class="lbody">'+esc(l.message)+'</div>'):'')+'</div>';
}
function subRow(x){
  var when=''; try{ when=new Date(x.createdAt).toLocaleString('en-US',{month:'short',day:'numeric'}); }catch(e){}
  var aud=(String(x.audience||'operator').toLowerCase()==='broker')?'Broker':'Restaurant / Operator';
  var mk=(Array.isArray(x.markets)&&x.markets.length)?x.markets.map(esc).join(', '):'All / unspecified';
  return '<div class="lead" data-sub="'+esc(x.id)+'"><div class="lh">'
    +'<span class="lnm">'+esc(x.name||x.email||'(no name)')+'</span>'
    +'<span class="ltag">'+esc(aud)+'</span>'
    +'<span class="lmeta">'+esc(x.email||'')+(when?(' · '+esc(when)):'')+'</span>'
    +'<span class="lacts"><button class="xbtn" onclick="removeSub(\''+esc(x.id)+'\')">Delete</button></span>'
    +'</div><div class="lbody">Markets: '+mk+'</div></div>';
}
function removeSub(id){
  fetch('/api/website/sub/'+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({})})
    .then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ SUBS=SUBS.filter(function(x){return x.id!==id;}); el('subBox').innerHTML=SUBS.length?SUBS.map(subRow).join(''):'<div class="empty">No subscribers yet. Share your <b>/site/subscribe</b> link to start building the list.</div>'; } });
}
function exportSubs(){
  if(!SUBS.length){ alert('No subscribers to export yet.'); return; }
  var rows=[['Name','Email','Audience','Markets','Signed up']];
  SUBS.forEach(function(x){ rows.push([x.name||'',x.email||'',(String(x.audience||'operator').toLowerCase()==='broker'?'Broker':'Restaurant/Operator'),(Array.isArray(x.markets)?x.markets.join('; '):''),x.createdAt||'']); });
  var csv=rows.map(function(r){ return r.map(function(c){ c=String(c==null?'':c); return /[",\n]/.test(c)?('"'+c.replace(/"/g,'""')+'"'):c; }).join(','); }).join('\r\n');
  var blob=new Blob([csv],{type:'text/csv'}); var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download='listing-subscribers.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function render(){
  var s=SITE||{};
  var newLeads=LEADS.filter(function(l){return !l.handled;}).length;
  var html=''
  +'<div class="card"><div class="pubbar">'
    +'<label class="toggle"><input type="checkbox" id="f_published"'+(s.published?' checked':'')+'> Site is '+'<span id="statuslbl"></span></label>'
    +'<span class="sp" style="flex:1"></span>'
    +'<span class="urlline">Live at: <a href="'+esc(PUBURL)+'" target="_blank" rel="noopener">'+esc(PUBURL)+'</a></span>'
  +'</div><div class="hint">Turn this on to make the public site live. While off, visitors see a short “coming soon” page.</div></div>'

  +'<div class="card"><h2>Hero</h2><p class="sub">The first thing visitors see at the top of the page.</p>'
    +'<div class="f"><label class="fld">Brand name</label><input id="f_brand" value="'+esc(s.brand||'')+'"></div>'
    +'<div class="f"><label class="fld">Headline / tagline</label><input id="f_tagline" value="'+esc(s.tagline||'')+'"></div>'
    +'<div class="f"><label class="fld">Sub-headline</label><textarea id="f_heroSub">'+esc(s.heroSub||'')+'</textarea></div>'
    +'<div class="f"><label class="fld">Hero background photo</label>'
      +'<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
        +'<input type="file" id="heroFile" accept="image/*" style="display:none" onchange="uploadHero(this.files[0])">'
        +'<button type="button" class="btn ghost" onclick="document.getElementById(\'heroFile\').click()">⬆ Upload a photo</button>'
        +'<span class="msg" id="heroMsg"></span>'
      +'</div>'
      +'<div class="hint">Upload a photo you like — JPG/PNG/WEBP, landscape works best. It fills the hero full-width with a dark overlay so the headline stays readable. Or paste an image URL below.</div>'
      +'<input id="f_heroImage" value="'+esc(s.heroImage||'')+'" placeholder="…or paste an image URL" style="margin-top:8px">'
      +'<div id="heroPrev" style="margin-top:10px"></div>'
    +'</div>'
  +'</div>'

  +'<div class="card"><h2>Stats band</h2><p class="sub">The numbers shown under the hero.</p><div id="statsBox"></div><button type="button" class="addbtn" onclick="addStat()">+ Add stat</button></div>'

  +'<div class="card"><h2>Services</h2><p class="sub">What you do — shown as cards.</p>'
    +'<div class="f"><label class="fld">Section heading</label><input id="f_servicesHead" value="'+esc(s.servicesHead||'')+'" placeholder="Full-service representation across food &amp; beverage"></div>'
    +'<div class="f" style="margin-top:12px"><label class="fld">Section intro line</label><textarea id="f_servicesLead" style="min-height:70px" placeholder="One or two sentences introducing what you do.">'+esc(s.servicesLead||'')+'</textarea></div>'
    +'<div style="height:10px"></div><div id="svcBox"></div><button type="button" class="addbtn" onclick="addSvc()">+ Add service</button>'
    +'<div class="f" style="margin-top:16px"><label class="fld">Concept tags (one per line)</label><textarea id="f_concepts" style="min-height:120px" placeholder="Multi-unit &amp; portfolios&#10;Full-service restaurants&#10;Bars &amp; nightlife">'+esc((s.concepts||[]).join('\n'))+'</textarea><div class="sub" style="margin-top:4px">Shown as pills above the service cards. One concept per line. Any line containing “multi-unit” or “portfolio” is highlighted automatically.</div></div>'

    offices: rows('[data-off]',function(r){ return { city:r.querySelector('.o_c').value, phone:r.querySelector('.o_p').value }; }).filter(function(x){return x.city||x.phone;}),
    subMarkets: (val('f_subMarkets')||'').split('\n').map(function(x){return x.trim();}).filter(Boolean),
    subscribe: { headline: val('f_subHeadline'), sub: val('f_subSub'), intro: val('f_subIntro'), operatorDesc: val('f_subOpDesc'), brokerDesc: val('f_subBrDesc'), submitText: val('f_subSubmit'), fine: val('f_subFine'), reassure: (val('f_subReassure')||'').split('\n').map(function(x){return x.trim();}).filter(Boolean) },
    welcomeEmail: { enabled: (el('we_enabled')?el('we_enabled').checked:true), subject: val('we_subject'), heading: val('we_heading'), body: (el('we_body')?el('we_body').value:''), signoff: val('we_signoff') },
    accessAlert: { enabled: (el('aa_enabled')?el('aa_enabled').checked:true), subject: val('aa_subject'), heading: val('aa_heading'), intro: (el('aa_intro')?el('aa_intro').value:'') },
    wins: rows('[data-win]',function(r){ return { type:r.querySelector('.w_type').value, label:r.querySelector('.w_label').value, value:r.querySelector('.w_value').value, market:r.querySelector('.w_market').value, detail:r.querySelector('.w_detail').value }; }).filter(function(w){return w.label||w.type;}),
    trackStats: rows('[data-tstat]',function(r){ return { n:r.querySelector('.ts_n').value, l:r.querySelector('.ts_l').value }; }).filter(function(x){return x.n||x.l;})
  };
}
function heroPreview(u){ var p=el('heroPrev'); if(!p) return; p.innerHTML=u?('<img src="'+esc(u)+'" alt="hero preview" style="max-width:340px;width:100%;border-radius:10px;border:1px solid var(--line);display:block">'):''; }
function uploadHero(file){
  if(!file) return; var msg=el('heroMsg');
  if(file.size>9*1024*1024){ msg.textContent='Too large (max ~9MB).'; msg.className='msg err'; return; }
  msg.textContent='Uploading…'; msg.className='msg';
  var r=new FileReader();
  r.onload=function(){
    fetch('/api/website/hero',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({filename:file.name,dataB64:String(r.result||'')})})
      .then(function(x){return x.json();}).then(function(j){
        if(j&&j.ok){ el('f_heroImage').value=j.url; if(SITE) SITE.heroImage=j.url; heroPreview(j.url+'&t='+Date.now()); msg.textContent='Uploaded ✓ — click Save changes to publish.'; msg.className='msg ok'; }
        else { msg.textContent=(j&&j.error)||'Upload failed.'; msg.className='msg err'; }
      }).catch(function(){ msg.textContent='Network error.'; msg.className='msg err'; });
  };
  r.readAsDataURL(file);
}
function save(){
  var msg=el('saveMsg'), btn=el('saveBtn'); btn.disabled=true; msg.className='msg'; msg.textContent='Saving…';
  fetch('/api/website',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(collect())})
    .then(function(r){return r.json();}).then(function(j){ btn.disabled=false;
      if(j&&j.ok){ SITE=j.site||SITE; msg.className='msg ok'; msg.textContent='Saved ✓'; setTimeout(function(){ if(msg.textContent==='Saved ✓') msg.textContent=''; },2000); }
      else { msg.className='msg err'; msg.textContent=(j&&j.error)||'Save failed.'; }
    }).catch(function(){ btn.disabled=false; msg.className='msg err'; msg.textContent='Network error.'; });
}
function toggleLead(id,handled){
  fetch('/api/website/lead/'+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({handled:handled})})
    .then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ LEADS.forEach(function(l){ if(l.id===id) l.handled=handled; }); render(); } });
}
function removeLead(id){
  if(!confirm('Delete this lead?')) return;
  fetch('/api/website/lead/'+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({remove:true})})
    .then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ LEADS=LEADS.filter(function(l){return l.id!==id;}); render(); } });
}
document.getElementById('saveBtn').addEventListener('click',save);
load();
</script>
<script>
/* Section jump-nav + collapsible sections for the long editor form (added) */
(function(){
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
  function slug(s){return 'sec-'+String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);}
  function shortLabel(n){return n.replace(/\s+page$/i,'').replace(/^Listing-alert\s+/i,'Alert: ').replace(/Track-record totals/i,'Track record').replace(/Selected transactions/i,'Transactions').replace(/Connect your domain/i,'Domain').replace(/Listing-alert subscribers/i,'Subscribers').replace(/Lead inbox/i,'Leads');}
  function lsGet(id){ try{ return localStorage.getItem('wmcol:'+id)==='1'; }catch(e){ return false; } }
  function lsSet(id,v){ try{ if(v) localStorage.setItem('wmcol:'+id,'1'); else localStorage.removeItem('wmcol:'+id); }catch(e){} }
  function cardList(){ var w=document.getElementById('wrap'); return w?Array.prototype.filter.call(w.querySelectorAll('.card'),function(c){return c.querySelector('h2');}):[]; }
  function setCollapsed(c,v){ c.classList.toggle('collapsed',!!v); if(c.id) lsSet(c.id,!!v); }
  function updateAllBtn(){ var b=document.getElementById('wmAll'); if(!b)return; var anyOpen=cardList().some(function(c){return !c.classList.contains('collapsed');}); b.textContent=anyOpen?'Collapse all':'Expand all'; }
  function build(){
    var wrap=document.getElementById('wrap'); if(!wrap) return;
    var cs=cardList(); if(!cs.length) return;
    var used={}, chips='';
    cs.forEach(function(c){
      var h=c.querySelector('h2'); var raw=(h.textContent||'').split('\u00b7')[0].trim(); if(!raw) raw='Section';
      var id=slug(raw); while(used[id])id+='x'; used[id]=1; c.id=id;
      chips+='<a data-sec="'+id+'" href="#'+id+'">'+esc(shortLabel(raw))+'</a>';
      if(!h._wmTog){ h._wmTog=1; h.addEventListener('click',function(){ setCollapsed(c,!c.classList.contains('collapsed')); updateAllBtn(); }); }
      if(lsGet(id)) c.classList.add('collapsed');
    });
    var nav=document.getElementById('wmnav');
    var bar='<div class="wmnav-bar"><div class="wmnav-inner"><span class="lbl">Jump to</span>'+chips+'</div><button type="button" class="wmnav-all" id="wmAll">Collapse all</button></div>';
    if(!nav){ nav=document.createElement('nav'); nav.className='wmnav'; nav.id='wmnav'; nav.innerHTML=bar; wrap.parentNode.insertBefore(nav,wrap); }
    else if(nav._sig!==chips){ nav.innerHTML=bar; }
    nav._sig=chips;
    var inner=nav.querySelector('.wmnav-inner');
    Array.prototype.forEach.call(inner.querySelectorAll('a[data-sec]'),function(a){ a.onclick=function(e){ e.preventDefault(); var c=document.getElementById(a.getAttribute('data-sec')); if(!c)return; if(c.classList.contains('collapsed')) setCollapsed(c,false); var y=c.getBoundingClientRect().top+window.pageYOffset-(nav.offsetHeight+14); window.scrollTo({top:y,behavior:'smooth'}); updateAllBtn(); }; });
    var allBtn=nav.querySelector('#wmAll'); if(allBtn){ allBtn.onclick=function(){ var cl=cardList(); var anyOpen=cl.some(function(c){return !c.classList.contains('collapsed');}); cl.forEach(function(c){ setCollapsed(c,anyOpen); }); updateAllBtn(); if(anyOpen) window.scrollTo({top:0,behavior:'smooth'}); }; }
    updateAllBtn();
    nav._cur=null; spy(nav);
  }
  function spy(nav){
    var cs=cardList().filter(function(c){return c.id;});
    var navH=nav.offsetHeight+22, cur=null;
    for(var i=0;i<cs.length;i++){ if(cs[i].getBoundingClientRect().top<=navH) cur=cs[i]; }
    if(!cur&&cs.length) cur=cs[0];
    var id=cur?cur.id:null;
    if(id===nav._cur) return; nav._cur=id;
    var inner=nav.querySelector('.wmnav-inner');
    Array.prototype.forEach.call(inner.querySelectorAll('a[data-sec]'),function(a){ var on=a.getAttribute('data-sec')===id; a.classList.toggle('active',on); if(on){ try{inner.scrollLeft=a.offsetLeft-inner.clientWidth/2+a.offsetWidth/2;}catch(e){} } });
  }
  function init(){
    var wrap=document.getElementById('wrap'); if(!wrap){ return setTimeout(init,200); }
    try{build();}catch(e){}
    try{ var mo=new MutationObserver(function(){ clearTimeout(window._wmT); window._wmT=setTimeout(function(){ try{build();}catch(e){} },150); }); mo.observe(wrap,{childList:true,subtree:true}); }catch(e){}
    window.addEventListener('scroll',function(){ var nav=document.getElementById('wmnav'); if(nav){ try{spy(nav);}catch(e){} } },{passive:true});
  }
  if(document.readyState!=='loading') init(); else document.addEventListener('DOMContentLoaded',init);
})();
</script>
</body>
