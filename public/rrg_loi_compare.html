<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRG — LOI Comparison</title>
<style>
:root{--navy:#000E31;--red:#DA2B1F;--ink:#1a2236;--muted:#6b7488;--soft:#8a93a8;--line:#e6e9f0;--wash:#f5f7fb;--green:#1f8a5b;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#eef1f6;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.wrap{max-width:1320px;margin:0 auto;padding:22px 24px 40px;}
.pgh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
.kick{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red);}
.pgh h1{margin:3px 0 0;font-size:24px;font-weight:800;color:var(--navy);letter-spacing:-.01em;}
.pgs{color:var(--muted);font-size:12.5px;margin-top:4px;max-width:760px;line-height:1.5;}
.cmpacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.btn{font:inherit;font-size:12.5px;font-weight:700;border:1px solid #cfd6e2;background:#fff;color:var(--navy);border-radius:8px;padding:8px 13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{border-color:#9fb0cc;} .btn.pri{background:var(--navy);color:#fff;border-color:var(--navy);}
.ck{font-size:12.5px;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(11,26,56,.05);overflow:auto;margin-bottom:14px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:9px 14px;border-bottom:1px solid #f0f3f8;text-align:right;white-space:nowrap;}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1;color:#4a5570;font-weight:600;min-width:210px;}
thead th{vertical-align:bottom;background:#fff;border-bottom:2px solid var(--line);}
thead th .pr{font-size:14px;font-weight:800;color:var(--navy);white-space:normal;max-width:240px;margin-left:auto;line-height:1.3;}
thead th .su{font-size:11.5px;color:var(--muted);font-weight:600;white-space:normal;margin-top:3px;}
thead th .meta{margin-top:6px;display:flex;gap:6px;justify-content:flex-end;align-items:center;flex-wrap:wrap;}
.pill{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:2px 8px;border-radius:999px;}
tr.sec td{background:#f4f6fa;color:#4a5570;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:7px 14px;}
tr.sec td:first-child{background:#f4f6fa;}
td.best{color:var(--green);font-weight:800;}
tr.ner td{font-size:15px;font-weight:800;color:var(--navy);background:#fbfcff;} tr.ner td:first-child{background:#fbfcff;}
tr.ner td.win{background:#e9f7ef;color:#16673f;box-shadow:inset 0 3px 0 #1f8a5b;}
.winb{display:inline-block;margin-top:4px;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:#1f8a5b;border-radius:999px;padding:2px 8px;}
td input.nnn{width:84px;text-align:right;font:inherit;font-size:13px;padding:4px 7px;border:1px solid #cfd6e2;border-radius:6px;}
.dash{color:#c3cad6;}
.note{font-size:12px;color:var(--muted);line-height:1.6;padding:12px 16px;}
.empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6;}
.printhd{display:none;}
@media print{
  html,body{background:#fff;} .wrap{padding:0;max-width:none;} .noprint{display:none !important;}
  .card{box-shadow:none;border:none;border-radius:0;overflow:visible;}
  .printhd{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--navy);padding-bottom:10px;margin-bottom:12px;}
  .printhd img{max-height:40px;} .printhd .wm{font-weight:800;font-size:13px;text-transform:uppercase;color:var(--navy);letter-spacing:.04em;}
  td input.nnn{border:none;padding:0;width:auto;}
  th,td{padding:6px 10px;font-size:11.5px;} th:first-child,td:first-child{position:static;}
  @page{size:landscape;margin:.5in;}
}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Loading LOIs…</div></div>
<script>
var KEY=(function(){ try{ return new URLSearchParams(location.search).get('key')||''; }catch(e){ return ''; } })();
var DATA=null, SHOWDEAD=false, LOGO='', ORG='';
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function num(v){ if(v==null) return NaN; var n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isFinite(n)?n:NaN; }
function money(n,d){ if(!isFinite(n)) return '<span class="dash">—</span>'; return '$'+n.toLocaleString('en-US',{minimumFractionDigits:d==null?0:d,maximumFractionDigits:d==null?0:d}); }
function psf(n){ return isFinite(n)?('$'+n.toFixed(2)):'<span class="dash">—</span>'; }
function txt(v){ return (v==null||String(v).trim()==='')?'<span class="dash">—</span>':esc(String(v)); }
function pill(st){ var c=({Draft:['#eef1f6','#6b7488'],Sent:['#e8f0fd','#2c5c8f'],Countered:['#fdf1df','#b5791f'],Negotiating:['#f3edfb','#7a4fd0'],Accepted:['#e7f5ee','#1f8a5b'],Dead:['#f3f4f7','#98a1b5']})[st||'Draft']||['#eef1f6','#6b7488']; return '<span class="pill" style="background:'+c[0]+';color:'+c[1]+'">'+esc(st||'Draft')+'</span>'; }
// Net effective rent: (base rent over the term − free-rent value − TI allowance) ÷ (SF × years).
// Escalations compound annually (% or fixed $/SF); free rent abates base rent from day one; NNN held flat.
function calc(l){
  var v=l.values||{}; var S=num(v.rsf); var T=num(v.term); var r0=num(v.base_rent); var nnn=num(v.nnn);
  var e=num(v.esc_amount); var eu=v.esc_unit||'%'; var freeD=num(v.free_rent); var ti=num(v.ti);
  var o={ S:S, T:T, r0:r0, nnn:nnn, freeM:isFinite(freeD)?freeD/30.4375:NaN, ti:ti };
  o.gross1=isFinite(r0)?(r0+(isFinite(nnn)?nnn:0)):NaN;
  o.occ1=(isFinite(o.gross1)&&isFinite(S))?o.gross1*S:NaN;
  if(isFinite(r0)&&isFinite(T)&&T>0){
    var yrs=Math.ceil(T), sum=0;
    for(var y=1;y<=yrs;y++){ var frac=Math.min(1,T-(y-1)); var ry=!isFinite(e)?r0:(eu==='%'?r0*Math.pow(1+e/100,y-1):r0+e*(y-1)); sum+=ry*frac; }
    o.basePsfTerm=sum; o.lastYr=!isFinite(e)?r0:(eu==='%'?r0*Math.pow(1+e/100,yrs-1):r0+e*(yrs-1));
    o.freePsf=isFinite(o.freeM)?(r0/12*o.freeM):0; o.tiPsf=isFinite(ti)?ti:0;
    o.nerBase=(sum-o.freePsf-o.tiPsf)/T; o.nerGross=o.nerBase+(isFinite(nnn)?nnn:0);
    if(isFinite(S)){ o.totBase=sum*S; o.freeVal=o.freePsf*S; o.tiVal=o.tiPsf*S; o.totNet=(sum-o.freePsf-o.tiPsf+(isFinite(nnn)?nnn*T:0))*S; }
  }
  return o;
}
function load(){
  Promise.all([
    fetch('/api/assignment/'+encodeURIComponent(KEY)+'/lois',{credentials:'same-origin'}).then(function(r){return r.json();}),
    fetch('/api/loi',{credentials:'same-origin'}).then(function(r){return r.json();}).catch(function(){return {};})
  ]).then(function(res){ var j=res[0]; LOGO=(res[1]&&(res[1].logoLightUrl||res[1].logoUrl))||''; ORG=(res[1]&&(res[1].orgName||res[1].appName))||'';
    if(!j||!j.ok){ document.getElementById('app').innerHTML='<div class="card"><div class="empty">'+esc((j&&j.error)||'Could not load this engagement.')+'</div></div>'; return; }
    DATA=j; render(); }).catch(function(){ document.getElementById('app').innerHTML='<div class="card"><div class="empty">Could not reach the server.</div></div>'; });
}
function render(){
  var all=(DATA.lois||[]).filter(function(l){ return l.type==='tenant_rep'; });
  var list=all.filter(function(l){ return SHOWDEAD||l.status!=='Dead'; });
  var nDead=all.length-all.filter(function(l){return l.status!=='Dead';}).length;
  var h='<div class="printhd">'+(LOGO?('<img src="'+esc(LOGO)+'" alt="">'):'<span class="wm">'+esc(ORG||'')+'</span>')+'<span class="wm">LOI Comparison · '+esc(DATA.business||'')+'</span></div>';
  h+='<div class="pgh noprint"><div><div class="kick">Tenant Rep · LOI comparison</div><h1>'+esc(DATA.business||'Engagement')+'</h1><div class="pgs">Every lease LOI on this engagement side by side — rent, concessions and <b>net effective rent</b> over the term, the number that decides the deal. Enter an NNN estimate where the LOI doesn\'t carry one.</div></div>'
    +'<div class="cmpacts">'+(nDead?('<label class="ck"><input type="checkbox" id="showDead"'+(SHOWDEAD?' checked':'')+'> Show dead ('+nDead+')</label>'):'')+'<a class="btn" href="./rrg_tenant_engagement.html?key='+encodeURIComponent(KEY)+'">← Engagement</a><a class="btn" href="./rrg_loi_builder.html?key='+encodeURIComponent(KEY)+'#new">+ New LOI</a><button class="btn pri" onclick="window.print()">Print / PDF</button></div></div>';
  if(!list.length){ document.getElementById('app').innerHTML=h+'<div class="card"><div class="empty">No lease LOIs on this engagement yet.<br><a class="btn pri" style="margin-top:12px" href="./rrg_loi_builder.html?key='+encodeURIComponent(KEY)+'#new">Build the first LOI</a></div></div>'; wire(); return; }
  var C=list.map(calc);
  function bestIdx(vals,low){ var bi=-1,bv=null; vals.forEach(function(x,i){ if(!isFinite(x)) return; if(bv===null||(low?x<bv:x>bv)){ bv=x; bi=i; } }); var cnt=vals.filter(function(x){return isFinite(x);}).length; return cnt>1?bi:-1; }
  function row(label,cells,best){ return '<tr><td>'+label+'</td>'+cells.map(function(c,i){ return '<td'+(i===best?' class="best"':'')+'>'+c+'</td>'; }).join('')+'</tr>'; }
  function sec(t){ return '<tr class="sec"><td>'+t+'</td>'+list.map(function(){return '<td></td>';}).join('')+'</tr>'; }
  var t='<table><thead><tr><th></th>'+list.map(function(l){ return '<th><div class="pr">'+esc(l.property||'Untitled')+'</div><div class="su">'+esc(l.premises||'')+(l.landlord?(' · '+esc(l.landlord)):'')+'</div><div class="meta">'+pill(l.status)+'<span class="pill" style="background:#f1f4f9;color:#4a5570">v'+(l.version||1)+'</span><a class="noprint" href="./rrg_loi_builder.html?id='+encodeURIComponent(l.id)+'" style="font-size:11.5px;font-weight:700;color:#23496f;text-decoration:none">Open ↗</a></div></th>'; }).join('')+'</tr></thead><tbody>';
  t+=sec('Space');
  t+=row('Rentable SF',C.map(function(c){ return isFinite(c.S)?c.S.toLocaleString('en-US'):'<span class="dash">—</span>'; }),-1);
  t+=row('Term (years)',C.map(function(c){ return isFinite(c.T)?c.T:'<span class="dash">—</span>'; }),-1);
  t+=row('Delivery condition',list.map(function(l){ return txt(l.values.delivery_condition); }),-1);
  t+=row('Rent structure',list.map(function(l){ return txt(l.values.rent_structure); }),-1);
  t+=sec('Rent');
  t+=row('Base rent ($/SF/yr)',C.map(function(c){return psf(c.r0);}),bestIdx(C.map(function(c){return c.r0;}),true));
  t+=row('Escalations',list.map(function(l){ var a=l.values.esc_amount; if(a==null||String(a).trim()==='') return '<span class="dash">—</span>'; return (l.values.esc_unit||'%')==='%'?(esc(a)+'% / yr'):('$'+esc(a)+'/SF / yr'); }),-1);
  t+=row('NNN / CAM est. ($/SF/yr)',list.map(function(l){ return '<input class="nnn" data-id="'+esc(l.id)+'" value="'+esc(l.values.nnn||'')+'" placeholder="—">'; }),-1);
  t+=row('Year-1 gross ($/SF/yr)',C.map(function(c){return psf(c.gross1);}),bestIdx(C.map(function(c){return c.gross1;}),true));
  t+=row('Year-1 occupancy cost',C.map(function(c){return money(c.occ1);}),bestIdx(C.map(function(c){return c.occ1;}),true));
  t+=row('Final-year base ($/SF/yr)',C.map(function(c){return psf(c.lastYr);}),bestIdx(C.map(function(c){return c.lastYr;}),true));
  t+=sec('Concessions');
  t+=row('Free rent',C.map(function(c){ return isFinite(c.freeM)?(c.freeM.toFixed(1)+' mo'):'<span class="dash">—</span>'; }),bestIdx(C.map(function(c){return c.freeM;}),false));
  t+=row('TI allowance ($/SF)',C.map(function(c){return psf(c.ti);}),bestIdx(C.map(function(c){return c.ti;}),false));
  t+=row('TI allowance (total)',C.map(function(c){return money(c.tiVal);}),bestIdx(C.map(function(c){return c.tiVal;}),false));
  t+=row('Free-rent value',C.map(function(c){return money(c.freeVal);}),bestIdx(C.map(function(c){return c.freeVal;}),false));
  t+=sec('Over the term');
  t+=row('Total base rent',C.map(function(c){return money(c.totBase);}),bestIdx(C.map(function(c){return c.totBase;}),true));
  t+=row('Total occupancy cost, net of concessions',C.map(function(c){return money(c.totNet);}),bestIdx(C.map(function(c){return c.totNet;}),true));
  t+=row('Net effective base rent ($/SF/yr)',C.map(function(c){return psf(c.nerBase);}),bestIdx(C.map(function(c){return c.nerBase;}),true));
  var wi=bestIdx(C.map(function(c){return c.nerGross;}),true);
  t+='<tr class="ner"><td>Net effective gross rent ($/SF/yr)</td>'+C.map(function(c,i){ return '<td'+(i===wi?' class="win"':'')+'>'+psf(c.nerGross)+(i===wi?'<div><span class="winb">Best effective rent</span></div>':'')+'</td>'; }).join('')+'</tr>';
  t+='</tbody></table>';
  h+='<div class="card">'+t+'<div class="note"><b>How it\'s calculated.</b> Net effective rent = (base rent over the full term − free-rent value − TI allowance) ÷ (SF × years). Escalations compound annually; free rent abates base rent from commencement; NNN is held flat at the estimate entered. Green marks the best value in each row. Blanks mean the LOI doesn\'t state that term.</div></div>';
  h+='<div class="note" style="text-align:center;padding:4px 0 0">'+esc(ORG||'')+' · Prepared '+new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})+' · Non-binding proposals; figures from each LOI as drafted.</div>';
  document.getElementById('app').innerHTML=h; wire();
}
function wire(){
  var sd=document.getElementById('showDead'); if(sd) sd.onchange=function(){ SHOWDEAD=sd.checked; render(); };
  document.querySelectorAll('input.nnn').forEach(function(inp){ inp.addEventListener('change',function(){ var id=inp.getAttribute('data-id'); var val=inp.value.trim(); var l=(DATA.lois||[]).filter(function(x){return x.id===id;})[0]; if(l){ l.values.nnn=val; }
    fetch('/api/loi/'+encodeURIComponent(id)+'/field',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({key:'nnn',value:val})}).catch(function(){});
    render(); }); });
}
if(!KEY) document.getElementById('app').innerHTML='<div class="card"><div class="empty">Open the comparison from a tenant engagement\'s <b>LOIs</b> card.</div></div>'; else load();
</script>
</body>
</html>
