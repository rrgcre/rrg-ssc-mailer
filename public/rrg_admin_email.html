<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRG — Email / SMTP</title>
<style>
:root{--navy:#0b1636;--navy2:#16346e;--red:#C0261B;--ink:#141a29;--dim:#5f6a7d;--soft:#8a93a3;--line:#e5e9f1;--wash:#f5f7fb;--green:#1f8a5b;--amber:#8a5a12;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#fff;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.wrap{max-width:1040px;margin:0 auto;padding:26px 26px 60px;}
h1{font-size:20px;font-weight:700;color:var(--navy);margin:0;}
.sub{font-size:13px;color:var(--dim);margin-top:6px;line-height:1.5;max-width:620px;}
.status{display:flex;align-items:center;gap:9px;margin:18px 0 4px;border:1px solid var(--line);border-radius:12px;padding:12px 15px;font-size:13px;}
.dot{width:9px;height:9px;border-radius:50%;flex:none;}
.dot.on{background:var(--green);} .dot.off{background:#c9ced8;}
.card{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:16px;}
.card h2{font-size:14px;font-weight:700;color:var(--navy);margin:0 0 3px;}
.card .ch-sub{font-size:12px;color:var(--soft);margin-bottom:14px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
@media(max-width:560px){.grid{grid-template-columns:1fr;}}
.fld{display:flex;flex-direction:column;gap:5px;}
.fld.full{grid-column:1/-1;}
label.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);}
input[type=text],input[type=number],input[type=email],input[type=password]{border:1px solid #cfd6e2;border-radius:9px;padding:10px 12px;font:inherit;font-size:13.5px;width:100%;}
input:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 2px rgba(22,52,110,.12);}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 15px;}
.pre{background:#fff;border:1px solid #cdd6e6;border-radius:8px;padding:7px 12px;font:inherit;font-size:12.5px;font-weight:700;color:var(--navy);cursor:pointer;}
.pre:hover{border-color:#b9c6df;background:#fbfcff;}
.check{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink);cursor:pointer;}
.check input{width:16px;height:16px;}
.savebar{display:flex;align-items:center;gap:12px;margin-top:16px;}
.savebtn{background:var(--navy);color:#fff;border:none;border-radius:9px;padding:10px 20px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;}
.savebtn.ghost{background:#fff;color:var(--navy);border:1px solid #cdd6e6;}
.savebtn:disabled{opacity:.5;cursor:default;}
.msg{font-size:12.5px;font-weight:600;}
.note{font-size:12px;color:var(--soft);margin-top:14px;line-height:1.55;}
.hint{font-size:12px;color:var(--amber);background:#fff8ec;border:1px solid #f0e0c0;border-radius:9px;padding:9px 12px;margin-top:12px;line-height:1.5;display:none;}
.hint.show{display:block;}
.gate{color:var(--dim);font-size:13.5px;padding:30px 0;}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<div class="wrap" id="root"><div class="gate">Loading…</div></div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
var CFG=null;
var PRESETS=[
  {n:'SendGrid',host:'smtp.sendgrid.net',port:587,secure:false,user:'apikey'},
  {n:'Mailgun',host:'smtp.mailgun.org',port:587,secure:false,user:''},
  {n:'Gmail / Workspace',host:'smtp.gmail.com',port:587,secure:false,user:''},
  {n:'Microsoft 365',host:'smtp.office365.com',port:587,secure:false,user:''},
  {n:'Amazon SES',host:'email-smtp.us-east-1.amazonaws.com',port:587,secure:false,user:''}
];
function val(id){ var e=document.getElementById(id); return e?e.value.trim():''; }
function chk(id){ var e=document.getElementById(id); return !!(e&&e.checked); }
function detectHint(){
  var h=val('host').toLowerCase(), box=document.getElementById('hint'); if(!box) return;
  if(h.indexOf('sendgrid')>=0){ box.className='hint show'; box.innerHTML='<b>You’re on SendGrid.</b> That means you already have the Twilio SendGrid email product — so the email-in feature (SendGrid Inbound Parse) is available to you without any new vendor.'; }
  else if(h){ box.className='hint show'; box.innerHTML='Relay set to <b>'+esc(h)+'</b>. For the email-in (drop files by email) feature we discussed, SendGrid Inbound Parse is the cleanest path — that needs the SendGrid email product.'; }
  else { box.className='hint'; box.innerHTML=''; }
}
function render(){
  var c=CFG||{};
  var statusOn=!!c.configured;
  document.getElementById('root').innerHTML=''
    +'<h1>Email / SMTP</h1>'
    +'<div class="sub">How the system sends all outbound mail — buyer invites, verification codes, alerts and signature requests. This is a firm-wide server setting.</div>'
    +'<div class="status"><span class="dot '+(statusOn?'on':'off')+'"></span><span>'+(statusOn?'<b>Outbound email is configured and on.</b>':'<b>Not configured.</b> No automated email is being sent until a host is saved and enabled.')+'</span></div>'
    +'<div class="card">'
      +'<h2>Server (SMTP)</h2><div class="ch-sub">Your outbound relay. Use a preset to fill the common ones, then add your login.</div>'
      +'<div class="presets">'+PRESETS.map(function(p,i){ return '<button class="pre" data-p="'+i+'">'+esc(p.n)+'</button>'; }).join('')+'</div>'
      +'<div class="grid">'
        +'<div class="fld full"><label class="lbl">SMTP host</label><input type="text" id="host" value="'+esc(c.host||'')+'" placeholder="e.g. smtp.sendgrid.net"></div>'
        +'<div class="fld"><label class="lbl">Port</label><input type="number" id="port" value="'+esc(c.port||587)+'" placeholder="587"></div>'
        +'<div class="fld" style="justify-content:flex-end"><label class="check" style="margin-bottom:8px"><input type="checkbox" id="secure" '+(c.secure?'checked':'')+'> Use SSL (port 465)</label></div>'
        +'<div class="fld"><label class="lbl">Username</label><input type="text" id="user" value="'+esc(c.user||'')+'" placeholder="SMTP username / API user"></div>'
        +'<div class="fld"><label class="lbl">Password / API key</label><input type="password" id="pass" placeholder="'+(c.hasPass?'••••• (unchanged)':'not set')+'"></div>'
        +'<div class="fld full"><label class="lbl">From address</label><input type="text" id="from" value="'+esc(c.from||'')+'" placeholder="van@rrgcre.com"></div>'
      +'</div>'
      +'<label class="check" style="margin-top:14px"><input type="checkbox" id="enabled" '+((c.enabled!==false)?'checked':'')+'> Outbound email enabled</label>'
      +(c.hasPass?'<label class="check" style="margin-top:10px;color:#C0261B"><input type="checkbox" id="clearpass"> Clear the saved password</label>':'')
      +'<div class="hint" id="hint"></div>'
      +'<div class="savebar"><button class="savebtn" id="save">Save settings</button><span class="msg" id="msg"></span></div>'
      +'<div class="note">Password / API key is write-only — it’s never sent back to this screen. Leave it blank to keep the one already saved. Port 587 with SSL off is standard (STARTTLS); use 465 with SSL on only if your provider requires it.</div>'
    +'</div>'
    +'<div class="card">'
      +'<h2>Send a test</h2><div class="ch-sub">Confirms the settings above actually deliver. Save first, then send.</div>'
      +'<div class="grid"><div class="fld full"><label class="lbl">Send test to</label><input type="email" id="testto" placeholder="you@rrgcre.com"></div></div>'
      +'<div class="savebar"><button class="savebtn ghost" id="test">Send test email</button><span class="msg" id="testmsg"></span></div>'
    +'</div>'
    +'<div class="card">'
      +'<h2>Weekly owner digest</h2><div class="ch-sub">One email to the firm\'s admins each week: last week\'s closings and GCI, year to date vs last year, the 90-day forecast, stalled deals, buyer activity, listings expiring, money owed, rep activity, and the top three things to act on.</div>'
      +'<label class="check" style="margin-top:6px"><input type="checkbox" id="wdEnabled"> Send the weekly digest automatically</label>'
      +'<div class="grid" style="margin-top:12px"><div class="fld"><label class="lbl">Day</label><select id="wdDay">'+['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map(function(d,i){ return '<option value="'+i+'">'+d+'</option>'; }).join('')+'</select></div>'
      +'<div class="fld"><label class="lbl">Time <span id="wdTz" style="text-transform:none;letter-spacing:0;font-weight:600"></span></label><select id="wdHour">'+Array.apply(null,{length:24}).map(function(_,h){ var l=(h%12||12)+':00 '+(h<12?'AM':'PM'); return '<option value="'+h+'">'+l+'</option>'; }).join('')+'</select></div>'
      +'<div class="fld full"><label class="lbl">Send to <span style="text-transform:none;letter-spacing:0;font-weight:600">(emails, comma separated — only these addresses get it)</span></label><input id="wdExtra" placeholder="e.g. you@yourfirm.com, partner@yourfirm.com"></div></div>'
      +'<div class="note" id="wdTo" style="margin-top:8px"></div>'
      +'<div class="savebar"><button class="savebtn" id="wdSave">Save digest</button><button class="savebtn ghost" id="wdPreview" type="button">Preview</button><button class="savebtn ghost" id="wdSendMe" type="button">Email me one now</button><span class="msg" id="wdMsg"></span></div>'
    +'</div>'
    +'<div class="card">'
      +'<h2>Weekly industry brief</h2><div class="ch-sub">An AI-researched email to the managers you pick: last week\'s restaurant and bar industry news in your markets (sales, expansions, closings, openings, rule changes) with the move for each, plus industry events coming up worth attending. Every item links to its source.</div>'
      +'<label class="check" style="margin-top:6px"><input type="checkbox" id="ibEnabled"> Send the industry brief automatically</label>'
      +'<div class="grid" style="margin-top:12px"><div class="fld"><label class="lbl">Day</label><select id="ibDay">'+['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map(function(d,i){ return '<option value="'+i+'">'+d+'</option>'; }).join('')+'</select></div>'
      +'<div class="fld"><label class="lbl">Time <span id="ibTz" style="text-transform:none;letter-spacing:0;font-weight:600"></span></label><select id="ibHour">'+Array.apply(null,{length:24}).map(function(_,h){ var l=(h%12||12)+':00 '+(h<12?'AM':'PM'); return '<option value="'+h+'">'+l+'</option>'; }).join('')+'</select></div>'
      +'<div class="fld full"><label class="lbl">Send to</label><div id="ibUsers" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 14px;padding:4px 0"></div></div>'
      +'<div class="fld full"><label class="lbl">Also send to <span style="text-transform:none;letter-spacing:0;font-weight:600">(optional — emails, comma separated)</span></label><input id="ibExtra" placeholder="e.g. partner@yourfirm.com"></div>'
      +'<div class="fld full"><label class="lbl">Markets</label><input id="ibMarkets" placeholder="San Antonio, Austin, Dallas–Fort Worth, Houston, New Braunfels"></div>'
      +'<div class="fld"><label class="lbl">Events look-ahead</label><select id="ibLook"><option value="30">Next 30 days</option><option value="60">Next 60 days</option><option value="90">Next 90 days</option><option value="120">Next 120 days</option></select></div>'
      +'<div class="fld full"><label class="lbl">Extra focus <span style="text-transform:none;letter-spacing:0;font-weight:600">(optional)</span></label><input id="ibFocus" placeholder="e.g. Watch for Tex-Mex and pizza groups, and anything on the Pearl or Domain"></div></div>'
      +'<div class="note" id="ibTo" style="margin-top:8px"></div>'
      +'<div class="savebar"><button class="savebtn" id="ibSave">Save brief</button><button class="savebtn ghost" id="ibBuild" type="button">Build now</button><button class="savebtn ghost" id="ibPreview" type="button">Preview</button><button class="savebtn ghost" id="ibSendMe" type="button">Email me the latest</button><span class="msg" id="ibMsg"></span></div>'
      +'<div class="note">Built fresh each week with live web search, about $0.50 a run. Items the AI can\'t tie to a real source page are dropped. <b>Build now</b> runs a new search (about a minute); <b>Preview</b> and <b>Email me the latest</b> use the last one built.</div>'
    +'</div>'
    +'<div class="card">'
      +'<h2>Broker blast recap</h2><div class="ch-sub">After a broker blast finishes sending, Lavano emails the engagement owner a short recap: delivered, bounces, spam complaints, replies, sites brokers submitted (waiting for your review), brokers who have left their firms, and real (not security-filter) unsubscribes. Replies are pulled in from Gmail automatically every 30 minutes for 30 days after each blast.</div>'
      +'<div class="grid" style="margin-top:12px"><div class="fld"><label class="lbl">Send the recap this many hours after a blast finishes</label><input type="number" id="brHours" min="0" max="336" step="1" style="max-width:120px"></div></div>'
      +'<div class="grid" style="margin-top:12px"><div class="fld full"><label class="lbl">Send to <span style="text-transform:none;letter-spacing:0;font-weight:600">(emails, comma separated)</span></label><input id="brTo" placeholder="e.g. you@yourfirm.com, manager@yourfirm.com"></div></div>'
      +'<label class="check" style="margin-top:8px"><input type="checkbox" id="brOwner"> Also send to the rep who owns the engagement</label>'
      +'<div class="savebar"><button class="savebtn" id="brSave">Save</button><span class="msg" id="brMsg"></span></div>'
      +'<div class="note"><b>24</b> is the usual choice — most broker replies land within a day. Set <b>0</b> to turn the recap off.</div>'
    +'</div>'
    +'<div class="card">'
      +'<h2>Weekly seller activity report</h2><div class="ch-sub">Automatically email each seller a summary of the marketing on their listing — inquiries, NDAs, tours, offers and confidential data-room views. Keeps owners informed and listings renewing. Sends only for listings that are live on the marketplace and have a seller email on file; a rep can turn it off for any single listing.</div>'
      +'<label class="check" style="margin-top:6px"><input type="checkbox" id="srEnabled"> Send the seller activity report automatically</label>'
      +'<div class="grid" style="margin-top:12px"><div class="fld"><label class="lbl">How often</label><select id="srInterval"><option value="month1">Monthly — 1st business day</option><option value="7">Every 7 days</option><option value="14">Every 14 days</option><option value="30">Every 30 days</option></select></div></div>'
      +'<div class="savebar"><button class="savebtn" id="srSave">Save cadence</button><span class="msg" id="srMsg"></span></div>'
      +'<div class="note"><b>Monthly on the 1st business day</b> is the usual choice — one clean owner update a month, sent automatically on the first weekday. The interval options send every N days from when each listing starts. Either way, the report never reveals the business name, address, or buyer identities.</div>'
    +'</div>';
  PRESETS.forEach(function(p,i){});
  document.querySelectorAll('[data-p]').forEach(function(b){ b.addEventListener('click',function(){ var p=PRESETS[+b.getAttribute('data-p')]; document.getElementById('host').value=p.host; document.getElementById('port').value=p.port; document.getElementById('secure').checked=!!p.secure; if(p.user&&!val('user')) document.getElementById('user').value=p.user; detectHint(); }); });
  document.getElementById('host').addEventListener('input',detectHint);
  document.getElementById('save').addEventListener('click',save);
  document.getElementById('test').addEventListener('click',sendTest);
  detectHint();
  loadSellerReport(); loadDigest(); loadIB(); loadBlastRecap();
}
function _wdMsg(t,ok){ var m=document.getElementById('wdMsg'); m.style.color=ok?'#1f8a5b':(ok===false?'#C0261B':''); m.textContent=t; }
function _wdTo(j){ var t=document.getElementById('wdTo'); if(!t) return; var r=(j&&j.recipients)||[]; t.innerHTML=r.length?('Goes to: <b>'+r.map(esc).join(', ')+'</b>'):'<span style="color:#C0261B">No recipients — add at least one email above.</span>'; }
function loadDigest(){ fetch('/api/admin/weekly-digest',{credentials:'same-origin',cache:'no-store'}).then(function(r){return r.json();}).then(function(j){ if(!j||!j.ok) return;
  document.getElementById('wdEnabled').checked=!!j.enabled; document.getElementById('wdDay').value=String(j.day); document.getElementById('wdHour').value=String(j.hour); document.getElementById('wdExtra').value=(j.to!=null?j.to:(j.extra||'')); document.getElementById('wdTz').textContent='('+(j.tz||'')+')'; _wdTo(j);
  document.getElementById('wdSave').onclick=saveDigest;
  document.getElementById('wdPreview').onclick=function(){ window.open('/api/admin/weekly-digest/preview','_blank'); };
  document.getElementById('wdSendMe').onclick=function(){ var b=this; b.disabled=true; _wdMsg('Sending…'); fetch('/api/admin/weekly-digest/send-me',{method:'POST',credentials:'same-origin'}).then(function(r){return r.json();}).then(function(x){ b.disabled=false; if(x&&x.ok) _wdMsg('Sent to '+x.to+' ✓',true); else _wdMsg((x&&x.error)||'Could not send.',false); }).catch(function(){ b.disabled=false; _wdMsg('Could not reach the server.',false); }); };
}).catch(function(){}); }
function saveDigest(){ var b=document.getElementById('wdSave'); b.disabled=true; _wdMsg('Saving…');
  fetch('/api/admin/weekly-digest',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({ enabled:chk('wdEnabled'), day:val('wdDay'), hour:val('wdHour'), to:val('wdExtra') })}).then(function(r){return r.json();}).then(function(j){ b.disabled=false; if(j&&j.ok){ _wdMsg('Saved ✓',true); _wdTo(j); } else _wdMsg((j&&j.error)||'Could not save.',false); }).catch(function(){ b.disabled=false; _wdMsg('Could not reach the server.',false); }); }
function _ibMsg(t,ok){ var m=document.getElementById('ibMsg'); m.style.color=ok?'#1f8a5b':(ok===false?'#C0261B':''); m.textContent=t; }
function _ibState(j){ var t=document.getElementById('ibTo'); if(!t||!j) return; var r=j.recipients||[], bits=[];
  bits.push(r.length?('Goes to: <b>'+r.map(esc).join(', ')+'</b>'):'<span style="color:#C0261B">Nobody selected has an email on file — tick someone above or add an address.</span>');
  if(j.last) bits.push('Last built '+esc(new Date(j.last.at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))+' — '+j.last.news+' news, '+j.last.events+' events.');
  if(j.lastError) bits.push('<span style="color:#C0261B">Last automatic run failed: '+esc(j.lastError)+'</span>');
  if(!j.aiReady) bits.push('<span style="color:#C0261B">AI isn’t set up on the server (ANTHROPIC_API_KEY).</span>');
  if(!j.emailReady) bits.push('<span style="color:#C0261B">Email isn’t set up yet — fill in the SMTP settings above.</span>');
  t.innerHTML=bits.join('<br>'); }
function _ibUsers(j){ var box=document.getElementById('ibUsers'); var sel=j.users||[];
  box.innerHTML=(j.candidates||[]).map(function(c){ return '<label class="check" style="margin:0;font-weight:600'+(c.email?'':';opacity:.55')+'" title="'+esc(c.email||'No email on file')+'"><input type="checkbox" data-ibu="'+esc(c.username)+'"'+(sel.indexOf(c.username)>=0?' checked':'')+(c.email?'':' disabled')+'> '+esc(c.name)+' <span style="color:#8a93a8;font-weight:500">· '+esc(c.roleName||c.role)+(c.email?'':' · no email')+'</span></label>'; }).join('')||'<span class="note">No users yet.</span>'; }
function loadIB(){ fetch('/api/admin/industry-brief',{credentials:'same-origin',cache:'no-store'}).then(function(r){return r.json();}).then(function(j){ if(!j||!j.ok) return;
  document.getElementById('ibEnabled').checked=!!j.enabled; document.getElementById('ibDay').value=String(j.day); document.getElementById('ibHour').value=String(j.hour); document.getElementById('ibExtra').value=j.extra||''; document.getElementById('ibMarkets').value=j.markets||''; document.getElementById('ibFocus').value=j.focus||''; document.getElementById('ibLook').value=String(j.lookahead||90); document.getElementById('ibTz').textContent='('+(j.tz||'')+')';
  _ibUsers(j); _ibState(j);
  document.getElementById('ibSave').onclick=saveIB;
  document.getElementById('ibPreview').onclick=function(){ window.open('/api/admin/industry-brief/preview','_blank'); };
  document.getElementById('ibBuild').onclick=function(){ var b=this; b.disabled=true; var W=window.rrgAiWork; if(W) W.show('Researching this week’s industry news and events — about a minute…'); _ibMsg('Searching the web — about a minute…');
    fetch('/api/admin/industry-brief/build',{method:'POST',credentials:'same-origin'}).then(function(r){return r.json();}).then(function(x){ b.disabled=false; if(W) W.hide(); if(x&&x.ok){ _ibMsg('Built ✓ — '+x.news+' news, '+x.events+' events',true); loadIB(); window.open('/api/admin/industry-brief/preview','_blank'); } else _ibMsg((x&&x.error)||'Could not build.',false); }).catch(function(){ b.disabled=false; if(W) W.hide(); _ibMsg('Could not reach the server.',false); }); };
  document.getElementById('ibSendMe').onclick=function(){ var b=this; b.disabled=true; _ibMsg('Sending…'); fetch('/api/admin/industry-brief/send-me',{method:'POST',credentials:'same-origin'}).then(function(r){return r.json();}).then(function(x){ b.disabled=false; if(x&&x.ok) _ibMsg('Sent to '+x.to+' ✓',true); else _ibMsg((x&&x.error)||'Could not send.',false); }).catch(function(){ b.disabled=false; _ibMsg('Could not reach the server.',false); }); };
}).catch(function(){}); }
function saveIB(){ var b=document.getElementById('ibSave'); b.disabled=true; _ibMsg('Saving…'); var users=[].slice.call(document.querySelectorAll('[data-ibu]')).filter(function(x){return x.checked;}).map(function(x){return x.getAttribute('data-ibu');});
  fetch('/api/admin/industry-brief',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({ enabled:chk('ibEnabled'), day:val('ibDay'), hour:val('ibHour'), users:users, extra:val('ibExtra'), markets:val('ibMarkets'), focus:val('ibFocus'), lookahead:val('ibLook') })}).then(function(r){return r.json();}).then(function(j){ b.disabled=false; if(j&&j.ok){ _ibMsg('Saved ✓',true); _ibUsers(j); _ibState(j); } else _ibMsg((j&&j.error)||'Could not save.',false); }).catch(function(){ b.disabled=false; _ibMsg('Could not reach the server.',false); }); }
function loadBlastRecap(){
  fetch('/api/admin/blast-recap',{credentials:'same-origin',cache:'no-store'}).then(function(r){return r.json();}).then(function(j){ if(!j||!j.ok) return; var h=document.getElementById('brHours'); if(h) h.value=String(j.hours); var bt=document.getElementById('brTo'); if(bt) bt.value=j.to||''; var bo=document.getElementById('brOwner'); if(bo) bo.checked=(j.toOwner!==false); var b=document.getElementById('brSave'); if(b) b.onclick=saveBlastRecap; }).catch(function(){});
}
function saveBlastRecap(){
  var b=document.getElementById('brSave'), m=document.getElementById('brMsg'); b.disabled=true; var was=b.textContent; b.textContent='Saving…'; m.textContent='';
  fetch('/api/admin/blast-recap',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({ hours:Number(val('brHours')), to:val('brTo'), toOwner:!!(document.getElementById('brOwner')||{}).checked })})
    .then(function(r){return r.json();}).then(function(j){ b.disabled=false; b.textContent=was; if(j&&j.ok){ m.style.color='#1f8a5b'; m.textContent=(j.hours?('Saved ✓ — recap '+j.hours+' h after each blast'):'Saved ✓ — recap off'); } else { m.style.color='#C0261B'; m.textContent=(j&&j.error)||'Could not save.'; } })
    .catch(function(){ b.disabled=false; b.textContent=was; m.style.color='#C0261B'; m.textContent='Could not reach the server.'; });
}
function loadSellerReport(){
  fetch('/api/admin/seller-report',{credentials:'same-origin',cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
    if(!j||!j.ok) return;
    var e=document.getElementById('srEnabled'); if(e) e.checked=!!j.enabled;
    var s=document.getElementById('srInterval'); if(s) s.value=(j.cadence||String(j.intervalDays||14));
    var b=document.getElementById('srSave'); if(b) b.onclick=saveSellerReport;
  }).catch(function(){});
}
function saveSellerReport(){
  var b=document.getElementById('srSave'), m=document.getElementById('srMsg'); b.disabled=true; var was=b.textContent; b.textContent='Saving…'; m.textContent='';
  fetch('/api/admin/seller-report',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({ enabled:chk('srEnabled'), cadence:val('srInterval') })})
    .then(function(r){return r.json();}).then(function(j){ b.disabled=false; b.textContent=was;
      if(j&&j.ok){ m.style.color='#1f8a5b'; m.textContent='Saved ✓'; } else { m.style.color='#C0261B'; m.textContent=(j&&j.error)||'Could not save.'; } })
    .catch(function(){ b.disabled=false; b.textContent=was; m.style.color='#C0261B'; m.textContent='Could not reach the server.'; });
}
function save(){
  var b=document.getElementById('save'), m=document.getElementById('msg'); b.disabled=true; var was=b.textContent; b.textContent='Saving…'; m.textContent='';
  var body={ host:val('host'), port:Number(val('port'))||587, secure:chk('secure'), user:val('user'), from:val('from'), enabled:chk('enabled') };
  var p=val('pass'); if(p) body.pass=p; if(chk('clearpass')) body.clearPass=true;
  fetch('/api/admin/email',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)})
    .then(function(r){return r.json();}).then(function(j){ b.disabled=false; b.textContent=was;
      if(j&&j.ok){ m.style.color='#1f8a5b'; m.textContent='Saved ✓'; load(true); } else { m.style.color='#C0261B'; m.textContent=(j&&j.error)||'Could not save.'; } })
    .catch(function(){ b.disabled=false; b.textContent=was; m.style.color='#C0261B'; m.textContent='Could not reach the server.'; });
}
function sendTest(){
  var b=document.getElementById('test'), m=document.getElementById('testmsg'); var to=val('testto');
  if(!to){ m.style.color='#C0261B'; m.textContent='Enter an address first.'; return; }
  b.disabled=true; var was=b.textContent; b.textContent='Sending…'; m.textContent='';
  fetch('/api/admin/email/test',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({to:to})})
    .then(function(r){return r.json();}).then(function(j){ b.disabled=false; b.textContent=was;
      if(j&&j.ok){ m.style.color='#1f8a5b'; m.textContent='Sent ✓ — check that inbox.'; } else { m.style.color='#C0261B'; m.textContent=(j&&j.error)||'Send failed.'; } })
    .catch(function(){ b.disabled=false; b.textContent=was; m.style.color='#C0261B'; m.textContent='Could not reach the server.'; });
}
function load(quiet){
  fetch('/api/admin/email',{credentials:'same-origin',cache:'no-store'}).then(function(r){ if(r.status===401||r.status===403) throw new Error('admin'); return r.json(); }).then(function(j){
    if(!j||!j.ok){ document.getElementById('root').innerHTML='<div class="gate">Could not load email settings.</div>'; return; }
    CFG=j; if(!quiet) render(); else { var s=document.querySelector('.status .dot'); if(s) s.className='dot '+(j.configured?'on':'off'); }
  }).catch(function(e){ document.getElementById('root').innerHTML='<div class="gate">'+((e&&e.message==='admin')?'Email settings are limited to administrators.':'Could not reach the server.')+'</div>'; });
}
load();
</script>
