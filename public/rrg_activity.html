<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullServe — Activity &amp; Logs</title>
<style>
:root{--navy:#20334f;--navy2:#23496f;--primary:#2c5c8f;--primary-d:#23496f;--red:#b23a2c;--ink:#2b3648;--dim:#5f6a7d;--soft:#8a93a3;--faint:#96a1b2;--line:#dbe0e9;--wash:#f4f6f9;--green:#2f7a55;--inp:#c4ccda;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#fff;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:13px;}
.wrap{max-width:none;margin:0 auto;padding:24px 24px 70px;}
h1{font-size:16px;font-weight:700;color:var(--navy);margin:0;}
.sub{color:var(--dim);font-size:12.5px;margin-top:5px;max-width:720px;line-height:1.5;}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;margin-top:16px;overflow:hidden;}
.ch{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--wash);border-bottom:1px solid var(--line);}
.ch b{color:var(--navy);font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;} .ch span{color:var(--muted,#69748a);font-size:12px;} .ch .sp{margin-left:auto;}
.cb{padding:6px 0;}
.pad{padding:14px 16px;}
.note{color:var(--dim);font-size:12px;line-height:1.55;}
/* scrollable summary list */
/* record-count tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px 16px;}
.tile{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:#fff;text-decoration:none;color:inherit;display:block;transition:border-color .12s,background .12s;}
a.tile:hover{border-color:var(--primary);background:#fafcff;}
.tile.prim{background:var(--wash);}
.tile .num{font-size:24px;font-weight:800;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums;}
.tile .lab{font-size:11.5px;font-weight:700;color:var(--dim);margin-top:6px;text-transform:uppercase;letter-spacing:.03em;}
.scrolllist{max-height:300px;overflow-y:auto;}
.srow{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid #eef1f6;font-size:13px;}
.srow:last-child{border-bottom:none;}
.srow .nm{font-weight:600;color:var(--navy2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.srow .ct{font-variant-numeric:tabular-nums;color:var(--dim);font-weight:700;}
.bar{height:6px;border-radius:3px;background:#e7edf5;overflow:hidden;width:110px;flex:none;}
.bar>i{display:block;height:100%;background:var(--primary);}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#3a4560;}
.ts{font-size:12px;color:#3a4560;white-space:nowrap;}
.searchwrap{position:relative;display:flex;align-items:center;margin-left:auto;}
.searchwrap svg{position:absolute;left:11px;color:#9aa3b2;pointer-events:none;}
.searchwrap input{border:1px solid var(--inp);border-radius:4px;padding:7px 11px 7px 32px;font:inherit;font-size:12.5px;min-width:210px;background:#fff;}
.searchwrap input:focus{outline:none;border-color:var(--primary);}
/* people drill-down */
.urow{border-bottom:1px solid var(--line);}
.urow:last-child{border-bottom:none;}
.uhd{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;user-select:none;}
.uhd:hover{background:#fafbfd;}
.uav{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;background-size:cover;background-position:center;}
.uname{font-weight:700;color:var(--navy);font-size:13.5px;} .umeta{font-size:11.5px;color:var(--dim);margin-top:1px;}
.uspacer{flex:1;}
.ustat{text-align:right;font-size:11.5px;color:var(--dim);white-space:nowrap;} .ustat b{color:var(--navy2);font-size:13px;}
.chev{color:var(--faint);font-size:12px;transition:transform .15s;flex:none;} .urow.open .chev,.sess.open .chev{transform:rotate(90deg);}
.udetail{display:none;padding:4px 16px 14px 58px;background:#fbfcfe;border-top:1px solid var(--line);}
.urow.open .udetail{display:block;}
.uloading{color:var(--dim);font-size:12.5px;padding:10px 0;}
/* sessions */
.sess{border:1px solid var(--line);border-radius:5px;background:#fff;margin-top:9px;overflow:hidden;}
.sesshd{display:flex;align-items:center;gap:11px;padding:9px 12px;cursor:pointer;user-select:none;}
.sesshd:hover{background:#fafbfd;}
.sessdot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;}
.sesstitle{font-weight:700;color:var(--navy);font-size:12.5px;}
.sessmeta{font-size:11.5px;color:var(--dim);}
.sessright{margin-left:auto;font-size:11.5px;color:var(--dim);white-space:nowrap;text-align:right;}
.sessbody{display:none;border-top:1px solid #eef1f6;padding:4px 0;}
.sess.open .sessbody{display:block;}
.act{display:flex;align-items:center;gap:12px;padding:6px 14px;font-size:12.5px;border-bottom:1px solid #f3f5f9;}
.act:last-child{border-bottom:none;}
.act .at{width:150px;flex:none;color:#5b6472;} .act .al{flex:1;color:var(--navy2);font-weight:600;} .act .aip{color:#9aa3b2;font-size:11.5px;}
.act.login .al{color:var(--green);} .act.loginfail .al{color:var(--red);}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;} .tag.ok{background:#eaf5ef;color:#1f7a4d;border:1px solid #c7e6d6;} .tag.off{background:#fdeceb;color:var(--red);border:1px solid #f3cfc9;}
.empty{text-align:center;color:var(--dim);padding:22px;font-size:13px;}
.gate{max-width:520px;margin:70px auto;text-align:center;color:var(--dim);} .gate h2{color:var(--navy);}
.pkick{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:0 0 3px;}
</style>
<script src="/rrg_brand.js"></script>
</head>
<body>
<div class="wrap" id="root"><div class="empty">Loading…</div></div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function get(u){return fetch(u,{credentials:'same-origin',cache:'no-store'}).then(function(r){ if(r.status===403||r.status===401) throw 0; return r.json(); });}
function initials(n){ n=String(n||'').trim(); if(!n) return '?'; var p=n.split(/\s+/); return ((p[0]||'')[0]||'')+((p[1]||'')[0]||''); }
var SESSION_GAP=30*60*1000; // 30 min of inactivity ends a session
var DATA=null, LASTACTIVE={}, LOADED={}, COUNTS=null;

function countsCard(counts){
  if(!counts||!counts.length) return '';
  var tiles=counts.map(function(c){
    var inner='<div class="num">'+(c.count||0).toLocaleString()+'</div><div class="lab">'+esc(c.label)+'</div>';
    return c.href ? ('<a class="tile'+(c.primary?' prim':'')+'" href="./'+esc(c.href)+'">'+inner+'</a>') : ('<div class="tile'+(c.primary?' prim':'')+'">'+inner+'</div>');
  }).join('');
  return '<div class="card"><div class="ch"><b>Record counts</b><span class="sp">live totals across the main files</span></div><div class="tiles">'+tiles+'</div></div>';
}

function render(j){
  DATA=j;
  // last-active per user from the recent global usage stream
  LASTACTIVE={}; (j.usage||[]).forEach(function(u){ if(u.user && !LASTACTIVE[u.user]) LASTACTIVE[u.user]=u.when; });
  var maxTool=(j.byTool&&j.byTool[0]&&j.byTool[0].count)||1;
  var toolRows=(j.byTool||[]).length? (j.byTool||[]).map(function(t){ var pct=Math.max(4,Math.round((t.count/maxTool)*100)); return '<div class="srow"><span class="nm">'+esc(t.tool||'—')+'</span><span class="bar"><i style="width:'+pct+'%"></i></span><span class="ct">'+t.count+'</span></div>'; }).join('') : '<div class="empty">No tool activity yet.</div>';

  var users=(j.byUser||[]).filter(function(u){return u.user;});
  var userRows=users.length? users.map(function(u){
    var la=LASTACTIVE[u.user]?('Last active '+esc(LASTACTIVE[u.user])):'';
    return '<div class="urow" data-user="'+esc(u.user)+'">'
      +'<div class="uhd"><span class="uav" data-av="'+esc(u.user)+'">'+esc(initials(u.user).toUpperCase())+'</span>'
        +'<div><div class="uname">'+esc(u.user)+'</div><div class="umeta">'+la+'</div></div>'
        +'<span class="uspacer"></span>'
        +'<div class="ustat"><b>'+u.count+'</b> tool opens</div>'
        +'<span class="chev">▶</span></div>'
      +'<div class="udetail" data-det="'+esc(u.user)+'"><div class="uloading">Click to load sessions…</div></div>'
    +'</div>';
  }).join('') : '<div class="empty">No users have activity yet.</div>';

  document.getElementById('root').innerHTML=''
    +'<div class="pkick">Admin · Users &amp; Access</div><h1>Activity &amp; Logs</h1>'
    +'<div class="sub">Who is using what, and when. The tool list is scrollable; click a person to see their sessions, and a session to see exactly what they did.</div>'
    +'<div class="card"><div class="ch"><b>Tool usage — by tool</b><span class="sp">'+(j.byTool||[]).length+' tools · all time</span></div><div class="scrolllist">'+toolRows+'</div></div>'
    +'<div class="card"><div class="ch"><b>Users</b><div class="searchwrap"><svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5"></circle><line x1="12.8" y1="12.8" x2="17.5" y2="17.5"></line></svg><input id="usearch" placeholder="Find a user…" autocomplete="off"></div></div><div class="cb" id="people">'+userRows+'</div></div>';

  document.getElementById('people').addEventListener('click',function(e){
    var hd=e.target.closest('.uhd'); if(!hd) return;
    var row=hd.closest('.urow'); var user=row.getAttribute('data-user');
    var open=row.classList.toggle('open');
    if(open && !LOADED[user]) loadUser(user, row.querySelector('[data-det]'));
  });
  var us=document.getElementById('usearch');
  if(us) us.addEventListener('input',function(){ var q=this.value.trim().toLowerCase(); document.querySelectorAll('#people .urow').forEach(function(r){ var u=(r.getAttribute('data-user')||'').toLowerCase(); r.style.display=(!q||u.indexOf(q)>=0)?'':'none'; }); });
}

function loadUser(user, host){
  host.innerHTML='<div class="uloading">Loading sessions…</div>';
  get('/api/admin/user-activity?user='+encodeURIComponent(user)).then(function(j){
    if(!j||!j.ok){ host.innerHTML='<div class="uloading">Could not load.</div>'; return; }
    LOADED[user]=1;
    var sessions=buildSessions(j.usage,j.logins);
    if(!sessions.length){ host.innerHTML='<div class="uloading">No recorded activity for this person.</div>'; return; }
    host.innerHTML=sessions.map(sessionHtml).join('');
    host.querySelectorAll('.sesshd').forEach(function(h){ h.addEventListener('click',function(){ h.closest('.sess').classList.toggle('open'); }); });
  }).catch(function(){ host.innerHTML='<div class="uloading">Could not reach the server.</div>'; });
}

function buildSessions(usage,logins){
  var ev=[];
  (usage||[]).forEach(function(u){ ev.push({ts:u.ts,when:u.when,label:u.tool||'(tool)',kind:'tool',ip:u.ip||''}); });
  (logins||[]).forEach(function(l){ ev.push({ts:l.ts,when:l.when,label:(l.result==='success'?'Signed in':'Failed sign-in'),kind:(l.result==='success'?'login':'loginfail'),ip:l.ip||''}); });
  ev=ev.filter(function(e){return e.ts;});
  ev.sort(function(a,b){ return a.ts<b.ts?-1:(a.ts>b.ts?1:0); });
  var out=[], cur=null;
  ev.forEach(function(e){
    var t=Date.parse(e.ts)||0;
    if(!cur || (t-cur._last)>SESSION_GAP){ cur={startWhen:e.when,endWhen:e.when,ip:e.ip,acts:[],_start:t,_last:t}; out.push(cur); }
    cur.acts.push(e); cur._last=t; cur.endWhen=e.when; if(e.ip) cur.ip=e.ip;
  });
  out.forEach(function(s){ s.durMin=Math.max(0,Math.round((s._last-s._start)/60000)); });
  return out.reverse(); // newest session first
}
function durText(m){ if(m<1) return '<1 min'; if(m<60) return m+' min'; var h=Math.floor(m/60), r=m%60; return h+'h'+(r?(' '+r+'m'):''); }
function sessionHtml(s){
  var acts=s.acts.slice().reverse(); // newest action first inside a session
  var body=acts.map(function(a){ return '<div class="act'+(a.kind==='login'?' login':(a.kind==='loginfail'?' loginfail':''))+'"><span class="at">'+esc(a.when)+'</span><span class="al">'+esc(a.label)+'</span><span class="aip mono">'+esc(a.ip||'')+'</span></div>'; }).join('');
  var toolCount=s.acts.filter(function(a){return a.kind==='tool';}).length;
  return '<div class="sess"><div class="sesshd"><span class="sessdot"></span>'
    +'<div><div class="sesstitle">'+esc(s.startWhen)+'</div><div class="sessmeta">'+toolCount+' tool open'+(toolCount===1?'':'s')+(s.ip?(' · '+esc(s.ip)):'')+'</div></div>'
    +'<span class="sessright">'+durText(s.durMin)+'<br>'+s.acts.length+' event'+(s.acts.length===1?'':'s')+'</span>'
    +'<span class="chev" style="margin-left:10px">▶</span></div>'
    +'<div class="sessbody">'+body+'</div></div>';
}

get('/api/admin/activity').then(function(j){ if(!j||!j.ok) throw 0; render(j); })
  .catch(function(){ document.getElementById('root').innerHTML='<div class="gate"><h2>Admins only</h2>Ask an administrator to view activity &amp; logs.</div>'; });
</script>
</body>
</html>
