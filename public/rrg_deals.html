<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRG — Deals</title>
<script src="/rrg_brand.js"></script>
<style>.rl-filtbtn{display:none!important;}</style>
<script src="/rrg_list.js"></script>
<script src="/rrg_filters.js"></script>
<style>
:root{ --navy:#000E31; --red:#DA2B1F; --ink:#1a2236; --muted:#6b7488; --line:#e6e9f0; --wash:#f5f7fb; --bg:#eef1f6; --green:#1f8a5b; }
*{box-sizing:border-box;} html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);}
.top{background:radial-gradient(115% 130% at 50% 0%, #123a2a 0%, #0c2419 55%, #05120c 100%);color:#fff;padding:22px 0;}
.top-inner{max-width:1080px;margin:0 auto;padding:0 28px;}
.kick{color:#7fd6a6;font-weight:700;letter-spacing:.28em;font-size:11px;text-transform:uppercase;}
h1{font-size:26px;font-weight:800;margin:5px 0 0;}
.sub{color:#bfe0cd;font-size:13px;margin-top:6px;}
.wrap{max-width:1080px;margin:20px auto 60px;padding:0 28px;}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px;}
@media(max-width:760px){.tiles{grid-template-columns:repeat(3,1fr);}}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.04);transition:border-color .12s,box-shadow .12s;}
.tile:hover{border-color:#cfd6e2;}
.tile.on{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green);}
.tile b{display:block;font-size:20px;color:var(--navy);font-weight:800;line-height:1.1;}
.tile span{font-size:11.5px;color:var(--muted);font-weight:700;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(10,20,50,.06);overflow:hidden;}
.hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;}
.hd b{color:var(--navy);font-size:14px;}
.cb{padding:6px 8px 10px;}
.pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:3px 9px;border-radius:999px;}
.lk{color:var(--navy);text-decoration:none;font-weight:600;} .lk:hover{text-decoration:underline;}
.meta{color:var(--muted);font-size:12px;}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13.5px;}
.ndl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#8a93a8;font-weight:700;margin:12px 0 6px;}.ndi{width:100%;border:1px solid #cfd6e2;border-radius:9px;padding:9px 11px;font:inherit;font-size:14px;}.ndrow{display:flex;gap:12px;}.ndrow>div{flex:1;}.ndbtn{background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:9px;padding:10px 17px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;}.ndbtn.ghost{background:#fff;color:#6b7488;border-color:var(--line);}.newdealbtn{margin-left:auto;background:var(--red,#DA2B1F);color:#fff;border:none;border-radius:9px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<div class="top"><div class="top-inner">
  <div class="kick">Book of Business</div>
  <h1>Deals</h1>
  <div class="sub">Every buyer transaction across your listings — price, status, close, and commission due &amp; paid. Each becomes an invoice at closing.</div>
</div></div>
<div class="wrap">
  <div class="tiles" id="tiles"></div>
  <div class="card"><div class="hd"><b>Deals</b><span class="meta" id="cnt"></span><button id="filterBtn" class="rlf-btn">⚙ Filters</button><button id="newDealBtn" class="newdealbtn">+ New deal</button></div><div class="cb"><div id="list"><div class="empty">Loading…</div></div></div></div>
</div>
<div id="ndModal" style="position:fixed;inset:0;background:rgba(6,14,32,.55);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:28px 20px;overflow:auto">
  <div style="background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 24px 60px rgba(0,0,0,.35)">
    <div style="padding:18px 22px;font-size:16px;font-weight:800;color:var(--navy);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">New deal<button type="button" id="nd_x" style="background:none;border:none;font-size:24px;color:#8a94a6;cursor:pointer">×</button></div>
    <div style="padding:18px 22px">
      <label class="ndl">Listing (business under contract) *</label><select id="nd_key" class="ndi"></select>
      <div class="ndrow"><div><label class="ndl">Buyer</label><input id="nd_buyer" class="ndi" placeholder="Buyer name or group"></div><div><label class="ndl">Buyer email</label><input id="nd_bemail" class="ndi" placeholder="links the buyer to the deal"></div></div>
      <div class="ndrow"><div><label class="ndl">Price</label><input id="nd_price" class="ndi" placeholder="$ sale price"></div><div><label class="ndl">Status</label><select id="nd_status" class="ndi"></select></div></div>
      <div class="ndrow"><div><label class="ndl">Expected close</label><input type="date" id="nd_close" class="ndi"></div><div><label class="ndl">Commission rate</label><input id="nd_crate" class="ndi" placeholder="e.g. 10%"></div></div>
      <div class="ndrow"><div><label class="ndl">Commission due</label><input id="nd_cdue" class="ndi" placeholder="$"></div><div><label class="ndl">Commission status</label><select id="nd_cstatus" class="ndi"></select></div></div>
      <label class="ndl">Terms / notes</label><textarea id="nd_notes" class="ndi" rows="2" placeholder="Contingencies, financing, close timeline, earnest money…"></textarea>
      <div id="nd_msg" style="color:#DA2B1F;font-size:12.5px;margin-top:8px"></div>
    </div>
    <div style="display:flex;gap:9px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line)"><button type="button" id="nd_cancel" class="ndbtn ghost">Cancel</button><button type="button" id="nd_save" class="ndbtn">Create deal</button></div>
  </div>
</div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function fmtd(iso){ if(!iso) return ''; var x=String(iso).slice(0,10).split('-'); if(x.length!==3) return String(iso).slice(0,10); return x[1]+'/'+x[2]+'/'+x[0]; }
function stColor(s){ var m={'LOI':['#eef2fb','#2647b0'],'Under Contract':['#fff4e6','#b9761a'],'Due Diligence':['#f1ebfb','#6d28d9'],'Financing':['#e6f5f3','#0f766e'],'Closing':['#fff7e0','#9a7400'],'Closed':['#e7f5ee','#1f8a5b'],'Dead':['#fdeceb','#DA2B1F']}; return m[s]||['#eef1f6','#5b6472']; }
function commColor(s){ var m={'Unpaid':['#fdeceb','#DA2B1F'],'Invoiced':['#fff4e6','#b9761a'],'Partial':['#fff7e0','#9a7400'],'Paid':['#e7f5ee','#1f8a5b']}; return m[s]||['#eef1f6','#5b6472']; }
function pill(s,c){ if(!s) return '<span class="meta">—</span>'; return '<span class="pill" style="background:'+c[0]+';color:'+c[1]+'">'+esc(s)+'</span>'; }

var ALL=[], FILTER='', CTL=null, IS_ADMIN=false; var STATUSES=[], COMMSTATUSES=[], LISTINGS=[];
function dDistinct(key){ var m={}; (ALL||[]).forEach(function(d){ var v=d[key]; if(v) m[v]=1; }); return Object.keys(m).sort(); }
var CF=(window.RRGFilters&&document.getElementById('filterBtn'))?RRGFilters.create({ list:'deals', title:'deals', button:document.getElementById('filterBtn'), isAdmin:function(){return IS_ADMIN;}, fields:[
  { key:'status', label:'Status', type:'multi', options:function(){return STATUSES.length?STATUSES:dDistinct('status');}, get:function(d){return d.status||'';} },
  { key:'commissionStatus', label:'Commission', type:'multi', options:function(){return COMMSTATUSES.length?COMMSTATUSES:dDistinct('commissionStatus');}, get:function(d){return d.commissionStatus||'';} },
  { key:'close', label:'Close', type:'daterange', get:function(d){return d.closedDate||d.expectedClose||'';} }
], onChange:applyFilter }):null;
var DEFS=[
  ['', 'All deals', function(){return true;}],
  ['uc', 'Under contract', function(d){return d.status==='Under Contract';}],
  ['closing', 'Closing', function(d){return d.status==='Closing';}],
  ['closed', 'Closed', function(d){return d.status==='Closed';}],
  ['due', 'Commission due', function(d){return ['Unpaid','Invoiced','Partial'].indexOf(d.commissionStatus||'')>=0;}],
  ['paid', 'Paid', function(d){return d.commissionStatus==='Paid';}]
];
function filterFn(){ var f=DEFS.filter(function(x){return x[0]===FILTER;})[0]; return f?f[2]:function(){return true;}; }
function renderTiles(){
  document.getElementById('tiles').innerHTML=DEFS.map(function(x){ var c=ALL.filter(x[2]).length; return '<div class="tile'+(FILTER===x[0]?' on':'')+'" data-f="'+x[0]+'"><b>'+c+'</b><span>'+esc(x[1])+'</span></div>'; }).join('');
  document.querySelectorAll('#tiles .tile').forEach(function(t){ t.addEventListener('click',function(){ var f=t.getAttribute('data-f'); FILTER=(FILTER===f)?'':f; renderTiles(); applyFilter(); }); });
}
function cfg(data){ return { mount:'#list', data:data, key:'dealsboard',
  empty:'<div class="empty">No deals here. Open a listing and, under the <b>Deal</b> card, click <b>Open deal</b> when a buyer goes under contract.</div>',
  rowId:function(d){return d.key;}, defaultSort:5, defaultDir:-1,
  columns:[
    { label:'Listing', sort:function(a,b){return RRGList.cmp(a.business,b.business);}, cell:function(d){ return '<a class="lk" href="./rrg_assignment.html?key='+encodeURIComponent(d.key)+'">'+esc(d.business||'Listing')+'</a>'; } },
    { label:'Buyer', sort:function(a,b){return RRGList.cmp(a.buyer,b.buyer);}, cell:function(d){ if(!d.buyer) return '<span class="meta">—</span>'; var nm=d.personId?('<a class="lk" href="./rrg_person.html?id='+encodeURIComponent(d.personId)+'">'+esc(d.buyer)+'</a>'):esc(d.buyer); return nm+(d.buyerCompany?('<div class="meta">'+esc(d.buyerCompany)+'</div>'):''); } },
    { label:'Price', sort:function(a,b){return RRGList.cmp(a.price,b.price);}, cell:function(d){ return d.price?esc(d.price):'<span class="meta">—</span>'; } },
    { label:'Status', sort:function(a,b){return RRGList.cmp(a.status,b.status);}, cell:function(d){ return pill(d.status,stColor(d.status)); } },
    { label:'Close', sort:function(a,b){return RRGList.cmp(a.closedDate||a.expectedClose||'',b.closedDate||b.expectedClose||'');}, cell:function(d){ var dt=d.closedDate||d.expectedClose; return dt?('<span class="meta">'+(d.closedDate?'':'~ ')+esc(fmtd(dt))+'</span>'):'<span class="meta">—</span>'; } },
    { label:'Commission due', sort:function(a,b){return RRGList.cmp(a.commissionDue,b.commissionDue);}, cell:function(d){ return d.commissionDue?esc(d.commissionDue):'<span class="meta">—</span>'; } },
    { label:'Commission paid', defaultHidden:true, sort:function(a,b){return RRGList.cmp(a.commissionPaid,b.commissionPaid);}, cell:function(d){ return d.commissionPaid?esc(d.commissionPaid):'<span class="meta">—</span>'; } },
    { label:'Commission', sort:function(a,b){return RRGList.cmp(a.commissionStatus,b.commissionStatus);}, cell:function(d){ return pill(d.commissionStatus,commColor(d.commissionStatus)); } },
    { label:'Rate', defaultHidden:true, sortable:false, cell:function(d){ return d.commissionRate?esc(d.commissionRate):'<span class="meta">—</span>'; } }
  ]
}; }
function applyFilter(){ var base=(typeof CF!=='undefined'&&CF)?CF.filter(ALL):ALL; var data=base.filter(filterFn()); if(typeof CF!=='undefined'&&CF) CF.updateBtn(); var _x=data; document.getElementById('cnt').textContent=data.length?(data.length+' deal'+(data.length===1?'':'s')):''; if(CTL) CTL.refresh(data); else CTL=RRGList.create(cfg(data)); }
function reloadDeals(){ return fetch('/api/deals',{credentials:'same-origin',cache:'no-store'}).then(function(r){return r.json();}).then(function(j){ ALL=(j&&j.deals)||[]; if(j&&j.statuses) STATUSES=j.statuses; if(j&&j.commStatuses) COMMSTATUSES=j.commStatuses; IS_ADMIN=!!(j&&j.isAdmin); renderTiles(); applyFilter(); }).catch(function(){ document.getElementById('list').innerHTML='<div class="empty">Could not load deals.</div>'; }); }
function openNewDeal(){ var m=document.getElementById('ndModal'); m.style.display='flex'; document.getElementById('nd_msg').textContent=''; ['nd_buyer','nd_bemail','nd_price','nd_close','nd_crate','nd_cdue','nd_notes'].forEach(function(id){var e=document.getElementById(id); if(e)e.value='';});
  document.getElementById('nd_status').innerHTML=(STATUSES.length?STATUSES:['LOI','Under Contract','Due Diligence','Financing','Closing','Closed','Dead']).map(function(x){return '<option>'+esc(x)+'</option>';}).join('');
  document.getElementById('nd_cstatus').innerHTML='<option value="">—</option>'+(COMMSTATUSES.length?COMMSTATUSES:['Unpaid','Invoiced','Partial','Paid']).map(function(x){return '<option>'+esc(x)+'</option>';}).join('');
  var have={}; ALL.forEach(function(d){have[d.key]=1;});
  var sel=document.getElementById('nd_key'); sel.innerHTML='<option value="">Loading listings…</option>';
  fetch('/api/assignments',{credentials:'same-origin',cache:'no-store'}).then(function(r){return r.json();}).then(function(j){ LISTINGS=((j&&j.assignments)||[]).filter(function(a){return !have[a.key];}); if(!LISTINGS.length){ sel.innerHTML='<option value="">— no listings without a deal yet (create a listing first) —</option>'; } else { sel.innerHTML=LISTINGS.map(function(a){return '<option value="'+esc(a.key)+'">'+esc(a.business||a.key)+(a.market?(' — '+esc(a.market)):'')+'</option>';}).join(''); } }).catch(function(){ sel.innerHTML='<option value="">— could not load listings —</option>'; }); }
function closeNewDeal(){ document.getElementById('ndModal').style.display='none'; }
function createDeal(){ var key=document.getElementById('nd_key').value; var msg=document.getElementById('nd_msg'); if(!key){ msg.textContent='Pick the listing this buyer is under contract on.'; return; } var body={ buyer:document.getElementById('nd_buyer').value.trim(), buyerEmail:document.getElementById('nd_bemail').value.trim(), price:document.getElementById('nd_price').value.trim(), status:document.getElementById('nd_status').value, expectedClose:document.getElementById('nd_close').value, commissionRate:document.getElementById('nd_crate').value.trim(), commissionDue:document.getElementById('nd_cdue').value.trim(), commissionStatus:document.getElementById('nd_cstatus').value, terms:document.getElementById('nd_notes').value.trim() }; var b=document.getElementById('nd_save'); b.disabled=true; b.textContent='Creating…'; fetch('/api/assignment/'+encodeURIComponent(key)+'/deal',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(j){ b.disabled=false; b.textContent='Create deal'; if(j&&j.ok){ closeNewDeal(); reloadDeals(); } else msg.textContent=(j&&j.error)||'Could not create the deal.'; }).catch(function(){ b.disabled=false; b.textContent='Create deal'; msg.textContent='Could not reach the server.'; }); }
document.getElementById('newDealBtn').addEventListener('click',openNewDeal);
document.getElementById('nd_cancel').addEventListener('click',closeNewDeal);
document.getElementById('nd_x').addEventListener('click',closeNewDeal);
document.getElementById('ndModal').addEventListener('click',function(e){ if(e.target===document.getElementById('ndModal')) closeNewDeal(); });
reloadDeals();
</script>
</body>
</html>
