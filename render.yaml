services:
  - type: web
    name: rrg-ssc-mailer
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    disk:
      name: rrg-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: CC_ALWAYS
        value: van@rrgcre.com
      - key: MAIL_FROM
        value: van@rrgcre.com
      - key: ALLOW_ORIGIN
        value: "*"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: van@rrgcre.com
      - key: SMTP_PASS
        sync: false
      - key: APP_USER
        value: rrg
      - key: APP_PASS
        sync: false
