# Render Blueprint — lets Render auto-configure this service.
# In Render: New + > Blueprint > connect the repo that contains this folder.
# Render reads this file, builds the Docker image, and asks you for the secret
# values marked "sync: false" (your SMTP password and the app login password).
services:
  - type: web
    name: rrg-ssc-mailer
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # ~$7/mo, always-on. Use "free" to trial (sleeps when idle).
    healthCheckPath: /health
    # Persistent disk so the submission log survives restarts and deploys.
    # (Without a disk, Render's filesystem is wiped on every deploy.)
    disk:
      name: rrg-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: CC_ALWAYS
        value: van@rrgcre.com
      - key: MAIL_FROM
        value: van@rrgcre.com
      - key: ALLOW_ORIGIN
        value: "*"
      - key: SMTP_HOST
        value: smtp.gmail.com     # Google Workspace; change if you use another provider
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: van@rrgcre.com
      - key: SMTP_PASS
        sync: false               # Render will prompt you (your 16-char app password)
      # ---- Multi-user login ----
      - key: ADMIN_USER
        value: van                # your admin username for the login + admin console
      - key: ADMIN_PASS
        sync: false               # Render will prompt you — the FIRST admin password (change it later in the admin console)
      - key: SESSION_SECRET
        generateValue: true       # Render generates a strong secret to sign login sessions
      # ---- AI BOV generation ----
      - key: ANTHROPIC_API_KEY
        sync: false               # Render will prompt you — your Claude API key (console.anthropic.com)
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5  # the Claude model used to draft BOVs (set to the current Sonnet id)
      # ---- Durable data layer: managed Postgres (source of truth, auto-backups) ----
      # When DATABASE_URL is present the app runs on Postgres: records are read from an
      # in-memory cache and every write streams through to Postgres AND is mirrored to
      # the /var/data disk as a warm fallback. On first boot the app imports whatever is
      # already on /var/data into Postgres (one-time migration), so nothing is lost.
      - key: DATABASE_URL
        fromDatabase:
          name: rrg-postgres
          property: connectionString
      # PGSSL defaults to on (Render Postgres requires SSL). Do NOT set PGSSL=disable in prod.

databases:
  - name: rrg-postgres
    databaseName: rrg
    user: rrg
    plan: basic-256mb        # ~$6/mo, includes daily backups + point-in-time recovery.
                             # "free" exists for a trial but expires and has limited backups —
                             # use a paid plan for the real book of business.
